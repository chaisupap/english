ขจนตัวลอยราวกับอยู่บนจุดสูงสุดของโลก", "ex2_en": "Winning the prestigious industry innovation award put the young startup founders on <span class=\"hl-teal\">top of the world</span>.", "ex2_hl": "top of the world", "ex2_th": "การคว้ารางวัลนวัตกรรมยอดเยี่ยมแห่งปีทำเอาเหล่าผู้ก่อตั้งสตาร์ทอัปรุ่นใหม่รู้สึกปลาบปลื้มยินดีและภาคภูมิใจเป็นอย่างยิ่ง", "slot_num": 285, "sheet_no": 3, "first_letter": "T"}, {"id": 747, "orig_slot": "Doc #291", "idiom": "Vise grip", "meaning": "a very tight control", "thai_idiom": "กำแน่น / คุมเข้มเบ็ดเสร็จ / ยึดกุมอย่างเหนียวแน่น", "thai_meaning": "การจับ ยึด หรือควบคุมบางสิ่งอย่างแน่นหนาเด็ดขาดจนดิ้นไม่หลุด", "ex1_en": "The frightened toddler held onto his mother’s hand with <span class=\"hl-teal\">a vise grip</span> as they walked through the bustling amusement park.", "ex1_hl": "a vise grip", "ex1_th": "เด็กน้อยที่กำลังตื่นกลัวจับมือแม่ไว้แน่นราวกับคีมล็อก ขณะเดินผ่านสวนสนุกที่คลาคล่ำไปด้วยผู้คน", "ex2_en": "The state-owned conglomerate maintained <span class=\"hl-teal\">a vise grip</span> on the country's telecommunications infrastructure, effectively stifling competition.", "ex2_hl": "a vise grip", "ex2_th": "กลุ่มบริษัทรัฐวิสาหกิจยังคงควบคุมโครงสร้างพื้นฐานด้านโทรคมนาคมของประเทศไว้อย่างเบ็ดเสร็จ ซึ่งส่งผลให้การแข่งขันในตลาดถูกจำกัดลงอย่างมาก", "slot_num": 291, "sheet_no": 3, "first_letter": "V"}, {"id": 748, "orig_slot": "Doc #292", "idiom": "Walk on eggshells", "meaning": "be very careful", "thai_idiom": "เกรงใจจนตัวเกร็ง / ระมัดระวังจนอึดอัด / เดินบนเปลือกไข่", "thai_meaning": "ระมัดระวังคำพูดหรือการกระทำอย่างยิ่งยวดเพื่อไม่ให้ใครไม่พอใจหรืออารมณ์เสีย", "ex1_en": "Whenever Uncle Dave is in a bad mood, everyone at home feels like they have to <span class=\"hl-teal\">walk on eggshells</span>.", "ex1_hl": "walk on eggshells", "ex1_th": "เวลาที่คุณลุงเดฟอารมณ์ไม่ดี ทุกคนในบ้านจะรู้สึกเหมือนต้องระมัดระวังคำพูดคำจาจนเกร็งไปหมดเพื่อไม่ให้เขาหงุดหงิด", "ex2_en": "The junior analysts were constantly <span class=\"hl-teal\">walking on eggshells</span> around the volatile managing director, hesitant to share candid feedback.", "ex2_hl": "walking on eggshells", "ex2_th": "เหล่านักวิเคราะห์รุ่นน้องต้องคอยระมัดระวังตัวแจเมื่ออยู่ต่อหน้ากรรมการผู้จัดการที่อารมณ์แปรปรวน จนไม่กล้าแสดงความคิดเห็นอย่างตรงไปตรงมา", "slot_num": 292, "sheet_no": 3, "first_letter": "W"}, {"id": 749, "orig_slot": "Doc #294", "idiom": "Wild goose chase", "meaning": "a pointless effort", "thai_idiom": "การควานหาลมๆ แล้งๆ / ไล่ตามสิ่งที่ไม่มีจริง / เสียเที่ยวเปล่า", "thai_meaning": "การค้นหาหรือพยายามทำบางสิ่งที่ไร้ประโยชน์และเสียเวลาเปล่าโดยสิ้นเชิง", "ex1_en": "We drove around the outskirts for two hours looking for that vintage record shop, only to realize it was a <span class=\"hl-teal\">wild goose chase</span> because it had closed years ago.", "ex1_hl": "wild goose chase", "ex1_th": "พวกเราขับรถวนหาแถบชานเมืองอยู่สองชั่วโมงเพื่อหาร้านขายแผ่นเสียงเก่าร้านนั้น แล้วก็พบว่าเสียเที่ยวเปล่าเพราะมันปิดกิจการไปหลายปีแล้ว", "ex2_en": "Auditors realized that tracing the offshore transactions through layered shell companies was turning into an expensive <span class=\"hl-teal\">wild goose chase</span>.", "ex2_hl": "wild goose chase", "ex2_th": "คณะผู้ตรวจสอบบัญชีตระหนักว่าการแกะรอยธุรกรรมข้ามชาติผ่านบริษัทบังหน้าหลายชั้นกำลังกลายเป็นการไล่ตามเบาะแสที่คว้าน้ำเหลวและสิ้นเปลืองค่าใช้จ่ายสูง", "slot_num": 294, "sheet_no": 3, "first_letter": "W"}, {"id": 750, "orig_slot": "Doc #295", "idiom": "With open arms", "meaning": "welcome someone warmly", "thai_idiom": "อ้าแขนรับ / ต้อนรับอย่างอบอุ่น", "thai_meaning": "การต้อนรับอย่างยินดียิ่งและเปี่ยมด้วยไมตรีจิต", "ex1_en": "When Leo returned to his hometown after backpack traveling for six months, his neighbors greeted him <span class=\"hl-teal\">with open arms</span>.", "ex1_hl": "with open arms", "ex1_th": "เมื่อลีโอกลับมายังบ้านเกิดหลังจากแบกเป้ท่องเที่ยวไปนานหกเดือน เพื่อนบ้านต่างก็อ้าแขนต้อนรับเขาอย่างอบอุ่น", "ex2_en": "The local chamber of commerce welcomed the foreign clean-energy investors <span class=\"hl-teal\">with open arms</span>, promising expedited licensing procedures.", "ex2_hl": "with open arms", "ex2_th": "หอการค้าท้องถิ่นอ้าแขนต้อนรับกลุ่มนักลงทุนพลังงานสะอาดจากต่างชาติอย่างอบอุ่น พร้อมให้คำมั่นว่าจะช่วยเร่งรัดขั้นตอนการออกใบอนุญาตให้รวดเร็วยิ่งขึ้น", "slot_num": 295, "sheet_no": 3, "first_letter": "W"}, {"id": 751, "orig_slot": "Doc #297", "idiom": "Wrap your head around", "meaning": "understand something", "thai_idiom": "ทำความเข้าใจ / คิดตามให้ทัน / ทำใจเชื่อ", "thai_meaning": "ทำความเข้าใจแนวคิด ข้อมูล หรือเรื่องราวที่ซับซ้อนหรือยากที่จะยอมรับ", "ex1_en": "I'm still struggling to <span class=\"hl-teal\">wrap my head around</span> the ending of that mind-bending sci-fi movie.", "ex1_hl": "wrap my head around", "ex1_th": "ฉันยังพยายามทำความเข้าใจตอนจบของหนังไซไฟที่หักมุมเรื่องนั้นอยู่เลย มันชวนให้มึนตึ้บจริงๆ", "ex2_en": "Senior executives spent the entire briefing trying to <span class=\"hl-teal\">wrap their heads around</span> the mathematical model behind the new algorithmic trading strategy.", "ex2_hl": "wrap their heads around", "ex2_th": "ผู้บริหารระดับสูงใช้เวลาตลอดการประชุมสรุปเพื่อพยายามทำความเข้าใจแบบจำลองทางคณิตศาสตร์ที่อยู่เบื้องหลังกลยุทธ์การเทรดด้วยอัลกอริทึมตัวใหม่", "slot_num": 297, "sheet_no": 3, "first_letter": "W"}, {"id": 752, "orig_slot": "Doc #331", "idiom": "Under your nose", "meaning": "right in front of you", "thai_idiom": "อยู่ใต้จมูก / อยู่ตรงหน้าแท้ๆ / เส้นผมบังภูเขา", "thai_meaning": "อยู่ตรงหน้าหรือเกิดขึ้นต่อหน้าต่อตาอย่างชัดเจน แต่มองข้ามหรือไม่ทันสังเกตเห็น", "ex1_en": "I searched the whole living room for my car keys, only to find them right <span class=\"hl-teal\">under my nose</span> on the coffee table.", "ex1_hl": "under my nose", "ex1_th": "ฉันเดินหากุญแจรถทั่วห้องนั่งเล่น แต่กลับพบว่ามันวางอยู่ตรงหน้าแท้ๆ บนโต๊ะกลางกาแฟ", "ex2_en": "The compliance officers were embarrassed that a major accounting fraud had been orchestrated right <span class=\"hl-teal\">under their noses</span> for nearly three years.", "ex2_hl": "under their noses", "ex2_th": "เจ้าหน้าที่กำกับการปฏิบัติตามกฎเกณฑ์รู้สึกเสียหน้าอย่างมาก ที่การทุจริตทางบัญชีครั้งใหญ่เกิดขึ้นตรงหน้าต่อตาพวกเขามาเกือบสามปีโดยไม่มีใครสังเกตเห็น", "slot_num": 331, "sheet_no": 4, "first_letter": "U"}, {"id": 753, "orig_slot": "Doc #337", "idiom": "Have a field day", "meaning": "enjoy a lot", "thai_idiom": "สนุกสนานเต็มที่ / สนุกล้นมือ / ได้ทีขี่แพะไล่", "thai_meaning": "มีโอกาสทำสิ่งที่ตนชอบอย่างสนุกสนานเต็มที่ หรือฉวยโอกาสตักตวงความเพลิดเพลินจากสถานการณ์นั้น", "ex1_en": "The kids <span class=\"hl-teal\">had a field day</span> splashing around the community water park during their summer break.", "ex1_hl": "had a field day", "ex1_th": "เด็กๆ สนุกสนานกันเต็มคราบกับการเล่นน้ำในสวนน้ำของชุมชนช่วงปิดเทอมฤดูร้อน", "ex2_en": "Financial journalists <span class=\"hl-teal\">had a field day</span> dissecting the contradictory earnings statements released by the struggling tech giant.", "ex2_hl": "had a field day", "ex2_th": "เหล่านักข่าวสายการเงินได้ทีชำแหละกันอย่างเมามัน เมื่อบริษัทยักษ์ใหญ่ด้านเทคโนโลยีที่กำลังระส่ำระสายเปิดเผยรายงานผลประกอบการที่ขัดแย้งกันเอง", "slot_num": 337, "sheet_no": 4, "first_letter": "H"}, {"id": 754, "orig_slot": "Doc #342", "idiom": "Keep a low profile", "meaning": "stay unnoticed", "thai_idiom": "ทำตัวเงียบๆ / เก็บเนื้อเก็บตัว / ไม่ทำตัวเด่น", "thai_meaning": "ทำตัวไม่ให้เป็นที่สนใจ ไม่ดึงดูดสายตาคน หรือหลีกเลี่ยงการเป็นจุดสนใจของสาธารณะ", "ex1_en": "After the awkward misunderstanding at the family barbecue, Kevin decided to <span class=\"hl-teal\">keep a low profile</span> for the rest of the evening.", "ex1_hl": "keep a low profile", "ex1_th": "หลังจากความเข้าใจผิดอันน่ากระอักกระอ่วนในงานบาร์บีคิวของครอบครัว เควินก็ตัดสินใจทำตัวเงียบๆ ไม่ให้ใครสังเกตตลอดช่วงเวลาที่เหลือของค่ำคืนนั้น", "ex2_en": "Following the public controversy, the CEO was advised by his crisis management team to <span class=\"hl-teal\">keep a low profile</span> until the public outrage subsided.", "ex2_hl": "keep a low profile", "ex2_th": "หลังจากเกิดประเด็นขัดแย้งในสังคม ทีมบริหารจัดการวิกฤตได้แนะนำให้ซีอีโอเก็บเนื้อเก็บตัวและหลีกเลี่ยงการออกสื่อ จนกว่ากระแสวิพากษ์วิจารณ์จะซาลง", "slot_num": 342, "sheet_no": 4, "first_letter": "K"}, {"id": 755, "orig_slot": "Doc #346", "idiom": "Bring to book", "meaning": "punish someone", "thai_idiom": "นำตัวมารับโทษ / ดำเนินคดีตามกฎหมาย / เอาผิด", "thai_meaning": "นำตัวผู้กระทำความผิดมารับโทษหรือลงทัณฑ์ตามกระบวนการยุติธรรม", "ex1_en": "The school principal vowed that the students who vandalized the science lab would be caught and <span class=\"hl-teal\">brought to book</span>.", "ex1_hl": "brought to book", "ex1_th": "ครูใหญ่ของโรงเรียนให้คำมั่นว่านักเรียนที่ทำลายข้าวของในห้องทดลองวิทยาศาสตร์จะต้องถูกจับได้และนำตัวมาลงโทษอย่างแน่นอน", "ex2_en": "Special prosecutors are working tirelessly with international agencies to ensure the cybercriminals are finally <span class=\"hl-teal\">brought to book</span>.", "ex2_hl": "brought to book", "ex2_th": "อัยการแผนกคดีพิเศษกำลังประสานงานกับหน่วยงานระหว่างประเทศอย่างไม่ลดละ เพื่อให้แน่ใจว่าอาชญากรไซเบอร์กลุ่มนี้จะถูกนำตัวมาดำเนินคดีและรับโทษตามกฎหมายในที่สุด", "slot_num": 346, "sheet_no": 4, "first_letter": "B"}, {"id": 756, "orig_slot": "Doc #349", "idiom": "Break down emotionally", "meaning": "lose control of feelings", "thai_idiom": "กลั้นน้ำตาไม่อยู่ / จิตใจพังทลาย / ควบคุมอารมณ์ไม่อยู่", "thai_meaning": "สูญเสียการควบคุมอารมณ์ ระบายความรู้สึกเศร้าหรือเครียดออกมาอย่างท่วมท้นจนคุมตัวเองไม่ได้", "ex1_en": "Exhausted from weeks of nursing her sick cat, Clara finally <span class=\"hl-teal\">broke down emotionally</span> when her best friend gave her a comforting hug.", "ex1_hl": "broke down emotionally", "ex1_th": "ด้วยความเหนื่อยล้าจากการเฝ้าดูแลแมวที่ป่วยมาหลายสัปดาห์ ในที่สุดคลาราก็กลั้นน้ำตาไม่อยู่และปล่อยโฮออกมา เมื่อเพื่อนสนิทเข้ามากอดปลอบใจเธอ", "ex2_en": "During the grueling cross-examination, the key witness <span class=\"hl-teal\">broke down emotionally</span> and admitted that she had withheld vital evidence.", "ex2_hl": "broke down emotionally", "ex2_th": "ในระหว่างการซักค้านอันตึงเครียดและกดดัน พยานปากสำคัญก็ไม่อาจสะกดอารมณ์ไว้ได้จนร้องไห้โฮออกมา และยอมรับสารภาพว่าเธอได้ปกปิดหลักฐานสำคัญเอาไว้", "slot_num": 349, "sheet_no": 4, "first_letter": "B"}, {"id": 757, "orig_slot": "Doc #356", "idiom": "Keep your word", "meaning": "be trustworthy", "thai_idiom": "รักษาคำพูด / รักษาสัจจะ / คำไหนคำนั้น", "thai_meaning": "ทำตามสัญญาหรือคำมั่นที่เคยให้ไว้ ไม่ตระบัดสัตย์", "ex1_en": "You promised you would help me paint the garage this weekend, and I know you always <span class=\"hl-teal\">keep your word</span>.", "ex1_hl": "keep your word", "ex1_th": "คุณสัญญาไว้ว่าจะมาช่วยฉันทาสีโรงรถสุดสัปดาห์นี้ และฉันก็รู้ว่าคุณเป็นคนรักษาคำพูดเสมอ", "ex2_en": "In international business negotiations, a corporation that consistently <span class=\"hl-teal\">keeps its word</span> builds invaluable goodwill with long-term partners.", "ex2_hl": "keeps its word", "ex2_th": "ในการเจรจาธุรกิจระดับสากล องค์กรที่รักษาคำมั่นสัญญาอย่างสม่ำเสมอจะสามารถสร้างความเชื่อมั่นอันล้ำค่ากับคู่ค้าระยะยาวได้เป็นอย่างดี", "slot_num": 356, "sheet_no": 4, "first_letter": "K"}, {"id": 758, "orig_slot": "Doc #394", "idiom": "Fit as a fiddle", "meaning": "in good health", "thai_idiom": "สุขภาพแข็งแรงสมบูรณ์ / ฟิตปึ๋งปั๋งกระฉับกระเฉง", "thai_meaning": "มีสุขภาพร่างกายสมบูรณ์แข็งแรง กระฉับกระเฉง ไร้โรคภัยไข้เจ็บ", "ex1_en": "Despite being in his late eighties, Grandpa goes for a brisk morning walk every day and is as <span class=\"hl-teal\">fit as a fiddle</span>.", "ex1_hl": "fit as a fiddle", "ex1_th": "แม้จะอายุเกือบเก้าสิบปีแล้ว แต่คุณตาก็ยังออกไปเดินเร็วทุกเช้า และมีสุขภาพร่างกายแข็งแรงฟิตปึ๋งปั๋งมาก", "ex2_en": "The orthopedic surgeon confirmed that the striker had fully recovered from his meniscus tear and was <span class=\"hl-teal\">fit as a fiddle</span> for the championship match.", "ex2_hl": "fit as a fiddle", "ex2_th": "ศัลยแพทย์กระดูกยืนยันว่ากองหน้าของทีมฟื้นตัวจากอาการหมอนรองกระดูกเข่าฉีกขาดอย่างสมบูรณ์ และมีสภาพร่างกายพร้อมลงแข่งนัดชิงชนะเลิศอย่างเต็มที่", "slot_num": 394, "sheet_no": 4, "first_letter": "F"}, {"id": 759, "orig_slot": "Doc #421", "idiom": "Keep your eye on the ball", "meaning": "stay focused", "thai_idiom": "จดจ่อกับเป้าหมาย / ไม่ละสายตาจากเป้าหมาย / มีสมาธิแน่วแน่", "thai_meaning": "รักษาสมาธิและมุ่งเน้นไปที่เป้าหมายหลักโดยไม่วอกแวกหรือไขว้เขว", "ex1_en": "With final exams just two weeks away, you need to turn off social media notifications and <span class=\"hl-teal\">keep your eye on the ball</span>.", "ex1_hl": "keep your eye on the ball", "ex1_th": "เหลือเวลาอีกแค่สองสัปดาห์ก็จะสอบปลายภาคแล้ว เธอต้องปิดการแจ้งเตือนโซเชียลมีเดียแล้วมีสมาธิจดจ่อกับการอ่านหนังสือได้แล้ว", "ex2_en": "Despite recent market volatility, the portfolio manager reminded the team to <span class=\"hl-teal\">keep their eye on the ball</span> and prioritize long-term asset yields.", "ex2_hl": "keep their eye on the ball", "ex2_th": "แม้ตลาดจะมีความผันผวนเมื่อเร็วๆ นี้ แต่ผู้จัดการพอร์ตการลงทุนได้เตือนทีมงานให้มุ่งเน้นที่เป้าหมายหลักและให้ความสำคัญกับผลตอบแทนระยะยาวของสินทรัพย์", "slot_num": 421, "sheet_no": 5, "first_letter": "K"}, {"id": 760, "orig_slot": "Doc #431", "idiom": "Paint the town red", "meaning": "celebrate with lots of fun", "thai_idiom": "เที่ยวฉลองให้สุดเหวี่ยง / เที่ยวราตรีแบบจัดเต็ม", "thai_meaning": "ออกไปเที่ยวกลางคืน ดื่มกิน และเฉลิมฉลองกันอย่างสนุกสนานเฮฮาสุดเหวี่ยง", "ex1_en": "To celebrate finishing our university degrees, my roommates and I went downtown to <span class=\"hl-teal\">paint the town red</span>.", "ex1_hl": "paint the town red", "ex1_th": "เพื่อฉลองที่เรียนจบปริญญา ฉันกับรูมเมตจึงพากันออกไปเที่ยวกลางคืนในเมืองกันแบบสุดเหวี่ยง", "ex2_en": "After closing the multi-million-dollar acquisition deal, the investment banking division rented a rooftop lounge to <span class=\"hl-teal\">paint the town red</span>.", "ex2_hl": "paint the town red", "ex2_th": "หลังจากปิดดีลการควบรวมกิจการมูลค่าหลายล้านดอลลาร์ได้สำเร็จ แผนกวาณิชธนกิจก็ปิดเลานจ์บนชั้นดาดฟ้าเพื่อจัดปาร์ตี้ฉลองกันอย่างหรูหราสุดเหวี่ยง", "slot_num": 431, "sheet_no": 5, "first_letter": "P"}, {"id": 761, "orig_slot": "Doc #442", "idiom": "Snake in the grass", "meaning": "a hidden enemy", "thai_idiom": "หอกข้างแคร่ / หนอนบ่อนไส้ / ศัตรูในคราบมิตร", "thai_meaning": "คนที่แสร้งทำเป็นมิตรแต่แอบมุ่งร้าย ทรยศ หรือหักหลังอย่างลับๆ", "ex1_en": "I thought Greg was a loyal friend, but he turned out to be a <span class=\"hl-teal\">snake in the grass</span> who was spreading vicious rumors behind my back.", "ex1_hl": "snake in the grass", "ex1_th": "ฉันเคยคิดว่าเกร็กเป็นเพื่อนที่จริงใจ แต่เขากลับเป็นพวกหน้าซื่อใจคดที่แอบปล่อยข่าวลือร้ายกาจใส่ร้ายฉันลับหลัง", "ex2_en": "The corporate espionage investigation revealed that the regional vice president was a <span class=\"hl-teal\">snake in the grass</span> feeding trade secrets to overseas competitors.", "ex2_hl": "snake in the grass", "ex2_th": "การสืบสวนคดีจารกรรมข้อมูลขององค์กรเผยว่า รองประธานฝ่ายภูมิภาคเป็นหนอนบ่อนไส้ที่คอยส่งมอบความลับทางการค้าให้แก่คู่แข่งในต่างประเทศ", "slot_num": 442, "sheet_no": 5, "first_letter": "S"}, {"id": 762, "orig_slot": "Doc #445", "idiom": "Teach someone’s grandmother to suck eggs", "meaning": "explain something obvious", "thai_idiom": "สอนจระเข้ให้ว่ายน้ำ / สอนหนังสือสังฆราช", "thai_meaning": "สั่งสอนหรืออธิบายเรื่องที่คนผู้นั้นมีความรู้ความเชี่ยวชาญหรือประสบการณ์มากกว่าอยู่แล้ว", "ex1_en": "Telling my mom how to brew traditional herbal tea is like <span class=\"hl-teal\">teaching grandmother to suck eggs</span>; she's been doing it for forty years.", "ex1_hl": "teaching grandmother to suck eggs", "ex1_th": "การไปบอกวิธีชงชาสมุนไพรแบบดั้งเดิมให้แม่ฟังก็เหมือนสอนจระเข้ให้ว่ายน้ำ เพราะท่านทำมานานกว่าสี่สิบปีแล้ว", "ex2_en": "The junior trainee realized he was <span class=\"hl-teal\">teaching his grandmother to suck eggs</span> when he attempted to lecture the senior partner on basic auditing procedures.", "ex2_hl": "teaching his grandmother to suck eggs", "ex2_th": "เด็กฝึกงานรุ่นน้องตระหนักได้ทันทีว่าตนกำลังสอนหนังสือสังฆราช เมื่อพยายามจะบรรยายขั้นตอนการตรวจสอบบัญชีขั้นพื้นฐานให้แก่หุ้นส่วนอาวุโสฟัง", "slot_num": 445, "sheet_no": 5, "first_letter": "T"}, {"id": 763, "orig_slot": "Doc #486", "idiom": "Cut someone some slack", "meaning": "give someone a break", "thai_idiom": "ผ่อนปรนให้บ้าง / หยวนๆ ให้หน่อย / เพลาๆ ลงบ้าง", "thai_meaning": "ผ่อนปรน ไม่เข้มงวดหรือตำหนิติเตียนจนเกินไป เพื่อให้โอกาสหรือเห็นใจสถานการณ์ของเขา", "ex1_en": "Ben is going through a tough divorce right now, so please <span class=\"hl-teal\">cut him some slack</span> if he forgets to reply to your texts.", "ex1_hl": "cut him some slack", "ex1_th": "ช่วงนี้เบนกำลังเจอมรสุมชีวิตจากการหย่าร้างที่หนักหนา ดังนั้นได้โปรดผ่อนปรนให้เขาหน่อยเถอะถ้าเขาตอบข้อความช้าไปบ้าง", "ex2_en": "Given that the new software rollout experienced unforeseen server outages, the client agreed to <span class=\"hl-teal\">cut the development team some slack</span> regarding the delivery deadline.", "ex2_hl": "cut the development team some slack", "ex2_th": "เมื่อพิจารณาว่าการเปิดตัวซอฟต์แวร์ใหม่ประสบปัญหาเซิร์ฟเวอร์ล่มโดยไม่คาดคิด ลูกค้าจึงยอมผ่อนผันเรื่องกำหนดส่งมอบงานให้แก่ทีมพัฒนา", "slot_num": 486, "sheet_no": 5, "first_letter": "C"}, {"id": 764, "orig_slot": "Doc #487", "idiom": "Do a double take", "meaning": "look again in surprise", "thai_idiom": "เหลียวมองซ้ำ / หันขวับกลับไปดูด้วยความประหลาดใจ", "thai_meaning": "หันกลับไปมองอีกครั้งด้วยความประหลาดใจหรือไม่เชื่อสายตาตัวเอง", "ex1_en": "When I spotted someone who looked identical to my high school history teacher at the indie rock festival, I had to <span class=\"hl-teal\">do a double take</span>.", "ex1_hl": "do a double take", "ex1_th": "ตอนที่ฉันเห็นคนหน้าเหมือนครูสอนประวัติศาสตร์สมัยมัธยมในเทศกาลดนตรีอินดี้ ฉันถึงกับต้องหันขวับกลับไปมองซ้ำด้วยความไม่อยากเชื่อสายตา", "ex2_en": "The financial auditor <span class=\"hl-teal\">did a double take</span> when she noticed an unexplained three-million-dollar variance on the balance sheet.", "ex2_hl": "did a double take", "ex2_th": "ผู้ตรวจสอบบัญชีต้องก้มลงมองตัวเลขซ้ำอีกรอบด้วยความตกใจ เมื่อสังเกตเห็นผลต่างที่อธิบายไม่ได้ถึงสามล้านดอลลาร์ในงบดุล", "slot_num": 487, "sheet_no": 5, "first_letter": "D"}, {"id": 765, "orig_slot": "Doc #488", "idiom": "Do your bit", "meaning": "do your share", "thai_idiom": "ทำหน้าที่ในส่วนของตน / ร่วมด้วยช่วยกัน / มีส่วนร่วมตามกำลัง", "thai_meaning": "ทำหน้าที่หรือให้ความช่วยเหลือในส่วนที่ตนเองสามารถทำได้เพื่อประโยชน์ส่วนรวม", "ex1_en": "If everybody in the neighborhood simply recycles their plastic waste and keeps the sidewalk tidy, we can all <span class=\"hl-teal\">do our bit</span> for the environment.", "ex1_hl": "do our bit", "ex1_th": "ถ้าทุกคนในชุมชนช่วยกันแยกขยะพลาสติกและดูแลทางเท้าให้เรียบร้อย พวกเราก็สามารถร่วมด้วยช่วยกันดูแลสิ่งแวดล้อมได้แล้ว", "ex2_en": "During the post-flood reconstruction phase, the business alliance urged corporate members to <span class=\"hl-teal\">do their bit</span> by donating building materials and sponsoring local shelters.", "ex2_hl": "do their bit", "ex2_th": "ในช่วงฟื้นฟูหลังน้ำท่วม พันธมิตรทางธุรกิจได้เรียกร้องให้องค์กรสมาชิกช่วยทำหน้าที่ของตน โดยร่วมบริจาควัสดุก่อสร้างและสนับสนุนศูนย์พักพิงในชุมชน", "slot_num": 488, "sheet_no": 5, "first_letter": "D"}, {"id": 766, "orig_slot": "Doc #493", "idiom": "Fast as a flash", "meaning": "very quickly", "thai_idiom": "เร็วฟ้าแลบ / เร็วดั่งสายฟ้าฟาด / รวดเร็วในพริบตาเดียว", "thai_meaning": "รวดเร็วมากในชั่วพริบตาเดียว", "ex1_en": "As soon as a stray biscuit dropped onto the kitchen tiles, the golden retriever snatched it up, <span class=\"hl-teal\">fast as a flash</span>.", "ex1_hl": "fast as a flash", "ex1_th": "ทันทีที่ขนมปังกรอบชิ้นหนึ่งร่วงลงบนพื้นกระเบื้องครัว เจ้าหมาโกลเด้นก็พุ่งเข้าไปงับกินอย่างรวดเร็วปานสายฟ้าแลบ", "ex2_en": "When the cross-border arbitrage window opened, the high-frequency trading algorithm executed the multi-million-dollar transactions <span class=\"hl-teal\">fast as a flash</span>.", "ex2_hl": "fast as a flash", "ex2_th": "เมื่อช่อง   <!-- JAVASCRIPT CONTROLLER SCRIPT -->
  <script>
    // --- STATE MANAGEMENT ---
    let currentView = 'cards';   // 'cards' | 'table' | 'flashcards'
    let currentItems = [...MASTER_DATA];
    let activeLetterFilter = 'all';
    let activeStatusFilter = 'all'; // 'all' | 'favorites' | 'mastered'
    let searchQuery = '';

    // Safe LocalStorage
    let favoritesSet = new Set();
    let masteredSet = new Set();
    try {
      const savedFavs = localStorage.getItem('idioms_favs');
      if (savedFavs) favoritesSet = new Set(JSON.parse(savedFavs));
      const savedMastered = localStorage.getItem('idioms_mastered');
      if (savedMastered) masteredSet = new Set(JSON.parse(savedMastered));
    } catch (e) {}

    // Audio State
    let currentAudio = null;
    let currentPlayingBtn = null;
    let playbackSpeed = 1.0;
    let audioEngine = 'natural'; // 'natural' (MP3 in audio/) | 'system' (Web Speech API)

    // Flashcard State
    let flashIndex = 0;
    let isFlipped = false;

    // --- AUDIO CONTROLLER ---
    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      if (currentPlayingBtn) {
        currentPlayingBtn.classList.remove('audio-playing');
        currentPlayingBtn = null;
      }
    }

    function playAudioById(masterId, type, btnElement) {
      const item = MASTER_DATA.find(x => x.id === masterId);
      if (!item) return;

      let textToSpeak = '';
      if (type === 'idm') textToSpeak = item.idiom;
      else if (type === 'ex1') textToSpeak = (item.ex1_en || '').replace(/<[^>]*>/g, '');
      else if (type === 'ex2') textToSpeak = (item.ex2_en || '').replace(/<[^>]*>/g, '');

      playAudio(masterId, type, textToSpeak, btnElement);
    }

    function playAudio(masterId, type, textFallback, btnElement) {
      if (currentPlayingBtn === btnElement && (currentAudio || window.speechSynthesis.speaking)) {
        stopCurrentAudio();
        return;
      }

      stopCurrentAudio();
      currentPlayingBtn = btnElement;
      if (currentPlayingBtn) currentPlayingBtn.classList.add('audio-playing');

      if (audioEngine === 'natural') {
        const audioPath = `audio/${type}_${masterId}.mp3`;
        const audio = new Audio(audioPath);
        audio.playbackRate = playbackSpeed;

        audio.onended = () => {
          if (currentPlayingBtn) currentPlayingBtn.classList.remove('audio-playing');
          currentPlayingBtn = null;
          currentAudio = null;
        };

        audio.onerror = () => {
          speakWebSpeech(textFallback, btnElement);
        };

        currentAudio = audio;
        audio.play().catch(() => {
          speakWebSpeech(textFallback, btnElement);
        });
      } else {
        speakWebSpeech(textFallback, btnElement);
      }
    }

    function speakWebSpeech(text, btnElement) {
      if (!window.speechSynthesis) {
        if (currentPlayingBtn) currentPlayingBtn.classList.remove('audio-playing');
        currentPlayingBtn = null;
        return;
      }

      const cleanText = text.replace(/<[^>]*>/g, '');
      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = 'en-US';
      utter.rate = playbackSpeed;

      const voices = window.speechSynthesis.getVoices();
      const engVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Jenny')));
      if (engVoice) utter.voice = engVoice;

      utter.onend = () => {
        if (currentPlayingBtn) currentPlayingBtn.classList.remove('audio-playing');
        currentPlayingBtn = null;
      };

      utter.onerror = () => {
        if (currentPlayingBtn) currentPlayingBtn.classList.remove('audio-playing');
        currentPlayingBtn = null;
      };

      window.speechSynthesis.speak(utter);
    }

    function setSpeed(val) {
      playbackSpeed = parseFloat(val);
      if (currentAudio) currentAudio.playbackRate = playbackSpeed;
    }

    function toggleAudioEngine() {
      audioEngine = audioEngine === 'natural' ? 'system' : 'natural';
      const label = document.getElementById('audioEngineLabel');
      const btn = document.getElementById('audioEngineBtn');
      if (audioEngine === 'natural') {
        label.textContent = 'Studio HD';
        btn.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium border transition-colors bg-teal-500/20 text-teal-300 border-teal-400/40 hover:bg-teal-500/30';
      } else {
        label.textContent = 'System TTS';
        btn.className = 'hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium border transition-colors bg-amber-500/20 text-amber-300 border-amber-400/40 hover:bg-amber-500/30';
      }
    }

    // --- FAVORITES & MASTERED ---
    function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      if (favoritesSet.has(id)) {
        favoritesSet.delete(id);
      } else {
        favoritesSet.add(id);
      }
      try { localStorage.setItem('idioms_favs', JSON.stringify([...favoritesSet])); } catch (e) {}
      updateBadges();
      if (activeStatusFilter === 'favorites') {
        applyFilters();
      } else {
        updateFavButtons(id);
      }
    }

    function toggleMastered(id, event) {
      if (event) event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      try { localStorage.setItem('idioms_mastered', JSON.stringify([...masteredSet])); } catch (e) {}
      updateBadges();
      if (activeStatusFilter === 'mastered') {
        applyFilters();
      } else {
        updateMasteredButtons(id);
      }
    }

    function updateBadges() {
      document.getElementById('badgeFav').textContent = favoritesSet.size;
      document.getElementById('badgeMastered').textContent = masteredSet.size;
      document.getElementById('badgeAll').textContent = MASTER_DATA.length;
    }

    function updateFavButtons(id) {
      const isFav = favoritesSet.has(id);
      document.querySelectorAll(`[data-fav-id="${id}"]`).forEach(btn => {
        if (isFav) {
          btn.innerHTML = '⭐';
          btn.classList.add('text-amber-500', 'bg-amber-50');
        } else {
          btn.innerHTML = '☆';
          btn.classList.remove('text-amber-500', 'bg-amber-50');
        }
      });
    }

    function updateMasteredButtons(id) {
      const isM = masteredSet.has(id);
      document.querySelectorAll(`[data-mastered-id="${id}"]`).forEach(btn => {
        if (isM) {
          btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
          btn.classList.remove('bg-slate-100', 'text-slate-500');
        } else {
          btn.classList.remove('bg-emerald-500', 'text-white', 'border-emerald-600');
          btn.classList.add('bg-slate-100', 'text-slate-500');
        }
      });
    }

    // --- FILTERING & SEARCH ---
    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      document.getElementById('clearSearchBtn').classList.toggle('hidden', searchQuery.length === 0);
      applyFilters();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      applyFilters();
    }

    function setStatusFilter(status) {
      activeStatusFilter = status;
      ['all', 'favorites', 'mastered'].forEach(s => {
        const btn = document.getElementById('statusFilter' + (s === 'all' ? 'All' : (s === 'favorites' ? 'Fav' : 'Mastered')));
        if (s === status) {
          btn.className = 'w-full text-left px-3 py-2 rounded-xl font-medium flex items-center justify-between bg-teal-50 text-teal-800 font-semibold transition-colors';
        } else {
          btn.className = 'w-full text-left px-3 py-2 rounded-xl font-medium flex items-center justify-between text-slate-600 hover:bg-slate-100 transition-colors';
        }
      });
      applyFilters();
    }

    function setLetterFilter(letter) {
      activeLetterFilter = letter;
      renderLetterButtons();
      applyFilters();
    }

    function resetAllFilters() {
      activeLetterFilter = 'all';
      activeStatusFilter = 'all';
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      setStatusFilter('all');
      renderLetterButtons();
      applyFilters();
    }

    function shuffleCurrentItems() {
      for (let i = currentItems.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentItems[i], currentItems[j]] = [currentItems[j], currentItems[i]];
      }
      renderCurrentView();
    }

    function applyFilters() {
      currentItems = MASTER_DATA.filter(item => {
        const targetId = item.id;

        // Status filter
        if (activeStatusFilter === 'favorites' && !favoritesSet.has(targetId)) return false;
        if (activeStatusFilter === 'mastered' && !masteredSet.has(targetId)) return false;

        // Letter filter
        if (activeLetterFilter !== 'all' && item.first_letter !== activeLetterFilter) return false;

        // Search query
        if (searchQuery) {
          const matchIdm = item.idiom.toLowerCase().includes(searchQuery);
          const matchMng = item.meaning.toLowerCase().includes(searchQuery);
          const matchThIdm = (item.thai_idiom || '').toLowerCase().includes(searchQuery);
          const matchThMng = (item.thai_meaning || '').toLowerCase().includes(searchQuery);
          const matchEx1 = (item.ex1_en || '').toLowerCase().includes(searchQuery) || (item.ex1_th || '').toLowerCase().includes(searchQuery);
          const matchEx2 = (item.ex2_en || '').toLowerCase().includes(searchQuery) || (item.ex2_th || '').toLowerCase().includes(searchQuery);
          const matchSlot = (item.orig_slot || '').toLowerCase().includes(searchQuery) || String(item.id || '').includes(searchQuery);
          if (!matchIdm && !matchMng && !matchThIdm && !matchThMng && !matchEx1 && !matchEx2 && !matchSlot) {
            return false;
          }
        }
        return true;
      });

      document.getElementById('filteredCount').textContent = currentItems.length;
      renderCurrentView();
    }

              </div>

              <!-- BACK OF CARD -->
              <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-slate-900 via-slate-950 to-indigo-950 text-white rounded-3xl border-2 border-slate-700 shadow-xl p-5 sm:p-7 flex flex-col justify-between overflow-y-auto custom-scrollbar">
                
                <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-3">
                  <div>
                    <span class="text-xs font-mono font-bold text-teal-400">${slotLabel}</span>
                    <span class="text-base sm:text-lg font-bold text-white ml-2">${item.idiom}</span>
                  </div>
                  <button onclick="toggleMastered(${targetId}, event)" data-mastered-id="${targetId}" class="px-3 py-1 rounded-xl text-xs font-semibold border transition-all ${isM ? 'bg-emerald-500 text-white border-emerald-400' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}">
                    ${isM ? '✓ จำได้แล้ว' : '🎓 ทำเครื่องหมายว่าจำได้'}
                  </button>
                </div>

                <!-- Thai Meaning & Definition -->
                <div class="bg-slate-800/80 rounded-2xl p-3 border border-slate-700 mb-3">
                  <div class="text-sm font-bold text-teal-300 mb-1">${item.thai_idiom || ''}</div>
                  <div class="text-xs text-slate-300 leading-relaxed">${item.thai_meaning || ''}</div>
                </div>

                <!-- 2 Sentences -->
                <div class="space-y-2 mb-3">
                  
                  <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/80 text-xs">
                    <div class="flex items-center justify-between gap-1 mb-1">
                      <span class="text-[10px] font-bold text-teal-300 uppercase">☕ Daily Life</span>
                      <button onclick="event.stopPropagation(); playAudioById(${masterId}, 'ex1', this)" class="w-5 h-5 rounded-full bg-slate-700 hover:bg-teal-500 text-white flex items-center justify-center transition-colors">
                        <svg class="w-3 h-3 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                      </button>
                    </div>
                    <div class="text-slate-100 text-xs leading-snug">${item.ex1_en}</div>
                    <div class="text-[11px] text-slate-400 mt-1">→ ${item.ex1_th}</div>
                  </div>

                  <div class="bg-slate-800/60 rounded-xl p-2.5 border border-slate-700/80 text-xs">
                    <div class="flex items-center justify-between gap-1 mb-1">
                      <span class="text-[10px] font-bold text-purple-300 uppercase">💼 Workplace</span>
                      <button onclick="event.stopPropagation(); playAudioById(${masterId}, 'ex2', this)" class="w-5 h-5 rounded-full bg-slate-700 hover:bg-purple-500 text-white flex items-center justify-center transition-colors">
                        <svg class="w-3 h-3 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                      </button>
                    </div>
                    <div class="text-slate-100 text-xs leading-snug">${item.ex2_en}</div>
                    <div class="text-[11px] text-slate-400 mt-1">→ ${item.ex2_th}</div>
                  </div>

                </div>

                <div class="text-center text-[11px] text-slate-400 pt-1 border-t border-slate-800/80">
                  คลิกเพื่อพลิกกลับด้านหน้า
                </div>

              </div>

            </div>
          </div>

          <!-- Bottom Navigation Controls -->
          <div class="w-full flex items-center justify-between gap-4 mt-5">
            <button onclick="prevFlashcard()" class="flex-1 py-3 bg-white hover:bg-slate-100 text-slate-700 rounded-2xl border border-slate-200 font-bold text-xs flex items-center justify-center gap-2 shadow-xs transition-all">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
              <span>ก่อนหน้า (←)</span>
            </button>
            <button onclick="flipFlashcard()" class="px-5 py-3 bg-teal-50 hover:bg-teal-100 text-teal-800 rounded-2xl border border-teal-200 font-bold text-xs flex items-center justify-center gap-1 shadow-xs transition-all">
              <span>พลิกการ์ด (Space)</span>
            </button>
            <button onclick="nextFlashcard()" class="flex-1 py-3 bg-teal-600 hover:bg-teal-700 text-white rounded-2xl shadow-sm font-bold text-xs flex items-center justify-center gap-2 transition-all">
              <span>ถัดไป (→)</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
          </div>

        </div>
      `;
    }

    function flipFlashcard() {
      isFlipped = !isFlipped;
      const inner = document.getElementById('flashcardInner');
      if (inner) {
        inner.classList.toggle('rotate-y-180', isFlipped);
      }
    }

    function nextFlashcard() {
      if (flashIndex < currentItems.length - 1) {
        flashIndex++;
      } else {
        flashIndex = 0;
      }
      isFlipped = false;
      renderCurrentView();
    }

    function prevFlashcard() {
      if (flashIndex > 0) {
        flashIndex--;
      } else {
        flashIndex = currentItems.length - 1;
      }
      isFlipped = false;
      renderCurrentView();
    }

    // Keyboard Shortcuts for Flashcards
    window.addEventListener('keydown', (e) => {
      if (currentView !== 'flashcards') return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        flipFlashcard();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        nextFlashcard();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        prevFlashcard();
      }
    });

    // --- SIDEBAR TOGGLE ---
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const isClosed = sidebar.classList.contains('-translate-x-full');
      if (isClosed) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }

    // --- SIDEBAR PILLS RENDERING ---
    function renderLetterButtons() {
      const container = document.getElementById('letterFilterContainer');
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
      
      let html = `
        <button onclick="setLetterFilter('all')" class="px-2 py-1 rounded-lg text-xs font-semibold transition-colors ${activeLetterFilter === 'all' ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
          All
        </button>
      `;

      letters.forEach(char => {
        const count = MASTER_DATA.filter(i => i.first_letter === char).length;
        if (count > 0) {
          const isActive = activeLetterFilter === char;
          html += `
            <button onclick="setLetterFilter('${char}')" class="px-2 py-1 rounded-lg text-xs font-semibold transition-colors ${isActive ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}" title="${char}: ${count} รายการ">
              ${char}
            </button>
          `;
        }
      });
      container.innerHTML = html;
    }

    // --- INITIALIZATION ---
    function bootDashboard() {
      renderLetterButtons();
      updateBadges();
      applyFilters();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootDashboard);
    } else {
      bootDashboard();
    }
  </script>

</body>
</html>
