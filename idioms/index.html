ins well under twenty milliseconds.", "ex2_hl": "so far, so good", "ex2_th": "เราเริ่มย้ายบัญชีลูกค้าสองหมื่นรายตั้งแต่เช้าตรู่ และจนถึงตอนนี้ทุกอย่างยังราบรื่นดี ค่าความหน่วงยังคงต่ำกว่ายี่สิบมิลลิวินาที", "slot_num": 831, "sheet_no": 9, "first_letter": "S"}, {"id": 583, "orig_slot": "#832", "idiom": "Sort out", "meaning": "Resolve a problem.", "thai_idiom": "สางปัญหา / จัดการให้เรียบร้อย / เคลียร์ปัญหา", "thai_meaning": "จัดการ แก้ไข หรือจัดระเบียบปัญหาความยุ่งเหยิงให้คลี่คลาย", "ex1_en": "Give me an hour to <span class=\"hl-teal\">sort out</span> these tangled cables behind the TV unit so we can hook up the soundbar.", "ex1_hl": "sort out", "ex1_th": "ขอเวลาฉันสักชั่วโมงในการจัดระเบียบสายไฟที่พันกันยุ่งหลังตู้วางทีวี จะได้ต่อลำโพงซาวด์บาร์ได้เสียที", "ex2_en": "The logistics manager held an emergency meeting to <span class=\"hl-teal\">sort out</span> customs discrepancies delaying the shipment of medical supplies.", "ex2_hl": "sort out", "ex2_th": "ผู้จัดการฝ่ายโลจิสติกส์เรียกประชุมด่วนเพื่อสางปัญหาความคลาดเคลื่อนทางศุลกากรที่ทำให้การส่งมอบเวชภัณฑ์ล่าช้า", "slot_num": 832, "sheet_no": 9, "first_letter": "S"}, {"id": 584, "orig_slot": "#834", "idiom": "Spend money like water", "meaning": "Spend money carelessly.", "thai_idiom": "ใช้เงินเป็นเบี้ย / ใช้เงินเหมือนเทน้ำเทท่า", "thai_meaning": "ใช้จ่ายเงินอย่างสุรุ่ยสุร่าย ฟุ่มเฟือยโดยไม่ยั้งคิด", "ex1_en": "Ever since he inherited his uncle's estate, Ethan has been <span class=\"hl-teal\">spending money like water</span> on designer clothes and sports cars.", "ex1_hl": "spending money like water", "ex1_th": "ตั้งแต่ได้รับมรดกจากคุณลุง อีธานก็ใช้เงินเป็นเบี้ย หมดไปกับเสื้อผ้าแบรนด์เนมและรถสปอร์ตหรู", "ex2_en": "The parliamentary oversight committee accused the state agency of <span class=\"hl-teal\">spending money like water</span> on extravagant overseas consulting junkets.", "ex2_hl": "spending money like water", "ex2_th": "คณะกรรมาธิการตรวจสอบของรัฐสภากล่าวหาหน่วยงานรัฐว่าใช้จ่ายงบประมาณเหมือนเทน้ำเทท่าไปกับการจัดทริปดูงานและว่าจ้างที่ปรึกษาต่างประเทศอย่างฟุ่มเฟือย", "slot_num": 834, "sheet_no": 9, "first_letter": "S"}, {"id": 585, "orig_slot": "#835", "idiom": "Square up", "meaning": "Deal with a problem directly.", "thai_idiom": "เผชิญหน้าจัดการตรงๆ / สะสางข้อพิพาท / เคลียร์กันตรงๆ", "thai_meaning": "หันหน้าเข้าเผชิญและจัดการกับปัญหา ข้อขัดแย้ง หรือภาระหน้าที่อย่างตรงไปตรงมา", "ex1_en": "Instead of harboring resentment over split expenses, Mia asked her flatmate to sit down and <span class=\"hl-teal\">square up</span> honestly.", "ex1_hl": "square up", "ex1_th": "แทนที่จะเก็บความขุ่นเคืองไว้เรื่องการหารค่าใช้จ่าย มีอาขอให้เพื่อนร่วมห้องมานั่งคุยและเคลียร์กันตรงๆ อย่างเปิดอก", "ex2_en": "The board urged the newly appointed CEO to <span class=\"hl-teal\">square up</span> to the company's pension deficit rather than deferring the liability.", "ex2_hl": "square up", "ex2_th": "คณะกรรมการบริหารกระตุ้นให้ซีอีโอคนใหม่เผชิญหน้าและจัดการกับปัญหาการขาดดุลกองทุนสำรองเลี้ยงชีพของบริษัทโดยตรง แทนที่จะผลัดผ่อนภาระหนี้ออกไปเรื่อยๆ", "slot_num": 835, "sheet_no": 9, "first_letter": "S"}, {"id": 586, "orig_slot": "#836", "idiom": "Start from scratch", "meaning": "Begin again from the beginning.", "thai_idiom": "นับหนึ่งใหม่ / เริ่มต้นจากศูนย์", "thai_meaning": "เริ่มต้นทำสิ่งใดสิ่งหนึ่งใหม่ทั้งหมดตั้งแต่แรกโดยไม่มีอะไรเดิมหลงเหลืออยู่", "ex1_en": "A power outage corrupted my unsaved digital painting, forcing me to <span class=\"hl-teal\">start from scratch</span> late at night.", "ex1_hl": "start from scratch", "ex1_th": "ไฟดับกะทันหันทำให้ภาพวาดดิจิทัลที่ยังไม่ได้บันทึกเสียหาย บังคับให้ฉันต้องมานั่งนับหนึ่งใหม่ตอนดึกดื่น", "ex2_en": "After lab trials revealed fundamental structural flaws in the alloy, materials scientists had to <span class=\"hl-teal\">start from scratch</span> with a novel chemical formula.", "ex2_hl": "start from scratch", "ex2_th": "หลังจากการทดลองในห้องปฏิบัติการเผยให้เห็นข้อบกพร่องเชิงโครงสร้างที่สำคัญในโลหะผสม นักวิทยาศาสตร์ด้านวัสดุจึงต้องเริ่มต้นวิจัยใหม่จากศูนย์ด้วยสูตรเคมีแบบใหม่", "slot_num": 836, "sheet_no": 9, "first_letter": "S"}, {"id": 587, "orig_slot": "#837", "idiom": "Step into someone's shoes", "meaning": "Experience what someone else has.", "thai_idiom": "เอาใจเขามาใส่ใจเรา / สวมบทบาทแทนผู้อื่น", "thai_meaning": "ลองจินตนาการหรือสัมผัสประสบการณ์จากมุมมอง สภาพการณ์ หรือความรู้สึกของผู้อื่น", "ex1_en": "Try to <span class=\"hl-teal\">step into your mother's shoes</span> before complaining about chores—she works twelve-hour shifts at the clinic.", "ex1_hl": "step into your mother's shoes", "ex1_th": "ลองเอาใจแม่มาใส่ใจเราดูก่อนที่จะบ่นเรื่องงานบ้าน แม่ต้องเข้าเวรที่คลินิกวันละสิบสองชั่วโมงเลยนะ", "ex2_en": "Human resources introduced a cross-training initiative to encourage department heads to <span class=\"hl-teal\">step into the front-line staff's shoes</span>.", "ex2_hl": "step into the front-line staff's shoes", "ex2_th": "ฝ่ายทรัพยากรบุคคลริเริ่มโครงการฝึกอบรมข้ามสายงานเพื่อกระตุ้นให้หัวหน้าแผนกได้ลองสวมบทบาทและเข้าใจหัวอกของพนักงานระดับปฏิบัติการด่านหน้า", "slot_num": 837, "sheet_no": 9, "first_letter": "S"}, {"id": 588, "orig_slot": "#838", "idiom": "Sugarcoat", "meaning": "Make something sound better than it is.", "thai_idiom": "พูดเคลือบน้ำตาล / ตกแต่งคำพูดให้ดูดี", "thai_meaning": "ตกแต่งคำพูดหรือนำเสนอเรื่องร้ายให้ฟังดูเบาลงหรือนุ่มนวลกว่าความเป็นจริง", "ex1_en": "Please be frank about my audition performance; there is no need to <span class=\"hl-teal\">sugarcoat</span> your feedback to spare my feelings.", "ex1_hl": "sugarcoat", "ex1_th": "ช่วยวิจารณ์การออดิชันของฉันตรงๆ ได้เลยนะ ไม่จำเป็นต้องพูดเคลือบน้ำตาลเพื่อถนอมน้ำใจฉันหรอก", "ex2_en": "The independent auditor refused to <span class=\"hl-teal\">sugarcoat</span> the quarterly review, directly warning investors about severe liquidity risks.", "ex2_hl": "sugarcoat", "ex2_th": "ผู้สอบบัญชีอิสระปฏิเสธที่จะแต่งแต้มรายงานทบทวนประจำไตรมาสให้ดูดี แต่กลับเตือนนักลงทุนอย่างตรงไปตรงมาเกี่ยวกับความเสี่ยงด้านสภาพคล่องขั้นรุนแรง", "slot_num": 838, "sheet_no": 9, "first_letter": "S"}, {"id": 589, "orig_slot": "#839", "idiom": "Take a rain check", "meaning": "Postpone an invitation.", "thai_idiom": "ขอยกยอดไปคราวหน้า / ขอเลื่อนไปก่อน / ขอแปะไว้ก่อน", "thai_meaning": "ขอเลื่อนนัดหมายหรือคำเชิญไปเป็นโอกาสหน้าอย่างสุภาพ", "ex1_en": "I'd love to join you for sushi tonight, but I'm swamped with packing for my flight tomorrow—can I <span class=\"hl-teal\">take a rain check</span>?", "ex1_hl": "take a rain check", "ex1_th": "ฉันอยากไปกินซูชิด้วยเย็นนี้มากเลยนะ แต่ยุ่งอยู่กับการแพ็กกระเป๋าเตรียมบินพรุ่งนี้ ขอยกยอดไปคราวหน้าได้ไหม", "ex2_en": "Due to ongoing contract arbitrations, the keynote speaker had to <span class=\"hl-teal\">take a rain check</span> on attending the annual symposium.", "ex2_hl": "take a rain check", "ex2_th": "เนื่องจากติดภารกิจการอนุญาโตตุลาการสัญญาที่ยังไม่แล้วเสร็จ องค์ปาฐกหลักจึงต้องขอเลื่อนการเข้าร่วมการประชุมวิชาการประจำปีออกไปก่อน", "slot_num": 839, "sheet_no": 9, "first_letter": "T"}, {"id": 590, "orig_slot": "#840", "idiom": "Take a stand", "meaning": "Defend your beliefs or rights.", "thai_idiom": "แสดงจุดยืน / ลุกขึ้นมาปกป้องสิทธิ์", "thai_meaning": "แสดงออกอย่างเด็ดเดี่ยว มั่นคง เพื่อปกป้องสิทธิ ความเชื่อ หรือหลักการของตน", "ex1_en": "When bullies picked on a shy classmate at lunch, Lucas decided to <span class=\"hl-teal\">take a stand</span> and sat right beside him.", "ex1_hl": "take a stand", "ex1_th": "ตอนที่พวกอันธพาลแกล้งเพื่อนร่วมชั้นขี้อายช่วงพักกลางวัน ลูคัสตัดสินใจลุกขึ้นมาแสดงจุดยืนด้วยการเดินเข้าไปนั่งข้างเพื่อนคนนั้นทันที", "ex2_en": "The senior engineer chose to <span class=\"hl-teal\">take a stand</span> against releasing untested code, insisting that public safety outweighed rapid deployment.", "ex2_hl": "take a stand", "ex2_th": "วิศวกรอาวุโสตัดสินใจลุกขึ้นมาแสดงจุดยืนคัดค้านการปล่อยโค้ดที่ยังไม่ผ่านการทดสอบ โดยยืนยันว่าความปลอดภัยของผู้ใช้งานสำคัญกว่าการส่งมอบงานอย่างเร่งรีบ", "slot_num": 840, "sheet_no": 9, "first_letter": "T"}, {"id": 591, "orig_slot": "#842", "idiom": "Take the high road", "meaning": "Choose the morally better path.", "thai_idiom": "เลือกทางที่ถูกต้อง / ทำสิ่งที่สง่างาม / ไม่ลดตัวลงไปเกลือกกลั้ว", "thai_meaning": "เลือกวิถีทางที่มีศีลธรรม เกียรติยศ และวุฒิภาวะ แทนที่จะตอบโต้ด้วยความรุนแรงหรือเล่ห์เหลี่ยมต่ำทราม", "ex1_en": "Despite receiving spiteful text messages from his former roommate, Liam decided to <span class=\"hl-teal\">take the high road</span> and returned his mail neatly packed.", "ex1_hl": "take the high road", "ex1_th": "แม้จะได้รับข้อความร้ายกาจจากอดีตรูมเมต เลียมก็เลือกที่จะทำสิ่งที่สง่างามด้วยการส่งคืนจดหมายพัสดุให้โดยแพ็กไว้อย่างเรียบร้อย", "ex2_en": "In the face of relentless smear campaigns, the candidate determined to <span class=\"hl-teal\">take the high road</span>, directing media inquiries strictly toward policy proposals.", "ex2_hl": "take the high road", "ex2_th": "ท่ามกลางการรณรงค์สาดโคลนโจมตีอย่างไม่หยุดยั้ง ผู้สมัครเลือกเดินบนเส้นทางอันสง่างามด้วยการเบี่ยงเบนการสัมภาษณ์สื่อมวลชนไปสู่ข้อเสนอนโยบายล้วนๆ", "slot_num": 842, "sheet_no": 9, "first_letter": "T"}, {"id": 592, "orig_slot": "#844", "idiom": "Take things for granted", "meaning": "Fail to appreciate what you have.", "thai_idiom": "มองข้ามคุณค่า / เคยตัวจนมองไม่เห็นความสำคัญ", "thai_meaning": "ไม่เห็นคุณค่าหรือความสำคัญของสิ่งหรือบุคคลรอบตัว เพราะเคยชินจนคิดว่าเป็นของตาย", "ex1_en": "After surviving a severe snowstorm without power, we realized how easily we <span class=\"hl-teal\">take things for granted</span> like running hot water.", "ex1_hl": "take things for granted", "ex1_th": "หลังจากผ่านพ้นพายุหิมะรุนแรงโดยไม่มีไฟฟ้าใช้ เราก็ตระหนักได้ว่าที่ผ่านมาเราเคยตัวจนมองข้ามคุณค่าของสิ่งพื้นฐานอย่างน้ำอุ่นไปง่ายดายเพียงใด", "ex2_en": "Senior partners cautioned junior associates never to <span class=\"hl-teal\">take things for granted</span> when dealing with legacy accounts, as client loyalty requires continuous cultivation.", "ex2_hl": "take things for granted", "ex2_th": "หุ้นส่วนอาวุโสเตือนทนายความรุ่นน้องว่าอย่าได้มองข้ามความสำคัญของลูกค้ารายเก่าแก่เป็นอันขาด เพราะความภักดีของลูกค้าเป็นสิ่งที่ต้องคอยใส่ใจดูแลอย่างต่อเนื่อง", "slot_num": 844, "sheet_no": 9, "first_letter": "T"}, {"id": 593, "orig_slot": "#846", "idiom": "Team up", "meaning": "Join together for a common goal.", "thai_idiom": "จับมือกัน / ผนึกกำลัง / ร่วมมือกัน", "thai_meaning": "ร่วมมือหรือรวมพลังกับผู้อื่นเพื่อดำเนินงานหรือบรรลุเป้าหมายเดียวกัน", "ex1_en": "My neighbor and I agreed to <span class=\"hl-teal\">team up</span> on lawn mowing and garden weeding every other Saturday.", "ex1_hl": "team up", "ex1_th": "ฉันกับเพื่อนบ้านตกลงจับมือกันช่วยตัดหญ้าและถอนวัชพืชในสวนสลับกันคนละเสาร์", "ex2_en": "The automotive giant chose to <span class=\"hl-teal\">team up</span> with a leading battery manufacturer to construct a state-of-the-art gigafactory.", "ex2_hl": "team up", "ex2_th": "บริษัทยานยนต์ยักษ์ใหญ่ตัดสินใจผนึกกำลังกับผู้ผลิตแบตเตอรี่ชั้นนำเพื่อร่วมกันก่อสร้างโรงงานผลิตเซลล์แบตเตอรี่ขนาดใหญ่ที่ทันสมัยที่สุด", "slot_num": 846, "sheet_no": 9, "first_letter": "T"}, {"id": 594, "orig_slot": "#847", "idiom": "Tell a lie", "meaning": "Say something untrue.", "thai_idiom": "พูดปด / โกหก", "thai_meaning": "พูดสิ่งที่ไม่เป็นความจริง จงใจกล่าวเท็จเพื่อหลอกลวง", "ex1_en": "Emma taught her son that it is always better to admit an honest mistake than to <span class=\"hl-teal\">tell a lie</span>.", "ex1_hl": "tell a lie", "ex1_th": "เอ็มม่าสอนลูกชายเสมอว่าการยอมรับความผิดพลาดอย่างซื่อสัตย์ย่อมดีกว่าการพูดโกหกเอาตัวรอด", "ex2_en": "Under strict cross-examination, the defense witness hesitated, knowing that choosing to <span class=\"hl-teal\">tell a lie</span> would lead directly to perjury charges.", "ex2_hl": "tell a lie", "ex2_th": "ในการซักค้านอันเข้มข้น พยานฝ่ายจำเลยเกิดความลังเลใจ เพราะตระหนักดีว่าหากเลือกที่จะเบิกความเท็จจะต้องเผชิญข้อหาอาญาในทันที", "slot_num": 847, "sheet_no": 9, "first_letter": "T"}, {"id": 595, "orig_slot": "#848", "idiom": "Ten to one", "meaning": "Very likely.", "thai_idiom": "เก้าสิบเก้าเปอร์เซ็นต์ / มีโอกาสสูงมาก / ฟันธงได้เลย", "thai_meaning": "มีความเป็นไปได้สูงมาก แทบจะแน่นอน", "ex1_en": "Put your umbrella in your backpack; <span class=\"hl-teal\">ten to one</span> those dark clouds will bring a heavy downpour before dinner.", "ex1_hl": "ten to one", "ex1_th": "ใส่ร่มไว้ในกระเป๋าเป้เถอะ เมฆครึ้มขนาดนั้นฟันธงได้เลยว่าฝนจะเทลงมาหนักก่อนมื้อเย็นแน่นอน", "ex2_en": "Given the unprecedented surge in crude oil futures, <span class=\"hl-teal\">ten to one</span> international carriers will announce an emergency fuel surcharge next week.", "ex2_hl": "ten to one", "ex2_th": "เมื่อพิจารณาจากราคาน้ำมันดิบล่วงหน้าที่พุ่งสูงเป็นประวัติการณ์ มีโอกาสสูงมากที่สายการบินระหว่างประเทศจะประกาศปรับขึ้นค่าธรรมเนียมน้ำมันฉุกเฉินในสัปดาห์หน้า", "slot_num": 848, "sheet_no": 9, "first_letter": "T"}, {"id": 596, "orig_slot": "#849", "idiom": "The apple of one's eye", "meaning": "Someone you love most.", "thai_idiom": "แก้วตาดวงใจ / สุดที่รัก", "thai_meaning": "คนที่เป็นที่รักใคร่ หวงแหน และทะนุถนอมที่สุด", "ex1_en": "Grandma keeps framed portraits of Maya everywhere because she is truly <span class=\"hl-teal\">the apple of her eye</span>.", "ex1_hl": "the apple of her eye", "ex1_th": "คุณยายตั้งกรอบรูปของมายาไว้ทั่วทุกมุมบ้าน เพราะหลานสาวคนนี้คือแก้วตาดวงใจของคุณยายจริงๆ", "ex2_en": "Among his numerous architectural creations, the waterfront concert hall remained <span class=\"hl-teal\">the apple of the master architect's eye</span>.", "ex2_hl": "the apple of the master architect's eye", "ex2_th": "ในบรรดาผลงานการออกแบบสถาปัตยกรรมมากมาย อาคารคอนเสิร์ตฮอลล์ริมน้ำแห่งนี้ยังคงเป็นผลงานชิ้นเอกที่สถาปนิกเอกรักและภาคภูมิใจมากที่สุด", "slot_num": 849, "sheet_no": 9, "first_letter": "T"}, {"id": 597, "orig_slot": "#851", "idiom": "The cream of the crop", "meaning": "The best of the best.", "thai_idiom": "หัวกะทิ / ชั้นยอด / ยอดเยี่ยมที่สุด", "thai_meaning": "สิ่งหรือบุคคลที่ยอดเยี่ยม โดดเด่น เป็นเลิศที่สุดในกลุ่ม", "ex1_en": "The artisanal honey jars sold at this farmers' market are <span class=\"hl-teal\">the cream of the crop</span>, gathered straight from wildflower reserves.", "ex1_hl": "the cream of the crop", "ex1_th": "น้ำผึ้งโฮมเมดที่ขายในตลาดเกษตรกรแห่งนี้ถือเป็นผลผลิตชั้นยอด โดยเก็บสดๆ มาจากแหล่งอนุรักษ์ดอกไม้ป่า", "ex2_en": "With acceptance rates dropping below two percent, the prestigious residency program admits only <span class=\"hl-teal\">the cream of the crop</span> from medical academies nationwide.", "ex2_hl": "the cream of the crop", "ex2_th": "ด้วยอัตราการรับเข้าที่ต่ำกว่าสองเปอร์เซ็นต์ โครงการแพทย์ประจำบ้านอันทรงเกียรติจึงคัดเลือกเฉพาะหัวกะทิระดับแนวหน้าจากวิทยาลัยแพทย์ทั่วประเทศเท่านั้น", "slot_num": 851, "sheet_no": 9, "first_letter": "T"}, {"id": 598, "orig_slot": "#854", "idiom": "The pen is mightier than the sword", "meaning": "Words are more powerful than weapons.", "thai_idiom": "ปลายปากกาทรงพลังกว่าคมดาบ", "thai_meaning": "พลังแห่งความคิด ตัวอักษร และการสื่อสาร สามารถสร้างการเปลี่ยนแปลงได้ยิ่งใหญ่กว่าการใช้กำลังอาวุธ", "ex1_en": "Dad advised me to draft a courteous letter to the housing board, saying that <span class=\"hl-teal\">the pen is mightier than the sword</span>.", "ex1_hl": "the pen is mightier than the sword", "ex1_th": "พ่อแนะนำให้ฉันเขียนจดหมายชี้แจงอย่างสุภาพส่งถึงนิติบุคคลอาคารชุด โดยเตือนว่าปลายปากกานั้นทรงพลังกว่าการใช้อารมณ์เข้าปะทะ", "ex2_en": "Historical archives demonstrate how dissidents proved that <span class=\"hl-teal\">the pen is mightier than the sword</span> by toppling autocrats through underground printing presses.", "ex2_hl": "the pen is mightier than the sword", "ex2_th": "เอกสารทางประวัติศาสตร์แสดงให้เห็นว่ากลุ่มผู้เรียกร้องสิทธิ์พิสูจน์ให้เห็นว่าปลายปากกาทรงพลังกว่าคมดาบ ด้วยการโค่นล้มระบอบเผด็จการผ่านโรงพิมพ์ใต้ดิน", "slot_num": 854, "sheet_no": 9, "first_letter": "T"}, {"id": 599, "orig_slot": "#855", "idiom": "The writing on the wall", "meaning": "A sign of what will happen.", "thai_idiom": "สัญญาณเตือนลางร้าย / ลางบอกเหตุที่ชัดเจน", "thai_meaning": "สัญญาณหรือลางบอกเหตุอันชัดแจ้งว่าความล้มเหลวหรือหายนะกำลังจะเกิดขึ้น", "ex1_en": "When the boutique coffee shop slashed its opening hours and stopped restocking beans, regular patrons saw <span class=\"hl-teal\">the writing on the wall</span>.", "ex1_hl": "the writing on the wall", "ex1_th": "ตอนที่ร้านกาแฟเล็กๆ ลดเวลาเปิดทำการและเริ่มไม่สั่งเมล็ดกาแฟมาเติม ลูกค้าประจำต่างมองเห็นสัญญาณชัดเจนว่าร้านคงใกล้ปิดตัวแล้ว", "ex2_en": "Mounting debt default rates signaled <span class=\"hl-teal\">the writing on the wall</span> months before the commercial mortgage lender collapsed into bankruptcy.", "ex2_hl": "the writing on the wall", "ex2_th": "อัตราการผิดนัดชำระหนี้ที่พุ่งสูงขึ้นเป็นสัญญาณเตือนลางร้ายล่วงหน้านานหลายเดือน ก่อนที่สถาบันสินเชื่อจำนองเชิงพาณิชย์จะล้มละลาย", "slot_num": 855, "sheet_no": 9, "first_letter": "T"}, {"id": 600, "orig_slot": "#856", "idiom": "There is no I in team", "meaning": "Teamwork is important.", "thai_idiom": "ไม่มีคำว่า 'ข้า' ในคำว่า 'ทีม' / ทีมเวิร์กต้องมาก่อนผลงานเดี่ยว", "thai_meaning": "ความร่วมมือร่วมใจและการทำงานเป็นทีมสำคัญกว่าการคำนึงถึงตัวเองหรือการฉายเดี่ยว", "ex1_en": "When Leo refused to pass the basketball during the championship final, his coach shouted that <span class=\"hl-teal\">there is no I in team</span>.", "ex1_hl": "there is no I in team", "ex1_th": "เมื่อลีโอไม่ยอมส่งลูกบาสเกตบอลให้เพื่อนในช่วงชิงชนะเลิศ โค้ชจึงตะโกนเตือนว่าไม่มีคำว่า 'ข้า' ในคำว่า 'ทีม'", "ex2_en": "In her onboarding speech to new software developers, the engineering director reminded everyone that <span class=\"hl-teal\">there is no I in team</span>.", "ex2_hl": "there is no I in team", "ex2_th": "ในการกล่าวต้อนรับนักพัฒนาซอฟต์แวร์ใหม่ ผู้อำนวยการฝ่ายวิศวกรรมย้ำเตือนทุกคนว่าความสำเร็จเกิดขึ้นจากทีมเวิร์กไม่ใช่ผลงานเดี่ยวของใครคนใดคนหนึ่ง", "slot_num": 856, "sheet_no": 9, "first_letter": "T"}, {"id": 601, "orig_slot": "#857", "idiom": "Thick and thin", "meaning": "In good times and bad.", "thai_idiom": "ร่วมทุกข์ร่วมสุข / ไม่ว่าจะดีหรือร้าย", "thai_meaning": "ผ่านพ้นเหตุการณ์ต่างๆ มาด้วยกัน ทั้งในยามสุขสบายและยามยากลำบาก", "ex1_en": "Through twenty years of friendship, Maya and Sarah stood by each other through <span class=\"hl-teal\">thick and thin</span>.", "ex1_hl": "thick and thin", "ex1_th": "ตลอดมิตรภาพยาวนานยี่สิบปี มายาและซาราห์ยืนหยัดเคียงข้างร่วมทุกข์ร่วมสุขกันมาโดยตลอด", "ex2_en": "The founding partners navigated through <span class=\"hl-teal\">thick and thin</span>, keeping the semiconductor startup afloat during severe microchip shortages.", "ex2_hl": "thick and thin", "ex2_th": "หุ้นส่วนผู้ก่อตั้งร่วมฟันฝ่าผ่านทั้งช่วงดีและร้าย ช่วยกันประคับประคองสตาร์ตอัปเซมิคอนดักเตอร์ให้อยู่รอดได้ท่ามกลางวิกฤตชิปขาดแคลนอย่างรุนแรง", "slot_num": 857, "sheet_no": 9, "first_letter": "T"}, {"id": 602, "orig_slot": "#859", "idiom": "Third time's the charm", "meaning": "Success on the third attempt.", "thai_idiom": "ครั้งที่สามมักสัมฤทธิ์ผล / พยายามครั้งที่สามมักสำเร็จ", "thai_meaning": "ความสำเร็จมักเกิดขึ้นในความพยายามรอบที่สาม หลังจากล้มเหลวมาสองรอบแรก", "ex1_en": "After burning two batches of macarons, Liam sighed with relief on Sunday morning—<span class=\"hl-teal\">third time's the charm</span>!", "ex1_hl": "third time's the charm", "ex1_th": "หลังจากอบมาการองไหม้ไปสองถาด ในที่สุดเช้าวันอาทิตย์เลียมก็ถอนหายใจด้วยความโล่งอก เพราะความพยายามครั้งที่สามสำเร็จจนได้!", "ex2_en": "Following two grounded test flights due to hydraulic pressure leaks, the aerospace team proved that the <span class=\"hl-teal\">third time's the charm</span> as the prototype broke supersonic speed records.", "ex2_hl": "third time's the charm", "ex2_th": "หลังจากการทดสอบการบินถูกยกเลิกไปสองครั้งเนื่องจากระบบไฮดรอลิกรั่ว ทีมวิศวกรรมการบินและอวกาศก็พิสูจน์ว่าครั้งที่สามมักสัมฤทธิ์ผล เมื่อยานต้นแบบทำลายสถิติความเร็วเหนือเสียงได้สำเร็จ", "slot_num": 859, "sheet_no": 9, "first_letter": "T"}, {"id": 603, "orig_slot": "#861", "idiom": "Time and again", "meaning": "Repeatedly.", "thai_idiom": "ครั้งแล้วครั้งเล่า / ซ้ำแล้วซ้ำเล่า", "thai_meaning": "เกิดขึ้นหรือกระทำซ้ำๆ บ่อยครั้งอย่างต่อเนื่อง", "ex1_en": "I've 1_hl": "to step on her toes", "ex1_th": "ฉันลังเลที่จะให้คำแนะนำเรื่องการจัดสวนของเธอ เพราะไม่อยากทำตัวไปก้าวก่ายหรือล้ำเส้น", "ex2_en": "The incoming regional manager scheduled introductory meetings with branch heads to avoid appearing <span class=\"hl-teal\">to step on their toes</span> regarding local hiring.", "ex2_hl": "to step on their toes", "ex2_th": "ผู้จัดการประจำภูมิภาคคนใหม่นัดประชุมเบื้องต้นกับหัวหน้าสาขาต่างๆ เพื่อหลีกเลี่ยงไม่ให้ดูเหมือนเข้าไปก้าวก่ายอำนาจหน้าที่เรื่องการคัดเลือกบุคลากรในท้องถิ่น", "slot_num": 868, "sheet_no": 9, "first_letter": "T"}, {"id": 606, "orig_slot": "#869", "idiom": "To top it off", "meaning": "To add something extra (unpleasant).", "thai_idiom": "ซ้ำร้ายไปกว่านั้น / มิหนำซ้ำ", "thai_meaning": "ยิ่งไปกว่านั้น หรือมีเรื่องแย่ๆ เกิดขึ้นซ้ำเติมสถานการณ์เข้าไปอีก", "ex1_en": "First my car battery died, then I spilled coffee on my clean shirt, and <span class=\"hl-teal\">to top it off</span>, I forgot my house keys.", "ex1_hl": "to top it off", "ex1_th": "ตอนแรกแบตเตอรี่รถก็หมด จากนั้นกาแฟยังหกใส่เสื้อตัวใหม่อีก และซ้ำร้ายไปกว่านั้น ฉันยังลืมกุญแจบ้านทิ้งไว้อีกต่างหาก", "ex2_en": "The quarter brought steep tariff hikes, delayed factory shipments, and <span class=\"hl-teal\">to top it off</span>, a sudden recall of forty thousand units.", "ex2_hl": "to top it off", "ex2_th": "ไตรมาสนี้บริษัทต้องเจอกับกำแพงภาษีที่พุ่งสูง การขนส่งจากโรงงานที่ล่าช้า และมิหนำซ้ำ ยังมีการเรียกคืนสินค้าฉุกเฉินถึงสี่หมื่นชิ้นซ้ำเติมเข้ามาอีก", "slot_num": 869, "sheet_no": 9, "first_letter": "T"}, {"id": 607, "orig_slot": "#870", "idiom": "Top of the line", "meaning": "Best quality.", "thai_idiom": "รุ่นท็อป / เกรดพรีเมียม / ชั้นหนึ่ง", "thai_meaning": "มีคุณภาพยอดเยี่ยมที่สุด ดีที่สุด และทันสมัยที่สุดในบรรดาสินค้าประเภทนั้น", "ex1_en": "For his home recording studio, Julian invested in a <span class=\"hl-teal\">top of the line</span> condenser microphone.", "ex1_hl": "top of the line", "ex1_th": "สำหรับห้องอัดเสียงที่บ้าน จูเลียนยอมลงทุนซื้อไมโครโฟนคอนเด /span> when evaluating their subscription monetization models.", "ex2_hl": "two peas in a pod", "ex2_th": "นักวิเคราะห์ตั้งข้อสังเกตว่า กลุ่มบริษัทยักษ์ใหญ่ด้านเทคโนโลยีที่เป็นคู่แข่งกันนั้นแทบจะถอดแบบกันมาเลยเมื่อพิจารณาจากรูปแบบการสร้างรายได้ผ่านระบบสมาชิก", "slot_num": 874, "sheet_no": 9, "first_letter": "T"}, {"id": 610, "orig_slot": "#875", "idiom": "Under one roof", "meaning": "Living in the same place.", "thai_idiom": "ใต้ชายคาเดียวกัน / ในบ้านหลังเดียวกัน", "thai_meaning": "อาศัย รวมอยู่ หรือดำเนินงานร่วมกันในสถานที่เดียวกัน", "ex1_en": "After college, four childhood friends decided to share a townhouse so they could live <span class=\"hl-teal\">under one roof</span> and split expenses.", "ex1_hl": "under one roof", "ex1_th": "หลังเรียนจบมหาวิทยาลัย เพื่อนสมัยเด็กสี่คนตัดสินใจเช่าทาวน์เฮาส์อยู่ด้วยกันใต้ชายคาเดียวเพื่อช่วยกันหารค่าใช้จ่าย", "ex2_en": "The municipal center consolidated driver licensing, tax registration, and voter services <span class=\"hl-teal\">under one roof</span> to streamline citizen services.", "ex2_hl": "under one roof", "ex2_th": "ศูนย์บริการประชาชนของเทศบาลได้รวบรวมทั้งการทำใบขับขี่ จดทะเบียนภาษี และบริการเลือกตั้งไว้ภายใต้ชายคาเดียวกันเพื่ออำนวยความสะดวกแบบเบ็ดเสร็จแก่ประชาชน", "slot_num": 875, "sheet_no": 9, "first_letter": "U"}, {"id": 611, "orig_slot": "#877", "idiom": "Up in smoke", "meaning": "Failed or destroyed.", "thai_idiom": "มลายหายไปในพริบตา / พังทลายเป็นเถ้าถ่าน / กลายเป็นควัน", "thai_meaning": "ล้มเหลว พังทลาย หรือสูญสลายไปทั้งหมดจนไม่เหลืออะไร", "ex1_en": "Our weekend camping plans went <span class=\"hl-teal\">up in smoke</span> when flash flooding closed every access road into the national park.", "ex1_hl": "up in smoke", "ex1_th": "แผนไปตั้งแคมป์ช่วงวันหยุดสุดสัปดาห์ของเราต้องพังทลายลงในพริบตา เมื่อเหตุน้ำป่าไหลหลากตัดขาดถนนทุกสายที่มุ่งหน้าสู่อุทยานแห่งชาติ", "ex2_en": "Millions of dollars in prospective export revenue went <span class=\"hl-teal\">up in smoke</span> after the port union called an indefinite maritime strike.", "ex2_hl": "up in smoke", "ex2_th": "รายได้จากการส่งออกที่คาดการณ์ไว้หลายล้านดอลลาร์ต้องมลายหายไปในพริบตา หลังจากสหภาพแรงงานท่าเรือประกาศนัดหยุดงานประท้วงอย่างไม่มีกำหนด", "slot_num": 877, "sheet_no": 9, "first_letter": "U"}, {"id": 612, "orig_slot": "#878", "idiom": "Up to the challenge", "meaning": "Ready to do something difficult.", "thai_idiom": "พร้อมลุย / สู้ไม่ถอย / รับมือไหว", "thai_meaning": "มีความพร้อม ความมุ่งมั่น และความสามารถเพียงพอที่จะรับมือกับงานหรืออุปสรรคที่ยากลำบาก", "ex1_en": "Although she had never baked for fifty guests before, Clara felt confident and <span class=\"hl-teal\">up to the challenge</span>.", "ex1_hl": "up to the challenge", "ex1_th": "แม้จะไม่เคยอบขนมสำหรับแขกถึงห้าสิบคนมาก่อน คลาร่าก็รู้สึกมั่นใจและพร้อมลุยเต็มที่", "ex2_en": "Selected to guide the restructuring during severe insolvency, the turnaround specialist proved fully <span class=\"hl-teal\">up to the challenge</span>.", "ex2_hl": "up to the challenge", "ex2_th": "เมื่อได้รับเลือกให้เข้ามาคุมการปรับโครงสร้างองค์กรท่ามกลางวิกฤตหนี้สินขั้นรุนแรง ผู้เชี่ยวชาญด้านการฟื้นฟูกิจการได้พิสูจน์ให้เห็นว่าเขาสามารถรับมือกับความท้าทายนี้ได้อย่างยอดเยี่ยม", "slot_num": 878, "sheet_no": 9, "first_letter": "U"}, {"id": 613, "orig_slot": "#879", "idiom": "Use your head", "meaning": "Think carefully.", "thai_idiom": "ใช้หัวคิด / คิดหน้าคิดหลัง", "thai_meaning": "คิดไตร่ตรองให้รอบคอบก่อนทำ, ใช้เหตุผลและสติปัญญา", "ex1_en": "Before you click on suspicious links in that unexpected text message, <span class=\"hl-teal\">use your head</span> and check the sender's phone number.", "ex1_hl": "use your head", "ex1_th": "ก่อนที่คุณจะกดลิงก์แปลกๆ ในข้อความที่ไม่คาดคิด ใช้หัวคิดสักนิดแล้วเช็กเบอร์ผู้ส่งก่อนนะ", "ex2_en": "The plant manager reminded the technicians to <span class=\"hl-teal\">use their heads</span> rather than rushing into repairs without consulting the safety protocol.", "ex2_hl": "use their heads", "ex2_th": "ผู้จัดการโรงงานเตือนช่างเทคนิคให้ใช้ความคิดและวิจารณญาณ แทนที่จะรีบซ่อมโดยไม่ตรวจสอบขั้นตอนความปลอดภัย", "slot_num": 879, "sheet_no": 9, "first_letter": "U"}, {"id": 614, "orig_slot": "#880", "idiom": "Walk the extra mile", "meaning": "Do more than expected.", "thai_idiom": "ทุ่มเทเกินร้อย / ทำเกินหน้าที่", "thai_meaning": "พยายามทุ่มเทเป็นพิเศษมากกว่าที่คาดหวังหรือกำหนดไว้", "ex1_en": "Uncle Ben always <span class=\"hl-teal\">walks the extra mile</span> for his neighbors by shoveling their driveways after heavy snowstorms.", "ex1_hl": "walks the extra mile", "ex1_th": "ลุงเบนทุ่มเทช่วยเหลือเพื่อนบ้านเกินร้อยเสมอ ด้วยการช่วยโกยหิมะออกจากทางเข้าบ้านให้หลังจากพายุหิมะพัดกระหน่ำ", "ex2_en": "Our customer success team is willing to <span class=\"hl-teal\">walk the extra mile</span> to troubleshoot client software issues over the weekend.", "ex2_hl": "walk the extra mile", "ex2_th": "ทีมดูแลลูกค้าของเรายินดีที่จะทุ่มเทช่วยเหลือเกินหน้าที่เพื่อช่วยแก้ไขปัญหาซอฟต์แวร์ให้ลูกค้าตลอดช่วงสุดสัปดาห์", "slot_num": 880, "sheet_no": 9, "first_letter": "W"}, {"id": 615, "orig_slot": "#881", "idiom": "Wallflower", "meaning": "A shy person at a social event.", "thai_idiom": "คนขี้อายชอบปลีกวิเวก / ดอกไม้ริมกำแพง", "thai_meaning": "คนที่เคอะเขินขี้อาย มักยืนเก้ๆ กังๆ อยู่ริมห้องหรือไม่สุงสิงกับใครในงานสังคม", "ex1_en": "At the school dance, Leo felt like a complete <span class=\"hl-teal\">wallflower</span>, sipping punch by himself near the exit.", "ex1_hl": "wallflower", "ex1_th": "ในงานเต้นรำของโรงเรียน ลีโอรู้สึกเหมือนเป็นคนขี้อายที่ถูกทิ้งไว้ข้างกำแพง ได้แต่ยืนจิบน้ำผลไม้อยู่คนเดียวแถวประตูทางออก", "ex2_en": "The networking mixer was designed with interactive icebreakers so that even an introverted <span class=\"hl-teal\">wallflower</span> could connect easily with industry leaders.", "ex2_hl": "wallflower", "ex2_th": "งานพบปะเครือข่ายธุรกิจนี้ได้รับการออกแบบกิจกรรมละลายพฤติกรรม เพื่อให้แม้แต่คนที่ขี้อายชอบเก็บตัวก็สามารถสร้างคอนเนกชันกับผู้นำในวงการได้อย่างง่ายดาย", "slot_num": 881, "sheet_no": 9, "first_letter": "W"}, {"id": 616, "orig_slot": "#882", "idiom": "Want something on a silver platter", "meaning": "Expect everything easily.", "thai_idiom": "นอนรอเสิร์ฟถึงปาก / นอนรอรับส้มหล่น", "thai_meaning": "คาดหวังว่าจะได้สิ่งที่ต้องการมาง่ายๆ โดยไม่ต้องออกแรงเหน็ดเหนื่อยหรือพยายามด้วยตัวเอง", "ex1_en": "You can't just lounge on the couch playing video games and <span class=\"hl-teal\">want good grades on a silver platter</span>.", "ex1_hl": "want good grades on a silver platter", "ex1_th": "ลูกจะมานอนเล่นวิดีโอเกมบนโซฟาทั้งวันแล้วหวังจะได้ผลการเรียนดีๆ มาเสิร์ฟถึงมือเฉยๆ ไม่ได้หรอกนะ", "ex2_en": "The managing director emphasized that entry-level associates who <span class=\"hl-teal\">want promotions on a silver platter</span> rarely thrive in this competitive consulting firm.", "ex2_hl": "want promotions on a silver platter", "ex2_th": "กรรมการผู้จัดการย้ำว่า พนักงานระดับเริ่มต้นที่คาดหวังจะได้เลื่อนตำแหน่งมาเสิร์ฟถึงมือโดยไม่ต้องสร้างผลงาน มักจะเติบโตได้ยากในบริษัทที่ปรึกษาที่มีการแข่งขันสูงแห่งนี้", "slot_num": 882, "sheet_no": 9, "first_letter": "W"}, {"id": 617, "orig_slot": "#883", "idiom": "Watch your mouth", "meaning": "Be careful what you say.", "thai_idiom": "ระวังปากระวังคำ / ระวังคำพูดหน่อย", "thai_meaning": "พูดจาให้สุภาพสำรวม, ระมัดระวังไม่พูดสิ่งที่ไม่เหมาะสมหรือหยาบคาย", "ex1_en": "Mom warned Tommy to <span class=\"hl-teal\">watch his mouth</span> after he snapped rudely at his younger sister at the dinner table.", "ex1_hl": "watch his mouth", "ex1_th": "แม่เตือนให้ทอมมี่ระวังปากระวังคำ หลังจากที่เขาตวาดใส่น้องสาวอย่างหยาบคายที่โต๊ะอาหารเย็น", "ex2_en": "During tense union arbitration hearings, both corporate spokespersons were advised by counsel to <span class=\"hl-teal\">watch their mouths</span> to avoid defamation lawsuits.", "ex2_hl": "watch their mouths", "ex2_th": "ระหว่างการไต่สวนอนุญาโตตุลาการร่วมกับสหภาพแรงงานที่มีบรรยากาศตึงเครียด ทนายความได้เตือนให้โฆษกของทั้งสองฝ่ายระวังคำพูดอย่างเคร่งครัดเพื่อเลี่ยงการฟ้องร้องคดีหมิ่นประมาท", "slot_num": 883, "sheet_no": 9, "first_letter": "W"}, {"id": 618, "orig_slot": "#884", "idiom": "Waves of change", "meaning": "Many changes happening.", "thai_idiom": "คลื่นแห่งความเปลี่ยนแปลง / กระแสการเปลี่ยนแปลงระลอกใหญ่", "thai_meaning": "การเปลี่ยนแปลงครั้งใหญ่หลายระลอกที่เกิดขึ้นอย่างต่อเนื่องและส่งผลกระทบในวงกว้าง", "ex1_en": "After graduating from college, moving to a new city brought continuous <span class=\"hl-teal\">waves of change</span> into Maya's daily routine.", "ex1_hl": "waves of change", "ex1_th": "หลังจากเรียนจบมหาวิทยาลัย การย้ายไปอยู่เมืองใหม่ก็นำพาคลื่นแห่งความเปลี่ยนแปลงระลอกใหญ่เข้ามาสู่ชีวิตประจำวันของมายา", "ex2_en": "The rapid development of generative artificial intelligence has triggered irresistible <span class=\"hl-teal\">waves of change</span> across corporate marketing departments.", "ex2_hl": "waves of change", "ex2_th": "การเติบโตอย่างก้าวกระโดดของปัญญาประดิษฐ์เชิงสร้างสรรค์ได้จุดชนวนคลื่นแห่งความเปลี่ยนแปลงระลอกใหญ่ในแผนกการตลาดขององค์กรต่างๆ ทั่วโลก", "slot_num": 884, "sheet_no": 9, "first_letter": "W"}, {"id": 619, "orig_slot": "#889", "idiom": "Whisper down the lane", "meaning": "Share private information.", "thai_idiom": "กระซิบต่อๆ กันมา / ข่าวลือปากต่อปาก", "thai_meaning": "การส่งต่อข้อมูลหรือข่าวลือแบบปากต่อปาก ซึ่งมักผิดเพี้ยนไปจากข้อเท็จจริงเรื่อยๆ", "ex1_en": "By the time the gossip traveled like <span class=\"hl-teal\">whisper down the lane</span> to our homeroom, Sarah was falsely rumored to be moving to Canada.", "ex1_hl": "whisper down the lane", "ex1_th": "เมื่อข่าวซุบซิบแพร่สะพัดแบบกระซิบต่อๆ กันมาจนถึงห้องโฮมรูมของเรา ก็มีข่าวลือมั่วๆ ไปแล้วว่าซาร่าห์จะย้ายไปแคนาดา", "ex2_en": "Instead of relying on <span class=\"hl-teal\">whisper down the lane</span> regarding organizational restructuring, the CEO held an all-hands meeting to share verifiable facts.", "ex2_hl": "whisper down the lane", "ex2_th": "แทนที่จะปล่อยให้พนักงานฟังข่าวลือที่กระซิบต่อๆ กันมาเรื่องการปรับโครงสร้างองค์กร ซีอีโอจึงจัดประชุมพนักงานทุกคนเพื่อชี้แจงข้อเท็จจริงที่ตรวจสอบได้", "slot_num": 889, "sheet_no": 9, "first_letter": "W"}, {"id": 620, "orig_slot": "#890", "idiom": "Wide awake", "meaning": "Very alert.", "thai_idiom": "ตาสว่างโล่ / ตื่นเต็มตา", "thai_meaning": "ตื่นตัวเต็มที่ ไม่ง่วงนอน มีสติรับรู้อย่างแจ่มชัด", "ex1_en": "Even though it was three in the morning, the sudden loud thunder kept me <span class=\"hl-teal\">wide awake</span> in bed.", "ex1_hl": "wide awake", "ex1_th": "แม้จะเป็นเวลาตีสามแล้ว แต่เสียงฟ้าร้องฟ้าผ่าสนั่นที่ดังขึ้นกะทันหันก็ทำให้ฉันนอนตาสว่างโล่อยู่บนเตียง", "ex2_en": "Emergency room physicians must remain <span class=\"hl-teal\">wide awake</span> and razor-sharp during grueling overnight trauma shifts.", "ex2_hl": "wide awake", "ex2_th": "แพทย์แผนกฉุกเฉินต้องตื่นตัวเต็มที่และมีสมาธิเฉียบคมอยู่ตลอดเวลาในระหว่างการเข้าเวรอุบัติเหตุข้ามคืนอันหนักหน่วง", "slot_num": 890, "sheet_no": 9, "first_letter": "W"}, {"id": 621, "orig_slot": "#891", "idiom": "Word of mouth", "meaning": "Information shared by people.", "thai_idiom": "การบอกต่อปากต่อปาก / กระแสปากต่อปาก", "thai_meaning": "การเผยแพร่ข้อมูล ข่าวสาร หรือคำแนะนำจากคนหนึ่งสู่อีกคนหนึ่งผ่านการพูดคุย", "ex1_en": "We discovered this hidden neighborhood bakery purely through <span class=\"hl-teal\">word of mouth</span> from our apartment concierge.", "ex1_hl": "word of mouth", "ex1_th": "เราค้นพบร้านเบเกอรี่ลับในชุมชนแห่งนี้ได้จากคำบอกเล่าปากต่อปากของเจ้าหน้าที่ดูแลคอนโดแท้ๆ", "ex2_en": "The artisanal coffee brand built a multi-million-dollar direct-to-consumer business relying almost entirely on organic <span class=\"hl-teal\">word of mouth</span> rather than paid advertisements.", "ex2_hl": "word of mouth", "ex2_th": "แบรนด์กาแฟคราฟต์สามารถสร้างธุรกิจขายตรงสู่ผู้บริโภคมูลค่าหลายล้านดอลลาร์ได้โดยอาศัยกระแสบอกต่อแบบปากต่อปากตามธรรมชาติเป็นหลัก แทนการทุ่มเงินซื้อโฆษณา", "slot_num": 891, "sheet_no": 9, "first_letter": "W"}, {"id": 622, "orig_slot": "#898", "idiom": "Zip your lips", "meaning": "Keep quiet.", "thai_idiom": "รูดซิปปาก / ปิดปากให้เงียบ", "thai_meaning": "ห้ามพูด, เก็บความ _en": "Whenever you're ready to tell me what happened on your blind date, <span class=\"hl-teal\">I'm all ears</span>.", "ex1_hl": "I'm all ears", "ex1_th": "ถ้าเธอพร้อมจะเล่าให้ฟังว่าการนัดบอดเมื่อวานเป็นยังไงบ้างล่ะก็ ฉันเปิดหูรอฟังอยู่นะ", "ex2_en": "If anyone has concrete strategies to reduce our departmental overhead costs by fifteen percent, <span class=\"hl-teal\">I'm all ears</span>.", "ex2_hl": "I'm all ears", "ex2_th": "หากใครมีกลยุทธ์ที่เป็นรูปธรรมในการลดต้นทุนการดำเนินงานของแผนกลงได้สิบห้าเปอร์เซ็นต์ ผมก็พร้อมรับฟังอย่างเต็มที่เลยครับ", "slot_num": 912, "sheet_no": 10, "first_letter": "I"}, {"id": 625, "orig_slot": "#913", "idiom": "Keep in mind", "meaning": "Remember.", "thai_idiom": "จำใส่ใจไว้ / พึงระลึกไว้ว่า", "thai_meaning": "จดจำไว้, คำนึงถึง, อย่าลืมนำเรื่องนี้มาพิจารณาประกอบ", "ex1_en": "When you pack your suitcase for Seattle, <span class=\"hl-teal\">keep in mind</span> that it rains frequently in November.", "ex1_hl": "keep in mind", "ex1_th": "เวลาจัดกระเป๋าเดินทางไปซีแอตเทิล ให้พึงจำไว้เสมอว่าที่นั่นฝนตกบ่อยมากในเดือนพฤศจิกายน", "ex2_en": "Financial analysts should always <span class=\"hl-teal\">keep in mind</span> currency exchange volatility when projecting overseas quarterly revenues.", "ex2_hl": "keep in mind", "ex2_th": "นักวิเคราะห์การเงินควรคำนึงถึงความผันผวนของอัตราแลกเปลี่ยนเงินตราอยู่เสมอ ในการคาดการณ์รายได้รายไตรมาสจากต่างประเทศ", "slot_num": 913, "sheet_no": 10, "first_letter": "K"}, {"id": 626, "orig_slot": "#915", "idiom": "Make it up as you go along", "meaning": "Do something without planning.", "thai_idiom": "ด้นสด / คิดไปทำไป / แก้ปัญหาเฉพาะหน้าไปเรื่อยๆ", "thai_meaning": "ทำสิ่งใดสิ่งหนึ่งโดยไม่ได้วางแผนล่วงหน้า คิดหรือคิดค้นขึ้นมาสดๆ ในขณะที่กำลังทำอยู่", "ex1_en": "I forgot the exact brownie recipe, so I had to just <span class=\"hl-teal\">make it up as I went along</span> using whatever was in the pantry.", "ex1_hl": "make it up as I went along", "ex1_th": "ฉันลืมสูตรทำบราวนี่ที่แน่นอน ก็เลยต้องด้นสดทำไปเรื่อยๆ เท่าที่มีของอยู่ในตู้กับข้าว", "ex2_en": "Entering an unfamiliar overseas market without conducting feasibility studies forces executives to <span class=\"hl-teal\">make it up as they go along</span>, which dramatically increases operational risk.", "ex2_hl": "make it up as they go along", "ex2_th": "การเจาะตลาดต่างประเทศที่ไม่คุ้นเคยโดยไม่ทำการศึกษาความเป็นไปได้ บีบให้ผู้บริหารต้องด้นสดวางแผนไปทำไป ซึ่งเพิ่มความเสี่ยงในการดำเนินงานอย่างมหาศาล", "slot_num": 915, "sheet_no": 10, "first_letter": "M"}, {"id": 627, "orig_slot": "#927", "idiom": "A fair-weather friend", "meaning": "A friend only in good times.", "thai_idiom": "เพื่อนกิน / เพื่อนกินหาง่าย เพื่อนตายหายาก", "thai_meaning": "เพื่อนที่อยู่ด้วยเฉพาะเวลาที่เราสุขสบายหรือมีผลประโยชน์ แต่พอเราตกทุกข์ได้ยากก็ทอดทิ้ง", "ex1_en": "When Greg lost his car and ran out of cash, he quickly realized that Julian was merely <span class=\"hl-teal\">a fair-weather friend</span>.", "ex1_hl": "a fair-weather friend", "ex1_th": "พอกลางคราวเคราะห์เกร็กต้องเสียรถไปแถมเงินหมดกระเป๋า เขาก็ตระหนักได้ทันทีว่าจูเลียนเป็นแค่เพื่อนกินที่คบได้เฉพาะตอนสบายเท่านั้น", "ex2_en": "In the cutthroat political arena, an ally who disappears the moment your polling numbers drop is nothing more than <span class=\"hl-teal\">a fair-weather friend</span>.", "ex2_hl": "a fair-weather friend", "ex2_th": "ในสมรภูมิการเมืองอันดุเดือด พันธมิตรที่หายตัวไปทันทีที่คะแนนนิยมของคุณตกต่ำลง ก็ไม่ต่างอะไรกับเพื่อนกินที่หวังพึ่งพิงเฉพาะช่วงรุ่งเรือง", "slot_num": 927, "sheet_no": 10, "first_letter": "A"}, {"id": 628, "orig_slot": "#934", "idiom": "Get a second wind", "meaning": "Find new energy.", "thai_idiom": "ฮึดสู้ขึ้นมาใหม่ / มีแรงฮึดอีกระลอก", "thai_meaning": "กลับมามีพละกำลังหรือความกระปรี้กระเปร่าอีกครั้งหลังจากเหน็ดเหนื่อยอ่อนล้า", "ex1_en": "Around mile eighteen of the marathon, Karen felt completely exhausted, but the cheering crowd helped her <span class=\"hl-teal\">get a second wind</span>.", "ex1_hl": "get a second wind", "ex1_th": "แถวกิโลเมตรที่สิบแปดของการวิ่งมาราธอน คาเรนรู้สึกหมดแรงแทบก้าวขาไม่ออก แต่เสียงเชียร์ของฝูงชนช่วยให้เธอมีแรงฮึดสู้อีกครั้ง", "ex2_en": "After drinking a shot of espresso at midnight, the software development team <span class=\"hl-teal\">got a second wind</span> and resolved the critical deployment bug.", "ex2_hl": "got a second wind", "ex2_th": "หลังจากดื่มกาแฟเอสเปรสโซตอนเที่ยงคืน ทีมพัฒนาซอฟต์แวร์ก็มีแรงฮึดขึ้นมาใหม่และร่วมมือกันแก้บั๊กสำคัญของการปล่อยระบบได้สำเร็จ", "slot_num": 934, "sheet_no": 10, "first_letter": "G"}, {"id": 629, "orig_slot": "#937", "idiom": "Look on the bright side", "meaning": "Stay positive.", "thai_idiom": "มองโลกในแง่ดี / มองหาแง่บวก", "thai_meaning": "พยายามมองหาสิ่งดีๆ หรือแง่มุมบวกในสถานการณ์ที่ยากลำบากหรือไม่น่าพึงพอใจ", "ex1_en": "Our flight was delayed by four hours, but trying to <span class=\"hl-teal\">look on the bright side</span>, we found a fantastic bookstore inside the terminal.", "ex1_hl": "look on the bright side", "ex1_th": "เที่ยวบินของเราล่าช้าไปสี่ชั่วโมง แต่ถ้าพยายามมองโลกในแง่ดี เราก็ได้เจอร้านหนังสือดีๆ ร้านหนึ่งในสนามบิน", "ex2_en": "Although we did not win the primary government tender, our CEO encouraged us to <span class=\"hl-teal\">look on the bright side</span> and leverage the prototype for commercial clients.", "ex2_hl": "look on the bright side", "ex2_th": "แม้พวกเราจะไม่ชนะการประมูลโครงการหลักของรัฐ แต่ซีอีโอก็ให้กำลังใจให้มองในแง่ดีและนำตัวต้นแบบนี้ไปต่อยอดขายให้กับลูกค้าภาคเอกชนแทน", "slot_num": 937, "sheet_no": 10, "first_letter": "L"}, {"id": 630, "orig_slot": "#944", "idiom": "Too many cooks spoil the broth", "meaning": "Too many people can ruin it.", "thai_idiom": "มากหมอมากความ / หลายคนหลายความคิดจนงานเสีย", "thai_meaning": "ถ้ามีคนเข้ามาสั่งการหรือร่วมทำสิ่งหนึ่งมากเกินไป ผลงานอาจยุ่งเหยิงและล้มเหลว", "ex1_en": "Let just one person organize the camping trip itinerary; otherwise, <span class=\"hl-teal\">too many cooks spoil the broth</span>.", "ex1_hl": "too many cooks spoil the broth", "ex1_th": "ให้คนคนเดียวเป็นคนจัดแผนทริปแคมปิ้งเถอะ ไม่อย่างนั้นเดี๋ยวจะเข้าตำรามากหมอมากความจนตกลงกันไม่ได้", "ex2_en": "Assigning five senior art directors to design a single brand logo proved counterproductive, as <span class=\"hl-teal\">too many cooks spoil the broth</span>.", "ex2_hl": "too many cooks spoil the broth", "ex2_th": "การมอบหมายให้อาร์ตไดเรกเตอร์ระดับอาวุโสถึงห้าคนมาออกแบบโลโก้แบรนด์เพียงชิ้นเดียวกลับให้ผลตรงกันข้าม เพราะมากคนก็มากความจนหาข้อสรุปไม่ได้", "slot_num": 944, "sheet_no": 10, "first_letter": "T"}, {"id": 631, "orig_slot": "#945", "idiom": "Turn over a new leaf", "meaning": "Start a new life.", "thai_idiom": "กลับตัวกลับใจ / เริ่มต้นชีวิตใหม่ / ปรับปรุงตัวใหม่", "thai_meaning": "เปลี่ยนแปลงพฤติกรรมไปในทางที่ดีขึ้น, ละทิ้งนิสัยเดิมเพื่อเริ่มต้นทำสิ่งใหม่ที่ดีกว่า", "ex1_en": "Ever since January, Mark has <span class=\"hl-teal\">turned over a new leaf</span> by waking up at dawn and jogging five miles every morning.", "ex1_hl": "turned over a new leaf", "ex1_th": "ตั้งแต่เดือนมกราคมเป็นต้นมา มาร์กได้ปรับปรุงตัวเองใหม่ด้วยการตื่นนอนตั้งแต่เช้าตรู่และวิ่งจ็อกกิ้งห้าไมล์ทุกเช้า", "ex2_en": "Following the accounting audit inquiry, the regional retail firm promised regulators that it would <span class=\"hl-teal\">turn over a new leaf</span> by implementing complete financial transparency.", "ex2_hl": "turn over a new leaf", "ex2_th": "ภายหลังการตรวจสอบบัญชี บริษัทค้าปลีกระดับภูมิภาคสัญญาต่อหน่วยงานกำกับดูแลว่าจะปรับปรุงแนวทางใหม่ทั้งหมดโดยนำความโปร่งใสทางการเงินมาใช้อย่างเคร่งครัด", "slot_num": 945, "sheet_no": 10, "first_letter": "T"}, {"id": 632, "orig_slot": "#948", "idiom": "Waste not, want not", "meaning": "Don't waste things.", "thai_idiom": "กินใช้อย่างรู้คุณค่าจะไม่มีวันขาดแคลน / ไม่สุรุ่ยสุร่ายก็ไม่อับจน", "thai_meaning": "หากเราไม่ใช้จ่ายหรือทิ้งขว้างสิ่งของอย่างสิ้นเปลือง เราก็จะไม่ต้องเผชิญกับความขาดแคลนในภายหลัง", "ex1_en": "Grandma always saves vegetable peelings and chicken bones to simmer flavorful broth, quoting her favorite motto, '<span class=\"hl-teal\">Waste not, want not</span>.'", "ex1_hl": "Waste not, want not", "ex1_th": "คุณยายมักจะเก็บเศษผักและกระดูกไก่ไว้ต้มน้ำซุปแสนอร่อยเสมอ พร้อมกับยกคติประจำใจว่า 'กินใช้อย่างรู้คุณค่า ยามยากจะได้ไม่อัตคัด'", "ex2_en": "The factory reduced operating costs and landfill waste by establishing a circular recycling system governed by the principle of '<span class=\"hl-teal\">waste not, want not</span>.'", "ex2_hl": "waste not, want not", "ex2_th": "โรงงานสามารถลดต้นทุนการดำเนินงานและปริมาณขยะฝังกลบได้ด้วยการวางระบบรีไซเคิลแบบหมุนเวียนภายใต้หลักการที่ว่า 'ไม่สูญเปล่า ก็ไม่ขาดแคลน'", "slot_num": 948, "sheet_no": 10, "first_letter": "W"}, {"id": 633, "orig_slot": "#950", "idiom": "A barking dog doesn't bite", "meaning": "A person who threatens is not dangerous.", "thai_idiom": "หมาเห่าใบตองแห้ง / คนที่ชอบขู่มักไม่กล้าลงมือจริง", "thai_meaning": "คนที่ชอบส่งเสียงเอะอะหรือพูดจาข่มขู่เสียงดัง มักเป็นคนที่ไม่กล้าทำอะไรจริงจังหรือไม่มีพิษสงอะไร", "ex1_en": "Don't be intimidated by the angry landlord shouting through the hallway; <span class=\"hl-teal\">a barking dog doesn't bite</span>.", "ex1_hl": "a barking dog doesn't bite", "ex1_th": "อย่าไปกลัวเจ้าของห้องเช่าที่ตะโกนโวยวายอยู่ตรงโถงทางเดินเลย คนประเภทนี้ก็แค่หมาเห่าใบตองแห้ง ไม่มีพิษภัยอะไรหรอก", "ex2_en": "Our legal advisor reassured the negotiators that the rival CEO's loud threats of litigation were baseless because <span class=\"hl-teal\">a barking dog doesn't bite</span>.", "ex2_hl": "a barking dog doesn't bite", "ex2_th": "ที่ปรึกษากฎหมายให้ความมั่นใจแก่คณะเจรจาว่า คำขู่ฟ้องร้องอันเกรี้ยวกราดของซีอีโอคู่แข่งไม่มีน้ำหนักอะไร เพราะพวกที่ชอบส่งเสียงขู่มักไม่กล้าลงมือทำจริง", "slot_num": 950, "sheet_no": 10, "first_letter": "A"}, {"id": 634, "orig_slot": "#955", "idiom": "Call someone out", "meaning": "Challenge someone.", "thai_idiom": "ตักเตือนต่อหน้า / แฉพฤติกรรม / ท้าทายให้รับผิดชอบ", "thai_meaning": "ชี้ให้เห็นความผิดพลาดหรือวิพากษ์วิจารณ์การกระทำของใครบางคนอย่างตรงไปตรงมาต่อหน้าสาธารณะ", "ex1_en": "When David made an offensive joke at the dinner party, Emma didn't hesitate to <span class=\"hl-teal\">call him out</span>.", "ex1_hl": "call him out", "ex1_th": "เมื่อเดวิดเล่นมุกตลกที่หยาบคายในงานเลี้ยงมื้อค่ำ เอ็มม่าก็ไม่ลังเลที่จะตักเตือนและท้วงติงเขาตรงนั้นทันที", "ex2_en": "Environmental activists publicly <span class=\"hl-teal\">called out</span> the multinational corporation for deceptive greenwashing claims.", "ex2_hl": "called out", "ex2_th": "กลุ่มนักเคลื่อนไหวด้านสิ่งแวดล้อมได้ออกมาวิพากษ์วิจารณ์และแฉพฤติกรรมฟอกเขียวที่หลอกลวงของบรรษัทข้ามชาติต่อสาธารณะ", "slot_num": 955, "sheet_no": 10, "first_letter": "C"}, {"id": 635, "orig_slot": "#956", "idiom": "Can't have your cake and eat it too", "meaning": "You can't have two good things at once.", "thai_idiom": "จะจับปลาสองมือไม่ได้ / ได้อย่างก็ต้องเสียอย่าง", "thai_meaning": "ไม่สามารถครอบครองข้อดีหรือผลประโยชน์สองอย่างที่ขัดแย้งกันในเวลาเดียวกันได้ ต้องเลือกอย่างใดอย่างหนึ่ง", "ex1_en": "You want to sleep in until noon every Saturday but still finish all your chores before lunch, but you <span class=\"hl-teal\">can't have your cake and eat it too</span>.", "ex1_hl": "can't have your cake and eat it too", "ex1_th": "เธออยากจะนอนตื่นสายจนถึงเที่ยงทุกวันเสาร์แต่ก็อยากทำงานบ้านเสร็จก่อนมื้อเที่ยงด้วย มันเป็นไปไม่ได้หรอก ได้อย่างก็ต้องเสียอย่างสิ", "ex2_en": "The CFO reminded the product managers that they <span class=\"hl-teal\">cannot have their cake and eat it too</span> when demanding luxury build quality at bottom-tier manufacturing costs.", "ex2_hl": "cannot have their cake and eat it too", "ex2_th": "ประธานเจ้าหน้าที่ฝ่ายการเงินเตือนผู้จัดการผลิตภัณฑ์ว่า จะเอาทั้งสองอย่างพร้อมกันไม่ได้ หากต้องการชิ้นงานเกรดพรีเมียมแต่จะจ่ายค่าผลิตในราคาที่ถูกที่สุด", "slot_num": 956, "sheet_no": 10, "first_letter": "C"}, {"id": 636, "orig_slot": "#960", "idiom": "Diamond in the rough", "meaning": "Hidden talent.", "thai_idiom": "เพชรในตม / ช้างเผือกในป่า", "thai_meaning": "คนที่มีความสามารถหรือคุณสมบัติดีเด่นซ่อนอยู่ แต่ยังขาดการขัดเกลาหรือยังไม่ได้รับการเปิดเผย", "ex1_en": "That run-down vintage house on Maple Street looks unappealing now, but with some renovation, it could be a real <span class=\"hl-teal\">diamond in the rough</span>.", "ex1_hl": "diamond in the rough", "ex1_th": "บ้านเก่าวินเทจสภาพทรุดโทรมบนถนนเมเปิลอาจดูไม่น่าอยู่ตอนนี้ แต่ถ้าได้รับการรีโนเวทใหม่ มันจะเป็นเพชรเม็ดงามที่ซ่อนอยู่แน่นอน", "ex2_en": "The talent scout recognized that the self-taught software coder was a true <span class=\"hl-teal\">diamond in the rough</span> who only needed professional mentorship.", "ex2_hl": "diamond in the rough", "ex2_th": "แมวมองฝ่ายสรรหาบุคลากรตระหนักว่าโปรแกรมเมอร์ที่เรียนรู้ด้วยตนเองคนนี้คือเพชรในตมตัวจริง ซึ่งต้องการเพียงแค่ผู้ให้คำแนะนำระดับมืออาชีพมาขัดเกลาเท่านั้น", "slot_num": 960, "sheet_no": 10, "first_letter": "D"}, {"id": 637, "orig_slot": "#961", "idiom": "Don't beat yourself up", "meaning": "Don't be too hard on yourself.", "thai_idiom": "อย่าโทษตัวเองมากเกินไป / อย่าซ้ำเติมตัวเอง", "thai_meaning": "อย่าเฆี่ยนตีจิตใจหรือตำหนิตัวเองอย่างรุนแรงกับความผิดพลาดที่เกิดขึ้นไปแล้ว", "ex1_en": "You only missed one question on your driving test, so <span class=\"hl-teal\">don't beat yourself up</span> about it.", "ex1_hl": "don't beat yourself up", "ex1_th": "เธอตอบผิดไปแค่ข้อเดียวเองในการสอบใบขับขี่ อย่ามัวแต่โทษตัวเองหรือคิดมากไปเลยนะ", "ex2_en": "After the client rejected our initial sales pitch, the director told the junior executive, '<span class=\"hl-teal\">Don't beat yourself up</span>; we will refine our deck for the next presentation.'", "ex2_hl": "Don't beat yourself up", "ex2_th": "หลังจากลูกค้าปฏิเสธข้อเสนอขายรอบแรก ผู้อำนวยการก็บอกกับพนักงานรุ่นน้องว่า 'อย่าซ้ำเติมตัวเองเลย เดี๋ยวเราช่วยกันปรับแก้สไลด์สำหรับนำเสนอในรอบต่อไป'", "slot_num": 961, "sheet_no": 10, "first_letter": "D"}, {"id": 638, "orig_slot": "#962", "idiom": "Don't bite the hand that feeds you", "meaning": "Don't harm the one who helps you.", "thai_idiom": "อย่ากินบนเรือนขี้รดบนหลังคา / อย่าเนรคุณผู้มีพระคุณ", "thai_meaning": "อย่าทำร้าย ขัดแข้งขัดขา หรือทรยศต่อผู้ที่คอยเกื้อหนุน จุนเจือ หรือช่วยเหลือเรา", "ex1_en": "Your aunt let you live rent-free for six months, so complaining about her cooking is like <span class=\"hl-teal\">biting the hand that feeds you</span>.", "ex1_hl": "biting the hand that feeds you", "ex1_th": "คุณป้าให้อยู่บ้านฟรีตั้งหกเดือนโดยไม่คิดค่าเช่า การที่เธอไปบ่นเรื่องอาหารฝีมือป้าก็เหมือนการเนรคุณคนที่มีบุญคุณต่อเรานะ", "ex2_en": "Leaking internal proprietary documents to a rival firm while collecting a generous research grant is a dangerous case of <span class=\"hl-teal\">biting the hand that feeds you</span>.", "ex2_hl": "biting the hand that feeds you", "ex2_th": "การปล่อยเอกสารสิทธิบัตรลับภายในรั่วไหลไปให้บริษัทคู่แข่งในขณะที่ยังรับเงินทุนวิจัยก้อนโตอยู่ ถือเป็นพฤติกรรมเนรคุณผู้สนับสนุนที่เสี่ยงภัยอย่างยิ่ง", "slot_num": 962, "sheet_no": 10, "first_letter": "D"}, {"id": 639, "orig_slot": "#965", "idiom": "Hard nut to crack", "meaning": "Difficult to understand.", "thai_idiom": "เคี้ยวยาก / ปัญหาที่แก้ไม่ตก / คนที่เจาะใจยาก", "thai_meaning": "ปัญหาที่ยากจะแก้ไข หรือบุคคลที่เข้าถึง ทำความเข้าใจ หรือเกลี้ยกล่อมได้ยากยิ่ง", "ex1_en": "Grandpa rarely expresses his emotions, making him a remarkably <span class=\"hl-teal\">hard nut to crack</span> during family gatherings.", "ex1_hl": "hard nut to crack", "ex1_th": "คุณปู่แทบไม่เคยแสดงอารมณ์ความรู้สึกออกมาเลย ทำให้แกเป็นคนที่เข้าถึงและเดาใจยากเป็นพิเศษในระหว่างการรวมญาติ", "ex2_en": "Securing regulatory compliance approval for medical software in the European Union proved to be a notoriously <span class=\"hl-teal\">hard nut to crack</span>.", "ex2_hl": "hard nut to crack", "ex2_th": "การขออนุมัติด้านการปฏิบัติตามกฎระเบียบสำหรับซอฟต์แวร์ทางการแพทย์ในสหภาพยุโรปกลายเป็นโจทย์หินที่เคี้ยวยากอย่างยิ่ง", "slot_num": 965, "sheet_no": 10, "first_letter": "H"}, {"id": 640, "orig_slot": "#968", "idiom": "Keep the faith", "meaning": "Stay hopeful.", "thai_idiom": "รักษาความหวังไว้ / อย่าเพิ่งหมดศรัทธา", "thai_meaning": "รักษาความเชื่อมั่น ความหวัง และมองในแง่ดีต่อไปแม้กำลังเผชิญกับอุปสรรคขวากหนาม", "ex1_en": "Even while searching for months without a callback, Maria told her brother to <span class=\"hl-teal\">keep the faith</span> during his job hunt.", "ex1_hl": "keep the faith", "ex1_th": "แม้จะหางานมาหลายเดือนโดยไม่มีการติดต่อกลับ มาเรียก็ยังบอกให้น้องชายอย่าเพิ่งหมดหวังและเชื่อมั่นต่อไป", "ex2_en": "During the prolonged economic downturn, the startup founder urged all early employees to <span class=\"hl-teal\">keep the faith</span> as new enterprise contracts were finalized.", "ex2_hl": "keep the faith", "ex2_th": "ท่ามกลางภาวะเศรษฐกิจซบเซาที่ยืดเยื้อ ผู้ก่อตั้งสตาร์ตอัปได้กระตุ้นเตือนให้พนักงานรุ่นบุกเบิกทุกคนรักษาความเชื่อมั่นไว้ ในขณะที่สัญญาระดับองค์กรฉบับใหม่กำลังเข้าสู่ขั้นตอนสุดท้าย", "slot_num": 968, "sheet_no": 10, "first_letter": "K"}, {"id": 641, "orig_slot": "#970", "idiom": "More than one way to skin a cat", "meaning": "Many ways to do the same thing.", "thai_idiom": "มีวิธีตั้งหลายทางที่จะไปถึงเป้าหมาย / ถนนไม่ได้มีสายเดียว", "thai_meaning": "มีหลากหลายวิธีในการบรรลุวัตถุประสงค์เดียวกัน ไม่จำเป็นต้องยึดติดกับวิธีการเพียงแบบเดียว", "ex1_en": "If you don't have a corkscrew to open that bottle, remember there's <span class=\"hl-teal\">more than one way to skin a cat</span>—we can use a key or a screw.", "ex1_hl": "more than one way to skin a cat", "ex1_th": "ถ้าเธอไม่มีที่เปิดไวน์สำหรับเปิดขวดนั้น จำไว้ว่ามีตั้งหลายวิธีที่จะแก้ปัญหาได้ เราเอาลูกกุญแจหรือตะปูควงมาช่วยเปิดก็ได้", "ex2_en": "When the primary server migration failed, the engineering lead reminded the team that there is <span class=\"hl-teal\">more than one way to skin a cat</span> and initiated containerized backup deployment.", "ex2_hl": "more than one way to skin a cat", "ex2_th": "เมื่อการย้ายระบบเซิร์ฟเวอร์หลักล้มเหลว หัวหน้าทีมวิศวกรได้เตือนทีมว่าทางแก้ปัญหานั้นไม่ได้มีเพียงทางเดียว พร้อมกับสั่งเปิดใช้งานระบบสำรองแบบคอนเทนเนอร์ทันที", "slot_num": 970, "sheet_no": 10, "first_letter": "M"}, {"id": 642, "orig_slot": "#971", "idiom": "No news is good news", "meaning": "If there's no news, it's good.", "thai_idiom": "ไม่มีข่าวคือข่าวดี", "thai_meaning": "หากยังไม่ได้รับข่าวคราวใดๆ ก็แสดงว่าไม่มีเรื่องเลวร้ายเกิดขึ้น เพราะถ้ามีเรื่องร้าย ข่าวมักจะมาถึงอย่างรวดเร็ว", "ex1_en": "We haven't received the lab test results yet, but my mother comforted me by saying that <span class=\"hl-teal\">no news is good news</span>.", "ex1_hl": "no news is good news", "ex1_th": "พวกเรายังไม่ได้รับผลตรวจจากห้องแล็บเลย แต่แม่ก็ปลอบใจฉันว่าไม่มีข่าวก็แสดงว่าเป็นข่าวดีนะ", "ex2_en": "While awaiting regulatory feedback on the aerospace merger, senior partners adopted the mindset that <span class=\"hl-teal\">no news is good news</span>.", "ex2_hl": "no news is good news", "ex2_th": "ในระหว่างรอการตอบกลับจากหน่วยงานกำกับดูแลเกี่ยวกับการควบรวมกิจการการบิน หุ้นส่วนระดับสูงต่างมองว่าการที่ยังไม่มีข่าวสารใดๆ เข้ามาถือเป็นสัญญาณที่ดี", "slot_num": 971, "sheet_no": 10, "first_letter": "N"}, {"id": 643, "orig_slot": "#978", "idiom": "Speak your mind", "meaning": "Say what you believe.", "thai_idiom": "พูดสิ่งที่คิดอย่างตรงไปตรงมา / เปิดใจพูดความจริง", "thai_meaning": "แสดงความคิดเห็น ความเชื่อ หรือความรู้สึกของตนเองออกมาอย่างเปิดเผยและตรงไปตรงมา", "ex1_en": "Don't just agree with whatever movie everyone else picks; feel free to <span class=\"hl-teal\">speak your mind</span>.", "ex1_hl": "speak your mind", "ex1_th": "ไม่ต้องเออออตามหนังที่คนอื่นเลือกไปหมดหรอกนะ มีความคิดเห็นยังไงก็พูดออกมาตรงๆ ได้เลย", "ex2_en": "The managing director fostered a culture of psychological safety where team members could <span class=\"hl-teal\">speak their minds</span> without fear of retribution.", "ex2_hl": "speak their minds", "ex2_th": "กรรมการผู้จัดการได้สร้างวัฒนธรรมความปลอดภัยทางจิตวิทยาในที่ทำงาน ซึ่งสมาชิกในทีมสามารถแสดงความคิดเห็นอย่างตรงไปตรงมาได้โดยไม่ต้องกลัวว่าจะถูกตำหนิหรือลงโทษ", "slot_num": 978, "sheet_no": 10, "first_letter": "S"}, {"id": 644, "orig_slot": "#980", "idiom": "The proof is in the pudding", "meaning": "The result shows the truth.", "thai_idiom": "ผลงานเป็นเครื่องพิสูจน์ / ดูที่ผลลัพธ์จริง", "thai_meaning": "คุณค่า ประสิทธิภาพ หรือความจริงแท้ของสิ่งใดสิ่งหนึ่ง จะพิสูจน์ได้ก็ต่อเมื่อได้ลองใช้หรือเห็นผลลัพธ์จริงเท่านั้น", "ex1_en": "He claims this new stain remover works miracles on red wine spills, but <span class=\"hl-teal\">the proof is in the pudding</span>.", "ex1_hl": "the proof is in the pudding", "ex1_th": "เขาอ้างว่าน้ำยาขจัดคราบตัวใหม่นี้ลบคราบไวน์แดงได้อย่างปาฏิหาริย์ แต่ของแบบนี้ผลลัพธ์จากการใช้งานจริงต่างหากที่จะเป็นเครื่องพิสูจน์", "ex2_en": "Management boasted about the efficiency of their new automation software, but <span class=\"hl-teal\">the proof was in the pudding</span> when quarterly fulfillment speeds doubled.", "ex2_hl": "the proof was in the pudding", "ex2_th": "ฝ่ายบริหารคุยโวเกี่ยวกับประสิทธิภาพของซอฟต์แวร์อัตโนมัติตัวใหม่ แต่ผลงานจริงก็เป็นเครื่องพิสูจน์ได้ชัดเจนเมื่อความเร็วในการส่งมอบสินค้าประจำไตรมาสเพิ่มขึ้นเป็นสองเท่า", "slot_num": 980, "sheet_no": 10, "first_letter": "T"}, {"id": 645, "orig_slot": "#981", "idiom": "There's no such thing as a free lunch", "meaning": "Everything has a cost.", "thai_idiom": "ของฟรีไม่มีในโลก", "thai_meaning": "ทุกสิ่งทุกอย่างล้วนมีต้นทุนหรือสิ่งแลกเปลี่ยนเสมอ ไม่มีสิ่งใดที่เราจะได้มาโดยไม่ต้องเสียอะไรเลย", "ex1_en": "That website offers a free smartphone for answering surveys, but <span class=\"hl-teal\">there's no such thing as a free lunch</span>—they will sell your personal data.", "ex1_hl": "there's no such thing as a free lunch", "ex1_th": "เว็บไซต์นั้นแจกสมาร์ตโฟนฟรีเพียงแค่ตอบแบบสอบถาม แต่ของฟรีไม่มีในโลกหรอก พวกเขาจะเอาข้อมูลส่วนตัวของคุณไปขายต่อแน่นอน", "ex2_en": "The economist warned investors that zero-commission trading platforms recoup profits through widened bid-ask spreads, proving that <span class=\"hl-teal\">there is no such thing as a free lunch</span>.", "ex2_hl": "there is no such thing as a free lunch", "ex2_th": "นักเศรษฐศาสตร์เตือนนักลงทุนว่า แพลตฟอร์มการซื้อขายแบบปลอดค่าคอมมิชชันแอบคืนทุนด้วยส่วนต่างราคาซื้อขายที่กว้างขึ้น ซึ่งพิสูจน์ว่าของฟรีไม่มีในโลกจริงๆ", "slot_num": 981, "sheet_no": 10, "first_letter": "T"}, {"id": 646, "orig_slot": "#983", "idiom": "Too little, too late", "meaning": "Too late to be useful.", "thai_idiom": "สายเกินแก้ / น้อยเกินไปและช้าเกินแก้", "thai_meaning": "การช่วยเหลือหรือมาตรการแก้ไขที่มีปริมาณน้อยเกินไป และมาถึงช้าเกินกว่าจะช่วยกอบกู้สถานการณ์ได้", "ex1_en": "Apologizing to your sister three weeks after ruining her favorite dress is <span class=\"hl-teal\">too little, too late</span>.", "ex1_hl": "too little, too late", "ex1_th": "การมาขอโทษพี่สาวหลังจากทำชุดตัวโปรดของเธอพังไปตั้งสามสัปดาห์ มันสายเกินแก้และไม่มีความหมายอะไรแล้ว", "ex2_en": "The emergency loan package offered by the central bank proved to be <span class=\"hl-teal\">too little, too late</span> to rescue the collapsing regional lender.", "ex2_hl": "too little, too late", "ex2_th": "มาตรการปล่อยกู้ฉุกเฉินจากธนาคารกลางกลายเป็นมาตรการที่น้อยเกินไปและมาช้าเกินแก้ จนไม่สามารถกอบกู้ธนาคารระดับภูมิภาคที่กำลังล้มละลายได้ทัน", "slot_num": 983, "sheet_no": 10, "first_letter": "T"}, {"id": 647, "orig_slot": "#984", "idiom": "Walk in someone's shoes", "meaning": "Understand their situation.", "thai_idiom": "เอาใจใส่เขามาใส่ใจเรา / สวมวิญญาณเป็นเขา / ลองไปยืนในจุดที่เขายืน", "thai_meaning": "พยายามทำความเข้าใจสถานการณ์ ความรู้สึก หรือความยากลำบากของผู้อื่นโดยการจินตนาการว่าตนเองอยู่ในจุดนั้น", "ex1_en": "Before you criticize single parents for being exhausted, try to <span class=\"hl-teal\">walk in their shoes</span> for just one weekend.", "ex1_hl": "walk in their shoes", "ex1_th": "ก่อนที่คุณจะไปตำหนิพ่อแม่เลี้ยงเดี่ยวว่าดูเหนื่อยล้า ลองไปยืนในจุดที่พวกเขาอยู่และใช้ชีวิตแบบนั้นดูสักสุดสัปดาห์สิ", "ex2_en": "Our product design team conducted field immersion studies to <span class=\"hl-teal\">walk in the shoes</span> of elderly users with visual impairments.", "ex2_hl": "walk in the shoes", "ex2_th": "ทีมออกแบบผลิตภัณฑ์ของเราได้ลงพื้นที่สำรวจข้อมูลเพื่อลองสวมบทบาทเป็นผู้ใช้งานสูงวัยที่มีความบกพร่องทางการมองเห็นอย่างแท้จริง", "slot_num": 984, "sheet_no": 10, "first_letter": "W"}, {"id": 648, "orig_slot": "#985", "idiom": "Watch this space", "meaning": "Wait for upcoming news.", "thai_idiom": "โปรดติดตามตอนต่อไป / คอยจับตาดูให้ดี", "thai_meaning": "ให้คอยติดตามดูข้อมูลข่าวสารหรือความคืบหน้าที่กำลังจะเปิดเผยในเร็วๆ นี้", "ex1_en": "We are announcing our summer road trip destination on Instagram tomorrow, so <span class=\"hl-teal\">watch this space</span>!", "ex1_hl": "watch this space", "ex1_th": "พวกเราจะประกาศจุดหมายปลายทางของทริปขับรถเที่ยวช่วงฤดูร้อนในอินสตาแกรมพรุ่งนี้ คอยติดตามกันให้ดีนะ!", "ex2_en": "The tech startup teased a breakthrough renewable energy storage patent, concluding their press release with '<span class=\"hl-teal\">watch this space</span>.'", "ex2_hl": "watch this space", "ex2_th": "สตาร์ตอัปสายเทคโนโลยีได้แย้มถึงสิทธิบัตรระบบกักเก็บพลังงานหมุนเวียนสุดล้ำ พร้อมทิ้งท้ายแถลงการณ์ว่า 'โปรดจับตาดูความคืบหน้าเร็วๆ นี้'", "slot_num": 985, "sheet_no": 10, "first_letter": "W"}, {"id": 649, "orig_slot": "#988", "idiom": "All talk and no action", "meaning": "Talking without doing.", "thai_idiom": "ดีแต่พูด / มีแต่ราคาคุย", "thai_meaning": "คนที่ชอบพูดจาใหญ่โตหรือสัญญาไว้มากมาย แต่ไม่เคยลงมือทำอะไรให้เห็นเป็นรูปธรรม", "ex1_en": "Sam kept promising to help me paint the garage, but he turned out to be <span class=\"hl-teal\">all talk and no action</span>.", "ex1_hl": "all talk and no action", "ex1_th": "แซมสัญญาเป็นมั่นเป็นเหมาะว่าจะมาช่วยฉันทาสีโรงรถ แต่สุดท้ายก็เป็นแค่พวกดีแต่พูด ไม่ยอมลงมือทำอะไรสักอย่าง", "ex2_en": "Voters grew disillusioned with municipal council members who proved to be <span class=\"hl-teal\">all talk and no action</span> regarding pothole repairs.", "ex2_hl": "all talk and no action", "ex2_th": "ผู้มีสิทธิเลือกตั้งเริ่มหมดศรัทธาในสมาชิกสภาเทศบาลที่มีแต่ราคาคุยเรื่องการซ่อมแซมถนนที่เป็นหลุมเป็นบ่อ แต่ไม่เคยลงมือแก้ไขจริงจัง", "slot_num": 988, "sheet_no": 10, "first_letter": "A"}, {"id": 650, "orig_slot": "#990", "idiom": "Been there, done that", "meaning": "Have already experienced.", "thai_idiom": "ผ่านจุดนั้นมาแล้ว / เคยเจอมาหมดแล้ว", "thai_meaning": "เคยมีประสบการณ์หรือผ่านเรื่องราวแบบนั้นมาแล้ว มักใช้บอกว่าคุ้นเคยดีจนไม่รู้สึกตื่นเต้นหรือแปลกใจอะไรอีก", "ex1_en": "When Jenny complained about staying up all night studying for calculus, her older brother replied, '<span class=\"hl-teal\">Been there, done that</span>.'", "ex1_hl": "Been there, done that", "ex1_th": "เมื่อเจนนี่บ่นเรื่องต้องอดนอนทั้งคืนเพื่ออ่านหนังสือสอบแคลคูลัส พี่ชายของเธอก็ตอบกลับว่า 'พี่เคยผ่านจุดนั้นมาหมดแล้วน่า'", "ex2_en": "Senior software architects viewed the latest management methodology trend with skepticism, adopting a '<span class=\"hl-teal\">been there, done that</span>' attitude.", "ex2_hl": "been there, done that", "ex2_th": "สถาปนิกซอฟต์แวร์ระดับอาวุโสมองกระแสวิธีบริหารงานแบบใหม่ด้วยความกังขา พร้อมกับมีทัศนคติในทำนองว่า 'พวกเราเคยลองทำมาหมดแล้ว'", "slot_num": 990, "sheet_no": 10, "first_letter": "B"}, {"id": 651, "orig_slot": "#992", "idiom": "Don't look a gift horse in the mouth", "meaning": "Don't complain about something free.", "thai_idiom": "อย่าเรื่องมากกับของที่ได้มาฟรี / ได้ฟรีแล้วอย่าช่างติ", "thai_meaning": "เมื่อได้รับของขวัญหรือสิ่งของมาฟรีๆ ก็อย่าไปจับผิด ติเตียน หรือหาข้อบกพร่องของสิ่งนั้น", "ex1_en": "Even if your uncle's hand-me-down car has a few scratches, <span class=\"hl-teal\">don't look a gift horse in the mouth</span>.", "ex1_hl": "don't look a gift horse in the mouth", "ex1_th": "ถึงแม้รถยนต์มือสองที่คุณลุงยกให้ฟรีจะมีรอยขีดข่วนอยู่บ้าง แต่ได้ของฟรีมาแล้วก็อย่าเรื่องมากช่างติไปเลย", "ex2_en": "When the landlord granted the non-profit organization two months of free office rent, the executive director told the staff <span class=\"hl-teal\">not to look a gift horse in the mouth</span> despite the outdated carpeting.", "ex2_hl": "not to look a gift horse in the mouth", "ex2_th": "เมื่อเจ้าของตึกอนุญาตให้องค์กรไม่แสวงหากำไรใช้พื้นที่สำนักงานฟรีสองเดือน ผู้อำนวยการบริหารจึงบอกพนักงานว่าอย่าไปเรื่องมากกับของฟรี แม้ว่าพรมในห้องจะดูเก่าไปหน่อยก็ตาม", "slot_num": 992, "sheet_no": 10, "first_letter": "D"}, {"id": 652, "orig_slot": "#995", "idiom": "Like a bull in a china shop", "meaning": "Behave roughly in a delicate place.", "thai_idiom": "ซุ่มซ่ามงุ่มง่าม / ช้างเหยียบนา พญาเหยียบเมือง / เก้งก้างทำลายข้าวของ", "thai_meaning": "ประพฤติตัวซุ่มซ่าม หยาบกระด้าง หรือไร้ความระมัดระวังในสถานการณ์หรือสถานที่ที่ต้องการความประณีตละเอียดอ่อน", "ex1_en": "My clumsy teenage brother walked around the antique glassware shop <span class=\"hl-teal\">like a bull in a china shop</span>, knocking over a crystal vase.", "ex1_hl": "like a bull in a china shop", "ex1_th": "น้องชายวัยรุ่นจอมซุ่มซ่ามของฉันเดินเก้งก้างอยู่ในร้านขายเครื่องแก้วโบราณราวกับวัวกระทิงหลุดเข้าไปในร้านกระเบื้องเคลือบ จนชนแจกันคริสตัลล้มคว่ำ", "ex2_en": "The aggressive negotiator barged into diplomatic treaty talks <span class=\"hl-teal\">like a bull in a china shop</span>, alienating several foreign delegates.", "ex2_hl": "like a bull in a china shop", "ex2_th": "ผู้แทนเจรจาที่มีท่าทีก้าวร้าวบุกเข้าไปในเวทีเจรจาสนธิสัญญาทางการทูตอย่างขาดความรอบคอบและนุ่มนวล จนทำให้ผู้แทนจากต่างประเทศหลายคนรู้สึกเอือมระอา", "slot_num": 995, "sheet_no": 10, "first_letter": "L"}, {"id": 653, "orig_slot": "#997", "idiom": "One step at a time", "meaning": "Do things slowly and steadily.", "thai_idiom": "ทีละขั้นทีละตอน / ค่อยเป็นค่อยไป", "thai_meaning": "ทำสิ่งต่างๆ อย่างช้าๆ รอบคอบ และเป็นขั้นเป็นตอน ไม่ใจร้อนเร่งรีบจนเกินไป", "ex1_en": "Learning a new language can feel overwhelming at first, but you just have to take it <span class=\"hl-teal\">one step at a time</span>.", "ex1_hl": "one step at a time", "ex1_th": "การเรียนภาษาใหม่อาจทำให้รู้สึกท้อและรับมือยากในช่วงแรก แต่เธอแค่ต้องค่อยเป็นค่อยไปทีละขั้นทีละตอน", "ex2_en": "During the complex database cloud migration, the systems engineer recommended tackling security configurations <span class=\"hl-teal\">one step at a time</span> to avoid system downtime.", "ex2_hl": "one step at a time", "ex2_th": "ในระหว่างการย้ายฐานข้อมูลอันซับซ้อนขึ้นสู่ระบบคลาวด์ วิศวกรระบบแนะนำให้จัดการการตั้งค่าความปลอดภัยทีละขั้นทีละตอนเพื่อป้องกันไม่ให้ระบบหยุดทำงาน", "slot_num": 997, "sheet_no": 10, "first_letter": "O"}, {"id": 654, "orig_slot": "#999", "idiom": "Truth is stranger than fiction", "meaning": "Real life is more surprising than stories.", "thai_idiom": "เรื่องจริงยิ่งกว่านิยาย", "thai_meaning": "เหตุการณ์ที่เกิดขึ้นจริงในชีวิตจริงมักจะแปลกประหลาด น่าเหลือเชื่อ หรือพิสดารยิ่งกว่าเรื่องที่แต่งขึ้นในนิยาย", "ex1_en": "When the lost wedding ring was discovered ten years later wrapped around a homegrown carrot in our garden, it proved that <span class=\"hl-teal\">truth is stranger than fiction</span>.", "ex1_hl": "truth is stranger than fiction", "ex1_th": "เมื่อแหวนแต่งงานที่หายไปสิบปีถูกพบว่าคล้องอยู่รอบหัวแครอทที่ปลูกไว้ในสวนหลังบ้าน มันก็พิสูจน์ให้เห็นเลยว่าเรื่องจริงยิ่งกว่านิยาย", "ex2_en": "Investigative reporters covering the corporate espionage conspiracy noted that <span class=\"hl-teal\">truth is stranger than fiction</span> when discovering wiretaps inside the boardroom.", "ex2_hl": "truth is stranger than fiction", "ex2_th": "นักข่าวสืบสวนที่เกาะติดคดีสมคบคิดจารกรรมข้อมูลทางธุรกิจตั้งข้อสังเกตว่าเรื่องจริงยิ่งกว่านิยาย เมื่อตรวจพบเครื่องดักฟังแอบซ่อนอยู่ภายในห้องประชุมบอร์ดบริหาร", "slot_num": 999, "sheet_no": 10, "first_letter": "T"}, {"id": 655, "orig_slot": "Doc #11", "idiom": "Nail it", "meaning": "do something perfectly", "thai_idiom": "ทำได้เป๊ะ / เข้าเป้าอย่างจัง / ทำได้ยอดเยี่ยมไร้ที่ติ", "thai_meaning": "ทำสิ่งใดสิ่งหนึ่งได้สำเร็จอย่างงดงาม ไร้ที่ติ หรือทำได้ตามเป้าหมายอย่างแม่นยำ", "ex1_en": "I was so nervous before my driving test, but my instructor said I totally <span class=\"hl-teal\">nailed it</span> on the parallel parking.", "ex1_hl": "nailed it", "ex1_th": "ฉันประหม่ามากก่อนสอบใบขับขี่ แต่ครูฝึกบอกว่าฉันเข้าซองขนานได้เป๊ะเวอร์ไร้ที่ติเลย", "ex2_en": "The marketing team really <span class=\"hl-teal\">nailed it</span> with the new product launch campaign, exceeding quarterly revenue targets by twenty percent.", "ex2_hl": "nailed it", "ex2_th": "ทีมการตลาดทำแคมเปญเปิดตัวผลิตภัณฑ์ใหม่ได้เข้าเป้าอย่างยอดเยี่ยม จนดันยอดขายไตรมาสเกินเป้าไปถึงยี่สิบเปอร์เซ็นต์", "slot_num": 11, "sheet_no": 1, "first_letter": "N"}, {"id": 656, "orig_slot": "Doc #13", "idiom": "Pay through the nose", "meaning": "pay a lot", "thai_idiom": "จ่ายแพงหูฉี่ / จ่ายเลือดซิบ / โดนฟันหัวแบะ", "thai_meaning": "ต้องจ่ายเงินในราคาที่แพงเกินจริงหรือแพงลิบลิ่ว", "ex1_en": "Because we booked our flights at the very last minute during New Year's Eve, we had to <span class=\"hl-teal\">pay through the nose</span> for economy seats.", "ex1_hl": "pay through the nose", "ex1_th": "เพราะพวกเราดันจองตั๋วเครื่องบินช่วงเคานต์ดาวน์ปีใหม่เอาวินาทีสุดท้าย เลยต้องจ่ายแพงหูฉี่แม้กระทั่งที่นั่งชั้นประหยัด", "ex2_en": "Independent clinics often complain that they <span class=\"hl-teal\">pay through the nose</span> for proprietary medical software licenses.", "ex2_hl": "pay through the nose", "ex2_th": "คลินิกเอกชนขนาดเล็กมักร้องเรียนว่าต้องแบกรับค่าลิขสิทธิ์ซอฟต์แวร์ทางการแพทย์ในราคาที่แพงมหาโหด", "slot_num": 13, "sheet_no": 1, "first_letter": "P"}, {"id": 657, "orig_slot": "Doc #17", "idiom": "Run out of time", "meaning": "have no time left", "thai_idiom": "หมดเวลา / เวลาจวนตัว / เวลาหมดลง", "thai_meaning": "เวลาที่มีอยู่หมดลงจนทำสิ่งนั้นไม่ทันหรือไม่เสร็จสิ้น", "ex1_en": "We were having such a blast reminiscing about college that we <span class=\"hl-teal\">ran out of time</span> before even ordering dessert.", "ex1_hl": "ran out of time", "ex1_th": "พวกเรามัวแต่นั่งคุยรำลึกความหลังสมัยมหาวิทยาลัยกันเพลินจนหมดเวลา ทั้งที่ยังไม่ได้สั่งของหวานเลยด้วยซ้ำ", "ex2_en": "The defense attorneys warned the judge that they were rapidly <span class=\"hl-teal\">running out of time</span> to review the thousands of newly disclosed documents before trial.", "ex2_hl": "running out of time", "ex2_th": "ทนายฝ่ายจำเลยเตือนผู้พิพากษาว่าเวลากำลังจะหมดลงอย่างรวดเร็ว สำหรับการตรวจสอบเอกสารพยานหลักฐานใหม่หลายพันฉบับก่อนการพิจารณาคดีจะเริ่มขึ้น", "slot_num": 17, "sheet_no": 1, "first_letter": "R"}, {"id": 658, "orig_slot": "Doc #19", "idiom": "Song and dance", "meaning": "extra effort or show", "thai_idiom": "เล่นใหญ่ / แก้ตัวน้ำขุ่นๆ / พิธีรีตองยืดยาว", "thai_meaning": "การอธิบายหรือแก้ตัวที่เยิ่นเย้อ ชักแม่น้ำทั้งห้า หรือการทำเรื่องให้เอิกเกริกเกินความจำเป็นเพื่อเบี่ยงเบนประเด็น", "ex1_en": "When I asked my roommate why he hadn't cleaned the kitchen, he gave me this whole <span class=\"hl-teal\">song and dance</span> about his hectic study schedule.", "ex1_hl": "song and dance", "ex1_th": "พอฉันถามรูมเมตว่าทำไมถึงยังไม่ยอมทำความสะอาดครัว เขาก็พล่ามแก้ตัวน้ำขุ่นๆ ชักแม่น้ำทั้งห้าเรื่องตารางอ่านหนังสือที่แสนยุ่งเหยิง", "ex2_en": "Instead of providing a straightforward revenue forecast, the contractor made a big <span class=\"hl-teal\">song and dance</span> about unforeseen supply chain disruptions.", "ex2_hl": "song and dance", "ex2_th": "แทนที่จะรายงานประมาณการรายได้มาตรงๆ ผู้รับเหมากลับเล่นใหญ่ชักแม่น้ำทั้งห้าอ้างเรื่องภาวะสะดุดของห่วงโซ่อุปทานที่คาดเดาไม่ได้", "slot_num": 19, "sheet_no": 1, "first_letter": "S"}, {"id": 659, "orig_slot": "Doc #27", "idiom": "A light at the end of the tunnel", "meaning": "hope", "thai_idiom": "แสงสว่างที่ปลายอุโมงค์ / ประกายแห่งความหวัง", "thai_meaning": "สัญญาณแห่งความหวังหรือสิ่งบ่งบอกว่าช่วงเวลาอันยากลำบากกำลังจะผ่านพ้นไป", "ex1_en": "After months of grueling physical therapy following my knee surgery, I finally see <span class=\"hl-teal\">a light at the end of the tunnel</span> now that I can walk unassisted.", "ex1_hl": "a light at the end of the tunnel", "ex1_th": "หลังผ่านการทำกายภาพบำบัดอย่างทรหดมานานหลายเดือนหลังผ่าตัดหัวเข่า ในที่สุดฉันก็เริ่มเห็นแสงสว่างที่ปลายอุโมงค์เมื่อกลับมาเดินเองได้โดยไม่ต้องพยุง", "ex2_en": "Macroeconomic indicators suggest <span class=\"hl-teal\">a light at the end of the tunnel</span> for the manufacturing sector after three consecutive quarters of contraction.", "ex2_hl": "a light at the end of the tunnel", "ex2_th": "ดัชนีชี้วัดทางเศรษฐกิจมหภาคบ่งชี้ถึงแสงสว่างที่ปลายอุโมงค์สำหรับภาคการผลิต หลังจากเผชิญภาวะหดตัวติดต่อกันถึงสามไตรมาส", "slot_num": 27, "sheet_no": 1, "first_letter": "A"}, {"id": 660, "orig_slot": "Doc #38", "idiom": "Chop and change", "meaning": "keep changing", "thai_idiom": "เปลี่ยนไปเปลี่ยนมา / โลเลไม่นิ่ง / พลิกไปพลิกมา", "thai_meaning": "เปลี่ยนแปลงความคิด แผนการ หรือวิธีการอยู่บ่อยครั้งจนเอาแน่เอานอนไม่ได้", "ex1_en": "Stop <span class=\"hl-teal\">chopping and changing</span> your holiday plans, or all the affordable hotel rooms will be booked up!", "ex1_hl": "chopping and changing", "ex1_th": "เลิกเปลี่ยนไปเปลี่ยนมาเรื่องแผนไปเที่ยววันหยุดได้แล้ว ไม่งั้นห้องพักโรงแรมราคาจับต้องได้จะถูกจองเต็มหมดนะ!", "ex2_en": "The software project suffered severe delays because senior management continually <span class=\"hl-teal\">chopped and changed</span> core feature requirements mid-sprint.", "ex2_hl": "chopped and changed", "ex2_th": "โครงการพัฒนาซอฟต์แวร์ต้องล่าช้าออกไปอย่างมาก เพราะผู้บริหารระดับสูงเปลี่ยนความต้องการฟีเจอร์หลักไปๆ มาๆ อยู่ตลอดกลางคันของการทำงาน", "slot_num": 38, "sheet_no": 1, "first_letter": "C"}, {"id": 661, "orig_slot": "Doc #44", "idiom": "Dear diary", "meaning": "write a personal record", "thai_idiom": "ไดอารี่ที่รัก / เขียนระบายความในใจ / บันทึกเรื่องราวส่วนตัว", "thai_meaning": "คำขึ้นต้นสมุดบันทึกส่วนตัว หรือใช้สื่อถึงการเขียนระบายความรู้สึก ความในใจ และเรื่องส่วนตัวอย่างลึกซึ้ง", "ex1_en": "Whenever I feel overwhelmed with life, I sit down with a cup of chamomile tea and write a '<span class=\"hl-teal\">Dear diary</span>' entry to untangle my thoughts.", "ex1_hl": "Dear diary", "ex1_th": "เวลาที่ฉันรู้สึกแบกรับเรื่องราวในชีวิตไม่ไหว ฉันมักจะนั่งลงจิบชาคาโมมายล์แล้วเขียนระบายความในใจลงสมุดบันทึกเพื่อคลี่คลายความคิดที่ยุ่งเหยิง", "ex2_en": "The author's latest memoir deliberately avoids the self-absorbed '<span class=\"hl-teal\">dear diary</span>' tone, opting instead for a rigorous sociological critique.", "ex2_hl": "dear diary", "ex2_th": "หนังสือบันทึกความทรงจำเล่มล่าสุดของนักเขียนจงใจหลีกเลี่ยงน้ำเสียงแบบฟูมฟายเพ้อรำพันส่วนตัว โดยเลือกที่จะนำเสนอการวิพากษ์ทางสังคมวิทยาอันเข้มข้นแทน", "slot_num": 44, "sheet_no": 1, "first_letter": "D"}, {"id": 662, "orig_slot": "Doc #45", "idiom": "Deep pockets", "meaning": "have a lot of money", "thai_idiom": "กระเป๋าหนัก / สายป่านยาว / ทุนหนา", "thai_meaning": "มีเงินทุน ทรัพยากรทางการเงิน หรือฐานะร่ำรวยมหาศาล", "ex1_en": "You'll need pretty <span class=\"hl-teal\">deep pockets</span> if you plan to dine at Michelin-starred restaurants every weekend.", "ex1_hl": "deep pockets", "ex1_th": "เธอคงต้องกระเป๋าหนักน่าดูเลยนะ ถ้าคิดจะไปรับประทานอาหารที่ร้านระดับมิชลินสตาร์ทุกสุดสัปดาห์", "ex2_en": "Early-stage biotech startups often partner with pharmaceutical giants that possess the <span class=\"hl-teal\">deep pockets</span> required for multi-phase clinical trials.", "ex2_hl": "deep pockets", "ex2_th": "สตาร์ทอัปด้านเทคโนโลยีชีวภาพระยะเริ่มต้นมักจับมือเป็นพันธมิตรกับบริษัทยายักษ์ใหญ่ที่มีสายป่านยาวพอจะรองรับการทดลองทางคลินิกหลายระยะ", "slot_num": 45, "sheet_no": 1, "first_letter": "D"}, {"id": 663, "orig_slot": "Doc #47", "idiom": "Drink the Kool-Aid", "meaning": "believe something uncritically", "thai_idiom": "เชื่อหัวปักหัวปำ / ถูกล้างสมอง / คล้อยตามอย่างไม่ลืมหูลืมตา", "thai_meaning": "หลงเชื่อความคิด อุดมการณ์ หรือคำชวนเชื่ออย่างหน้ามืดตามัวโดยปราศจากการไตร่ตรอง", "ex1_en": "I know everyone is raving about that new detox tea, but don't <span class=\"hl-teal\">drink the Kool-Aid</span> before consulting an actual physician.", "ex1_hl": "drink the Kool-Aid", "ex1_th": "ฉันรู้ว่าใครๆ ก็เห่อชาดีท็อกซ์ตัวใหม่นั่น แต่อย่าเพิ่งไปเชื่อหัวปักหัวปำก่อนจะได้ปรึกษาแพทย์ตัวจริงนะ", "ex2_en": "Several veteran analysts warned that market speculators had <span class=\"hl-teal\">drunk the Kool-Aid</span> regarding generative AI startups, driving valuations to unsustainable peaks.", "ex2_hl": "drunk the Kool-Aid", "ex2_th": "นักวิเคราะห์รุ่นเก๋าหลายรายเตือนว่านักเก็งกำไรในตลาดกำลังเชื่อตามกระแสสตาร์ทอัปปัญญาประดิษฐ์อย่างหน้ามืดตามัว จนผลักดันมูลค่าบริษัทให้พุ่งสูงเกินความเป็นจริง", "slot_num": 47, "sheet_no": 1, "first_letter": "D"}, {"id": 664, "orig_slot": "Doc #48", "idiom": "Drive someone up the wall", "meaning": "annoy someone", "thai_idiom": "กวนประสาทจนแทบบ้า / ปั่นประสาท / ทำให้หงุดหงิดจนทนไม่ไหว", "thai_meaning": "ทำให้อีกฝ่ายรำคาญ หงุดหงิด หรือโมโหอย่างรุนแรงจนแทบควบคุมอารมณ์ไม่ได้", "ex1_en": "My upstairs neighbor taps his heels incessantly on the hardwood floor, and it’s <span class=\"hl-teal\">driving me up the wall</span>.", "ex1_hl": "driving me up the wall", "ex1_th": "เพื่อนบ้านห้องข้างบนเคาะส้นเท้าลงบนพื้นไม้ไม่หยุดหย่อน จนมันกำลังกวนประสาทฉันจนแทบบ้าตายอยู่แล้ว", "ex2_en": "Constant bureaucratic micromanagement and conflicting directives from leadership were <span class=\"hl-teal\">driving the engineers up the wall</span>.", "ex2_hl": "driving the engineers up the wall", "ex2_th": "การจู้จี้จุกจิกแบบระบบราชการและคำสั่งที่ขัดแย้งกันเองจากฝ่ายบริหาร กำลังสร้างความหงุดหงิดรำคาญใจให้แก่ทีมวิศวกรจนแทบทนไม่ไหว", "slot_num": 48, "sheet_no": 1, "first_letter": "D"}, {"id": 665, "orig_slot": "Doc #50", "idiom": "Fall apart", "meaning": "break down emotionally", "thai_idiom": "สติแตก / ใจสลายพังทลาย / พังไม่เป็นท่า", "thai_meaning": "ควบคุมอารมณ์ไม่อยู่จนจิตใจพังทลาย หรือระบบ/ข้อตกลงล้มเหลวไม่เป็นท่า", "ex1_en": "She managed to stay composed throughout the memorial service, but she completely <span class=\"hl-teal\">fell apart</span> once she returned home alone.", "ex1_hl": "fell apart", "ex1_th": "เธอพยายามเก็บอาการได้ดีตลอดพิธีไว้อาลัย แต่แล้วก็ใจสลายพังทลายปล่อยโฮออกมาทันทีที่กลับมาถึงบ้านคนเดียว", "ex2_en": "The international trade negotiations <span class=\"hl-teal\">fell apart</span> when neither side proved willing to compromise on agricultural import tariffs.", "ex2_hl": "fell apart", "ex2_th": "การเจรจาการค้าระหว่างประเทศพังไม่เป็นท่า เมื่อไม่มีฝ่ายใดยอมประนีประนอมในเรื่องอัตราภาษีนำเข้าสินค้าเกษตร", "slot_num": 50, "sheet_no": 1, "first_letter": "F"}, {"id": 666, "orig_slot": "Doc #52", "idiom": "Firm up", "meaning": "become stronger", "thai_idiom": "สรุปให้ชัดเจน / ยืนยันให้แน่นอน / ทำให้เป็นรูปธรรม", "thai_meaning": "กำหนดหรือยืนยันรายละเอียด แผนงาน หรือข้อตกลงให้แน่นอน มั่นคง และชัดเจนยิ่งขึ้น", "ex1_en": "We've agreed to go on a road trip this weekend, but let's chat tonight to <span class=\"hl-teal\">firm up</span> our itinerary and departure time.", "ex1_hl": "firm up", "ex1_th": "พวกเราตกลงกันแล้วว่าจะไปขับรถเที่ยวสุดสัปดาห์นี้ แต่คืนนี้มาคุยกันอีกทีเพื่อสรุปแผนการเดินทางและเวลาล้อหมุนให้ชัดเจนนะ", "ex2_en": "Senior executives scheduled a closed-door meeting to <span class=\"hl-teal\">firm up</span> the restructuring timeline before announcing it to shareholders.", "ex2_hl": "firm up", "ex2_th": "ผู้บริหารระดับสูงกำหนดการประชุมลับเพื่อสรุปไทม์ไลน์การปรับโครงสร้างองค์กรให้แน่นอนชัดเจน ก่อนที่จะประกาศให้ผู้ถือหุ้นรับทราบ", "slot_num": 52, "sheet_no": 1, "first_letter": "F"}, {"id": 667, "orig_slot": "Doc #53", "idiom": "Follow your heart", "meaning": "do what you feel is right", "thai_idiom": "ทำตามหัวใจ / ฟังเสียงหัวใจตัวเอง", "thai_meaning": "ทำตามความรู้สึก ความปรารถนาแท้จริง หรือสัญชาตญาณภายในตนเอง", "ex1_en": "Although his parents urged him to enter law school, he decided to <span class=\"hl-teal\">follow his heart</span> and pursue wildlife photography.", "ex1_hl": "follow his heart", "ex1_th": "แม้พ่อแม่จะคะยั้นคะยอให้เขาเรียนนิติศาสตร์ แต่เขากลับตัดสินใจทำตามหัวใจตัวเองแล้วหันไปเอาดีด้านการถ่ายภาพสัตว์ป่า", "ex2_en": "In her keynote speech, the tech pioneer inspired young innovators to <span class=\"hl-teal\">follow their hearts</span> rather than merely conforming to conventional career paths.", "ex2_hl": "follow their hearts", "ex2_th": "ในการกล่าวปาฐกถาพิเศษ ผู้บุกเบิกวงการเทคโนโลยีได้สร้างแรงบันดาลใจให้นักสร้างสรรค์รุ่นใหม่กล้าทำตามเสียงหัวใจของตนเอง แทนที่จะเดินตามเส้นทางอาชีพแบบดั้งเดิมไปวันๆ", "slot_num": 53, "sheet_no": 1, "first_letter": "F"}, {"id": 668, "orig_slot": "Doc #54", "idiom": "For the birds", "meaning": "not valuable", "thai_idiom": "ไร้สาระสิ้นดี / ไม่ได้เรื่อง / ไม่มีประโยชน์อะไรเลย", "thai_meaning": "สิ่งที่ไร้ค่า ไม่เป็นประโยชน์ ไร้สาระ หรือไม่คู่ควรแก่ความสนใจ", "ex1_en": "I tried following that extreme three-day cabbage diet, but starving myself like that is strictly <span class=\"hl-teal\">for the birds</span>.", "ex1_hl": "for the birds", "ex1_th": "ฉันเคยลองกินสูตรไดเอตต้มกะหล่ำปลีสุดโต่งสามวันแล้ว แต่การปล่อยให้ตัวเองหิวโซแบบนั้นมันไม่ได้เรื่องและไร้สาระสิ้นดี", "ex2_en": "The senior portfolio manager dismissed speculative meme tokens as financial gimmicks that are entirely <span class=\"hl-teal\">for the birds</span>.", "ex2_hl": "for the birds", "ex2_th": "ผู้จัดการพอร์ตการลงทุนอาวุโสปัดตกโทเคนมีมเก็งกำไร โดยมองว่าเป็นเพียงกลเม็ดทางการเงินที่ไร้สาระและไม่มีมูลค่าที่แท้จริงเลย", "slot_num": 54, "sheet_no": 1, "first_letter": "F"}, {"id": 669, "orig_slot": "Doc #55", "idiom": "Get a taste of your own medicine", "meaning": "experience the same", "thai_idiom": "กรรมตามสนอง / โดนเอาคืนแบบเดียวกัน / เจอเข้ากับตัว", "thai_meaning": "ได้รับการปฏิบัติที่ไม่ดีหรือเจ็บแสบในแบบเดียวกับที่ตนเองเคยทำกับคนอื่น", "ex1_en": "He always cancels plans with his friends at the last minute, so he finally <span class=\"hl-teal\">got a taste of his own medicine</span> when no one showed up to his barbecue.", "ex1_hl": "got a taste of his own medicine", "ex1_th": "เขาชอบเทนัดเพื่อนเอาวินาทีสุดท้ายตลอด ในที่สุดก็เจอกรรมตามสนองเข้ากับตัวเมื่อไม่มีใครโผล่ไปงานบาร์บีคิวของเขาเลยสักคน", "ex2_en": "The predatory firm finally <span class=\"hl-teal\">got a taste of its own medicine</span> when an aggressive activist investor acquired a blocking minority stake.", "ex2_hl": "got a taste of its own medicine", "ex2_th": "บริษัทนักล่าตัวฉกาจโดนเอาคืนด้วยวิธีเดียวกันในที่สุด เมื่อกลุ่มนักลงทุนเชิงรุกเข้ากว้านซื้อหุ้นจนได้สิทธิ์
