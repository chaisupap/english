387, "orig_slot": "#506", "idiom": "Actions have consequences", "meaning": "Every action leads to a result.", "thai_idiom": "การกระทำย่อมมีผลตามมา / ทำสิ่งใดย่อมได้สิ่งนั้น / กฎแห่งกรรม", "thai_meaning": "ทุกการกระทำย่อมก่อให้เกิดผลลัพธ์หรือผลกระทบที่ผู้กระทำต้องรับผิดชอบ", "ex1_en": "Neglecting to change the engine oil for two years finally caught up with Paul when his motor seized on the highway, proving that <span class=\"hl-teal\">actions have consequences</span>.", "ex1_hl": "actions have consequences", "ex1_th": "การละเลยไม่ยอมเปลี่ยนถ่ายน้ำมันเครื่องมานานถึงสองปีในที่สุดก็ส่งผล เมื่อเครื่องยนต์รถของพอลพังดับสนิทบนทางหลวง พิสูจน์ให้เห็นว่าการกระทำย่อมมีผลตามมาเสมอ", "ex2_en": "The regulatory commission heavily fined the brokerage firm for predatory lending practices, reminding financial institutions that reckless <span class=\"hl-teal\">actions have consequences</span>.", "ex2_hl": "actions have consequences", "ex2_th": "คณะกรรมการกำกับดูแลสั่งปรับบริษัทนายหน้าค้าหุ้นอย่างหนักฐานปล่อยสินเชื่อแบบขูดรีด พร้อมทั้งเตือนสถาบันการเงินทั้งหลายว่าการกระทำที่ประมาทเลินเล่อย่อมมีผลลัพธ์ที่ต้องชดใช้อย่างสาสม", "slot_num": 506, "sheet_no": 6, "first_letter": "A"}, {"id": 388, "orig_slot": "#508", "idiom": "All bark and no bite", "meaning": "All talk but no action.", "thai_idiom": "ดีแต่เห่าแต่ไม่กัด / เก่งแต่ปาก / ดีแต่พูดแต่ไม่ทำจริง", "thai_meaning": "คนที่ชอบข่มขู่หรือพูดจาวางก้ามให้ดูน่ากลัว แต่เอาเข้าจริงกลับไม่กล้าทำอันตรายหรือไม่สามารถทำอะไรได้จริง", "ex1_en": "Our neighbor's tiny terrier yaps frantically behind the picket fence, but he's <span class=\"hl-teal\">all bark and no bite</span> and rolls over for belly rubs if you step close.", "ex1_hl": "all bark and no bite", "ex1_th": "เจ้าหมาเทอร์เรียร์ตัวจ้อยของเพื่อนบ้านมักจะเห่ากรรโชกอยู่หลังรั้วอย่างบ้าคลั่ง แต่จริงๆ แล้วมันดีแต่เห่าไม่เคยกัด แถมยังหงายท้องให้เกาพุงทันทีที่เราเดินเข้าไปใกล้", "ex2_en": "Negotiators soon realized that the trade delegation’s threats to levy punitive tariffs were <span class=\"hl-teal\">all bark and no bite</span> meant to appease domestic voters.", "ex2_hl": "all bark and no bite", "ex2_th": "คณะผู้เจรจาตระหนักได้ในเวลาไม่นานว่าการที่คณะผู้แทนการค้าขู่จะขึ้นภาษีลงโทษนั้นเป็นเพียงการดีแต่พูดขู่เท่านั้น โดยมีเจตนาเพียงเพื่อเอาใจผู้มีสิทธิเลือกตั้งในประเทศตนเอง", "slot_num": 508, "sheet_no": 6, "first_letter": "A"}, {"id": 389, "orig_slot": "#509", "idiom": "All in the same boat", "meaning": "In the same difficult situation.", "thai_idiom": "ลงเรือลำเดียวกัน / ตกที่นั่งเดียวกัน / เผชิญชะตากรรมเดียวกัน", "thai_meaning": "อยู่ในสถานการณ์ที่ยากลำบากหรือเผชิญปัญหาเดียวกัน จึงต้องช่วยเหลือหรือร่วมมือกัน", "ex1_en": "When the regional commuter train broke down in freezing weather, passengers huddled together sharing snacks because they were <span class=\"hl-teal\">all in the same boat</span>.", "ex1_hl": "all in the same boat", "ex1_th": "เมื่อรถไฟชานเมืองเกิดเสียท่ามกลางอากาศหนาวเหน็บ ผู้โดยสารต่างเบียดเสียดให้ความอบอุ่นและแบ่งปันขนมกัน เพราะทุกคนต่างตกที่นั่งลำบากเดียวกัน", "ex2_en": "During the unexpected budget squeeze, the hospital director reminded clinical department heads that all wards were <span class=\"hl-teal\">all in the same boat</span> regarding equipment rationing.", "ex2_hl": "all in the same boat", "ex2_th": "ท่ามกลางภาวะงบประมาณตึงตัวอย่างไม่คาดคิด ผู้อำนวยการโรงพยาบาลเตือนบรรดาหัวหน้าแผนกว่าทุกวอร์ดต่างลงเรือลำเดียวกันในการจัดสรรและประหยัดอุปกรณ์ทางการแพทย์", "slot_num": 509, "sheet_no": 6, "first_letter": "A"}, {"id": 390, "orig_slot": "#510", "idiom": "All that jazz", "meaning": "All those things; everything.", "thai_idiom": "และอะไรทำนองนั้น / และสารพัดสิ่งอื่นๆ / จิปาถะพวกนั้น", "thai_meaning": "และเรื่องอื่นๆ ทรงเดียวกัน หรือสิ่งของเรื่องราวที่เกี่ยวข้องอื่นๆ ทำนองนั้น", "ex1_en": "Before heading out on our weekend camping trip, we bought bug spray, firewood, graham crackers, marshmallows, and <span class=\"hl-teal\">all that jazz</span>.", "ex1_hl": "all that jazz", "ex1_th": "ก่อนออกเดินทางไปตั้งแคมป์ช่วงวันหยุดสุดสัปดาห์ พวกเราซื้อทั้งยากันยุง ฟืน ขนมปังกรอบ มาร์ชแมลโลว์ และข้าวของจิปาถะอะไรทำนองนั้นเพียบ", "ex2_en": "The executive masterclass covered supply chain analytics, customer lifecycle valuation, agile sprints, and <span class=\"hl-teal\">all that jazz</span>.", "ex2_hl": "all that jazz", "ex2_th": "หลักสูตรระดับผู้บริหารครอบคลุมทั้งการวิเคราะห์ห่วงโซ่อุปทาน การประเมินมูลค่าตลอดวงจรชีวิตของลูกค้า การทำงานแบบอไจล์ และเรื่องทำนองนั้นทั้งหมด", "slot_num": 510, "sheet_no": 6, "first_letter": "A"}, {"id": 391, "orig_slot": "#511", "idiom": "Any port in a storm", "meaning": "Any help is good help.", "thai_idiom": "มีที่พึ่งยามยากอะไรก็ต้องเอาไว้ก่อน / คว้าไว้ก่อนยามคับขัน", "thai_meaning": "ในยามวิกฤติหรือคับขัน แม้ทางเลือกหรือความช่วยเหลือจะไม่ได้สมบูรณ์แบบ ก็ต้องยอมรับไว้ก่อนเพื่อความอยู่รอด", "ex1_en": "When a sudden hail storm hit while we were hiking along the ridge, taking shelter in a smelly damp sheep barn was <span class=\"hl-teal\">any port in a storm</span>.", "ex1_hl": "any port in a storm", "ex1_th": "ตอนที่พายุลูกเห็บถล่มลงมากะทันหันขณะที่เราเดินป่าเลียบสันเขา การได้เข้าไปหลบในโรงเลี้ยงแกะที่ทั้งอับและเหม็นก็กลายเป็นที่พึ่งยามยากที่ต้องคว้าเอาไว้ก่อน", "ex2_en": "Faced with an imminent supply chain collapse, the electronics manufacturer accepted components from an uncertified supplier, recognizing it as <span class=\"hl-teal\">any port in a storm</span>.", "ex2_hl": "any port in a storm", "ex2_th": "เมื่อต้องเผชิญกับภาวะห่วงโซ่อุปทานล่มสลายที่จวนตัว ผู้ผลิตชิ้นส่วนอิเล็กทรอนิกส์จึงยอมรับชิ้นส่วนจากซัพพลายเออร์ที่ยังไม่ผ่านการรับรอง เพราะตระหนักดีว่าในยามคับขันมีตัวช่วยอะไรก็ต้องเอาไว้ก่อน", "slot_num": 511, "sheet_no": 6, "first_letter": "A"}, {"id": 392, "orig_slot": "#512", "idiom": "Apple of my eye", "meaning": "Someone I adore.", "thai_idiom": "แก้วตาดวงใจ / สุดที่รัก / คนโปรดในดวงใจ", "thai_meaning": "คนที่รัก ทะนุถนอม หรือโปรดปรานมากที่สุดเหนือสิ่งอื่นใด", "ex1_en": "My grandfather has five grandchildren, but little Sophie, with her infectious giggles, has always been the <span class=\"hl-teal\">apple of his eye</span>.", "ex1_hl": "apple of his eye", "ex1_th": "คุณปู่ของฉันมีหลานถึงห้าคน แต่หนูน้อยโซฟีพร้อมเสียงหัวเราะที่สดใสของเธอคือแก้วตาดวงใจอันดับหนึ่งของคุณปู่เสมอมา", "ex2_en": "Among the countless classic sports cars in the collector’s private hangar, that fully restored 1961 roadster remained the <span class=\"hl-teal\">apple of his eye</span>.", "ex2_hl": "apple of his eye", "ex2_th": "ในบรรดารถสปอร์ตคลาสสิกนับไม่ถ้วนในโรงเก็บเครื่องบินส่วนตัวของนักสะสม รถโรดสเตอร์เปิดประทุนปี 1961 ที่ผ่านการบูรณะอย่างสมบูรณ์แบบคันนั้นยังคงเป็นของรักของหวงและแก้วตาดวงใจของเขาเสมอ", "slot_num": 512, "sheet_no": 6, "first_letter": "A"}, {"id": 393, "orig_slot": "#513", "idiom": "Back seat driver", "meaning": "Someone who gives unwanted advice.", "thai_idiom": "คนชอบก้าวก่ายชี้นิ้วสั่ง / พวกชอบบงการจากข้างหลัง / คนนั่งข้างที่ชอบสอนขับรถ", "thai_meaning": "คนที่ชอบสอดแทรก ออกคำสั่ง หรือให้คำแนะนำที่ไม่มีใครต้องการในขณะที่คนอื่นกำลังทำงานหรือควบคุมสิ่งนั้นอยู่", "ex1_en": "I refused to let my cousin sit in the front passenger seat because he is an unbearable <span class=\"hl-teal\">back seat driver</span> who constantly gasps at lane changes.", "ex1_hl": "back seat driver", "ex1_th": "ฉันไม่ยอมให้ลูกพี่ลูกน้องนั่งเบาะหน้าข้างคนขับเด็ดขาด เพราะเขาเป็นพวกชอบก้าวก่ายบงการที่ทนไม่ไหว คอยส่งเสียงตกใจเวลาเปลี่ยนเลนอยู่ตลอดเวลา", "ex2_en": "The founding partner retired to an advisory role and was careful never to act as a <span class=\"hl-teal\">back seat driver</span> during the new management team's quarterly strategy sessions.", "ex2_hl": "back seat driver", "ex2_th": "หุ้นส่วนผู้ก่อตั้งเกษียณตัวเองไปเป็นที่ปรึกษา และระมัดระวังเป็นอย่างยิ่งที่จะไม่ทำตัวเป็นผู้บงการอยู่เบื้องหลังในระหว่างการประชุมวางกลยุทธ์ประจำไตรมาสของทีมผู้บริหารชุดใหม่", "slot_num": 513, "sheet_no": 6, "first_letter": "B"}, {"id": 394, "orig_slot": "#517", "idiom": "Break a sweat", "meaning": "Work hard.", "thai_idiom": "ออกแรงจนเหงื่อตก / เหนื่อยยาก / แทบไม่ต้องเหนื่อย (เมื่อใช้ในรูปปฏิเสธ)", "thai_meaning": "ใช้ความพยายามอย่างหนักจนเหงื่อออก หรือทำงานหนัก (มักใช้ในรูปปฏิเสธเพื่อหมายถึงทำได้อย่างง่ายดายโดยไม่ต้องเปลืองแรง)", "ex1_en": "Jake hoisted the heavy oak bookshelf onto his shoulders and carried it upstairs without even <span class=\"hl-teal\">breaking a sweat</span>.", "ex1_hl": "breaking a sweat", "ex1_th": "เจกยกชั้นหนังสือไม้โอ๊กทรงหนักขึ้นบ่าแล้วแบกขึ้นบันไดไปชั้นบนได้สบายๆ โดยที่เหงื่อแทบไม่ออกสักหยด", "ex2_en": "The seasoned cloud architect migrated five hundred microservices into secure Kubernetes clusters without <span class=\"hl-teal\">breaking a sweat</span>.", "ex2_hl": "breaking a sweat", "ex2_th": "สถาปนิกคลาวด์มากประสบการณ์จัดการย้ายไมโครเซอร์วิสกว่าห้าร้อยรายการขึ้นคลัสเตอร์ Kubernetes ที่มีความปลอดภัยสูงได้อย่างฉลุยโดยแทบไม่ต้องออกแรงเหนื่อยเลย", "slot_num": 517, "sheet_no": 6, "first_letter": "B"}, {"id": 395, "orig_slot": "#520", "idiom": "Bury the hatchet", "meaning": "Make peace after a fight.", "thai_idiom": "ญาติดีกัน / ยุติความขัดแย้ง / คืนดีกัน / เลิกแล้วต่อกัน", "thai_meaning": "ยุติข้อพิพาท ให้อภัย และกลับมาปรองดองหรือคืนดีกันหลังจากที่บาดหมางกันมานาน", "ex1_en": "After not speaking for nearly a year following a misunderstanding over their band, Tom and Pete finally agreed to <span class=\"hl-teal\">bury the hatchet</span> at their high school reunion.", "ex1_hl": "bury the hatchet", "ex1_th": "หลังจากไม่ยอมคุยกันมาเกือบปีเพราะความเข้าใจผิดเรื่องวงดนตรี ทอมกับพีทก็ยอมยุติความขัดแย้งและกลับมาคืนดีกันในที่สุดในงานเลี้ยงรุ่นมัธยมปลาย", "ex2_en": "The two competing ride-hailing firms agreed to <span class=\"hl-teal\">bury the hatchet</span> and merge operations to curb devastating price wars across Southeast Asia.", "ex2_hl": "bury the hatchet", "ex2_th": "สองบริษัทเรียกรถโดยสารที่เป็นคู่แข่งสำคัญตกลงที่จะยุติข้อพิพาทและรวมกิจการเข้าด้วยกัน เพื่อหยุดยั้งสงครามราคาที่สร้างความเสียหายอย่างหนักในเอเชียตะวันออกเฉียงใต้", "slot_num": 520, "sheet_no": 6, "first_letter": "B"}, {"id": 396, "orig_slot": "#522", "idiom": "Call someone names", "meaning": "Insult someone.", "thai_idiom": "ด่าทอ / เรียกด้วยชื่อล้อเลียนหยาบคาย / ใช้คำพูดเหยียดหยาม", "thai_meaning": "ใช้ถ้อยคำดูถูก หยาบคาย หรือเรียกชื่อล้อเลียนเพื่อทำให้ผู้อื่นอับอายหรือเจ็บใจ", "ex1_en": "When the elementary school teacher saw two boys <span class=\"hl-teal\">calling each other names</span> on the playground, she brought them inside to talk through their frustration.", "ex1_hl": "calling each other names", "ex1_th": "เมื่อครูโรงเรียนประถมเห็นเด็กผู้ชายสองคนกำลังใช้ถ้อยคำล้อเลียนด่าทอกันที่สนามเด็กเล่น เธอจึงพาพวกเขาเข้ามาข้างในเพื่อปรับความเข้าใจกันอย่างสงบ", "ex2_en": "The corporate ethics charter explicitly prohibits managers from <span class=\"hl-teal\">calling subordinates names</span> or humiliating them in performance reviews.", "ex2_hl": "calling subordinates names", "ex2_th": "กฎบัตรจริยธรรมขององค์กรระบุข้อห้ามไว้อย่างชัดเจนไม่ให้ผู้จัดการใช้ถ้อยคำด่าทอดูกร้าวต่อผู้ใต้บังคับบัญชา หรือทำให้อับอายระหว่างการประเมินผลการปฏิบัติงาน", "slot_num": 522, "sheet_no": 6, "first_letter": "C"}, {"id": 397, "orig_slot": "#523", "idiom": "Can't put my finger on it", "meaning": "Can't remember or explain something.", "thai_idiom": "บอกไม่ถูก / ติดอยู่ที่ปาก / ชี้ชัดไม่ได้", "thai_meaning": "รู้สึกว่ามีบางอย่างผิดปกติหรือไม่ถูกต้อง แต่ไม่สามารถระบุหรืออธิบายได้ชัดเจน", "ex1_en": "There's something oddly familiar about this cozy little café, but I just <span class=\"hl-teal\">can't put my finger on it</span>.", "ex1_hl": "can't put my finger on it", "ex1_th": "มีบางอย่างในคาเฟ่บรรยากาศอบอุ่นแห่งนี้ที่ดูคุ้นตาอย่างประหลาด แต่ฉันก็นึกไม่ออกและบอกไม่ถูกจริง ๆ ว่าคืออะไร", "ex2_en": "The lead auditor noticed a discrepancy in the quarterly reconciliation reports, though she initially <span class=\"hl-teal\">couldn't put her finger on it</span>.", "ex2_hl": "couldn't put her finger on it", "ex2_th": "หัวหน้าผู้ตรวจสอบบัญชีสังเกตเห็นความผิดปกติในรายงานกระทบยอดประจำไตรมาส แม้ว่าในตอนแรกเธอจะยังชี้ชัดไม่ได้ว่าปัญหาอยู่ตรงไหนกันแน่", "slot_num": 523, "sheet_no": 6, "first_letter": "C"}, {"id": 398, "orig_slot": "#524", "idiom": "Carry the torch", "meaning": "Continue a tradition or legacy.", "thai_idiom": "สานต่อปณิธาน / สืบทอดเจตนารมณ์ / รับช่วงต่อ", "thai_meaning": "สืบทอดหน้าที่ อุดมการณ์ หรือประเพณีที่คนรุ่นก่อนริเริ่มไว้", "ex1_en": "After his grandfather retired, Liam decided to <span class=\"hl-teal\">carry the torch</span> by running the family's hundred-year-old sourdough bakery.", "ex1_hl": "carry the torch", "ex1_th": "หลังจากคุณปู่เกษียณ เลียมก็ตัดสินใจสานต่อกิจการด้วยการเข้ามาดูแลร้านขนมปังซาวโดว์อายุร้อยปีของครอบครัว", "ex2_en": "Following the founder's passing, the research lab promised to <span class=\"hl-teal\">carry the torch</span> and complete the groundbreaking oncology trials.", "ex2_hl": "carry the torch", "ex2_th": "หลังจากการจากไปของผู้ก่อตั้ง ห้องปฏิบัติการวิจัยให้คำมั่นว่าจะสืบทอดเจตนารมณ์และดำเนินการทดลองทางคลินิกด้านเนื้องอกวิทยาที่เป็นปรากฏการณ์ใหม่ให้สำเร็จ", "slot_num": 524, "sheet_no": 6, "first_letter": "C"}, {"id": 399, "orig_slot": "#525", "idiom": "Change gears", "meaning": "Change the subject or plan.", "thai_idiom": "เปลี่ยนแนวทาง / ปรับโหมด / สลับแผน", "thai_meaning": "เปลี่ยนความเร็ว ทิศทาง หรือวิธีการทำสิ่งใดสิ่งหนึ่งอย่างกะทันหัน", "ex1_en": "We spent the whole morning cleaning the garage, but now let's <span class=\"hl-teal\">change gears</span> and figure out what to cook for dinner.", "ex1_hl": "change gears", "ex1_th": "เราเสียเวลาทำความสะอาดโรงรถมาทั้งเช้าแล้ว ตอนนี้มาเปลี่ยนโหมดแล้วคิดกันดีกว่าว่าจะทำอะไรกินเป็นมื้อเย็น", "ex2_en": "When user retention dropped unexpectedly, the product team had to <span class=\"hl-teal\">change gears</span> and focus entirely on mobile app stability.", "ex2_hl": "change gears", "ex2_th": "เมื่อยอดผู้ใช้งานต่อเนื่องลดลงอย่างไม่คาดคิด ทีมพัฒนาผลิตภัณฑ์จึงต้องปรับเปลี่ยนแนวทางและหันมาทุ่มเทให้ความเสถียรของแอปมือถืออย่างเต็มตัว", "slot_num": 525, "sheet_no": 6, "first_letter": "C"}, {"id": 400, "orig_slot": "#526", "idiom": "Chip off the old block", "meaning": "Very similar to one's parents.", "thai_idiom": "ลูกไม้หล่นไม่ไกลต้น / ถอดแบบพ่อแม่มาเป๊ะ", "thai_meaning": "มีนิสัย หน้าตา หรือความสามารถคล้ายคลึงกับพ่อหรือแม่เป็นอย่างมาก", "ex1_en": "Look at little Noah dismantling that lawnmower engine—he's truly a <span class=\"hl-teal\">chip off the old block</span> just like his mechanic dad.", "ex1_hl": "chip off the old block", "ex1_th": "ดูโนอาห์ตัวน้อยกำลังรื้อเครื่องยนต์ตัดหญ้าสิ ลูกไม้หล่นไม่ไกลต้นจริง ๆ ถอดแบบพ่อที่เป็นช่างเครื่องมาไม่มีผิด", "ex2_en": "Maya's sharp cross-examination skills convinced senior partners that she was a genuine <span class=\"hl-teal\">chip off the old block</span> of her legendary judge mother.", "ex2_hl": "chip off the old block", "ex2_th": "ทักษะการซักค้านอันเฉียบคมของมายาทำให้หุ้นส่วนอาวุโสมั่นใจว่าเธอถอดแบบความเก่งมาจากคุณแม่ที่เป็นผู้พิพากษาระดับตำนานอย่างแท้จริง", "slot_num": 526, "sheet_no": 6, "first_letter": "C"}, {"id": 401, "orig_slot": "#527", "idiom": "Circle back", "meaning": "Return to a topic later.", "thai_idiom": "ย้อนกลับมาคุยทีหลัง / วนกลับมาดูใหม่", "thai_meaning": "กลับมาพูดคุยหรือพิจารณาประเด็นนั้นอีกครั้งในภายหลัง", "ex1_en": "Let's book the flight tickets right now, and we can <span class=\"hl-teal\">circle back</span> to hotel reservations once everyone confirms their vacation dates.", "ex1_hl": "circle back", "ex1_th": "จองตั๋วเครื่องบินกันตอนนี้ก่อนเลย แล้วค่อยวนกลับมาดูเรื่องจองโรงแรมหลังจากทุกคนยืนยันวันลาพักร้อนเรียบร้อยแล้ว", "ex2_en": "I hear your concerns regarding cloud migration costs, so let's table that for now and <span class=\"hl-teal\">circle back</span> during next Thursday's budget review.", "ex2_hl": "circle back", "ex2_th": "ผมเข้าใจข้อกังวลของคุณเกี่ยวกับค่าใช้จ่ายในการย้ายข้อมูลขึ้นคลาวด์ เราพักเรื่องนี้ไว้ก่อนแล้วค่อยย้อนกลับมาคุยกันใหม่ในการประชุมพิจารณางบวันพฤหัสหน้า", "slot_num": 527, "sheet_no": 6, "first_letter": "C"}, {"id": 402, "orig_slot": "#529", "idiom": "Come to terms with", "meaning": "Accept a difficult situation.", "thai_idiom": "ทำใจยอมรับ / ยอมรับความจริง", "thai_meaning": "เริ่มยอมรับและจัดการกับสถานการณ์ที่ยากลำบาก เจ็บปวด หรือไม่น่าพึงพอใจได้", "ex1_en": "It took Marcus nearly six months to <span class=\"hl-teal\">come to terms with</span> the sudden breakup and start going out with friends again.", "ex1_hl": "come to terms with", "ex1_th": "มาร์คัสต้องใช้เวลาเกือบหกเดือนกว่าจะทำใจยอมรับการเลิกราอย่างกะทันหันได้ และเริ่มออกไปพบปะเพื่อนฝูงอีกครั้ง", "ex2_en": "Traditional retail giants must quickly <span class=\"hl-teal\">come to terms with</span> shifting consumer habits toward automated, algorithmic e-commerce.", "ex2_hl": "come to terms with", "ex2_th": "ยักษ์ใหญ่ค้าปลีกแบบดั้งเดิมต้องรีบยอมรับความจริงเรื่องพฤติกรรมผู้บริโภคที่เปลี่ยนผ่านไปสู่อีคอมเมิร์ซแบบอัตโนมัติที่ขับเคลื่อนด้วยอัลกอริทึม", "slot_num": 529, "sheet_no": 6, "first_letter": "C"}, {"id": 403, "orig_slot": "#531", "idiom": "Cut to the bone", "meaning": "Hurt very deeply.", "thai_idiom": "เสียดแทงใจอย่างลึกซึ้ง / บาดลึกถึงขั้วหัวใจ / เชือดเฉือนถึงกระดูก", "thai_meaning": "ทำร้ายจิตใจหรือความรู้สึกอย่างแสนสาหัส หรือกระทบกระเทือนอย่างรุนแรง", "ex1_en": "Her harsh, dismissive words during our argument really <span class=\"hl-teal\">cut me to the bone</span>.", "ex1_hl": "cut me to the bone", "ex1_th": "คำพูดที่รุนแรงและเย็นชาของเธอระหว่างที่เราทะเลาะกันนั้น บาดลึกถึงขั้วหัวใจของฉันจริง ๆ", "ex2_en": "The consultant's scathing audit report <span class=\"hl-teal\">cut to the bone</span>, exposing gross mismanagement across the entire regional division.", "ex2_hl": "cut to the bone", "ex2_th": "รายงานการตรวจสอบที่วิพากษ์วิจารณ์อย่างไม่ไว้หน้าของที่ปรึกษาเสียดแทงอย่างรุนแรง โดยเปิดโปงความล้มเหลวในการบริหารงานทั่วทั้งแผนกภูมิภาค", "slot_num": 531, "sheet_no": 6, "first_letter": "C"}, {"id": 404, "orig_slot": "#532", "idiom": "Dressed to kill", "meaning": "Dressed extremely well.", "thai_idiom": "แต่งตัวสวยสะกด / แต่งตัวจัดเต็ม / แต่งตัวฟาดมาก", "thai_meaning": "แต่งกายอย่างหรู pan class=\"hl-teal\">Emotions ran high</span> in the neighborhood after the local soccer team conceded a penalty in the final minute of stoppage time.", "ex1_hl": "Emotions ran high", "ex1_th": "อารมณ์ของแฟนบอลในละแวกบ้านพุ่งพล่านอย่างดุเดือด หลังจากทีมฟุตบอลท้องถิ่นเสียจุดโทษในนาทีสุดท้ายของช่วงทดเวลาบาดเจ็บ", "ex2_en": "As union representatives clashed with executive management over proposed wage freezes, <span class=\"hl-teal\">emotions ran high</span> throughout the boardroom.", "ex2_hl": "emotions ran high", "ex2_th": "ขณะที่ตัวแทนสหภาพแรงงานปะทะคารมกับคณะผู้บริหารเรื่องการระงับการขึ้นค่าจ้าง บรรยากาศในห้องประชุมคณะกรรมการก็คุกรุ่นไปด้วยอารมณ์อันตึงเครียด", "slot_num": 535, "sheet_no": 6, "first_letter": "E"}, {"id": 407, "orig_slot": "#538", "idiom": "Feather in your cap", "meaning": "An achievement to be proud of.", "thai_idiom": "ความสำเร็จอันน่าภาคภูมิใจ / ผลงานชิ้นโบแดง / เกียรติประวัติ", "thai_meaning": "เกียรติยศหรือผลงานความสำเร็จที่น่ายกย่องและสร้างความภาคภูมิใจให้แก่ตนเอง", "ex1_en": "Finishing her first full marathon under four hours was quite a <span class=\"hl-teal\">feather in her cap</span>.", "ex1_hl": "feather in her cap", "ex1_th": "การวิ่งมาราธอนเต็มระยะครั้งแรกได้ในเวลาต่ำกว่าสี่ชั่วโมงถือเป็นความสำเร็จอันน่าภาคภูมิใจอย่างยิ่งของเธอ", "ex2_en": "Winning the prestigious architectural design award will be a major <span class=\"hl-teal\">feather in your cap</span> when applying for partner status.", "ex2_hl": "feather in your cap", "ex2_th": "การคว้ารางวัลชนะเลิศด้านการออกแบบสถาปัตยกรรมระดับทรงเกียรติจะกลายเป็นผลงานชิ้นโบแดงครั้งสำคัญในการยื่นขอเลื่อนตำแหน่งเป็นหุ้นส่วน", "slot_num": 538, "sheet_no": 6, "first_letter": "F"}, {"id": 408, "orig_slot": "#539", "idiom": "Feel under the weather", "meaning": "Feel sick.", "thai_idiom": "รู้สึกไม่ค่อยสบาย / ครั่นเนื้อครั่นตัว / ป่วยไข้เล็กน้อย", "thai_meaning": "รู้สึกไม่สบายตัว ป่วยเป็นไข้ หรือมีสุขภาพไม่สู้ดีนัก", "ex1_en": "I won't be able to join the hiking trip tomorrow because I'm <span class=\"hl-teal\">feeling a bit under the weather</span> with a sore throat.", "ex1_hl": "feeling a bit under the weather", "ex1_th": "พรุ่งนี้ฉันคงไปทริปเดินป่ากับพวกเธอไม่ได้แล้วล่ะ เพราะรู้สึกไม่ค่อยสบายและเจ็บคอขึ้นมานิดหน่อย", "ex2_en": "The keynote speaker was forced to present via video conference as he began to <span class=\"hl-teal\">feel under the weather</span> shortly before the summit.", "ex2_hl": "feel under the weather", "ex2_th": "วิทยากรหลักจำเป็นต้องบรรยายผ่านการประชุมทางวิดีโอแทน เนื่องจากเริ่มรู้สึกไม่สบายกะทันหันก่อนการประชุมสุดยอดจะเริ่มขึ้นไม่นาน", "slot_num": 539, "sheet_no": 6, "first_letter": "F"}, {"id": 409, "orig_slot": "#540", "idiom": "Find your feet", "meaning": "Become confident in a new situation.", "thai_idiom": "เริ่มจับจุดได้ / ปรับตัวเข้าที่เข้าทาง / ตั้งหลักได้", "thai_meaning": "เริ่มคุ้นเคย มั่นใจ และทำสิ่งต่าง ๆ ได้อย่างราบรื่นในสภาพแวดล้อมหรือสถานการณ์ใหม่", "ex1_en": "Moving abroad alone was overwhelming at first, but within two months, Clara had completely <span class=\"hl-teal\">found her feet</span> in Tokyo.", "ex1_hl": "found her feet", "ex1_th": "การย้ายไปอยู่ต่างประเทศคนเดียวทำให้เคว้งคว้างมากในตอนแรก แต่ภายในสองเดือน คลาราก็ปรับตัวเข้าที่เข้าทางได้อย่างมั่นใจในโตเกียว", "ex2_en": "Our onboarding mentorship program gives new software engineers plenty of space to <span class=\"hl-teal\">find their feet</span> before taking on core repository updates.", "ex2_hl": "find their feet", "ex2_th": "โปรแกรมพี่เลี้ยงช่วยสอนงานของเราเปิดโอกาสให้วิศวกรซอฟต์แวร์ใหม่มีเวลาเพียงพอที่จะเริ่มจับจุดและตั้งหลักได้ ก่อนจะรับผิดชอบการอัปเดตโค้ดระบบหลัก", "slot_num": 540, "sheet_no": 6, "first_letter": "F"}, {"id": 410, "orig_slot": "#541", "idiom": "Fly under the radar", "meaning": "Avoid attention.", "thai_idiom": "ทำตัวเงียบ ๆ / อยู่นอกสายตา / เล็ดลอดการจับตา", "thai_meaning": "ดำเนินการหรือใช้ชีวิตอย่างเงียบเชียบโดยไม่ให้เป็นจุดสนใจหรือถูกสังเกตเห็น", "ex1_en": "During high school, Leo preferred to <span class=\"hl-teal\">fly under the radar</span> and avoid getting involved in cafeteria drama.", "ex1_hl": "fly under the radar", "ex1_th": "สมัยเรียนมัธยม ลีโอชอบทำตัวเงียบ ๆ อยู่นอกสายตาคนอื่น และหลีกเลี่ยงการเข้าไปพัวพันกับเรื่องดราม่าในโรงอาหาร", "ex2_en": "The boutique startup managed to <span class=\"hl-teal\">fly under the radar</span> of tech giants until its proprietary algorithm reached ten million daily users.", "ex2_hl": "fly under the radar", "ex2_th": "สตาร์ทอัพขนาดเล็กรายนี้สามารถดำเนินงานอยู่นอกสายตาของเหล่าบริษัทยักษ์ใหญ่ด้านเทคโนโลยีได้ จนกระทั่งอัลกอริทึมที่จดสิทธิบัตรของพวกเขามียอดผู้ใช้งานทะลุสิบล้านคนต่อวัน", "slot_num": 541, "sheet_no": 6, "first_letter": "F"}, {"id": 411, "orig_slot": "#543", "idiom": "Get back to square one", "meaning": "Return to the starting point.", "thai_idiom": "กลับไปนับหนึ่งใหม่ / เริ่มต้นใหม่ที่จุดสตาร์ต", "thai_meaning": "ต้องย้อนกลับไปเริ่มต้นใหม่ตั้งแต่จุดแรกสุดเพราะความล้มเหลวหรือข้อผิดพลาด", "ex1_en": "I accidentally knocked over the entire miniature puzzle, so now I have to <span class=\"hl-teal\">get back to square one</span>.", "ex1_hl": "get back to square one", "ex1_th": "ฉันเผลอปัดจิ๊กซอว์โมเดลจำลองล้มระเนระนาด ตอนนี้เลยต้องกลับไปเริ่มต้นนับหนึ่งใหม่อีกรอบ", "ex2_en": "When the regulatory agency rejected our primary clinical dataset, the drug development team had to <span class=\"hl-teal\">get back to square one</span>.", "ex2_hl": "get back to square one", "ex2_th": "เมื่อหน่วยงานกำกับดูแลปฏิเสธชุดข้อมูลการทดลองทางคลินิกขั้นปฐมภูมิ ทีมพัฒนายาจึงต้องกลับไปนับหนึ่งใหม่ทั้งหมด", "slot_num": 543, "sheet_no": 6, "first_letter": "G"}, {"id": 412, "orig_slot": "#546", "idiom": "Give credit where credit is due", "meaning": "Give someone the praise they deserve.", "thai_idiom": "ให้เครดิตคนที่สมควรได้รับ / ชื่นชมตามเนื้อผ้า / ยกความดีความชอบให้", "thai_meaning": "ยอมรับและกล่าวยกย่องผลงานหรือคุณงามความดีของผู้ที่ทำสิ่งนั้นอย่างแท้จริง", "ex1_en": "I know we both cleaned the house, but we have to <span class=\"hl-teal\">give credit where credit is due</span>—Elena made the entire five-course meal.", "ex1_hl": "give credit where credit is due", "ex1_th": "ฉันรู้ว่าเราช่วยกันทำความสะอาดบ้านทั้งคู่ แต่เราต้องยกความดีความชอบให้คนที่สมควรได้รับนะ เอเลน่าเป็นคนทำอาหารทั้งห้าคอร์สคนเดียวเลย", "ex2_en": "Although the sales VP presented the campaign metrics, he made sure to <span class=\"hl-teal\">give credit where credit is due</span> by highlighting the junior designers.", "ex2_hl": "give credit where credit is due", "ex2_th": "แม้ว่ารองประธานฝ่ายขายจะเป็นผู้นำเสนอตัวเลขผลลัพธ์ของแคมเปญ แต่เขาก็ไม่ลืมที่จะให้เครดิตคนที่สมควรได้รับด้วยการกล่าวชื่นชมนักออกแบบรุ่นน้องทุกคน", "slot_num": 546, "sheet_no": 6, "first_letter": "G"}, {"id": 413, "orig_slot": "#547", "idiom": "Give the benefit of the doubt", "meaning": "Trust someone without proof.", "thai_idiom": "มองในแง่ดีไว้ก่อน / ให้โอกาสโดยไม่ด่วนตัดสิน / เชื่อใจไว้ก่อน", "thai_meaning": "เลือกที่จะเชื่อใจหรือไม่ตัดสินผู้อื่นในแง่ลบเมื่อยังไม่มีหลักฐานแน่ชัดว่าเขาทำผิด", "ex1_en": "Julian is rarely late, so I decided to <span class=\"hl-teal\">give him the benefit of the doubt</span> when he didn't show up at seven.", "ex1_hl": "give him the benefit of the doubt", "ex1_th": "ปกติจูเลียนไม่ค่อยมาสาย ฉันเลยเลือกที่จะมองในแง่ดีไว้ก่อนตอนที่เขายังไม่โผล่มาตอนหนึ่งทุ่มตรง", "ex2_en": "The compliance committee initially <span class=\"hl-teal\">gave the supplier the benefit of the doubt</span>, assuming the shipment delay was merely caused by bad weather.", "ex2_hl": "gave the supplier the benefit of the doubt", "ex2_th": "ในเบื้องต้นคณะกรรมการตรวจสอบเลือกที่จะเชื่อใจซัพพลายเออร์ไว้ก่อน โดยสันนิษฐานว่าการส่งมอบที่ล่าช้าเป็นเพียงเพราะสภาพอากาศเลวร้ายเท่านั้น", "slot_num": 547, "sheet_no": 6, "first_letter": "G"}, {"id": 414, "orig_slot": "#548", "idiom": "Go down the rabbit hole", "meaning": "Get deeply involved in something.", "thai_idiom": "ดำดิ่งจนถอนตัวไม่ขึ้น / จมลึกสู่โลกของ... / ไหลไปเรื่อยจนหยุดไม่ได้", "thai_meaning": "ถลำลึกหรือหลงใหลเข้าสู่วงวนของหัวข้อ ข้อมูล หรือกิจกรรมที่ซับซ้อนและน่าหลงใหลจนยากจะหยุดยั้ง", "ex1_en": "I only went online to check a quick gardening tip, but I ended up <span class=\"hl-teal\">going down the rabbit hole</span> of vintage terrarium tutorials for four hours.", "ex1_hl": "going down the rabbit hole", "ex1_th": "ฉันตั้งใจจะเปิดเน็ตดูเคล็ดลับการจัดสวนนิดเดียวแท้ ๆ แต่ดันดำดิ่งดูคลิปสอนทำสวนในขวดแก้วโบราณยาวติดต่อกันถึงสี่ชั่วโมงจนถอนตัวไม่ขึ้น", "ex2_en": "The forensic accountant warned his junior analyst not to <span class=\"hl-teal\">go down the rabbit hole</span> of obscure offshore subsidiaries without actionable leads.", "ex2_hl": "go down the rabbit hole", "ex2_th": "นักบัญชีนิติวิทยาศาสตร์เตือนผู้ช่วยนักวิเคราะห์ไม่ให้ถลำลึกไปกับการสืบค้นบริษัทลูกในต่างแดนอันซับซ้อน หากยังไม่มีเบาะแสที่มีน้ำหนักเพียงพอ", "slot_num": 548, "sheet_no": 6, "first_letter": "G"}, {"id": 415, "orig_slot": "#550", "idiom": "Good riddance", "meaning": "Glad to be rid of someone.", "thai_idiom": "พ้นเวรพ้นกรรม / ไปให้พ้น ๆ ได้เสียที / โล่งใจที่กำจัดไปได้", "thai_meaning": "คำอุทานแสดงความโล่งใจหรือดีใจที่ใครบางคนหรือบางสิ่งที่ไม่พึงประสงค์ได้จากไปเสียที", "ex1_en": "When my messy, loud flatmate finally packed his bags and moved out, all I could mutter was, '<span class=\"hl-teal\">Good riddance</span>!'", "ex1_hl": "Good riddance", "ex1_th": "ตอนที่รูมเมตตัวสร้างความรกและชอบส่งเสียงดังเก็บกระเป๋าย้ายออกไปในที่สุด สิ่งเดียวที่ฉันพึมพำออกมาคือ 'ไปให้พ้น ๆ ได้เสียที!'", "ex2_en": "After months of endless system outages caused by the legacy database, the IT director cheered, '<span class=\"hl-teal\">Good riddance</span>,' as the servers were decommissioned.", "ex2_hl": "Good riddance", "ex2_th": "หลังจากต้องทนกับปัญหาระบบล่มไม่เว้นแต่ละวันอันเนื่องมาจากฐานข้อมูลรุ่นเก่า ผู้อำนวยการไอทีก็โห่ร้องด้วยความโล่งใจว่า 'หมดเวรหมดกรรมเสียที' เมื่อเซิร์ฟเวอร์ถูกปลดระวาง", "slot_num": 550, "sheet_no": 6, "first_letter": "G"}, {"id": 416, "orig_slot": "#555", "idiom": "Home sweet home", "meaning": "Home is the best place.", "thai_idiom": "บ้านแสนสุข / ไม่มีที่ไหนสุขใจเท่าบ้านเรา", "thai_meaning": "คำอุทานแสดงความผูกพันและอบอุ่นใจที่ได้กลับมาอยู่ในบ้านอันแสนสบายของตนเอง", "ex1_en": "Dropping my heavy duffel bag in the hallway after a grueling twelve-hour flight, I sighed, '<span class=\"hl-teal\">Home sweet home</span>.'", "ex1_hl": "Home sweet home", "ex1_th": "พอทิ้งกระเป๋าเดินทางใบหนักลงตรงโถงทางเดินหลังจากนั่งเครื่องบินอันทรหดยาวนานสิบสองชั่วโมง ฉันก็ถอนหายใจออกมาว่า 'ไม่มีที่ไหนสุขใจเท่าบ้านเราจริง ๆ'", "ex2_en": "The architectural magazine headlined its cover story on sustainable timber housing with the nostalgic phrase '<span class=\"hl-teal\">Home sweet home</span> in the digital age.'", "ex2_hl": "Home sweet home", "ex2_th": "นิตยสารสถาปัตยกรรมพาดหัวบทความหน้าปกเกี่ยวกับที่อยู่อาศัยไม้แปรรูปที่เป็นมิตรต่อสิ่งแวดล้อมด้วยวลีชวนอบอุ่นหัวใจว่า 'บ้านแสนสุขในยุคดิจิทัล'", "slot_num": 555, "sheet_no": 6, "first_letter": "H"}, {"id": 417, "orig_slot": "#557", "idiom": "In the thick of it", "meaning": "In the middle of a difficult situation.", "thai_idiom": "อยู่ใจกลางสมรภูมิ / อยู่ท่ามกลางความชุลมุน / เผชิญจุดวิกฤตเต็มเปา", "thai_meaning": "ตกอยู่ในจุดที่สถานการณ์กำลังดุเดือด ชุลมุน หรือวุ่นวายที่สุด", "ex1_en": "With packed boxes scattered across the living room and movers shouting outside, we were right <span class=\"hl-teal\">in the thick of it</span>.", "ex1_hl": "in the thick of it", "ex1_th": "เมื่อกล่องพัสดุกระจัดกระจายเต็มห้องนั่งเล่นและคนขนของตะโกนคุยกันข้างนอก เราก็ตกอยู่ท่ามกลางความชุลมุนวุ่นวายขั้นสุดจริง ๆ", "ex2_en": "During the unexpected product recall, the crisis communications team found themselves right <span class=\"hl-teal\">in the thick of it</span> fielding hundreds of press inquiries.", "ex2_hl": "in the thick of it", "ex2_th": "ในช่วงที่มีการเรียกคืนสินค้าอย่างกะทันหัน ทีมสื่อสารภาวะวิกฤตพบว่าตนเองต้องอยู่ใจกลางสมรภูมิเพื่อคอยรับมือกับคำถามจากสื่อมวลชนหลายร้อยสาย", "slot_num": 557, "sheet_no": 6, "first_letter": "I"}, {"id": 418, "orig_slot": "#558", "idiom": "In your face", "meaning": "Very obvious.", "thai_idiom": "โจ่งแจ้งท้าทาย / กระแทกตา / ก้าวร้าวชัดเจน / ไม่เกรงใจใคร", "thai_meaning": "ชัดเจน รุนแรง โจ่งแจ้ง หรือท้าทายอย่างมากจนไม่อาจหลีกเลี่ยงหรือมองข้ามได้", "ex1_en": "Liam's neon yellow jacket with reflective safety straps was definitely bold and <span class=\"hl-teal\">in your face</span>.", "ex1_hl": "in your face", "ex1_th": "เสื้อแจ็กเก็ตสีเหลืองนีออนพร้อมแถบสะท้อนแสงของลีโอนั้นสะดุดตา โดดเด่น และกระแทกตาคนมองอย่างไม่ต้องสงสัย", "ex2_en": "The fintech startup launched an aggressive, <span class=\"hl-teal\">in-your-face</span> marketing campaign mocking traditional banks across subway stations nationwide.", "ex2_hl": "in-your-face", "ex2_th": "สตาร์ทอัพด้านฟินเทคเปิดตัวแคมเปญการตลาดอันดุดันและโจ่งแจ้งท้าทายตามสถานีรถไฟใต้ดินทั่วประเทศเพื่อล้อเลียนธนาคารแบบดั้งเดิม", "slot_num": 558, "sheet_no": 6, "first_letter": "I"}, {"id": 419, "orig_slot": "#562", "idiom": "Kick the bucket", "meaning": "To die.", "thai_idiom": "ลงโลง / ซี้แหง / สิ้นลมหายใจ / ลาโลก", "thai_meaning": "เสียชีวิตหรือตาย (เป็นสำนวนภาษาพูด มักใช้ในบริบทที่ไม่เป็นทางการ)", "ex1_en": "Our ancient sputtering lawnmower finally <span class=\"hl-teal\">kicked the bucket</span> right in the middle of trimming the front yard.", "ex1_hl": "kicked the bucket", "ex1_th": "เครื่องตัดหญ้าเก่าคร่ำครึที่เสียงกระตุกมาตลอดของเรา ในที่สุดก็ลาโลกเจ๊งสนิทไปขณะกำลังตัดหญ้าหน้าบ้านอยู่พอดี", "ex2_en": "The wealth manager advised young entrepreneurs to draft comprehensive succession wills long before they eventually <span class=\"hl-teal\">kick the bucket</span>.", "ex2_hl": "kick the bucket", "ex2_th": "ผู้จัดการกองมรดกให้คำแนะนำแก่ผู้ประกอบการรุ่นใหม่ให้ร่างพินัยกรรมส่งต่อมรดกอย่างรอบคอบ เสียแต่เนิ่น ๆ ก่อนที่จะถึงวันที่ตนเองต้องลาโลกไป", "slot_num": 562, "sheet_no": 6, "first_letter": "K"}, {"id": 420, "orig_slot": "#564", "idiom": "Leave no stone unturned", "meaning": "Try everything possible.", "thai_idiom": "พลิกแผ่นดินหา / ทำทุกวิถีทาง / พลิกหินทุกก้อน", "thai_meaning": "พยายามทำทุกวิถีทางหรือตรวจสอบทุกซอกทุกมุมอย่างละเอียดถี่ถ้วนเพื่อหาคำตอบหรือบรรลุเป้าหมาย", "ex1_en": "When her rescue cat slipped through the back door, Maria <span class=\"hl-teal\">left no stone unturned</span>, checking every shed and alleyway in the neighborhood.", "ex1_hl": "left no stone unturned", "ex1_th": "ตอนที่แมวจรที่เธอรับเลี้ยงหลุดออกทางประตูหลัง มาเรียพลิกแผ่นดินตามหา โดยตรวจดูตั้งแต่เพิงเก็บของไปจนถึงตรอกซอกซอยทุกแห่งในละแวกบ้าน", "ex2_en": "The forensic due diligence team vowed to <span class=\"hl-teal\">leave no stone unturned</span> before recommending the multi-million-dollar acquisition.", "ex2_hl": "leave no stone unturned", "ex2_th": "ทีมตรวจสอบสถานะกิจการเชิงลึกให้คำมั่นว่าจะตรวจสอบทุกซอกทุกมุมอย่างละเอียดถี่ถ้วน ก่อนที่จะให้คำแนะนำเรื่องการเข้าซื้อกิจการมูลค่าหลายล้านดอลลาร์", "slot_num": 564, "sheet_no": 6, "first_letter": "L"}, {"id": 421, "orig_slot": "#566", "idiom": "Live and learn", "meaning": "Learn from experiences.", "thai_idiom": "ผิดเป็นครู / อยู่เพื่อเรียนรู้ / ประสบการณ์สอนใจ", "thai_meaning": "เรียนรู้และได้รับบทเรียนอันมีค่าจากความผิดพลาดหรือประสบการณ์ในชีวิต", "ex1_en": "I completely ruined the chocolate soufflé by opening the oven door too early, but well, <span class=\"hl-teal\">live and learn</span>!", "ex1_hl": "live and learn", "ex1_th": "ฉันทำขนมซูเฟล่ช็อกโกแลตพังยับเยินเพราะเผลอเปิดเตาอบเร็วเกินไป แต่ก็นะ ถือว่าผิดเป็นครู!", "ex2_en": "Although our first hardware prototype failed drop-testing miserably, the engineering team adopted a '<span class=\"hl-teal\">live and learn</span>' mindset to redesign the casing.", "ex2_hl": "live and learn", "ex2_th": "แม้ว่าต้นแบบฮาร์ดแวร์ชิ้นแรกของเราจะไม่ผ่านการทดสอบการตกกระแทกอย่างไม่เป็นท่า แต่ทีมวิศวกรก็นำทัศนคติ 'ถือความผิดพลาดเป็นบทเรียน' มาใช้ในการออกแบบโครงสร้างใหม่", "slot_num": 566, "sheet_no": 6, "first_letter": "L"}, {"id": 422, "orig_slot": "#567", "idiom": "Loose lips sink ships", "meaning": "Careless talk can cause trouble.", "thai_idiom": "หน้าต่างมีหู ประตูมีช่อง / ปากสว่างพาพัง / พูดพล่อยพาซวย", "thai_meaning": "การพูดพล่อยหรือไม่ระมัดระวังคำพูดอาจนำความเสียหายหรือภัยพิบัติมาสู่ส่วนรวมได้", "ex1_en": "Don't mention a single word about Friday's surprise baby shower around Sarah—remember, <span class=\"hl-teal\">loose lips sink ships</span>!", "ex1_hl": "loose lips sink ships", "ex1_th": "อย่าหลุดปากพูดเรื่องงานเซอร์ไพรส์รับขวัญเด็กวันศุกร์นี้ให้ซาร่าได้ยินเป็นอันขาดนะ จำไว้ว่าปากสว่างเรื่องจะพังเอา!", "ex2_en": "Before signing off on the secret merger, the CEO reminded every board member that <span class=\"hl-teal\">loose lips sink ships</span> in heavily regulated markets.", "ex2_hl": "loose lips sink ships", "ex2_th": "ก่อนลงนามในข้อตกลงควบรวมกิจการที่เป็นความลับ ซีอีโอได้เตือนสติกรรมการทุกคนว่าหน้าต่างมีหูประตูมีช่อง และการพูดไม่ระวังอาจทำลายข้อตกลงในตลาดที่มีการกำกับดูแลเข้มงวดได้", "slot_num": 567, "sheet_no": 6, "first_letter": "L"}, {"id": 423, "orig_slot": "#571", "idiom": "Money talks", "meaning": "People with money have power.", "thai_idiom": "เงินบันดาลได้ทุกสิ่ง / เงินง้างได้ทุกอย่าง / อำนาจเงินตรา", "thai_meaning": "เงินมีอิทธิพลและอำนาจในการชักจูงหรือทำให้สิ่งต่าง ๆ ประสบความสำเร็จได้เสมอ", "ex1_en": "Even though the concert was officially sold out, Greg snagged front-row backstage passes within minutes—proof that <span class=\"hl-teal\">money talks</span>.", "ex1_hl": "money talks", "ex1_th": "แม้ว่าคอนเสิร์ตจะขายบัตรหมดเกลี้ยงไปแล้ว แต่เกร็กก็คว้าบัตรวีไอพีแถวหน้าติดเวทีมาได้ในไม่กี่นาที เป็นข้อพิสูจน์จริง ๆ ว่าเงินง้างได้ทุกอย่าง", "ex2_en": "The independent developer was rapidly outbid by a private equity fund offering an all-cash premium, reminding everyone that <span class=\"hl-teal\">money talks</span>.", "ex2_hl": "money talks", "ex2_th": "ผู้พัฒนาอสังหาริมทรัพย์รายย่อยถูกกองทุนหุ้นนอกตลาดเสนอเงินสดทับจนแพ้ประมูลอย่างรวดเร็ว ตอกย้ำให้ทุกคนเห็นว่าอำนาจเงินตราเป็นผู้กำหนดทุกสิ่ง", "slot_num": 571, "sheet_no": 6, "first_letter": "M"}, {"id": 424, "orig_slot": "#572", "idiom": "Much ado about nothing", "meaning": "Too much fuss over nothing.", "thai_idiom": "เรื่องขี้ผงทำเป็นเรื่องใหญ่ / ตื่นตูมกับเรื่องไม่เป็นเรื่อง / กวนน้ำให้ขุ่น", "thai_meaning": "การตื่นตระหนก วุ่นวาย หรือเอะอะโวยวายกับเรื่องเล็กน้อยที่ไม่มีความสำคัญอะไรเลย", "ex1_en": "Everyone panicked when the neighborhood Wi-Fi went down for ten minutes, but it turned out to be <span class=\"hl-teal\">much ado about nothing</span>.", "ex1_hl": "much ado about nothing", "ex1_th": "ทุกคนแตกตื่นตกใจเมื่อสัญญาณไวไฟในหมู่บ้านดับไปสิบนาที แต่สุดท้ายก็กลายเป็นเรื่องขี้ผงที่โวยวายกันไปเองโดยเปล่าประโยชน์", "ex2_en": "The rumored currency devaluation triggered wild morning speculation, yet analysts dismissed the day's market panic as <span class=\"hl-teal\">much ado about nothing</span>.", "ex2_hl": "much ado about nothing", "ex2_th": "ข่าวลือเรื่องการลดค่าเงินจุดชนวนให้เกิดการเก็งกำไรกันอย่างบ้าคลั่งในช่วงเช้า แต่นักวิเคราะห์มองว่าความตื่นตระหนกของตลาดในวันนั้นเป็นเพียงการตื่นตูมกับเรื่องไม่เป็นเรื่อง", "slot_num": 572, "sheet_no": 6, "first_letter": "M"}, {"id": 425, "orig_slot": "#573", "idiom": "Neck of the woods", "meaning": "The nearby area.", "thai_idiom": "แถวบ้าน / ย่านนี้ / ถิ่นนี้", "thai_meaning": "บริเวณใกล้เคียง แถบ หรือย่านที่อยู่อาศัยที่คุ้นเคย", "ex1_en": "If you ever find yourself visiting this <span class=\"hl-teal\">neck of the woods</span>, let me take you to the best taco truck in town.", "ex1_hl": "neck of the woods", "ex1_th": "ถ้าเธอได้แวะมาแถวถิ่นนี้เมื่อไหร่ ให้ฉันพาไปชิมร้านรถขายทาโก้ที่เด็ดที่สุดในเมืองนะ", "ex2_en": "The regional logistics director inspected three potential distribution hubs in our <span class=\"hl-teal\">neck of the woods</span> to cut transit times.", "ex2_hl": "neck of the woods", "ex2_th": "ผู้อำนวยการฝ่ายโลจิสติกส์ประจำภูมิภาคได้ลงพื้นที่ตรวจสอบศูนย์กระจายสินค้าสามแห่งในย่านแถบนี้ เพื่อลดระยะเวลาการขนส่ง", "slot_num": 573, "sheet_no": 6, "first_letter": "N"}, {"id": 426, "orig_slot": "#576", "idiom": "Not my circus, not my monkeys", "meaning": "Not my problem.", "thai_idiom": "ไม่ใช่กงการอะไรของฉัน / ไม่ใช่เรื่องของฉัน / ธุระไม่ใช่", "thai_meaning": "ไม่ใช่ปัญหา ความรับผิดชอบ หรือหน้าที่ของตนเอง จึงไม่จำเป็นต้องเข้าไปยุ่งเกี่ยว", "ex1_en": "When my roommates began arguing loudly about who left the sink dirty, I simply grabbed my headphones—<span class=\"hl-teal\">not my circus, not my monkeys</span>.", "ex1_hl": "not my circus, not my monkeys", "ex1_th": "พอพวกรมเมตเริ่มเปิดศึกเถียงกันลั่นเรื่องใครทำอ่างล้างจานสกปรก ฉันก็แค่หยิบหูฟังมาใส่ทันที เพราะไม่ใช่เรื่องอะไรของฉัน", "ex2_en": "As the marketing and sales departments squabbled over conflicting quarterly KPIs, the legal advisor remained silent, thinking, '<span class=\"hl-teal\">Not my circus, not my monkeys</span>.'", "ex2_hl": "Not my circus, not my monkeys", "ex2_th": "ขณะที่ฝ่ายการตลาดและฝ่ายขายกำลังถกเถียงกันเรื่องตัวชี้วัดประจำไตรมาสที่ขัดแย้งกัน ที่ปรึกษากฎหมายก็นั่งนิ่งเงียบพลางคิดในใจว่า 'ธุระไม่ใช่เรื่องของฉัน'", "slot_num": 576, "sheet_no": 6, "first_letter": "N"}, {"id": 427, "orig_slot": "#577", "idiom": "Nothing to write home about", "meaning": "Not impressive.", "thai_idiom": "งั้น ๆ / ไม่มีอะไรโดดเด่น / ธรรมดามาก", "thai_meaning": "ธรรมดาสามัญ ไม่น่าประทับใจ หรือไม่มีอะไรน่าตื่นเต้นเป็นพิเศษ", "ex1_en": "The newly opened Italian bistro had great ambiance, but the pasta was honestly <span class=\"hl-teal\">nothing to write home about</span>.", "ex1_hl": "nothing to write home about", "ex1_th": "ร้านอาหารอิตาเลียนที่เพิ่งเปิดใหม่มีบรรยากาศที่ดีมาก แต่รสชาติของพาสต้าต้องบอกตามตรงว่างั้น ๆ ไม่มีอะไรโดดเด่น", "ex2_en": "While the new software release fixed minor bugs, analysts felt the incremental performance gains were <span class=\"hl-teal\">nothing to write home about</span>.", "ex2_hl": "nothing to write home about", "ex2_th": "แม้ว่าซอฟต์แวร์เวอร์ชันใหม่จะช่วยแก้ไขข้อผิดพลาดเล็ก ๆ น้อย ๆ ได้ แต่นักวิเคราะห์รู้สึกว่าประสิทธิภาพที่เพิ่มขึ้นมาเพียงเล็กน้อยนั้นธรรมดามากและไม่น่าประทับใจเท่าที่ควร", "slot_num": 577, "sheet_no": 6, "first_letter": "N"}, {"id": 428, "orig_slot": "#578", "idiom": "Off the beaten track", "meaning": "Away from crowded places.", "thai_idiom": "นอกเส้นทางยอดนิยม / เส้นทางลับ / หลบลี้ผู้คน", "thai_meaning": "ตั้งอยู่ในพื้นที่ที่ห่างไกล ชุมชนเงียบสงบ หรือไม่ได้อยู่ในเส้นทางหลักที่มีผู้คนพลุกพล่าน", "ex1_en": "We rented bicycles and discovered an isolated pebble beach slightly <span class=\"hl-teal\">off the beaten track</span>, away from all the noisy resorts.", "ex1_hl": "off the beaten track", "ex1_th": "พวกเราเช่าจักรยานปั่นไปจนเจอหาดหินกรวดอันเงียบสงบที่อยู่นอกเส้นทางท่องเที่ยวยอดนิยม ห่างไกลจากความวุ่นวายของบรรดารีสอร์ต", "ex2_en": "The boutique eco-lodge built its marketing strategy around offering luxury retreats situated entirely <span class=\"hl-teal\">off the beaten track</span>.", "ex2_hl": "off the beaten track", "ex2_th": "อีโคลอดจ์ระดับบูทีกแห่งนี้สร้างกลยุทธ์การตลาดโดยชูจุดเด่นเรื่องการให้บริการที่พักผ่อนสุดหรูหราบนทำเลที่หลบลี้ผู้คนและอยู่นอกเส้นทางสัญจรหลัก", "slot_num": 578, "sheet_no": 6, "first_letter": "O"}, {"id": 429, "orig_slot": "#579", "idiom": "Once in a while", "meaning": "Occasionally.", "thai_idiom": "นาน ๆ ที / นาน ๆ ครั้ง / นานทีปีหน", "thai_meaning": "เกิดขึ้นเป็นครั้งคราว ไม่บ่อยนัก", "ex1_en": "I strictly stick to homemade meals throughout the week, but <span class=\"hl-teal\">once in a while</span>, I indulge in double chocolate fudge cake.", "ex1_hl": "once in a while", "ex1_th": "ฉันทำอาหารกินเองอย่างเคร่งครัดตลอดทั้งสัปดาห์ แต่นาน ๆ ทีก็ขอให้รางวัลตัวเองด้วยเค้กดับเบิลช็อกโกแลตฟัดจ์บ้าง", "ex2_en": "Even with a permanent remote work policy, senior leadership convenes in-person strategy offsites <span class=\"hl-teal\">once in a while</span> to align priorities.", "ex2_hl": "once in a while", "ex2_th": "แม้ว่าบริษัทจะมีนโยบายทำงานระยะไกลแบบถาวร แต่ผู้บริหารระดับสูงก็ยังนัดประชุมสัมมนากลยุทธ์แบบพบหน้ากันนาน ๆ ครั้ง เพื่อปรับทิศทางการทำงานให้ตรงกัน", "slot_num": 579, "sheet_no": 6, "first_letter": "O"}, {"id": 430, "orig_slot": "#582", "idiom": "Put all your ducks in a row", "meaning": "Organize everything.", "thai_idiom": "เตรียมการให้พร้อมสรรพ / จัดแจงทุกอย่างให้เป็นระเบียบเรียบร้อย", "thai_meaning": "จัดการ เตรียมความพร้อม และจัดระเบียบทุกรายละเอียดให้เรียบร้อยก่อนลงมือทำสิ่งใด", "ex1_en": "Before we start loading the moving truck tomorrow morning, let's make sure we <span class=\"hl-teal\">put all our ducks in a row</span> tonight.", "ex1_hl": "put all our ducks in a row", "ex1_th": "ก่อนที่เราจะเริ่มขนของขึ้นรถบรรทุกย้ายบ้านในเช้าวันพรุ่งนี้ คืนนี้เรามาเตรียมการและจัดแจงทุกอย่างให้พร้อมสรรพกันก่อนดีกว่า", "ex2_en": "The legal team spent several months reviewing patents and vendor agreements to <span class=\"hl-teal\">put all their ducks in a row</span> prior to the initial public offering.", "ex2_hl": "put all their ducks in a row", "ex2_th": "ทีมกฎหมายใช้เวลาหลายเดือนในการตรวจสอบสิทธิบัตรและสัญญาคู่ค้าเพื่อเตรียมการทุกด้านให้พร้อมสรรพและเรียบร้อย ก่อนการเสนอขายหุ้นใหม่แก่ประชาชนทั่วไปเป็นครั้งแรก", "slot_num": 582, "sheet_no": 6, "first_letter": "P"}, {"id": 431, "orig_slot": "#583", "idiom": "Put on the back burner", "meaning": "Delay something.", "thai_idiom": "พักไว้ก่อน / ชะลอไว้ชั่วคราว / ลดความสำคัญลงก่อน", "thai_meaning": "เลื่อนเวลาหรือจัดให้เป็นเรื่องที่มีความสำคัญในลำดับรองลงไปชั่วคราว", "ex1_en": "Since we had to replace the broken refrigerator this month, our patio remodeling project had to be <span class=\"hl-teal\">put on the back burner</span>.", "ex1_hl": "put on the back burner", "ex1_th": "เนื่องจากเราจำเป็นต้องเปลี่ยนตู้เย็นที่เสียในเดือนนี้ โครงการปรับปรุงระเบียงบ้านจึงต้องถูกพักไว้ก่อนชั่วคราว", "ex2_en": "Following the unexpected budget cuts, the international expansion project was <span class=\"hl-teal\">put on the back burner</span> until the next fiscal year.", "ex2_hl": "put on the back burner", "ex2_th": "หลังจากการปรับลดงบประมาณอย่างกะทันหัน โครงการขยายธุรกิจไปต่างประเทศจึงถูกชะลอไว้ก่อนชั่วคราวจนกว่าจะถึงปีงบประมาณหน้า", "slot_num": 583, "sheet_no": 6, "first_letter": "P"}, {"id": 432, "orig_slot": "#584", "idiom": "Rain on someone's parade", "meaning": "Spoil someone's happiness.", "thai_idiom": "ดับฝัน / ขัดคอทำลายบรรยากาศ / ทำลายความสนุก", "thai_meaning": "ทำลายความสุข ความตื่นเต้น หรือความหวังของผู้อื่นด้วยการวิจารณ์ ขัดคอ หรือแจ้งข่าวร้าย", "ex1_en": "I hate to <span class=\"hl-teal\">rain on your parade</span>, but did you double-check whether that concert ticket refund was actually credited to your account?", "ex1_hl": "rain on your parade", "ex1_th": "ฉันไม่ได้อยากจะดับฝันหรือขัดคอให้เสียอารมณ์นะ แต่เธอตรวจดูดีหรือยังว่าเงินคืนค่าตั๋วคอนเสิร์ตนั้นโอนเข้าบัญชีจริง ๆ แล้วหรือยัง", "ex2_en": "Just as the sales team celebrated closing their biggest enterprise contract, legal stepped in to <span class=\"hl-teal\">rain on their parade</span> by pointing out crucial antitrust restrictions.", "ex2_hl": "rain on their parade", "ex2_th": "ในขณะที่ทีมขายกำลังเฉลิมฉลองการปิดดีลสัญญาระดับองค์กรครั้งใหญ่ที่สุด ฝ่ายกฎหมายก็เข้ามาขัดคอทำลายบรรยากาศด้วยการชี้ให้เห็นถึงข้อจำกัดสำคัญด้านกฎหมายป้องกันการผูกขาด", "slot_num": 584, "sheet_no": 6, "first_letter": "R"}, {"id": 433, "orig_slot": "#586", "idiom": "Right on the money", "meaning": "Exactly correct.", "thai_idiom": "เป๊ะเวอร์ / แม่นเหมือนจับวาง", "thai_meaning": "ถูกต้องตรงเผง, แม่นยำทุกประการ, ตรงเป้าอย่างสมบูรณ์แบบ", "ex1_en": "Your estimate about how long the drive would take was <span class=\"hl-teal\">right on the money</span>; we arrived in exactly three hours.", "ex1_hl": "right on the money", "ex1_th": "การคาดเดาของคุณว่าการขับรถจะใช้เวลานานแค่ไหนนี่แม่นเป๊ะเลย พวกเรามาถึงในเวลาสามชั่วโมงพอดิบพอดี", "ex2_en": "The senior economist's quarterly inflation forecast turned out to be <span class=\"hl-teal\">right on the money</span>, matching the central bank's published index.", "ex2_hl": "right on the money", "ex2_th": "การคาดการณ์อัตราเงินเฟ้อประจำไตรมาสของนักเศรษฐศาสตร์อาวุโสถูกต้องตรงเผงอย่างยิ่ง โดยตรงกับดัชนีที่ธนาคารกลางประกาศออกมา", "slot_num": 586, "sheet_no": 6, "first_letter": "R"}, {"id": 434, "orig_slot": "#587", "idiom": "Seen better days", "meaning": "Old and not in good condition.", "thai_idiom": "ผ่านศึกมาเยอะ / เก่าเก็บทรุดโทรม", "thai_meaning": "เก่าและทรุดโทรม, ผ่านการใช้งานมาอย่างสมบุกสมบันจนหมดสภาพความสดใหม่", "ex1_en": "Grandpa's favorite leather armchair has definitely <span class=\"hl-teal\">seen better days</span>, with worn cushions and frayed stitching on both armrests.", "ex1_hl": "seen better days", "ex1_th": "เก้าอี้อาร์มแชร์หนังตัวโปรดของคุณปู่ผ่านศึกมาเยอะจนทรุดโทรมอย่างเห็นได้ชัด ทั้งเบาะที่ยวบและรอยเย็บบนที่วางแขนทั้งสองข้างที่รุ่ยหมดแล้ว", "ex2_en": "An engineering audit concluded that the factory's backup generator had <span class=\"hl-teal\">seen better days</span> and required immediate replacement before winter.", "ex2_hl": "seen better days", "ex2_th": "การตรวจสอบทางวิศวกรรมสรุปว่าเครื่องกำเนิดไฟฟ้าสำรองของโรงงานมีสภาพเก่าทรุดโทรมอย่างมาก และจำเป็นต้องเปลี่ยนใหม่ทันทีก่อนเข้าสู่ฤดูหนาว", "slot_num": 587, "sheet_no": 6, "first_letter": "S"}, {"id": 435, "orig_slot": "#589", "idiom": "Step on the gas", "meaning": "Move faster; hurry.", "thai_idiom": "เหยียบคันเร่งมิด / เร่งสปีด", "thai_meaning": "เร่งความเร็ว, รีบเร่งทำสิ่งใดสิ่งหนึ่งให้เร็วขึ้นเพื่อให้ทันเวลา", "ex1_en": "If we don't <span class=\"hl-teal\">step on the gas</span>, the cinema doors will shut and we'll miss the opening scene.", "ex1_hl": "step on the gas", "ex1_th": "ถ้าพวกเราไม่รีบเร่งสปีดตอนนี้ ประตูโรงหนังคงจะปิดแล้วพวกเราก็จะพลาดฉากเปิดเรื่องแน่ๆ", "ex2_en": "With the fiscal year closing in three weeks, our sales division needs to <span class=\"hl-teal\">step on the gas</span> to meet our revenue targets.", "ex2_hl": "step on the gas", "ex2_th": "เนื่องจากปีงบประมาณจะสิ้นสุดลงในอีกสามสัปดาห์ แผนกขายของเราจึงจำเป็นต้องเร่งสปีดเต็มกำลังเพื่อให้บรรลุเป้าหมายรายได้", "slot_num": 589, "sheet_no": 6, "first_letter": "S"}, {"id": 436, "orig_slot": "#590", "idiom": "Stick to your guns", "meaning": "Stay firm in your opinion.", "thai_idiom": "ยืนกรานไม่ยอมถอย / ใจแข็งเด็ดเดี่ยว", "thai_meaning": "ยึดมั่นในจุดยืนหรือความคิดเห็นของตน ไม่ยอมอ่อนข้อแม้จะถูกกดดันหรือคัดค้าน", "ex1_en": "Even when everyone urged Maya to study finance, she <span class=\"hl-teal\">stuck to her guns</span> and pursued her passion for fine arts.", "ex1_hl": "stuck to her guns", "ex1_th": "แม้ทุกคนจะคะยั้นคะยอให้มายาเรียนการเงิน แต่เธอก็ยังยืนกรานไม่ยอมถอยและเลือกเดินตามความหลงใหลในด้านวิจิตรศิลป์", "ex2_en": "During contentious contract negotiations, the lead union representative <span class=\"hl-teal\">stuck to his guns</span> regarding overtime compensation.", "ex2_hl": "stuck to his guns", "ex2_th": "ในระหว่างการเจรจาสัญญาอันตึงเครียด ตัวแทนสหภาพแรงงานหลักได้ยืนกรานจุดยืนอย่างหนักแน่นในเรื่องค่าตอบแทนการทำงานล่วงเวลา", "slot_num": 590, "sheet_no": 6, "first_letter": "S"}, {"id": 437, "orig_slot": "#592", "idiom": "The best of both worlds", "meaning": "To have two good things together.", "thai_idiom": "ได้ประโยชน์สองต่อ / วิน-วินทั้งสองทาง", "thai_meaning": "การได้รับข้อดีหรือผลประโยชน์จากทั้งสองสิ่งพร้อมกันโดยไม่ต้องเสียสละสิ่งใดสิ่งหนึ่ง", "ex1_en": "Living on the city outskirts gives us <span class=\"hl-teal\">the best of both worlds</span>: peaceful green views and a quick subway commute downtown.", "ex1_hl": "the best of both worlds", "ex1_th": "การอาศัยอยู่แถบชานเมืองทำให้เราได้ประโยชน์สองต่อ ทั้งทิวทัศน์สีเขียวอันเงียบสงบและการเดินทางด้วยรถไฟใต้ดินเข้าสู่ใจกลางเมืองได้อย่างรวดเร็ว", "ex2_en": "The company's hybrid workplace policy offers employees <span class=\"hl-teal\">the best of both worlds</span> by combining face-to-face team collaboration with remote autonomy.", "ex2_hl": "the best of both worlds", "ex2_th": "นโยบายการทำงานแบบไฮบริดของบริษัทช่วยให้พนักงานได้รับประโยชน์สองต่อ โดยผสานการทำงานร่วมกันแบบเจอหน้าเข้ากับความอิสระในการทำงานจากระยะไกล", "slot_num": 592, "sheet_no": 6, "first_letter": "T"}, {"id": 438, "orig_slot": "#594", "idiom": "Think twice", "meaning": "Be careful before deciding.", "thai_idiom": "คิดหน้าคิดหลัง / ไตร่ตรองให้รอบคอบ", "thai_meaning": "พิจารณาไตร่ตรองอย่างละเอียดรอบคอบก่อนตัดสินใจทำสิ่งใดสิ่งหนึ่งเพื่อป้องกันผลเสียที่อาจตามมา", "ex1_en": "You should <span class=\"hl-teal\">think twice</span> before quitting your part-time job without having another steady income lined up.", "ex1_hl": "think twice", "ex1_th": "เธอควรคิดหน้าคิดหลังให้ดีก่อนที่จะลาออกจากงานพาร์ตไทม์โดยที่ยังไม่มีรายได้ที่มั่นคงอื่นมารองรับ", "ex2_en": "Surging logistics costs and geopolitical instability are making global manufacturers <span class=\"hl-teal\">think twice</span> before expanding into offshore facilities.", "ex2_hl": "think twice", "ex2_th": "ต้นทุนโลจิสติกส์ที่พุ่งสูงขึ้นและความไม่แน่นอนทางภูมิรัฐศาสตร์กำลังทำให้ผู้ผลิตระดับโลกต้องไตร่ตรองให้รอบคอบก่อนจะขยายโรงงานไปยังต่างประเทศ", "slot_num": 594, "sheet_no": 6, "first_letter": "T"}, {"id": 439, "orig_slot": "#596", "idiom": "Touch base", "meaning": "Check in or communicate.", "thai_idiom": "ประสานงาน / พูดคุยอัปเดตสั้นๆ", "thai_meaning": "ติดต่อประสานงาน, แวะพูดคุยเพื่อติดตามความคืบหน้าหรืออัปเดตข้อมูลสั้นๆ", "ex1_en": "I'll be passing through Seattle next weekend, so let's grab coffee and <span class=\"hl-teal\">touch base</span> about our upcoming road trip.", "ex1_hl": "touch base", "ex1_th": "สุดสัปดาห์หน้าฉันจะผ่านไปทางซีแอตเทิล เราไปดื่มกาแฟแล้วคุยอัปเดตกันสั้นๆ เรื่องทริปขับรถเที่ยวที่กำลังจะถึงเถอะ", "ex2_en": "The marketing director scheduled a brief fifteen-minute call on Monday morning to <span class=\"hl-teal\">touch base</span> with our regional brand ambassadors.", "ex2_hl": "touch base", "ex2_th": "ผู้อำนวยการฝ่ายการตลาดได้นัดหมายการโทรสั้นๆ สิบห้านาทีในเช้าวันจันทร์เพื่อพูดคุยประสานงานและอัปเดตข้อมูลกับแบรนด์แอมบาสเดอร์ประจำภูมิภาค", "slot_num": 596, "sheet_no": 6, "first_letter": "T"}, {"id": 440, "orig_slot": "#599", "idiom": "Wise as an owl", "meaning": "Very wise.", "thai_idiom": "ฉลาดเป็นกรด / ปราชญ์เปรื่องรอบรู้", "thai_meaning": "ฉลาดปราดเปรื่อง, สุขุมรอบคอบและเปี่ยมด้วยปัญญาหรือประสบการณ์อันลึกซึ้ง", "ex1_en": "Whenever our family encounters a difficult dispute, Uncle Robert steps in; he is as <span class=\"hl-teal\">wise as an owl</span> and brings peace to the room.", "ex1_hl": "wise as an owl", "ex1_th": "เมื่อใดก็ตามที่ครอบครัวเรามีข้อขัดแย้งที่จัดการยาก ลุงโรเบิร์ตจะยื่นมือเข้ามาช่วย ท่านเป็นคนสุขุมปราชญ์เปรื่องและทำให้ทุกคนกลับมาปรองดองกันได้เสมอ", "ex2_en": "The board appointed a retired federal magistrate who was as <span class=\"hl-teal\">wise as an owl</span> to head the independent ethics committee.", "ex2_hl": "wise as an owl", "ex2_th": "คณะกรรมการบริหารได้แต่งตั้งอดีตผู้พิพากษาศาลกลางที่เกษียณแล้ว ซึ่งเปี่ยมด้วยสติปัญญาและความรอบรู้ ให้มาทำหน้าที่เป็นประธานคณะกรรมการจริยธรรมอิสระ", "slot_num": 599, "sheet_no": 6, "first_letter": "W"}, {"id": 441, "orig_slot": "#601", "idiom": "A clean sweep", "meaning": "Win everything.", "thai_idiom": "กวาดเรียบ / ชนะถล่มทลาย", "thai_meaning": "การคว้าชัยชนะมาครองได้ทั้งหมดอย่างเบ็ดเสร็จเด็ดขาด, ชนะทุกรายการแข่งขัน", "ex1_en": "Our neighborhood swim club scored <span class=\"hl-teal\">a clean sweep</span> at the county tournament, taking home gold medals in every age category.", "ex1_hl": "a clean sweep", "ex1_th": "ชมรมว่ายน้ำหมู่บ้านของพวกเรากวาดเรียบในการแข่งขันระดับเทศมณฑล โดยคว้าเหรียญทองมาครองได้ในทุกรุ่นอายุ", "ex2_en": "The reformist coalition scored <span class=\"hl-teal\">a clean sweep</span> in yesterday's regional elections, claiming all thirty-six parliamentary seats.", "ex2_hl": "a clean sweep", "ex2_th": "กลุ่มพันธมิตรสายปฏิรูปชนะถล่มทลายอย่างเบ็ดเสร็จในการเลือกตั้งระดับภูมิภาคเมื่อวานนี้ โดยกวาดที่นั่งในสภาได้ครบทั้งสามสิบหกที่นั่ง", "slot_num": 601, "sheet_no": 7, "first_letter": "A"}, {"id": 442, "orig_slot": "#602", "idiom": "A league of one's own", "meaning": "Much better than others.", "thai_idiom": "เหนือชั้นไร้เทียมทาน / อยู่คนละระดับ", "thai_meaning": "โดดเด่นและยอดเยี่ยมกว่าคนอื่นอย่างเห็นได้ชัด, เก่งกาจจนไม่มีใครเทียบเคียงได้", "ex1_en": "While other bakers stick to simple sponge cakes, Elena's hand-sculpted sugar flowers place her in <span class=\"hl-teal\">a league of her own</span>.", "ex1_hl": "a league of her own", "ex1_th": "ในขณะที่ช่างอบขนมคนอื่นๆ ทำเค้กสปันจ์ธรรมดาๆ แต่งานปั้นดอกไม้น้ำตาลด้วยมืออันประณีตของเอเลน่าทำให้เธออยู่คนละระดับอย่างเหนือชั้น", "ex2_en": "With ultra-low power consumption and unmatched neural processing speed, the firm's new AI semiconductor is truly in <span class=\"hl-teal\">a league of its own</span>.", "ex2_hl": "a league of its own", "ex2_th": "ด้วยอัตราการกินไฟที่ต่ำมากและความเร็วในการประมวลผลเครือข่ายประสาทที่ไร้เทียมทาน ชิปเซมิคอนดักเตอร์ AI ตัวใหม่ของบริษัทจึงเหนือชั้นไร้คู่ต่อกรในตลาดอย่างแท้จริง", "slot_num": 602, "sheet_no": 7, "first_letter": "A"}, {"id": 443, "orig_slot": "#603", "idiom": "A matter of record", "meaning": "Officially known.", "thai_idiom": "เป็นหลักฐานบันทึกไว้ / ข้อมูลประจักษ์ชัด", "thai_meaning": "ข้อเท็จจริงที่ได้รับการจดบันทึกไว้เป็นลายลักษณ์อักษรอย่างเป็นทางการและตรวจสอบได้", "ex1_en": "It is <span class=\"hl-teal\">a matter of record</span> that Marcus borrowed my lawnmower last spring, so he can't pretend he doesn't have it.", "ex1_hl": "a matter of record", "ex1_th": "มันมีหลักฐานบันทึกข้อความไว้ชัดเจนว่ามาร์คัสยืมเครื่องตัดหญ้าของฉันไปเมื่อฤดูใบไม้ผลิที่แล้ว เขาจึงจะมาทำเนียนว่าไม่มีไม่ได้", "ex2_en": "The lead prosecutor emphasized that the corporate officer's fraudulent transactions were now <span class=\"hl-teal\">a matter of record</span> before the tribunal.", "ex2_hl": "a matter of record", "ex2_th": "หัวหน้าพนักงานอัยการเน้นย้ำว่าการทำธุรกรรมฉ้อโกงของผู้บริหารบริษัทได้กลายมาเป็นหลักฐานที่บันทึกไว้ในสำนวนอย่างเป็นทางการต่อหน้าศาลแล้ว", "slot_num": 603, "sheet_no": 7, "first_letter": "A"}, {"id": 444, "orig_slot": "#604", "idiom": "A nod is as good as a wink", "meaning": "A subtle hint or agreement.", "thai_idiom": "รู้กันโดยไม่ต้องพูดเยอะ / แค่พยักหน้าก็เข้าใจตรงกัน", "thai_meaning": "การส่งสัญญาณเพียงเล็กน้อยก็เพียงพอที่จะเข้าใจความหมายตรงกันแล้วโดยไม่ต้องเอ่ยคำพูดใดๆ", "ex1_en": "When Liam glanced toward the exit door and tapped his wristwatch, <span class=\"hl-teal\">a nod was as good as a wink</span>, and we slipped out quietly.", "ex1_hl": "a nod was as good as a wink", "ex1_th": "พอเลียมชำเลืองมองไปทางประตูทางออกแล้วเคาะที่นาฬิกาข้อมือ แค่พยักหน้าทีเดียวก็รู้กันทันที แล้วพวกเราก็ค่อยๆ ย่องออกจากงานไปอย่างเงียบเชียบ", "ex2_en": "In high-level corporate diplomacy, formal contracts often follow subtle cues; between seasoned negotiators, <span class=\"hl-teal\">a nod is as good as a wink</span>.", "ex2_hl": "a nod is as good as a wink", "ex2_th": "ในการเจรจาธุรกิจระดับสูง สัญญาที่เป็นทางการมักตามหลังสัญญาณอันแนบเนียน สำหรับนักเจรจารุ่นเก๋าแล้ว แค่ส่งสัญญาณนิดเดียวก็เข้าใจตรงกันโดยไม่ต้องพูดเยอะ", "slot_num": 604, "sheet_no": 7, "first_letter": "A"}, {"id": 445, "orig_slot": "#605", "idiom": "A peanut gallery", "meaning": "People who criticize from the side.", "thai_idiom": "พวกวิจารณ์ข้างสนาม / คนชอบติเตียนนอกวง", "thai_meaning": "กลุ่มคนที่คอยส่งเสียงวิจารณ์ แซว หรือติเตียนเรื่องของคนอื่นจากรอบนอกโดยไม่ได้ลงมือทำเอง", "ex1_en": "I was just trying to fix the kitchen sink, but my brothers sat on the stools acting like <span class=\"hl-teal\">a peanut gallery</span>, questioning every wrench turn.", "ex1_hl": "a peanut gallery", "ex1_th": "ฉันแค่กำลังพยายามซ่อมซิงก์ล้างจานในครัว แต่พวกพี่ชายกลับนั่งบนเก้าอี้สตูลทำตัวเป็นพวกวิจารณ์ข้างสนาม คอยซักไซ้สงสัยทุกครั้งที่ฉันหมุนประแจ", "ex2_en": "The managing partner silenced <span class=\"hl-teal\">a peanut gallery</span> of junior analysts who were whispering cynical commentary during the guest lecture.", "ex2_hl": "a peanut gallery", "ex2_th": "หุ้นส่วนผู้จัดการได้ปรามกลุ่มนักวิเคราะห์รุ่นน้องที่ชอบติเตียนอยู่ด้านหลัง ซึ่งกำลังกระซิบกระซาบวิจารณ์ในแง่ลบระหว่างการบรรยายพิเศษของวิทยากรรับเชิญ", "slot_num": 605, "sheet_no": 7, "first_letter": "A"}, {"id": 446, "orig_slot": "#608", "idiom": "All hands on deck", "meaning": "Everyone is needed.", "thai_idiom": "ระดมพลทุกคน / ทุกคนต้องช่วยกันเต็มที่", "thai_meaning": "สถานการณ์เร่งด่วนที่จำเป็นต้องให้ทุกคนมาร่วมแรงร่วมใจช่วยเหลือกันอย่างเต็มกำลังความสามารถ", "ex1_en": "With fifty dinner guests arriving in an hour and the salads still unprepared, it was <span class=\"hl-teal\">all hands on deck</span> in our tiny kitchen.", "ex1_hl": "all hands on deck", "ex1_th": "เนื่องจากแขกรับประทานอาหารค่ำห้าสิบคนจะมาถึงในอีกหนึ่งชั่วโมงแต่สลัดยังเตรียมไม่เสร็จ ทุกคนจึงต้องระดมกำลังช่วยกันในครัวเล็กๆ ของเราอย่างจ้าละหวั่น", "ex2_en": "Following the critical server outage that halted digital banking nationwide, the bank called for <span class=\"hl-teal\">all hands on deck</span> across its infrastructure engineering squads.", "ex2_hl": "all hands on deck", "ex2_th": "หลังจากเกิดเหตุเซิร์ฟเวอร์ล่มขั้นวิกฤตจนระบบธนาคารออนไลน์หยุดชะงักทั่วประเทศ ทางธนาคารจึงสั่งระดมพลเจ้าหน้าที่ทุกคนในทีมวิศวกรรมโครงสร้างพื้นฐานมาเร่งกู้ระบบ", "slot_num": 608, "sheet_no": 7, "first_letter": "A"}, {"id": 447, "orig_slot": "#609", "idiom": "All in good time", "meaning": "Everything happens at the right time.", "thai_idiom": "ช้าๆ ได้พร้าเล่มงาม / ถึงเวลาแล้วจะมาเอง", "thai_meaning": "ทุกสิ่งทุกอย่างย่อมเกิดขึ้นเมื่อถึงเวลาที่เหมาะสม, ควรรอคอยอย่างใจเย็นโดยไม่ต้องใจร้อนเร่งรัด", "ex1_en": "You can't expect your newly planted rose bushes to bloom overnight; have patience, and they'll flower <span class=\"hl-teal\">all in good time</span>.", "ex1_hl": "all in good time", "ex1_th": "เธอจะคาดหวังให้ต้นกุหลาบที่เพิ่งปลูกใหม่ผลิดอกชั่วข้ามคืนไม่ได้หรอกนะ ใจเย็นๆ แล้วดอกไม้จะเบ่งบานเมื่อถึงเวลาของมันเอง", "ex2_en": "The principal investigator reassured impatient investors that clinical trial validation must be rigorous and will conclude <span class=\"hl-teal\">all in good time</span>.", "ex2_hl": "all in good time", "ex2_th": "หัวหน้านักวิจัยปลอบใจนักลงทุนที่ใจร้อนว่าการทดสอบทางคลินิกต้องทำอย่างรัดกุมรอบคอบ และจะเสร็จสมบูรณ์เมื่อถึงจังหวะเวลาที่เหมาะสมอย่างแน่นอน", "slot_num": 609, "sheet_no": 7, "first_letter": "A"}, {"id": 448, "orig_slot": "#610", "idiom": "All that and a bag of chips", "meaning": "Much more than enough.", "thai_idiom": "เจ๋งสุดยอด / ดีเลิศประเสริฐศรี / มีดีเกินเบอร์", "thai_meaning": "ยอดเยี่ยมเป็นพิเศษ, สมบูรณ์แบบและมีดีมากกว่าคนอื่น (มักใช้แซวคนที่หลงตัวเอง หรือใช้ชมสิ่งของที่มีคุณสมบัติครบครันอย่างยิ่ง)", "ex1_en": "After winning the karaoke championship, Kevin strutted across the bar convinced that he was <span class=\"hl-teal\">all that and a bag of chips</span>.", "ex1_hl": "all that and a bag of chips", "ex1_th": "หลังจากชนะการแข่งขันคาราโอเกะ เควินก็เดินวางมาดไปทั่วบาร์ด้วยความมั่นอกมั่นใจว่าตัวเองเจ๋งสุดยอดวิเศษเลิศเลอกว่าใครเพื่อน", "ex2_en": "Automotive critics marveled at the electric sports car, declaring its zero-to-sixty acceleration and opulent interior to be <span class=\"hl-teal\">all that and a bag of chips</span>.", "ex2_hl": "all that and a bag of chips", "ex2_th": "นักวิจารณ์ยานยนต์ต่างทึ่งในรถสปอร์ตไฟฟ้ารุ่นนี้ โดยยกย่องว่าอัตราเร่งจากศูนย์ถึงหกสิบไมล์และการตกแต่งภายในอันหรูหรานั้นยอดเยี่ยมครบเครื่องเกินเบอร์จริงๆ", "slot_num": 610, "sheet_no": 7, "first_letter": "A"}, {"id": 449, "orig_slot": "#611", "idiom": "As cool as a cucumber", "meaning": "Very calm.", "thai_idiom": "ใจเย็นเป็นน้ำแข็ง / นิ่งสงบสยบทุกสิ่ง", "thai_meaning": "สงบนิ่งและใจเย็นอย่างยิ่ง, ไม่แสดงความตื่นตกใจหรือหวั่นไหวแม้ตกอยู่ในสถานการณ์ตึงเครียด", "ex1_en": "Even when the thunderstorm knocked out the power during our family dinner, Mom stayed <span class=\"hl-teal\">as cool as a cucumber</span> and calmly lit the candles.", "ex1_hl": "as cool as a cucumber", "ex1_th": "แม้กระทั่งตอนที่พายุฝนฟ้าคะนองทำไฟดับกลางโต๊ะอาหารค่ำของครอบครัว แม่ก็ยังใจเย็นนิ่งสงบและจุดเทียนขึ้นมาอย่างไม่สะทกสะท้าน", "ex2_en": "Under intense grilling from legislative auditors regarding budgetary discrepancies, the chief financial officer remained <span class=\"hl-teal\">as cool as a cucumber</span>.", "ex2_hl": "as cool as a cucumber", "ex2_th": "ภายใต้การซักฟอกอย่างหนักหน่วงจากผู้ตรวจสอบบัญชีของรัฐสภาเกี่ยวกับผลต่างของงบประมาณ ประธานเจ้าหน้าที่ฝ่ายการเงินยังคงนิ่งสงบสุขุมได้อย่างน่าทึ่ง", "slot_num": 611, "sheet_no": 7, "first_letter": "A"}, {"id": 450, "orig_slot": "#612", "idiom": "Back in the day", "meaning": "In the past.", "thai_idiom": "สมัยก่อน / วันวานยังหวานอยู่ / ยุคก่อนนู้น", "thai_meaning": "ในอดีต, ในช่วงเวลาที่ผ่านมานานแล้ว (มักนึกถึงหรือเปรียบเทียบกับชีวิตในอดีต)", "ex1_en": "<span class=\"hl-teal\">Back in the day</span>, we had to coordinate weekend meetups days in advance using landline telephones instead of group chats.", "ex1_hl": "Back in the day", "ex1_th": "สมัยก่อน พวกเราต้องนัดเจอกันช่วงสุดสัปดาห์ล่วงหน้านานหลายวันผ่านโทรศัพท์บ้าน แทนที่จะส่งข้อความหากันในแชตกลุ่มเหมือนทุกวันนี้", "ex2_en": "<span class=\"hl-teal\">Back in the day</span>, institutional traders placed stock orders via screaming brokers on exchange floors rather than automated algorithmic platforms.", "ex2_hl": "Back in the day", "ex2_th": "ในยุคก่อนนู้น เทรดเดอร์สถาบันต้องส่งคำสั่งซื้อขายหุ้นผ่านโบรกเกอร์ที่ตะโกนส่งเสียงในห้องค้าหลักทรัพย์ แทนที่จะใช้แพลตฟอร์มอัลกอริทึมอัตโนมัติ", "slot_num": 612, "sheet_no": 7, "first_letter": "B"}, {"id": 451, "orig_slot": "#613", "idiom": "Back to the salt mines", "meaning": "Return to hard work.", "thai_idiom": "กลับไปก้มหน้าก้มตาทำงานหนัก / ถึงเวลาลุยงานต่อ", "thai_meaning": "กลับไปทำงานหนักหรือภาระหน้าที่อันเหน็ดเหนื่อยตามเดิม (มักใช้พูดติดตลกหลังหมดเวลาพักผ่อน)", "ex1_en": "Well, lunch break is officially over, so I guess it's time to head <span class=\"hl-teal\">back to the salt mines</span>.", "ex1_hl": "back to the salt mines", "ex1_th": "เอาล่ะ พักเที่ยงหมดเวลาอย่างเป็นทางการแล้ว สงสัยถึงเวลาต้องกลับไปก้มหน้าก้มตาทำงานหนักกันต่อแล้วล่ะ", "ex2_en": "After enjoying a festive two-week holiday furlough, the production staff returned <span class=\"hl-teal\">back to the salt mines</span> to fulfill backlog factory orders.", "ex2_hl": "back to the salt mines", "ex2_th": "หลังจากได้หยุดพักผ่อนยาวสองสัปดาห์ช่วงเทศกาล ทีมฝ่ายผลิตก็กลับไปลุยงานหนักกันต่อเพื่อเคลียร์คำสั่งซื้อที่คั่งค้างในโรงงานให้เสร็จสิ้น", "slot_num": 613, "sheet_no": 7, "first_letter": "B"}, {"id": 452, "orig_slot": "#614", "idiom": "Beat the system", "meaning": "Outwit rules or controls.", "thai_idiom": "เอาชนะระบบ / เลี่ยงบาลีหาช่องโหว่", "thai_meaning": "ใช้ไหวพริบหาช่องโหว่เพื่อเอาชนะหรือหลีกเลี่ยงกฎเกณฑ์ ข้อบังคับ หรือระบบควบคุมเพื่อผลประโยชน์ส่วนตน", "ex1_en": "Toby thought he could <span class=\"hl-teal\">beat the system</span> by setting his clock back to avoid late fees at the rental counter, but the digital timestamp caught him.", "ex1_hl": "beat the system", "ex1_th": "โทบีคิดว่าจะเอาชนะระบบได้ด้วยการหมุนเข็มนาฬิกาย้อนกลับเพื่อเลี่ยงค่าปรับคืนของช้าที่เคาน์เตอร์เช่า แต่เวลาระบบดิจิทัลก็จับไต๋เขาได้ทันควัน", "ex2_en": "Aggressive corporate accountants designed complex shell holding companies to <span class=\"hl-teal\">beat the system</span>, but international tax authorities uncovered the scheme.", "ex2_hl": "beat the system", "ex2_th": "นักบัญชีของบริษัทที่หัวหมอได้ออกแบบบริษัทโฮลดิ้งบังหน้าอันซับซ้อนเพื่อหาช่องโหว่เอาชนะระบบ แต่หน่วยงานภาษีระหว่างประเทศก็สืบพบกลลวงดังกล่าว", "slot_num": 614, "sheet_no": 7, "first_letter": "B"}, {"id": 453, "orig_slot": "#615", "idiom": "Bite the dust", "meaning": "Fall or be defeated.", "thai_idiom": "พ่ายแพ้ราบคาบ / เจ๊งไม่เป็นท่า / ร่วงตกรอบ", "thai_meaning": "พ่ายแพ้, ล้มเหลวไม่เป็นท่า, เสียชีวิต, หรือพังเสียหายจนใช้การไม่ได้", "ex1_en": "My trusty cordless vacuum cleaner finally <span class=\"hl-teal\">bit the dust</span> this morning after eight years of spotless service.", "ex1_hl": "bit the dust", "ex1_th": "เครื่องดูดฝุ่นไร้สายคู่ใจของฉันในที่สุดก็พังดับอนาถไปเมื่อเช้านี้ หลังจากใช้งานทำความสะอาดอย่างยอดเยี่ยมมานานถึงแปดปี", "ex2_en": "Unable to secure late-stage funding amidst rising interest rates, yet another quick-commerce delivery startup <span class=\"hl-teal\">bit the dust</span> last week.", "ex2_hl": "bit the dust", "ex2_th": "เนื่องจากไม่สามารถระดมทุนในระยะสุดท้ายท่ามกลางอัตราดอกเบี้ยขาขึ้นได้ สตาร์ทอัพจัดส่งด่วนอีกแห่งจึงต้องเจ๊งไม่เป็นท่าไปเมื่อสัปดาห์ที่แล้ว", "slot_num": 615, "sheet_no": 7, "first_letter": "B"}, {"id": 454, "orig_slot": "#616", "idiom": "Blessing in disguise", "meaning": "Something good in a bad situation.", "thai_idiom": "ทุกขลาภ / เรื่องร้ายกลายเป็นดี", "thai_meaning": "เรื่องร้ายหรือความผิดหวังในตอนแรกที่กลับกลายเป็นสิ่งดีหรือนำโชคลาภมาให้ในภายหลัง", "ex1_en": "Losing my flight connection in Munich was a <span class=\"hl-teal\">blessing in disguise</span> because the airline gave me a free luxury hotel stay and food vouchers.", "ex1_hl": "blessing in disguise", "ex1_th": "การต่อเครื่องไม่ทันที่มิวนิกกลับกลายเป็นเรื่องร้ายที่กลายเป็นดี เพราะสายการบินเปิดห้องพักโรงแรมหรูฟรีพร้อมคูปองอาหารให้ฉันแทน", "ex2_en": "The rejection of our initial merger proposal turned out to be a <span class=\"hl-teal\">blessing in disguise</span>, sparing our firm from absorbing our rival's toxic debt.", "ex2_hl": "blessing in disguise", "ex2_th": "การที่ข้อเสนอควบรวมกิจการในตอนแรกถูกปฏิเสธกลับกลายเป็นทุกขลาภที่โชคดีมาก เพราะช่วยให้บริษัทของเราไม่ต้องแบกรับหนี้เสียมหาศาลของคู่แข่ง", "slot_num": 616, "sheet_no": 7, "first_letter": "B"}, {"id": 455, "orig_slot": "#617", "idiom": "Break away from", "meaning": "Leave or escape.", "thai_idiom": "ตีตัวออกห่าง / แยกตัวเป็นอิสระ / ฉีกตัวออกจาก", "thai_meaning": "หลุดพ้น, แยกตัวออกมาจากกลุ่ม อิทธิพล ข้อผูกมัด หรือธรรมเนียมเดิม เพื่อเริ่มต้นทางเดินของตนเอง", "ex1_en": "Liam wanted to <span class=\"hl-teal\">break away from</span> his family's small-town bakery business and establish an independent pottery studio.", "ex1_hl": "break away from", "ex1_th": "เลียมต้องการแยกตัวออกจากธุรกิจร้านเบเกอรี่ในเมืองเล็กของครอบครัวเพื่อไปเปิดสตูดิโอเครื่องปั้นดินเผาอิสระของตนเอง", "ex2_en": "Dissatisfied with the parent firm's bureaucratic inertia, several senior AI researchers decided to <span class=\"hl-teal\">break away from</span> the tech conglomerate.", "ex2_hl": "break away from", "ex2_th": "ด้วยความไม่พอใจในความเฉื่อยชาของระบบราชการในบริษัทแม่ นักวิจัย AI อาวุโสหลายคนจึงตัดสินใจแยกตัวออกมาจากกลุ่มบริษัทเทคโนโลยียักษ์ใหญ่", "slot_num": 617, "sheet_no": 7, "first_letter": "B"}, {"id": 456, "orig_slot": "#618", "idiom": "Break bread with someone", "meaning": "Share a meal with someone.", "thai_idiom": "ร่วมโต๊ะรับประทานอาหาร / กระชับมิตรไมตรี", "thai_meaning": "ร่วมรับประทานอาหารด้วยกันเพื่อแสดงไมตรีจิตและความปรองดอง, กระชับความสัมพันธ์ผ่านมื้ออาหาร", "ex1_en": "We invited our new neighbors over on Friday evening to <span class=\"hl-teal\">break bread with them</span> and make them feel at home.", "ex1_hl": "break bread with them", "ex1_th": "พวกเราชวนเพื่อนบ้านที่เพิ่งย้ายมาใหม่มาร่วมโต๊ะรับประทานอาหารด้วยกันในเย็นวันศุกร์เพื่อให้พวกเขารู้สึกอบอุ่นเหมือนอยู่บ้าน", "ex2_en": "Before finalizing the international joint venture, the executive delegation gathered to <span class=\"hl-teal\">break bread with their prospective partners</span> in Tokyo.", "ex2_hl": "break bread with their prospective partners", "ex2_th": "ก่อนที่จะลงนามในสัญญาร่วมทุนระหว่างประเทศ คณะผู้แทนผู้บริหารได้นัดพบเพื่อร่วมรับประทานอาหารกระชับมิตรไมตรีกับว่าที่พันธมิตรทางธุรกิจที่โตเกียว", "slot_num": 618, "sheet_no": 7, "first_letter": "B"}, {"id": 457, "orig_slot": "#619", "idiom": "Build bridges", "meaning": "Create good relationships.", "thai_idiom": "ผูกมิตรไมตรี / สานสัมพันธ์เชื่อมรอยร้าว", "thai_meaning": "สร้างหรือประสานความสัมพันธ์อันดีระหว่างกลุ่มคนที่เคยขัดแย้ง ไม่เข้าใจ หรือห่างเหินกัน", "ex1_en": "After their petty dispute about property boundaries, Carlos brought over fresh garden produce to help <span class=\"hl-teal\">build bridges</span> with his neighbor.", "ex1_hl": "build bridges", "ex1_th": "หลังจากที่เคยมีปากเสียงเล็กๆ น้อยๆ เรื่องแนวเขตที่ดิน คาร์ลอสจึงนำผักสดจากสวนไปมอบให้เพื่อช่วยสานสัมพันธ์และสมานรอยร้าวกับเพื่อนบ้าน", "ex2_en": "The newly appointed diplomat worked tirelessly to <span class=\"hl-teal\">build bridges</span> between the two bordering nations following decades of border friction.", "ex2_hl": "build bridges", "ex2_th": "นักการทูตที่เพิ่งได้รับการแต่งตั้งใหม่ได้ทำงานอย่างไม่รู้จักเหน็ดเหนื่อยเพื่อผูกมิตรไมตรีและเชื่อมสัมพันธ์ระหว่างสองประเทศเพื่อนบ้านหลังจากมีความขัดแย้งตามแนวชายแดนมายาวนานหลายทศวรรษ", "slot_num": 619, "sheet_no": 7, "first_letter": "B"}, {"id": 458, "orig_slot": "#620", "idiom": "Burn a hole in your pocket", "meaning": "Spend money quickly.", "thai_idiom": "เงินร้อน / กระเป๋าฉีก / มีเงินเป็นต้องใช้", "thai_meaning": "เงินที่อยู่ในมือแล้วรู้สึกคันไม้คันมืออยากใช้จ่ายออกไปทันที, เก็บเงินไม่อยู่", "ex1_en": "Whenever Sophie receives her monthly allowance, the cash seems to <span class=\"hl-teal\">burn a hole in her pocket</span> until she spends it all on clothes.", "ex1_hl": "burn a hole in her pocket", "ex1_th": "เมื่อใดก็ตามที่โซฟีได้รับเงินค่าขนมประจำเดือน เงินสดนั้นก็เหมือนเงินร้อนที่เก็บไม่อยู่จนกระทั่งเธอช้อปปิ้งเสื้อผ้าจนเกลี้ยง", "ex2_en": "Flush with venture capital liquidity, the inexperienced founder let surplus funds <span class=\"hl-teal\">burn a hole in his pocket</span> by splurging on lavish office perks.", "ex2_hl": "burn a hole in his pocket", "ex2_th": "ด้วยความที่มีเงินสดจากเงินร่วมลงทุนล้นมือ ผู้ก่อตั้งไร้ประสบการณ์จึงปล่อยให้เงินร้อนกระเป๋าฉีกโดยการทุ่มใช้จ่ายไปกับสวัสดิการออฟฟิศอันหรูหราฟุ่มเฟือย", "slot_num": 620, "sheet_no": 7, "first_letter": "B"}, {"id": 459, "orig_slot": "#623", "idiom": "Call the tune", "meaning": "Be in control.", "thai_idiom": "เป็นผู้กุมบังเหียน / เป็นคนกำหนดทิศทาง", "thai_meaning": "มีอำนาจสั่งการหรือมีอิทธิพลในการตัดสินใจกำหนดทิศทางของสิ่งต่างๆ", "ex1_en": "Since Dad is paying for our entire family vacation, he gets to <span class=\"hl-teal\">call the tune</span> regarding which resort we book.", "ex1_hl": "call the tune", "ex1_th": "ในเมื่อคุณพ่อเป็นคนออกค่าใช้จ่ายทั้งหมดสำหรับทริปครอบครัว ท่านจึงเป็นผู้กำหนดทิศทางและตัดสินใจว่าจะจองรีสอร์ตไหน", "ex2_en": "As the majority equity shareholder providing emergency financing, the venture fund now effectively <span class=\"hl-teal\">calls the tune</span> on executive appointments.", "ex2_hl": "calls the tune", "ex2_th": "ในฐานะผู้ถือหุ้นใหญ่ที่จัดหาเงินทุนช่วยเหลือฉุกเฉิน กองทุนร่วมลงทุนจึงเป็นผู้กุมบังเหียนตัวจริงในการตัดสินใจแต่งตั้งผู้บริหารระดับสูง", "slot_num": 623, "sheet_no": 7, "first_letter": "C"}, {"id": 460, "orig_slot": "#624", "idiom": "Can't beat that", "meaning": "Very good; impossible to improve.", "thai_idiom": "ไม่มีอะไรดีไปกว่านี้แล้ว / คุ้มค่าที่สุดจนหาที่เปรียบไม่ได้", "thai_meaning": "ยอดเยี่ยมมาก, คุ้มค่าหรือดีเลิศจนไม่มีสิ่งใดจะมาเอาชนะหรือเทียบเคียงได้", "ex1_en": "A homemade wood-fired pizza and a craft soda for under eight dollars? You honestly <span class=\"hl-teal\">can't beat that</span>.", "ex1_hl": "can't beat that", "ex1_th": "พิซซ่าเตาฟืนโฮมเมดกับคราฟต์โซดาในราคาไม่ถึงแปดดอลลาร์เหรอ พูดตรงๆ เลยว่าไม่มีอะไรจะคุ้มค่าและดีไปกว่านี้อีกแล้ว", "ex2_en": "Securing round-trip business class tickets with zero blackout dates at an eighty percent discount—corporate travel managers agreed they <span class=\"hl-teal\">couldn't beat that</span>.", "ex2_hl": "couldn't beat that", "ex2_th": "การจองตั๋วเครื่องบินชั้นธุรกิจไป-กลับโดยไม่มีเงื่อนไขวันห้ามเดินทางพร้อมส่วนลดถึงแปดสิบเปอร์เซ็นต์ ผู้จัดการฝ่ายเดินทางองค์กรต่างเห็นพ้องต้องกันว่าหาดีกว่านี้ไม่ได้อีกแล้ว", "slot_num": 624, "sheet_no": 7, "first_letter": "C"}, {"id": 461, "orig_slot": "#625", "idiom": "Cast in stone", "meaning": "Unchangeable; permanent.", "thai_idiom": "จารึกบนแผ่นหิน / เปลี่ยนแปลงไม่ได้", "thai_meaning": "มั่นคงถาวร, กำหนดไว้แน่นอนตายตัวจนไม่สามารถปรับเปลี่ยนหรือแก้ไขได้อีก", "ex1_en": "This initial itinerary for our road trip isn't <span class=\"hl-teal\">cast in stone</span>, so feel free to suggest alternate hiking trails.", "ex1_hl": "cast in stone", "ex1_th": "แผนการเดินทางเบื้องต้นสำหรับทริปขับรถเที่ยวของเราไม่ได้จารึกบนแผ่นหินว่าจะแก้ไม่ได้นะ ดังนั้นเสนอเส้นทางเดินป่าอื่นได้ตามสบายเลย", "ex2_en": "The chief operating officer clarified that while the project budget had been endorsed, operational deadlines were not completely <span class=\"hl-teal\">cast in stone</span>.", "ex2_hl": "cast in stone", "ex2_th": "ประธานเจ้าหน้าที่ฝ่ายปฏิบัติการชี้แจงว่า แม้งบประมาณโครงการจะได้รับการอนุมัติแล้ว แต่กำหนดเวลาการทำงานก็ไม่ได้เปลี่ยนแปลงไม่ได้อย่างตายตัว", "slot_num": 625, "sheet_no": 7, "first_letter": "C"}, {"id": 462, "orig_slot": "#626", "idiom": "Change the subject", "meaning": "Talk about something else.", "thai_idiom": "เปลี่ยนประเด็น / เปลี่ยนเรื่องคุย", "thai_meaning": "เบี่ยงเบนหัวข้อการสนทนาไปพูดเรื่องอื่นเพื่อหลีกเลี่ยงความอึดอัด ลำบากใจ หรือข้อขัดแย้ง", "ex1_en": "Whenever someone brings up his former fiancée, Darren immediately tries to <span class=\"hl-teal\">change the subject</span> by asking about the weather.", "ex1_hl": "change the subject", "ex1_th": "เมื่อใดก็ตามที่มีคนเอ่ยถึงอดีตคู่หมั้น แดร์เรนจะรีบเปลี่ยนประเด็นคุยทันทีด้วยการหันไปถามเรื่องสภาพดินฟ้าอากาศแทน", "ex2_en": "When pressed by reporters regarding the widening accounting irregularities, the company spokesperson attempted to <span class=\"hl-teal\">change the subject</span> toward charity initiatives.", "ex2_hl": "change the subject", "ex2_th": "เมื่อถูกผู้สื่อข่าวซักฟอกเกี่ยวกับความผิดปกติทางบัญชีที่บานปลาย โฆษกบริษัทจึงพยายามเปลี่ยนประเด็นไปพูดถึงโครงการการกุศลของบริษัทแทน", "slot_num": 626, "sheet_no": 7, "first_letter": "C"}, {"id": 463, "orig_slot": "#627", "idiom": "Close ranks", "meaning": "Support each other secretly.", "thai_idiom": "กอดคอสมานฉันท์ / รวมพลังปกป้องพวกพ้อง", "thai_meaning": "รวมตัวกันอย่างเหนียวแน่นเพื่อปกป้องพวกพ้องหรือองค์กรจากการถูกโจมตีหรือการวิพากษ์วิจารณ์จากภายนอก", "ex1_en": "When the school principal questioned the soccer team about the broken trophy case, the players <span class=\"hl-teal\">closed ranks</span> and refused to name the culprit.", "ex1_hl": "closed ranks", "ex1_th": "เมื่อครูใหญ่สอบถามทีมฟุตบอลเรื่องตู้โชว์ถ้วยรางวัลที่พังเสียหาย บรรดานักฟุตบอลต่างกอดคอสมานฉันท์ปกป้องพวกพ้องและปฏิเสธที่จะบอกชื่อคนทำ", "ex2_en": "Amid allegations of regulatory misconduct, the hospital's senior medical board <span class=\"hl-teal\">closed ranks</span> to protect their surgical staff from public scrutiny.", "ex2_hl": "closed ranks", "ex2_th": "ท่ามกลางข้อกล่าวหาเรื่องการประพฤติผิดต่อระเบียบวิชาชีพ คณะกรรมการแพทย์อาวุโสของโรงพยาบาลได้รวมพลังปกป้องพวกพ้องเพื่อกันทีมศัลยแพทย์ออกจากการตรวจสอบของสังคม", "slot_num": 627, "sheet_no": 7, "first_letter": "C"}, {"id": 464, "orig_slot": "#629", "idiom": "Cut the chase", "meaning": "Get to the point.", "thai_idiom": "เข้าประเด็นเลย / ไม่อ้อมค้อม", "thai_meaning": "ข้ามเรื่องเยิ่นเย้อไร้สาระแล้วเข้าสู่ประเด็นสำคัญหรือเนื้อหาหลักโดยตรงทันที", "ex1_en": "Let's <span class=\"hl-teal\">cut the chase</span> and tell me why you really called me so late at night.", "ex1_hl": "cut the chase", "ex1_th": "เข้าประเด็นเลยดีกว่า ช่วยบอกฉันตรงๆ มาเถอะว่าทำไมเธอถึงโทรหาฉันดึกดื่นขนาดนี้กันแน่", "ex2_en": "The managing director interrupted the lengthy presentation, urging the vendor to <span class=\"hl-teal\">cut the chase</span> and provide the bottom-line pricing.", "ex2_hl": "cut the chase", "ex2_th": "กรรมการผู้จัดการได้กล่าวขัดการนำเสนอที่ยืดยาว พร้อมทั้งกระตุ้นให้ผู้ขายเข้าสู่ประเด็นสำคัญและแจ้งราคาสุทธิขั้นสุดท้ายมาได้เลย", "slot_num": 629, "sheet_no": 7, "first_letter": "C"}, {"id": 465, "orig_slot": "#630", "idiom": "Dead center", "meaning": "Exactly in the middle.", "thai_idiom": "ใจกลางเป๊ะ / กึ่งกลางพอดี", "thai_meaning": "ตรงจุดกึ่งกลางอย่างพอดิบพอดี, กึ่งกลางเป้าหมายอย่างแม่นยำ", "ex1_en": "Chloe aimed her dart carefully and hit the bullseye <span class=\"hl-teal\">dead center</span>, winning the grand prize stuffed bear.", "ex1_hl": "dead center", "ex1_th": "โคลอี้เล็งลูกดอกอย่างตั้งอกตั้งใจแล้วปาเข้าเป้าตรงใจกลางเป๊ะ จนคว้ารางวัลใหญ่ตุ๊กตาหมีตัวโตมาได้", "ex2_en": "The civil engineer pinpointed the new skyscraper's support columns <span class=\"hl-teal\">dead center</span> on the reinforced seismic foundation.", "ex2_hl": "dead center", "ex2_th": "วิศวกรโยธาได้วางตำแหน่งเสาค้ำยันของตึกระฟ้าแห่งใหม่ให้อยู่ตรงกึ่งกลางของฐานรากโครงสร้างต้านแผ่นดินไหวพอดีเป๊ะ", "slot_num": 630, "sheet_no": 7, "first_letter": "D"}, {"id": 466, "orig_slot": "#631", "idiom": "Devil in the details", "meaning": "Small parts that cause problems.", "thai_idiom": "มารร้ายซ่อนอยู่ในรายละเอียด / จุดเล็กๆ ที่สร้างปัญหาใหญ่", "thai_meaning": "รายละเอียดปลีกย่อยหรือข้อกำหนดเล็กๆ น้อยๆ ที่ดูเหมือนไม่สำคัญแต่กลับซ่อนปัญหาและความยุ่งยากไว้มากมาย", "ex1_en": "The home renovation plan looked simple on paper, but the <span class=\"hl-teal\">devil in the details</span> showed up when plumbing lines didn't align.", "ex1_hl": "devil in the details", "ex1_th": "แบบแปลนการรีโนเวทบ้านดูเหมือนง่ายบนหน้ากระดาษ แต่ปัญหาที่ซ่อนอยู่ในรายละเอียดก็โผล่มาเมื่อแนวท่อประปาไม่ตรงกัน", "ex2_en": "While both pharmaceutical giants agreed on the merger valuation, the <span class=\"hl-teal\">devil in the details</span> emerged during patent ownership negotiations.", "ex2_hl": "devil in the details", "ex2_th": "แม้ว่าบริษัทยายักษ์ใหญ่ทั้งสองจะตกลงเรื่องมูลค่าการควบรวมกิจการกันได้ แต่ปัญหาที่ซ่อนอยู่ในรายละเอียดก็ปรากฏขึ้นระหว่างการเจรจาเรื่องสิทธิ์ความเป็นเจ้าของสิทธิบัตร", "slot_num": 631, "sheet_no": 7, "first_letter": "D"}, {"id": 467, "orig_slot": "#632", "idiom": "Different strokes for different folks", "meaning": "People have different tastes.", "thai_idiom": "ลางเนื้อชอบลางยา / ความชอบของใครของมัน", "thai_meaning": "คนแต่ละคนมีความชอบ รสนิยม หรือวิธีการดำเนินชีวิตที่แตกต่างกัน ซึ่งเป็นเรื่องธรรมดา", "ex1_en": "I prefer camping in a tent while my sister only stays in five-star resorts; well, <span class=\"hl-teal\">different strokes for different folks</span>.", "ex1_hl": "different strokes for different folks", "ex1_th": "ฉันชอบกางเต็นท์แคมปิ้งในขณะที่พี่สาวพักแต่ในรีสอร์ตห้าดาวเท่านั้น ก็อย่างว่าแหละนะ ลางเนื้อชอบลางยา ความชอบของใครของมัน", "ex2_en": "Some corporate executives thrive on aggressive agile sprints while others mandate methodical milestone reviews; it's really <span class=\"hl-teal\">different stro
