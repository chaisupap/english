ละมีความสุขไปทั้งวัน หลังจากส่งมอบระบบซอฟต์แวร์ได้สำเร็จ", "slot_num": 187, "sheet_no": 2, "first_letter": "M"}, {"id": 172, "orig_slot": "#188", "idiom": "Once bitten, twice shy", "meaning": "Hurt once, now cautious.", "thai_idiom": "เจ็บแล้วจำ / เข็ดหลาบ", "thai_meaning": "เมื่อเคยได้รับประสบการณ์ที่ไม่ดีหรือเจ็บปวดจากเรื่องใดเรื่องหนึ่งมาแล้ว ก็จะระมัดระวังตัวเป็นพิเศษในครั้งต่อไป", "ex1_en": "After losing money to an online concert ticket scam last summer, I'm <span class=\"hl-teal\">once bitten, twice shy</span> about buying from strangers.", "ex1_hl": "once bitten, twice shy", "ex1_th": "หลังจากเคยโดนโกงเงินค่าตั๋วคอนเสิร์ตออนไลน์เมื่อหน้าร้อนปีก่อน ตอนนี้ฉันเลยเจ็บแล้วจำและระแวงมากเวลาจะซื้อของจากคนแปลกหน้า", "ex2_en": "Having suffered heavy losses in unsecured peer-to-peer lending platforms, institutional creditors are <span class=\"hl-teal\">once bitten, twice shy</span> regarding uncollateralized fintech ventures.", "ex2_hl": "once bitten, twice shy", "ex2_th": "หลังประสบความสูญเสียอย่างหนักจากแพลตฟอร์มปล่อยกู้ระหว่างบุคคลโดยไม่มีหลักประกัน เจ้าหนี้สถาบันต่างก็เข็ดหลาบและระมัดระวังอย่างยิ่งต่อการลงทุนในสตาร์ตอัปฟินเทคที่ไร้หลักทรัพย์ค้ำประกัน", "slot_num": 188, "sheet_no": 2, "first_letter": "O"}, {"id": 173, "orig_slot": "#189", "idiom": "The whole nine yards", "meaning": "Everything.", "thai_idiom": "จัดเต็มทุกอย่าง / ครบวงจร / ทุกสิ่งทุกอย่างแบบไม่มีกั๊ก", "thai_meaning": "ทุกสิ่งทุกอย่าง ครบถ้วนกระบวนความ ทั้งหมดเท่าที่จะมีหรือทำได้", "ex1_en": "For our anniversary dinner, Michael prepared candlelit tables, handmade pasta, vintage wine, and <span class=\"hl-teal\">the whole nine yards</span>.", "ex1_hl": "the whole nine yards", "ex1_th": "สำหรับดินเนอร์ฉลองวันครบรอบ ไมเคิลจัดเต็มทุกอย่าง ทั้งจัดโต๊ะใต้แสงเทียน พาสต้าเส้นสด ไวน์ชั้นดี ครบเครื่องไม่มีขาดเลย", "ex2_en": "The premium corporate consulting package includes on-site auditing, staff training, strategic rebranding, and <span class=\"hl-teal\">the whole nine yards</span>.", "ex2_hl": "the whole nine yards", "ex2_th": "แพ็กเกจที่ปรึกษาองค์กรระดับพรีเมียมครอบคลุมทั้งการตรวจสอบถึงสถานที่ การจัดอบรมพนักงาน การปรับภาพลักษณ์แบรนด์เชิงกลยุทธ์ และการบริการอื่นๆ ครบวงจรทุกขั้นตอน", "slot_num": 189, "sheet_no": 2, "first_letter": "T"}, {"id": 174, "orig_slot": "#191", "idiom": "A rolling stone gathers no moss", "meaning": "People who move a lot rarely settle.", "thai_idiom": "คนจรไร้หลักแหล่ง / กลิ้งไปเรื่อยไร้พันธะ", "thai_meaning": "คนที่ชอบย้ายถิ่นฐานหรือเปลี่ยนงานบ่อยๆ มักจะไม่มีภาระผูกพัน แต่ในขณะเดียวกันก็ยากที่จะสร้างหลักปักฐานหรือสะสมความมั่งคั่งที่มั่นคง", "ex1_en": "He has lived in six countries over five years, claiming that <span class=\"hl-teal\">a rolling stone gathers no moss</span>, though he often misses having a permanent home.", "ex1_hl": "a rolling stone gathers no moss", "ex1_th": "เขาตระเวนอาศัยอยู่ในหกประเทศภายในเวลาห้าปี โดยอ้างว่าการเดินทางเรื่อยไปทำให้ชีวิตเป็นอิสระไร้พันธะ แม้ลึกๆ เขาจะคิดถึงการมีบ้านที่มั่นคงก็ตาม", "ex2_en": "Career advisors caution independent consultants that while <span class=\"hl-teal\">a rolling stone gathers no moss</span>, hopping between industries every year prevents establishing deep institutional credibility.", "ex2_hl": "a rolling stone gathers no moss", "ex2_th": "ที่ปรึกษาด้านอาชีพเตือนบรรดาที่ปรึกษาอิสระว่า แม้การเปลี่ยนสายงานบ่อยๆ จะทำให้ไม่ติดกับดักความซ้ำซาก แต่การย้ายวงการทุกปีก็ขัดขวางการสร้างความน่าเชื่อถือที่หยั่งรากลึกในสายวิชาชีพ", "slot_num": 191, "sheet_no": 2, "first_letter": "A"}, {"id": 175, "orig_slot": "#193", "idiom": "Don't sweat the small stuff", "meaning": "Don't worry about minor things.", "thai_idiom": "อย่ากังวลเรื่องเล็กน้อย / อย่าไปคิดมากกับเรื่องหยุมหยิม", "thai_meaning": "อย่าไปเครียดหรือเสียเวลาใส่ใจกับปัญหาเล็กๆ น้อยๆ ที่ไม่มีสาระสำคัญ", "ex1_en": "If the cake isn't decorated perfectly for the birthday party, <span class=\"hl-teal\">don't sweat the small stuff</span>; everyone will still enjoy eating it.", "ex1_hl": "don't sweat the small stuff", "ex1_th": "ถ้าหน้าเค้กวันเกิดแต่งออกมาไม่ได้เป๊ะร้อยเปอร์เซ็นต์ก็อย่าไปคิดมากกับเรื่องหยุมหยิมเลย ทุกคนก็ยังกินกันอย่างเอร็ดอร่อยอยู่ดี", "ex2_en": "The project manager urged software engineers to focus on resolving critical security vulnerabilities and <span class=\"hl-teal\">not sweat the small stuff</span> like minor cosmetic padding defects.", "ex2_hl": "not sweat the small stuff", "ex2_th": "ผู้จัดการโครงการกระตุ้นให้วิศวกรซอฟต์แวร์มุ่งเน้นการแก้ไขช่องโหว่ความปลอดภัยระดับวิกฤต และอย่าเพิ่งไปเสียเวลากับเรื่องหยุมหยิมอย่างระยะขอบหน้าจอที่คลาดเคลื่อนเล็กน้อย", "slot_num": 193, "sheet_no": 2, "first_letter": "D"}, {"id": 176, "orig_slot": "#194", "idiom": "Give credit where it's due", "meaning": "Acknowledge someone's work.", "thai_idiom": "ยกย่องคนที่ควรยกย่อง / ให้เครดิตคนที่ทำผลงาน", "thai_meaning": "ยอมรับ ยกย่อง หรือให้เกียรติแก่บุคคลที่เป็นผู้ลงมือทำหรือสมควรได้รับคำชื่นชมอย่างแท้จริง", "ex1_en": "I usually disagree with my brother's tastes, but to <span class=\"hl-teal\">give credit where it's due</span>, he picked a fantastic restaurant for dinner tonight.", "ex1_hl": "give credit where it's due", "ex1_th": "ปกติฉันไม่ค่อยเห็นด้วยกับรสนิยมของพี่ชายเท่าไหร่ แต่ถ้าต้องให้เครดิตตามความจริง ร้านอาหารที่เขาเลือกสำหรับดินเนอร์คืนนี้ยอดเยี่ยมมากจริงๆ", "ex2_en": "The department chair emphasized the ethical obligation of researchers to <span class=\"hl-teal\">give credit where it's due</span> by citing co-authors and lab assistants accurately in the published study.", "ex2_hl": "give credit where it's due", "ex2_th": "หัวหน้าภาควิชาเน้นย้ำถึงจริยธรรมของนักวิจัยที่จะต้องให้เครดิตแก่ผู้สร้างสรรค์ผลงานอย่างถูกต้อง ด้วยการอ้างอิงชื่อผู้ร่วมเขียนและผู้ช่วยในห้องปฏิบัติการอย่างครบถ้วนในงานวิจัยที่ตีพิมพ์", "slot_num": 194, "sheet_no": 2, "first_letter": "G"}, {"id": 177, "orig_slot": "#195", "idiom": "Have no clue", "meaning": "Do not know.", "thai_idiom": "ไม่มีเบาะแสเลย / ไม่รู้เรื่องรู้ราวสักนิด / มืดแปดด้าน", "thai_meaning": "ไม่รู้อะไรเลยแม้แต่น้อย ไม่มีข้อมูลหรือความเข้าใจเกี่ยวกับเรื่องนั้นๆ เลย", "ex1_en": "I tried assembling the flat-pack bookshelf, but I <span class=\"hl-teal\">have no clue</span> which screw goes into the bottom shelf.", "ex1_hl": "have no clue", "ex1_th": "ฉันพยายามประกอบชั้นวางหนังสือสำเร็จรูป แต่ฉันไม่รู้เรื่องสักนิดเลยว่าต้องเอาน็อตตัวไหนใส่ที่แผ่นชั้นล่างสุด", "ex2_en": "When questioned by legislative investigators regarding unauthorized data harvesting, company representatives claimed they <span class=\"hl-teal\">had no clue</span> how external trackers bypassed security firewalls.", "ex2_hl": "had no clue", "ex2_th": "เมื่อถูกซักฟอกโดยคณะกรรมาธิการนิติบัญญัติเกี่ยวกับการดึงข้อมูลผู้ใช้โดยไม่ได้รับอนุญาต ตัวแทนบริษัทกลับอ้างว่าพวกเขาไม่รู้เรื่องรู้ราวสักนิดว่าตัวติดตามภายนอกเล็ดลอดผ่านไฟร์วอลล์ความปลอดภัยไปได้อย่างไร", "slot_num": 195, "sheet_no": 2, "first_letter": "H"}, {"id": 178, "orig_slot": "#196", "idiom": "In one ear and out the other", "meaning": "Not listening.", "thai_idiom": "เข้าหูซ้ายทะลุหูขวา / ฟังไม่ได้ศัพท์", "thai_meaning": "ฟังผ่านๆ โดยไม่ใส่ใจจำ ไม่ได้นำสิ่งที่ได้ยินไปคิดหรือปฏิบัติตาม", "ex1_en": "I told my son three times to clean up his room, but my instructions went <span class=\"hl-teal\">in one ear and out the other</span>.", "ex1_hl": "in one ear and out the other", "ex1_th": "ฉันบอกลูกชายตั้งสามรอบแล้วว่าให้เก็บห้องให้เรียบร้อย แต่คำสั่งของฉันคงเข้าหูซ้ายทะลุหูขวาตามเคย", "ex2_en": "Compliance officers were frustrated that critical safety protocols delivered during orientation seemed to go <span class=\"hl-teal\">in one ear and out the other</span> among factory supervisors.", "ex2_hl": "in one ear and out the other", "ex2_th": "เจ้าหน้าที่กำกับดูแลมาตรฐานต่างรู้สึกเอือมระอาที่ระเบียบการด้านความปลอดภัยสำคัญซึ่งอบรมไปตอนปฐมนิเทศ ดูเหมือนจะเข้าหูซ้ายทะลุหูขวาสำหรับบรรดาหัวหน้างานในโรงงาน", "slot_num": 196, "sheet_no": 2, "first_letter": "I"}, {"id": 179, "orig_slot": "#197", "idiom": "Let your hair down", "meaning": "Relax and enjoy yourself.", "thai_idiom": "ปลดปล่อยอารมณ์ / ทำตัวตามสบาย / ผ่อนคลายให้เต็มที่", "thai_meaning": "ผ่อนคลาย ปลดเปลื้องความตึงเครียด และสนุกสนานอย่างเป็นตัวของตัวเองโดยไม่ต้องเก๊กหรือกังวลเรื่องมารยาทเคร่งครัด", "ex1_en": "After studying non-stop for midterm exams all week, Friday night was our chance to finally <span class=\"hl-teal\">let our hair down</span> and sing karaoke.", "ex1_hl": "let our hair down", "ex1_th": "หลังจากอ่านหนังสือสอบมิดเทอมมาทั้งสัปดาห์ คืนวันศุกร์ก็เป็นโอกาสที่พวกเราจะได้ปลดปล่อยความเครียดและร้องคาราโอเกะกันให้เต็มคราบ", "ex2_en": "The annual corporate retreat gave executive team members a rare opportunity to <span class=\"hl-teal\">let their hair down</span> and bond outside the high-pressure boardroom.", "ex2_hl": "let their hair down", "ex2_th": "การไปสัมมนาพักผ่อนประจำปีของบริษัทเปิดโอกาสให้คณะผู้บริหารระดับสูงได้ผ่อนคลายทำตัวตามสบายและสร้างความสัมพันธ์ที่ดีต่อกันนอกห้องประชุมอันตึงเครียด", "slot_num": 197, "sheet_no": 2, "first_letter": "L"}, {"id": 180, "orig_slot": "#198", "idiom": "Make yourself at home", "meaning": "Feel comfortable.", "thai_idiom": "ทำตัวตามสบายเหมือนอยู่บ้าน / ไม่ต้องเกรงใจ", "thai_meaning": "ทำตัวตามสบาย ปลดเปลื้องความเคอะเขิน เหมือนกับกำลังพักผ่อนอยู่ที่บ้านของตนเอง", "ex1_en": "Come in out of the rain, hang up your coat, and <span class=\"hl-teal\">make yourself at home</span> while I brew some tea.", "ex1_hl": "make yourself at home", "ex1_th": "เข้ามาหลบฝนข้างในก่อนสิ แขวนเสื้อโค้ตไว้แล้วทำตัวตามสบายเหมือนอยู่บ้านได้เลยนะ เดี๋ยวฉันไปชงชามาให้", "ex2_en": "The executive host greeted the international visiting delegation warmly, inviting them to unpack their laptops and <span class=\"hl-teal\">make themselves at home</span> in the executive lounge.", "ex2_hl": "make themselves at home", "ex2_th": "ผู้บริหารเจ้าภาพให้การต้อนรับคณะตัวแทนจากต่างประเทศอย่างอบอุ่น พร้อมเชื้อเชิญให้พวกเขาหยิบคอมพิวเตอร์ออกมาทำงานและทำตัวตามสบายได้ในห้องรับรองผู้บริหาร", "slot_num": 198, "sheet_no": 2, "first_letter": "M"}, {"id": 181, "orig_slot": "#200", "idiom": "You win some, you lose some", "meaning": "Success and failure both happen.", "thai_idiom": "มีได้ก็ต้องมีเสีย / เรื่องธรรมดาของการแข่งขัน", "thai_meaning": "มีทั้งความสำเร็จและความล้มเหลวปะปนกันไป ไม่มีใครชนะได้ทุกครั้ง", "ex1_en": "I didn't get tickets to the concert before they sold out, but <span class=\"hl-teal\">you win some, you lose some</span>.", "ex1_hl": "you win some, you lose some", "ex1_th": "ฉันกดบัตรคอนเสิร์ตไม่ทันก่อนที่มันจะขายหมดเกลี้ยง แต่นะ มันก็มีสมหวังบ้างผิดหวังบ้างเป็นธรรมดา", "ex2_en": "Although our firm didn't secure the municipal contract, the director reminded us that <span class=\"hl-teal\">you win some, you lose some</span> in competitive bidding.", "ex2_hl": "you win some, you lose some", "ex2_th": "แม้ว่าบริษัทของเราจะไม่ได้สัญญาประมูลงานเทศบาล แต่ผู้อำนวยการก็เตือนสติทุกคนว่าการประมูลแข่งขันย่อมมีได้มีเสียเป็นเรื่องปกติ", "slot_num": 200, "sheet_no": 2, "first_letter": "Y"}, {"id": 182, "orig_slot": "#201", "idiom": "Against the clock", "meaning": "In a race against time.", "thai_idiom": "แข่งกับเวลา / แข่งกับเข็มนาฬิกา", "thai_meaning": "ทำบางสิ่งอย่างเร่งรีบเพื่อแข่งกับเวลาหรือให้ทันกำหนดเวลาที่จำกัดมาก", "ex1_en": "With guests arriving in twenty minutes, Mum and I were working <span class=\"hl-teal\">against the clock</span> to finish frosting the birthday cake.", "ex1_hl": "against the clock", "ex1_th": "แขกกำลังจะมาถึงในอีกยี่สิบนาที แม่กับฉันเลยต้องรีบทำแข่งกับเวลาเพื่อแต่งหน้าเค้กวันเกิดให้เสร็จ", "ex2_en": "Rescue teams operated <span class=\"hl-teal\">against the clock</span> throughout the night to pull survivors from the collapsed tunnel.", "ex2_hl": "against the clock", "ex2_th": "ทีมกู้ภัยต้องทำงานแข่งกับเวลาตลอดทั้งคืนเพื่อดึงผู้รอดชีวิตออกมาจากอุโมงค์ที่ถล่มลงมา", "slot_num": 201, "sheet_no": 3, "first_letter": "A"}, {"id": 183, "orig_slot": "#202", "idiom": "A loose cannon", "meaning": "A dangerous, unpredictable person.", "thai_idiom": "ตัวอันตรายที่คาดเดาไม่ได้ / ลูกระเบิดเวลา", "thai_meaning": "บุคคลที่ควบคุมอารมณ์หรือพฤติกรรมไม่ได้ มักกระทำสิ่งคาดเดายากจนอาจสร้างความเสียหายแก่ผู้อื่น", "ex1_en": "Don't invite Marcus to the trivia night; after a couple of drinks, he becomes <span class=\"hl-teal\">a loose cannon</span> and picks arguments with everyone.", "ex1_hl": "a loose cannon", "ex1_th": "อย่าชวนมาร์คัสไปงานแข่งตอบคำถามเลย พอดื่มไปสักสองแก้วเขาก็กลายเป็นตัวเปิดศึกที่คาดเดาไม่ได้และชอบหาเรื่องทะเลาะกับทุกคน", "ex2_en": "The board considered the outspoken CFO to be <span class=\"hl-teal\">a loose cannon</span> whose unvetted social media posts risked triggering regulatory scrutiny.", "ex2_hl": "a loose cannon", "ex2_th": "คณะกรรมการมองว่าประธานฝ่ายการเงินที่พูดจาโผงผางคนนี้เป็นบุคคลอันตรายที่ไม่อาจควบคุมได้ ซึ่งโพสต์บนโซเชียลมีเดียที่ไม่ผ่านการตรวจสอบของเขาอาจสุ่มเสี่ยงต่อการถูกหน่วยงานกำกับดูแลเข้ามาตรวจสอบ", "slot_num": 202, "sheet_no": 3, "first_letter": "A"}, {"id": 184, "orig_slot": "#203", "idiom": "Barking mad", "meaning": "Extremely crazy.", "thai_idiom": "บ้าบอคอแตก / บ้าไปแล้วชัดๆ", "thai_meaning": "วิกลจริต สติฟั่นเฟือน หรือมีพฤติกรรมเพี้ยนสุดขีดอย่างไม่น่าเชื่อ", "ex1_en": "You'd have to be <span class=\"hl-teal\">barking mad</span> to go swimming in the lake when it's freezing outside.", "ex1_hl": "barking mad", "ex1_th": "เธอต้องเป็นบ้าไปแล้วแน่ๆ ถึงคิดจะลงไปว่ายน้ำในทะเลสาบตอนที่ข้างนอกอากาศหนาวจัดขนาดนี้", "ex2_en": "Industry analysts thought the founder was <span class=\"hl-teal\">barking mad</span> for pouring billions into quantum computing hardware ahead of commercial viability.", "ex2_hl": "barking mad", "ex2_th": "เหล่านักวิเคราะห์ในอุตสาหกรรมต่างมองว่าผู้ก่อตั้งรายนี้บ้าไปแล้วที่ทุ่มเงินหลายพันล้านดอลลาร์ลงไปในฮาร์ดแวร์ควอนตัมคอมพิวติงก่อนที่จะมีความเป็นไปได้ในเชิงพาณิชย์", "slot_num": 203, "sheet_no": 3, "first_letter": "B"}, {"id": 185, "orig_slot": "#207", "idiom": "Break new ground", "meaning": "Do something never done before.", "thai_idiom": "บุกเบิกสิ่งใหม่ / แผ้วถางทางใหม่", "thai_meaning": "สร้างสรรค์ คิดค้น หรือค้นพบสิ่งใหม่ที่ไม่เคยมีใครทำมาก่อน", "ex1_en": "Her experimental fusion cuisine really <span class=\"hl-teal\">broke new ground</span> by blending traditional Mexican mole with Japanese sushi.", "ex1_hl": "broke new ground", "ex1_th": "อาหารฟิวชันเชิงทดลองของเธอถือว่าได้บุกเบิกมิติใหม่จริงๆ ด้วยการผสมผสานซอสโมเลแบบดั้งเดิมของเม็กซิโกเข้ากับซูชิญี่ปุ่น", "ex2_en": "The clinical trial <span class=\"hl-teal\">broke new ground</span> in oncology by demonstrating that personalized mRNA vaccines could shrink treatment-resistant tumors.", "ex2_hl": "broke new ground", "ex2_th": "การทดลองทางคลินิกนี้ได้บุกเบิกพรมแดนใหม่ทางด้านเนื้องอกวิทยา โดยพิสูจน์ให้เห็นว่าวัคซีน mRNA เฉพาะบุคคลสามารถลดขนาดเนื้องอกที่ดื้อต่อการรักษาได้", "slot_num": 207, "sheet_no": 3, "first_letter": "B"}, {"id": 186, "orig_slot": "#208", "idiom": "By the skin of your teeth", "meaning": "Barely; with great difficulty.", "thai_idiom": "หวุดหวิด / รอดมาได้อย่างเฉียดฉิว / เส้นยาแดงผ่าแปด", "thai_meaning": "ผ่านพ้นหรือรอดพ้นมาได้อย่างเฉียดฉิวด้วยความยากลำบากอย่างยิ่ง", "ex1_en": "I overslept and caught the final commuter train <span class=\"hl-teal\">by the skin of my teeth</span> just as the doors were sliding shut.", "ex1_hl": "by the skin of my teeth", "ex1_th": "ฉันตื่นสายและวิ่งไปขึ้นรถไฟเที่ยวสุดท้ายได้แบบเฉียดฉิวเส้นยาแดงผ่าแปดขณะที่ประตูกำลังเลื่อนปิดพอดี", "ex2_en": "The contentious tax reform bill passed the Senate <span class=\"hl-teal\">by the skin of its teeth</span> with a single tie-breaking vote from the vice president.", "ex2_hl": "by the skin of its teeth", "ex2_th": "ร่างกฎหมายปฏิรูปภาษีที่มีข้อพิพาทรุนแรงนี้ผ่านความเห็นชอบจากวุฒิสภามาได้อย่างหวุดหวิด ด้วยคะแนนชี้ขาดเพียงเสียงเดียวจากรองประธานาธิบดี", "slot_num": 208, "sheet_no": 3, "first_letter": "B"}, {"id": 187, "orig_slot": "#209", "idiom": "Call the shots", "meaning": "Be in control; make decisions.", "thai_idiom": "คุมบังเหียน / เป็นคนตัดสินใจชี้ขาด / บงการ", "thai_meaning": "มีอำนาจสั่งการ ควบคุมสถานการณ์ หรือเป็นผู้ตัดสินใจหลักในเรื่องนั้นๆ", "ex1_en": "When it comes to planning our family road trips, my sister always <span class=\"hl-teal\">calls the shots</span> because she knows every scenic route.", "ex1_hl": "calls the shots", "ex1_th": "พอเป็นเรื่องการวางแผนขับรถเที่ยวของครอบครัว พี่สาวของฉันจะเป็นคนตัดสินใจทุกอย่างเสมอเพราะเธอรู้เส้นทางชมวิวทุกสาย", "ex2_en": "Even after the merger, the founding partner retained voting rights and continued to <span class=\"hl-teal\">call the shots</span> on all editorial acquisitions.", "ex2_hl": "call the shots", "ex2_th": "แม้จะควบรวมกิจการแล้ว หุ้นส่วนผู้ก่อตั้งก็ยังคงถือสิทธิ์ออกเสียงและทำหน้าที่คุมบังเหียนในการตัดสินใจคัดเลือกผลงานตีพิมพ์ทั้งหมดต่อไป", "slot_num": 209, "sheet_no": 3, "first_letter": "C"}, {"id": 188, "orig_slot": "#210", "idiom": "Caught red-handed", "meaning": "Caught while doing something wrong.", "thai_idiom": "จับได้คาหนังคาเขา / คาตา", "thai_meaning": "ถูกจับกุมหรือจับได้ในขณะที่กำลังกระทำความผิดหรือสิ่งที่ไม่ถูกต้องอยู่ตำตา", "ex1_en": "My little brother was <span class=\"hl-teal\">caught red-handed</span> with chocolate frosting smeared across his cheeks beside the open fridge.", "ex1_hl": "caught red-handed", "ex1_th": "น้องชายของฉันถูกจับได้คาหนังคาเขาพร้อมคราบครีมช็อกโกแลตเปรอะเต็มสองแก้มข้างตู้เย็นที่เปิดอ้าอยู่", "ex2_en": "A rogue IT contractor was <span class=\"hl-teal\">caught red-handed</span> downloading proprietary trading algorithms onto an unencrypted flash drive.", "ex2_hl": "caught red-handed", "ex2_th": "ผู้รับเหมาไอทีนอกแถวถูกจับได้คาหนังคาเขาขณะกำลังดาวน์โหลดอัลกอริทึมการเทรดที่เป็นกรรมสิทธิ์ของบริษัทลงในแฟลชไดรฟ์ที่ไม่มีการเข้ารหัส", "slot_num": 210, "sheet_no": 3, "first_letter": "C"}, {"id": 189, "orig_slot": "#211", "idiom": "Change of heart", "meaning": "A change in opinion.", "thai_idiom": "เปลี่ยนใจ / เปลี่ยนท่าที", "thai_meaning": "การเปลี่ยนความคิด ทัศนคติ หรือความรู้สึกที่มีต่อเรื่องใดเรื่องหนึ่ง", "ex1_en": "Liam initially refused to adopt a pet, but he had a complete <span class=\"hl-teal\">change of heart</span> after spending an afternoon with the rescue puppy.", "ex1_hl": "change of heart", "ex1_th": "ตอนแรกลิแอมปฏิเสธที่จะรับเลี้ยงสัตว์ แต่เขากลับเปลี่ยนใจโดยสิ้นเชิงหลังจากได้ใช้เวลาช่วงบ่ายกับลูกหมาที่ถูกช่วยชีวิตมา", "ex2_en": "The municipal council underwent a sudden <span class=\"hl-teal\">change of heart</span> regarding zoning restrictions after listening to impassioned pleas from local green activists.", "ex2_hl": "change of heart", "ex2_th": "สภาเทศบาลเกิดการเปลี่ยนท่าทีอย่างกะทันหันเกี่ยวกับข้อกำหนดการแบ่งเขตผังเมือง หลังจากรับฟังคำร้องขออย่างจริงจังจากกลุ่มนักเคลื่อนไหวด้านสิ่งแวดล้อมในพื้นที่", "slot_num": 211, "sheet_no": 3, "first_letter": "C"}, {"id": 190, "orig_slot": "#212", "idiom": "Cross that bridge when you come to it", "meaning": "Deal with problems when they happen.", "thai_idiom": "ถึงสะพานค่อยข้าม / อย่าตีตนไปก่อนไข้ / เรื่องยังไม่เกิดอย่าเพิ่งกังวล", "thai_meaning": "รอให้ปัญหาเกิดขึ้นจริงเสียก่อนแล้วค่อยหาทางจัดการ ไม่ควรวิตกกังวลล่วงหน้าเกินไป", "ex1_en": "Don't stress about how we'll move the heavy wardrobe upstairs; let's unpack the kitchen boxes first and <span class=\"hl-teal\">cross that bridge when we come to it</span>.", "ex1_hl": "cross that bridge when we come to it", "ex1_th": "อย่าเพิ่งไปเครียดเลยว่าจะขนตู้เสื้อผ้าหนักๆ ขึ้นบันไดยังไง มาแกะกล่องของในครัวก่อนแล้วถึงตอนนั้นค่อยว่ากัน", "ex2_en": "When asked about potential regulatory hurdles abroad, the CEO advised the expansion team to <span class=\"hl-teal\">cross that bridge when they came to it</span> rather than stall domestic product rollout.", "ex2_hl": "cross that bridge when they came to it", "ex2_th": "เมื่อถูกถามเกี่ยวกับอุปสรรคทางกฎระเบียบที่อาจเกิดขึ้นในต่างประเทศ ซีอีโอได้แนะนำทีมขยายตลาดว่าให้ถึงคราวนั้นค่อยหาทางแก้ ดีกว่าจะมาทำให้การเปิดตัวผลิตภัณฑ์ในประเทศต้องสะดุดล่าช้า", "slot_num": 212, "sheet_no": 3, "first_letter": "C"}, {"id": 191, "orig_slot": "#213", "idiom": "Curiosity killed the cat", "meaning": "Being too curious can get you in trouble.", "thai_idiom": "ความอยากรู้อยากเห็นเป็นภัย / สอดรู้สอดเห็นจะพาซวย", "thai_meaning": "การสอดรู้สอดเห็นหรืออยากรู้อยากเห็นเรื่องของคนอื่นมากเกินไปอาจนำภัยหรือความเดือดร้อนมาสู่ตนเอง", "ex1_en": "I warned Sophie not to snoop through her roommate's locked drawer, reminding her that <span class=\"hl-teal\">curiosity killed the cat</span>.", "ex1_hl": "curiosity killed the cat", "ex1_th": "ฉันเตือนโซฟีแล้วว่าอย่าไปแอบรื้อลิ้นชักที่ล็อกไว้ของรูมเมต เพราะความอยากรู้อยากเห็นมากเกินไปอาจนำภัยมาให้", "ex2_en": "The investigative journalist ignored the anonymous warning that <span class=\"hl-teal\">curiosity killed the cat</span> and pursued the corrupt procurement records anyway.", "ex2_hl": "curiosity killed the cat", "ex2_th": "นักข่าวเชิงสืบสวนเมินเฉยต่อคำเตือนนิรนามที่ขู่ว่าความอยากรู้อยากเห็นจะพาภัยมาถึงตัว และเดินหน้าสืบค้นบันทึกการจัดซื้อจัดจ้างที่ทุจริตต่อไป", "slot_num": 213, "sheet_no": 3, "first_letter": "C"}, {"id": 192, "orig_slot": "#214", "idiom": "Don't cry over spilt milk", "meaning": "Don't worry about what cannot be changed.", "thai_idiom": "อย่ามัวร้องไห้เสียน้ำตากับน้ำนมที่หกไปแล้ว / อะไรที่ผ่านไปแล้วก็ปล่อยมันไป", "thai_meaning": "อย่าไปเสียเวลาเสียใจหรือกังวลกับความผิดพลาดในอดีตที่แก้ไขไม่ได้แล้ว", "ex1_en": "Yes, you dropped the ceramic mug and shattered it, but <span class=\"hl-teal\">don't cry over spilt milk</span>; we can sweep it up and buy another one.", "ex1_hl": "don't cry over spilt milk", "ex1_th": "ใช่ เธอทำแก้วเซรามิกหล่นแตก แต่ก็อย่าไปมัวเสียดายกับสิ่งที่ผ่านไปแล้วเลย พวกเรากวาดทิ้งแล้วค่อยไปซื้อใหม่ได้", "ex2_en": "Having lost a key client due to a missed deadline, the project lead urged the department <span class=\"hl-teal\">not to cry over spilt milk</span> but to focus on retaining existing accounts.", "ex2_hl": "not to cry over spilt milk", "ex2_th": "หลังจากสูญเสียลูกค้ารายสำคัญไปเพราะส่งงานไม่ทันกำหนด หัวหน้าโครงการได้กระตุ้นเตือนให้แผนกอย่ามัวเสียดายกับสิ่งที่แก้ไขไม่ได้ แต่ให้มุ่งเน้นไปที่การรักษาฐานลูกค้าที่มีอยู่เดิมแทน", "slot_num": 214, "sheet_no": 3, "first_letter": "D"}, {"id": 193, "orig_slot": "#215", "idiom": "Down to earth", "meaning": "Practical and realistic.", "thai_idiom": "ติดดิน / ไม่ถือตัว / อยู่กับความเป็นจริง", "thai_meaning": "มีเหตุผล ใช้ชีวิตเรียบง่าย ติดดิน ไม่หยิ่งยโส และมองสิ่งต่างๆ ตามความเป็นจริง", "ex1_en": "Despite his newfound fame on YouTube, Julian remains remarkably <span class=\"hl-teal\">down to earth</span> and still hangs out at the neighborhood diner.", "ex1_hl": "down to earth", "ex1_th": "แม้จะเริ่มมีชื่อเสียงโด่งดังบนยูทูบ แต่จูเลียนก็ยังคงเป็นคนติดดินอย่างน่าทึ่งและยังคงไปนั่งเล่นที่ร้านอาหารแถวบ้านเหมือนเดิม", "ex2_en": "Investors appreciated the keynote speaker's <span class=\"hl-teal\">down to earth</span> approach, which prioritized sustainable cash flow over flashy valuation metrics.", "ex2_hl": "down to earth", "ex2_th": "บรรดานักลงทุนชื่นชมแนวคิดที่อยู่บนพื้นฐานความเป็นจริงของวิทยากรหลัก ซึ่งให้ความสำคัญกับกระแสเงินสดที่ยั่งยืนมากกว่าตัวเลขมูลค่าบริษัทที่ดูหวือหวา", "slot_num": 215, "sheet_no": 3, "first_letter": "D"}, {"id": 194, "orig_slot": "#216", "idiom": "Easier said than done", "meaning": "More difficult to do than to say.", "thai_idiom": "พูดง่ายแต่ทำยาก", "thai_meaning": "สิ่งที่พูดหรือแนะนำดูเหมือนง่าย แต่ในทางปฏิบัตินั้นทำได้ยากยิ่ง", "ex1_en": "Telling someone to calm down during a panic attack is <span class=\"hl-teal\">easier said than done</span>.", "ex1_hl": "easier said than done", "ex1_th": "การบอกให้ใครสักคนใจเย็นๆ ตอนที่เขากำลังแพนิกน่ะมันพูดง่ายแต่ทำยาก", "ex2_en": "Eliminating cross-border trade friction sounds sensible on paper, yet seasoned diplomats know it is <span class=\"hl-teal\">easier said than done</span>.", "ex2_hl": "easier said than done", "ex2_th": "การขจัดข้อขัดแย้งทางการค้าระหว่างประเทศฟังดูสมเหตุสมผลในรายงาน แต่นักการทูตผู้มีประสบการณ์ต่างรู้ดีว่ามันพูดง่ายกว่าลงมือทำจริงมาก", "slot_num": 216, "sheet_no": 3, "first_letter": "E"}, {"id": 195, "orig_slot": "#219", "idiom": "Far from the madding crowd", "meaning": "In a quiet, peaceful place.", "thai_idiom": "ห่างไกลความวุ่นวาย / ปลีกวิเวกสู่ความสงบ", "thai_meaning": "อยู่ในสถานที่สงบเงียบ ห่างไกลจากความสับสนวุ่นวายและผู้คนพลุกพล่านของเมืองใหญ่", "ex1_en": "We rented a rustic timber cabin high in the hills, completely <span class=\"hl-teal\">far from the madding crowd</span> of the coastal resorts.", "ex1_hl": "far from the madding crowd", "ex1_th": "พวกเราเช่ากระท่อมไม้เรียบง่ายบนเนินเขาสูง อยู่ห่างไกลจากความวุ่นวายและฝูงชนของรีสอร์ตริมชายหาดโดยสิ้นเชิง", "ex2_en": "Seeking mental rejuvenation, the novelist retreated to a secluded Scottish croft, living <span class=\"hl-teal\">far from the madding crowd</span> to write her magnum opus.", "ex2_hl": "far from the madding crowd", "ex2_th": "เพื่อฟื้นฟูสภาพจิตใจ นักเขียนนวนิยายจึงปลีกตัวไปยังฟาร์มอันเงียบสงบในสก็อตแลนด์ โดยใช้ชีวิตห่างไกลจากความวุ่นวายของสังคมเพื่อเขียนผลงานชิ้นเอกของเธอ", "slot_num": 219, "sheet_no": 3, "first_letter": "F"}, {"id": 196, "orig_slot": "#220", "idiom": "Get a head start", "meaning": "Start early to get an advantage.", "thai_idiom": "ออกตัวก่อน / ชิงเริ่มก่อนเพื่อความได้เปรียบ", "thai_meaning": "เริ่มต้นทำบางสิ่งแต่เนิ่นๆ เพื่อให้ได้เปรียบหรือนำหน้าผู้อื่น", "ex1_en": "We loaded the camping gear into the truck the night before so we could hit the highway at dawn and <span class=\"hl-teal\">get a head start</span> on the holiday traffic.", "ex1_hl": "get a head start", "ex1_th": "พวกเราขนอุปกรณ์ตั้งแคมป์ขึ้นรถกระบะไว้ตั้งแต่เมื่อคืน เพื่อจะได้ออกเดินทางตั้งแต่รุ่งสางและชิงออกตัวก่อนการจราจรช่วงวันหยุดจะติดขัด", "ex2_en": "By patenting their synthetic biodegradable polymer early, the biotech startup <span class=\"hl-teal\">got a head start</span> on industry competitors.", "ex2_hl": "got a head start", "ex2_th": "ด้วยการจดสิทธิบัตรโพลิเมอร์สังเคราะห์ที่ย่อยสลายได้ทางชีวภาพตั้งแต่เนิ่นๆ บริษัทสตาร์ทอัปด้านเทคโนโลยีชีวภาพจึงชิงความได้เปรียบนำหน้าคู่แข่งในอุตสาหกรรม", "slot_num": 220, "sheet_no": 3, "first_letter": "G"}, {"id": 197, "orig_slot": "#221", "idiom": "Get the ball rolling", "meaning": "Start a process.", "thai_idiom": "เริ่มเดินหน้า / เริ่มจุดประกาย / เปิดฉากดำเนินการ", "thai_meaning": "เริ่มต้นลงมือทำกิจกรรม โครงการ หรือกระบวนการบางอย่างเพื่อให้ขับเคลื่อนต่อไปได้", "ex1_en": "To <span class=\"hl-teal\">get the ball rolling</span> on our garage cleanup, I sorted the scrap metal while Dad hauled out old boxes.", "ex1_hl": "get the ball rolling", "ex1_th": "เพื่อเริ่มเดินหน้าจัดระเบียบโรงรถ ฉันเริ่มจากการแยกเศษเหล็กในขณะที่พ่อขนกล่องเก่าๆ ออกไป", "ex2_en": "The regional director made a sizable initial grant to <span class=\"hl-teal\">get the ball rolling</span> on the rural solar electrification initiative.", "ex2_hl": "get the ball rolling", "ex2_th": "ผู้อำนวยการระดับภูมิภาคได้อนุมัติเงินทุนก้อนแรกจำนวนมากเพื่อเปิดฉากขับเคลื่อนโครงการติดตั้งระบบไฟฟ้าพลังงานแสงอาทิตย์ในชนบท", "slot_num": 221, "sheet_no": 3, "first_letter": "G"}, {"id": 198, "orig_slot": "#222", "idiom": "Go against the grain", "meaning": "Do the opposite of what is usual.", "thai_idiom": "ทวนกระแส / ฝืนธรรมชาติ / ขัดกับความรู้สึกหรือธรรมเนียมเดิม", "thai_meaning": "ทำสิ่งที่ตรงกันข้ามกับความเคยชิน ธรรมเนียมปฏิบัติ หรือความรู้สึกตามธรรมชาติของตนเอง", "ex1_en": "Throwing away leftover food really <span class=\"hl-teal\">goes against the grain</span> for Grandma, who grew up during times of strict rationing.", "ex1_hl": "goes against the grain", "ex1_th": "การทิ้งอาหารที่เหลือนั้นขัดกับความรู้สึกของยายอย่างยิ่ง เพราะท่านเติบโตมาในยุคที่มีการปันส่วนอาหารอย่างเข้มงวด", "ex2_en": "Hiring an outside candidate rather than promoting from within <span class=\"hl-teal\">went against the grain</span> of the bank's century-old corporate culture.", "ex2_hl": "went against the grain", "ex2_th": "การจ้างบุคคลภายนอกเข้ามารับตำแหน่งแทนที่จะเลื่อนขั้นคนภายในนั้นถือว่าเป็นการทวนกระแสวัฒนธรรมองค์กรของธนาคารที่มีมานานนับศตวรรษ", "slot_num": 222, "sheet_no": 3, "first_letter": "G"}, {"id": 199, "orig_slot": "#223", "idiom": "Go back to the drawing board", "meaning": "Start again with a new plan.", "thai_idiom": "กลับไปตั้งหลักใหม่ / รื้อแผนทำใหม่ / เริ่มต้นนับหนึ่งใหม่", "thai_meaning": "กลับไปวางแผนหรือเริ่มต้นคิดทบทวนใหม่ตั้งแต่แรกหลังจากแผนเดิมล้มเหลวหรือไม่บรรลุผล", "ex1_en": "When the souffle completely collapsed in the oven, Claire sighed and realized she had to <span class=\"hl-teal\">go back to the drawing board</span> with her baking technique.", "ex1_hl": "go back to the drawing board", "ex1_th": "พอขนมซูเฟล่ยุบตัวลงจนแบนในเตาอบ แคลร์ก็ถอนหายใจและตระหนักว่าเธอคงต้องกลับไปตั้งหลักปรับเทคนิคการอบขนมใหม่ตั้งแต่ต้น", "ex2_en": "After clinical trials showed no significant efficacy, pharmaceutical researchers had to <span class=\"hl-teal\">go back to the drawing board</span> to redesign the molecule.", "ex2_hl": "go back to the drawing board", "ex2_th": "หลังจากผลการทดลองทางคลินิกพบว่าไม่มีประสิทธิผลอย่างมีนัยสำคัญ นักวิจัยด้านเภสัชกรรมจึงต้องกลับไปรื้อแผนคิดค้นสูตรโมเลกุลใหม่ตั้งแต่เริ่มต้น", "slot_num": 223, "sheet_no": 3, "first_letter": "G"}, {"id": 200, "orig_slot": "#224", "idiom": "Go out on a limb", "meaning": "Take a risk.", "thai_idiom": "เอาคอขึ้นเขียง / เสี่ยงเอาตัวเข้าแลก / เสี่ยงทำหรือพูดอะไรที่อาจเดือดร้อน", "thai_meaning": "กล้าเสี่ยงแสดงความคิดเห็นหรือกระทำบางสิ่งโดยที่ตนเองอาจตกอยู่ในสถานะที่สุ่มเสี่ยงหรือเสียเปรียบ", "ex1_en": "I'll <span class=\"hl-teal\">go out on a limb</span> and guess that the surprise guest tonight is Uncle David, even though nobody mentioned him coming.", "ex1_hl": "go out on a limb", "ex1_th": "ฉันขอเดาแบบเสี่ยงๆ เลยว่าแขกเซอร์ไพรส์คืนนี้คือลุงเดวิด แม้จะไม่มีใครพูดถึงว่าแกจะมาเลยก็ตาม", "ex2_en": "The senior partner really <span class=\"hl-teal\">went out on a limb</span> by recommending an unproven junior associate to argue the high-stakes appeal.", "ex2_hl": "went out on a limb", "ex2_th": "หุ้นส่วนอาวุโสยอมเสี่ยงเอาชื่อเสียงเข้าแลกด้วยการเสนอชื่อทนายความรุ่นน้องที่ยังไม่มีผลงานประจักษ์ให้ขึ้นว่าความในคดีอุทธรณ์ที่มีเดิมพันสูงครั้งนี้", "slot_num": 224, "sheet_no": 3, "first_letter": "G"}, {"id": 201, "orig_slot": "#225", "idiom": "Hold your tongue", "meaning": "Keep silent.", "thai_idiom": "สงบปากสงบคำ / กัดฟันเงียบไว้", "thai_meaning": "หักห้ามใจไม่ให้พูดอะไรออกมา แม้ว่าจะอยากพูดหรือมีความคิดเห็นก็ตาม", "ex1_en": "Even though I was furious at his rude comment, I decided to <span class=\"hl-teal\">hold my tongue</span> to keep peace at the dinner table.", "ex1_hl": "hold my tongue", "ex1_th": "แม้ว่าฉันจะโกรธกับคำพูดหยาบคายของเขามาก แต่ฉันก็เลือกที่จะสงบปากสงบคำไว้เพื่อรักษาบรรยากาศบนโต๊ะอาหาร", "ex2_en": "The diplomat was trained to <span class=\"hl-teal\">hold his tongue</span> during provocative interrogations by foreign state media.", "ex2_hl": "hold his tongue", "ex2_th": "นักการทูตได้รับการฝึกฝนมาให้รู้จักสงบปากสงบคำและนิ่งเฉยในระหว่างการซักไซ้เชิงยั่วยุจากสื่อของรัฐต่างชาติ", "slot_num": 225, "sheet_no": 3, "first_letter": "H"}, {"id": 202, "orig_slot": "#227", "idiom": "In deep water", "meaning": "In serious trouble.", "thai_idiom": "ตกที่นั่งลำบาก / งานเข้าขั้นวิกฤต / ตกอยู่ในสถานการณ์คับขัน", "thai_meaning": "ตกอยู่ในปัญหาหรือสถานการณ์ที่ยุ่งยากร้ายแรงและยากที่จะแก้ไข", "ex1_en": "After losing his roommate's vintage vinyl collection during the move, Leo found himself <span class=\"hl-teal\">in deep water</span>.", "ex1_hl": "in deep water", "ex1_th": "หลังจากทำแผ่นเสียงโบราณของรูมเมตหายระหว่างการย้ายบ้าน ลีโอก็พบว่าตัวเองตกที่นั่งลำบากอย่างหนักเสียแล้ว", "ex2_en": "The fintech firm is <span class=\"hl-teal\">in deep water</span> with the securities watchdog over suspicious cross-border wire transfers.", "ex2_hl": "in deep water", "ex2_th": "บริษัทฟินเทคแห่งนี้กำลังตกที่นั่งลำบากอย่างร้ายแรงกับหน่วยงานกำกับดูแลตลาดหลักทรัพย์ จากกรณีการโอนเงินข้ามประเทศที่น่าสงสัย", "slot_num": 227, "sheet_no": 3, "first_letter": "I"}, {"id": 203, "orig_slot": "#228", "idiom": "It takes two to tango", "meaning": "Both people are responsible.", "thai_idiom": "ตบมือข้างเดียวไม่ดัง", "thai_meaning": "ความขัดแย้ง ความสัมพันธ์ หรือปัญหานั้นเกิดจากทั้งสองฝ่ายร่วมกัน มีความรับผิดชอบร่วมกันทั้งคู่", "ex1_en": "You can't blame your sister entirely for the messy argument; <span class=\"hl-teal\">it takes two to tango</span>, and you were provoking her too.", "ex1_hl": "it takes two to tango", "ex1_th": "เธอจะไปโทษพี่สาวคนเดียวเรื่องที่ทะเลาะกันรุนแรงไม่ได้หรอกนะ ตบมือข้างเดียวมันไม่ดัง และเธอก็ยั่วโมโหเขาก่อนเหมือนกัน", "ex2_en": "In arbitrating the commercial breach of contract, the judge noted that <span class=\"hl-teal\">it takes two to tango</span>, holding both suppliers liable for communication breakdowns.", "ex2_hl": "it takes two to tango", "ex2_th": "ในการอนุญาโตตุลาการกรณีผิดสัญญาทางการค้า ผู้พิพากษาชี้ว่าตบมือข้างเดียวไม่ดัง และตัดสินให้ซัพพลายเออร์ทั้งสองฝ่ายร่วมกันรับผิดชอบต่อความล้มเหลวด้านการสื่อสาร", "slot_num": 228, "sheet_no": 3, "first_letter": "I"}, {"id": 204, "orig_slot": "#229", "idiom": "Jump on the bandwagon", "meaning": "Join others in a popular trend.", "thai_idiom": "แห่ตามกระแส / โหนกระแส / เกาะกระแส", "thai_meaning": "เข้าร่วมทำตามผู้อื่นหรือตามกระแสนิยมเพราะเห็นว่ากำลังเป็นที่นิยมหรือประสบความสำเร็จ", "ex1_en": "After seeing her friends post sourdough photos online, Maya decided to <span class=\"hl-teal\">jump on the bandwagon</span> and bought an artisanal baking kit.", "ex1_hl": "jump on the bandwagon", "ex1_th": "หลังจากเห็นเพื่อนๆ โพสต์รูปขนมปังซาวโดว์กันเต็มฟีด มายาก็ตัดสินใจแห่ตามกระแสและซื้อชุดอุปกรณ์อบขนมปังทำมือมาลองบ้าง", "ex2_en": "Several legacy automakers were criticized for <span class=\"hl-teal\">jumping on the bandwagon</span> with rushed electric vehicle announcements that lacked charging infrastructure.", "ex2_hl": "jumping on the bandwagon", "ex2_th": "ผู้ผลิตรถยนต์ดั้งเดิมหลายรายถูกวิพากษ์วิจารณ์ว่ารีบโหนกระแสด้วยการเร่งประกาศเปิดตัวรถยนต์ไฟฟ้า ทั้งที่ยังขาดโครงสร้างพื้นฐานด้านสถานีชาร์จรองรับ", "slot_num": 229, "sheet_no": 3, "first_letter": "J"}, {"id": 205, "orig_slot": "#230", "idiom": "Keep your nose to the grindstone", "meaning": "Work hard.", "thai_idiom": "ก้มหน้าก้มตาทำงานหนัก / มุมานะทำงานอย่างไม่ย่อท้อ", "thai_meaning": "ตั้งหน้าตั้งตาทำงานหรืออ่านหนังสืออย่างหนักและต่อเนื่องเป็นเวลานานโดยไม่วอกแวก", "ex1_en": "If you <span class=\"hl-teal\">keep your nose to the grindstone</span> over the weekend, you will easily finish your history term paper ahead of Sunday evening.", "ex1_hl": "keep your nose to the grindstone", "ex1_th": "ถ้าเธอก้มหน้าก้มตาตั้งใจทำให้เสร็จช่วงสุดสัปดาห์นี้ เธอก็จะส่งรายงานวิชาประวัติศาสตร์ได้สบายๆ ก่อนเย็นวันอาทิตย์แน่นอน", "ex2_en": "Junior analysts at the investment bank are expected to <span class=\"hl-teal\">keep their noses to the grindstone</span> through eighty-hour workweeks during earnings season.", "ex2_hl": "keep their noses to the grindstone", "ex2_th": "นักวิเคราะห์รุ่นเยาว์ที่วาณิชธนกิจแห่งนี้ถูกคาดหวังให้ก้มหน้าก้มตาทำงานหนักสัปดาห์ละแปดสิบชั่วโมงในช่วงฤดูประกาศผลประกอบการ", "slot_num": 230, "sheet_no": 3, "first_letter": "K"}, {"id": 206, "orig_slot": "#233", "idiom": "Like father, like son", "meaning": "Children are similar to parents.", "thai_idiom": "ลูกไม้หล่นไม่ไกลต้น / สำเนาถูกต้อง", "thai_meaning": "ลูกชายมักมีนิสัย ท่าทาง หรือความชอบเหมือนกับผู้เป็นพ่อ", "ex1_en": "Both Greg and his boy can spend entire Saturdays tuning vintage carburetors in the driveway—truly <span class=\"hl-teal\">like father, like son</span>.", "ex1_hl": "like father, like son", "ex1_th": "ทั้งเกร็กและลูกชายสามารถใช้เวลาทั้งวันเสาร์จูนคาร์บูเรเตอร์รถโบราณอยู่ที่ลานหน้าบ้านได้ ช่างเป็นลูกไม้หล่นไม่ไกลต้นจริงๆ", "ex2_en": "When Julian took over the family publishing house with the same unyielding negotiation style as his predecessor, reporters dubbed it <span class=\"hl-teal\">like father, like son</span>.", "ex2_hl": "like father, like son", "ex2_th": "เมื่อจูเลียนเข้ารับช่วงต่อกิจการสำนักพิมพ์ของครอบครัวด้วยลีลาการเจรจาต่อรองที่เด็ดขาดแข็งกร้าวไม่ต่างจากผู้เป็นพ่อ บรรดานักข่าวต่างพาดหัวว่าเป็นลูกไม้หล่นไม่ไกลต้นอย่างแท้จริง", "slot_num": 233, "sheet_no": 3, "first_letter": "L"}, {"id": 207, "orig_slot": "#234", "idiom": "Make a bee-line for", "meaning": "Go directly to something.", "thai_idiom": "ตรงดิ่งไปที่ / พุ่งตรงไปยัง", "thai_meaning": "มุ่งหน้าตรงไปยังจุดหมายปลายทางอย่างรวดเร็วที่สุดโดยไม่แวะที่ใด", "ex1_en": "The moment the recess bell chimed, the kids <span class=\"hl-teal\">made a bee-line for</span> the playground swings.", "ex1_hl": "made a bee-line for", "ex1_th": "ทันทีที่เสียงกริ่งพักกลางวันดังขึ้น เหล่าเด็กๆ ก็พุ่งตรงดิ่งไปยังชิงช้าในสนามเด็กเล่นทันที", "ex2_en": "Disembarking delegates immediately <span class=\"hl-teal\">made a bee-line for</span> the press registration desk to secure briefing credentials.", "ex2_hl": "made a bee-line for", "ex2_th": "เหล่าคณะผู้แทนที่เพิ่งลงจากเครื่องบินต่างมุ่งตรงดิ่งไปยังโต๊ะลงทะเบียนสื่อมวลชนทันทีเพื่อขอรับบัตรเข้าร่วมการแถลงข่าว", "slot_num": 234, "sheet_no": 3, "first_letter": "M"}, {"id": 208, "orig_slot": "#235", "idiom": "Make both ends meet", "meaning": "Earn enough to cover expenses.", "thai_idiom": "ชักหน้าให้ถึงหลัง / หมุนเงินให้พอใช้ / หาเงินให้พอกับค่าใช้จ่าย", "thai_meaning": "หารายได้ให้เพียงพอกับค่าใช้จ่ายที่จำเป็นในแต่ละเดือนโดยไม่เป็นหนี้สิน", "ex1_en": "Working two part-time retail shifts barely allowed Hannah to pay rent and <span class=\"hl-teal\">make both ends meet</span>.", "ex1_hl": "make both ends meet", "ex1_th": "การทำงานพาร์ตไทม์สองกะในร้านค้าปลีกแทบจะไม่พอให้ฮันนาห์จ่ายค่าเช่าห้องและชักหน้าให้ถึงหลังในแต่ละเดือน", "ex2_en": "Rising urban inflation has left many low-income households struggling to <span class=\"hl-teal\">make both ends meet</span> despite recent wage adjustments.", "ex2_hl": "make both ends meet", "ex2_th": "อัตราเงินเฟ้อในเขตเมืองที่พุ่งสูงขึ้นทำให้ครัวเรือนที่มีรายได้น้อยจำนวนมากต้องดิ้นรนอย่างหนักเพื่อหาเงินให้พอประทังชีวิต แม้ว่าจะมีการปรับขึ้นค่าจ้างไปเมื่อเร็วๆ นี้ก็ตาม", "slot_num": 235, "sheet_no": 3, "first_letter": "M"}, {"id": 209, "orig_slot": "#236", "idiom": "Many hands make light work", "meaning": "Many people make work easier.", "thai_idiom": "หลายหัวดีกว่าหัวเดียว / ช่วยกันคนละไม้คนละมือ งานก็เบาลง", "thai_meaning": "การช่วยกันหลายๆ คนทำให้งานที่ยากหรือหนักเสร็จเร็วและง่ายขึ้น", "ex1_en": "Packing up fifty moving boxes seemed daunting, but with our neighbors pitching in, <span class=\"hl-teal\">many hands made light work</span>.", "ex1_hl": "many hands made light work", "ex1_th": "การแพ็กของลงกล่องย้ายบ้านตั้งห้าสิบกล่องดูเป็นงานช้างมาก แต่พอได้เพื่อนบ้านมาช่วยกันคนละไม้คนละมือ งานก็เสร็จง่ายขึ้นเยอะ", "ex2_en": "Coordinating humanitarian relief across the flood zone proved that <span class=\"hl-teal\">many hands make light work</span> when military units and civilian volunteers collaborate.", "ex2_hl": "many hands make light work", "ex2_th": "การประสานงานช่วยเหลือด้านมนุษยธรรมทั่วเขตอุทกภัยพิสูจน์ให้เห็นว่าหลายคนช่วยกันงานก็เบาลง เมื่อหน่วยทหารและอาสาสมัครพลเรือนร่วมมือกันอย่างเป็นระบบ", "slot_num": 236, "sheet_no": 3, "first_letter": "M"}, {"id": 210, "orig_slot": "#238", "idiom": "More than meets the eye", "meaning": "Something is more important than it seems.", "thai_idiom": "มีอะไรซ่อนอยู่มากกว่าที่เห็น / ไม่ได้เรียบง่ายอย่างที่คิด", "thai_meaning": "มีความซับซ้อน ลึกซึ้ง หรือมีความสำคัญแอบแฝงอยู่มากกว่าสิ่งที่เห็นภายนอก", "ex1_en": "Don't dismiss that rusty old pocket watch; there is <span class=\"hl-teal\">more than meets the eye</span>, as it has a rare hand-wound Swiss movement inside.", "ex1_hl": "more than meets the eye", "ex1_th": "อย่าเพิ่งมองข้ามนาฬิกาพกขึ้นสนิมเรือนเก่านั้นไปนะ มันมีอะไรดีซ่อนอยู่มากกว่าที่ตาเห็น เพราะข้างในเป็นกลไกไขลานหายากของสวิสเชียวนะ", "ex2_en": "The sudden resignation of the chief compliance officer suggests there is <span class=\"hl-teal\">more than meets the eye</span> regarding the firm's offshore accounting practices.", "ex2_hl": "more than meets the eye", "ex2_th": "การลาออกอย่างกะทันหันของประธานเจ้าหน้าที่ฝ่ายกำกับดูแลการปฏิบัติตามกฎเกณฑ์บ่งชี้ว่า อาจมีเงื่อนงำซ่อนอยู่มากกว่าที่เห็นเกี่ยวกับการทำบัญชีในต่างประเทศของบริษัท", "slot_num": 238, "sheet_no": 3, "first_letter": "M"}, {"id": 211, "orig_slot": "#239", "idiom": "Never look a gift horse in the mouth", "meaning": "Don't criticize a gift.", "thai_idiom": "ได้ของให้เปล่าอย่าไปติ / อย่าช่างเลือกเมื่อได้ของฟรี", "thai_meaning": "เมื่อได้รับของขวัญหรือความช่วยเหลือจากผู้อื่น ไม่ควรไปจับผิด ติเตียน หรือหาข้อบกพร่องของสิ่งนั้น", "ex1_en": "Uncle Ben gave me his old secondhand laptop; it runs slowly, but Mum told me to <span class=\"hl-teal\">never look a gift horse in the mouth</span>.", "ex1_hl": "never look a gift horse in the mouth", "ex1_th": "ลุงเบนยกล็อปท็อปมือสองเครื่องเก่าให้ฉัน มันทำงานค่อนข้างช้า แต่แม่เตือนฉันว่าได้ของฟรีมาแล้วก็อย่าไปติติงเลย", "ex2_en": "Although the surplus grant came with restrictive procurement clauses, the university chose <span class=\"hl-teal\">never to look a gift horse in the mouth</span> and accepted the funding.", "ex2_hl": "never to look a gift horse in the mouth", "ex2_th": "แม้ว่างบประมาณสนับสนุนส่วนเกินนี้จะมีเงื่อนไขการจัดซื้อจัดจ้างที่เข้มงวด มหาวิทยาลัยก็เลือกที่จะไม่เรื่องมากกับเงินที่ได้รับมาฟรีและยอมรับทุนดังกล่าว", "slot_num": 239, "sheet_no": 3, "first_letter": "N"}, {"id": 212, "orig_slot": "#240", "idiom": "Not my cup of tea", "meaning": "Not something I like.", "thai_idiom": "ไม่ใช่แนวของฉัน / ไม่ใช่สิ่งที่ฉันชอบ", "thai_meaning": "ไม่ใช่สิ่งหรือกิจกรรมที่ตนเองชื่นชอบ ถูกคอ หรือสนใจ", "ex1_en": "I tried going camping in the woods with them, but sleeping in a damp tent is really <span class=\"hl-teal\">not my cup of tea</span>.", "ex1_hl": "not my cup of tea", "ex1_th": "ฉันลองไปกางเต็นท์นอนในป่ากับพวกเขาแล้วนะ แต่การต้องนอนในเต็นท์ชื้นๆ มันไม่ใช่แนวของฉันจริงๆ", "ex2_en": "High-frequency algorithmic trading might yield quick returns, but volatile speculative investments are simply <span class=\"hl-teal\">not my cup of tea</span>.", "ex2_hl": "not my cup of tea", "ex2_th": "การเทรดความถี่สูงด้วยอัลกอริทึมอาจทำกำไรได้รวดเร็ว แต่การลงทุนเก็งกำไรที่มีความผันผวนสูงเช่นนี้ไม่ใช่แนวทางที่ผมถนัดหรือชอบเลย", "slot_num": 240, "sheet_no": 3, "first_letter": "N"}, {"id": 213, "orig_slot": "#241", "idiom": "On the ball", "meaning": "Doing things well and promptly.", "thai_idiom": "หัวไว / คล่องแคล่วกระฉับกระเฉง / ทันเกม / ไหวพริบดี", "thai_meaning": "มีความตื่นตัว ทำงานได้อย่างรวดเร็ว ถูกต้อง แม่นยำ และรู้เท่าทันสถานการณ์", "ex1_en": "Our wedding coordinator was totally <span class=\"hl-teal\">on the ball</span>, sorting out the missing flower delivery before we even noticed.", "ex1_hl": "on the ball", "ex1_th": "ผู้จัดงานแต่งงานของเราหัวไวและกระฉับกระเฉงมาก จัดการเคลียร์ปัญหาเรื่องดอกไม้ที่ส่งมาไม่ครบได้เรียบร้อยก่อนที่พวกเราจะทันสังเกตเห็นเสียอีก", "ex2_en": "The risk management officer stayed <span class=\"hl-teal\">on the ball</span>, spotting fraudulent liquidity transactions before any capital left the escrow account.", "ex2_hl": "on the ball", "ex2_th": "เจ้าหน้าที่บริหารความเสี่ยงทำงานได้อย่างเฉียบแหลมและทันท่วงที โดยตรวจพบธุรกรรมสภาพคล่องที่น่าสงสัยก่อนที่เงินทุนจะถูกโอนออกจากบัญชีดูแลผลประโยชน์", "slot_num": 241, "sheet_no": 3, "first_letter": "O"}, {"id": 214, "orig_slot": "#243", "idiom": "Out of the frying pan into the fire", "meaning": "From one bad situation to another.", "thai_idiom": "หนีเสือปะจระเข้", "thai_meaning": "หนีพ้นจากสถานการณ์ที่เลวร้ายหรืออันตรายหนึ่ง แต่กลับต้องไปเจอกับอีกสถานการณ์ที่แย่หรือร้ายแรงกว่าเดิม", "ex1_en": "She quit her stressful call center job only to end up working for an abusive manager, leaping <span class=\"hl-teal\">out of the frying pan into the fire</span>.", "ex1_hl": "out of the frying pan into the fire", "ex1_th": "เธอลาออกจากงานคอลเซ็นเตอร์ที่แสนตึงเครียด เพียงเพื่อมาเจอกับผู้จัดการใหม่ที่ชอบกดขี่และอารมณ์ร้าย เหมือนหนีเสือปะจระเข้แท้ๆ", "ex2_en": "Switching from an insolvent municipal bank to an unvetted offshore hedge fund felt like jumping <span class=\"hl-teal\">out of the frying pan into the fire</span> for the city's pension trustees.", "ex2_hl": "out of the frying pan into the fire", "ex2_th": "การเปลี่ยนจากการฝากเงินในธนาคารเทศบาลที่ใกล้ล้มละลายไปสู่กองทุนป้องกันความเสี่ยงนอกประเทศที่ไม่ผ่านการตรวจสอบ รู้สึกเหมือนหนีเสือปะจระเข้สำหรับคณะกรรมการกองทุนบำเหน็จบำนาญของเมือง", "slot_num": 243, "sheet_no": 3, "first_letter": "O"}, {"id": 215, "orig_slot": "#244", "idiom": "Put all your eggs in one basket", "meaning": "Risk everything on one thing.", "thai_idiom": "ทุ่มหมดหน้าตักไว้ที่จุดเดียว / เทหมดหน้าตักในทางเดียว", "thai_meaning": "เอาความหวัง ทรัพยากร หรือเงินทั้งหมดไปเสี่ยงทุ่มไว้กับสิ่งเดียว หากล้มเหลวก็อาจสูญสิ้นทุกอย่าง", "ex1_en": "Don't <span class=\"hl-teal\">put all your eggs in one basket</span> by applying to just one university; send submissions to a few safety schools as well.", "ex1_hl": "put all your eggs in one basket", "ex1_th": "อย่าไปทุ่มหมดหน้าตักด้วยการยื่นสมัครมหาวิทยาลัยแค่แห่งเดียวนะ ให้ส่งใบสมัครไปยังมหาวิทยาลัยสำรองอื่นๆ เผื่อไว้บ้าง", "ex2_en": "Financial planners caution retired clients never to <span class=\"hl-teal\">put all their eggs in one basket</span> by sinking their entire savings into a single volatile technology stock.", "ex2_hl": "put all their eggs in one basket", "ex2_th": "ผู้วางแผนทางการเงินเตือนลูกค้าวัยเกษียณว่าอย่าเทเงินทั้งหมดไว้ที่จุดเดียว โดยการนำเงินออมทั้งชีวิตไปทุ่มลงในหุ้นเทคโนโลยีที่มีความผันผวนสูงเพียงตัวเดียว", "slot_num": 244, "sheet_no": 3, "first_letter": "P"}, {"id": 216, "orig_slot": "#245", "idiom": "Put your foot down", "meaning": "Be firm and assertive.", "thai_idiom": "ยืนกรานอย่างเด็ดขาด / ใช้ไม้แข็ง / ตัดสินใจเด็ดขาด", "thai_meaning": "ใช้อำนาจหรือความเด็ดขาดเพื่อห้ามปราม หยุดยั้ง หรือปฏิเสธไม่ยอมให้เกิดสิ่งนั้นขึ้นอีกต่อไป", "ex1_en": "When the kids insisted on staying up past midnight playing video games, Dad finally <span class=\"hl-teal\">put his foot down</span> and unplugged the console.", "ex1_hl": "put his foot down", "ex1_th": "เมื่อพวกลูกๆ รบเร้าจะอยู่เล่นวิดีโอเกมต่อจนเลยเที่ยงคืน พ่อก็ต้องใช้ไม้แข็งยืนกรานอย่างเด็ดขาดด้วยการถอดปลั๊กเครื่องเล่นเกมออกทันที", "ex2_en": "The managing editor <span class=\"hl-teal\">put her foot down</span> regarding unverified leaks, insisting that no investigative article go to print without corroborating documentation.", "ex2_hl": "put her foot down", "ex2_th": "บรรณาธิการบริหารยืนกรานคำสั่งอย่างเด็ดขาดเกี่ยวกับข้อมูลรั่วไหลที่ไม่ได้รับการพิสูจน์ โดยย้ำชัดว่าจะไม่มีบทความเชิงสืบสวนชิ้นใดได้ตีพิมพ์หากปราศจากเอกสารยืนยันความถูกต้อง", "slot_num": 245, "sheet_no": 3, "first_letter": "P"}, {"id": 217, "orig_slot": "#246", "idiom": "See the bigger picture", "meaning": "Understand the overall situation.", "thai_idiom": "มองภาพรวม / มองการณ์ไกล", "thai_meaning": "เข้าใจสถานการณ์หรือเป้าหมายในภาพรวมมากกว่าติดอยู่กับรายละเอียดเล็กน้อย", "ex1_en": "Instead of obsessing over a minor delay with our kitchen renovation, let's <span class=\"hl-teal\">see the bigger picture</span>—we're finally building our dream home.", "ex1_hl": "see the bigger picture", "ex1_th": "แทนที่จะไปกังวลกับความล่าช้าเล็กๆ น้อยๆ ในการรีโนเวตห้องครัว เราควรมองภาพรวมดีกว่านะ ว่าในที่สุดเราก็กำลังสร้างบ้านในฝันของเราแล้ว", "ex2_en": "During corporate restructuring, senior leaders urged department heads to <span class=\"hl-teal\">see the bigger picture</span> rather than defend their own regional budgets.", "ex2_hl": "see the bigger picture", "ex2_th": "ในระหว่างการปรับโครงสร้างองค์กร ผู้บริหารระดับสูงได้กระตุ้นให้หัวหน้าแผนกมองภาพรวมของบริษัท แทนที่จะคอยปกป้องแต่งบประมาณประจำภูมิภาคของตัวเอง", "slot_num": 246, "sheet_no": 3, "first_letter": "S"}, {"id": 218, "orig_slot": "#247", "idiom": "Set the record straight", "meaning": "Correct a misunderstanding.", "thai_idiom": "แก้ข่าว / ชี้แจงความจริงให้ถูกต้อง", "thai_meaning": "แถลงหรือชี้แจงเพื่อแก้ไขความเข้าใจผิดให้ถูกต้องตรงตามข้อเท็จจริง", "ex1_en": "After rumors circulated at school that I was moving away, I had to <span class=\"hl-teal\">set the record straight</span> and tell everyone I was just taking a two-week family trip.", "ex1_hl": "set the record straight", "ex1_th": "หลังจากมีข่าวลือสะพัดทั่วโรงเรียนว่าฉันจะย้ายบ้าน ฉันก็เลยต้องออกมาชี้แจงความจริงให้ทุกคนรู้ว่า แค่จะไปเที่ยวกับครอบครัวสองสัปดาห์เท่านั้น", "ex2_en": "The spokesperson held an emergency press briefing to <span class=\"hl-teal\">set the record straight</span> regarding the leaked financial audit.", "ex2_hl": "set the record straight", "ex2_th": "โฆษกได้เปิดแถลงข่าวด่วนเพื่อชี้แจงข้อเท็จจริงให้กระจ่าง เกี่ยวกับรายงานการตรวจสอบบัญชีที่รั่วไหลออกไป", "slot_num": 247, "sheet_no": 3, "first_letter": "S"}, {"id": 219, "orig_slot": "#248", "idiom": "Smooth sailing", "meaning": "Easy progress.", "thai_idiom": "ราบรื่นไร้อุปสรรค / แล่นฉิว", "thai_meaning": "ดำเนินไปอย่างราบรื่น ไม่มีปัญหาหรืออุปสรรคขัดขวาง", "ex1_en": "Once we got through airport security and found our boarding gate, our family vacation was <span class=\"hl-teal\">smooth sailing</span>.", "ex1_hl": "smooth sailing", "ex1_th": "พอเราผ่านด่านตรวจความปลอดภัยที่สนามบินและไปถึงประตูขึ้นเครื่องได้ การเดินทางไปเที่ยวของครอบครัวเราก็ราบรื่นไร้อุปสรรคตลอดทริป", "ex2_en": "Following the migration to the new cloud infrastructure, the project manager confirmed that deployment was <span class=\"hl-teal\">smooth sailing</span>.", "ex2_hl": "smooth sailing", "ex2_th": "หลังจากการย้ายข้อมูลไปยังระบบคลาวด์ตัวใหม่ ผู้จัดการโครงการยืนยันว่าการนำระบบไปใช้งานดำเนินไปอย่างราบรื่นไร้ปัญหา", "slot_num": 248, "sheet_no": 3, "first_letter": "S"}, {"id": 220, "orig_slot": "#250", "idiom": "Stand your ground", "meaning": "Refuse to change your position.", "thai_idiom": "ยืนหยัดในจุดยืน / ไม่ยอมถอยแม้แต่ก้าวเดียว", "thai_meaning": "หนักแน่น ไม่ยอมอ่อนข้อหรือเปลี่ยนจุดยืนตามแรงกดดันของผู้อื่น", "ex1_en": "When the landlord demanded an unjustified rent hike, my roommate insisted on <span class=\"hl-teal\">standing our ground</span> until he honored our original lease.", "ex1_hl": "standing our ground", "ex1_th": "ตอนที่เจ้าของห้องเช่าจะขอขึ้นค่าเช่าโดยไม่มีเหตุผล รูมเมตของฉันยืนกรานว่าพวกเราต้องยืนหยัดในจุดยืนจนกว่าเขาจะยอมปฏิบัติตามสัญญาเดิม", "ex2_en": "Despite intense lobbying from competitors, the regulatory commission <span class=\"hl-teal\">stood its ground</span> and upheld the antitrust penalty.", "ex2_hl": "stood its ground", "ex2_th": "แม้จะเผชิญแรงวิ่งเต้นกดดันอย่างหนักจากคู่แข่งในตลาด แต่คณะกรรมการกำกับดูแลก็ยังคงยืนหยัดในจุดยืนเดิมและบังคับใช้บทลงโทษตามกฎหมายป้องกันการผูกขาด", "slot_num": 250, "sheet_no": 3, "first_letter": "S"}, {"id": 221, "orig_slot": "#251", "idiom": "Strike while the iron is hot", "meaning": "Take advantage of the right moment.", "thai_idiom": "ตีเหล็กเมื่อยังร้อน / น้ำขึ้นให้รีบตัก", "thai_meaning": "ฉวยโอกาสหรือลงมือทำทันทีในขณะที่โอกาสและเงื่อนไขกำลังเอื้ออำนวย", "ex1_en": "Now that your homemade cookies are trending on TikTok, you should <span class=\"hl-teal\">strike while the iron is hot</span> and open pre-orders immediately.", "ex1_hl": "strike while the iron is hot", "ex1_th": "ช่วงนี้ที่คุกกี้โฮมเมดของเธอกำลังไวรัลบน TikTok เธอควรรีบตีเหล็กเมื่อยังร้อน เปิดรับพรีออเดอร์ทันทีเลย", "ex2_en": "With consumer sentiment rebounding sharply this quarter, the venture capital firm decided to <span class=\"hl-teal\">strike while the iron was hot</span> and launch their new fintech fund.", "ex2_hl": "strike while the iron was hot", "ex2_th": "เมื่อความเชื่อมั่นของผู้บริโภคฟื้นตัวอย่างก้าวกระโดดในไตรมาสนี้ บริษัทร่วมทุนจึงตัดสินใจคว้าโอกาสทองในจังหวะนี้เพื่อเปิดตัวกองทุนฟินเทคตัวใหม่", "slot_num": 251, "sheet_no": 3, "first_letter": "S"}, {"id": 222, "orig_slot": "#252", "idiom": "Swim against the tide", "meaning": "Go against what is popular.", "thai_idiom": "ว่ายทวนน้ำ / สวนกระแส", "thai_meaning": "ทำในสิ่งที่ตรงข้ามกับกระแสนิยมหรือความคิดเห็นส่วนใหญ่ของคนทั่วไป", "ex1_en": "In an era where all his classmates carry smartphones, Liam prefers to <span class=\"hl-teal\">swim against the tide</span> by using a classic flip phone.", "ex1_hl": "swim against the tide", "ex1_th": "ในยุคที่เพื่อนร่วมชั้นทุกคนใช้สมาร์ตโฟน เลียมกลับเลือกที่จะสวนกระแสด้วยการใช้โทรศัพท์ฝาพับรุ่นคลาสสิก", "ex2_en": "By investing heavily in physical retail branches while competitors went purely digital, the boutique bank consciously <span class=\"hl-teal\">swam against the tide</span>.", "ex2_hl": "swam against the tide", "ex2_th": "ด้วยการทุ่มงบลงทุนเปิดสาขาหน้าร้านจริงในขณะที่คู่แข่งหันไปใช้ระบบดิจิทัลกันหมด ธนาคารเฉพาะกลุ่มแห่งนี้จึงดำเนินกลยุทธ์สวนกระแสตลาดอย่างชัดเจน", "slot_num": 252, "sheet_no": 3, "first_letter": "S"}, {"id": 223, "orig_slot": "#253", "idiom": "Take it or leave it", "meaning": "Accept it or refuse it.", "thai_idiom": "เอาหรือไม่เอา / จะรับเงื่อนไขนี้หรือจะปฏิเสธก็แล้วแต่", "thai_meaning": "ข้อเสนอสุดท้ายที่ไม่สามารถต่อรองได้อีกแล้ว ให้เลือกว่าจะยอมรับหรือบอกผ่าน", "ex1_en": "I'm offering to sell you my mountain bike for two hundred dollars, <span class=\"hl-teal\">take it or leave it</span>, because that's the absolute lowest price I can accept.", "ex1_hl": "take it or leave it", "ex1_th": "ฉันยอมขายจักรยานเสือภูเขาให้เธอสองร้อยดอลลาร์ จะเอาก็เอา ไม่เอาก็ไม่เป็นไรนะ เพราะนี่คือราคาสุดท้ายที่ลดให้ได้แล้วจริงๆ", "ex2_en": "The supplier issued an ultimatum stating that the shipment schedule was non-negotiable—it was strictly a <span class=\"hl-teal\">take it or leave it</span> proposal.", "ex2_hl": "take it or leave it", "ex2_th": "ซัพพลายเออร์ยื่นคำขาดว่ากำหนดการส่งมอบสินค้านี้ไม่สามารถต่อรองได้อีก เป็นข้อเสนอแบบต้องรับหรือปฏิเสธไปเลยเท่านั้น", "slot_num": 253, "sheet_no": 3, "first_letter": "T"}, {"id": 224, "orig_slot": "#257", "idiom": "The grass is always greener on the other side", "meaning": "People want what others have.", "thai_idiom": "เห็นคนอื่นดีกว่าเสมอ / หญ้าฝั่งโน้นมักจะเขียวกว่าฝั่งนี้", "thai_meaning": "มักมองว่าสถานการณ์หรือสิ่งที่คนอื่นมีนั้นดูดีและน่าอิจฉากว่าของตนเอง ทั้งที่ความจริงอาจไม่ได้เป็นเช่นนั้น", "ex1_en": "Chloe keeps envying her sister's freelance lifestyle, forgetting that <span class=\"hl-teal\">the grass is always greener on the other side</span> when income is unpredictable.", "ex1_hl": "the grass is always greener on the other side", "ex1_th": "โคลอี้เอาแต่อิจฉาวิถีชีวิตฟรีแลนซ์ของพี่สาว โดยลืมไปว่าคนเรามักมองว่าหญ้
