Dave, but <span class=\"hl-teal\">time will tell</span>.", "ex1_hl": "time will tell", "ex1_th": "ฉันก็ไม่รู้เหมือนกันว่าการพักการเรียนหนึ่งปีเพื่อไปเรียนภาษาญี่ปุ่นเป็นการตัดสินใจที่ถูกของเดฟไหม แต่กาลเวลาคงเป็นเครื่องพิสูจน์เอง", "ex2_en": "While the massive merger looks promising on paper, financial analysts caution that only <span class=\"hl-teal\">time will tell</span> whether corporate synergies truly materialize.", "ex2_hl": "time will tell", "ex2_th": "แม้การควบรวมกิจการครั้งใหญ่จะดูสดใสตามตัวเลขบนกระดาษ แต่นักวิเคราะห์การเงินเตือนว่ามีเพียงกาลเวลาเท่านั้นที่จะเป็นเครื่องพิสูจน์ว่าผลประโยชน์ร่วมทางธุรกิจจะเกิดขึ้นได้จริงหรือไม่", "slot_num": 260, "sheet_no": 3, "first_letter": "T"}, {"id": 227, "orig_slot": "#261", "idiom": "Throw shade", "meaning": "Criticize or insult someone subtly.", "thai_idiom": "แซะ / เหน็บแนมแบบเนียนๆ", "thai_meaning": "พูดจิกกัด เหน็บแนม หรือวิพากษ์วิจารณ์ผู้อื่นอย่างแนบเนียนหรือไม่เปิดเผยตรงไปตรงมา", "ex1_en": "During brunch, Mark couldn't resist <span class=\"hl-teal\">throwing shade</span> at his ex's fashion choices by making sarcastic comments about fast fashion.", "ex1_hl": "throwing shade", "ex1_th": "ระหว่างกินมื้อสาย มาร์กก็อดไม่ได้ที่จะเหน็บแนมรสนิยมการแต่งตัวของแฟนเก่า ด้วยการพูดจิกกัดเรื่องเสื้อผ้าฟาสต์แฟชั่นแบบเนียนๆ", "ex2_en": "The tech startup's social media campaign subtly <span class=\"hl-teal\">threw shade</span> at industry incumbents by highlighting their archaic subscription fees.", "ex2_hl": "threw shade", "ex2_th": "แคมเปญบนโซเชียลมีเดียของบริษัทสตาร์ตอัปเทคโนโลยีแอบแซะเจ้าตลาดรายใหญ่แบบแสบๆ ด้วยการเน้นย้ำถึงค่าธรรมเนียมสมาชิกรายเดือนที่ล้าสมัย", "slot_num": 261, "sheet_no": 3, "first_letter": "T"}, {"id": 228, "orig_slot": "#262", "idiom": "To each his own", "meaning": "Everyone has their own taste.", "thai_idiom": "ลางเนื้อชอบลางยา / ความชอบใครความชอบมัน", "thai_meaning": "แต่ละคนย่อมมีความชอบ รสนิยม หรือความคิดเห็นที่แตกต่างกันไป", "ex1_en": "I personally can't stand putting pineapple on pizza, but <span class=\"hl-teal\">to each his own</span>.", "ex1_hl": "to each his own", "ex1_th": "โดยส่วนตัวแล้วฉันรับไม่ได้กับการใส่สับปะรดบนหน้าพิซซ่า แต่ก็นะ ลางเนื้อชอบลางยา รสนิยมใครรสนิยมมัน", "ex2_en": "Some portfolio managers heavily weigh volatile crypto assets while others stick strictly to blue-chip stocks—ultimately, <span class=\"hl-teal\">to each his own</span> when it comes to risk tolerance.", "ex2_hl": "to each his own", "ex2_th": "ผู้จัดการพอร์ตลงทุนบางคนเน้นสินทรัพย์คริปโตที่มีความผันผวนสูง ในขณะที่บางคนยึดมั่นอยู่กับหุ้นบลูชิปชั้นนำ สุดท้ายแล้วย่อมขึ้นอยู่กับรสนิยมและระดับความเสี่ยงที่แต่ละคนยอมรับได้", "slot_num": 262, "sheet_no": 3, "first_letter": "T"}, {"id": 229, "orig_slot": "#263", "idiom": "Try to keep up with the Joneses", "meaning": "Try to be as good as others.", "thai_idiom": "เห็นช้างขี้ ขี้ตามช้าง / พยายามใช้ชีวิตหรูหราแข่งกับคนอื่น", "thai_meaning": "พยายามดิ้นรนแข่งขันซื้อของหรูหราหรืออวดฐานะทางสังคมเพื่อให้ทัดเทียมกับคนรอบข้าง", "ex1_en": "Our neighbors accumulated massive credit card debt because they constantly <span class=\"hl-teal\">tried to keep up with the Joneses</span>, upgrading their luxury cars every two years.", "ex1_hl": "tried to keep up with the Joneses", "ex1_th": "เพื่อนบ้านของเรามีหนี้บัตรเครดิตพะเนิน เพราะพวกเขาพยายามใช้ชีวิตหรูหราแข่งกับคนอื่นตลอดเวลา ถึงขั้นเปลี่ยนรถหรูใหม่ทุกๆ สองปี", "ex2_en": "Sociologists emphasize that middle-class financial strain is often exacerbated by consumers feeling compelled to <span class=\"hl-teal\">keep up with the Joneses</span> through ostentatious spending.", "ex2_hl": "keep up with the Joneses", "ex2_th": "นักสังคมวิทยาชี้ว่า ภาระทางการเงินของชนชั้นกลางมักทวีความรุนแรงขึ้นจากการที่ผู้บริโภครู้สึกถูกกดดันให้ต้องใช้จ่ายอย่างโอ่อ่าเพื่อรักษาหน้าตาทางสังคมให้ทัดเทียมผู้อื่น", "slot_num": 263, "sheet_no": 3, "first_letter": "T"}, {"id": 230, "orig_slot": "#264", "idiom": "Turn a deaf ear", "meaning": "Ignore someone on purpose.", "thai_idiom": "แกล้งทำหูทวนลม / ทำเป็นหูหนวกตาบอด", "thai_meaning": "เพิกเฉย ไม่ยอมรับฟังคำเตือน คำขอร้อง หรือคำแนะนำโดยเจตนา", "ex1_en": "I warned my younger brother about driving too fast on wet roads, but he simply <span class=\"hl-teal\">turned a deaf ear</span> and sped off anyway.", "ex1_hl": "turned a deaf ear", "ex1_th": "ฉันเตือนน้องชายเรื่องการขับรถเร็วบนถนนเปียกแล้ว แต่เขากลับทำหูทวนลมแล้วเหยียบคันเร่งขับออกไปอยู่ดี", "ex2_en": "The municipal council faced widespread protests after it <span class=\"hl-teal\">turned a deaf ear</span> to environmental concerns raised by local residents.", "ex2_hl": "turned a deaf ear", "ex2_th": "สภาเทศบาลเมืองเผชิญกับการประท้วงอย่างกว้างขวาง หลังจากจงใจทำหูทวนลมเพิกเฉยต่อข้อกังวลด้านสิ่งแวดล้อมที่ชาวบ้านในพื้นที่ได้ร้องเรียนเข้ามา", "slot_num": 264, "sheet_no": 3, "first_letter": "T"}, {"id": 231, "orig_slot": "#265", "idiom": "Two wrongs don't make a right", "meaning": "You shouldn't reply to wrong with wrong.", "thai_idiom": "เวรย่อมไม่ระงับด้วยการจองเวร / ความผิดอย่างหนึ่งไม่อาจลบล้างความผิดอีกอย่างได้", "thai_meaning": "การทำสิ่งไม่ดีหรือแก้แค้นตอบโต้คนที่ทำร้ายเรา ไม่ได้ทำให้สิ่งนั้นถูกต้องขึ้นมาได้", "ex1_en": "Even though your sister scratched your phone screen on purpose, hiding her favorite shoes was petty—remember that <span class=\"hl-teal\">two wrongs don't make a right</span>.", "ex1_hl": "two wrongs don't make a right", "ex1_th": "ถึงแม้พี่สาวจะจงใจขูดหน้าจอโทรศัพท์ของเธอ แต่การเอาเธอไปซ่อนรองเท้าคู่โปรดก็เป็นเรื่องงี่เง่า จำไว้ว่าความผิดอย่างหนึ่งไม่อาจลบล้างความผิดอีกอย่างได้นะ", "ex2_en": "The compliance officer cautioned management against leaking confidential records in retaliation for corporate espionage, reminding the board that <span class=\"hl-teal\">two wrongs don't make a right</span>.", "ex2_hl": "two wrongs don't make a right", "ex2_th": "เจ้าหน้าที่ฝ่ายกำกับดูแลได้เตือนฝ่ายบริหารไม่ให้นำเอกสารลับออกมาแฉเพื่อแก้แค้นการจารกรรมข้อมูล โดยเตือนคณะกรรมการว่าการตอบโต้ด้วยการกระทำที่ผิดไม่ได้ช่วยให้ฝ่ายตนชอบธรรมขึ้นมาได้", "slot_num": 265, "sheet_no": 3, "first_letter": "T"}, {"id": 232, "orig_slot": "#266", "idiom": "Under the radar", "meaning": "Not noticed; kept secret.", "thai_idiom": "ลับตาคน / แบบเงียบๆ ไม่ให้ใครสังเกตเห็น", "thai_meaning": "ทำอย่างเงียบเชียบหรือไม่เป็นจุดสนใจ เพื่อไม่ให้ผู้อื่นสังเกตเห็นหรือรับรู้", "ex1_en": "Emma managed to plan a surprise anniversary getaway completely <span class=\"hl-teal\">under the radar</span> without her husband suspecting a thing.", "ex1_hl": "under the radar", "ex1_th": "เอมม่าจัดการวางแผนทริปฉลองครบรอบสุดเซอร์ไพรส์ได้อย่างแนบเนียนและเงียบกริบ โดยที่สามีของเธอไม่เอะใจเลยสักนิด", "ex2_en": "The covert startup operated <span class=\"hl-teal\">under the radar</span> for three years before officially unveiling its proprietary quantum computing chip.", "ex2_hl": "under the radar", "ex2_th": "บริษัทสตาร์ตอัปแห่งนี้ซุ่มพัฒนาเทคโนโลยีแบบเงียบๆ ลับตาคนมานานกว่าสามปี ก่อนจะเปิดตัวชิปประมวลผลควอนตัมที่เป็นเอกสิทธิ์เฉพาะของตนเองอย่างเป็นทางการ", "slot_num": 266, "sheet_no": 3, "first_letter": "U"}, {"id": 233, "orig_slot": "#267", "idiom": "Up in arms", "meaning": "Very angry.", "thai_idiom": "ลุกฮือขึ้นมาต่อต้าน / โกรธเป็นฟืนเป็นไฟ", "thai_meaning": "โกรธแค้น ไม่พอใจอย่างรุนแรง และออกมาประท้วงหรือคัดค้านอย่างหนัก", "ex1_en": "Local pet owners were <span class=\"hl-teal\">up in arms</span> when the park authority banned dogs from the central lawn without prior notice.", "ex1_hl": "up in arms", "ex1_th": "กลุ่มเจ้าของสัตว์เลี้ยงในละแวกนั้นต่างพากันลุกฮือด้วยความไม่พอใจ เมื่อฝ่ายดูแลสวนสาธารณะสั่งห้ามนำสุนัขเข้าไปบริเวณสนามหญ้าส่วนกลางโดยไม่แจ้งล่วงหน้า", "ex2_en": "Union members were <span class=\"hl-teal\">up in arms</span> over the sudden announcement of pension cuts, threatening an immediate nationwide strike.", "ex2_hl": "up in arms", "ex2_th": "สมาชิกสหภาพแรงงานต่างโกรธเป็นฟืนเป็นไฟหลังจากการประกาศลดเงินบำนาญอย่างกะทันหัน พร้อมขู่ว่าจะนัดหยุดงานประท้วงทั่วประเทศทันที", "slot_num": 267, "sheet_no": 3, "first_letter": "U"}, {"id": 234, "orig_slot": "#268", "idiom": "Wake-up call", "meaning": "A warning to pay attention.", "thai_idiom": "สัญญาณเตือนสติ / สิ่งเตือนใจให้ตื่นตัว", "thai_meaning": "เหตุการณ์ไม่คาดฝันหรือความผิดพลาดที่เกิดขึ้น ซึ่งทำหน้าที่เป็นสัญญาณเตือนให้หันมาใส่ใจหรือแก้ไขปัญหาก่อนจะสายเกินไป", "ex1_en": "Fainting from exhaustion during morning commute was a serious <span class=\"hl-teal\">wake-up call</span> for Daniel to start prioritizing his sleep.", "ex1_hl": "wake-up call", "ex1_th": "การเป็นลมเพราะความอ่อนเพลียระหว่างเดินทางไปทำงานตอนเช้า ถือเป็นสัญญาณเตือนสติครั้งใหญ่ที่ทำให้แดเนียลหันมาให้ความสำคัญกับการนอนหลับพักผ่อน", "ex2_en": "The near-catastrophic cybersecurity breach served as a sobering <span class=\"hl-teal\">wake-up call</span> for the bank to overhaul its aging data encryption protocols.", "ex2_hl": "wake-up call", "ex2_th": "เหตุการณ์การถูกเจาะระบบความปลอดภัยทางไซเบอร์ที่เกือบสร้างความเสียหายร้ายแรง กลายเป็นสัญญาณเตือนใจครั้งสำคัญให้ธนาคารเร่งยกเครื่องมาตรการเข้ารหัสข้อมูลที่ล้าสมัย", "slot_num": 268, "sheet_no": 3, "first_letter": "W"}, {"id": 235, "orig_slot": "#269", "idiom": "Wear many hats", "meaning": "Do many different jobs.", "thai_idiom": "สวมหมวกหลายใบ / รับหน้าที่หลายบทบาท", "thai_meaning": "ต้องรับผิดชอบหลายหน้าที่หรือทำงานหลากหลายบทบาทพร้อมกัน", "ex1_en": "As a stay-at-home dad homeschooling three toddlers, Kevin has to <span class=\"hl-teal\">wear many hats</span>—from chef and tutor to nurse and referee.", "ex1_hl": "wear many hats", "ex1_th": "ในฐานะพ่อบ้านที่ต้องสอนหนังสือลูกวัยเตาะแตะสามคนอยู่บ้าน เควินต้องสวมหมวกหลายใบ ตั้งแต่เป็นพ่อครัว ครูสอนพิเศษ ไปจนถึงพยาบาลและกรรมการคอยห้ามมวย", "ex2_en": "Founding members of early-stage startups inevitably <span class=\"hl-teal\">wear many hats</span>, frequently shifting between product development, client sales, and legal compliance.", "ex2_hl": "wear many hats", "ex2_th": "ผู้ร่วมก่อตั้งสตาร์ตอัปในระยะเริ่มต้นหลีกเลี่ยงไม่ได้ที่จะต้องสวมหมวกหลายใบ โดยต้องสลับหน้าที่ระหว่างการพัฒนาผลิตภัณฑ์ งานขายลูกค้า และการดูแลข้อกฎหมายอยู่ตลอดเวลา", "slot_num": 269, "sheet_no": 3, "first_letter": "W"}, {"id": 236, "orig_slot": "#270", "idiom": "When pigs can fly", "meaning": "Something that will never happen.", "thai_idiom": "ชาติหน้าตอนบ่ายๆ / รอให้หมูบินได้ก่อนเถอะ", "thai_meaning": "สิ่งที่เป็นไปไม่ได้ หรือไม่มีทางเกิดขึ้นได้อย่างแน่นอน", "ex1_en": "You think my untidy brother will voluntarily clean the entire garage this weekend? Only <span class=\"hl-teal\">when pigs can fly</span>!", "ex1_hl": "when pigs can fly", "ex1_th": "เธอคิดว่าพี่ชายจอมซกมกของฉันจะยอมทำความสะอาดโรงรถทั้งหมดในวันหยุดนี้ด้วยตัวเองงั้นเหรอ? รอให้ชาติหน้าตอนบ่ายๆ เถอะ!", "ex2_en": "Market analysts remarked that the state-owned monopoly would willingly surrender its exclusive distribution rights only <span class=\"hl-teal\">when pigs can fly</span>.", "ex2_hl": "when pigs can fly", "ex2_th": "นักวิเคราะห์การตลาดให้ความเห็นว่า การที่กลุ่มทุนผูกขาดของรัฐจะยอมสละสิทธิ์การจัดจำหน่ายแต่เพียงผู้เดียวด้วยความเต็มใจนั้น คงเกิดขึ้นได้เมื่อรอให้หมูบินได้เท่านั้น", "slot_num": 270, "sheet_no": 3, "first_letter": "W"}, {"id": 237, "orig_slot": "#272", "idiom": "As clear as day", "meaning": "Very obvious.", "thai_idiom": "ชัดเจนเหมือนเห็นกับตา / ชัดแจ้งแดงแจ๋", "thai_meaning": "ชัดเจนและเห็นได้ง่ายมากอย่างไม่ต้องสงสัย ปราศจากความคลุมเครือ", "ex1_en": "From the expression on her face, it was <span class=\"hl-teal\">as clear as day</span> that Maya was thrilled with her birthday present.", "ex1_hl": "as clear as day", "ex1_th": "เมื่อดูจากสีหน้าของเธอแล้ว มันชัดเจนแจ่มแจ้งจนไม่ต้องเดาเลยว่ามายาดีใจสุดๆ กับของขวัญวันเกิดชิ้นนั้น", "ex2_en": "The surveillance footage proved <span class=\"hl-teal\">as clear as day</span> that the contractor had breached warehouse safety protocols.", "ex2_hl": "as clear as day", "ex2_th": "ภาพจากกล้องวงจรปิดพิสูจน์ให้เห็นอย่างชัดแจ้งแดงแจ๋ว่า ผู้รับเหมาได้ละเมิดมาตรการความปลอดภัยของคลังสินค้าจริง", "slot_num": 272, "sheet_no": 3, "first_letter": "A"}, {"id": 238, "orig_slot": "#273", "idiom": "A drop in the bucket", "meaning": "Very small compared to the whole.", "thai_idiom": "น้ำหยดเดียวในมหาสมุทร / เล็กน้อยเหมือนเศษผง", "thai_meaning": "จำนวนหรือสัดส่วนที่น้อยมากจนแทบไม่มีนัยสำคัญเมื่อเทียบกับทั้งหมด", "ex1_en": "Saving fifty dollars on grocery coupons is nice, but it feels like <span class=\"hl-teal\">a drop in the bucket</span> when our rent just went up by five hundred.", "ex1_hl": "a drop in the bucket", "ex1_th": "การประหยัดเงินค่าของชำได้ห้าสิบดอลลาร์จากคูปองก็ดีอยู่หรอก แต่มันเทียบอะไรไม่ได้เลยเหมือนน้ำหยดเดียวในถังใหญ่ เมื่อค่าเช่าห้องเพิ่งปรับขึ้นถึงห้าร้อยดอลลาร์", "ex2_en": "The multimillion-dollar settlement penalty was merely <span class=\"hl-teal\">a drop in the bucket</span> for the global pharmaceutical conglomerate, whose quarterly revenues topped ten billion.", "ex2_hl": "a drop in the bucket", "ex2_th": "ค่าปรับประนีประนอมยอมความหลายล้านดอลลาร์นั้นเป็นเพียงเศษเงินเล็กน้อยสำหรับบริษัทยาข้ามชาติ ที่ทำรายได้ในแต่ละไตรมาสสูงเกินหนึ่งหมื่นล้านดอลลาร์", "slot_num": 273, "sheet_no": 3, "first_letter": "A"}, {"id": 239, "orig_slot": "#274", "idiom": "A needle in a haystack", "meaning": "Very hard to find.", "thai_idiom": "งมเข็มในมหาสมุทร", "thai_meaning": "สิ่งของหรือบุคคลที่ค้นหาได้ยากยิ่งท่ามกลางสิ่งของหรือฝูงชนจำนวนมหาศาล", "ex1_en": "Searching for my lost wireless earbud on a crowded, sandy beach was like looking for <span class=\"hl-teal\">a needle in a haystack</span>.", "ex1_hl": "a needle in a haystack", "ex1_th": "การตามหาหูฟังไร้สายที่ทำตกหายบนชายหาดที่มีทั้งทรายและผู้คนพลุกพล่านนั้น เหมือนกับการงมเข็มในมหาสมุทรไม่มีผิด", "ex2_en": "Detecting fraudulent microscopic transactions across millions of daily blockchain ledgers requires advanced algorithmic filters, as locating manual anomalies is like finding <span class=\"hl-teal\">a needle in a haystack</span>.", "ex2_hl": "a needle in a haystack", "ex2_th": "การตรวจจับธุรกรรมทุจริตขนาดย่อยท่ามกลางรายการบัญชีบล็อกเชนนับล้านในแต่ละวันต้องพึ่งพาอัลกอริทึมขั้นสูง เพราะการค้นหาความผิดปกติด้วยมือนั้นยากยิ่งกว่างมเข็มในมหาสมุทร", "slot_num": 274, "sheet_no": 3, "first_letter": "A"}, {"id": 240, "orig_slot": "#276", "idiom": "All ears", "meaning": "Listening attentively.", "thai_idiom": "ตั้งใจฟังอย่างจดจ่อ / หูผึ่ง / พร้อมรับฟังเต็มที่", "thai_meaning": "ตั้งอกตั้งใจฟังอย่างกระตือรือร้นและให้ความสนใจอย่างเต็มเปี่ยม", "ex1_en": "Tell me all about your romantic trip to Venice—I am <span class=\"hl-teal\">all ears</span>!", "ex1_hl": "all ears", "ex1_th": "เล่าเรื่องทริปสุดโรแมนติกที่เวนิสให้ฟังหน่อยสิ ฉันกำลังตั้งใจฟังอย่างจดจ่อเลยเนี่ย!", "ex2_en": "The venture capitalist leaned forward and told the founders that she was <span class=\"hl-teal\">all ears</span> to hear how their renewable energy model reduces grid distribution costs.", "ex2_hl": "all ears", "ex2_th": "นักลงทุนร่วมทุนโน้มตัวมาข้างหน้าและบอกกับกลุ่มผู้ก่อตั้งว่า เธอพร้อมรับฟังอย่างเต็มที่ว่าโมเดลพลังงานหมุนเวียนของพวกเขาจะช่วยลดต้นทุนการกระจายไฟได้อย่างไร", "slot_num": 276, "sheet_no": 3, "first_letter": "A"}, {"id": 241, "orig_slot": "#277", "idiom": "At the drop of a hat", "meaning": "Immediately; without delay.", "thai_idiom": "ได้ในทันทีทันใด / ไม่รีรอแม้แต่วินาทีเดียว", "thai_meaning": "ทำในทันทีโดยไม่ต้องลังเลหรือคิดหน้าคิดหลัง พร้อมทำได้ทุกเมื่อ", "ex1_en": "Whenever his best friend calls for help with car troubles, Sam will drive across town <span class=\"hl-teal\">at the drop of a hat</span>.", "ex1_hl": "at the drop of a hat", "ex1_th": "เมื่อไหร่ก็ตามที่เพื่อนสนิทโทรมาขอความช่วยเหลือเรื่องรถเสีย แซมก็พร้อมจะขับรถข้ามเมืองไปหาในทันทีทันใดโดยไม่รีรอเลย", "ex2_en": "Because geopolitical volatility remains severe, foreign investors are prepared to pull capital from emerging equity funds <span class=\"hl-teal\">at the drop of a hat</span>.", "ex2_hl": "at the drop of a hat", "ex2_th": "เนื่องจากความไม่แน่นอนทางภูมิรัฐศาสตร์ยังคงรุนแรง นักลงทุนต่างชาติจึงพร้อมที่จะถอนทุนออกจากกองทุนหุ้นตลาดเกิดใหม่ได้ในทันทีโดยไม่ลังเล", "slot_num": 277, "sheet_no": 3, "first_letter": "A"}, {"id": 242, "orig_slot": "#278", "idiom": "Backseat driver", "meaning": "Someone who gives unwanted advice.", "thai_idiom": "คนชอบสั่ง / จอมบงการ / คนที่ชอบชี้นิ้วสั่งทั้งที่ไม่ได้ทำเอง", "thai_meaning": "คนที่ชอบออกคำสั่ง วิพากษ์วิจารณ์ หรือคอยชี้นิ้วสั่งการผู้อื่นทั้งที่ตนเองไม่ได้เป็นผู้ลงมือทำหรือไม่ได้รับผิดชอบ", "ex1_en": "I love road trips with my uncle, but he can be an annoying <span class=\"hl-teal\">backseat driver</span>, constantly telling me when to change lanes and brake.", "ex1_hl": "backseat driver", "ex1_th": "ฉันชอบนั่งรถเที่ยวกับคุณลุงนะ แต่บางทีเขาก็ชอบทำตัวเป็นคนคอยบงการที่น่ารำคาญ คอยสั่งตลอดเวลาว่าต้องเปลี่ยนเลนตอนไหนหรือเบรกเมื่อไหร่", "ex2_en": "The newly appointed CEO politely reminded the retired founder not to act as a <span class=\"hl-teal\">backseat driver</span> during executive board meetings.", "ex2_hl": "backseat driver", "ex2_th": "ซีอีโอคนใหม่ได้เตือนผู้ก่อตั้งที่เกษียณไปแล้วอย่างสุภาพว่า อย่าทำตัวเป็นจอมบงการอยู่เบื้องหลังในระหว่างการประชุมคณะกรรมการบริหาร", "slot_num": 278, "sheet_no": 3, "first_letter": "B"}, {"id": 243, "orig_slot": "#279", "idiom": "Break the mold", "meaning": "Be different from others.", "thai_idiom": "ฉีกทุกกฎ / ทุบพิมพ์เดิม / สร้างมาตรฐานใหม่ที่ไม่เหมือนใคร", "thai_meaning": "ทำสิ่งที่แปลกใหม่ แตกต่าง หรือไม่เหมือนใคร จนกลายเป็นการทลายกรอบเดิมๆ", "ex1_en": "Instead of having a conventional hotel reception, the young couple decided to <span class=\"hl-teal\">break the mold</span> with a campfire festival in the woods.", "ex1_hl": "break the mold", "ex1_th": "แทนที่จะจัดงานแต่งในโรงแรมแบบเดิมๆ คู่บ่าวสาวรุ่นใหม่ตัดสินใจฉีกทุกกฎด้วยการจัดงานเลี้ยงรอบกองไฟในป่าแทน", "ex2_en": "With its radical minimalist aesthetics and sustainable bamboo casing, the new smartphone completely <span class=\"hl-teal\">broke the mold</span> in consumer hardware design.", "ex2_hl": "broke the mold", "ex2_th": "ด้วยรูปลักษณ์มินิมอลที่แปลกใหม่และตัวเครื่องที่ทำจากไม้ไผ่เพื่อความยั่งยืน สมาร์ตโฟนรุ่นใหม่นี้จึงฉีกกรอบเดิมๆ ของการออกแบบอุปกรณ์ฮาร์ดแวร์เพื่อผู้บริโภคได้อย่างสิ้นเชิง", "slot_num": 279, "sheet_no": 3, "first_letter": "B"}, {"id": 244, "orig_slot": "#280", "idiom": "Burn the candle at both ends", "meaning": "Work too hard for too long.", "thai_idiom": "โหมงานหนักจนสายตัวแทบขาด / ตรากตรำทำงานจนร่างพัง", "thai_meaning": "ตื่นเช้าเข้านอนดึกเพื่อทำงานหรือใช้ชีวิตอย่างหนักหน่วงติดต่อกัน จนแทบไม่มีเวลาพักผ่อนและส่งผลเสียต่อสุขภาพ", "ex1_en": "Preparing for medical finals while working a night shift means Rachel has been <span class=\"hl-teal\">burning the candle at both ends</span> all month.", "ex1_hl": "burning the candle at both ends", "ex1_th": "การต้องอ่านหนังสือเตรียมสอบแพทย์ปลายภาคควบคู่ไปกับการเข้าเวรกะดึก ทำให้ราเชลต้องโหมงานหนักจนแทบไม่ได้หลับได้นอนตลอดทั้งเดือน", "ex2_en": "Human resources intervened after realizing junior associates were routinely <span class=\"hl-teal\">burning the candle at both ends</span> to fulfill unrealistic billable hours.", "ex2_hl": "burning the candle at both ends", "ex2_th": "ฝ่ายทรัพยากรบุคคลต้องเข้ามาแทรกแซง หลังจากพบว่าพนักงานระดับปฏิบัติการมักจะตรากตรำทำงานหนักหามรุ่งหามค่ำเป็นประจำเพื่อให้ได้ชั่วโมงการทำงานที่เรียกเก็บเงินได้ตามเป้าที่ไม่สมเหตุสมผล", "slot_num": 280, "sheet_no": 3, "first_letter": "B"}, {"id": 245, "orig_slot": "#283", "idiom": "Don't put the cart before the horse", "meaning": "Do things in the correct order.", "thai_idiom": "อย่าเพิ่งข้ามขั้นตอน / อย่าเอารถไปเทียมไว้ข้างหน้าม้า", "thai_meaning": "อย่าทำสิ่งต่างๆ สลับลำดับขั้นตอน ควรทำสิ่งที่สำคัญหรือจำเป็นก่อนตามลำดับที่ถูกต้อง", "ex1_en": "You haven't even received your university acceptance letter yet, so buying campus dorm furniture is <span class=\"hl-teal\">putting the cart before the horse</span>.", "ex1_hl": "putting the cart before the horse", "ex1_th": "เธอยังไม่ได้รับจดหมายตอบรับเข้ามหาวิทยาลัยเลยนะ ดังนั้นการไปซื้อเฟอร์นิเจอร์เข้าหอพักตอนนี้จึงเป็นการข้ามขั้นตอนไปหน่อย", "ex2_en": "In product development, designing a marketing blitz before completing software beta testing is clearly <span class=\"hl-teal\">putting the cart before the horse</span>.", "ex2_hl": "putting the cart before the horse", "ex2_th": "ในการพัฒนาผลิตภัณฑ์ การวางแผนโปรโมตแคมเปญการตลาดขนานใหญ่ก่อนที่จะทดสอบซอฟต์แวร์เวอร์ชันเบตาให้เสร็จสิ้น ถือเป็นการทำผิดลำดับขั้นตอนอย่างเห็นได้ชัด", "slot_num": 283, "sheet_no": 3, "first_letter": "D"}, {"id": 246, "orig_slot": "#284", "idiom": "Down in the dumps", "meaning": "Feeling sad.", "thai_idiom": "ซึมเศร้า / จิตใจหดหู่ / อารมณ์ดิ่ง", "thai_meaning": "รู้สึกเศร้าสร้อย หม่นหมอง หรือหดหู่ใจ", "ex1_en": "After his basketball team lost the championship game in the final seconds, Leo was visibly <span class=\"hl-teal\">down in the dumps</span> for days.", "ex1_hl": "down in the dumps", "ex1_th": "หลังจากทีมบาสเกตบอลของเขาแพ้ในนัดชิงชนะเลิศช่วงวินาทีสุดท้าย ลีโอก็มีอาการซึมเศร้าและจิตใจหดหู่อย่างเห็นได้ชัดไปหลายวัน", "ex2_en": "The quarterly staff wellness survey revealed that many remote employees felt isolated and <span class=\"hl-teal\">down in the dumps</span> due to protracted social distancing.", "ex2_hl": "down in the dumps", "ex2_th": "ผลสำรวจสุขภาวะพนักงานประจำไตรมาสระบุว่า พนักงานที่ทำงานทางไกลจำนวนมากรู้สึกโดดเดี่ยวและมีอารมณ์ดิ่งหดหู่ เนื่องจากการเว้นระยะห่างทางสังคมที่ยาวนาน", "slot_num": 284, "sheet_no": 3, "first_letter": "D"}, {"id": 247, "orig_slot": "#285", "idiom": "Every dog has its day", "meaning": "Everyone will have success one day.", "thai_idiom": "วันพระไม่ได้มีหนเดียว / ทุกคนย่อมมีวันของตัวเอง", "thai_meaning": "ทุกคนไม่ว่าจะตกต่ำหรือล้มเหลวเพียงใด สักวันหนึ่งย่อมมีโอกาสประสบความสำเร็จหรือมีโชคดีเข้ามา", "ex1_en": "Don't be discouraged by today's audition rejection; keep practicing, because <span class=\"hl-teal\">every dog has its day</span>.", "ex1_hl": "every dog has its day", "ex1_th": "อย่าเพิ่งท้อแท้ที่ถูกปฏิเสธในการออดิชันวันนี้เลย หมั่นฝึกซ้อมต่อไป เพราะคนเราทุกคนย่อมมีวันของตัวเองเสมอ", "ex2_en": "After struggling for a decade in obscurity, the independent filmmaker won the festival grand prize, proving that <span class=\"hl-teal\">every dog has its day</span>.", "ex2_hl": "every dog has its day", "ex2_th": "หลังจากดิ้นรนสร้างภาพยนตร์อยู่นอกสายตามานานนับทศวรรษ ผู้กำกับหนังอิสระรายนี้ก็คว้ารางวัลชนะเลิศในเทศกาลภาพยนตร์มาครองได้สำเร็จ เป็นเครื่องพิสูจน์ว่าทุกคนย่อมมีวันของตัวเองในที่สุด", "slot_num": 285, "sheet_no": 3, "first_letter": "E"}, {"id": 248, "orig_slot": "#286", "idiom": "Go the whole nine yards", "meaning": "Do everything possible.", "thai_idiom": "จัดเต็มทุกรูปแบบ / ทุ่มเททำให้สุดตัว", "thai_meaning": "ทุ่มเททำทุกสิ่งทุกอย่างอย่างเต็มที่โดยไม่มีกั๊ก จัดเต็มแบบครบถ้วนสมบูรณ์", "ex1_en": "For his daughter's graduation party, dad <span class=\"hl-teal\">went the whole nine yards</span> with live musicians, fireworks, and a custom ice sculpture.", "ex1_hl": "went the whole nine yards", "ex1_th": "สำหรับงานเลี้ยงฉลองเรียนจบของลูกสาว คุณพ่อจัดเต็มให้ทุกรูปแบบ ทั้งดนตรีสด พลุดอกไม้ไฟ และประติมากรรมน้ำแข็งแกะสลักสั่งทำพิเศษ", "ex2_en": "To secure the defense contract, the engineering consortium decided to <span class=\"hl-teal\">go the whole nine yards</span> by providing complimentary maintenance training and extended warranty packages.", "ex2_hl": "go the whole nine yards", "ex2_th": "เพื่อคว้าสัญญาจ้างโครงการกลาโหม กลุ่มบริษัทวิศวกรรมจึงตัดสินใจทุ่มข้อเสนอแบบจัดเต็มทุกด้าน ด้วยการแถมการฝึกอบรมการซ่อมบำรุงฟรีและแพ็กเกจขยายระยะเวลารับประกัน", "slot_num": 286, "sheet_no": 3, "first_letter": "G"}, {"id": 249, "orig_slot": "#288", "idiom": "Honest to goodness", "meaning": "Used to show something is true.", "thai_idiom": "จริงๆ นะ / สาบานได้เลย / จากใจจริง", "thai_meaning": "คำยืนยันอย่างจริงใจและหนักแน่นว่าสิ่งที่พูดนั้นเป็นเรื่องจริงแท้แน่นอน ไม่ได้โกหกหรือแต่งเติม", "ex1_en": "I promise you, <span class=\"hl-teal\">honest to goodness</span>, I left my car keys right here on the kitchen counter this morning.", "ex1_hl": "honest to goodness", "ex1_th": "ฉันสัญญากับเธอได้เลย สาบานได้จริงๆ ว่าเมื่อเช้าฉันวางกุญแจรถไว้ตรงเคาน์เตอร์ครัวนี้แน่นอน", "ex2_en": "The regional director assured stakeholders that the reported quarterly recovery was an <span class=\"hl-teal\">honest to goodness</span> turnaround, not an artifact of creative accounting.", "ex2_hl": "honest to goodness", "ex2_th": "ผู้อำนวยการระดับภูมิภาคให้ความมั่นใจแก่ผู้มีส่วนได้ส่วนเสียว่า การฟื้นตัวในไตรมาสนี้ที่รายงานไปนั้นเป็นการพลิกฟื้นธุรกิจขึ้นมาจริงๆ จากใจจริง ไม่ใช่ผลลัพธ์จากการตกแต่งบัญชีแต่อย่างใด", "slot_num": 288, "sheet_no": 3, "first_letter": "H"}, {"id": 250, "orig_slot": "#293", "idiom": "Make hay while the sun shines", "meaning": "Take advantage of a good time.", "thai_idiom": "น้ำขึ้นให้รีบตัก / ฉวยโอกาสตอนที่สถานการณ์เป็นใจ", "thai_meaning": "รีบคว้าโอกาสหรือทำประโยชน์ให้ได้มากที่สุดในขณะที่สภาวะหรือโอกาสยังเอื้ออำนวย", "ex1_en": "The sunny weather will only last until Friday, so let's <span class=\"hl-teal\">make hay while the sun shines</span> and paint the garden fence today.", "ex1_hl": "make hay while the sun shines", "ex1_th": "แดดดีๆ แบบนี้จะมีถึงแค่วันศุกร์เท่านั้นนะ ดังนั้นเราต้องรีบฉวยโอกาสตอนที่สภาพอากาศเป็นใจ ทาสีรั้วสวนให้เสร็จตั้งแต่วันนี้เลย", "ex2_en": "With international commodity prices hitting a cyclical peak, mining conglomerates rushed to <span class=\"hl-teal\">make hay while the sun shines</span> by ramping up extraction capacity.", "ex2_hl": "make hay while the sun shines", "ex2_th": "เมื่อราคาสินค้าโภคภัณฑ์ในตลาดโลกพุ่งแตะจุดสูงสุดตามวัฏจักร กลุ่มบริษัทยักษ์ใหญ่ด้านเหมืองแร่จึงรีบฉวยโอกาสทองในจังหวะนี้ด้วยการเร่งกำลังการขุดเจาะอย่างเต็มพิกัด", "slot_num": 293, "sheet_no": 3, "first_letter": "M"}, {"id": 251, "orig_slot": "#294", "idiom": "No use crying over spilt milk", "meaning": "Don't worry about the past.", "thai_idiom": "สายน้ำไม่ไหลย้อนกลับ / มัวเสียใจกับสิ่งที่ผ่านไปแล้วก็ไม่มีประโยชน์", "thai_meaning": "ไม่มีประโยชน์ที่จะมานั่งเสียใจหรือฟูมฟายกับความผิดพลาดในอดีตที่ผ่านพ้นไปแล้วและไม่สามารถแก้ไขได้", "ex1_en": "I accidentally dropped and cracked my ceramic mug, but there's <span class=\"hl-teal\">no use crying over spilt milk</span>, so I'll just sweep up the pieces.", "ex1_hl": "no use crying over spilt milk", "ex1_th": "ฉันเผลอทำแก้วเซรามิกหล่นแตก แต่มัวมานั่งเสียดายกับสิ่งที่ผ่านไปแล้วก็ไม่มีประโยชน์ ฉันเลยกวาดเศษแก้วทิ้งดีกว่า", "ex2_en": "After the commercial product launch fell short of sales targets, the marketing team realized there was <span class=\"hl-teal\">no use crying over spilt milk</span> and pivoted to customer retention strategies.", "ex2_hl": "no use crying over spilt milk", "ex2_th": "หลังจากการเปิดตัวสินค้าในเชิงพาณิชย์ทำยอดขายไม่เข้าเป้า ทีมการตลาดก็ตระหนักว่าการมัวจมอยู่กับความผิดพลาดที่ผ่านมานั้นไร้ประโยชน์ และได้เปลี่ยนทิศทางไปเน้นกลยุทธ์รักษาฐานลูกค้าแทน", "slot_num": 294, "sheet_no": 3, "first_letter": "N"}, {"id": 252, "orig_slot": "#295", "idiom": "Off the hook", "meaning": "No longer in trouble.", "thai_idiom": "รอดพ้นจากปัญหา / พ้นผิด / หลุดพ้นจากข้อผูกมัด", "thai_meaning": "พ้นจากข้อกล่าวหา พ้นจากความรับผิดชอบอันยุ่งยาก หรือรอดพ้นจากสถานการณ์ลำบากมาได้", "ex1_en": "Since my sister offered to wash the dinner dishes tonight, I am officially <span class=\"hl-teal\">off the hook</span>.", "ex1_hl": "off the hook", "ex1_th": "เนื่องจากพี่สาวอาสาล้างจานมื้อเย็นให้ในคืนนี้ ฉันก็เลยรอดตัว พ้นจากหน้าที่ไปโดยปริยาย", "ex2_en": "When forensic evidence proved the signature on the fraudulent check was forged, the accountant was completely let <span class=\"hl-teal\">off the hook</span>.", "ex2_hl": "off the hook", "ex2_th": "เมื่อหลักฐานทางนิติวิทยาศาสตร์พิสูจน์ได้ว่าลายเซ็นบนเช็คปลอมนั้นถูกลอกเลียนแบบ นักบัญชีรายนั้นจึงพ้นจากข้อกล่าวหาและความผิดทั้งหมดโดยสิ้นเชิง", "slot_num": 295, "sheet_no": 3, "first_letter": "O"}, {"id": 253, "orig_slot": "#300", "idiom": "You can lead a horse to water, but you can't make him drink", "meaning": "You can't force someone to do something.", "thai_idiom": "จูงม้าไปกินน้ำได้ แต่บังคับให้มันดื่มไม่ได้ / บังคับใจใครไม่ได้", "thai_meaning": "เราสามารถหยิบยื่นโอกาสหรือแนะนำสิ่งดีๆ ให้ผู้อื่นได้ แต่ไม่อาจบังคับให้เขาทำตามได้หากเขาไม่ต้องการ", "ex1_en": "I bought my brother a gym membership and meal prep containers, but <span class=\"hl-teal\">you can lead a horse to water, but you can't make him drink</span>.", "ex1_hl": "you can lead a horse to water, but you can't make him drink", "ex1_th": "ฉันซื้อแพ็กเกจฟิตเนสพร้อมกล่องเตรียมอาหารคลีนให้น้องชายแล้ว แต่ก็นะ บังคับใจใครไม่ได้ถ้าเขาไม่อยากทำเอง", "ex2_en": "Our management offered fully funded certification courses to the sales team, yet very few enrolled—proving once again that <span class=\"hl-teal\">you can lead a horse to water, but you can't make him drink</span>.", "ex2_hl": "you can lead a horse to water, but you can't make him drink", "ex2_th": "ฝ่ายบริหารออกทุนเรียนคอร์สอบรมใบรับรองวิชาชีพให้ทีมเซลส์ฟรีทั้งหมด แต่กลับมีคนลงทะเบียนน้อยมาก ซึ่งตอกย้ำอีกครั้งว่าเราหยิบยื่นโอกาสให้ได้แต่บังคับให้ใครคว้าไว้ไม่ได้", "slot_num": 300, "sheet_no": 3, "first_letter": "Y"}, {"id": 254, "orig_slot": "#301", "idiom": "A bad egg", "meaning": "A dishonest or untrustworthy person.", "thai_idiom": "คนชั่ว / คนพาล / คนไม่เอาถ่าน", "thai_meaning": "คนที่ไม่น่าไว้วางใจ คนไม่ซื่อสัตย์ หรือคนที่สร้างแต่ความเดือดร้อนให้คนอื่น", "ex1_en": "Stay away from Marcus; everyone in the neighborhood knows he's <span class=\"hl-teal\">a bad egg</span> who borrows money and never pays it back.", "ex1_hl": "a bad egg", "ex1_th": "อย่าไปยุ่งกับมาร์คัสเลย คนแถวบ้านเขารู้กันหมดว่าหมอนั่นเป็นคนไม่น่าคบ ยืมเงินใครไปก็ไม่เคยคืนสักบาท", "ex2_en": "Internal audit discovered that the rogue trader was <span class=\"hl-teal\">a bad egg</span> who had falsified wire transfers for months before being caught.", "ex2_hl": "a bad egg", "ex2_th": "ฝ่ายตรวจสอบภายในตรวจพบว่าเทรดเดอร์นอกแถวรายนี้เป็นคนทุจริตที่แอบปลอมแปลงเอกสารโอนเงินมาหลายเดือนก่อนจะถูกจับได้", "slot_num": 301, "sheet_no": 4, "first_letter": "A"}, {"id": 255, "orig_slot": "#302", "idiom": "A hard pill to swallow", "meaning": "Something difficult to accept.", "thai_idiom": "กลืนไม่เข้าคายไม่ออก / ความจริงอันขมขื่นที่จำต้องยอมรับ", "thai_meaning": "ความจริงหรือสถานการณ์ที่ยากจะยอมรับหรือทำใจได้", "ex1_en": "Losing the championship after leading all season was <span class=\"hl-teal\">a hard pill to swallow</span> for our local basketball team.", "ex1_hl": "a hard pill to swallow", "ex1_th": "การพ่ายแพ้ในนัดชิงชนะเลิศทั้งที่นำมาตลอดทั้งฤดูกาลเป็นเรื่องที่ยากจะทำใจสำหรับทีมบาสเกตบอลท้องถิ่นของเรา", "ex2_en": "The board's decision to downsize 15% of the workforce was <span class=\"hl-teal\">a hard pill to swallow</span> for the entire engineering department.", "ex2_hl": "a hard pill to swallow", "ex2_th": "มติของคณะกรรมการบริหารที่สั่งปลดพนักงาน 15% นับเป็นความจริงอันขมขื่นที่แผนกวิศวกรรมทั้งหมดจำต้องยอมรับ", "slot_num": 302, "sheet_no": 4, "first_letter": "A"}, {"id": 256, "orig_slot": "#303", "idiom": "Add fuel to the flames", "meaning": "Make a bad situation worse.", "thai_idiom": "ราดน้ำมันบนกองไฟ", "thai_meaning": "ทำหรือพูดสิ่งใดที่ยิ่งทำให้สถานการณ์ที่ตึงเครียดหรือแย่อยู่แล้วทวีความรุนแรงยิ่งขึ้น", "ex1_en": "Bringing up his past speeding tickets during an argument will only <span class=\"hl-teal\">add fuel to the flames</span>.", "ex1_hl": "add fuel to the flames", "ex1_th": "การขุดเรื่องใบสั่งขับรถเร็วในอดีตขึ้นมาตอนกำลังทะเลาะกันมีแต่จะยิ่งราดน้ำมันบนกองไฟ", "ex2_en": "The CEO's defensive press release only served to <span class=\"hl-teal\">add fuel to the flames</span> following the environmental scandal.", "ex2_hl": "add fuel to the flames", "ex2_th": "แถลงการณ์แก้ต่างของซีอีโอมีแต่จะยิ่งราดน้ำมันบนกองไฟหลังเกิดกรณีอื้อฉาวด้านสิ่งแวดล้อม", "slot_num": 303, "sheet_no": 4, "first_letter": "A"}, {"id": 257, "orig_slot": "#304", "idiom": "At the end of the day", "meaning": "In the final analysis.", "thai_idiom": "ท้ายที่สุดแล้ว / สรุปแล้ว", "thai_meaning": "เมื่อพิจารณาทุกสิ่งทุกอย่างรอบด้านแล้ว สิ่งที่สำคัญที่สุดจริงๆ คืออะไร", "ex1_en": "We argued for hours about which restaurant to pick, but <span class=\"hl-teal\">at the end of the day</span>, we were just happy to spend time together.", "ex1_hl": "at the end of the day", "ex1_th": "พวกเราเถียงกันตั้งนานว่าจะเลือกร้านอาหารไหนดี แต่ท้ายที่สุดแล้ว แค่ได้ใช้เวลาร่วมกันพวกเราก็มีความสุขแล้ว", "ex2_en": "Regardless of market fluctuations, <span class=\"hl-teal\">at the end of the day</span>, our primary duty is to deliver long-term value to shareholders.", "ex2_hl": "at the end of the day", "ex2_th": "ไม่ว่าสภาวะตลาดจะผันผวนเพียงใด แต่ท้ายที่สุดแล้ว หน้าที่หลักของเราคือการสร้างมูลค่าระยะยาวให้แก่ผู้ถือหุ้น", "slot_num": 304, "sheet_no": 4, "first_letter": "A"}, {"id": 258, "orig_slot": "#306", "idiom": "Beat the rush", "meaning": "Do something before it gets busy.", "thai_idiom": "ไปก่อนคนแน่น / ชิงไปก่อนช่วงชุลมุน", "thai_meaning": "ทำกิจกรรมหรือเดินทางก่อนเวลา เพื่อหลีกเลี่ยงฝูงชน ความแออัด หรือการจราจรติดขัด", "ex1_en": "Let's leave for the farmers market at 7 a.m. so we can <span class=\"hl-teal\">beat the rush</span> and get the freshest produce.", "ex1_hl": "beat the rush", "ex1_th": "ออกจากบ้านไปตลาดเช้าตอนเจ็ดโมงกันเถอะ จะได้ไปก่อนคนแน่นแล้วได้เลือกผักผลไม้ที่สดที่สุด", "ex2_en": "Commuters are advised to take the early morning express train to <span class=\"hl-teal\">beat the rush</span> during downtown transit maintenance.", "ex2_hl": "beat the rush", "ex2_th": "ขอแนะนำให้ผู้สัญจรใช้บริการรถไฟด่วนรอบเช้าตรู่เพื่อชิงเดินทางก่อนช่วงเวลาเร่งด่วนระหว่างการซ่อมบำรุงเส้นทางใจกลางเมือง", "slot_num": 306, "sheet_no": 4, "first_letter": "B"}, {"id": 259, "orig_slot": "#307", "idiom": "Bend over backwards", "meaning": "Try very hard to help someone.", "thai_idiom": "ทุ่มเทสุดตัว / พยายามช่วยเหลืออย่างสุดความสามารถ", "thai_meaning": "พยายามทำทุกวิถีทางหรือยอมลำบากเพื่อช่วยเหลือหรือเอาใจผู้อื่น", "ex1_en": "Aunt Sarah <span class=\"hl-teal\">bent over backwards</span> to make sure all of us had comfortable bedrooms during our family reunion.", "ex1_hl": "bent over backwards", "ex1_th": "คุณป้าซาร่าห์ทุ่มเทเต็มที่เพื่อดูแลให้พวกเราทุกคนมีห้องนอนที่สะดวกสบายในงานรวมญาติ", "ex2_en": "Our client service team <span class=\"hl-teal\">bent over backwards</span> to expedite customs clearance before the trade embargo deadline.", "ex2_hl": "bent over backwards", "ex2_th": "ทีมบริการลูกค้าของเราพยายามช่วยเหลืออย่างสุดความสามารถเพื่อเร่งพิธีการศุลกากรให้ทันก่อนกำหนดเส้นตายการคว่ำบาตรทางการค้า", "slot_num": 307, "sheet_no": 4, "first_letter": "B"}, {"id": 260, "orig_slot": "#309", "idiom": "Call it off", "meaning": "Cancel a plan or activity.", "thai_idiom": "ยกเลิก / ล้มเลิก", "thai_meaning": "ตัดสินใจยกเลิกแผนการ ข้อตกลง หรือกิจกรรมที่กำหนดไว้ล่วงหน้า", "ex1_en": "Because thunder and heavy rain started around noon, we decided to <span class=\"hl-teal\">call it off</span> and reschedule our beach picnic.", "ex1_hl": "call it off", "ex1_th": "เนื่องจากฟ้าร้องและฝนตกหนักช่วงเที่ยง พวกเราจึงตัดสินใจยกเลิกแล้วนัดวันไปปิกนิกริมหาดกันใหม่", "ex2_en": "Both aerospace companies agreed to <span class=\"hl-teal\">call it off</span> when regulatory antitrust hurdles proved insurmountable.", "ex2_hl": "call it off", "ex2_th": "บริษัทการบินและอวกาศทั้งสองแห่งตกลงที่จะล้มเลิกดีลนี้ เมื่อพบว่าอุปสรรคทางกฎหมายป้องกันการผูกขาดนั้นยากจะผ่านพ้นไปได้", "slot_num": 309, "sheet_no": 4, "first_letter": "C"}, {"id": 261, "orig_slot": "#310", "idiom": "Calm before the storm", "meaning": "A quiet time before something exciting or dangerous.", "thai_idiom": "ความเงียบสงบก่อนพายุจะมา / คลื่นลมสงบก่อนมรสุม", "thai_meaning": "ช่วงเวลาที่ดูสงบนิ่งเป็นปกติ ก่อนที่จะเกิดเหตุการณ์วุ่นวาย ความขัดแย้ง หรือวิกฤตครั้งใหญ่", "ex1_en": "The house is suspiciously quiet right now, but it's just the <span class=\"hl-teal\">calm before the storm</span> before the twins wake up from their nap.", "ex1_hl": "calm before the storm", "ex1_th": "ตอนนี้บ้านเงียบจนน่าสงสัย แต่มันก็แค่ความเงียบสงบก่อนพายุจะเข้า ก่อนที่ฝาแฝดจะตื่นจากการนอนกลางวันเท่านั้นแหละ", "ex2_en": "Analysts warned that today's steady stock indices represent the <span class=\"hl-teal\">calm before the storm</span> ahead of the Federal Reserve's rate announcement.", "ex2_hl": "calm before the storm", "ex2_th": "เหล่านักวิเคราะห์เตือนว่าดัชนีหุ้นที่นิ่งในวันนี้เปรียบเสมือนความเงียบสงบก่อนพายุจะมา ก่อนที่ธนาคารกลางสหรัฐฯ จะประกาศอัตราดอกเบี้ย", "slot_num": 310, "sheet_no": 4, "first_letter": "C"}, {"id": 262, "orig_slot": "#311", "idiom": "Cast a long shadow", "meaning": "Have a strong influence.", "thai_idiom": "ส่งอิทธิพลครอบงำยาวนาน / ทิ้งรอยประทับอันยิ่งใหญ่", "thai_meaning": "ส่งอิทธิพลหรือมีผลกระทบอย่างลึกซึ้งและยาวนานต่อบุคคล วงการ หรือยุคสมัยต่อมา", "ex1_en": "Even years after moving out, Grandpa's strict kitchen rules still <span class=\"hl-teal\">cast a long shadow</span> over how Mom cooks dinner.", "ex1_hl": "cast a long shadow", "ex1_th": "แม้จะย้ายออกมาหลายปีแล้ว แต่กฎเกณฑ์ในครัวอันเข้มงวดของคุณตายังคงส่งอิทธิพลอย่างมากต่อวิธีการทำกับข้าวของแม่", "ex2_en": "The founding dean's pioneering research continues to <span class=\"hl-teal\">cast a long shadow</span> over the university's genetics department.", "ex2_hl": "cast a long shadow", "ex2_th": "งานวิจัยบุกเบิกของคณบดีผู้ก่อตั้งยังคงส่งอิทธิพลและทิ้งรอยประทับอันยิ่งใหญ่ต่อภาควิชาพันธุศาสตร์ของมหาวิทยาลัยมาจนถึงปัจจุบัน", "slot_num": 311, "sheet_no": 4, "first_letter": "C"}, {"id": 263, "orig_slot": "#312", "idiom": "Catch someone's eye", "meaning": "Attract someone's attention.", "thai_idiom": "สะดุดตา / ดึงดูดสายตา", "thai_meaning": "ดึงดูดความสนใจหรือเตะตาใครบางคน", "ex1_en": "While browsing through the flea market, a vintage turquoise watch immediately <span class=\"hl-teal\">caught my eye</span>.", "ex1_hl": "caught my eye", "ex1_th": "ตอนที่กำลังเดินดูของในตลาดนัดของเก่า นาฬิกาข้อมือสีเทอร์ควอยซ์สไตล์วินเทจเรือนหนึ่งก็สะดุดตาฉันทันที", "ex2_en": "Her innovative packaging design <span class=\"hl-teal\">caught the eye</span> of several venture capitalists at the annual startup expo.", "ex2_hl": "caught the eye", "ex2_th": "การออกแบบบรรจุภัณฑ์อันแปลกใหม่ของเธอเตะตานักลงทุนร่วมทุนหลายรายในงานเอ็กซ์โปสตาร์ทอัปประจำปี", "slot_num": 312, "sheet_no": 4, "first_letter": "C"}, {"id": 264, "orig_slot": "#314", "idiom": "Classes don't make someone", "meaning": "Character is more important than status.", "thai_idiom": "ชาติตระกูลไม่ได้วัดคุณค่าคน / ชนชั้นไม่ได้สร้างความเป็นคน", "thai_meaning": "ฐานะ ชนชั้นทางสังคม หรือการศึกษาไม่ได้เป็นตัวกำหนดความดีงามหรือคุณค่าที่แท้จริงของบุคคล แต่เป็นอุปนิสัยและการกระทำต่างหาก", "ex1_en": "He may not have grown up in a wealthy neighborhood, but his kindness proves that <span class=\"hl-teal\">classes don't make someone</span>.", "ex1_hl": "classes don't make someone", "ex1_th": "เขาอาจไม่ได้เติบโตมาในย่านคนมีเงิน แต่น้ำใจของเขาก็พิสูจน์ให้เห็นว่าชนชั้นไม่ได้เป็นตัวตัดสินคุณค่าของคน", "ex2_en": "In her commencement speech, the magistrate reminded graduates that titles and socio-economic <span class=\"hl-teal\">classes don't make someone</span> honorable—integrity does.", "ex2_hl": "classes don't make someone", "ex2_th": "ในสุนทรพจน์วันรับปริญญา ผู้พิพากษาได้เตือนใจบัณฑิตว่าตำแหน่งและชนชั้นทางสังคมไม่ได้สร้างคนให้ทรงเกียรติ แต่เป็นความซื่อสัตย์สุจริตต่างหาก", "slot_num": 314, "sheet_no": 4, "first_letter": "C"}, {"id": 265, "orig_slot": "#315", "idiom": "Close but no cigar", "meaning": "Almost succeed but not quite.", "thai_idiom": "เกือบถูกแต่ยังไม่ใช่ / เฉียดฉิวแต่พลาดไปนิดเดียว", "thai_meaning": "เกือบจะทำสำเร็จหรือได้ชัยชนะแล้ว แต่ก็ยังขาดไปอีกนิดเดียว", "ex1_en": "I guessed 498 jellybeans in the jar when the real count was 500—<span class=\"hl-teal\">close but no cigar</span>!", "ex1_hl": "close but no cigar", "ex1_th": "ฉันทายว่ามีเยลลี่บีนในโหล 498 เม็ด จากจำนวนจริง 500 เม็ด เกือบถูกแล้วแต่ยังพลาดไปนิดเดียว!", "ex2_en": "The startup secured $4.8 million out of their $5 million seed round target, leaving the founders with a feeling of <span class=\"hl-teal\">close but no cigar</span>.", "ex2_hl": "close but no cigar", "ex2_th": "สตาร์ทอัประดมทุนรอบ Seed ได้ 4.8 ล้านดอลลาร์จากเป้า 5 ล้านดอลลาร์ ทำให้เหล่าผู้ก่อตั้งรู้สึกเสียดายที่เกือบจะถึงเป้าแล้วแต่ยังขาดไปหน่อย", "slot_num": 315, "sheet_no": 4, "first_letter": "C"}, {"id": 266, "orig_slot": "#316", "idiom": "Come out of the blue", "meaning": "Happen unexpectedly.", "thai_idiom": "โผล่มาแบบไม่ทันตั้งตัว / เกิดขึ้นอย่างกะทันหัน", "thai_meaning": "เกิดขึ้นโดยไม่คาดคิดมาก่อน ไม่มีสัญญาณเตือนล่วงหน้า", "ex1_en": "An invitation to my high school best friend's wedding <span class=\"hl-teal\">came out of the blue</span> after seven years of silence.", "ex1_hl": "came out of the blue", "ex1_th": "การ์ดเชิญไปงานแต่งของเพื่อนสนิทสมัยมัธยมส่งมาแบบไม่ทันตั้งตัว หลังจากที่ไม่ได้ติดต่อกันเลยถึงเจ็ดปี", "ex2_en": "The abrupt resignation of the chief financial officer <span class=\"hl-teal\">came out of the blue</span>, catching equity research analysts completely off guard.", "ex2_hl": "came out of the blue", "ex2_th": "การลาออกอย่างกะทันหันของประธานเจ้าหน้าที่ฝ่ายการเงินเกิดขึ้นอย่างไม่มีปี่มีขลุ่ย ทำเอานักวิเคราะห์หลักทรัพย์ตั้งตัวไม่ติด", "slot_num": 316, "sheet_no": 4, "first_letter": "C"}, {"id": 267, "orig_slot": "#318", "idiom": "Deal with the devil", "meaning": "Do something very dangerous or unfair.", "thai_idiom": "ทำสัญญากับปีศาจ / ขายวิญญาณแลกผลประโยชน์", "thai_meaning": "ยอมแลกคุณธรรม เกียรติยศ หรือผลประโยชน์ระยะยาวเพื่อแลกกับผลประโยชน์ชั่วคราวที่เป็นอันตรายหรือผิดศีลธรรม", "ex1_en": "Borrowing cash from that loan shark felt like making a <span class=\"hl-teal\">deal with the devil</span> once the extortionate interest kicked in.", "ex1_hl": "deal with the devil", "ex1_th": "การไปกู้เงินจากแก๊งเงินกู้นอกระบบให้ความรู้สึกเหมือนทำสัญญากับปีศาจทันทีที่ดอกเบี้ยมหาโหดเริ่มทบยอด", "ex2_en": "Critics argued that accepting sponsorship from the tobacco conglomerate was a dangerous <span class=\"hl-teal\">deal with the devil</span> for the public health NGO.", "ex2_hl": "deal with the devil", "ex2_th": "เหล่านักวิจารณ์ชี้ว่าการรับเงินสนับสนุนจากกลุ่มทุนยาสูบถือเป็นการทำสัญญากับปีศาจที่สุ่มเสี่ยงอย่างยิ่งสำหรับองค์กรพัฒนาเอกชนด้านสาธารณสุข", "slot_num": 318, "sheet_no": 4, "first_letter": "D"}, {"id": 268, "orig_slot": "#319", "idiom": "Don't put words in my mouth", "meaning": "Don't say things for me.", "thai_idiom": "อย่ามายัดเยียดคำพูดให้ฉัน / อย่ามาโมเมว่าฉันพูด", "thai_meaning": "อย่าบิดเบือนหรืออ้างว่าฉันพูดในสิ่งที่ฉันไม่ได้พูดจริง", "ex1_en": "I only said I needed quiet time to study tonight, so please <span class=\"hl-teal\">don't put words in my mouth</span> by claiming I hate your roommates.", "ex1_hl": "don't put words in my mouth", "ex1_th": "ฉันแค่บอกว่าคืนนี้ต้องการความเงียบเพื่ออ่านหนังสือ เพราะฉะนั้นอย่ามายัดเยียดคำพูดใส่ปากฉันว่าฉันเกลียดรูมเมทเธอ", "ex2_en": "During the press conference, the senator cut in firmly: \"<span class=\"hl-teal\">Don't put words in my mouth</span>; I never endorsed deregulation without oversight.\"", "ex2_hl": "Don't put words in my mouth", "ex2_th": "ระหว่างการแถลงข่าว วุฒิสมาชิกได้ตัดบทอย่างเด็ดขาดว่า 'อย่ามาโมเมคำพูดแทนผม ผมไม่เคยสนับสนุนการผ่อนปรนกฎระเบียบโดยปราศจากการกำกับดูแล'", "slot_num": 319, "sheet_no": 4, "first_letter": "D"}, {"id": 269, "orig_slot": "#320", "idiom": "Double-edged sword", "meaning": "Something that has both good and bad effects.", "thai_idiom": "ดาบสองคม", "thai_meaning": "สิ่งที่มีทั้งคุณและโทษ มีทั้งข้อดีและผลเสียที่อาจย้อนกลับมาทำร้ายได้", "ex1_en": "Having a smartphone is a <span class=\"hl-teal\">double-edged sword</span>—it keeps you connected with friends, but it can ruin your focus on homework.", "ex1_hl": "double-edged sword", "ex1_th": "การมีสมาร์ตโฟนเปรียบเหมือนดาบสองคม เพราะช่วยให้ติดต่อเพื่อนๆ ได้ตลอดเวลา แต่ก็อาจทำลายสมาธิในการทำการบ้านได้เช่นกัน", "ex2_en": "Generative artificial intelligence is a <span class=\"hl-teal\">double-edged sword</span> that accelerates operational efficiency while introducing unprecedented cybersecurity vulnerabilities.", "ex2_hl": "double-edged sword", "ex2_th": "ปัญญาประดิษฐ์เชิงสร้างสรรค์เป็นดาบสองคมที่ช่วยเร่งประสิทธิภาพในการทำงาน แต่ขณะเดียวกันก็ก่อให้เกิดช่องโหว่ด้านความมั่นคงปลอดภัยไซเบอร์อย่างที่ไม่เคยมีมาก่อน", "slot_num": 320, "sheet_no": 4, "first_letter": "D"}, {"id": 270, "orig_slot": "#322", "idiom": "Face the truth", "meaning": "Accept what is true.", "thai_idiom": "ยอมรับความจริง / เผชิญหน้ากับความจริง", "thai_meaning": "ยอมรับความเป็นจริงแม้ว่ามันจะเจ็บปวดหรือไม่น่าอภิรมย์ แทนที่จะหลอกตัวเองหรือหลีกหนี", "ex1_en": "You have to <span class=\"hl-teal\">face the truth</span> that your old sedan has broken down for good and isn't worth fixing again.", "ex1_hl": "face the truth", "ex1_th": "เธอต้องยอมรับความจริงได้แล้วนะว่ารถเก๋งคันเก่าพังสนิทและไม่คุ้มที่จะเอาไปซ่อมอีกต่อไป", "ex2_en": "The leadership team must finally <span class=\"hl-teal\">face the truth</span> regarding dwindling retail foot traffic and pivot toward e-commerce channels.", "ex2_hl": "face the truth", "ex2_th": "ทีมผู้บริหารต้องยอมรับความจริงเรื่องจำนวนลูกค้าหน้าร้านที่ลดลงอย่างต่อเนื่องเสียที แล้วหันมามุ่งเน้นช่องทางอีคอมเมิร์ซอย่างจริงจัง", "slot_num": 322, "sheet_no": 4, "first_letter": "F"}, {"id": 271, "orig_slot": "#323", "idiom": "First things first", "meaning": "Do the most important things first.", "thai_idiom": "ทำสิ่งที่สำคัญที่สุดก่อน / เรียงลำดับความสำคัญก่อนหลัง", "thai_meaning": "ต้องจัดการเรื่องที่จำเป็นหรือเร่งด่วนที่สุดให้เสร็จสิ้นก่อนเริ่มทำสิ่งอื่น", "ex1_en": "I know you want to unpack your new video games, but <span class=\"hl-teal\">first things first</span>: finish your chores and walk the dog.", "ex1_hl": "first things first", "ex1_th": "รู้ว่าอยากรีบแกะแผ่นเกมใหม่เล่น แต่ทำสิ่งที่สำคัญก่อนเถอะ ทำงานบ้านให้เสร็จแล้วพาสุนัขไปเดินเล่นก่อน", "ex2_en": "Before we outline next quarter's marketing campaigns, <span class=\"hl-teal\">first things first</span>—we must stabilize server downtime and address existing user tickets.", "ex2_hl": "first things first", "ex2_th": "ก่อนที่เราจะวางโครงร่างแคมเปญการตลาดของไตรมาสหน้า ขอจัดการเรื่องสำคัญก่อนคือ เราต้องแก้ไขปัญหาระบบเซิร์ฟเวอร์ล่มและเคลียร์คำร้องของลูกค้าปัจจุบันให้เรียบร้อย", "slot_num": 323, "sheet_no": 4, "first_letter": "F"}, {"id": 272, "orig_slot": "#324", "idiom": "Get back on track", "meaning": "Return to the right path.", "thai_idiom": "กลับเข้ารูปเข้ารอย / กลับสู่เส้นทางที่ถูกต้อง", "thai_meaning": "กลับมาดำเนินไปตามทิศทาง แผนงาน หรือเป้าหมายที่ควรจะเป็นหลังจากที่ไขว้เขวหรือสะดุดไป", "ex1_en": "After skipping workouts during the holidays, Liam used meal plans and daily alarms to <span class=\"hl-teal\">get back on track</span>.", "ex1_hl": "get back on track", "ex1_th": "หลังจากโดดออกกำลังกายไปตลอดช่วงวันหยุด เลียมก็ใช้ตารางอาหารและการตั้งนาฬิกาปลุกทุกวันเพื่อกลับเข้ารูปเข้ารอยอีกครั้ง", "ex2_en": "The turnaround specialist implemented lean manufacturing protocols to help the struggling plant <span class=\"hl-teal\">get back on track</span> financially.", "ex2_hl": "get back on track", "ex2_th": "ผู้เชี่ยวชาญด้านการฟื้นฟูกิจการได้นำระบบการผลิตแบบลีนมาปรับใช้ เพื่อช่วยให้โรงงานที่กำลังประสบปัญหาพลิกฟื้นกลับมาสู่สถานะทางการเงินที่ดีได้อีกครั้ง", "slot_num": 324, "sheet_no": 4, "first_letter": "G"}, {"id": 273, "orig_slot": "#325", "idiom": "Get down to business", "meaning": "Start doing serious work.", "thai_idiom": "เริ่มเข้าเรื่อง / ลงมือทำงานจริงจัง", "thai_meaning": "หยุดคุยเล่นหรือหยุดเสียเวลา แล้วเริ่มทำงานหรือพูดคุยในประเด็นสำคัญอย่างจริงจัง", "ex1_en": "Enough small talk about yesterday's football game—let's <span class=\"hl-teal\">get down to business</span> and assemble this bookshelf before dinner.", "ex1_hl": "get down to business", "ex1_th": "เลิกคุยเล่นเรื่องผลบอลเมื่อวานได้แล้ว มาเริ่มลงมือประกอบชั้นหนังสือนี้ให้เสร็จก่อนมื้อเย็นกันดีกว่า", "ex2_en": "Once everyone reviewed the quarterly financial disclosures, the committee chair asked members to <span class=\"hl-teal\">get down to business</span> regarding budget reallocations.", "ex2_hl": "get down to business", "ex2_th": "เมื่อทุกคนทบทวนงบการเงินประจำไตรมาสเสร็จแล้ว ประธานคณะกรรมการก็ขอให้สมาชิกเข้าเรื่องเพื่อเริ่มพิจารณาการจัดสรรงบประมาณใหม่ทันที", "slot_num": 325, "sheet_no": 4, "first_letter": "G"}, {"id": 274, "orig_slot": "#326", "idiom": "Get over it", "meaning": "Stop being upset about something.", "thai_idiom": "ทำใจให้ได้ / ปล่อยวาง / ก้าวข้ามมันไป", "thai_meaning": "เลิกเศร้า เสียใจ หรือขุ่นเคืองกับเรื่องในอดีต แล้วเดินหน้าต่อไป", "ex1_en": "He didn't invite you to the bowling party, but you really need to <span class=\"hl-teal\">get over it</span> and stop obsessing over his social media.", "ex1_hl": "get over it", "ex1_th": "เขาไม่ได้ชวนเธอไปงานโบว์ลิ่ง แต่เธอต้องทำใจปล่อยวางให้ได้แล้วเลิกไปคอยส่องโซเชียลมีเดียของเขาเสียที", "ex2_en": "After their joint bid was rejected by the transport authority, the consortium partners had to <span class=\"hl-teal\">get over it</span> and focus on upcoming infrastructure tenders.", "ex2_hl": "get over it", "ex2_th": "หลังข้อเสนอร่วมถูกการรถไฟปฏิเสธ กลุ่มพันธมิตรทางธุรกิจจำต้องก้าวข้ามความผิดหวังแล้วหันไปมุ่งเน้นการประมูลโครงสร้างพื้นฐานรอบใหม่", "slot_num": 326, "sheet_no": 4, "first_letter": "G"}, {"id": 275, "orig_slot": "#327", "idiom": "Give it your best shot", "meaning": "Try your hardest.", "thai_idiom": "ทำให้สุดความสามารถ / สู้ให้สุดใจ", "thai_meaning": "พยายามทำอย่างเต็มที่และทุ่มเทสุดกำลังความสามารถเท่าที่จะทำได้", "ex1_en": "Even if you haven't baked sourdough before, just follow the recipe carefully and <span class=\"hl-teal\">give it your best shot</span>.", "ex1_hl": "give it your best shot", "ex1_th": "ถึงแม้เธอจะไม่เคยอบขนมปังซาวโดว์มาก่อน แค่ทำตามสูตรอย่างระมัดระวังแล้วลองทำให้สุดฝีมือดูเลย", "ex2_en": "The incubator mentor encouraged each founder to refine their financial pitch deck and <span class=\"hl-teal\">give it their best shot</span> in front of the seed investors.", "ex2_hl": "give it their best shot", "ex2_th": "ที่ปรึกษาโครงการบ่มเพาะธุรกิจสนับสนุนให้ผู้ก่อตั้งทุกคนปรับปรุงสไลด์นำเสนอทางการเงินให้เฉียบคม แล้วนำเสนออย่างสุดความสามารถต่อหน้านักลงทุนรอบ Seed", "slot_num": 327, "sheet_no": 4, "first_letter": "G"}, {"id": 276, "orig_slot": "#328", "idiom": "Give someone the benefit of the doubt", "meaning": "Trust someone even without complete proof.", "thai_idiom": "มองในแง่ดีไว้ก่อน / ให้โอกาสโดยถือว่าบริสุทธิ์ใจไว้ก่อน", "thai_meaning": "ยอมเชื่อหรือมองว่าอีกฝ่ายบริสุทธิ์ใจ แม้จะยังไม่มีหลักฐานแน่ชัดหรือไม่แน่ใจทั้งหมด", "ex1_en": "Tom showed up an hour late, but I <span class=\"hl-teal\">gave him the benefit of the doubt</span> because the subway lines were experiencing major power delays.", "ex1_hl": "gave him the benefit of the doubt", "ex1_th": "ทอมมาสายไปหนึ่งชั่วโมง แต่ฉันก็มองในแง่ดีไว้ก่อนเพราะรถไฟใต้ดินกำลังประสบปัญหาระบบไฟฟ้าขัดข้องอย่างหนัก", "ex2_en": "Until the formal audit uncovers clear evidence of malfeasance, the board voted to <span class=\"hl-teal\">give the regional director the benefit of the doubt</span>.", "ex2_hl": "give the regional director the benefit of the doubt", "ex2_th": "จนกว่าการตรวจสอบบัญชีอย่างเป็นทางการจะพบหลักฐานการทุจริตที่ชัดเจน คณะกรรมการจึงมีมติให้มองผู้อำนวยการระดับภูมิภาคในแง่ดีไว้ก่อน", "slot_num": 328, "sheet_no": 4, "first_letter": "G"}, {"id": 277, "orig_slot": "#330", "idiom": "Go from bad to worse", "meaning": "Experience increasing problems.", "thai_idiom": "ทรุดหนักลงไปอีก / เคราะห์ซ้ำกรรมซัด / จากแย่อยู่แล้วยิ่งแย่ลงไปอีก", "thai_meaning": "สถานการณ์ที่เลวร้ายอยู่แล้วกลับยิ่งทวีความรุนแรงหรือมีปัญหาหนักหนาสาหัสยิ่งขึ้น", "ex1_en": "Our camping weekend <span class=\"hl-teal\">went from bad to worse</span> when our tent tore open and raccoons carried off our breakfast food.", "ex1_hl": "went from bad to worse", "ex1_th": "ทริปตั้งแคมป์วันหยุดสุดสัปดาห์ของเราจากแย่อยู่แล้วยิ่งแย่ลงไปอีก เมื่อเต็นท์เกิดขาดแล้วยังมีแรคคูนมาขโมยเสบียงมื้อเช้าไปจนหมด", "ex2_en": "The airline's operating cash flow <span class=\"hl-teal\">went from bad to worse</span> after sudden fuel price surges collided with nationwide pilot strikes.", "ex2_hl": "went from bad to worse", "ex2_th": "กระแสเงินสดจากการดำเนินงานของสายการบินทรุดหนักลงไปอีก เมื่อราคาน้ำมันที่พุ่งสูงขึ้นอย่างกะทันหันประจวบเหมาะกับการประท้วงหยุดงานของนักบินทั่วประเทศ", "slot_num": 330, "sheet_no": 4, "first_letter": "G"}, {"id": 278, "orig_slot": "#331", "idiom": "Go off the deep end", "meaning": "Lose control of your behavior.", "thai_idiom": "สติแตก / ควบคุมอารมณ์ไม่อยู่ / วู่วามเตลิดเปิดเปิง", "thai_meaning": "สูญเสียการควบคุมอารมณ์หรือสติ กระทำสิ่งใดสิ่งหนึ่งอย่างบ้าคลั่ง หุนหันพลันแล่น หรือรุนแรงผิดปกติ", "ex1_en": "When he discovered someone had dented his new sports coupe, Dave completely <span class=\"hl-teal\">went off the deep end</span> and began screaming at parking attendants.", "ex1_hl": "went off the deep end", "ex1_th": "พอเดฟเห็นว่ามีคนทำรถสปอร์ตคันใหม่ของเขาเป็นรอยบุบ เขาก็สติแตกทันทีและเริ่มตะโกนด่าพนักงานรับจอดรถลั่นลานจอด", "ex2_en": "Corporate counsel warned the executive that publishing unverified accusations on social media would look like he had <span class=\"hl-teal\">gone off the deep end</span>.", "ex2_hl": "gone off the deep end", "ex2_th": "ที่ปรึกษากฎหมายของบริษัทเตือนผู้บริหารว่า การโพสต์ข้อกล่าวหาที่ยังไม่ได้รับการพิสูจน์ลงบนโซเชียลมีเดียจะทำให้ดูเหมือนว่าเขาสติแตกและคุมตัวเองไม่อยู่", "slot_num": 331, "sheet_no": 4, "first_letter": "G"}, {"id": 279, "orig_slot": "#333", "idiom": "Good things come to those who wait", "meaning": "Be patient; good things will happen.", "thai_idiom": "ช้าๆ ได้พร้าเล่มงาม / ความอดทนนำมาซึ่งความสำเร็จ", "thai_meaning": "หากมีความอดทนและรอคอยอย่างใจเย็น ผลลัพธ์ที่ดีและคุ้มค่าก็จะเกิดขึ้นในที่สุด", "ex1_en": "After waiting in line for three hours, we finally got front-row concert tickets—proof that <span class=\"hl-teal\">good things come to those who wait</span>!", "ex1_hl": "good things come to those who wait", "ex1_th": "หลังจากยืนต่อคิวตั้งสามชั่วโมง พวกเราก็ได้ตั๋วคอนเสิร์ตแถวหน้าสุดมาครอง สมกับคำที่ว่าช้าๆ ได้พร้าเล่มงามจริงๆ!", "ex2_en": "The portfolio manager assured jittery clients that holding steady during market corrections illustrates how <span class=\"hl-teal\">good things come to those who wait</span>.", "ex2_hl": "good things come to those who wait", "ex2_th": "ผู้จัดการพอร์ตการลงทุนสร้างความมั่นใจให้ลูกค้าที่กำลังตระหนกว่า การถือครองสินทรัพย์อย่างมั่นคงช่วงตลาดปรับฐานแสดงให้เห็นว่าความอดทนย่อมนำมาซึ่งผลตอบแทนที่คุ้มค่า", "slot_num": 333, "sheet_no": 4, "first_letter": "G"}, {"id": 280, "orig_slot": "#335", "idiom": "Head in the clouds", "meaning": "Daydreaming; not practical.", "thai_idiom": "เพ้อฝัน / ใจลอยไม่อยู่กับเนื้อกับตัว / ไม่อยู่กับความเป็นจริง", "thai_meaning": "มัวแต่ฝันกลางวัน คิดเพ้อเจ้อ หรือไม่อยู่บนพื้นฐานของความเป็นจริงที่ปฏิบัติได้", "ex1_en": "Stop having your <span class=\"hl-teal\">head in the clouds</span> about winning the lottery and start saving money from your part-time job.", "ex1_hl": "head in the clouds", "ex1_th": "เลิกเพ้อฝันกลางวันเรื่องถูกหวยรางวัลที่หนึ่งได้แล้ว แล้วหันมาเริ่มเก็บออมเงินจากงานพาร์ตไทม์จะดีกว่า", "ex2_en": "While the lead architect's conceptual designs were visually stunning, structural engineers argued he had his <span class=\"hl-teal\">head in the clouds</span> regarding real-world load limits.", "ex2_hl": "head in the clouds", "ex2_th": "แม้แนวคิดการออกแบบของสถาปนิกหลักจะสวยงามตระการตา แต่วิศวกรโครงสร้างกลับชี้ว่าเขามัวแต่เพ้อฝันโดยไม่ได้คำนึงถึงขีดจำกัดการรับน้ำหนักตามความเป็นจริง", "slot_num": 335, "sheet_no": 4, "first_letter": "H"}, {"id": 281, "orig_slot": "#337", "idiom": "Hope for the best", "meaning": "Be optimistic about the outcome.", "thai_idiom": "หวังว่าจะได้ผลดีที่สุด / ภาวนาให้ทุกอย่างราบรื่น", "thai_meaning": "มองในแง่ดีและคาดหวังผลลัพธ์ที่ดีที่สุด แม้สถานการณ์จะยังมีความไม่แน่นอน", "ex1_en": "We mailed the visa application yesterday with all the certified documents, so now we can only wait and <span class=\"hl-teal\">hope for the best</span>.", "ex1_hl": "hope for the best", "ex1_th": "พวกเราส่งเอกสารขอวีซ่าที่ผ่านการรับรองทั้งหมดไปเมื่อวานแล้ว ตอนนี้จึงทำได้แค่รอและภาวนาให้ผลออกมาดีที่สุด", "ex2_en": "Prudent financial institutions prepare for a severe recession while continuing to <span class=\"hl-teal\">hope for the best</span> amid fluctuating monetary policies.", "ex2_hl": "hope for the best", "ex2_th": "สถาบันการเงินที่รอบคอบจะเตรียมพร้อมรับมือกับภาวะเศรษฐกิจถดถอยรุนแรง ขณะเดียวกันก็ยังคงหวังผลลัพธ์ที่ดีที่สุดท่ามกลางนโยบายการเงินที่ผันผวน", "slot_num": 337, "sheet_no": 4, "first_letter": "H"}, {"id": 282, "orig_slot": "#339", "idiom": "In a blink of an eye", "meaning": "Very quickly.", "thai_idiom": "ในชั่วพริบตา / เร็วเหมือนกะพริบตา", "thai_meaning": "เกิดขึ้นอย่างรวดเร็วมากในชั่วขณะเดียว", "ex1_en": "I turned around to grab my wallet, and <span class=\"hl-teal\">in a blink of an eye</span>, my puppy snatched the sandwich right off the counter.", "ex1_hl": "in a blink of an eye", "ex1_th": "ฉันแค่หันหลังไปหยิบกระเป๋าสตางค์ เพียงชั่วพริบตาลูกหมาก็ฉกแซนด์วิชไปจากเคาน์เตอร์เรียบร้อยแล้ว", "ex2_en": "During flash crashes, algorithmic trading bots can wipe out hundreds of millions of dollars in market liquidity <span class=\"hl-teal\">in a blink of an eye</span>.", "ex2_hl": "in a blink of an eye", "ex2_th": "ในช่วงที่เกิดภาวะราคาดิ่งวูบ บอทเทรดอัลกอริทึมสามารถกวาดสภาพคล่องของตลาดหายไปหลายร้อยล้านดอลลาร์ได้ในชั่วพริบตาเดียว", "slot_num": 339, "sheet_no": 4, "first_letter": "I"}, {"id": 283, "orig_slot": "#340", "idiom": "In black and white", "meaning": "In writing; official.", "thai_idiom": "เป็นลายลักษณ์อักษร / ชัดเจนเป็นหลักฐาน", "thai_meaning": "มีบันทึกเป็นลายลักษณ์อักษรที่ชัดเจน เป็นทางการ ไม่สามารถบิดเบือนหรือปฏิเสธได้", "ex1_en": "I refused to pay the landlord the extra deposit until he put the agreed terms down <span class=\"hl-teal\">in black and white</span>.", "ex1_hl": "in black and white", "ex1_th": "ฉันปฏิเสธที่จะจ่ายเงินมัดจำเพิ่มให้เจ้าของห้อง จนกว่าเขาจะเขียนเงื่อนไขตามที่ตกลงกันไว้ลงเป็นลายลักษณ์อักษร", "ex2_en": "Before authorizing the acquisition, the board of directors demanded to review the non-compete clauses <span class=\"hl-teal\">in black and white</span>.", "ex2_hl": "in black and white", "ex2_th": "ก่อนจะอนุมัติการเข้าซื้อกิจการ คณะกรรมการบริหารเรียกร้องที่จะตรวจสอบข้อกำหนดห้ามการแข่งขันทางการค้าให้เห็นเป็นลายลักษณ์อักษรอย่างชัดเจน", "slot_num": 340, "sheet_no": 4, "first_letter": "I"}, {"id": 284, "orig_slot": "#342", "idiom": "It's not my cup of tea", "meaning": "It's not something I like.", "thai_idiom": "ไม่ใช่แนวของฉัน / ไม่ใช่สิ่งที่ฉันชอบหรือถนัด", "thai_meaning": "ไม่ใช่สิ่งที่ตนเองสนใจ ชอบ หรือพึงพอใจ", "ex1_en": "Thanks for inviting me to the heavy metal concert, but loud thrash music really <span class=\"hl-teal\">isn't my cup of tea</span>.", "ex1_hl": "isn't my cup of tea", "ex1_th": "ขอบคุณที่ชวนไปดูคอนเสิร์ตเฮฟวีเมทัลนะ แต่ดนตรีร็อกแธรชเสียงดังๆ มันไม่ใช่แนวของฉันจริงๆ", "ex2_en": "While quantitative macro trading appeals to many hedge fund managers, pure algorithmic scalping <span class=\"hl-teal\">is not my cup of tea</span>.", "ex2_hl": "is not my cup of tea", "ex2_th": "แม้การเทรดมหภาคเชิงปริมาณจะเป็นที่ดึงดูดใจของผู้จัดการกองทุนเฮดจ์ฟันด์หลายคน แต่การเก็งกำไรระยะสั้นด้วยอัลกอริทึมล้วนๆ นั้นไม่ใช่แนวทางที่ผมถนัดเลย", "slot_num": 342, "sheet_no": 4, "first_letter": "I"}, {"id": 285, "orig_slot": "#344", "idiom": "Keep your head above water", "meaning": "Manage to survive in a difficult situation.", "thai_idiom": "ประคับประคองให้อยู่รอด / เอาตัวรอดได้ในภาวะวิกฤต", "thai_meaning": "สามารถเอาชีวิตรอดหรือบริหารจัดการให้อยู่รอดได้ในยามยากลำบาก โดยเฉพาะเรื่องการเงินหรือภาระหน้าที่ล้นมือ", "ex1_en": "Working two part-time shifts helps me pay rent and barely <span class=\"hl-teal\">keep my head above water</span> while finishing college.", "ex1_hl": "keep my head above water", "ex1_th": "การทำงานพาร์ตไทม์สองกะช่วยให้ฉันพอมีเงินจ่ายค่าเช่าห้องและประคับประคองตัวให้อยู่รอดได้ระหว่างเรียนมหาวิทยาลัย", "ex2_en": "With mounting supply chain bottlenecks and rising interest rates, small logistics providers are struggling to <span class=\"hl-teal\">keep their heads above water</span>.", "ex2_hl": "keep their heads above water", "ex2_th": "เมื่อต้องเผชิญกับปัญหาคอขวดในห่วงโซ่อุปทานและอัตราดอกเบี้ยที่พุ่งสูงขึ้น ผู้ให้บริการขนส่งรายย่อยต่างกำลังดิ้นรนอย่างหนักเพื่อประคับประคองธุรกิจให้อยู่รอด", "slot_num": 344, "sheet_no": 4, "first_letter": "K"}, {"id": 286, "orig_slot": "#347", "idiom": "Left in the dust", "meaning": "Far behind others.", "thai_idiom": "ถูกทิ้งไว้ข้างหลัง / ถูกทิ้งห่างไม่เห็นฝุ่น", "thai_meaning": "ถูกทิ้งห่างอย่างสิ้นเชิง พ่ายแพ้ หรือล้าหลังกว่าคู่แข่งหรือผู้อื่นอย่างมาก", "ex1_en": "During the 10-kilometer marathon, I ran out of stamina by mile four and was quickly <span class=\"hl-teal\">left in the dust</span> by the pacing group.", "ex1_hl": "left in the dust", "ex1_th": "ในการวิ่งมาราธอน 10 กิโลเมตร พอถึงไมล์ที่สี่แรงฉันก็หมดเกลี้ยง และถูกกลุ่มผู้นำความเร็ววิ่งแซงทิ้งห่างไปไม่เห็นฝุ่น", "ex2_en": "Legacy automakers that delayed electrification plans now risk being <span class=\"hl-teal\">left in the dust</span> by nimble electric vehicle pioneers.", "ex2_hl": "left in the dust", "ex2_th": "ค่ายรถยนต์ดั้งเดิมที่ชะลอแผนพัฒนายานยนต์ไฟฟ้า บัดนี้กำลังเผชิญความเสี่ยงที่จะถูกผู้บุกเบิกตลาดรถยนต์ไฟฟ้าทิ้งห่างไปไม่เห็นฝุ่น", "slot_num": 347, "sheet_no": 4, "first_letter": "L"}, {"id": 287, "orig_slot": "#350", "idiom": "Life is not all roses", "meaning": "Life has problems, not just happiness.", "thai_idiom": "ชีวิตไม่ได้โรยด้วยกลีบกุหลาบ", "thai_meaning": "ชีวิตย่อมมีอุปสรรค ความยากลำบาก และความเจ็บปวด ไม่ได้มีแต่ความสุขสมบูรณ์แบบเสมอไป", "ex1_en": "Moving abroad sounds exciting in photos, but when loneliness and culture shock hit, you realize <span class=\"hl-teal\">life is not all roses</span>.", "ex1_hl": "life is not all roses", "ex1_th": "การย้ายไปอยู่ต่างประเทศอาจฟังดูน่าตื่นเต้นในรูปถ่าย แต่พอต้องเผชิญกับความเหงาและวัฒนธรรมที่ไม่คุ้นเคย เธอก็จะตระหนักได้ว่าชีวิตไม่ได้โรยด้วยกลีบกุหลาบ", "ex2_en": "Founding a biotech startup requires relentless perseverance because clinical trials frequently fail and <span class=\"hl-teal\">life is not all roses</span> in early-stage ventures.", "ex2_hl": "life is not all roses", "ex2_th": "การก่อตั้งสตาร์ทอัปด้านเทคโนโลยีชีวภาพต้องอาศัยความทรหดอดทนอย่างยิ่ง เนื่องจากการทดลองทางคลินิกมักล้มเหลว และชีวิตในวงการสตาร์ทอัประยะเริ่มต้นก็ไม่ได้โรยด้วยกลีบกุหลาบ", "slot_num": 350, "sheet_no": 4, "first_letter": "L"}, {"id": 288, "orig_slot": "#351", "idiom": "Live and let live", "meaning": "Allow others to live as they wish.", "thai_idiom": "ต่างคนต่างอยู่ / ยอมรับความแตกต่างของผู้อื่น", "thai_meaning": "ยอมรับความคิด วิถีชีวิต หรือความแตกต่างของผู้อื่น โดยไม่ไปตัดสิน ก้าวก่าย หรือบังคับให้เขาต้องทำตามเรา", "ex1_en": "My roommate prefers sleeping in late and keeping quirky retro posters, but I adopt a <span class=\"hl-teal\">live and let live</span> attitude so we avoid household tension.", "ex1_hl": "live and let live", "ex1_th": "รูมเมทของฉันชอบตื่นสายและชอบติดโปสเตอร์เรโทรแปลกๆ ในห้อง แต่ฉันใช้วิธีต่างคนต่างอยู่และเคารพพื้นที่ส่วนตัว เพื่อจะได้ไม่มีปัญหากระทบกระทั่งกัน", "ex2_en": "A multicultural workplace thrives best when colleagues embrace a philosophy of <span class=\"hl-teal\">live and let live</span> regarding personal lifestyles and religious observances.", "ex2_hl": "live and let live", "ex2_th": "สถานที่ทำงานที่มีความหลากหลายทางวัฒนธรรมจะเติบโตได้ดีที่สุดเมื่อเพื่อนร่วมงานยึดหลักการเปิดกว้างและเคารพความแตกต่างของผู้อื่น ทั้งในด้านวิถีชีวิตส่วนตัวและการปฏิบัติตามหลักศาสนา", "slot_num": 351, "sheet_no": 4, "first_letter": "L"}, {"id": 289, "orig_slot": "#353", "idiom": "Make no bones about it", "meaning": "Be very clear about something.", "thai_idiom": "พูดตรงไปตรงมา / ไม่อ้อมค้อม / พูดเปิดอก", "thai_meaning": "พูดหรือแสดงความรู้สึกอย่างชัดเจน ตรงไปตรงมา โดยไม่ปิดบังหรือลังเลใจ", "ex1_en": "Dad <span class=\"hl-teal\">made no bones about</span> his dislike for my sister's lazy new boyfriend.", "ex1_hl": "made no bones about", "ex1_th": "พ่อพูดอย่างตรงไปตรงมาโดยไม่ไว้หน้าเลยว่าไม่ชอบแฟนใหม่จอมขี้เกียจของพี่สาว", "ex2_en": "The managing director <span class=\"hl-teal\">made no bones about</span> the company's financial troubles during the annual shareholder meeting.", "ex2_hl": "made no bones about", "ex2_th": "กรรมการผู้จัดการชี้แจงปัญหาทางการเงินของบริษัทอย่างตรงไปตรงมาไม่อ้อมค้อมในการประชุมผู้ถือหุ้นประจำปี", "slot_num": 353, "sheet_no": 4, "first_letter": "M"}, {"id": 290, "orig_slot": "#357", "idiom": "Money doesn't grow on trees", "meaning": "Money is not easy to earn.", "thai_idiom": "เงินทองไม่ได้หากันง่ายๆ / เงินไม่ได้งอกมาจากดิน", "thai_meaning": "เงินทองไม่ได้หามาได้ง่ายๆ จึงควรใช้จ่ายอย่างประหยัดและรู้คุณค่า", "ex1_en": "Turn off the lights when you leave the room; <span class=\"hl-teal\">money doesn't grow on trees</span>, you know!", "ex1_hl": "money doesn't grow on trees", "ex1_th": "ออกจากห้องก็ปิดไฟด้วยสิ เงินทองไม่ได้งอกมาจากต้นไม้นะลูก รู้จักประหยัดบ้าง!", "ex2_en": "With inflation driving up operating costs, our department head reminded us that <span class=\"hl-teal\">money doesn't grow on trees</span> and ordered a freeze on non-essential travel.", "ex2_hl": "money doesn't grow on trees", "ex2_th": "เมื่อภาวะเงินเฟ้อทำให้ต้นทุนการดำเนินงานพุ่งสูงขึ้น หัวหน้าแผนกจึงเตือนพวกเราว่าเงินไม่ได้หากันง่ายๆ พร้อมสั่งระงับงบการเดินทางที่ไม่จำเป็นทันที", "slot_num": 357, "sheet_no": 4, "first_letter": "M"}, {"id": 291, "orig_slot": "#358", "idiom": "Not enough hours in the day", "meaning": "Too many things to do in limited time.", "thai_idiom": "เวลาไม่เคยพอ / มีเวลาน้อยเกินไป", "thai_meaning": "มีสิ่งต่างๆ ต้องทำมากเกินไปจนรู้สึกว่าเวลายี่สิบสี่ชั่วโมงในแต่ละวันไม่เพียงพอ", "ex1_en": "Between commuting, cooking dinner, and taking care of a newborn, there simply are <span class=\"hl-teal\">not enough hours in the day</span>.", "ex1_hl": "not enough hours in the day", "ex1_th": "ทั้งต้องเดินทางไปทำงาน ทำกับข้าว แถมยังต้องเลี้ยงลูกแรกเกิด รู้สึกว่าเวลาในแต่ละวันมันไม่เคยพอเลยจริงๆ", "ex2_en": "As the launch deadline drew near, the software engineering team felt there were <span class=\"hl-teal\">not enough hours in the day</span> to fix every remaining bug.", "ex2_hl": "not enough hours in the day", "ex2_th": "เมื่อใกล้ถึงกำหนดเปิดตัวระบบ ทีมวิศวกรซอฟต์แวร์ต่างรู้สึกว่าเวลาในแต่ละวันมีไม่พอสำหรับการแก้ไขข้อผิดพลาดที่ยังคั่งค้างอยู่ทั้งหมด", "slot_num": 358, "sheet_no": 4, "first_letter": "N"}, {"id": 292, "orig_slot": "#360", "idiom": "On the fence", "meaning": "Not decided; unsure.", "thai_idiom": "ยังลังเล / สองจิตสองใจ / ยังไม่ตัดสินใจ", "thai_meaning": "อยู่ในสภาวะที่ยังตัดสินใจไม่ได้ ยังลังเลว่าจะเลือกข้างไหนหรือทำอย่างไรดี", "ex1_en": "I'm still <span class=\"hl-teal\">on the fence</span> about whether to go to the beach or stay home and finish my novel.", "ex1_hl": "on the fence", "ex1_th": "ฉันยังสองจิตสองใจอยู่เลยว่าจะออกไปเที่ยวทะเลดี หรือจะอยู่บ้านอ่านนิยายให้จบดี", "ex2_en": "Several independent board members remain <span class=\"hl-teal\">on the fence</span> regarding the proposed multi-billion-dollar merger.", "ex2_hl": "on the fence", "ex2_th": "กรรมการอิสระของบอร์ดบริหารหลายท่านยังคงลังเลและยังไม่ตัดสินใจว่าจะอนุมัติข้อเสนอการควบรวมกิจการมูลค่าหลายพันล้านดอลลาร์หรือไม่", "slot_num": 360, "sheet_no": 4, "first_letter": "O"}, {"id": 293, "orig_slot": "#361", "idiom": "Out of the loop", "meaning": "Not informed; not part of a group.", "thai_idiom": "ตกข่าว / อยู่นอกวง / ไม่รู้เรื่องกับเขา", "thai_meaning": "ไม่ได้รับแจ้งข้อมูลข่าวสาร ไม่ได้รับรู้เรื่องราวหรือการตัดสินใจที่คนอื่นเขารู้กัน", "ex1_en": "I didn't realize they had broken up—I've been completely <span class=\"hl-teal\">out of the loop</span> while studying for finals.", "ex1_hl": "out of the loop", "ex1_th": "ฉันไม่รู้เลยว่าพวกเขากลัวเลิกกันแล้ว พอดีช่วงนี้มัวแต่อ่านหนังสือสอบปลายภาคเลยตกข่าวไปหมดเลย", "ex2_en": "Because the remote employees were left off the email chain, they felt entirely <span class=\"hl-teal\">out of the loop</span> about the organizational restructuring.", "ex2_hl": "out of the loop", "ex2_th": "เนื่องจากพนักงานที่ทำงานจากระยะไกลไม่ได้รับอีเมลแจ้งเตือน พวกเขาจึงรู้สึกเหมือนถูกกันอยู่นอกวงและไม่รู้เรื่องการปรับโครงสร้างองค์กรเลย", "slot_num": 361, "sheet_no": 4, "first_letter": "O"}, {"id": 294, "orig_slot": "#362", "idiom": "Over the moon", "meaning": "Extremely happy.", "thai_idiom":
