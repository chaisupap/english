<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Idioms Master Guide: Curated Interactive Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
              950: '#042f2e',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Prompt"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Prompt & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Pulse Glow Ring Animation for Active Audio Button */
    .audio-playing {
      animation: pulse-ring 1.3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite !important;
      position: relative;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(13, 148, 136, 0); }
      100% { box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); }
    }

    /* 3D Flashcard Animation */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    /* Dual-Span Semantic Highlighting */
    .hl-teal {
      color: #0f766e;
      background-color: #ccfbf1;
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 700;
    }
    .hl-orange {
      color: #c2410c;
      background-color: #ffedd5;
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 700;
    }
  </style>
</head>

<body class="h-full flex flex-col text-slate-800 bg-slate-50 antialiased overflow-hidden font-sans">

  <!-- 1. HEADER (Fixed top, dark luxurious slate-indigo gradient) -->
  <header class="shrink-0 z-30 bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 text-white border-b border-slate-800 shadow-md">
    <div class="px-4 py-2.5 flex items-center justify-between gap-3">
      
      <!-- Left: Logo & Title & Mobile Drawer Toggle -->
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 focus:outline-none" title="เมนูกรอง">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>

        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-indigo-500 flex items-center justify-center shadow-inner text-white font-black text-lg">
            📖
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <h1 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">English Idioms Master Guide</h1>
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Studio HD Audio
              </span>
            </div>
            <p class="text-xs text-slate-400 hidden sm:block">774 Curated Master Idioms • 1,548 Authentic Examples</p>
          </div>
        </div>
      </div>

      <!-- Right: View Mode Selector & Audio Settings -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap justify-end">
        
        <!-- View Mode Selector (Cards / Table / Flashcards) -->
        <div class="bg-slate-800/80 p-0.5 rounded-xl border border-slate-700/70 flex items-center shadow-inner text-xs">
          <button id="viewBtnCards" onclick="setViewMode('cards')" class="px-2.5 py-1.5 rounded-lg font-bold text-white bg-teal-600 shadow-sm flex items-center gap-1.5 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            <span class="hidden md:inline">Cards</span>
          </button>
          <button id="viewBtnTable" onclick="setViewMode('table')" class="px-2.5 py-1.5 rounded-lg font-medium text-slate-300 hover:text-white flex items-center gap-1.5 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span class="hidden md:inline">Table</span>
          </button>
          <button id="viewBtnFlash" onclick="setViewMode('flashcards')" class="px-2.5 py-1.5 rounded-lg font-medium text-slate-300 hover:text-white flex items-center gap-1.5 transition-all">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span class="hidden md:inline">Flashcards</span>
          </button>
        </div>

        <!-- Audio Speed Control -->
        <div class="hidden xl:flex items-center gap-1 bg-slate-800/80 px-2 py-1 rounded-xl border border-slate-700/70 text-xs">
          <span class="text-slate-400 mr-1 text-[11px]">Speed:</span>
          <select id="speedSelect" onchange="setSpeed(this.value)" class="bg-transparent text-white font-medium focus:outline-none cursor-pointer text-xs">
            <option value="0.75" class="bg-slate-900">0.75x</option>
            <option value="0.85" class="bg-slate-900">0.85x</option>
            <option value="1.0" class="bg-slate-900" selected>1.0x</option>
            <option value="1.1" class="bg-slate-900">1.1x</option>
            <option value="1.25" class="bg-slate-900">1.25x</option>
          </select>
        </div>

        <!-- Audio Engine Toggle -->
        <button id="audioEngineBtn" onclick="toggleAudioEngine()" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-medium border transition-colors bg-teal-500/20 text-teal-300 border-teal-400/40 hover:bg-teal-500/30" title="สลับโหมดเสียงสังเคราะห์">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
          <span id="audioEngineLabel">Studio HD</span>
        </button>

      </div>
    </div>
  </header>

  <!-- 2. WORKSPACE CONTAINER (Sidebar + Main Content) -->
  <div class="flex-1 flex overflow-hidden relative w-full">
    
    <!-- Mobile Drawer Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-40 hidden md:hidden transition-opacity"></div>

    <!-- 3. SIDEBAR (Filters & Categories) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 md:z-10 w-72 bg-white border-r border-slate-200 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out shrink-0 shadow-lg md:shadow-none">
      
      <!-- Sidebar Header -->
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-1.5">
          <svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
          ตัวกรองข้อมูล (Filters)
        </h2>
        <div class="flex items-center gap-1">
          <button onclick="resetAllFilters()" class="text-[11px] text-teal-600 hover:text-teal-700 font-semibold px-2 py-0.5 rounded hover:bg-teal-50 transition-colors">
            รีเซ็ต
          </button>
          <button onclick="toggleSidebar()" class="md:hidden p-1 rounded-md text-slate-400 hover:text-slate-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>

      <!-- Sidebar Content (Scrollable) -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-5 text-xs">
        
        <!-- Status / Favorites / Mastered Filters -->
        <div>
          <label class="font-bold text-slate-500 uppercase tracking-wider text-[11px] block mb-2">สถานะการเรียนรู้</label>
          <div class="space-y-1">
            <button onclick="setStatusFilter('all')" id="statusFilterAll" class="w-full text-left px-3 py-2 rounded-xl font-medium flex items-center justify-between bg-teal-50 text-teal-800 font-semibold transition-colors">
              <span class="flex items-center gap-2">
                <span>📚</span> รายการทั้งหมด
              </span>
              <span class="text-xs font-mono font-bold bg-white text-teal-700 px-2 py-0.5 rounded-full shadow-xs" id="badgeAll">774</span>
            </button>
            <button onclick="setStatusFilter('favorites')" id="statusFilterFav" class="w-full text-left px-3 py-2 rounded-xl font-medium flex items-center justify-between text-slate-600 hover:bg-slate-100 transition-colors">
              <span class="flex items-center gap-2">
                <span class="text-amber-500">⭐</span> รายการโปรด (Favorites)
              </span>
              <span class="text-xs font-mono font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full" id="badgeFav">0</span>
            </button>
            <button onclick="setStatusFilter('mastered')" id="statusFilterMastered" class="w-full text-left px-3 py-2 rounded-xl font-medium flex items-center justify-between text-slate-600 hover:bg-slate-100 transition-colors">
              <span class="flex items-center gap-2">
                <span class="text-emerald-500">🎓</span> จดจำได้แล้ว (Mastered)
              </span>
              <span class="text-xs font-mono font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full" id="badgeMastered">0</span>
            </button>
          </div>
        </div>

        <!-- A-Z Alphabetical Index Filter -->
        <div>
          <label class="font-bold text-slate-500 uppercase tracking-wider text-[11px] block mb-2">ดัชนีตัวอักษร (A–Z Index)</label>
          <div class="flex flex-wrap gap-1" id="letterFilterContainer">
            <!-- Rendered by JS -->
          </div>
        </div>

      </div>

      <!-- Sidebar Footer (Overview Summary) -->
      <div class="p-3 bg-slate-50 border-t border-slate-200 text-center text-[11px] text-slate-500">
        <p class="font-semibold text-slate-700">774 Master Idioms</p>
        <p class="text-[10px] text-slate-400">Curated & Verified Guide</p>
      </div>

    </aside>

    <!-- 4. MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-100/60">
      
      <!-- Sub-header: Search Bar, Stats, and Quick Tools -->
      <div class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0 shadow-xs">
        
        <!-- Search Input -->
        <div class="relative flex-1 min-w-[240px] max-w-md">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            oninput="handleSearch(this.value)" 
            placeholder="ค้นหาสำนวน, คำแปลไทย, ความหมาย, ประโยค, หรือ #ลำดับ..." 
            class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition-all placeholder:text-slate-400"
          >
          <button id="clearSearchBtn" onclick="clearSearch()" class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600 hidden">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <!-- Filter Stats & Actions -->
        <div class="flex items-center gap-3">
          <div class="text-xs text-slate-600">
            แสดงผล <span id="filteredCount" class="font-bold font-mono text-teal-700">774</span> รายการ
          </div>
          <button onclick="shuffleCurrentItems()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors" title="สุ่มลำดับการเรียนรู้">
            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span>สุ่มลำดับ</span>
          </button>
        </div>

      </div>

      <!-- Main Scrollable Workspace -->
      <div class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6" id="viewContainer">
        <!-- Rendered dynamically by JavaScript -->
      </div>

    </main>

  </div>

  <!-- EMBEDDED DATASET (774 Master Idioms) -->
  <script>
    const MASTER_DATA = [{"id": 1, "orig_slot": "#1", "idiom": "A blessing in disguise", "meaning": "Something bad that turns out good.", "thai_idiom": "เรื่องร้ายกลายเป็นดี / ทุกขลาภ", "thai_meaning": "สิ่งเลวร้ายหรือปัญหาในตอนแรกที่กลับกลายเป็นผลดีในภายหลัง", "ex1_en": "Missing the morning train was <span class=\"hl-teal\">a blessing in disguise</span>, because I bumped into an old university friend at the station cafe.", "ex1_hl": "a blessing in disguise", "ex1_th": "การตกรถไฟขบวนเช้ากลับกลายเป็นเรื่องดีโดยไม่คาดคิด เพราะทำให้ฉันได้บังเอิญเจอเพื่อนสมัยมหาวิทยาลัยที่คาเฟ่ในสถานี", "ex2_en": "Losing that major client was initially devastating, but it proved to be <span class=\"hl-teal\">a blessing in disguise</span> as it forced our team to diversify our revenue streams.", "ex2_hl": "a blessing in disguise", "ex2_th": "การสูญเสียลูกค้ารายใหญ่นั้นสร้างความเสียหายในตอนแรก แต่กลับกลายเป็นเรื่องดีในระยะยาว เพราะบีบให้ทีมของเราต้องกระจายช่องทางรายได้ให้หลากหลายขึ้น", "slot_num": 1, "sheet_no": 1, "first_letter": "A"}, {"id": 2, "orig_slot": "#2", "idiom": "A piece of cake", "meaning": "Very easy.", "thai_idiom": "ง่ายเหมือนปอกกล้วยเข้าปาก / เรื่องกล้วยๆ", "thai_meaning": "ง่ายมาก ง่ายดาย ไม่ยุ่งยากซับซ้อน", "ex1_en": "Don't stress about assembling that flat-pack bookshelf; just follow the diagram and it'll be <span class=\"hl-teal\">a piece of cake</span>.", "ex1_hl": "a piece of cake", "ex1_th": "อย่าไปกังวลเรื่องประกอบชั้นวางของแบบน็อกดาวน์เลย แค่ทำตามคู่มือก็ง่ายเหมือนปอกกล้วยเข้าปากแล้ว", "ex2_en": "Passing the annual compliance audit was <span class=\"hl-teal\">a piece of cake</span> because the accounting department had maintained meticulous records all year.", "ex2_hl": "a piece of cake", "ex2_th": "การผ่านการตรวจสอบความถูกต้องประจำปีเป็นเรื่องง่ายดายมาก เพราะแผนกบัญชีเก็บเอกสารและบันทึกข้อมูลอย่างละเอียดถี่ถ้วนมาตลอดทั้งปี", "slot_num": 2, "sheet_no": 1, "first_letter": "A"}, {"id": 3, "orig_slot": "#3", "idiom": "Break the ice", "meaning": "Start a conversation บจะไม่เคยมี", "ex1_en": "My grandfather eats fast food only <span class=\"hl-teal\">once in a blue moon</span>, usually when he's on a long road trip with the grandkids.", "ex1_hl": "once in a blue moon", "ex1_th": "คุณปู่ของฉันนานทีปีหนถึงจะยอมกินฟาสต์ฟู้ดสักครั้ง ซึ่งมักจะเป็นตอนที่นั่งรถไปเที่ยวทางไกลกับพวกหลานๆ", "ex2_en": "Regulatory overhauls of this scale occur only <span class=\"hl-teal\">once in a blue moon</span>, prompting institutional banks to overhaul their internal frameworks.", "ex2_hl": "once in a blue moon", "ex2_th": "การยกเครื่องกฎระเบียบครั้งใหญ่ระดับนี้แทบจะไม่เกิดขึ้นบ่อยนัก ส่งผลให้ธนาคารพาณิชย์ต้องปรับรื้อโครงสร้างการทำงานภายในทั้งหมด", "slot_num": 5, "sheet_no": 1, "first_letter": "O"}, {"id": 6, "orig_slot": "#6", "idiom": "Cost an arm and a leg", "meaning": "Be very expensive.", "thai_idiom": "แพงหูฉี่ / แพงลิบลิ่ว / แพงกระเป๋าฉีก", "thai_meaning": "ราคาแพงมหาศาล สิ้นเปลืองเงินเป็นจำนวนมาก", "ex1_en": "I admired that Italian leather sofa in the showroom window, but it <span class=\"hl-teal\">costs an arm and a leg</span>, so I browsed second-hand listings instead.", "ex1_hl": "costs an arm and a leg", "ex1_th": "ฉันชอบโซฟาหนังอิตาลีในตู้โชว์ร้านนั้นมาก แต่มันแพงหูฉี่จนต้องเปลี่ยนไปหาดูโซฟามือสองแทน", "ex2_en": "Upgrading the semiconductor foundry with advanced lithography equipment will <span class=\"hl-teal\">cost an arm and a leg</span>, yet it is essential to stay competitive.", "ex2_hl": "cost an arm and a leg", "ex2_th": "การยกระดับโรงงานผลิตเซมิคอนดักเตอร์ด้วยเครื่องจักรพิมพ์ลายวงจรขั้นสูงต้องใช้เงินมหาศาล ทว่าจำเป็นอย่างยิ่งเพื่อรักษาขีดความสามารถในการแข่งขัน", "slot_num": 6, "sheet_no": 1, "first_letter": "C"}, {"id": 7, "orig_slot": "#7", "idiom": "Let the cat out of the bag", "meaning": "Reveal a secret.", "thai_idiom": "ปล่อยไก่ / ปากโป้ง / เผลอแพร่งพรายความลับ", "thai_meaning": "เปิดเผยความลับโดยไม่ได้ตั้งใจหรือหลุดปากบอกออกไป", "ex1_en": "We were organizing a surprise retirement lunch for Dad, but my little brother accidentally <span class=\"hl-teal\">let the cat out of the bag</span> over breakfast.", "ex1_hl": "let the cat out of the bag", "ex1_th": "พวกเรากำลังจัดมื้อเที่ยงเซอร์ไพรส์วันเกษียณให้คุณพ่อ แต่น้องชายตัวดีดันเผลอหลุดปากบอกความลับตอนกินมื้อเช้าเสียก่อน", "ex2_en": "Before the technology brand could debut its flagship tablet at the summit, an overseas contractor <span class=\"hl-teal\">let the cat out of the bag</span> by leaking marketing renders.", "ex2_hl": "let the cat out of the bag", "ex2_th": "ก่อนที่แบรนด์เทคโนโลยีจะได้เปิดตัวแท็บเล็ตรุ่นเรือธงในการประชุมสุดยอด ผู้รับเหมาในต่างประเทศก็ทำข้อมูลรั่วไหลด้วยการปล่อยภาพเรนเดอร์สำหรับทำการตลาดออกมา", "slot_num": 7, "sheet_no": 1, "first_letter": "L"}, {"id": 8, "orig_slot": "#8", "idiom": "Spill the beans", "meaning": "Reveal secret information.", "thai_idiom": "คายความลับ / เปิดโปง / ปากสว่าง", "thai_meaning": "เปิดเผยข้อมูลลับหรือความลับที่ควรปกปิด", "ex1_en": "Come on, stop keeping everyone in suspense and <span class=\"hl-teal\">spill the beans</span> about your new romantic partner!", "ex1_hl": "spill the beans", "ex1_th": "นี่ เลิกทำให้ทุกคนอยากรู้อยากเห็นได้แล้ว แล้วรีบคายความลับมาซะดีๆ ว่าใครคือคนรักใหม่ของเธอ!", "ex2_en": "Under intense questioning from antitrust regulators, the former finance officer chose to <span class=\"hl-teal\">spill the beans</span> regarding confidential price-fixing agreements.", "ex2_hl": "spill the beans", "ex2_th": "ภายใต้การซักถามอย่างเข้มข้นจากหน่วยงานกำกับดูแลการค้าที่เป็นธรรม อดีตเจ้าหน้าที่ฝ่ายการเงินตัดสินใจเปิดโปงข้อตกลงลับเรื่องการฮั้วราคา", "slot_num": 8, "sheet_no": 1, "first_letter": "S"}, {"id": 9, "orig_slot": "#9", "idiom": "Bite the bullet", "meaning": "Face something difficult bravely.", "thai_idiom": "กัดฟันสู้ / กัดฟันยอมรับสภาพ / ตัดใจทำเรื่องยาก", "thai_meaning": "ยอมเผชิญหน้าหรือตัดสินใจทำเรื่องยากลำบากหรือไม่น่าอภิรมย์ด้วยความกล้าหาญและอดทน", "ex1_en": "After postponing my root canal treatment for nearly four months, I finally decided to <span class=\"hl-teal\">bite the bullet</span> and see the endodontist.", "ex1_hl": "bite the bullet", "ex1_th": "หลังจากผัดวันประกันพรุ่งเรื่องรักษารากฟันมาเกือบสี่เดือน ในที่สุดฉันก็ตัดสินใจกัดฟันนัดพบทันตแพทย์เฉพาะทางเสียที", "ex2_en": "Confronted by persistent quarterly operating losses, the board of directors had to <span class=\"hl-teal\">bite the bullet</span> and suspend dividend payouts.", "ex2_hl": "bite the bullet", "ex2_th": "เมื่อเผชิญกับผลขาดทุนจากการดำเนินงานประจำไตรมาสอย่างต่อเนื่อง คณะกรรมการบริษัทจึงจำต้องกัดฟันระงับการจ่ายเงินปันผล", "slot_num": 9, "sheet_no": 1, "first_letter": "B"}, {"id": 10, "orig_slot": "#10", "idiom": "Call it a day", "meaning": "Stop working for the day.", "thai_idiom": "เลิกงาน / พอก่อนสำหรับวันนี้ / ยุติกิจกรรมไว้แค่นี้", "thai_meaning": "หยุดทำงานหรือยุติสิ่งที่กำลังทำอยู่สำหรับวันนี้", "ex1_en": "We've weeded the entire vegetable garden and pruned the roses; let's pack our tools and <span class=\"hl-teal\">call it a day</span>.", "ex1_hl": "call it a day", "ex1_th": "พวกเราถอนหญ้าในแปลงผักจนเกลี้ยงและตัดแต่งกิ่งกุหลาบเสร็จแล้ว เก็บอุปกรณ์แล้วพอกันแค่นี้สำหรับวันนี้เถอะ", "ex2_en": "After nine continuous hours of arbitration without consensus on key licensing clauses, both legal delegations agreed to <span class=\"hl-teal\">call it a day</span>.", "ex2_hl": "call it a day", "ex2_th": "หลังจากการไกล่เกลี่ยนานถึงเก้าชั่วโมงติดต่อกันโดยยังไม่ได้ข้อยุติในเงื่อนไขใบอนุญาตหลัก ตัวแทนทางกฎหมายของทั้งสองฝ่ายจึงตกลงที่จะยุติการเจรจาไว้เพียงเท่านี้สำหรับวันนี้", "slot_num": 10, "sheet_no": 1, "first_letter": "C"}, {"id": 11, "orig_slot": "#11", "idiom": "Under the weather", "meaning": "Feeling unwell.", "thai_idiom": "ครั่นเนื้อครั่นตัว / ไม่ค่อยสบาย / รู้สึกเปื่อยๆ", "thai_meaning": "รู้สึกป่วยเล็กน้อย มีไข้ หรือสุขภาพร่างกายไม่ค่อยสมบูรณ์", "ex1_en": "I intended to visit the farmers' market this morning, but I woke up feeling rather <span class=\"hl-teal\">under the weather</span> with a stuffy nose.", "ex1_hl": "under the weather", "ex1_th": "ฉันตั้งใจว่าจะไปเดินตลาดเกษตรกรเช้านี้ แต่ตื่นมาดันรู้สึกครั่นเนื้อครั่นตัวและคัดจมูกนิดหน่อย", "ex2_en": "The lead researcher requested permission to join the symposium panel virtually, noting she had fallen <span class=\"hl-teal\">under the weather</span> during international transit.", "ex2_hl": "under the weather", "ex2_th": "หัวหน้านักวิจัยขออนุญาตเข้าร่วมการเสวนาทางวิชาการผ่านระบบออนไลน์ โดยแจ้งว่าเธอรู้สึกไม่ค่อยสบายระหว่างเดินทางต่อเครื่องข้ามประเทศ", "slot_num": 11, "sheet_no": 1, "first_letter": "U"}, {"id": 12, "orig_slot": "#12", "idiom": "Beat around the bush", "meaning": "Avoid saying something directly.", "thai_idiom": "พูดอ้อมค้อม / ชักแม่น้ำทั้งห้า / พูดเฉไฉ", "thai_meaning": "พูดเลี่ยง ไม่ยอมพูดตรงประเด็นเพื่อหลีกเลี่ยงเรื่องสำคัญหรือน่าอึดอัดใจ", "ex1_en": "If you don't enjoy cooking dinners together, just tell me honestly instead of <span class=\"hl-teal\">beating around the bush</span>.", "ex1_hl": "beating around the bush", "ex1_th": "ถ้าเธอไม่ชอบทำอาหารเย็นด้วยกัน ก็บอกฉันมาตรงๆ เถอะ แทนที่จะพูดอ้อมค้อมไปมา", "ex2_en": "During the quarterly press briefing, journalists pressed the chief financial officer to stop <span class=\"hl-teal\">beating around the bush</span> regarding impending plant closures.", "ex2_hl": "beating around the bush", "ex2_th": "ในระหว่างการแถลงข่าวประจำไตรมาส ผู้สื่อข่าวต่างกดดันให้ประธานเจ้าหน้าที่ฝ่ายการเงินหยุดพูดเฉไฉเกี่ยวกับประเด็นการปิดโรงงานที่กำลังจะเกิดขึ้น", "slot_num": 12, "sheet_no": 1, "first_letter": "B"}, {"id": 13, "orig_slot": "#13", "idiom": "Go the extra mile", "meaning": "Make extra effort.", "thai_idiom": "ทุ่มเทเป็นพิเศษ / ใส่ใจเกินร้อย / ทำเกินหน้าที่", "thai_meaning": "ทุ่มเทความพยายามหรือให้ความช่วยเหลือมากกว่าที่กำหนดหรือคาดหวังไว้", "ex1_en": "Our boutique hotel host always <span class=\"hl-teal\">goes the extra mile</span> by preparing gluten-free pastries and personalized neighborhood maps for every guest.", "ex1_hl": "goes the extra mile", "ex1_th": "เจ้าของโรงแรมบูติกของเราทุ่มเทใส่ใจเกินร้อยเสมอ โดยเ  ฉันแค่แกล้งอำเล่นตอนเธอเดินเข้าไปในร้านสะดวกซื้อเฉยๆ", "ex2_en": "When the senior partner told the new associates they had to work throughout Christmas Day, they soon realized he was simply <span class=\"hl-teal\">pulling their leg</span>.", "ex2_hl": "pulling their leg", "ex2_th": "เมื่อหุ้นส่วนอาวุโสบอกทนายความจบใหม่ว่าทุกคนต้องมาทำงานตลอดวันคริสต์มาส ไม่นานพวกเขาก็รู้ว่าเขาแค่พูดหยอกเล่นเท่านั้น", "slot_num": 15, "sheet_no": 1, "first_letter": "P"}, {"id": 16, "orig_slot": "#16", "idiom": "Hit the sack", "meaning": "Go to bed.", "thai_idiom": "เข้านอน / ล้มตัวลงนอน / ไปนอนเอาแรง", "thai_meaning": "เข้านอน พักผ่อนนอนหลับ", "ex1_en": "My eyelids feel like lead after helping clean the garage all afternoon, so I'm heading upstairs to <span class=\"hl-teal\">hit the sack</span>.", "ex1_hl": "hit the sack", "ex1_th": "เปลือกตาฉันหนักอึ้งไปหมดหลังจากช่วยทำความสะอาดโรงรถมาตลอดช่วงบ่าย คืนนี้ฉันเลยจะขึ้นห้องไปล้มตัวลงนอนแล้ว", "ex2_en": "After submitting the consolidated financial statements at three in the morning, the auditing team finally dispersed to <span class=\"hl-teal\">hit the sack</span>.", "ex2_hl": "hit the sack", "ex2_th": "หลังส่งงบการเงินรวมเสร็จสิ้นตอนตีสาม ทีมผู้ตรวจสอบบัญชีจึงแยกย้ายกันกลับไปนอนเอาแรงเสียที", "slot_num": 16, "sheet_no": 1, "first_letter": "H"}, {"id": 17, "orig_slot": "#17", "idiom": "On cloud nine", "meaning": "Extremely happy.", "thai_idiom": "มีความสุขล้นพ้น / มีความสุขเหมือนลอยได้ / ปลื้มปริ่มสุดๆ", "thai_meaning": "รู้สึกมีความสุข ปลื้มปีติ และเบิกบานใจอย่างถึงที่สุด", "ex1_en": "Jessica was <span class=\"hl-teal\">on cloud nine</span> all afternoon after opening the envelope and seeing that she won the regional watercolor contest.", "ex1_hl": "on cloud nine", "ex1_th": "เจสสิก้ามีความสุขจนแทบลอยได้ตลอดบ่าย หลังจากเปิดซองจดหมายแล้วพบว่าเธอชนะการประกวดภาพวาดสีน้ำระดับภูมิภาค", "ex2_en": "The biomedical researchers were <span class=\"hl-teal\">on cloud nine</span> after the regulatory agency granted expedited review status to their n mental regulators discovered unpermitted wastewater discharges into the river.", "ex2_hl": "in hot water", "ex2_th": "ผู้ผลิตข้ามชาติตกที่นั่งลำบากอย่างหนัก หลังจากหน่วยงานกำกับดูแลด้านสิ่งแวดล้อมตรวจพบการลักลอบปล่อยน้ำเสียลงสู่แม่น้ำโดยไม่ได้รับอนุญาต", "slot_num": 23, "sheet_no": 1, "first_letter": "I"}, {"id": 24, "orig_slot": "#24", "idiom": "Miss the boat", "meaning": "Miss an opportunity.", "thai_idiom": "ตกขบวน / พลาดโอกาสทอง / ช้าไปต๋อย", "thai_meaning": "พลาดโอกาสที่ดีไปเพราะดำเนินการ ลังเล หรือตัดสินใจล่าช้าเกินไป", "ex1_en": "I hesitated too long before reserving the cabin for Thanksgiving weekend, and now I've completely <span class=\"hl-teal\">missed the boat</span>.", "ex1_hl": "missed the boat", "ex1_th": "ฉันมัวแต่ลังเลอยู่นานก่อนจะจองบ้านพักตากอากาศสำหรับวันหยุดวันขอบคุณพระเจ้า และตอนนี้ฉันก็พลาดโอกาสนั้นไปเสียแล้ว", "ex2_en": "Commercial enterprises that delayed transitioning to cloud infrastructure have largely <span class=\"hl-teal\">missed the boat</span> on early efficiency advantages.", "ex2_hl": "missed the boat", "ex2_th": "องค์กรธุรกิจที่ชะลอการย้ายระบบสู่คลาวด์ได้ตกขบวนโอกาสทองในการเก็บเกี่ยวข้อได้เปรียบด้านประสิทธิภาพในระยะแรกไปอย่างน่าเสียดาย", "slot_num": 24, "sheet_no": 1, "first_letter": "M"}, {"id": 25, "orig_slot": "#25", "idiom": "A dime a dozen", "meaning": "Very common.", "thai_idiom": "เกลื่อนกลาด / หาง่ายถมเถ / มีดาษดื่น", "thai_meaning": "มีอยู่ทั่วไปอย่างแพร่หลาย หาได้ง่ายมากจนไม่ได้มีคุณค่าหรือความพิเศษอันใด", "ex1_en": "Mass-produced souvenir magnets are <span class=\"hl-teal\">a dime a dozen</span> near tourist piers, so I prefer buying locally handmade pottery.", "ex1_hl": "a dime a dozen", "ex1_th": "แม่เหล็กติดตู้เย็นของที่ระลึกที่ผลิตแบบโรงงานมีขายเกลื่อนกลาดตามท่าเรือท่องเที่ยว ฉันเลยชอบอุดหนุนเครื่องปั้นดินเผาทำมือของคนในท้องถิ่นมากกว่า", "ex2_en": "While entry-level web scraping scripts are <span class=\"hl-teal\">a dime a dozen</span>, robust enterprise data pipelines engineered for compliance remain exceptionally valuable.", "ex2_hl": "a dime a dozen", "ex2_th": "ในขณะที่สคริปต์ดึงข้อมูลเว็บระดับพื้นฐานมีอยู่ดาษดื่นทั่วไป แต่ระบบท่อส่งข้อมูลระดับองค์กรที่ออกแบบมาเพื่อรองรับการกำกับดูแลกลับมีมูลค่าสูงยิ่ง", "slot_num": 25, "sheet_no": 1, "first_letter": "A"}, {"id": 26, "orig_slot": "#26", "idiom": "Speak of the devil", "meaning": "The person just mentioned appears.", "thai_idiom": "พูดถึงผี ผีก็มา / ตายยากจริงๆ / พูดถึงปุ๊บก็มาปั๊บ", "thai_meaning": "บุคคลที่เพิ่งพูดถึงหรือเอ่ยชื่อเดินเข้ามาหรือปรากฏตัวขึ้นในทันทีทันใด", "ex1_en": "We were just reminiscing about whether Mateo still plays guitar, and <span class=\"hl-teal\">speak of the devil</span>, he strolled right into the cafe!", "ex1_hl": "speak of the devil", "ex1_th": "พวกเรากำลังนึกถึงอยู่พอดีว่ามาเตโอยังเล่นกีตาร์อยู่หรือเปล่า และพูดถึงปุ๊บก็มาปั๊บ เขาเดินเข้ามาในร้านกาแฟพอดีเลย!", "ex2_en": "The hiring committee was discussing Dr. Vance's published clinical trials when, <span class=\"hl-teal\">speak of the devil</span>, she joined the videoconference right on cue.", "ex2_hl": "speak of the devil", "ex2_th": "คณะกรรมการสรรหากำลังอภิปรายผลงานวิจัยทางคลินิกของ ดร. แวนซ์ อยู่พอดี และพูดถึงปุ๊บก็มาปั๊บ เธอได้เข้าสู่วิดีโอคอนเฟอเรนซ์ตรงเวลาพอเหมาะพอดี", "slot_num": 26, "sheet_no": 1, "first_letter": "S"}, {"id": 27, "orig_slot": "#27", "idiom": "Better late than never", "meaning": "Doing something late is better than not doing it.", "thai_idiom": "มาช้ายังดีกว่าไม่มา / สายไปหน่อยยังดีกว่าไม่ทำ", "thai_meaning": "การลงมือทำสิ่งใดหรือมาถึงแม้จะล่าช้าไปบ้าง ก็ยังดีกว่าไม่ได้ทำหรือไม่ได้มาเลย", "ex1_en": "You showed up with the camping equipment just as we finished setting up the tents, but hey, <span class=\"hl-teal\">better late than never</span>!", "ex1_hl": "better late than never", "ex1_th": "เธอเพิ่งขนอุปกรณ์แคมปิ้งมาถึงตอนพวกเรากางเต็นท์เสร็จพอดี แต่ก็นะ มาช้าก็ยังดีกว่าไม่มาเลย!", "ex2_en": "While the factory's automated emissions filtration system was installed two quarters behind schedule, regulators concurred that it was <span class=\"hl-teal\">better late than never</span>.", "ex2_hl": "better late than never", "ex2_th": "แม้ระบบกรองมลพิษอัตโนมัติของโรงงานจะติดตั้งล่าช้ากว่ากำหนดไปสองไตรมาส แต่หน่วยงานกำกับดูแลก็เห็นพ้องต้องกันว่าเสร็จช้ายังดีกว่าไม่ทำเลย", "slot_num": 27, "sheet_no": 1, "first_letter": "B"}, {"id": 28, "orig_slot": "#28", "idiom": "Don't judge a book by its cover", "meaning": "Don't judge by appearance.", "thai_idiom": "อย่าตัดสินคนจากภายนอก / อย่ามองแต่เปลือกนอก", "thai_meaning": "อย่าด่วนตัดสินคุณค่า ความสามารถ หรืออุปนิสัยของสิ่งใดหรือใครจากเพียงแค่รูปลักษณ์ภายนอก", "ex1_en": "That roadside eatery looks weathered and plain, but their handmade dumplings are unmatched—<span class=\"hl-teal\">don't judge a book by its cover</span>.", "ex1_hl": "don't judge a book by its cover", "ex1_th": "ร้านอาหารริมทางร้านนั้นอาจจะดูเก่าทรุดโทรมและธรรมดามาก แต่เกี๊ยวทำมือของเขาอร่อยไร้ที่ติ อย่าเพิ่งตัดสินอะไรแค่เปลือกนอกเลย", "ex2_en": "The venture capitalist reminded her investment partners <span class=\"hl-teal\">not to judge a book by its cover</span>, noting that unpolished startup pitch decks often conceal transformative breakthroughs.", "ex2_hl": "not to judge a book by its cover", "ex2_th": "นักลงทุนร่วมทุนเตือนหุ้นส่วนร่วมลงทุนว่าอย่าตัดสินหนังสือจากหน้าปก โดยชี้ว่าสไลด์นำเสนอของสตาร์ตอัปที่ดูไม่หวือหวา บ่อยครั้งมักซ่อนนวัตกรรมที่พลิกโฉมวงการไว้", "slot_num": 28, "sheet_no": 1, "first_letter": "D"}, {"id": 29, "orig_slot": "#29", "idiom": "Every cloud has a silver lining", "meaning": "There is something good in every bad situation.", "thai_idiom": "ในวิกฤตย่อมมีโอกาส / ฟ้าหลังฝนย่อมสดใส / ในเรื่องร้ายยังมีเรื่องดี", "thai_meaning": "ในทุกสถานการณ์ที่เลวร้ายหรือยากลำบาก มักจะมีแง่มุมที่ดี ประโยชน์ หรือความหวังซ่อนอยู่เสมอ", "ex1_en": "Our road trip was halted by engine trouble, but <span class=\"hl-teal\">every cloud has a silver lining</span>—we discovered an enchanting mountain village while waiting for repairs.", "ex1_hl": "every cloud has a silver lining", "ex1_th": "ทริปขับรถเที่ยวของพวกเราต้องหยุดชะงักเพราะเครื่องยนต์มีปัญหา แต่ในเรื่องร้ายก็ยังมีเรื่องดี เพราะทำให้พวกเราได้ค้นพบหมู่บ้านกลางหุบเขาอันมีเสน่ห์ระหว่างรอซ่อมรถ", "ex2_en": "Financial downturns frequently illustrate that <span class=\"hl-teal\">every cloud has a silver lining</span>, as capital constraints compel corporations to streamline bloated operations.", "ex2_hl": "every cloud has a silver lining", "ex2_th": "ช่วงเศรษฐกิจขาลงมักสะท้อนให้เห็นว่าในวิกฤตย่อมมีโอกาสเสมอ เมื่อข้อจำกัดด้านเงินทุนบีบให้บริษัทต่างๆ ต้องปรับลดความซ้ำซ้อนและเพิ่มความคล่องตัวในการดำเนินงาน", "slot_num": 29, "sheet_no": 1, "first_letter": "E"}, {"id": 30, "orig_slot": "#30", "idiom": "Actions speak louder than words", "meaning": "What you do matters more than what you say.", "thai_idiom": "การกระทำสำคัญกว่าคำพูด / ทำดีกว่าพูด", "thai_meaning": "สิ่งที่บุคคลลงมือทำจริงมีความหมายและน่าเชื่อถือมากกว่าคำสัญญาหรือคำพูดลมปาก", "ex1_en": "My roommate constantly promises to clean the kitchen dishes, but <span class=\"hl-teal\">actions speak louder than words</span>, and the sink is still overflowing.", "ex1_hl": "actions speak louder than words", "ex1_th": "รูมเมตของฉันคอยสัญญาอยู่เรื่อยว่าจะล้างจานในครัว แต่การกระทำสำคัญกว่าคำพูด เพราะตอนนี้จานชามในอ่างยังกองล้นอยู่เหมือนเดิม", "ex2_en": "Institutional investors emphasized that <span class=\"hl-teal\">actions speak louder than words</span>, demanding verified emission cuts rather than vague corporate sustainability pledges.", "ex2_hl": "actions speak louder than words", "ex2_th": "กลุ่มนักลงทุนสถาบันเน้นย้ำว่าการกระทำสำคัญกว่าคำพูด โดยเรียกร้องให้มีการลดการปล่อยมลพิษที่ผ่านการรับรองและตรวจสอบได้จริง แทนที่จะเป็นเพียงคำมั่นสัญญาเรื่องความยั่งยืนที่เลื่อนลอย", "slot_num": 30, "sheet_no": 1, "first_letter": "A"}, {"id": 31, "orig_slot": "#31", "idiom": "Practice makes perfect", "meaning": "Practice improves your ability.", "thai_idiom": "ฝึกฝนบ่อยๆ ย่อมชำนาญ / ยิ่งซ้อมยิ่งเก่ง / ฝนทั่งให้เป็นเข็ม", "thai_meaning": "การหมั่นฝึกซ้อมทำสิ่งใดสิ่งหนึ่งอย่างสม่ำเสมอจะช่วยเพิ่มพูนทักษะจนเกิดความชำนาญและสมบูรณ์แบบ", "ex1_en": "Strumming classical guitar barre chords felt agonizing at first, but <span class=\"hl-teal\">practice makes perfect</span> if you dedicate twenty minutes every evening.", "ex1_hl": "practice makes perfect", "ex1_th": "การทาบคอร์ดบนกีตาร์คลาสสิกอาจรู้สึกทรมานนิ้วมากในตอนแรก แต่การฝึกฝนบ่อยๆ ย่อมทำให้ชำนาญขึ้น หากเธอสละเวลาซ้อมวันละยี่สิบนาทีทุกเย็น", "ex2_en": "The aviation flight academy reminds pilot cadets that <span class=\"hl-teal\">practice makes perfect</span>, mandating hundreds of simulator hours before cockpit certification.", "ex2_hl": "practice makes perfect", "ex2_th": "สถาบันการบินคอยย้ำเตือนนักเรียนนักบินว่าการฝึกฝนบ่อยๆ จะสร้างความชำนาญและความแม่นยำ โดยกำหนดให้ต้องฝึกบินในเครื่องจำลองหลายร้อยชั่วโมงก่อนได้รับใบอนุญาตปฏิบัติการบินจริง", "slot_num": 31, "sheet_no": 1, "first_letter": "P"}, {"id": 32, "orig_slot": "#32", "idiom": "Where there's a will, there's a way", "meaning": "Determination can find a solution.", "thai_idiom": "ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น", "thai_meaning": "หากมีความมุ่งมั่นและตั้งใจจริง ย่อมสามารถหาหนทางเอาชนะอุปสรรคหรือบรรลุเป้าหมายได้เสมอ", "ex1_en": "Despite having no budget for professional staging, our community theater troupe built the entire set from salvaged lumber—proving that <span class=\"hl-teal\">where there's a will, there's a way</span>.", "ex1_hl": "where there's a will, there's a way", "ex1_th": "แม้จะไม่มีงบประมาณสำหรับเวทีมืออาชีพ แต่คณะละครชุมชนของเราก็สร้างฉากทั้งหมดขึ้นมาจากเศษไม้รีไซเคิล พิสูจน์ให้เห็นว่าความพยายามอยู่ที่ไหน ความสำเร็จก็อยู่ที่นั่น", "ex2_en": "The clean-tech startup demonstrated that <span class=\"hl-teal\">where there's a will, there's a way</span> by deploying scalable water filtration units across remote arid villages despite severe logistical hurdles.", "ex2_hl": "where there's a will, there's a way", "ex2_th": "สตาร์ตอัปเทคโนโลยีสะอาดได้พิสูจน์ว่าหากมีความมุ่งมั่นย่อมมีหนทางเสมอ ด้วยการติดตั้งเครื่องกรองน้ำที่ปรับขยายขนาดได้ในหมู่บ้านทุรกันดารอันแห้งแล้ง แม้จะต้องเผชิญกับอุปสรรคด้านการขนส่งอย่างหนักหน่วง", "slot_num": 32, "sheet_no": 1, "first_letter": "W"}, {"id": 33, "orig_slot": "#33", "idiom": "Rome wasn't built in a day", "meaning": "Great things take time.", "thai_idiom": "ความสำเร็จต้องใช้เวลา / ช้าๆ ได้พร้าเล่มงาม", "thai_meaning": "ผลงานที่ยิ่งใหญ่หรือความสำเร็จที่แท้จริงต้องอาศัยเวลา ความอดทน และความพยายาม ไม่อาจเสร็จสิ้นได้ในชั่วข้ามคืน", "ex1_en": "Don't be discouraged because your bilingual vocabulary isn't fluent after two months; remember that <span class=\"hl-teal\">Rome wasn't built in a day</span>.", "ex1_hl": "Rome wasn't built in a day", "ex1_th": "อย่าเพิ่งท้อแท้ไปเลยถ้าคลังคำศัพท์สองภาษาของเธอยังไม่คล่องแคล่วหลังเรียนไปได้แค่สองเดือน จำไว้ว่าความสำเร็จทุกอย่างล้วนต้องใช้เวลา", "ex2_en": "Establishing global brand equity and consumer trust requires decades of steadfast execution, demonstrating that <span class=\"hl-teal\">Rome wasn't built in a day</span>.", "ex2_hl": "Rome wasn't built in a day", "ex2_th": "การสร้างมูลค่าแบรนด์ระดับโลกและความไว้วางใจของผู้บริโภคต้องอาศัยการดำเนินงานอย่างมุ่งมั่นยาวนานนับทศวรรษ ซึ่งแสดงให้เห็นว่าความสำเร็จอันยิ่งใหญ่ไม่อาจสร้างเสร็จได้ในวันเดียว", "slot_num": 33, "sheet_no": 1, "first_letter": "R"}, {"id": 34, "orig_slot": "#34", "idiom": "The early bird catches the worm", "meaning": "Early action brings advantages.", "thai_idiom": "คนตื่นเช้าได้เปรียบ / ใครเริ่มก่อนได้เปรียบ / นกที่ตื่นเช้าย่อมได้หนอน", "thai_meaning": "ผู้ที่เริ่มต้นลงมือทำสิ่งใดแต่เนิ่นๆ หรือตื่นแต่เช้า มักจะได้รับโอกาส โชค หรือผลประโยชน์ก่อนผู้อื่น", "ex1_en": "If you want to secure a prime camping spot near the lakefront, head out at dawn, because <span class=\"hl-teal\">the early bird catches the worm</span>.", "ex1_hl": "the early bird catches the worm", "ex1_th": "ถ้าเธออยากได้จุดกางเต็นท์ทำเลทองริมทะเลสาบ ให้เดินทางออกไปตั้งแต่เช้าตรู่ เพราะคนที่ไปก่อนย่อมได้เปรียบเสมอ", "ex2_en": "Venture funds that identified promising synthetic biology firms during their seed rounds reaped outsized returns, showing that <span class=\"hl-teal\">the early bird catches the worm</span>.", "ex2_hl": "the early bird catches the worm", "ex2_th": "กองทุนร่วมทุนที่เล็งเห็นศักยภาพของบริษัทชีววิทยาสังเคราะห์ตั้งแต่รอบระดมทุนตั้งต้นสามารถกอบโกยผลตอบแทนมหาศาล ซึ่งแสดงให้เห็นว่าผู้ที่เริ่มก่อนย่อมคว้าโอกาสทองได้ก่อนใคร", "slot_num": 34, "sheet_no": 1, "first_letter": "T"}, {"id": 35, "orig_slot": "#35", "idiom": "When pigs fly", "meaning": "Something that will probably never happen.", "thai_idiom": "ชาติหน้าตอนบ่ายๆ / ไม่มีวันเกิดขึ้น / ฝันไปเถอะ", "thai_meaning": "สิ่งที่เป็นไปไม่ได้ หรือไม่มีวันจะเกิดขึ้นอย่างแน่นอน", "ex1_en": "My older brother claims he will willingly surrender the television remote during the football championship, but that'll happen <span class=\"hl-teal\">when pigs fly</span>.", "ex1_hl": "when pigs fly", "ex1_th": "พี่ชายของฉันอ้างว่าเขาจะยอมสละรีโมตทีวีด้วยความเต็มใจระหว่างการแข่งขันฟุตบอลนัดชิงชนะเลิศ แต่นั่นคงจะเกิดขึ้นในชาติหน้าตอนบ่ายๆ เสียมากกว่า", "ex2_en": "Industry commentators remarked that rival tech giants will adopt open-source cross-platform standards only <span class=\"hl-teal\">when pigs fly</span>.", "ex2_hl": "when pigs fly", "ex2_th": "ผู้วิจารณ์ในอุตสาหกรรมให้ความเห็นว่า บริษัทยักษ์ใหญ่ด้านเทคโนโลยีที่เป็นคู่แข่งกันจะยอมเปิดใช้มาตรฐานข้ามแพลตฟอร์มแบบโอเพนซอร์ส ก็ต่อเมื่อชาติหน้าตอนบ่ายๆ เท่านั้น", "slot_num": 35, "sheet_no": 1, "first_letter": "W"}, {"id": 36, "orig_slot": "#36", "idiom": "A leopard can't change its spots", "meaning": "People often cannot change their basic nature.", "thai_idiom": "สันดอนขุดได้ สันดานขุดยาก / เสือไม่ทิ้งลาย", "thai_meaning": "คนเรามักไม่สามารถเปลี่ยนแปลงนิสัย สันดาน หรือธรรมชาติที่แท้จริงของตนเองได้", "ex1_en": "He swore he would stop spreading office gossip, but within forty-eight hours he was whispering rumors again—evidently, <span class=\"hl-teal\">a leopard can't change its spots</span>.", "ex1_hl": "a leopard can't change its spots", "ex1_th": "เขาสาบานว่าจะหยุดปล่อยข่าวลือนินทาในออฟฟิศ แต่พอผ่านไปไม่ถึง 48 ชั่วโมงก็กลับมาแอบซุบซิบอีก เห็นได้ชัดว่าสันดานคนเรามันเปลี่ยนกันยาก", "ex2_en": "The securities commission barred the trader from public offerings, concluding after repeated infractions that <span class=\"hl-teal\">a leopard can't change its spots</span>.", "ex2_hl": "a leopard can't change its spots", "ex2_th": "คณะกรรมการกำกับหลักทรัพย์และตลาดหลักทรัพย์มีคำสั่งห้ามนายหน้าค้ารายนี้ข้องเกี่ยวกับหลักทรัพย์สาธารณะ โดยสรุปหลังพบการกระทำผิดซ้ำซากว่านิสัยทุจริตย่อมยากจะเปลี่ยนแปลงได้", "slot_num": 36, "sheet_no": 1, "first_letter": "A"}, {"id": 37, "orig_slot": "#37", "idiom": "Two heads are better than one", "meaning": "Two people can solve a problem better together.", "thai_idiom": "สองหัวดีกว่าหัวเดียว", "thai_meaning": "การช่วยกันคิดสองคนย่อมแก้ปัญหาได้ดีกว่าทำคนเดียว", "ex1_en": "Why don't we assemble this flat-pack wardrobe together? After all, <span class=\"hl-teal\">two heads are better than one</span>.", "ex1_hl": "two heads are better than one", "ex1_th": "เรามาช่วยกันประกอบตู้เสื้อผ้าใบนี้ด้วยกันดีกว่าไหม ยังไงสองหัวก็ย่อมดีกว่าหัวเดียวอยู่แล้ว", "ex2_en": "Our lead software architect paired up with the security specialist to patch the vulnerability, proving once again that <span class=\"hl-teal\">two heads are better than one</span>.", "ex2_hl": "two heads are better than one", "ex2_th": "สถาปนิกซอฟต์แวร์หลักของเราจับคู่ทำงานร่วมกับผู้เชี่ยวชาญด้านความปลอดภัยเพื่ออุดช่องโหว่ของระบบ ซึ่งตอกย้ำอีกครั้งว่าการช่วยกันคิดย่อมดีกว่าทำคนเดียว", "slot_num": 37, "sheet_no": 1, "first_letter": "T"}, {"id": 38, "orig_slot": "#38", "idiom": "The tip of the iceberg", "meaning": "A small visible part of a much bigger problem.", "thai_idiom": "ยอดภูเขาน้ำแข็ง / ปัญหาที่เห็นแค่ผิวเผิน", "thai_meaning": "ส่วนเล็กๆ ที่ปรากฏให้เห็นของปัญหาขนาดใหญ่ที่ซ่อนอยู่ข้างใต้", "ex1_en": "The damp patch on the ceiling was only <span class=\"hl-teal\">the tip of the iceberg</span>; the plumber later discovered badly rotted pipes behind the drywall.", "ex1_hl": "the tip of the iceberg", "ex1_th": "รอยคราบน้ำชื้นบนฝ้าเพดานเป็นเพียงยอดภูเขาน้ำแข็งเท่านั้น เพราะช่างประปามาพบทีหลังว่าท่อหลังผนังผุพังเสียหายอย่างหนัก", "ex2_en": "Investigators warn that the initial financial discrepancy uncovered during the internal audit is just <span class=\"hl-teal\">the tip of the iceberg</span> regarding systemic fraud.", "ex2_hl": "the tip of the iceberg", "ex2_th": "คณะผู้ตรวจสอบเตือนว่า ยอดเงินที่ไม่สอดคล้องกันซึ่งพบในการตรวจสอบบัญชีภายในรอบแรกนั้นเป็นเพียงยอดภูเขาน้ำแข็งของการทุจริตเชิงระบบที่ซ่อนอยู่", "slot_num": 38, "sheet_no": 1, "first_letter": "T"}, {"id": 39, "orig_slot": "#39", "idiom": "Get cold feet", "meaning": "Become nervous before doing something.", "thai_idiom": "ปอดแหก / เกิดกลัวหรือลังเลขึ้นมากะทันหัน", "thai_meaning": "เกิดความประหม่าหรือหวาดกลัวจนลังเลที่จะทำสิ่งที่ตั้งใจไว้", "ex1_en": "Liam stood at the edge of the diving board for several minutes before <span class=\"hl-teal\">getting cold feet</span> and climbing back down the ladder.", "ex1_hl": "getting cold feet", "ex1_th": "เลียมยืนเก้ๆ กังๆ อยู่ตรงขอบสปริงบอร์ดอยู่หลายนาทีก่อนจะเกิดปอดแหกแล้วยอมปีนบันไดกลับลงมา", "ex2_en": "The venture capital firm <span class=\"hl-teal\">got cold feet</span> at the eleventh hour and pulled out of the acquisition deal due to market volatility.", "ex2_hl": "got cold feet", "ex2_th": "บริษัทร่วมทุนเกิดลังเลและถอนตัวจากดีลการเข้าซื้อกิจการในนาทีสุดท้ายเนื่องจากความผันผวนของตลาด", "slot_num": 39, "sheet_no": 1, "first_letter": "G"}, {"id": 40, "orig_slot": "#40", "idiom": "Keep an eye on", "meaning": "Watch carefully.", "thai_idiom": "จับตาดู / เฝ้าดูอย่างใกล้ชิด", "thai_meaning": "คอยสังเกตหรือดูแลอย่างระมัดระวังไม่ให้คลาดสายตา", "ex1_en": "Could you please <span class=\"hl-teal\">keep an eye on</span> the tomato soup simmering on the stove while I answer the front door?", "ex1_hl": "keep an eye on", "ex1_th": "ช่วยดูซุปมะเขือเทศที่เคี่ยวอยู่บนเตาให้หน่อยได้ไหมระหว่างที่ฉันออกไปเปิดประตูหน้าบ้าน", "ex2_en": "Senior analysts are <span class=\"hl-teal\">keeping an eye on</span> currency exchange fluctuations to hedge against unexpected import tariff hikes.", "ex2_hl": "keeping an eye on", "ex2_th": "เหล่านักวิเคราะห์อาวุโสกำลังจับตาดูความผันผวนของอัตราแลกเปลี่ยนเงินตราอย่างใกล้ชิดเพื่อป้องกันความเสี่ยงจากการปรับขึ้นภาษีนำเข้า", "slot_num": 40, "sheet_no": 1, "first_letter": "K"}, {"id": 41, "orig_slot": "#41", "idiom": "Keep your chin up", "meaning": "Stay positive.", "thai_idiom": "เชิดหน้าสู้ต่อไป / อย่าเพิ่งหมดกำลังใจ", "thai_meaning": "รักษาทัศนคติเชิงบวกและเข้มแข็งไว้ท่ามกลางอุปสรรค", "ex1_en": "I know failing your driving test today was discouraging, but <span class=\"hl-teal\">keep your chin up</span> and you will nail it next time.", "ex1_hl": "keep your chin up", "ex1_th": "ฉันรู้ว่าการสอบใบขับขี่ไม่ผ่านวันนี้มันน่าท้อใจ แต่เชิดหน้าสู้ไว้นะ เดี๋ยวรอบหน้าเธอต้องทำได้แน่นอน", "ex2_en": "Despite losing our primary enterprise client this quarter, the CEO urged the team to <span class=\"hl-teal\">keep their chins up</span> and focus on upcoming contract bids.", "ex2_hl": "keep their chins up", "ex2_th": "แม้ว่าบริษัทจะสูญเสียลูกค้ารายใหญ่ไปในไตรมาสนี้ แต่ซีอีโอก็กระตุ้นให้ทีมงานทุกคนอย่าเพิ่งหมดกำลังใจและหันไปมุ่งมั่นกับการประมูลสัญญาโครงการใหม่ๆ", "slot_num": 41, "sheet_no": 1, "first_letter": "K"}, {"id": 42, "orig_slot": "#42", "idiom": "Hang in there", "meaning": "Don't give up.", "thai_idiom": "อดทนไว้ / สู้ๆ นะ / อย่าเพิ่งยอมแพ้", "thai_meaning": "อดทนและมุ่งมั่นต่อไปแม้จะอยู่ในสถานการณ์ที่ยากลำบาก", "ex1_en": "Just <span class=\"hl-teal\">hang in there</span> for the last two kilometers; the finish line is right around the bend!", "ex1_hl": "hang in there", "ex1_th": "อดทนไว้อีกนิดแค่สองกิโลเมตรสุดท้ายเท่านั้น เส้นชัยอยู่ตรงหัวโค้งข้างหน้านี่เอง!", "ex2_en": "The departmental director acknowledged the heavy overtime workload and encouraged staff to <span class=\"hl-teal\">hang in there</span> until extra hires arrive next month.", "ex2_hl": "hang in there", "ex2_th": "ผู้อำนวยการฝ่ายยอมรับว่าภาระงานล่วงเวลาช่วงนี้หนักหน่วงมาก และให้กำลังใจพนักงานให้อดทนสู้ต่อไปจนกว่าจะมีพนักงานใหม่เข้ามาเสริมในเดือนหน้า", "slot_num": 42, "sheet_no": 1, "first_letter": "H"}, {"id": 43, "orig_slot": "#43", "idiom": "Give someone a hand", "meaning": "Help someone.", "thai_idiom": "ยื่นมือเข้าช่วย / ช่วยเหลือ", "thai_meaning": "ให้ความช่วยเหลือใครบางคนในการทำสิ่งใดสิ่งหนึ่ง", "ex1_en": "Seeing his elderly neighbor struggling with heavy grocery bags, Mark ran across the yard to <span class=\"hl-teal\">give her a hand</span>.", "ex1_hl": "give her a hand", "ex1_th": "เมื่อเห็นเพื่อนบ้านสูงวัยกำลังหิ้วถุงของสดใบโตอย่างทุลักทุเล มาร์กจึงรีบวิ่งข้ามสนามหญ้าไปช่วยเธอถือ", "ex2_en": "Could one of the junior graphic designers <span class=\"hl-teal\">give the marketing team a hand</span> with formatting the investor pitch deck before noon?", "ex2_hl": "give the marketing team a hand", "ex2_th": "มีกราฟิกดีไซเนอร์รุ่นน้องคนไหนพอจะยื่นมือมาช่วยทีมการตลาดจัดหน้าสไลด์นำเสนอสำหรับนักลงทุนให้เสร็จก่อนเที่ยงได้บ้างไหม", "slot_num": 43, "sheet_no": 1, "first_letter": "G"}, {"id": 44, "orig_slot": "#44", "idiom": "Make ends meet", "meaning": "Have enough money for basic needs.", "thai_idiom": "ชักหน้าให้ถึงหลัง / มีเงินพอประทังชีวิต", "thai_meaning": "หารายได้ให้เพียงพอกับค่าใช้จ่ายที่จำเป็นในชีวิตประจำวัน", "ex1_en": "With apartment rent soaring this year, Clara had to take on weekend babysitting shifts just to <span class=\"hl-teal\">make ends meet</span>.", "ex1_hl": "make ends meet", "ex1_th": "เมื่อค่าเช่าอพาร์ตเมนต์พุ่งสูงขึ้นในปีนี้ คลาราจำต้องรับงานพิเศษรับเลี้ยงเด็กในวันหยุดสุดสัปดาห์เพียงเพื่อให้มีเงินพอชักหน้าถึงหลัง", "ex2_en": "The economic survey revealed that rising inflation has made it increasingly difficult for minimum-wage households to <span class=\"hl-teal\">make ends meet</span>.", "ex2_hl": "make ends meet", "ex2_th": "ผลสำรวจทางเศรษฐกิจเผยว่า ภาวะเงินเฟ้อที่พุ่งสูงส่งผลให้ครัวเรือนที่มีรายได้ขั้นต่ำต้องด "id": 47, "orig_slot": "#47", "idiom": "Go with the flow", "meaning": "Accept things as they happen.", "thai_idiom": "ปล่อยให้เป็นไปตามน้ำ / ไหลตามน้ำ / ยืดหยุ่นตามสถานการณ์", "thai_meaning": "ยอมรับและปรับตัวตามสถานการณ์ที่เกิดขึ้นโดยไม่ฝืนหรือขัดขืน", "ex1_en": "When flight delays ruined our detailed itinerary in Rome, we decided to just relax and <span class=\"hl-teal\">go with the flow</span>.", "ex1_hl": "go with the flow", "ex1_th": "เมื่อเที่ยวบินดีเลย์จนทำให้แผนเที่ยวกรุงโรมที่วางไว้อย่างละเอียดพังไม่เป็นท่า เราจึงตัดสินใจผ่อนคลายและปล่อยให้ทุกอย่างเป็นไปตามน้ำ", "ex2_en": "During sudden agile sprint reorganizations, project leads who know how to <span class=\"hl-teal\">go with the flow</span> handle client scope changes far more effectively.", "ex2_hl": "go with the flow", "ex2_th": "ในระหว่างการปรับโครงสร้างการทำงานแบบ Agile อย่างกะทันหัน หัวหน้าโครงการที่รู้จักยืดหยุ่นและปรับตัวตามสถานการณ์จะรับมือกับการเปลี่ยนขอบเขตงานของลูกค้าได้ดีกว่ามาก", "slot_num": 47, "sheet_no": 1, "first_letter": "G"}, {"id": 48, "orig_slot": "#48", "idiom": "Cut corners", "meaning": "Do something cheaply or carelessly.", "thai_idiom": "มักง่าย / ลักไก่ / ลดขั้นตอนเพื่อประหยัดเงินหรือเวลา", "thai_meaning": "ทำบางสิ่งแบบลวกๆ หรือลดทอนขั้นตอนสำคัญเพื่อประหยัดงบหรือเวลาจนทำให้คุณภาพหรือความปลอดภัยลดลง", "ex1_en": "Never <span class=\"hl-teal\">cut corners</span> when chilling the pastry dough, or your pie crust will turn out soggy instead of flaky.", "ex1_hl": "cut corners", "ex1_th": "อย่าแอบลักไก่ลดเวลาพักแป้งพายในตู้เย็นเด็ดขาด ไม่อย่างนั้นแป้งพายจะแฉะแทนที่จะกรอบร่วนเป็นชั้น", "ex2_en": "The construction contractor faced heavy regulatory penalties for <span class=\"hl-teal\">cutting corners</span> on foundation reinforcement materials.", "ex2_hl": "cutting corners", "ex2_th": "ผู้รับเหมาก่อสร้างถูกลงโทษทางกฎหมายอย่างหนักฐานมักง่ายและลดสเปกวัสดุเสริมโครงสร้างฐานรากเพื่อประหยัดต้นทุน", "slot_num": 48, "sheet_no": 1, "first_letter": "C"}, {"id": 49, "orig_slot": "#49", "idiom": "Take it easy", "meaning": "Relax.", "thai_idiom": "ใจเย็นๆ / พักผ่อนสบายๆ / ไม่ต้องรีบร้อน", "thai_meaning": "ผ่อนคลาย พักผ่อน หรือทำอะไรอย่างสบายๆ ไม่เคร่งเครียด", "ex1_en": "After recovering from the flu, Emily spent Sunday afternoon on the couch listening to music and <span class=\"hl-teal\">taking it easy</span>.", "ex1_hl": "taking it easy", "ex1_th": "หลังจากหายจากไข้หวัดใหญ่ เอมิลี่ก็ใช้เวลาช่วงบ่ายวันอาทิตย์นอนฟังเพลงบนโซฟาและพักผ่อนแบบสบายๆ", "ex2_en": "The company doctor advised the overworked chief financial officer to <span class=\"hl-teal\">take it easy</span> and delegate quarterly reporting duties to reduce stress.", "ex2_hl": "take it easy", "ex2_th": "แพทย์ประจำบริษัทแนะนำให้ประธานเจ้าหน้าที่ฝ่ายการเงินที่ทำงานหนักเกินไปเพลาๆ งานลงบ้าง และมอบหมายการทำรายงานประจำไตรมาสให้ผู้อื่นเพื่อลดความเครียด", "slot_num": 49, "sheet_no": 1, "first_letter": "T"}, {"id": 50, "orig_slot": "#50", "idiom": "Take the bull by the horns", "meaning": "Deal with a difficult situation directly.", "thai_idiom": "กล้าเผชิญหน้ากับปัญหา / จัดการปัญหาอย่างเด็ดขาดตรงไปตรงมา", "thai_meaning": "ตัดสินใจรับมือหรือจัดการกับปัญหาที่ยากลำบากอย่างกล้าหาญและตรงไปตรงมา", "ex1_en": "Tired of perpetual chore disputes, Marcus decided to <span class=\"hl-teal\">take the bull by the horns</span> and call a house meeting to draft a fair cleaning roster.", "ex1_hl": "take the bull by the horns", "ex1_th": "เมื่อเบื่อหน่ายกับการเกี่ยงงานบ้านกันไม่หยุดหย่อน มาร์คัสจึงตัดสินใจชนกับปัญหาตรงๆ โดยเรียกประชุมคนในบ้านเพื่อร่างตารางเวรทำความสะอาดที่ยุติธรรม", "ex2_en": "The new managing director <span class=\"hl-teal\">took the bull by the horns</span> by openly addressing falling product reviews and recalling defective batches.", "ex2_hl": "took the bull by the horns", "ex2_th": "กรรมการผู้จัดการคนใหม่ตัดสินใจเผชิญหน้ากับปัญหาอย่างเด็ดขาด ด้วยการออกมายอมรับเรื่องรีวิวสินค้าที่ตกต่ำอย่างเปิดเผยและสั่งเรียกรุ่นสินค้าที่มีตำหนิคืนทันที", "slot_num": 50, "sheet_no": 1, "first_letter": "T"}, {"id": 51, "orig_slot": "#51", "idiom": "A storm in a teacup", "meaning": "A lot of fuss about a small problem.", "thai_idiom": "พายุในถ้วยชา / ทำเรื่องขี้ปะติ๋วให้เป็นเรื่องใหญ่ / ตีโพยตีพายเกินเหตุ", "thai_meaning": "ความวุ่นวายหรือความวิตกกังวลใหญ่โตที่เกิดขึ้นจากเรื่องเล็กน้อยไร้สาระ", "ex1_en": "Their heated argument over who forgot to refill the Brita filter turned out to be just <span class=\"hl-teal\">a storm in a teacup</span> once they laughed it off.", "ex1_hl": "a storm in a teacup", "ex1_th": "การโต้เถียงกันอย่างดุเดือดว่าใครลืมเติมน้ำใส่เหยือกกรองน้ำกลายเป็นเพียงเรื่องขี้ปะติ๋วที่ตีโพยตีพายกันไปเอง พอพวกเขาหัวเราะให้มันเรื่องก็จบลง", "ex2_en": "Management assured investors that the brief software glitch on launch day was merely <span class=\"hl-teal\">a storm in a teacup</span> with zero data loss.", "ex2_hl": "a storm in a teacup", "ex2_th": "ฝ่ายบริหารสร้างความมั่นใจแก่เหล่านักลงทุนว่า ระบบขัดข้องชั่วครู่ในวันเปิดตัวเป็นเพียงเรื่องเล็กน้อยที่ตื่นตระหนกกันไปเอง และไม่มีข้อมูลใดๆ สูญหายทั้งสิ้น", "slot_num": 51, "sheet_no": 1, "first_letter": "A"}, {"id": 52, "orig_slot": "#52", "idiom": "Come rain or shine", "meaning": "Whatever happens.", "thai_idiom": "ไม่ว่าจะเกิดอะไรขึ้นก็ตาม / แดดจะออกฝนจะตกก็ไม่หวั่น", "thai_meaning": "ไม่ว่าจะเกิดอุปสรรคใดหรือสภาพอากาศจะเป็นอย่างไรก็จะทำสิ่งนั้นแน่นอน", "ex1_en": "My grandfather goes for a thirty-minute brisk walk in the park every morning, <span class=\"hl-teal\">come rain or shine</span>.", "ex1_hl": "come rain or shine", "ex1_th": "คุณปู่ของฉันจะออกไปเดินเร็วในสวนสาธารณะเป็นเวลาสามสิบนาทีทุกเช้า ไม่ว่าฝนจะตกหรือแดดจะออกก็ตาม", "ex2_en": "Our delivery dispatch network guarantees next-day parcel arrival across the metropolitan area, <span class=\"hl-teal\">come rain or shine</span>.", "ex2_hl": "come rain or shine", "ex2_th": "เครือข่ายการจัดส่งพัสดุของเรารับประกันว่าจะส่งถึงปลายทางทั่วเขตปริมณฑลภายในวันถัดไปอย่างแน่นอน ไม่ว่าจะเกิดอะไรขึ้นก็ตาม", "slot_num": 52, "sheet_no": 1, "first_letter": "C"}, {"id": 53, "orig_slot": "#53", "idiom": "Rain cats and dogs", "meaning": "Rain very heavily.", "thai_idiom": "ฝนตกหนักไม่ลืมหูลืมตา / ฝนตกกระหน่ำฟ้ารั่ว", "thai_meaning": "ฝนตกกระหน่ำลงมาอย่างหนักหน่วงและรุนแรงมาก", "ex1_en": "We had just set up the backyard grill when it started to <span class=\"hl-teal\">rain cats and dogs</span>, forcing everyone to dash inside.", "ex1_hl": "rain cats and dogs", "ex1_th": "เราเพิ่งตั้งเตาบาร์บีคิวหลังบ้านเสร็จแท้ๆ ฝนก็ดันเทลงมาอย่างไม่ลืมหูลืมตา จนทุกคนต้องวิ่งหนีเตลิดเข้าบ้าน", "ex2_en": "Airport operations were halted for three hours yesterday because it was <span class=\"hl-teal\">raining cats and dogs</span>, dropping runway visibility near zero.", "ex2_hl": "raining cats and dogs", "ex2_th": "การปฏิบัติการของสนามบินต้องหยุดชะงักลงเป็นเวลาสามชั่วโมงเมื่อวานนี้ เนื่องจากฝนตกหนักฟ้ารั่วจนทัศนวิสัยบนรันเวย์ลดลงเกือบเป็นศูนย์", "slot_num": 53, "sheet_no": 1, "first_letter": "R"}, {"id": 54, "orig_slot": "#54", "idiom": "Save for a rainy day", "meaning": "Save money for future problems.", "thai_idiom": "เก็บหอมรอมริบไว้เผื่อฉุกเฉิน / เก็บออมไว้ใช้ยามยาก", "thai_meaning": "เก็บออมเงินหรือทรัพยากรสำรองไว้ใช้ในยามคับขันหรือเกิดเหตุการณ์ไม่คาดฝันในอนาคต", "ex1_en": "I always put aside fifty dollars from my paycheck to <span class=\"hl-teal\">save for a rainy day</span>, which rescued me when my transmission failed.", "ex1_hl": "save for a rainy day", "ex1_th": "ฉันมักจะเจียดเงิน 50 ดอลลาร์จากเงินเดือนมาหยอดกระปุกเก็บไว้เผื่อฉุกเฉินเสมอ ซึ่งมันก็ช่วยชีวิตฉันไว้จริงๆ ตอนที่เกียร์รถพัง", "ex2_en": "Conservative institutional investors prefer firms that maintain robust cash reserves to <span class=\"hl-teal\">save for a rainy day</span> during broader economic recessions.", "ex2_hl": "save for a rainy day", "ex2_th": "นักลงทุนสถาบันสายอนุรักษนิยมมักชื่นชอบบริษัทที่รักษากระแสเงินสดสำรองไว้อย่างแข็งแกร่ง เพื่อสำรองไว้ใช้ยามยากท่ามกลางภาวะเศรษฐกิจถดถอย", "slot_num": 54, "sheet_no": 1, "first_letter": "S"}, {"id": 55, "orig_slot": "#55", "idiom": "Steal someone's thunder", "meaning": "Take attention or credit from someone.", "thai_idiom": "แย่งซีน / ชิงตัดหน้าเอาหน้าเอาผลงานไปคนเดียว", "thai_meaning": "แย่งความสนใจหรือความโดดเด่นไปจากผู้อื่น โดยเฉพาะการตัดหน้าประกาศข่าวดีหรือนำเสนอสิ่งเดียวกันก่อน", "ex1_en": "Sophia was furious when her sister announced her own pregnancy at Sophia's engagement dinner, completely <span class=\"hl-teal\">stealing her thunder</span>.", "ex1_hl": "stealing her thunder", "ex1_th": "โซเฟียโมโหมากเมื่อพี่สาวดันประกาศเรื่องตั้งครรภ์กลางงานเลี้ยงหมั้นของเธอ จนแย่งซีนความสนใจไปหมดเกลี้ยง", "ex2_en": "A rival tech startup <span class=\"hl-teal\">stole the firm's thunder</span> by unveiling a similar artificial intelligence tool two days before our scheduled keynote.", "ex2_hl": "stole the firm's thunder", "ex2_th": "สตาร์ทอัพคู่แข่งชิงตัดหน้าแย่งซีนไปเต็มๆ ด้วยการเปิดตัวเครื่องมือ AI ที่คล้ายคลึงกันเพียงสองวันก่อนหน้างานแถลงข่าวใหญ่ของเรา", "slot_num": 55, "sheet_no": 1, "first_letter": "S"}, {"id": 56, "orig_slot": "#56", "idiom": "Throw in the towel", "meaning": "Give up.", "thai_idiom": "ยอมแพ้ / ยอมยกธงขาว / ถอดใจ", "thai_meaning": "ยอมรับความพ่ายแพ้หรือยอมจำนน ล้มเลิกความพยายามในการทำสิ่งใดสิ่งหนึ่ง", "ex1_en": "After wrestling with the unreadable instructions for four hours, Dave finally <span class=\"hl-teal\">threw in the towel</span> and phoned a professional handyman.", "ex1_hl": "threw in the towel", "ex1_th": "หลังจากปล้ำกับคู่มือที่อ่านไม่รู้เรื่องอยู่นานถึงสี่ชั่วโมง ในที่สุดเดฟก็ยอมยกธงขาวแล้วโทรเรียกช่างซ่อมมืออาชีพมาแทน", "ex2_en": "Facing consecutive regulatory rejections and depleted funding, the biotech venture had no choice but to <span class=\"hl-teal\">throw in the towel</span>.", "ex2_hl": "throw in the towel", "ex2_th": "เมื่อต้องเผชิญกับการถูกปฏิเสธจากหน่วยงานกำกับดูแลซ้ำแล้วซ้ำเล่าและเงินทุนร่อยหรอ บริษัทไบโอเทคจึงไม่มีทางเลือกอื่นนอกจากต้องยอมแพ้และยุติกิจการ", "slot_num": 56, "sheet_no": 1, "first_letter": "T"}, {"id": 57, "orig_slot": "#57", "idiom": "Throw caution to the wind", "meaning": "Take a risk.", "thai_idiom": "เสี่ยงเป็นเสี่ยงกัน / ไม่สนหน้าอินทร์หน้าพรหม / กล้าได้กล้าเสีย", "thai_meaning": "ตัดสินใจทำบางสิ่งโดยไม่คำนึงถึงความเสี่ยงหรือผลเสียที่อาจตามมา", "ex1_en": "Instead of following his strict monthly budget, Jeremy <span class=\"hl-teal\">threw caution to the wind</span> and booked a spontaneous weekend ski trip to Colorado.", "ex1_hl": "threw caution to the wind", "ex1_th": "แทนที่จะรัดเข็มขัดตามงบรายเดือนที่ตั้งไว้ เจเรมีกลับตัดสินใจเสี่ยงเป็นเสี่ยงกันด้วยการจองทริปไปเล่นสกีสุดสัปดาห์ที่โคโลราโดแบบกะทันหัน", "ex2_en": "The board decided to <span class=\"hl-teal\">throw caution to the wind</span> by shifting fifty percent of the annual research budget toward autonomous drone technology.", "ex2_hl": "throw caution to the wind", "ex2_th": "คณะกรรมการบริษัทตัดสินใจทุ่มสุดตัวยอมรับความเสี่ยง โดยโยกงบประมาณการวิจัยประจำปีถึงร้อยละห้าสิบไปพัฒนาเทคโนโลยีโดรนไร้คนขับ", "slot_num": 57, "sheet_no": 1, "first_letter": "T"}, {"id": 58, "orig_slot": "#58", "idiom": "Get out of hand", "meaning": "Become difficult to control.", "thai_idiom": "บานปลาย / เกินจะควบคุม / หลุดมือ", "thai_meaning": "สูญเสียการควบคุมหรือสถานการณ์ทวีความรุนแรงจนยากที่จะจัดการ", "ex1_en": "The birthday celebration started peacefully, but things <span class=\"hl-teal\">got out of hand</span> when uninvited guests arrived and blasted loud music.", "ex1_hl": "got out of hand", "ex1_th": "งานเลี้ยงวันเกิดเริ่มต้นอย่างสงบเรียบร้อย แต่สถานการณ์กลับเริ่มบานปลายเมื่อมีแขกไม่ได้รับเชิญโผล่มาแล้วเปิดเพลงเสียงดังลั่น", "ex2_en": "Factory security stepped in before tensions between striking workers and replacement drivers could <span class=\"hl-teal\">get out of hand</span>.", "ex2_hl": "get out of hand", "ex2_th": "หน่วยรักษาความปลอดภัยของโรงงานรีบเข้าแทรกแซงก่อนที่ความตึงเครียดระหว่างคนงานที่ประท้วงหยุดงานกับคนขับรถรับจ้างชั่วคราวจะบานปลายจนควบคุมไม่อยู่", "slot_num": 58, "sheet_no": 1, "first_letter": "G"}, {"id": 59, "orig_slot": "#59", "idiom": "Go down in flames", "meaning": "Fail badly.", "thai_idiom": "ล้มเหลวไม่เป็นท่า / พังยับเยิน / ดับวูบ", "thai_meaning": "ประสบความล้มเหลวอย่างสิ้นเชิงและน่าอับอายอย่างยิ่ง", "ex1_en": "My ambitious attempt to bake a three-tier wedding cake <span class=\"hl-teal\">went down in flames</span> when the middle layer collapsed right before serving.", "ex1_hl": "went down in flames", "ex1_th": "ความพยายามครั้งใหญ่ของฉันที่จะอบเค้กแต่งงานสามชั้นพังยับเยินไม่เป็นท่า เมื่อชั้นตรงกลางทรุดฮวบลงมาก่อนเสิร์ฟเพียงนิดเดียว", "ex2_en": "The luxury brand's tone-deaf advertising campaign <span class=\"hl-teal\">went down in flames</span> across social media, wiping millions off its market valuation.", "ex2_hl": "went down in flames", "ex2_th": "แคมเปญโฆษณาที่ไม่แคร์ความรู้สึกสังคมของแบรนด์หรูพังไม่เป็นท่าบนโซเชียลมีเดีย จนมูลค่าตลาดของบริษัทสูญหายไปหลายล้านดอลลาร์", "slot_num": 59, "sheet_no": 1, "first_letter": "G"}, {"id": 60, "orig_slot": "#60", "idiom": "On the same page", "meaning": "Have the same understanding.", "thai_idiom": "เข้าใจตรงกัน / เห็นพ้องต้องกัน", "thai_meaning": "มีความเข้าใจในข้อมูล ข้อตกลง หรือเป้าหมายตรงกัน", "ex1_en": "Let's review the road trip itinerary tonight so we are all <span class=\"hl-teal\">on the same page</span> about departure times tomorrow morning.", "ex1_hl": "on the same page", "ex1_th": "คืนนี้เรามาตรวจดูแผนการเดินทางกันอีกรอบดีกว่า เพื่อให้ทุกคนเข้าใจตรงกันเรื่องเวลาออกเดินทางในเช้าวันพรุ่งนี้", "ex2_en": "Before sending the contract draft to external counsel, the sales and legal teams held a briefing to ensure everyone was <span class=\"hl-teal\">on the same page</span>.", "ex2_hl": "on the same page", "ex2_th": "ก่อนจะส่งร่างสัญญาไปให้ที่ปรึกษากฎหมายภายนอก ทีมฝ่ายขายและฝ่ายกฎหมายได้ประชุมสรุปเพื่อให้แน่ใจว่าทุกคนมีความเข้าใจตรงกันทุกข้อกำหนด", "slot_num": 60, "sheet_no": 1, "first_letter": "O"}, {"id": 61, "orig_slot": "#61", "idiom": "Read between the lines", "meaning": "Find a hidden meaning.", "thai_idiom": "อ่านความนัย / ตีความสิ่งที่ซ่อนอยู่ระหว่างบรรทัด", "thai_meaning": "จับใจความหรือเข้าใจความหมายที่ซ่อนอยู่แม้จะไม่ได้ถูกเอ่ยออกมาตรงๆ", "ex1_en": "She texted saying she was fine, but if you <span class=\"hl-teal\">read between the lines</span>, you could tell she was deeply upset.", "ex1_hl": "read between the lines", "ex1_th": "เธอส่งข้อความมาบอกว่าไม่เป็นไร แต่ถ้าลองอ่านความนัยดู จะรู้ได้ทันทีว่าเธอกำลังเสียใจอย่างมาก", "ex2_en": "Financial analysts had to <span class=\"hl-teal\">read between the lines</span> of the central bank governor's vague speech to anticipate the impending interest rate hike.", "ex2_hl": "read between the lines", "ex2_th": "เหล่านักวิเคราะห์การเงินต้องตีความนัยที่ซ่อนอยู่เบื้องหลังสุนทรพจน์ที่คลุมเครือของผู้ว่าการธนาคารกลาง เพื่อคาดการณ์การปรับขึ้นอัตราดอกเบี้ยที่กำลังจะมาถึง", "slot_num": 61, "sheet_no": 1, "first_letter": "R"}, {"id": 62, "orig_slot": "#62", "idiom": "See eye to eye", "meaning": "Agree completely.", "thai_idiom": "เห็นพ้องต้องกัน / มีความคิดเห็นตรงกัน", "thai_meaning": "มีความคิดเห็น ทัศนคติ หรือมุมมองที่สอดคล้องตรงกันอย่างสมบูรณ์", "ex1_en": "My husband and I rarely <span class=\"hl-teal\">see eye to eye</span> on interior decorating, especially when picking living room paint colors.", "ex1_hl": "see eye to eye", "ex1_th": "ฉันกับสามีแทบจะไม่เคยมีความคิดเห็นตรงกันเรื่องการตกแต่งภายในบ้านเลย โดยเฉพาะเวลาที่ต้องเลือกสีทาห้องนั่งเล่น", "ex2_en": "Management and labor union representatives failed to <span class=\"hl-teal\">see eye to eye</span> regarding the annual pension contribution adjustments.", "ex2_hl": "see eye to eye", "ex2_th": "ฝ่ายบริหารและตัวแทนสหภาพแรงงานไม่สามารถตกลงเห็นพ้องต้องกันได้ในเรื่องการปรับเพิ่มเงินสมทบกองทุนบำนาญประจำปี", "slot_num": 62, "sheet_no": 1, "first_letter": "S"}, {"id": 63, "orig_slot": "#63", "idiom": "Through thick and thin", "meaning": "In good and bad times.", "thai_idiom": "ร่วมทุกข์ร่วมสุข / เคียงบ่าเคียงไหล่ในทุกสถานการณ์", "thai_meaning": "อยู่เคียงข้างกันเสมอไม่ว่าจะต้องเผชิญกับช่วงเวลาที่ดีหรือเลวร้ายเพียงใด", "ex1_en": "Hannah and I have been best friends since kindergarten, standing by each other <span class=\"hl-teal\">through thick and thin</span>.", "ex1_hl": "through thick and thin", "ex1_th": "ฮันนาห์กับฉันเป็นเพื่อนสนิทกันมาตั้งแต่อนุบาล และคอยยืนเคียงข้างร่วมทุกข์ร่วมสุขกันมาโดยตลอด", "ex2_en": "The founding engineers remained loyal to the startup <span class=\"hl-teal\">through thick and thin</span>, enduring months without salaries until profitability arrived.", "ex2_hl": "through thick and thin", "ex2_th": "ทีมวิศวกรผู้ร่วมก่อตั้งยังคงภักดีต่อบริษัทสตาร์ทอัพร่วมทุกข์ร่วมสุขกันมา ยอมอดทนไม่รับเงินเดือนหลายเดือนจนกระทั่งบริษัทเริ่มทำกำไรได้", "slot_num": 63, "sheet_no": 1, "first_letter": "T"}, {"id": 64, "orig_slot": "#64", "idiom": "By the book", "meaning": "According to the rules.", "thai_idiom": "ตามตำรา / เคร่งครัดตามกฎระเบียบ / เป๊ะตามระเบียบ", "thai_meaning": "ปฏิบัติตามกฎเกณฑ์ ระเบียบ หรือขั้นตอนที่กำหนดไว้อย่างเคร่งครัดและตรงไปตรงมา", "ex1_en": "My brother insists on playing Monopoly strictly <span class=\"hl-teal\">by the book</span>, refusing to allow any house rules about Free Parking money.", "ex1_hl": "by the book", "ex1_th": "พี่ชายของฉันยืนกรานที่จะเล่นเกมเศรษฐีตามกฎในคู่มือเป๊ะๆ และไม่ยอมให้มีกฎพิเศษของบ้านเรื่องเงินในช่องที่จอดรถฟรีเด็ดขาด", "ex2_en": "The aviation safety inspector conducted the aircraft pre-flight review strictly <span class=\"hl-teal\">by the book</span> to guarantee passenger safety.", "ex2_hl": "by the book", "ex2_th": "เจ้าหน้าที่ตรวจสอบความปลอดภัยทางการบินดำเนินการตรวจเช็กเครื่องบินก่อนขึ้นบินอย่างเคร่งครัดตามระเบียบทุกขั้นตอนเพื่อรับประกันความปลอดภัยของผู้โดยสาร", "slot_num": 64, "sheet_no": 1, "first_letter": "B"}, {"id": 65, "orig_slot": "#65", "idiom": "Learn the ropes", "meaning": "Learn how something works.", "thai_idiom": "เรียนรู้งาน / ศึกษาวิธีการทำงานเบื้องต้น", "thai_meaning": "เรียนรู้ขั้นตอน วิธีการ หรือทักษะพื้นฐานในการปฏิบัติงานหรือสิ่งใหม่ๆ", "ex1_en": "It took me a couple of Saturdays to <span class=\"hl-teal\">learn the ropes</span> at the animal rescue shelter, from cleaning kennels to feeding schedules.", "ex1_hl": "learn the ropes", "ex1_th": "ฉันต้องใช้เวลาช่วงวันเสาร์สองสามสัปดาห์เพื่อเรียนรู้งานที่ศูนย์พักพิงสัตว์ ตั้งแต่วิธีทำความสะอาดกรงไปจนถึงตารางเวลาให้อาหาร", "ex2_en": "During her initial probationary month, the associate shadowed senior accountants to <span class=\"hl-teal\">learn the ropes</span> of corporate tax filing.", "ex2_hl": "learn the ropes", "ex2_th": "ในช่วงเดือนแรกของการทดลองงาน พนักงานใหม่ได้ติดตามดูงานจากนักบัญชีรุ่นพี่เพื่อเรียนรู้งานและขั้นตอนการยื่นภาษีนิติบุคคล", "slot_num": 65, "sheet_no": 1, "first_letter": "L"}, {"id": 66, "orig_slot": "#66", "idiom": "Know the ropes", "meaning": "Know how something works.", "thai_idiom": "เจนจัดในงาน / รู้ทางหนีทีไล่ / ช่ำชองงาน", "thai_meaning": "มีความเชี่ยวชาญ เข้าใจรายละเอียดและขั้นตอนการทำงานอย่างทะลุปรุโปร่ง", "ex1_en": "Whenever we visit Tokyo, we ask Kenji to guide us because he truly <span class=\"hl-teal\">knows the ropes</span> when navigating the complex subway system.", "ex1_hl": "knows the ropes", "ex1_th": "เวลาเราไปเที่ยวโตเกียว เรามักจะให้เคนจิเป็นคนนำทางเสมอ เพราะเขาช่ำชองและรู้ทางหนีทีไล่ในการขึ้นรถไฟใต้ดินที่ซับซ้อนเป็นอย่างดี", "ex2_en": "Assigning the enterprise rollout to a veteran director who already <span class=\"hl-teal\">knows the ropes</span> ensured the implementation met strict compliance deadlines.", "ex2_hl": "knows the ropes", "ex2_th": "การมอบหมายโครงการระดับองค์กรให้แก่ผู้อำนวยการรุ่นเก๋าที่เจนจัดในงานอยู่แล้ว ช่วยรับประกันได้ว่าการดำเนินงานจะเป็นไปตามกำหนดเวลาการปฏิบัติตามกฎเกณฑ์อย่างเคร่งครัด", "slot_num": 66, "sheet_no": 1, "first_letter": "K"}, {"id": 67, "orig_slot": "#67", "idiom": "A rule of thumb", "meaning": "A practical general guideline.", "thai_idiom": "หลักเกณฑ์คร่าวๆ / กฎโดยประมาณ / แนวทางปฏิบัติทั่วไป", "thai_meaning": "หลักการหรือแนวทางปฏิบัติทั่วไปที่ใช้เป็นเกณฑ์ตัดสินใจได้อย่างสะดวกรวดเร็ว แม้จะไม่แม่นยำร้อยเปอร์เซ็นต์", "ex1_en": "As <span class=\"hl-teal\">a rule of thumb</span>, you should use about one liter of salted water for every one hundred grams of dry pasta.", "ex1_hl": "a rule of thumb", "ex1_th": "ตามหลักเกณฑ์คร่าวๆ ทั่วไป คุณควรใช้น้ำต้มผสมเกลือประมาณหนึ่งลิตรต่อเส้นพาสต้าแห้งทุกๆ หนึ่งร้อยกรัม", "ex2_en": "Mortgage brokers often rely on the conservative <span class=\"hl-teal\">rule of thumb</span> that monthly housing payments should never exceed twenty-eight percent of gross income.", "ex2_hl": "rule of thumb", "ex2_th": "นายหน้าสินเชื่อบ้านมักยึดถือแนวทางปฏิบัติทั่วไปแบบอนุรักษนิยมที่ว่า ค่างวดบ้านต่อเดือนไม่ควรเกินร้อยละ 28 ของรายได้รวมก่อนหักภาษี", "slot_num": 67, "sheet_no": 1, "first_letter": "A"}, {"id": 68, "orig_slot": "#68", "idiom": "In a nutshell", "meaning": "In a very brief form.", "thai_idiom": "สรุปสั้นๆ / พูดง่ายๆ ได้ใจความ / สรุปย่อๆ", "thai_meaning": "การอธิบายหรือสรุปเนื้อหาใจความสำคัญอย่างกระชับรวบรัด", "ex1_en": "<span class=\"hl-teal\">In a nutshell</span>, the documentary is about a reclusive painter who secretly restored centuries-old abandoned churches.", "ex1_hl": "In a nutshell", "ex1_th": "สรุปสั้นๆ ก็คือ สารคดีเรื่องนี้เล่าถึงจิตรกรผู้รักสันโดษที่แอบบูรณะโบสถ์ร้างอายุนับร้อยปีอย่างลับๆ", "ex2_en": "The chief economist summarized the lengthy white paper by stating that, <span class=\"hl-teal\">in a nutshell</span>, market deregulation would accelerate regional manufacturing growth.", "ex2_hl": "in a nutshell", "ex2_th": "หัวหน้านักเศรษฐศาสตร์สรุปรายงานวิชาการเล่มหนาให้เข้าใจง่ายๆ สั้นๆ ว่า การผ่อนคลายกฎระเบียบของตลาดจะช่วยเร่งการเติบโตของภาคการผลิตในภูมิภาค", "slot_num": 68, "sheet_no": 1, "first_letter": "I"}, {"id": 69, "orig_slot": "#69", "idiom": "Get the hang of it", "meaning": "Learn how to do something.", "thai_idiom": "จับจุดได้ / เริ่มคุ้นมือ / เริ่มคล่อง", "thai_meaning": "เริ่มเข้าใจเทคนิคหรือวิธีการทำสิ่งใดสิ่งหนึ่งจนเริ่มทำได้อย่างคล่องแคล่ว", "ex1_en": "Rollerblading felt awkward and terrifying at first, but Lucas began to <span class=\"hl-teal\">get the hang of it</sp n class=\"hl-teal\">bring home the bacon</span>.", "ex1_hl": "bring home the bacon", "ex1_th": "ในระหว่างที่คู่ชีวิตลาหยุดเพื่อดูแลลูกแฝด ซาร่าห์ก็ทำงานล่วงเวลาเพื่อหาเงินมาจุนเจือครอบครัว", "ex2_en": "Our newly launched cloud subscription service is currently <span class=\"hl-teal\">bringing home the bacon</span> for the entire software division.", "ex2_hl": "bringing home the bacon", "ex2_th": "บริการระบบคลาวด์แบบสมัครสมาชิกที่เพิ่งเปิดตัวใหม่นี้กำลังทำรายได้หลักหล่อเลี้ยงแผนกซอฟต์แวร์ทั้งหมดในขณะนี้", "slot_num": 80, "sheet_no": 1, "first_letter": "B"}, {"id": 81, "orig_slot": "#81", "idiom": "Butter someone up", "meaning": "Flatter someone.", "thai_idiom": "ประจบประแจง / เลียแข้งเลียขา / ปากหวานก้นเปรี้ยว", "thai_meaning": "พูดจายกยอหรือเอาอกเอาใจใครบางคนเพื่อหวังผลประโยชน์หรือขอความช่วยเหลือ", "ex1_en": "Stop trying to <span class=\"hl-teal\">butter me up</span> with compliments just because you want to borrow my car this weekend.", "ex1_hl": "butter me up", "ex1_th": "หยุดเอาอกเอาใจชมฉันไม่หยุดได้แล้ว รู้หรอกนะว่าทำดีด้วยเพราะอยากยืมรถไปใช้สุดสัปดาห์นี้น่ะ", "ex2_en": "Instead of attempting to <span class=\"hl-teal\">butter up</span> the hiring committee, focus on highlighting your measurable technical achievements.", "ex2_hl": "butter up", "ex2_th": "แทนที่จะมัวแต่ประจบเอาใจคณะกรรมการคัดเลือก ให้มุ่งเน้นการนำเสนอผลงานทางเทคนิคที่วัดผลได้อย่างเป็นรูปธรรมจะดีกว่า", "slot_num": 81, "sheet_no": 1, "first_letter": "B"}, {"id": 82, "orig_slot": "#82", "idiom": "Have bigger fish to fry", "meaning": "Have more important things to do.", "thai_idiom": "มีเรื่องสำคัญกว่าต้องทำ / มีภารกิจใหญ่กว่ารออยู่", "thai_meaning": "มีภาระหรือเรื่องอื่นที่สำคัญและเร่งด่วนกว่าให้ต้องไปจัดการ", "ex1_en": "I'm not going to argue over who forgot to wash the dishes; I <span class=\"hl-teal\">have bigger fish to fry</span> before my exam tomorrow.", "ex1_hl": "have bigger fish to fry", "ex1_th": "ฉันจะไม่มามัวเถียงเรื่องใครลืมล้างจานหรอกนะ ฉันยังมีเรื่องสำคัญกว่าต้องอ่านหนังสือก่อนสอบพรุ่งนี้", "ex2_en": "The legal team declined to pursue the minor copyright dispute because they <span class=\"hl-teal\">had bigger fish to fry</span> with the pending merger.", "ex2_hl": "had bigger fish to fry", "ex2_th": "ฝ่ายกฎหมายตัดสินใจไม่ฟ้องร้องข้อพิพาทลิขสิทธิ์เล็กๆ น้อยๆ นั้น เพราะพวกเขามีเรื่องใหญ่ที่สำคัญกว่ามากในการดูแลการควบรวมกิจการที่กำลังจะเกิดขึ้น", "slot_num": 82, "sheet_no": 1, "first_letter": "H"}, {"id": 83, "orig_slot": "#83", "idiom": "Take something with a grain of salt", "meaning": "Don't completely believe something.", "thai_idiom": "ฟังหูไว้หู / อย่าเพิ่งปักใจเชื่อ", "thai_meaning": "รับฟังข้อมูลไว้แต่ยังไม่เชื่อสนิทใจ ต้องใช้วิจารณญาณไตร่ตรองความจริง", "ex1_en": "Online customer reviews can be biased, so you should <span class=\"hl-teal\">take them with a grain of salt</span> before buying.", "ex1_hl": "take them with a grain of salt", "ex1_th": "รีวิวสินค้าบนอินเทอร์เน็ตอาจมีอคติได้ ดังนั้นเธอควรฟังหูไว้หูก่อนที่จะตัดสินใจซื้อ", "ex2_en": "Financial analysts advised investors to <span class=\"hl-teal\">take the competitor's optimistic forecast with a grain of salt</span> given ongoing supply chain disruptions.", "ex2_hl": "take the competitor's optimistic forecast with a grain of salt", "ex2_th": "นักวิเคราะห์การเงินแนะนำให้นักลงทุนฟังหูไว้หูกับตัวเลขคาดการณ์ในแง่ดีของคู่แข่ง เนื่องจากปัญหาการหยุดชะงักของห่วงโซ่อุปทานยังคงดำเนินอยู่", "slot_num": 83, "sheet_no": 1, "first_letter": "T"}, {"id": 84, "orig_slot": "#84", "idiom": "Cry over spilled milk", "meaning": "Worry about something that cannot be changed.", "thai_idiom": "คร่ำครวญกับเรื่องที่ผ่านไปแล้ว / เสียน้ำตากับแก้วที่แตกไปแล้ว", "thai_meaning": "มัวแต่เสียใจหรือกังวลกับความผิดพลาดในอดีตที่ไม่สามารถย้อนกลับไปแก้ไขได้", "ex1_en": "We dropped the birthday cake, but there's no use <span class=\"hl-teal\">crying over spilled milk</span>; let's just run to the bakery across the street.", "ex1_hl": "crying over spilled milk", "ex1_th": "เราทำเค้กวันเกิดหล่นพื้นไปแล้ว แต่มัวมานั่งเสียใจกับ iasm across the department.", "ex2_hl": "full of beans", "ex2_th": "ผู้อำนวยการระดับภูมิภาคคนใหม่เดินทางมาประชุมเปิดงานเช้าวันจันทร์ด้วยความกระตือรือร้นและมีชีวิตชีวาเต็มเปี่ยม จนปลุกพลังใจให้คนทั้งแผนก", "slot_num": 86, "sheet_no": 1, "first_letter": "F"}, {"id": 87, "orig_slot": "#87", "idiom": "In a pickle", "meaning": "In a difficult situation.", "thai_idiom": "ตกที่นั่งลำบาก / งานเข้า / ตกอยู่ในสถานการณ์กลืนไม่เข้าคายไม่ออก", "thai_meaning": "กำลังเผชิญกับปัญหาที่ยุ่งยาก ซับซ้อน หรือแก้ไขได้ลำบาก", "ex1_en": "I found myself <span class=\"hl-teal\">in a pickle</span> when my phone battery died right as I needed to show my boarding pass.", "ex1_hl": "in a pickle", "ex1_th": "ฉันเจองานเข้าเต็มๆ ตอนที่แบตมือถือดับวูบพอดีเป๊ะในจังหวะที่ต้องแสดงบัตรขึ้นเครื่อง", "ex2_en": "The manufacturing plant is <span class=\"hl-teal\">in a pickle</span> after international shipping bottlenecks halted deliveries of essential microchips.", "ex2_hl": "in a pickle", "ex2_th": "โรงงานผลิตกำลังตกที่นั่งลำบากอย่างหนัก หลังจากปัญหาคอขวดของการขนส่งระหว่างประเทศทำให้การส่งมอบไมโครชิปตัวสำคัญต้องหยุดชะงัก", "slot_num": 87, "sheet_no": 1, "first_letter": "I"}, {"id": 88, "orig_slot": "#88", "idiom": "Bite off more than you can chew", "meaning": "Take on too much.", "thai_idiom": "ทำเกินกำลัง / หาเหาใส่หัว / รับภาระเกินตัว", "thai_meaning": "รับภาระหรือตกลงทำสิ่งใดสิ่งหนึ่งมากเกินกว่าขีดความสามารถที่จะจัดการได้ไหว", "ex1_en": "By agreeing to coach soccer, remodel the kitchen, and study for night classes simultaneously, Leo definitely <span class=\"hl-teal\">bit off more than he could chew</span>.", "ex1_hl": "bit off more than he could chew", "ex1_th": "การตอบตกลงทั้งเป็นโค้ชฟุตบอล รีโนเวตห้องครัว และเรียนภาคค่ำไปพร้อมกัน ทำให้ลีโอรับภาระหนักเกินตัวไปจริงๆ", "ex2_en": "The agency <span class=\"hl-teal\">bit off more than they could chew</span> when they signed three major software clients without expanding their engineering headcount.", "ex2_hl": "bit off more than they could chew", "ex2_th": "เอเจนซีแห่งนี้รับงานเกินกำลังของตัวเอง เมื่อเซ็นสัญญากับลูกค้ารายใหญ่ด้านซอฟต์แวร์พร้อมกันถึงสามเจ้าโดยไม่ได้เพิ่มจำนวนวิศวกรเลย", "slot_num": 88, "sheet_no": 1, "first_letter": "B"}, {"id": 89, "orig_slot": "#89", "idiom": "Have your cake and eat it too", "meaning": "Want two incompatible benefits.", "thai_idiom": "จับปลาสองมือ / ได้อย่างจะเอาอีกอย่าง / หวังได้ประโยชน์สองต่อทั้งที่ไม่ไปด้วยกัน", "thai_meaning": "ต้องการครอบครองประโยชน์สองอย่างพร้อมกัน ทั้งที่ในความเป็นจริงต้องเลือกอย่างใดอย่างหนึ่ง", "ex1_en": "You cannot expect to save money for travel while spending lavishly on dining out every weekend; you can't <span class=\"hl-teal\">have your cake and eat it too</span>.", "ex1_hl": "have your cake and eat it too", "ex1_th": "เธอจะหวังเก็บเงินไว้เที่ยว แต่ยังใช้จ่ายสุรุ่ยสุร่ายไปกับร้านอาหารหรูทุกสุดสัปดาห์ไม่ได้หรอกนะ คนเราจะได้ประโยชน์สองต่อทั้งที่ไม่เข้ากันไม่ได้", "ex2_en": "The union warned management that they couldn't cut employee benefits while expecting record productivity—executives cannot <span class=\"hl-teal\">have their cake and eat it too</span>.", "ex2_hl": "have their cake and eat it too", "ex2_th": "สหภาพแรงงานเตือนฝ่ายบริหารว่าไม่สามารถตัดสวัสดิการพนักงานแต่กลับคาดหวังผลผลิตสูงสุดเป็นประวัติการณ์ได้ ผู้บริหารจะหวังได้ประโยชน์ฝ่ายเดียวทั้งสองด้านไม่ได้", "slot_num": 89, "sheet_no": 1, "first_letter": "H"}, {"id": 90, "orig_slot": "#90", "idiom": "Compare apples and oranges", "meaning": "Compare things that are very different.", "thai_idiom": "เปรียบเทียบสิ่งที่ต่างกันคนละขั้ว / เทียบม้ากับลา", "thai_meaning": "นำสองสิ่งที่มีลักษณะ ปัจจัย หรือบริบทแตกต่างกันโดยสิ้นเชิงมาเปรียบเทียบกันอย่างไม่สมเหตุสมผล", "ex1_en": "Comparing a lightweight convertible sports car to a nine-seater family minivan is just <span class=\"hl-teal\">comparing apples and oranges</span>.", "ex1_hl": "comparing apples and oranges", "ex1_th": "การเอารถสปอร์ตเปิดประทุนคันเล็กไปเทียบกับรถตู้ครอบครัวเก้าที่นั่ง มันเหมือนการเปรียบเทียบสิ่งที่ต่างกันคนละเรื่องเลย", "ex2_en":
