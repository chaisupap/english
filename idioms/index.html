 "Evaluating the profitability of a venture-backed tech startup alongside an established utility company is <span class=\"hl-teal\">comparing apples and oranges</span>.", "ex2_hl": "comparing apples and oranges", "ex2_th": "การนำอัตราผลกำไรของสตาร์ตอัปเทคโนโลยีที่ได้เงินร่วมทุน ไปเปรียบเทียบกับบริษัทสาธารณูปโภคที่มั่นคงแล้ว ถือเป็นการเทียบสิ่งที่ต่างกันคนละขั้ว", "slot_num": 90, "sheet_no": 1, "first_letter": "C"}, {"id": 91, "orig_slot": "#91", "idiom": "A hard nut to crack", "meaning": "A difficult problem or person.", "thai_idiom": "กระดูกชิ้นโต / งานหิน / คนเข้าถึงยาก", "thai_meaning": "ปัญหาที่แก้ไขได้ยากยิ่ง หรือบุคคลที่รับมือและทำความเข้าใจได้ยาก", "ex1_en": "The final crossword puzzle in Sunday's newspaper proved to be <span class=\"hl-teal\">a hard nut to crack</span>.", "ex1_hl": "a hard nut to crack", "ex1_th": "ปริศนาอักษรไขว้ช่องสุดท้ายในหนังสือพิมพ์ฉบับวันอาทิตย์กลายเป็นโจทย์หินที่แก้ไม่ออกเลยทีเดียว", "ex2_en": "Breaking into the Japanese retail market has always been <span class=\"hl-teal\">a hard nut to crack</span> for foreign consumer brands.", "ex2_hl": "a hard nut to crack", "ex2_th": "การเจาะตลาดค้าปลีกในประเทศญี่ปุ่นถือเป็นงานหินและเป็นกระดูกชิ้นโตสำหรับแบรนด์สินค้าอุปโภคบริโภคจากต่างประเทศมาโดยตลอด", "slot_num": 91, "sheet_no": 1, "first_letter": "A"}, {"id": 92, "orig_slot": "#92", "idiom": "Cool as a cucumber", "meaning": "Very calm.", "thai_idiom": "ใจเย็นเป็นน้ำแข็ง / นิ่งสงบไม่สะทกสะท้าน", "thai_meaning": "สงบนิ่ง สุขุม และควบคุมอารมณ์ได้เป็นอย่างดีแม้ในสถานการณ์ตึงเครียด", "ex1_en": "Despite spilling coffee all over her white shirt minutes before her blind date, she stayed as <span class=\"hl-teal\">cool as a cucumber</span>.", "ex1_hl": "cool as a cucumber", "ex1_th": "แม้จะทำกาแฟหกรดเสื้อขาวเพียงไม่กี่นาทีก่อนการนัดบอด เธอก็ยังคงนิ่งสงบและคุมสติได้อย่างใจเย็น", "ex2_en": "During the intense press briefing following the network outage, the PR spokesperson remained as <span class=\"hl-teal\">cool as a cucumber</span> while fielding tough questions.", "ex2_hl": "cool as a cucumber", "ex2_th": "ในระหว่างการแถลงข่าวอันดุเดือดหลังเกิดเหตุระบบเครือข่ายล่ม โฆษกฝ่ายประชาสัมพันธ์ยังคงนิ่งสงบและสุขุมอย่างยิ่งขณะตอบคำถามที่กดดัน", "slot_num": 92, "sheet_no": 1, "first_letter": "C"}, {"id": 93, "orig_slot": "#93", "idiom": "Spill the tea", "meaning": "Share gossip or interesting information.", "thai_idiom": "เมาท์มอย / แฉความลับ / เปิดประเด็นแซ่บ", "thai_meaning": "เปิดเผยหรือเล่าเรื่องซุบซิบนินทา ข้อมูลลับ หรือข่าววงในที่น่าสนใจ", "ex1_en": "Come sit down and <span class=\"hl-teal\">spill the tea</span> about what actually happened at Jenny's engagement dinner!", "ex1_hl": "spill the tea", "ex1_th": "มานั่งตรงนี้แล้วเมาท์มาให้หมดเลยนะ ว่าเกิดอะไรขึ้นในงานเลี้ยงหมั้นของเจนนี่กันแน่!", "ex2_en": "An anonymous insider decided to <span class=\"hl-teal\">spill the tea</span> to investigative reporters regarding the studio's abrupt leadership shake-up.", "ex2_hl": "spill the tea", "ex2_th": "คนวงในที่ไม่เปิดเผยชื่อตัดสินใจแฉข้อมูลวงในให้นักข่าวสืบสวนทราบ เกี่ยวกับการปรับเปลี่ยนโครงสร้างผู้บริหารอย่างกะทันหันของสตูดิโอ", "slot_num": 93, "sheet_no": 1, "first_letter": "S"}, {"id": 94, "orig_slot": "#94", "idiom": "As busy as a bee", "meaning": "Very busy.", "thai_idiom": "ง่วนอยู่ตลอดเวลา / ยุ่งเป็นยุงตีกัน / มือเป็นระวิง", "thai_meaning": "ยุ่งมาก ขยันขันแข็ง และทำงานอย่างไม่หยุดหย่อน", "ex1_en": "Mom has been <span class=\"hl-teal\">as busy as a bee</span> all morning prepping pastries and decorations for the family reunion.", "ex1_hl": "as busy as a bee", "ex1_th": "แม่ทำงานมือเป็นระวิงมาตลอดทั้งเช้าเพื่อเตรียมขนมอบและจัดของแต่งบ้านสำหรับงานรวมญาติ", "ex2_en": "The compliance auditing staff was <span class=\"hl-teal\">as busy as a bee</span> finalizing tax reconciliation files ahead of the fiscal year-end cutoff.", "ex2_hl": "as busy as a bee", "ex2_th": "เจ้าหน้าที่ตรวจสอบการปฏิบัติตามกฎระเบียบง่วนอยู่กับการสรุปยอดกระทบยอดภาษีก่อนกำหนดปิดงวดสิ้นปีบัญชีอย่างไม่หยุดหย่อน", "slot_num": 94, "sheet_no": 1, "first_letter": "A"}, {"id": 95, "orig_slot": "#95", "idiom": "The icing on the cake", "meaning": "An extra good thing.", "thai_idiom": "ของแถมสุดวิเศษ / สิ่งที่มาเติมเต็มให้สมบูรณ์แบบยิ่งขึ้น", "thai_meaning": "สิ่งดีๆ เพิ่มเติมที่ทำให้สถานการณ์ที่ยอดเยี่ยมอยู่แล้วยิ่งดียิ่งขึ้นไปอีก", "ex1_en": "Securing discounted tickets was great, but getting bumped up to first class was <span class=\"hl-teal\">the icing on the cake</span>.", "ex1_hl": "the icing on the cake", "ex1_th": "การได้ตั๋วราคาลดพิเศษก็นับว่ายอดเยี่ยมแล้ว แต่การได้รับการอัปเกรดเป็นที่นั่งชั้นหนึ่งถือเป็นของขวัญแถมที่พิเศษสุดๆ เลย", "ex2_en": "Closing the enterprise software contract ahead of schedule was incredible, and receiving an annual performance bonus was <span class=\"hl-teal\">the icing on the cake</span>.", "ex2_hl": "the icing on the cake", "ex2_th": "การปิดดีลสัญญาซอฟต์แวร์ระดับองค์กรได้ก่อนกำหนดก็น่ายินดีมากแล้ว และการได้รับโบนัสผลงานประจำปียังเป็นสิ่งที่ช่วยเติมเต็มความสำเร็จให้สมบูรณ์แบบยิ่งขึ้น", "slot_num": 95, "sheet_no": 1, "first_letter": "T"}, {"id": 96, "orig_slot": "#96", "idiom": "A couch potato", "meaning": "A person who spends a lot of time watching TV or relaxing.", "thai_idiom": "คนขี้เกียจเอาแต่นอนดูทีวี / คนติดเตียงติดโซฟา", "thai_meaning": "คนที่เอาแต่นั่งๆ นอนๆ ดูโทรทัศน์หรือเล่นหน้าจอทั้งวันโดยไม่ขยับออกกำลังกาย", "ex1_en": "Ever since he bought that ultra-wide television, Mark has turned into <span class=\"hl-teal\">a couch potato</span> who rarely steps outside on weekends.", "ex1_hl": "a couch potato", "ex1_th": "ตั้งแต่ซื้อทีวีจอโค้งขนาดยักษ์มา มาร์กก็กลายเป็นคนติดโซฟาเอาแต่นอนดูทีวีจนแทบไม่ยอมก้าวเท้าออกจากบ้านในวันหยุดเลย", "ex2_en": "The corporate wellness campaign aims to encourage sedentary office workers to avoid becoming <span class=\"hl-teal\">couch potatoes</span> by participating in lunchtime walking clubs.", "ex2_hl": "couch potatoes", "ex2_th": "แคมเปญสุขภาพขององค์กรมีเป้าหมายเพื่อกระตุ้นพนักงานออฟฟิศที่นั่งโต๊ะทั้งวันไม่ให้กลายเป็นคนติดเตียงติดโซฟา โดยชวนมาร่วมกลุ่มเดินออกกำลังกายช่วงพักกลางวัน", "slot_num": 96, "sheet_no": 1, "first_letter": "A"}, {"id": 97, "orig_slot": "#97", "idiom": "Hit below the belt", "meaning": "Say something unfair or mean.", "thai_idiom": "เล่นสกปรก / แทงใจดำอย่างไม่เป็นธรรม / ชกใต้เข็มขัด", "thai_meaning": "กระทำหรือพูดจาในทางที่ไร้ความยุติธรรม เหยียบย่ำจุดอ่อน หรือละเมิดกติกาความเป็นธรรม", "ex1_en": "Bringing up my past financial mistakes during a simple argument about groceries was really <span class=\"hl-teal\">hitting below the belt</span>.", "ex1_hl": "hitting below the belt", "ex1_th": "การขุดเอาความผิดพลาดเรื่องการเงินในอดีตของฉันมาพูดตอนเถียงกันเรื่องซื้อของกินของใช้ มันเป็นการแทงใจดำอย่างไม่เป็นธรรมเอามากๆ", "ex2_en": "Attacking the rival CEO's family life in televised political advertisements was widely condemned as <span class=\"hl-teal\">hitting below the belt</span>.", "ex2_hl": "hitting below the belt", "ex2_th": "การโจมตีชีวิตครอบครัวของซีอีโอคู่แข่งในโฆษณาทางโทรทัศน์ถูกประณามอย่างกว้างขวางว่าเป็นการเล่นสกปรกที่ไร้น้ำใจนักกีฬา", "slot_num": 97, "sheet_no": 1, "first_letter": "H"}, {"id": 98, "orig_slot": "#98", "idiom": "Hold your horses", "meaning": "Wait; be patient.", "thai_idiom": "ใจเย็นๆ ก่อน / รอก่อน / อย่าเพิ่งรีบร้อน", "thai_meaning": "หยุดรอและใจเย็นๆ ก่อน อย่าเพิ่งผลีผลามตัดสินใจหรือลงมือทำอะไร", "ex1_en": "<span class=\"hl-teal\">Hold your horses</span>! We can't leave for the amusement park until everyone has buckled their seatbelts.", "ex1_hl": "Hold your horses", "ex1_th": "ใจเย็นๆ ก่อน รอก่อนนะ! เราจะยังไม่ออกรถไปสวนสนุกจนกว่าทุกคนจะคาดเข็มขัดนิรภัยเรียบร้อย", "ex2_en": "Before authorizing purchase orders for additional warehouse equipment, let's <span class=\"hl-teal\">hold our horses</span> until the inventory audit is finalized.", "ex2_hl": "hold our horses", "ex2_th": "ก่อนจะอนุมัติใบสั่งซื้ออุปกรณ์คลังสินค้าเพิ่มเติม ขอให้เรารอก่อนและอย่าเพิ่งรีบร้อน จนกว่าการตรวจสอบสินค้าคงคลังจะเสร็จสมบูรณ์", "slot_num": 98, "sheet_no": 1, "first_letter": "H"}, {"id": 99, "orig_slot": "#99", "idiom": "Don't put all your eggs in one basket", "meaning": "Don't risk everything on one plan.", "thai_idiom": "อย่าทุ่มหมดหน้าตักในทางเดียว / อย่าเอาไข่ทั้งหมดใส่ไว้ในตะกร้าใบเดียว", "thai_meaning": "อย่าเสี่ยงทุ่มเททรัพยากรหรือความหวังทั้งหมดไว้กับแผนการหรือสิ่งสิ่งเดียว เพราะหากล้มเหลวจะสูญเสียทั้งหมด", "ex1_en": "You should apply to multiple universities rather than relying solely on your dream school; <span class=\"hl-teal\">don't put all your eggs in one basket</span>.", "ex1_hl": "don't put all your eggs in one basket", "ex1_th": "เธอควรยื่นสมัครหลายๆ มหาวิทยาลัยแทนที่จะหวังพึ่งแค่มหาวิทยาลัยในฝันแห่งเดียว อย่าทุ่มความหวังทั้งหมดไว้ในทางเดียวเลย", "ex2_en": "Wealth managers repeatedly advise clients to diversify their portfolios across equities, bonds, and real estate, emphasizing: \"<span class=\"hl-teal\">Don't put all your eggs in one basket</span>.\"", "ex2_hl": "Don't put all your eggs in one basket", "ex2_th": "ผู้จัดการกองทุนส่วนบุคคลแนะนำลูกค้าอย่างต่อเนื่องให้กระจายพอร์ตการลงทุนทั้งในหุ้น พันธบัตร และอสังหาริมทรัพย์ โดยเน้นย้ำว่า \"อย่าทุ่มเงินทั้งหมดไว้ในสินทรัพย์ประเภทเดียว\"", "slot_num": 99, "sheet_no": 1, "first_letter": "D"}, {"id": 100, "orig_slot": "#100", "idiom": "Play it by ear", "meaning": "Deal with a situation as it develops.", "thai_idiom": "ดูตามสถานการณ์ / แก้ปัญหาเฉพาะหน้าไปตามน้ำ / ค่อยว่ากันตามหน้างาน", "thai_meaning": "ตัดสินใจหรือดำเนินแผนการไปตามสถานการณ์เฉพาะหน้าที่เกิดขึ้น โดยไม่ได้กำหนดไว้ล่วงหน้า", "ex1_en": "We haven't booked any museum tours for Saturday afternoon; let's just <span class=\"hl-teal\">play it by ear</span> depending on the weather.", "ex1_hl": "play it by ear", "ex1_th": "พวกเรายังไม่ได้จองตั๋วทัวร์พิพิธภัณฑ์สำหรับบ่ายวันเสาร์ไว้หรอกนะ ค่อยดูตามสภาพอากาศหน้างานอีกทีแล้วกัน", "ex2_en": "Without knowing our supplier's exact delivery timetable, the logistics director suggested we <span class=\"hl-teal\">play it by ear</span> during the opening contract talks.", "ex2_hl": "play it by ear", "ex2_th": "เนื่องจากยังไม่ทราบตารางเวลาจัดส่งที่แน่นอนของซัพพลายเออร์ ผู้อำนวยการฝ่ายโลจิสติกส์จึงเสนอให้เราปรับเปลี่ยนไปตามสถานการณ์ระหว่างการเจรจาสัญญาขั้นต้น", "slot_num": 100, "sheet_no": 1, "first_letter": "P"}, {"id": 101, "orig_slot": "#101", "idiom": "Put all your cards on the table", "meaning": "Be completely honest.", "thai_idiom": "เปิดไพ่หมดหน้าตัก / เปิดอกคุยอย่างตรงไปตรงมา / เผยไต๋ทั้งหมด", "thai_meaning": "เปิดเผยเจตนา ข้อมูล หรือแผนการทั้งหมดอย่างจริงใจและตรงไปตรงมา ไม่มีความลับซ่อนเร้น", "ex1_en": "If we want to fix our friendship after that misunderstanding, we both need to <span class=\"hl-teal\">put all our cards on the table</span>.", "ex1_hl": "put all our cards on the table", "ex1_th": "ถ้าเราอยากปรับความเข้าใจและฟื้นฟูมิตรภาพหลังเหตุการณ์เข้าใจผิดนั้น เราทั้งคู่ต้องเปิดอกคุยกันอย่างตรงไปตรงมาโดยไม่ปิดบัง", "ex2_en": "During the merger discussions, the lead negotiator urged both sides to <span class=\"hl-teal\">put all their cards on the table</span> regarding outstanding liabilities.", "ex2_hl": "put all their cards on the table", "ex2_th": "ในระหว่างการเจรจาควบรวมกิจการ หัวหน้าทีมเจรจาได้กระตุ้นให้ทั้งสองฝ่ายเปิดเผยข้อมูลหนี้สินคงค้างทั้งหมดอย่างตรงไปตรงมาบนโต๊ะเจรจา", "slot_num": 101, "sheet_no": 2, "first_letter": "P"}, {"id": 102, "orig_slot": "#102", "idiom": "Cut to the chase", "meaning": "Get to the point.", "thai_idiom": "เข้าประเด็นเลย / พูดตรงประเด็น / ไม่อ้อมค้อม", "thai_meaning": "ข้ามรายละเอียดที่ไม่สำคัญและพูดเข้าสู่ประเด็นหลักหรือหัวใจสำคัญทันที", "ex1_en": "We only have ten minutes before my bus arrives, so please <span class=\"hl-teal\">cut to the chase</span> and tell me what happened.", "ex1_hl": "cut to the chase", "ex1_th": "ฉันเหลือเวลาแค่สิบนาทีก่อนรถเมล์จะมา เพราะฉะนั้นช่วยพูดเข้าประเด็นเลยได้ไหมว่าเกิดอะไรขึ้นกันแน่", "ex2_en": "Recognizing that the board members had limited time, the chief financial officer skipped the background slides to <span class=\"hl-teal\">cut to the chase</span> about quarterly cash reserves.", "ex2_hl": "cut to the chase", "ex2_th": "เมื่อตระหนักว่าคณะกรรมการบริษัทมีเวลาจำกัด ประธานเจ้าหน้าที่ฝ่ายการเงินจึงข้ามสไลด์เกริ่นนำไป แล้วเข้าสู่ประเด็นสำคัญเรื่องเงินสดสำรองรายไตรมาสทันที", "slot_num": 102, "sheet_no": 2, "first_letter": "C"}, {"id": 103, "orig_slot": "#103", "idiom": "Turn a blind eye", "meaning": "Ignore something.", "thai_idiom": "ทำเป็นมองไม่เห็น / แกล้งทำเป็นไม่รู้ไม่ชี้ / หลับตาข้างหนึ่ง", "thai_meaning": "เพิกเฉยหรือจงใจทำเป็นไม่รับรู้พฤติกรรมที่ไม่ถูกต้องหรือไม่เหมาะสม", "ex1_en": "The librarian decided to <span class=\"hl-teal\">turn a blind eye</span> when she noticed the elderly man quietly eating a mint in the study hall.", "ex1_hl": "turn a blind eye", "ex1_th": "บรรณารักษ์ตัดสินใจทำเป็นมองไม่เห็นเมื่อสังเกตเห็นชายสูงอายุกำลังแอบอมลูกอมรสมินต์เงียบๆ ในห้องอ่านหนังสือ", "ex2_en": "Regulatory agencies can no longer afford to <span class=\"hl-teal\">turn a blind eye</span> to industrial wastewater discharges that violate environmental standards.", "ex2_hl": "turn a blind eye", "ex2_th": "หน่วยงานกำกับดูแลไม่สามารถเพิกเฉยหรือทำเป็นเอาหูไปนาเอาตาไปไร่ ต่อการปล่อยน้ำเสียจากโรงงานอุตสาหกรรมที่ละเมิดมาตรฐานสิ่งแวดล้อมได้อีกต่อไป", "slot_num": 103, "sheet_no": 2, "first_letter": "T"}, {"id": 104, "orig_slot": "#104", "idiom": "Under the thumb", "meaning": "Controlled by someone.", "thai_idiom": "อยู่ใต้กำมือ / ตกอยู่ใต้อาณัติ / ถูกครอบงำ", "thai_meaning": "ถูกควบคุม ชักจูง หรือสั่งการโดยบุคคลอื่นอย่างสมบูรณ์จนไม่มีอิสระในการตัดสินใจ", "ex1_en": "Poor Tom is completely <span class=\"hl-teal\">under the thumb</span> of his older brother, who decides what video games they play and when they go out.", "ex1_hl": "under the thumb", "ex1_th": "ทอมผู้น่าสงสารตกอยู่ใต้การบงการของพี่ชายโดยสิ้นเชิง ไม่ว่าจะเป็นการตัดสินใจว่าจะเล่นวิดีโอเกมอะไรหรือจะออกไปข้างนอกเมื่อไหร่", "ex2_en": "Critics argued that the independent oversight committee had fallen <span class=\"hl-teal\">under the thumb</span> of the controlling shareholders.", "ex2_hl": "under the thumb", "ex2_th": "บรรดานักวิจารณ์โต้แย้งว่าคณะกรรมการกำกับดูแลอิสระได้ตกอยู่ใต้อาณัติและการครอบงำของกลุ่มผู้ถือหุ้นรายใหญ่ไปเสียแล้ว", "slot_num": 104, "sheet_no": 2, "first_letter": "U"}, {"id": 105, "orig_slot": "#106", "idiom": "Break a leg", "meaning": "Good luck!", "thai_idiom": "ขอให้โชคดี / ขอให้แสดงได้ปังๆ (คำอวยพรก่อนขึ้นเวที)", "thai_meaning": "คำอวยพรขอให้ประสบความสำเร็จและโชคดี มักใช้กับนักแสดงหรือผู้ที่จะขึ้นเวทีก่อนการแสดง", "ex1_en": "I know you've rehearsed your piano solo for weeks; go out there and <span class=\"hl-teal\">break a leg</span>!", "ex1_hl": "break a leg", "ex1_th": "ฉันรู้ว่าเธอซ้อมเดี่ยวเปียโนมาหลายสัปดาห์แล้ว ออกไปแสดงให้เต็มที่ ขอให้โชคดีนะ!", "ex2_en": "Just before the startup founders walked onto the auditorium stage to pitch venture capitalists, their advisor whispered, \"<span class=\"hl-teal\">Break a leg</span>!\"", "ex2_hl": "Break a leg", "ex2_th": "ก่อนที่เหล่าผู้ก่อตั้งสตาร์ตอัปจะก้าวขึ้นเวทีหอประชุมเพื่อนำเสนอแผนธุรกิจต่อนักลงทุน ที่ปรึกษาของพวกเขาก็กระซิบให้กำลังใจว่า \"ขอให้โชคดีและทำผลงานให้ปังนะ!\"", "slot_num": 106, "sheet_no": 2, "first_letter": "B"}, {"id": 106, "orig_slot": "#107", "idiom": "Peace of mind", "meaning": "A feeling of being calm.", "thai_idiom": "ความสบายใจ / ความหมดกังวล / ความสงบสุขทางใจ", "thai_meaning": "ความรู้สึกอุ่นใจ ปลอดโปร่ง ปราศจากความกังวลหรือความเครียด", "ex1_en": "Double-checking that the front door is locked gives me total <span class=\"hl-teal\">peace of mind</span> before going to sleep.", "ex1_hl": "peace of mind", "ex1_th": "การเดินไปเช็กประตูหน้าบ้านซ้ำอีกรอบว่าล็อกสนิทแล้ว ทำให้ฉันรู้สึกสบายใจหมดกังวลก่อนเข้านอน", "ex2_en": "Purchasing comprehensive cyber insurance provides tech enterprises with invaluable <span class=\"hl-teal\">peace of mind</span> in the event of data security breaches.", "ex2_hl": "peace of mind", "ex2_th": "การซื้อประกันภัยไซเบอร์แบบครอบคลุมช่วยให้องค์กรเทคโนโลยีเกิดความอุ่นใจและคลายกังวลอย่างยิ่ง หากต้องเผชิญกับเหตุการณ์ละเมิดความปลอดภัยของข้อมูล", "slot_num": 107, "sheet_no": 2, "first_letter": "P"}, {"id": 107, "orig_slot": "#108", "idiom": "Miss the point", "meaning": "Fail to understand.", "thai_idiom": "เข้าใจผิดประเด็น / จับประเด็นไม่ได้ / ตีความคลาดเคลื่อน", "thai_meaning": "ไม่เข้าใจหรือไม่สามารถจับใจความสำคัญของเรื่องราวที่สื่อสารออกมาได้", "ex1_en": "You completely <span class=\"hl-teal\">missed the point</span> of my text; I wasn't criticizing your outfit, I was just asking what time we should leave.", "ex1_hl": "missed the point", "ex1_th": "เธอเข้าใจผิดประเด็นในข้อความของฉันไปหมดเลย ฉันไม่ได้วิจารณ์ชุดที่เธอใส่สักหน่อย แค่ถามว่าจะออกเดินทางกี่โมงต่างหาก", "ex2_en": "The product team <span class=\"hl-teal\">missed the point</span> of the focus group feedback by merely redesigning the logo instead of fixing sluggish app performance.", "ex2_hl": "missed the point", "ex2_th": "ทีมผลิตภัณฑ์ตีความประเด็นข้อเสนอแนะจากกลุ่มผู้ใช้คลาดเคลื่อนไป โดยมัวแต่ไปปรับดีไซน์โลโก้แทนที่จะแก้ไขปัญหาความเชื่องช้าของแอปพลิเคชัน", "slot_num": 108, "sheet_no": 2, "first_letter": "M"}, {"id": 108, "orig_slot": "#109", "idiom": "On the back burner", "meaning": "Not important now.", "thai_idiom": "พักไว้ก่อน / ชะลอไว้ชั่วคราว / จัดเป็นเรื่องรอง", "thai_meaning": "ถูกลดความสำคัญหรือเลื่อนการดำเนินการออกไปก่อนชั่วคราว เพื่อให้ความสำคัญกับเรื่องอื่นที่เร่งด่วนกว่า", "ex1_en": "I had to put my photography hobby <span class=\"hl-teal\">on the back burner</span> while studying for my bar examinations.", "ex1_hl": "on the back burner", "ex1_th": "ฉันต้องพักงานอดิเรกเรื่องถ่ายภาพไว้ก่อนชั่วคราว ในระหว่างที่ต้องอ่านหนังสือเตรียมสอบเนติบัณฑิต", "ex2_en": "The board placed the office expansion plans <span class=\"hl-teal\">on the back burner</span> until macroeconomic conditions stabilize.", "ex2_hl": "on the back burner", "ex2_th": "คณะกรรมการบริษัทได้ชะลอแผนการขยายสำนักงานไว้ก่อนเป็นการชั่วคราว จนกว่าสภาวะเศรษฐกิจมหภาคจะมีเสถียรภาพ", "slot_num": 109, "sheet_no": 2, "first_letter": "O"}, {"id": 109, "orig_slot": "#110", "idiom": "Let sleeping dogs lie", "meaning": "Don't bring up old problems.", "thai_idiom": "อย่าฟื้นฝอยหาตะเข็บ / อย่ากวนน้ำให้ขุ่น", "thai_meaning": "อย่ารื้อฟื้นเรื่องเก่าหรือปัญหาในอดีตที่จบไปแล้วขึ้นมาให้เกิดเรื่องวุ่นวาย", "ex1_en": "I know you're still annoyed about who ruined the camping tent last summer, but it's better to <span class=\"hl-teal\">let sleeping dogs lie</span>.", "ex1_hl": "let sleeping dogs lie", "ex1_th": "ฉันรู้ว่าเธอยังหงุดหงิดเรื่องที่ใครทำเต็นท์พังเมื่อช่วงฤดูร้อนปีก่อน แต่ปล่อยให้เรื่องมันผ่านไปเถอะ อย่าฟื้นฝอยหาตะเข็บเลย", "ex2_en": "Legal counsel strongly advised the board to <span class=\"hl-teal\">let sleeping dogs lie</span> rather than reopening the expired contractor dispute.", "ex2_hl": "let sleeping dogs lie", "ex2_th": "ที่ปรึกษากฎหมายแนะนำคณะกรรมการอย่างหนักแน่นว่าอย่าเพิ่งไปแตะต้องหรือรื้อฟื้นข้อพิพาทกับผู้รับเหมาที่สัญญาหมดอายุไปแล้วจะดีกว่า", "slot_num": 110, "sheet_no": 2, "first_letter": "L"}, {"id": 110, "orig_slot": "#111", "idiom": "The calm before the storm", "meaning": "A quiet time before trouble.", "thai_idiom": "ความสงบก่อนพายุจะมา / คลื่นลมสงบก่อนมรสุมเข้า", "thai_meaning": "ช่วงเวลาที่ดูสงบเงียบหรือราบรื่นผิดปกติก่อนที่ปัญหาหรือความวุ่นวายครั้งใหญ่จะตามมา", "ex1_en": "The living room is completely silent right now, but it's just <span class=\"hl-teal\">the calm before the storm</span> before the kids wake up from their nap.", "ex1_hl": "the calm before the storm", "ex1_th": "ตอนนี้ห้องนั่งเล่นเงียบกริบเลย แต่นี่เป็นแค่ความสงบก่อนพายุจะมา ก่อนที่เด็ก ๆ จะตื่นจากการนอนกลางวันเท่านั้นแหละ", "ex2_en": "Retailers enjoyed steady foot traffic this week, anticipating it was merely <span class=\"hl-teal\">the calm before the storm</span> of Black Friday madness.", "ex2_hl": "the calm before the storm", "ex2_th": "บรรดาร้านค้าปลีกมีลูกค้าเดินเข้าออกอย่างสม่ำเสมอในสัปดาห์นี้ ทว่าต่างตระหนักดีว่านี่เป็นเพียงความสงบก่อนคลื่นมรสุมช้อปปิ้งวันแบล็กฟรายเดย์จะมาถึง", "slot_num": 111, "sheet_no": 2, "first_letter": "T"}, {"id": 111, "orig_slot": "#112", "idiom": "Once in a lifetime", "meaning": "Very rare.", "thai_idiom": "โอกาสทองครั้งหนึ่งในชีวิต / หายากยิ่งในชีวิต", "thai_meaning": "โอกาสพิเศษหรือประสบการณ์ที่หายากมากจนอาจเกิดขึ้นเพียงครั้งเดียวในชีวิต", "ex1_en": "Backpacking across the Himalayan range with my closest friends felt like a <span class=\"hl-teal\">once in a lifetime</span> adventure.", "ex1_hl": "once in a lifetime", "ex1_th": "การได้ไปแบกเป้ท่องเทือกเขาหิมาลัยกับเพื่อนสนิทให้ความรู้สึกเหมือนเป็นการผจญภัยครั้งหนึ่งในชีวิตจริง ๆ", "ex2_en": "Receiving a fully funded research fellowship at Oxford was a <span class=\"hl-teal\">once in a lifetime</span> opportunity she couldn't refuse.", "ex2_hl": "once in a lifetime", "ex2_th": "การได้รับทุนวิจัยเต็มจำนวนที่มหาวิทยาลัยออกซฟอร์ดถือเป็นโอกาสทองครั้งหนึ่งในชีวิตที่เธอไม่อาจปฏิเสธได้", "slot_num": 112, "sheet_no": 2, "first_letter": "O"}, {"id": 112, "orig_slot": "#113", "idiom": "Beat a dead horse", "meaning": "Keep doing something useless.", "thai_idiom": "พูดซ้ำซากไร้ประโยชน์ / สีซอให้ควายฟัง", "thai_meaning": "เสียเวลาหรือเรี่ยวแรงไปกับการพยายามเปลี่ยนแปลงสิ่งที่จบสิ้นไปแล้วหรือไม่มีทางเปลี่ยนได้", "ex1_en": "Mark, we've already decided to rent the suburban house, so there's no need to <span class=\"hl-teal\">beat a dead horse</span> about moving downtown.", "ex1_hl": "beat a dead horse", "ex1_th": "มาร์ก เราตัดสินใจเช่าบ้านชานเมืองกันไปแล้วนะ เพราะงั้นไม่ต้องยกเรื่องย้ายเข้าตัวเมืองมาพูดซ้ำซากให้เปลืองน้ำลายอีกหรอก", "ex2_en": "Continuing to pitch that retired software package to client partners is just <span class=\"hl-teal\">beating a dead horse</span>.", "ex2_hl": "beating a dead horse", "ex2_th": "การยังคงพยายามเสนอขายแพ็กเกจซอฟต์แวร์ตัวเดิมที่ถูกปลดระวางไปแล้วให้ลูกค้า มีแต่จะเสียเวลาเปล่าโดยไม่ได้ประโยชน์อะไรขึ้นมา", "slot_num": 113, "sheet_no": 2, "first_letter": "B"}, {"id": 113, "orig_slot": "#114", "idiom": "Draw a blank", "meaning": "Cannot remember something.", "thai_idiom": "นึกไม่ออก / สมองตื้อ", "thai_meaning": "คิดไม่ออก จำไม่ได้ หรือไม่สามารถหาคำตอบได้ในชั่วขณะ", "ex1_en": "I bumped into our high school classmate at the supermarket, but I completely <span class=\"hl-teal\">drew a blank</span> on her name.", "ex1_hl": "drew a blank", "ex1_th": "ฉันบังเอิญเจอเพื่อนสมัยมัธยมที่ซูเปอร์มาร์เก็ต แต่นึกชื่อเธอไม่ออกเลยแม้แต่นิดเดียว", "ex2_en": "When the auditor suddenly asked for the invoice reconciliation numbers, the junior accountant visibly <span class=\"hl-teal\">drew a blank</span>.", "ex2_hl": "drew a blank", "ex2_th": "เมื่อผู้ตรวจสอบบัญชีเอ่ยถามถึงตัวเลขกระทบยอดใบแจ้งหนี้แบบกะทันหัน นักบัญชีฝึกหัดก็ถึงกับอึกอักและนึกคำตอบไม่ออกอย่างเห็นได้ชัด", "slot_num": 114, "sheet_no": 2, "first_letter": "D"}, {"id": 114, "orig_slot": "#115", "idiom": "Give it a shot", "meaning": "Try something.", "thai_idiom": "ลองดูสักตั้ง / ขอลองดู", "thai_meaning": "ทดลองทำดู แม้จะยังไม่มั่นใจว่าจะสำเร็จหรือไม่", "ex1_en": "I have never baked sourdough bread from scratch, but my sister convinced me to <span class=\"hl-teal\">give it a shot</span> this weekend.", "ex1_hl": "give it a shot", "ex1_th": "ฉันไม่เคยทำขนมปังซาวโดว์เองตั้งแต่ต้นมาก่อนเลย แต่พี่สาวคะยั้นคะยอให้ฉันลองทำดูสักตั้งสุดสัปดาห์นี้", "ex2_en": "Although foreign expansion carried substantial risk, the venture capital firm decided to <span class=\"hl-teal\">give it a shot</span> in the Southeast Asian market.", "ex2_hl": "give it a shot", "ex2_th": "แม้ว่าการขยายธุรกิจไปต่างประเทศจะมีความเสี่ยงสูง แต่บริษัทร่วมทุนก็ตัดสินใจขอลองลุยดูสักตั้งในตลาดเอเชียตะวันออกเฉียงใต้", "slot_num": 115, "sheet_no": 2, "first_letter": "G"}, {"id": 115, "orig_slot": "#116", "idiom": "In the driver's seat", "meaning": "In control.", "thai_idiom": "กุมบังเหียน / เป็นผู้คุมสถานการณ์", "thai_meaning": "อยู่ในตำแหน่งที่มีอำนาจควบคุมหรือเป็นผู้ตัดสินใจหลักในสถานการณ์นั้น ๆ", "ex1_en": "Since Tom paid for the road trip rental and mapped out the route, he's definitely <span class=\"hl-teal\">in the driver's seat</span> for this vacation.", "ex1_hl": "in the driver's seat", "ex1_th": "ในเมื่อทอมเป็นคนจ่ายค่าเช่ารถและวางแผนเส้นทางทั้งหมด เขาก็เลยเป็นคนคุมทริปวันหยุดนี้ไปโดยปริยาย", "ex2_en": "After acquiring a majority stake in the telecom firm, the tech conglomerate is now firmly <span class=\"hl-teal\">in the driver's seat</span>.", "ex2_hl": "in the driver's seat", "ex2_th": "หลังเข้าซื้อหุ้นส่วนใหญ่ในบริษัทโทรคมนาคมสำเร็จ กลุ่มทุนยักษ์ใหญ่ด้านเทคโนโลยีก็ก้าวขึ้นมากุมบังเหียนได้อย่างเบ็ดเสร็จ", "slot_num": 116, "sheet_no": 2, "first_letter": "I"}, {"id": 116, "orig_slot": "#117", "idiom": "On thin ice", "meaning": "In a risky situation.", "thai_idiom": "แขวนอยู่บนเส้นด้าย / อยู่ในจุดที่สุ่มเสี่ยงมาก", "thai_meaning": "ตกอยู่ในสถานการณ์ที่เสี่ยงต่อความผิดพลาด ปัญหา หรือการถูกลงโทษ หากทำอะไรผิดไปอีกนิดเดียว", "ex1_en": "You're already <span class=\"hl-teal\">on thin ice</span> with Dad for denting the garage door, so don't ask to borrow the sedan tonight.", "ex1_hl": "on thin ice", "ex1_th": "แกกำลังมีชนักติดหลังกับพ่อเรื่องทำประตูโรงรถบุบอยู่นะ อย่าเพิ่งรนหาที่ด้วยการไปขอยืมรถเก๋งคืนนี้เลย", "ex2_en": "Having missed three mandatory project milestones, the software contractor is <span class=\"hl-teal\">on thin ice</span> with the steering committee.", "ex2_hl": "on thin ice", "ex2_th": "หลังจากส่งมอบงานล่าช้ากว่ากำหนดสำคัญไปถึงสามครั้ง ผู้รับเหมาด้านซอฟต์แวร์ก็ตกอยู่ในสถานการณ์สุ่มเสี่ยงอย่างยิ่งต่อการถูกคณะกรรมการยกเลิกสัญญา", "slot_num": 117, "sheet_no": 2, "first_letter": "O"}, {"id": 117, "orig_slot": "#118", "idiom": "Call it quits", "meaning": "Stop doing something.", "thai_idiom": "พอก่อน / ยุติ / เลิกทำ", "thai_meaning": "ตัดสินใจหยุดพัก ยุติการกระทำ หรือเลิกทำกิจกรรมนั้น ๆ", "ex1_en": "We've been assembling this flat-pack wardrobe for five hours, so let's <span class=\"hl-teal\">call it quits</span> and resume tomorrow morning.", "ex1_hl": "call it quits", "ex1_th": "พวกเราช่วยกันประกอบตู้เสื้อผ้าสำเร็จรูปชุดนี้มาห้าชั่วโมงแล้ว พอแค่นี้ก่อนดีกว่า พรุ่งนี้เช้าค่อยมาทำต่อ", "ex2_en": "After two decades of fierce competition, the struggling airline finally decided to <span class=\"hl-teal\">call it quits</span> and file for chapter protection.", "ex2_hl": "call it quits", "ex2_th": "หลังต่อสู้ในการแข่งขันอันดุเดือดมายาวนานกว่าสองทศวรรษ สายการบินที่กำลังเผชิญวิกฤตก็ตัดสินใจยุติการดำเนินงานและยื่นคำร้องล้มละลายในที่สุด", "slot_num": 118, "sheet_no": 2, "first_letter": "C"}, {"id": 118, "orig_slot": "#120", "idiom": "A picture is worth a thousand words", "meaning": "Pictures explain better.", "thai_idiom": "ภาพหนึ่งภาพแทนคำพูดนับพันคำ", "thai_meaning": "ภาพถ่ายหรือภาพประกอบเพียงภาพเดียวสามารถสื่อสารเรื่องราวและความหมายได้ชัดเจนกว่าคำบรรยายยืดยาว", "ex1_en": "Look at how delighted grandma looks holding her newborn great-granddaughter; <span class=\"hl-teal\">a picture is worth a thousand words</span>.", "ex1_hl": "a picture is worth a thousand words", "ex1_th": "ดูรอยยิ้มเปี่ยมสุขของคุณยายตอนได้อุ้มเหลนสาวแรกเกิดสิ ภาพหนึ่งภาพแทนคำพูดนับพันคำจริง ๆ", "ex2_en": "Rather than reading through dense tabular metrics, our team inserted an interactive infographic because <span class=\"hl-teal\">a picture is worth a thousand words</span>.", "ex2_hl": "a picture is worth a thousand words", "ex2_th": "แทนที่จะต้องไล่อ่านตารางข้อมูลตัวเลขอันซับซ้อน ทีมงานจึงเลือกใส่อินโฟกราฟิกแบบอินเทอร์แอ็กทีฟแทน เพราะภาพเพียงหนึ่งภาพสามารถอธิบายได้ดีกว่าตัวหนังสือนับพันคำ", "slot_num": 120, "sheet_no": 2, "first_letter": "A"}, {"id": 119, "orig_slot": "#121", "idiom": "Burn bridges", "meaning": "Destroy relationships.", "thai_idiom": "ตัดรอนความสัมพันธ์ / เผาสะพานตัวเอง", "thai_meaning": "ทำลายความสัมพันธ์หรือตัดหนทางที่จะกลับไปติดต่อหรือพึ่งพาใครได้อีกในอนาคต", "ex1_en": "Even though you're moving into your own flat, don't <span class=\"hl-teal\">burn bridges</span> with your former roommates over unpaid utility bills.", "ex1_hl": "burn bridges", "ex1_th": "ถึงเธอจะย้ายออกไปอยู่ห้องของตัวเองแล้ว แต่ก็อย่าเพิ่งไปตัดไมตรีกับรูมเมตเก่าเพราะเรื่องค่าน้ำค่าไฟที่ค้างอยู่เลย", "ex2_en": "Resigning via a furious public email will only <span class=\"hl-teal\">burn bridges</span> within the closely knit fintech sector.", "ex2_hl": "burn bridges", "ex2_th": "การยื่นใบลาออกด้วยการส่งอีเมลระบายความโกรธให้คนทั้งบริษัทเห็น มีแต่จะเผาสะพานทำลายสายสัมพันธ์ในวงการฟินเทคที่รู้จักกันทั่ว", "slot_num": 121, "sheet_no": 2, "first_letter": "B"}, {"id": 120, "orig_slot": "#122", "idiom": "By and large", "meaning": "Generally speaking.", "thai_idiom": "โดยภาพรวม / โดยทั่วไปแล้ว", "thai_meaning": "เมื่อพิจารณาในภาพรวมหรือส่วนใหญ่ แม้อาจมีข้อยกเว้นบ้าง", "ex1_en": "Our road trip along the coast had a flat tire on the second day, but <span class=\"hl-teal\">by and large</span>, we had a fantastic getaway.", "ex1_hl": "by and large", "ex1_th": "ทริปขับรถเที่ยวเลียบชายฝั่งของเรายางแตกในวันที่สองก็จริง แต่โดยภาพรวมแล้ว พวกเราก็มีช่วงเวลาพักผ่อนที่ยอดเยี่ยมมาก", "ex2_en": "<span class=\"hl-teal\">By and large</span>, the municipal recycling initiative has achieved its targets across residential suburban districts.", "ex2_hl": "By and large", "ex2_th": "โดยภาพรวมแล้ว โครงการรีไซเคิลของเทศบาลประสบความสำเร็จตามเป้าหมายที่วางไว้ในเขตที่พักอาศัยชานเมือง", "slot_num": 122, "sheet_no": 2, "first_letter": "B"}, {"id": 121, "orig_slot": "#123", "idiom": "Face the music", "meaning": "Accept the consequences.", "thai_idiom": "ยอมรับผลกรรม / เผชิญหน้ารับความจริง", "thai_meaning": "ยอมรับผลลัพธ์อันไม่พึงประสงค์หรือบทลงโทษจากการกระทำของตนเองอย่างหลีกเลี่ยงไม่ได้", "ex1_en": "I accidentally cracked my mom's antique porcelain vase, so now I have to go home and <span class=\"hl-teal\">face the music</span>.", "ex1_hl": "face the music", "ex1_th": "ฉันเผลอทำแจกันกระเบื้องโบราณของแม่ร้าว ตอนนี้เลยต้องกลับบ้านไปยอมรับความจริงและรับโทษตามระเบียบ", "ex2_en": "Following the revelation of falsified earnings statements, the chief executive was forced to <span class=\"hl-teal\">face the music</span> before the parliamentary committee.", "ex2_hl": "face the music", "ex2_th": "หลังจากความจริงเรื่องการตกแต่งตัวเลขผลกำไรถูกเปิดโปง ประธานเจ้าหน้าที่บริหารก็จำเป็นต้องเข้าชี้แจงและยอมรับผลที่ตามมาต่อหน้าคณะกรรมาธิการรัฐสภา", "slot_num": 123, "sheet_no": 2, "first_letter": "F"}, {"id": 122, "orig_slot": "#124", "idiom": "Go the distance", "meaning": "Achieve success.", "thai_idiom": "สู้จนถึงที่สุด / ยืนหยัดไปจนจบ", "thai_meaning": "ทุ่มเทความพยายามอย่างไม่ย่อท้อเพื่อไปให้ถึงจุดหมายหรือต่อสู้จนประสบความสำเร็จครบกระบวนการ", "ex1_en": "Training for a full marathon was grueling, but Liam was determined to <span class=\"hl-teal\">go the distance</span> and cross the finish line.", "ex1_hl": "go the distance", "ex1_th": "การซ้อมวิ่งมาราธอนเต็มระยะนั้นเหน็ดเหนื่อยแสนสาหัส แต่เลียมก็มุ่งมั่นที่จะสู้จนถึงที่สุดเพื่อก้าวข้ามเส้นชัยให้ได้", "ex2_en": "Industry analysts wondered whether the boutique electric vehicle maker had enough capital reserves to <span class=\"hl-teal\">go the distance</span> against legacy automakers.", "ex2_hl": "go the distance", "ex2_th": "เหล่านักวิเคราะห์ในอุตสาหกรรมต่างตั้งคำถามว่า ผู้ผลิตยานยนต์ไฟฟ้ารายเล็กจะมีเงินทุนสำรองเพียงพอที่จะยืนหยัดต่อสู้จนถึงที่สุดในการแข่งขันกับค่ายรถยักษ์ใหญ่ดั้งเดิมหรือไม่", "slot_num": 124, "sheet_no": 2, "first_letter": "G"}, {"id": 123, "orig_slot": "#126", "idiom": "In the long run", "meaning": "After a long time.", "thai_idiom": "ในระยะยาว / ท้ายที่สุดแล้ว", "thai_meaning": "ผลลัพธ์หรือสิ่งที่จะเกิดขึ้นในบั้นปลายหลังจากเวลาผ่านไปนาน", "ex1_en": "Buying higher quality kitchen cookware costs more upfront, but it saves you substantial money <span class=\"hl-teal\">in the long run</span>.", "ex1_hl": "in the long run", "ex1_th": "การซื้อชุดเครื่องครัวคุณภาพดีอาจต้องจ่ายแพงกว่าในตอนแรก แต่ในระยะยาวแล้วจะช่วยประหยัดเงินได้เยอะมาก", "ex2_en": "Investing heavily in employee training may diminish quarterly profits today, but it enhances productivity <span class=\"hl-teal\">in the long run</span>.", "ex2_hl": "in the long run", "ex2_th": "การทุ่มเงินลงทุนด้านการฝึกอบรมพนักงานอาจทำให้กำไรรายไตรมาสลดลงในวันนี้ แต่จะช่วยยกระดับผลิตภาพขององค์กรได้อย่างคุ้มค่าในระยะยาว", "slot_num": 126, "sheet_no": 2, "first_letter": "I"}, {"id": 124, "orig_slot": "#127", "idiom": "Jump the gun", "meaning": "Act too soon.", "thai_idiom": "ด่วนได้ใจเร็ว / ออกตัวก่อนกำหนด", "thai_meaning": "ลงมือทำอะไรบางอย่างเร็วเกินไปก่อนถึงเวลาที่เหมาะสม หรือก่อนที่สิ่งต่าง ๆ จะได้รับการยืนยัน", "ex1_en": "We shouldn't <span class=\"hl-teal\">jump the gun</span> and buy flights to Tokyo before our visa approvals are officially stamped.", "ex1_hl": "jump the gun", "ex1_th": "พวกเราอย่าเพิ่งใจร้อนด่วนซื้อตั๋วเครื่องบินไปโตเกียวก่อนที่วีซ่าจะได้รับการอนุมัติอย่างเป็นทางการเลย", "ex2_en": "The marketing department <span class=\"hl-teal\">jumped the gun</span> by publicizing the partnership before the nondisclosure agreements were finalized.", "ex2_hl": "jumped the gun", "ex2_th": "ฝ่ายการตลาดด่วนออกตัวเร็วเกินไปโดยประกาศข่าวการร่วมมือทางธุรกิจ ทั้งที่ข้อตกลงไม่เปิดเผยข้อมูลยังไม่ได้ลงนามขั้นสุดท้าย", "slot_num": 127, "sheet_no": 2, "first_letter": "J"}, {"id": 125, "orig_slot": "#128", "idiom": "Keep tabs on", "meaning": "Watch or check regularly.", "thai_idiom": "คอยจับตาดู / ติดตามความเคลื่อนไหว", "thai_meaning": "คอยสังเกตการณ์ ตรวจสอบ หรือติดตามความคืบหน้าของใครหรือสิ่งใดอย่างสม่ำเสมอ", "ex1_en": "I installed a smart tracking app on my bicycle to <span class=\"hl-teal\">keep tabs on</span> its location whenever I lock it downtown.", "ex1_hl": "keep tabs on", "ex1_th": "ฉันติดตั้งแอปติดตามอัจฉริยะไว้ที่จักรยาน เพื่อคอยตรวจเช็กพิกัดของมันเวลาต้องจอดล็อกไว้ในตัวเมือง", "ex2_en": "The compliance director uses automated audit software to <span class=\"hl-teal\">keep tabs on</span> high-value foreign transactions.", "ex2_hl": "keep tabs on", "ex2_th": "ผู้อำนวยการฝ่ายกำกับการปฏิบัติตามกฎเกณฑ์ใช้ซอฟต์แวร์ตรวจสอบอัตโนมัติ เพื่อคอยติดตามความเคลื่อนไหวของธุรกรรมต่างประเทศที่มีมูลค่าสูง", "slot_num": 128, "sheet_no": 2, "first_letter": "K"}, {"id": 126, "orig_slot": "#130", "idiom": "Look before you leap", "meaning": "Think before you act.", "thai_idiom": "คิดหน้าคิดหลังให้ดี / คิดให้รอบคอบก่อนทำ", "thai_meaning": "ควรไตร่ตรองและพิจารณาผลกระทบที่อาจตามมาให้รอบคอบก่อนที่จะตัดสินใจลงมือทำสิ่งใด", "ex1_en": "Before signing a two-year gym membership with non-refundable fees, <span class=\"hl-teal\">look before you leap</span>.", "ex1_hl": "look before you leap", "ex1_th": "ก่อนจะเซ็นสัญญาเป็นสมาชิกฟิตเนสสองปีที่ขอเงินคืนไม่ได้ ควรคิดหน้าคิดหลังให้รอบคอบเสียก่อนนะ", "ex2_en": "Entering an unfamiliar overseas market without local regulatory vetting is hazardous; prudent firms always <span class=\"hl-teal\">look before they leap</span>.", "ex2_hl": "look before they leap", "ex2_th": "การบุกตลาดต่างประเทศที่ไม่คุ้นเคยโดยไม่ตรวจสอบกฎระเบียบท้องถิ่นถือเป็นเรื่องอันตราย บริษัทที่รอบคอบย่อมต้องศึกษาและไตร่ตรองให้ถี่ถ้วนก่อนลงมือเสมอ", "slot_num": 130, "sheet_no": 2, "first_letter": "L"}, {"id": 127, "orig_slot": "#131", "idiom": "Make a long story short", "meaning": "Give a short summary.", "thai_idiom": "สรุปสั้น ๆ คือ / สรุปย่อ ๆ ว่า", "thai_meaning": "ย่นย่อรายละเอียดทั้งหมดเพื่อบอกเฉพาะใจความสำคัญสั้น ๆ", "ex1_en": "To <span class=\"hl-teal\">make a long story short</span>, my car broke down on Highway 101, so I arrived three hours late to dinner.", "ex1_hl": "make a long story short", "ex1_th": "สรุปสั้น ๆ คือ รถฉันดันเสียกลางทางหลวงสาย 101 ฉันก็เลยมาถึงมื้อค่ำช้าไปตั้งสามชั่วโมง", "ex2_en": "To <span class=\"hl-teal\">make a long story short</span>, the revised supply chain model trimmed quarterly overhead by fifteen percent.", "ex2_hl": "make a long story short", "ex2_th": "สรุปสาระสำคัญแบบสั้น ๆ คือ รูปแบบห่วงโซ่อุปทานฉบับปรับปรุงใหม่สามารถช่วยลดค่าใช้จ่ายในการดำเนินงานรายไตรมาสลงได้ถึงสิบห้าเปอร์เซ็นต์", "slot_num": 131, "sheet_no": 2, "first_letter": "M"}, {"id": 128, "orig_slot": "#132", "idiom": "Not put all your eggs in one basket", "meaning": "Don't risk everything on one thing.", "thai_idiom": "อย่าเอาไข่ทั้งหมดใส่ไว้ในตะกร้าใบเดียว / อย่าทุ่มหมดหน้าตักในทางเดียว", "thai_meaning": "อย่าวางเดิมพันหรือนำทรัพยากรทั้งหมดไปเสี่ยงกับสิ่งเดียว เพราะหากล้มเหลวจะสูญเสียทั้งหมด", "ex1_en": "When applying to universities, my counselor warned me <span class=\"hl-teal\">not to put all my eggs in one basket</span> and choose several backup colleges.", "ex1_hl": "not to put all my eggs in one basket", "ex1_th": "ตอนยื่นสมัครเข้ามหาวิทยาลัย อาจารย์แนะแนวเตือนฉันว่าอย่าทุ่มความหวังไว้ที่แห่งเดียว และควรเลือกมหาวิทยาลัยสำรองเอาไว้หลาย ๆ ที่ด้วย", "ex2_en": "Wealth advisors cautioned the startup founder <span class=\"hl-teal\">not to put all his eggs in one basket</span> by reinvesting his entire payout into a single cryptocurrency token.", "ex2_hl": "not to put all his eggs in one basket", "ex2_th": "ที่ปรึกษาด้านการจัดการทรัพย์สินเตือนผู้ก่อตั้งสตาร์ทอัปว่าอย่าเสี่ยงทุ่มเงินทั้งหมดไว้ในที่เดียว ด้วยการนำเงินผลตอบแทนทั้งหมดไปลงทุนในเหรียญคริปโตเพียงสกุลเดียว", "slot_num": 132, "sheet_no": 2, "first_letter": "N"}, {"id": 129, "orig_slot": "#133", "idiom": "Out of the box", "meaning": "Creative; thinking differently.", "thai_idiom": "นอกกรอบ / คิดนอกกรอบ", "thai_meaning": "มีความคิดสร้างสรรค์ แปลกใหม่ ไม่ยึดติดกับแบบแผนเดิม ๆ", "ex1_en": "When our tent poles broke during the storm, Maya came up with an ingenious <span class=\"hl-teal\">out of the box</span> fix using tree branches and duct tape.", "ex1_hl": "out of the box", "ex1_th": "ตอนที่เสาเต็นท์ของเราหักตอนพายุเข้า มายาก็คิดวิธีแก้ปัญหานอกกรอบอันชาญฉลาดโดยใช้กิ่งไม้กับเทปกาวผ้า", "ex2_en": "The ad agency earned the multinational contract because their campaign demonstrated true <span class=\"hl-teal\">out of the box</span> creativity.", "ex2_hl": "out of the box", "ex2_th": "เอเจนซีโฆษณาคว้าสัญญาจากลูกค้าระดับข้ามชาติมาได้ เพราะแคมเปญของพวกเขาสะท้อนให้เห็นถึงความคิดสร้างสรรค์ที่แปลกใหม่และอยู่นอกกรอบอย่างแท้จริง", "slot_num": 133, "sheet_no": 2, "first_letter": "O"}, {"id": 130, "orig_slot": "#134", "idiom": "Pull yourself together", "meaning": "Stop being upset; calm down.", "thai_idiom": "ตั้งสติ / ดึงสติกลับมา / ควบคุมอารมณ์", "thai_meaning": "สงบสติอารมณ์ ควบคุมความรู้สึก และรวบรวมสมาธิให้กลับมาพร้อมรับมือกับสถานการณ์", "ex1_en": "Take a deep breath, drink some water, and <span class=\"hl-teal\">pull yourself together</span> before you speak to the examiner.", "ex1_hl": "pull yourself together", "ex1_th": "หายใจเข้าลึก ๆ จิบน้ำสักนิด แล้วตั้งสติดี ๆ ก่อนที่เธอจะเข้าไปคุยกับกรรมการคุมสอบนะ", "ex2_en": "Despite the disastrous quarterly presentation, the marketing director had to <span class=\"hl-teal\">pull herself together</span> and answer tough inquiries from board directors.", "ex2_hl": "pull herself together", "ex2_th": "แม้การนำเสนอผลงานประจำไตรมาสจะออกมาล้มเหลวไม่เป็นท่า แต่ผู้อำนวยการฝ่ายการตลาดก็ต้องดึงสติกลับมาอย่างรวดเร็วเพื่อตอบคำถามอันดุเดือดจากคณะกรรมการ", "slot_num": 134, "sheet_no": 2, "first_letter": "P"}, {"id": 131, "orig_slot": "#135", "idiom": "See the light", "meaning": "Understand finally.", "thai_idiom": "ตาสว่าง / บรรลุ / เข้าใจแจ่มแจ้งในที่สุด", "thai_meaning": "ในที่สุดก็เข้าใจความจริงหรือตระหนักถึงสิ่งที่ถูกต้องหลังจากที่เข้าใจผิดหรือมองข้ามมานาน", "ex1_en": "After spending hundreds on fad diet pills with no progress, Kevin finally <span class=\"hl-teal\">saw the light</span> and hired a qualified fitness coach.", "ex1_hl": "saw the light", "ex1_th": "หลังจากเสียเงินหลายร้อยดอลลาร์ไปกับยาลดความอ้วนตามกระแสแล้วไม่ได้ผล เควินก็ตาสว่างขึ้นมาในที่สุดและยอมจ้างโค้ชออกกำลังกายมืออาชีพ", "ex2_en": "Facing dwindling store sales, the traditional retailer finally <span class=\"hl-teal\">saw the light</span> and migrated their entire inventory system to the cloud.", "ex2_hl": "saw the light", "ex2_th": "เมื่อต้องเผชิญกับยอดขายหน้าร้านที่ลดฮวบลงเรื่อย ๆ ร้านค้าปลีกแบบดั้งเดิมก็ตระหนักรู้และเข้าใจในที่สุด จนยอมย้ายระบบคลังสินค้าทั้งหมดขึ้นสู่คลาวด์", "slot_num": 135, "sheet_no": 2, "first_letter": "S"}, {"id": 132, "orig_slot": "#137", "idiom": "The last straw", "meaning": "The final problem.", "thai_idiom": "ฟางเส้นสุดท้าย", "thai_meaning": "ปัญหาหรือความอดทนหยดสุดท้ายที่ทำให้สถานการณ์พังทลายลง หรือทำให้ไม่อาจทนยอมรับได้อีกต่อไป", "ex1_en": "He had been habitually late for dinner all week, but forgetting our anniversary dinner was <span class=\"hl-teal\">the last straw</span>.", "ex1_hl": "the last straw", "ex1_th": "เขามาทานมื้อค่ำสายจนเป็นนิสัยตลอดทั้งสัปดาห์ แต่การลืมมื้อค่ำวันครบรอบแต่งงานของเราคือฟางเส้นสุดท้ายจริง ๆ", "ex2_en": "When the firm abruptly cancelled promised holiday bonuses without notice, it proved to be <span class=\"hl-teal\">the last straw</span> for several senior engineers.", "ex2_hl": "the last straw", "ex2_th": "การที่บริษัทสั่งยกเลิกเงินโบนัสวันหยุดตามที่เคยสัญญาไว้โดยไม่มีการแจ้งล่วงหน้า กลายเป็นฟางเส้นสุดท้ายที่ทำให้วิศวกรอาวุโสหลายคนตัดสินใจลาออกทันที", "slot_num": 137, "sheet_no": 2, "first_letter": "T"}, {"id": 133, "orig_slot": "#138", "idiom": "Time flies", "meaning": "Time passes quickly.", "thai_idiom": "เวลาผ่านไปไวเหมือนโกหก / เวลาผ่านไปเร็วมาก", "thai_meaning": "เวลาเคลื่อนผ่านไปอย่างรวดเร็วโดยไม่ทันรู้สึกตัว", "ex1_en": "We started chatting over coffee at noon and suddenly it was dark outside; how <span class=\"hl-teal\">time flies</span> when catching up with dear friends!", "ex1_hl": "time flies", "ex1_th": "พวกเราเริ่มนั่งคุยกันตอนดื่มกาแฟตอนเที่ยง เผลอแป๊บเดียวข้างนอกก็มืดแล้ว เวลาช่างผ่านไปไวเหมือนโกหกจริง ๆ เมื่อได้พูดคุยกับเพื่อนรัก", "ex2_en": "Looking back at our decade-long tenure building this biotech startup, <span class=\"hl-teal\">time flies</span> faster than any of our founders imagined.", "ex2_hl": "time flies", "ex2_th": "เมื่อมองย้อนกลับไปตลอดระยะเวลาสิบปีที่ทุ่มเทสร้างสตาร์ทอัปเทคโนโลยีชีวภาพแห่งนี้ เวลาผ่านไปรวดเร็วกว่าที่ผู้ก่อตั้งคนไหน ๆ คาดคิดไว้เสียอีก", "slot_num": 138, "sheet_no": 2, "first_letter": "T"}, {"id": 134, "orig_slot": "#139", "idiom": "True to form", "meaning": "Act the way expected.", "thai_idiom": "ตามฟอร์ม / ลายออกเหมือนเดิม / ไม่ทิ้งลายเดิม", "thai_meaning": "แสดงพฤติกรรมหรือทำสิ่งต่าง ๆ ตรงตามลักษณะนิสัยเดิมที่คาดเดาไว้ไม่มีผิดเพี้ยน", "ex1_en": "<span class=\"hl-teal\">True to form</span>, Uncle Dave arrived thirty minutes late for Sunday brunch with a humorous excuse.", "ex1_hl": "True to form", "ex1_th": "ตามฟอร์มเดิมไม่มีผิด ลุงเดฟมาสายไปครึ่งชั่วโมงสำหรับมื้อสายวันอาทิตย์ พร้อมกับข้ออ้างขำขันแก้เก้อ", "ex2_en": "<span class=\"hl-teal\">True to form</span>, the conservative central bank governor voted against interest rate cuts despite mounting political lobbying.", "ex2_hl": "True to form", "ex2_th": "เป็นไปตามแบบฉบับดั้งเดิมไม่มีเปลี่ยน ผู้ว่าการธนาคารกลางสายอนุรักษนิยมลงมติคัดค้านการลดอัตราดอกเบี้ย แม้จะเผชิญแรงกดดันทางการเมืองอย่างหนักก็ตาม", "slot_num": 139, "sheet_no": 2, "first_letter": "T"}, {"id": 135, "orig_slot": "#140", "idiom": "Up in the air", "meaning": "Uncertain.", "thai_idiom": "ยังเคว้งอยู่ / ยังลูกผีลูกคน / ยังไม่แน่นอน", "thai_meaning": "ยังไม่มีข้อสรุป ยังค้างคา หรือยังไม่ได้รับการตัดสินใจที่แน่นอน", "ex1_en": "Our weekend camping plans are still completely <span class=\"hl-teal\">up in the air</span> because torrential rain is forecast across the region.", "ex1_hl": "up in the air", "ex1_th": "แผนไปตั้งแคมป์ช่วงสุดสัปดาห์ของเรายังเอาแน่เอานอนไม่ได้เลย เพราะพยากรณ์อากาศเตือนว่าจะมีฝนตกหนักทั่วพื้นที่", "ex2_en": "The proposed merger between the two airline carriers remains <span class=\"hl-teal\">up in the air</span> pending regulatory antitrust clearance.", "ex2_hl": "up in the air", "ex2_th": "แผนการควบรวมกิจการระหว่างสองสายการบินยังคงลูกผีลูกคนและไร้ข้อสรุปที่แน่ชัด ระหว่างรอการอนุมัติตามกฎหมายป้องกันการผูกขาด", "slot_num": 140, "sheet_no": 2, "first_letter": "U"}, {"id": 136, "orig_slot": "#141", "idiom": "Wear your heart on your sleeve", "meaning": "Show your feelings openly.", "thai_idiom": "เปิดเผยความรู้สึกอย่างหมดเปลือก / เก็บอารมณ์ไม่เป็น", "thai_meaning": "แสดงความรู้สึกหรืออารมณ์ในใจออกมาอย่างตรงไปตรงมาจนคนอื่นมองออกได้ทันที", "ex1_en": "You always know exactly what Chloe is thinking because she <span class=\"hl-teal\">wears her heart on her sleeve</span>.", "ex1_hl": "wears her heart on her sleeve", "ex1_th": "เธอจะรู้ได้ทันทีเสมอว่าโคลอี้คิดอะไรอยู่ เพราะเธอเป็นคนเปิดเผยความรู้สึกอย่างหมดเปลือกและเก็บอารมณ์ไม่เป็นเลย", "ex2_en": "A skilled labor negotiator must maintain a stoic composure rather than <span class=\"hl-teal\">wearing their heart on their sleeve</span> during contentious contract talks.", "ex2_hl": "wearing their heart on their sleeve", "ex2_th": "นักเจรจาต่อรองด้านแรงงานที่มีทักษะจะต้องรักษาความนิ่งสุขุม แทนที่จะแสดงอารมณ์ความรู้สึกออกมาอย่างเปิดเผยในการเจรจาสัญญาอันตึงเครียด", "slot_num": 141, "sheet_no": 2, "first_letter": "W"}, {"id": 137, "orig_slot": "#142", "idiom": "When in Rome, do as the Romans do", "meaning": "Adapt to the situation.", "thai_idiom": "เข้าเมืองตาหลิ่ว ต้องหลิ่วตาตาม", "thai_meaning": "เมื่อเดินทางไปยังต่างถิ่นหรืออยู่ในสภาพแวดล้อมใหม่ ควรปรับตัวและปฏิบัติตามขนบธรรมเนียมของคนในท้องถิ่นนั้น", "ex1_en": "I don't normally eat spicy curries for breakfast, but <span class=\"hl-teal\">when in Rome, do as the Romans do</span>.", "ex1_hl": "when in Rome, do as the Romans do", "ex1_th": "ปกติฉันไม่กินแกงเผ็ดเป็นอาหารเช้าหรอกนะ แต่เข้าเมืองตาหลิ่วก็ต้องหลิ่วตาตาม", "ex2_en": "Expatriate managers relocating to the Tokyo branch quickly realized that <span class=\"hl-teal\">when in Rome, do as the Romans do</span> applies directly to corporate hierarchy and etiquette.", "ex2_hl": "when in Rome, do as the Romans do", "ex2_th": "ผู้จัดการชาวต่างชาติที่ย้ายไปประจำสาขาโตเกียวตระหนักได้ทันทีว่า สุภาษิตเข้าเมืองตาหลิ่วต้องหลิ่วตาตามนั้นมีความสำคัญอย่างยิ่งต่อการปฏิบัติตนตามลำดับขั้นและมารยาทในองค์กรญี่ปุ่น", "slot_num": 142, "sheet_no": 2, "first_letter": "W"}, {"id": 138, "orig_slot": "#143", "idiom": "With bells on", "meaning": "Very eagerly.", "thai_idiom": "ด้วยความกระตือรือร้นอย่างยิ่ง / พร้อมเต็มที่ด้วยความยินดี", "thai_meaning": "มาหรือเข้าร่วมด้วยความกระตือรือร้น ตื่นเต้น และเต็มอกเต็มใจอย่างยิ่ง", "ex1_en": "Are you coming to my rooftop birthday bash tomorrow night? — Absolutely, I'll be there <span class=\"hl-teal\">with bells on</span>!", "ex1_hl": "with bells on", "ex1_th": "พรุ่งนี้ค่ำเธอจะมาร่วมปาร์ตี้วันเกิดบนดาดฟ้าของฉันไหม — ไปแน่นอนอยู่แล้ว ฉันจะไปแบบพร้อมเต็มที่ด้วยความยินดีเลยล่ะ!", "ex2_en": "When invited to present the keynote address at the international robotics symposium, Professor Lin accepted <span class=\"hl-teal\">with bells on</span>.", "ex2_hl": "with bells on", "ex2_th": "เมื่อได้รับเทียบเชิญให้เป็นองค์ปาฐกหลักในการประชุมวิชาการหุ่นยนต์ระดับนานาชาติ ศาสตราจารย์หลินก็ตอบรับด้วยความยินดีและกระตือรือร้นเป็นอย่างยิ่ง", "slot_num": 143, "sheet_no": 2, "first_letter": "W"}, {"id": 139, "orig_slot": "#144", "idiom": "You can say that again", "meaning": "I completely agree.", "thai_idiom": "เห็นด้วยอย่างยิ่ง / พูดอีกก็ถูกอีก / จริงแท้แน่นอน", "thai_meaning": "ใช้แสดงความเห็นพ้องอย่างหนักแน่นว่าสิ่งที่อีกฝ่ายพูดนั้นถูกต้องและจริงที่สุด", "ex1_en": "\"This humid summer weather is absolutely unbearable!\" — \"<span class=\"hl-teal\">You can say that again</span>; I've had the fan running all day.\"", "ex1_hl": "You can say that again", "ex1_th": "\"อากาศอบอ้าวช่วงฤดูร้อนนี้มันทนแทบไม่ไหวจริง ๆ!\" — \"พูดอีกก็ถูกอีก ฉันเปิดพัดลมจ่อไว้ทั้งวันแล้วเนี่ย\"", "ex2_en": "\"Completing this compliance audit ahead of schedule required superhuman effort.\" — \"<span class=\"hl-teal\">You can say that again</span>; our entire squad worked weekends.\"", "ex2_hl": "You can say that again", "ex2_th": "\"การปิดการตรวจสอบมาตรฐานได้เร็วกว่ากำหนดต้องใช้ความพยายามอย่างมหาศาลจริง ๆ\" — \"เห็นด้วยอย่างยิ่งเลย ทีมเราทำงานหามรุ่งหามค่ำช่วงสุดสัปดาห์กันทุกคน\"", "slot_num": 144, "sheet_no": 2, "first_letter": "Y"}, {"id": 140, "orig_slot": "#145", "idiom": "A breath of fresh air", "meaning": "Something new and good.", "thai_idiom": "สายลมแห่งความสดชื่น / สิ่งแปลกใหม่ที่ชวนรื่นรมย์", "thai_meaning": "สิ่งใหม่ คนใหม่ หรือไอเดียใหม่ที่นำพาความสดชื่น น่าพึงพอใจ หรือการเปลี่ยนแปลงที่ดีขึ้นมาให้", "ex1_en": "After months of listening to generic pop hits on the radio, hearing this indie acoustic singer was <span class=\"hl-teal\">a breath of fresh air</span>.", "ex1_hl": "a breath of fresh air", "ex1_th": "หลังจากต้องทนฟังเพลงป็อปซ้ำซากทางวิทยุมาหลายเดือน การได้ฟังเพลงของนักร้องอะคูสติกนอกกระแสคนนี้ช่างให้ความรู้สึกสดชื่นแปลกใหม่จริง ๆ", "ex2_en": "Bringing in a dynamic creative director with gaming experience was <span class=\"hl-teal\">a breath of fresh air</span> for the legacy publishing house.", "ex2_hl": "a breath of fresh air", "ex2_th": "การดึงตัวผู้อำนวยการฝ่ายสร้างสรรค์รุ่นใหม่ที่มีประสบการณ์จากวงการเกมเข้ามา ถือเป็นสายลมแห่งความสดชื่นที่ช่วยเติมพลังใหม่ ๆ ให้กับสำนักพิมพ์เก่าแก่อย่างยิ่ง", "slot_num": 145, "sheet_no": 2, "first_letter": "A"}, {"id": 141, "orig_slot": "#147", "idiom": "Bite the hand that feeds you", "meaning": "Hurt someone who helps you.", "thai_idiom": "เนรคุณ / กินบนเรือนขี้บนหลังคา", "thai_meaning": "ทำร้ายหรือตอบแทนผู้ที่มีบุญคุณ ช่วยเหลือ หรือสนับสนุนตนเองด้วยการกระทำอันเลวร้าย", "ex1_en": "Uncle Leo paid your tuition and gave you a room rent-free, so don't <span class=\"hl-teal\">bite the hand that feeds you</span> by insulting his lifestyle.", "ex1_hl": "bite the hand that feeds you", "ex1_th": "ลุงลีโอช่วยจ่ายค่าเทอมให้แถมยังให้อยู่ห้องฟรี อย่าทำตัวกินบนเรือนขี้บนหลังคาด้วยการไปพูดจาดูถูกการใช้ชีวิตของเขาเลย", "ex2_en": "Publicly disparaging your primary corporate sponsor on social media is foolishly <span class=\"hl-teal\">biting the hand that feeds you</span>.", "ex2_hl": "biting the hand that feeds you", "ex2_th": "การออกมาวิพากษ์วิจารณ์สปอนเซอร์รายใหญ่ของตนเองในแง่ลบบนโซเชียลมีเดีย คือการกระทำอันโง่เขลาที่ไม่ต่างอะไรกับการแว้งกัดผู้มีพระคุณที่คอยสนับสนุนคุณอยู่", "slot_num": 147, "sheet_no": 2, "first_letter": "B"}, {"id": 142, "orig_slot": "#149", "idiom": "Get your act together", "meaning": "Organize yourself.", "thai_idiom": "ปรับปรุงตัว / จัดการตัวเองให้เข้าที่เข้าทาง", "thai_meaning": "จัดระเบียบตัวเอง ปรับปรุงพฤติกรรมหรือการทำงานให้มีประสิทธิภาพและมีความรับผิดชอบมากขึ้น", "ex1_en": "If you want to pass your driving test on the next attempt, you really need to <span class=\"hl-teal\">get your act together</span> and practice parallel parking.", "ex1_hl": "get your act together", "ex1_th": "ถ้าเธออยากจะสอบใบขับขี่ผ่านในครั้งต่อไป เธอต้องจัดการตัวเองให้เข้าที่เข้าทางแล้วฝึกจอดเทียบข้างให้ชำนาญจริง ๆ เสียที", "ex2_en": "Management warned the regional distribution team to <span class=\"hl-teal\">get their act together</span> before shipping delays triggered heavy breach-of-contract penalties.", "ex2_hl": "get their act together", "ex2_th": "ฝ่ายบริหารได้ส่งสัญญาณเตือนทีมกระจายสินค้าระดับภูมิภาคให้เร่งปรับปรุงการทำงานให้เป็นระบบ ก่อนที่ปัญหาการส่งมอบล่าช้าจะนำไปสู่การถูกปรับฐานผิดสัญญาอย่างหนัก", "slot_num": 149, "sheet_no": 2, "first_letter": "G"}, {"id": 143, "orig_slot": "#150", "idiom": "Hold the fort", "meaning": "Stay in charge in absence of the leader.", "thai_idiom": "เฝ้าโยง / ดูแลความเรียบร้อยแทน", "thai_meaning": "รับหน้าที่ดูแลรับผิดชอบสถานที่หรือการดำเนินงานชั่วคราวในระหว่างที่หัวหน้าหรือผู้มีอำนาจไม่อยู่", "ex1_en": "I need to run to the pharmacy to pick up my mother's prescription, so can you <span class=\"hl-teal\">hold the fort</span> here and watch the soup?", "ex1_hl": "hold the fort", "ex1_th": "ฉันต้องรีบไปรับยาตามใบสั่งแพทย์ให้แม่ที่ร้านขายยา เธอช่วยอยู่เฝ้าบ้านแล้วช่วยดูหม้อซุปให้หน่อยได้ไหม", "ex2_en": "While the branch manager attended an overseas shareholders summit, the assistant manager was assigned to <span class=\"hl-teal\">hold the fort</span>.", "ex2_hl": "hold the fort", "ex2_th": "ในระหว่างที่ผู้จัดการสาขาเดินทางไปร่วมการประชุมผู้ถือหุ้นที่ต่างประเทศ ผู้ช่วยผู้จัดการก็ได้รับมอบหมายให้อยู่ดูแลความเรียบร้อยและสั่งการแทน", "slot_num": 150, "sheet_no": 2, "first_letter": "H"}, {"id": 144, "orig_slot": "#151", "idiom": "In the nick of time", "meaning": "Just in time.", "thai_idiom": "ฉิวเฉียด / ทันเวลาพอดีแบบเส้นยาแดงผ่าแปด", "thai_meaning": "ทันเวลาอย่างหวุดหวิดก่อนที่บางสิ่งจะสายเกินไปหรือเกิดความเสียหายขึ้น", "ex1_en": "We sprinted toward the boarding gate and reached it <span class=\"hl-teal\">in the nick of time</span> right as the attendants were locking the doors.", "ex1_hl": "in the nick of time", "ex1_th": "พวกเราวิ่งหน้าตั้งไปยังประตูขึ้นเครื่องและไปถึงได้ทันเวลาอย่างฉิวเฉียด พอดีกับตอนที่เจ้าหน้าที่กำลังจะปิดประตูล็อกพอดี", "ex2_en": "The paralegal uploaded the sealed patent filing <span class=\"hl-teal\">in the nick of time</span>, mere seconds before the midnight statutory deadline.", "ex2_hl": "in the nick of time", "ex2_th": "เจ้าหน้าที่ผู้ช่วยทนายความอัปโหลดเอกสารคำขอสิทธิบัตรที่ปิดผนึกได้ทันเวลาแบบเส้นยาแดงผ่าแปด เพียงไม่กี่วินาทีก่อนจะพ้นกำหนดเวลาตามกฎหมายตอนเที่ยงคืน", "slot_num": 151, "sheet_no": 2, "first_letter": "I"}, {"id": 145, "orig_slot": "#152", "idiom": "Keep your fingers crossed", "meaning": "Hope for the best.", "thai_idiom": "เอาใจช่วย / ภาวนาขอให้โชคดี", "thai_meaning": "หวังหรือภาวนาให้สิ่งดีๆ เกิดขึ้น หรือขอให้ทุกอย่างราบรื่น", "ex1_en": "I'm having my final driving test this afternoon, so please <span class=\"hl-teal\">keep your fingers crossed</span> for me!", "ex1_hl": "keep your fingers crossed", "ex1_th": "บ่ายนี้ฉันจะสอบใบขับขี่รอบสุดท้ายแล้ว ช่วยเอาใจช่วยภาวนาให้ฉันด้วยนะ!", "ex2_en": "We submitted our grant proposal to the foundation yesterday, and the entire research team is <span class=\"hl-teal\">keeping their fingers crossed</span>.", "ex2_hl": "keeping their fingers crossed", "ex2_th": "พวกเรายื่นข้อเสนอขอทุนวิจัยต่อมูลนิธิไปเมื่อวานนี้ และตอนนี้ทีมวิจัยทุกคนต่างก็ลุ้นและภาวนาให้ผ่านฉลุย", "slot_num": 152, "sheet_no": 2, "first_letter": "K"}, {"id": 146, "orig_slot": "#153", "idiom": "Learn the hard way", "meaning": "Learn from mistakes.", "thai_idiom": "เจ็บแล้วจำ / เรียนรู้จากบทเรียนราคาแพง", "thai_meaning": "เรียนรู้จากความผิดพลาดหรือประสบการณ์อันเจ็บปวดด้วยตนเอง", "ex1_en": "I didn't back up my laptop before the system update and lost all my photos, so I <span class=\"hl-teal\">learned the hard way</span>.", "ex1_hl": "learned the hard way", "ex1_th": "ฉันไม่ได้สำรองข้อมูลโน้ตบุ๊กก่อนอัปเดตระบบจนรูปหายหมด ถือเป็นบทเรียนราคาแพงที่ทำให้จำขึ้นใจเลย", "ex2_en": "The startup <span class=\"hl-teal\">learned the hard way</span> that expanding into foreign markets requires thorough legal compliance rather than aggressive marketing alone.", "ex2_hl": "learned the hard way", "ex2_th": "สตาร์ตอัปรายนี้ได้รับบทเรียนราคาแพงว่าการขยายธุรกิจไปต่างชาติต้องอาศัยความถูกต้องทางกฎหมายอย่างรอบคอบ ไม่ใช่พึ่งพาแค่การตลาดเชิงรุกเท่านั้น", "slot_num": 153, "sheet_no": 2, "first_letter": "L"}, {"id": 147, "orig_slot": "#154", "idiom": "Let the chips fall where they may", "meaning": "Accept the result.", "thai_idiom": "อะไรจะเกิดก็ต้องเกิด / ปล่อยให้เป็นไปตามยถากรรม", "thai_meaning": "ปล่อยให้เรื่องราวเป็นไปตามสิ่งที่ควรจะเป็นโดยพร้อมยอมรับผลลัพธ์ ไม่ว่าผลจะออกมาอย่างไร", "ex1_en": "I told Sarah the honest truth about why I couldn't attend her wedding, and now I just have to <span class=\"hl-teal\">let the chips fall where they may</span>.", "ex1_hl": "let the chips fall where they may", "ex1_th": "ฉันบอกความจริงกับซาร่าตรงๆ แล้วว่าทำไมถึงไปงานแต่งไม่ได้ ตอนนี้ก็คงต้องปล่อยให้อะไรจะเกิดก็ต้องเกิด", "ex2_en": "The CEO decided to publish the full environmental audit unredacted and <span class=\"hl-teal\">let the chips fall where they may</span> regarding public backlash.", "ex2_hl": "let the chips fall where they may", "ex2_th": "ประธานเจ้าหน้าที่บริหารตัดสินใจเปิดเผยรายงานการตรวจสอบผลกระทบสิ่งแวดล้อมฉบับเต็มโดยไม่ปิดบังส่วนใด และพร้อมน้อมรับผลสะท้อนกลับจากสาธารณชนไม่ว่าจะเกิดอะไรขึ้น", "slot_num": 154, "sheet_no": 2, "first_letter": "L"}, {"id": 148, "orig_slot": "#156", "idiom": "No pain, no gain", "meaning": "You must work hard to succeed.", "thai_idiom": "ไม่เหนื่อยก็ไม่สำเร็จ / ลำบากก่อนสบายทีหลัง", "thai_meaning": "ต้องทุ่มเทเหน็ดเหนื่อยหรือผ่านความยากลำบากก่อน จึงจะได้รับความสำเร็จหรือผลลัพธ์ที่คุ้มค่า", "ex1_en": "My legs were trembling during the third set of squats, but my trainer shouted, \"<span class=\"hl-teal\">No pain, no gain</span>!\"", "ex1_hl": "No pain, no gain", "ex1_th": "ขาฉันสั่นพั่บๆ ตอนสควอตเซ็ตที่สาม แต่เทรนเนอร์ก็ตะโกนลั่นว่า 'ถ้าไม่เจ็บไม่เหนื่อย กล้ามก็ไม่ขึ้นหรอกนะ!'", "ex2_en": "Adapting to the new enterprise software has caused significant workflow friction, but management reminds staff that <span class=\"hl-teal\">no pain, no gain</span> applies to digital transformation.", "ex2_hl": "no pain, no gain", "ex2_th": "การปรับตัวเข้ากับระบบซอฟต์แวร์องค์กรใหม่ทำให้กระบวนการทำงานสะดุดไปบ้าง แต่ฝ่ายบริหารย้ำเตือนพนักงานว่าการเปลี่ยนผ่านสู่ดิจิทัลย่อมต้องผ่านความยากลำบากก่อนจึงจะเห็นผลลัพธ์ที่คุ้มค่า", "slot_num": 156, "sheet_no": 2, "first_letter": "N"}, {"id": 149, "orig_slot": "#157", "idiom": "Out of sight, out of mind", "meaning": "Forgotten when not seen.", "thai_idiom": "ไกลตา ไกลใจ / ลับสายตาก็ลืมเลือน", "thai_meaning": "เมื่อไม่เห็นหรือไม่พบหน้ากันบ่อยๆ สิ่งนั้นหรือคนนั้นก็จะถูกลืมเลือนไปอย่างรวดเร็ว", "ex1_en": "I put all my junk food in the top cabinet behind the cereal boxes because when it's <span class=\"hl-teal\">out of sight, out of mind</span>.", "ex1_hl": "out of sight, out of mind", "ex1_th": "ฉันเอาขนมขบเคี้ยวไปเก็บไว้บนตู้ชั้นบนสุดหลังกล่องซีเรียล เพราะพอลับสายตาแล้วก็จะไม่นึกอยากกินไปเอง", "ex2_en": "Fully remote workers often worry about being <span class=\"hl-teal\">out of sight, out of mind</span> when senior leadership reviews promotional candidates.", "ex2_hl": "out of sight, out of mind", "ex2_th": "พนักงานที่ทำงานจากที่บ้านเต็มเวลามักกังวลว่าจะถูกมองข้ามหรือลืมเลือน ยามที่ผู้บริหารระดับสูงพิจารณารายชื่อผู้เหมาะสมได้รับการเลื่อนตำแหน่ง", "slot_num": 157, "sheet_no": 2, "first_letter": "O"}, {"id": 150, "orig_slot": "#158", "idiom": "Practice what you preach", "meaning": "Do what you say.", "thai_idiom": "ทำได้อย่างที่พูด / เป็นแบบอย่างที่ดี", "thai_meaning": "ปฏิบัติตามสิ่งที่ตนเองสอนหรือพร่ำบอกให้คนอื่นทำ ทำตัวให้เป็นแบบอย่าง", "ex1_en": "Dad tells us to put our phones away at dinner, but he needs to <span class=\"hl-teal\">practice what he preaches</span> and stop checking his emails.", "ex1_hl": "practice what he preaches", "ex1_th": "พ่อบอกให้พวกเราวางมือถือตอนกินข้าว แต่พ่อเองก็ต้องทำตามที่สอนด้วยการหยุดเช็กอีเมลตอนมื้ออาหารเหมือนกันนะ", "ex2_en": "If the executive leadership wants to establish a culture of work-life balance, they must <span class=\"hl-teal\">practice what they preach</span> by taking their mandatory paid leave.", "ex2_hl": "practice what they preach", "ex2_th": "หากคณะผู้บริหารต้องการสร้างวัฒนธรรมความสมดุลระหว่างชีวิตและการทำงาน พวกเขาก็ต้องทำตัวเป็นแบบอย่างด้วยการใช้วันลาพักร้อนประจำปีตามสิทธิ์ของตนเองเช่นกัน", "slot_num": 158, "sheet_no": 2, "first_letter": "P"}, {"id": 151, "orig_slot": "#159", "idiom": "Put the cart before the horse", "meaning": "Do things in the wrong order.", "thai_idiom": "ทำผิดขั้นตอน / สลับหัวสลับหาง", "thai_meaning": "ทำสิ่งต่างๆ ผิดลำดับขั้นตอน หรือเอาสิ่งที่ควรทำทีหลังมาทำก่อน", "ex1_en": "Buying furniture before you even sign the lease for the apartment is definitely <span class=\"hl-teal\">putting the cart before the horse</span>.", "ex1_hl": "putting the cart before the horse", "ex1_th": "การรีบซื้อเฟอร์นิเจอร์ตั้งแต่ยังไม่ได้เซ็นสัญญาเช่าห้อง ถือเป็นการทำอะไรข้ามขั้นตอนอย่างชัดเจนเลย", "ex2_en": "Designing elaborate advertising campaigns before validating product-market fit is simply <span class=\"hl-teal\">putting the cart before the horse</span>.", "ex2_hl": "putting the cart before the horse", "ex2_th": "การทุ่มงบออกแบบแคมเปญโฆษณาหรูหราก่อนจะทดสอบว่าสินค้าตอบโจทย์ตลาดจริงหรือไม่ เป็นการทำผิดลำดับขั้นตอนตั้งแต่ต้น", "slot_num": 159, "sheet_no": 2, "first_letter": "P"}, {"id": 152, "orig_slot": "#160", "idiom": "The elephant in the room", "meaning": "A big issue everyone ignores.", "thai_idiom": "ปัญหาคาตาแต่ไม่มีใครกล้าพูด / เรื่องใหญ่ที่แกล้งมองไม่เห็น", "thai_meaning": "ปัญหาหรือประเด็นใหญ่ที่ชัดเจนมากและทุกคนรับรู้ แต่ไม่มีใครกล้าหยิบยกขึ้นมาพูดคุยตรงๆ เพราะกลัวกระอักกระอ่วน", "ex1_en": "Nobody mentioned Mark's sudden breakup at the family dinner, even though it was clearly <span class=\"hl-teal\">the elephant in the room</span>.", "ex1_hl": "the elephant in the room", "ex1_th": "ไม่มีใครพูดถึงเรื่องที่มาร์กเพิ่งเลิกกับแฟนในโต๊ะอาหารครอบครัว ทั้งที่ทุกคนก็รู้ดีและเป็นเรื่องใหญ่ที่เห็นตำตากันอยู่", "ex2_en": "During the quarterly review, the sudden departure of the chief technology officer remained <span class=\"hl-teal\">the elephant in the room</span> that no director dared address.", "ex2_hl": "the elephant in the room", "ex2_th": "ในระหว่างการประชุมทบทวนผลประกอบการประจำไตรมาส การลาออกกะทันหันของประธานเจ้าหน้าที่ฝ่ายเทคโนโลยียังคงเป็นประเด็นสำคัญที่ทุกคนแกล้งทำเป็นมองไม่เห็นและไม่มีกรรมการคนใดกล้าเอ่ยถึง", "slot_num": 160, "sheet_no": 2, "first_letter": "T"}, {"id": 153, "orig_slot": "#161", "idiom": "Take it with a grain of salt", "meaning": "Don't believe completely.", "thai_idiom": "ฟังหูไว้หู / อย่าเพิ่งปักใจเชื่อ", "thai_meaning": "รับฟังข้อมูลหรือคำพูดโดยเผื่อใจไว้ ไม่เชื่อทั้งหมดร้อยเปอร์เซ็นต์เพราะอาจมีอคติหรือข้อเท็จจริงคลาดเคลื่อน", "ex1_en": "Ben loves to exaggerate his travel stories, so you should <span class=\"hl-teal\">take them with a grain of salt</span>.", "ex1_hl": "take them with a grain of salt", "ex1_th": "เบนชอบเล่าเรื่องผจญภัยเกินจริงอยู่เรื่อย ดังนั้นเธอควรฟังหูไว้หู อย่าเพิ่งไปเชื่อทั้งหมดนะ", "ex2_en": "Financial analysts advised investors to <span class=\"hl-teal\">take the unverified quarterly earnings forecast with a grain of salt</span> until audited financial statements are released.", "ex2_hl": "take the unverified quarterly earnings forecast with a grain of salt", "ex2_th": "นักวิเคราะห์การเงินแนะนำให้นักลงทุนฟังหูไว้หูกับตัวเลขคาดการณ์กำไรไตรมาสที่ยังไม่ได้รับการยืนยัน จนกว่าจะมีการเผยแพร่งบการเงินที่ผ่านการตรวจสอบอย่างเป็นทางการ", "slot_num": 161, "sheet_no": 2, "first_letter": "T"}, {"id": 154, "orig_slot": "#163", "idiom": "Bark up the wrong tree", "meaning": "Follow the wrong person.", "thai_idiom": "เข้าใจผิดคน / หลงทาง / โทษผิดคน", "thai_meaning": "เดาผิด หาเรื่องผิดคน ดำเนินการผิดทิศทาง หรือคิดว่าใครคนหนึ่งเป็นสาเหตุทั้งที่เขาไม่ใช่", "ex1_en": "If you think I'm the one who scratched your car, you're <span class=\"hl-teal\">barking up the wrong tree</span> because I wasn't even home.", "ex1_hl": "barking up the wrong tree", "ex1_th": "ถ้าเธอคิดว่าฉันเป็นคนทำรถเธอเป็นรอยล่ะก็ เธอปรักปรำผิดคนแล้วล่ะ เพราะฉันไม่ได้อยู่บ้านเลยด้วยซ้ำ", "ex2_en": "The regulatory commission was <span class=\"hl-teal\">barking up the wrong tree</span> by auditing regional branch managers when the accounting fraud originated at corporate headquarters.", "ex2_hl": "barking up the wrong tree", "ex2_th": "คณะกรรมการกำกับดูแลเพ่งเล็งผิดจุดโดยมุ่งตรวจสอบผู้จัดการสาขาภูมิภาค ทั้งที่การฉ้อโกงทางบัญชีนั้นมีต้นตอมาจากสำนักงานใหญ่ส่วนกลาง", "slot_num": 163, "sheet_no": 2, "first_letter": "B"}, {"id": 155, "orig_slot": "#165", "idiom": "Don't count your chickens before they hatch", "meaning": "Don't assume success early.", "thai_idiom": "อย่าเพิ่งตีตนไปก่อนไข้ / อย่าเพิ่งด่วนดีใจ / สงครามยังไม่จบอย่าเพิ่งนับศพทหาร", "thai_meaning": "อย่าเพิ่งมั่นใจหรือวางแผนฉลองความสำเร็จล่วงหน้า ในเมื่อผลลัพธ์ยังไม่เกิดขึ้นจริงอย่างแน่นอน", "ex1_en": "You've only had one good interview, so <span class=\"hl-teal\">don't count your chickens before they hatch</span> by spending money on a new wardrobe.", "ex1_hl": "don't count your chickens before they hatch", "ex1_th": "เพิ่งจะสัมภาษณ์ผ่านไปรอบเดียวเอง อย่าเพิ่งด่วนดีใจไปรีบช้อปปิ้งเสื้อผ้าใหม่เลยนะ", "ex2_en": "Although client feedback on the prototype was overwhelmingly positive, the sales director cautioned the team <span class=\"hl-teal\">not to count their chickens before they hatch</span> until contracts are signed.", "ex2_hl": "not to count their chickens before they hatch", "ex2_th": "แม้ว่าเสียงตอบรับจากลูกค้าต่อผลิตภัณฑ์ต้นแบบจะดีเยี่ยม ผู้อำนวยการฝ่ายขายก็ยังเตือนทีมงานว่าอย่าเพิ่งชะล่าใจนับความสำเร็จจนกว่าจะมีการลงนามในสัญญาจริง", "slot_num": 165, "sheet_no": 2, "first_letter": "D"}, {"id": 156, "orig_slot": "#166", "idiom": "Get out of dodge", "meaning": "Leave quickly to avoid trouble.", "thai_idiom": "ชิ่งหนี / เผ่นแน่บ / รีบเผ่นเอาตัวรอด", "thai_meaning": "รีบออกจากสถานที่นั้นโดยด่วนเพื่อหลีกเลี่ยงอันตราย ความวุ่นวาย หรือปัญหาที่กำลังจะเกิดขึ้น", "ex1_en": "As soon as the heated argument at the bar turned physical, we decided to <span class=\"hl-teal\">get out of dodge</span>.", "ex1_hl": "get out of dodge", "ex1_th": "ทันทีที่มีการลงไม้ลงมือกันในการทะเลาะวิวาทที่บาร์ พวกเราก็รีบเผ่นหนีออกมาแทบไม่ทัน", "ex2_en": "Anticipating incoming coastal hurricanes, the logistics firm instructed its delivery drivers to wrap up operations and <span class=\"hl-teal\">get out of dodge</span> before highway closures.", "ex2_hl": "get out of dodge", "ex2_th": "เนื่องจากคาดการณ์ว่าพายุเฮอริเคนกำลังจะพัดขึ้นฝั่ง บริษัทโลจิสติกส์จึงสั่งการให้คนขับรถส่งสินค้าเร่งปิดงานและรีบถอนตัวออกจากพื้นที่ก่อนที่ทางหลวงจะถูกสั่งปิด", "slot_num": 166, "sheet_no": 2, "first_letter": "G"}, {"id": 157, "orig_slot": "#167", "idiom": "Go with your gut", "meaning": "Trust your instinct.", "thai_idiom": "เชื่อสัญชาตญาณ / ฟังเสียงหัวใจตัวเอง", "thai_meaning": "เชื่อการตัดสินใจตามความรู้สึกหรือสัญชาตญาณภายในตนเอง มากกว่าการวิเคราะห์ด้วยเหตุผลเพียงอย่างเดียว", "ex1_en": "Whenever I can't decide between two travel destinations, I just <span class=\"hl-teal\">go with my gut</span> and book the ticket.", "ex1_hl": "go with my gut", "ex1_th": "เวลาที่ฉันเลือกไม่ถูกว่าจะไปเที่ยวที่ไหนดีระหว่างสองเมือง ฉันมักจะเชื่อสัญชาตญาณของตัวเองแล้วกดจองตั๋วทันที", "ex2_en": "When data analytics yielded ambiguous projections about consumer reception, the venture capitalist chose to <span class=\"hl-teal\">go with her gut</span> and fund the promising founder.", "ex2_hl": "go with her gut", "ex2_th": "เมื่อผลวิเคราะห์ข้อมูลให้ภาพคาดการณ์การตอบรับของผู้บริโภคที่ไม่ชัดเจน นักลงทุนจึงเลือกที่จะเชื่อสัญชาตญาณของตัวเองและยอมอนุมัติเงินทุนให้แก่ผู้ก่อตั้งที่มีแววรุ่ง", "slot_num": 167, "sheet_no": 2, "first_letter": "G"}, {"id": 158, "orig_slot": "#168", "idiom": "Have a chip on your shoulder", "meaning": "Be offended easily.", "thai_idiom": "เจ้าคิดเจ้าแค้น / ตั้งแง่หาเรื่อง / ขี้เคืองพาลโกรธ", "thai_meaning": "มีอคติ เก็บความคับแค้นใจเอาไว้ ทำให้พร้อมจะโกรธ รู้สึกถูกดูหมิ่น หรือหาเรื่องคนอื่นได้ง่าย", "ex1_en": "Ever since Liam was left off the varsity soccer team, he has <span class=\"hl-teal\">had a chip on his shoulder</span> toward the coach.", "ex1_hl": "had a chip on his shoulder", "ex1_th": "ตั้งแต่เลียมหลุดจากตัวจริงของทีมฟุตบอลโรงเรียน เขาก็ตั้งแง่และผูกใจเจ็บต่อโค้ชมาโดยตลอด", "ex2_en": "Human resources noted that the newly hired supervisor seemed to <span class=\"hl-teal\">have a chip on his shoulder</span>, perceiving constructive critique as a personal attack.", "ex2_hl": "have a chip on his shoulder", "ex2_th": "ฝ่ายทรัพยากรบุคคลสังเกตเห็นว่าหัวหน้างานที่เพิ่งเข้ามาใหม่ดูเหมือนจะมีอคติตั้งแง่ โดยมองว่าคำวิจารณ์เชิงสร้างสรรค์เป็นการโจมตีตนเองเป็นการส่วนตัว", "slot_num": 168, "sheet_no": 2, "first_letter": "H"}, {"id": 159, "orig_slot": "#170", "idiom": "It's not rocket science", "meaning": "It's not difficult.", "thai_idiom": "ไม่ได้ยากเย็นอะไรเลย / ไม่ใช่เรื่องคอขาดบาดตายหรือซับซ้อน", "thai_meaning": "เรื่องง่ายๆ ไม่ได้ซับซ้อนหรือยากเกินความสามารถของคนทั่วไปที่จะเข้าใจหรือทำได้", "ex1_en": "You just need to boil the pasta for eight minutes and stir in the sauce; <span class=\"hl-teal\">it's not rocket science</span>.", "ex1_hl": "it's not rocket science", "ex1_th": "แค่ต้มเส้นพาสต้าแปดนาทีแล้วคลุกเคล้ากับซอส มันไม่ได้ยากเย็นอะไรเลยสักนิด", "ex2_en": "Reorganizing the shared cloud folders according to project dates <span class=\"hl-teal\">is not rocket science</span>, yet team members continually misplace crucial client assets.", "ex2_hl": "is not rocket science", "ex2_th": "การจัดระเบียบโฟลเดอร์คลาวด์ส่วนกลางตามวันที่ดำเนินโครงการไม่ได้เป็นเรื่องซับซ้อนอะไรเลย แต่สมาชิกในทีมก็ยังคงวางไฟล์สำคัญของลูกค้าผิดที่อยู่เรื่อย", "slot_num": 170, "sheet_no": 2, "first_letter": "I"}, {"id": 160, "orig_slot": "#171", "idiom": "Keep an open mind", "meaning": "Be willing to consider ideas.", "thai_idiom": "เปิดใจกว้าง / ไม่ด่วนตัดสิน", "thai_meaning": "เปิดรับและพร้อมรับฟังความคิดเห็น มุมมอง หรือข้อเสนอใหม่ๆ โดยไม่รีบปฏิเสธหรือมีอคติ", "ex1_en": "I wasn't sure about trying raw oysters, but my friend asked me to <span class=\"hl-teal\">keep an open mind</span> and give it a shot.", "ex1_hl": "keep an open mind", "ex1_th": "ตอนแรกฉันไม่ค่อยแน่ใจว่าจะกินหอยนางรมสดดีไหม แต่เพื่อนขอให้ฉันเปิดใจลองชิมดูสักคำ", "ex2_en": "Senior partners urged committee members to <span class=\"hl-teal\">keep an open mind</span> during the presentation of unorthodox restructuring strategies.", "ex2_hl": "keep an open mind", "ex2_th": "หุ้นส่วนอาวุโสกระตุ้นให้คณะกรรมการทุกคนเปิดใจรับฟังอย่างเป็นกลาง ในระหว่างการนำเสนอกลยุทธ์ปรับโครงสร้างองค์กรที่ฉีกแนวจากเดิม", "slot_num": 171, "sheet_no": 2, "first_letter": "K"}, {"id": 161, "orig_slot": "#172", "idiom": "Let bygones be bygones", "meaning": "Forgive and forget.", "thai_idiom": "อะไรที่แล้วก็ให้แล้วกันไป / ไม่ฟื้นฝอยหาตะเข็บ", "thai_meaning": "ให้อภัยและปล่อยให้เรื่องบาดหมางในอดีตผ่านพ้นไป ไม่นำกลับมาโกรธเคืองกันอีก", "ex1_en": "After years of not speaking over a petty disagreement, my sister and I finally decided to <span class=\"hl-teal\">let bygones be bygones</span>.", "ex1_hl": "let bygones be bygones", "ex1_th": "หลังจากไม่คุยกันมาหลายปีเพราะเรื่องผิดใจกันเล็กๆ น้อยๆ ในที่สุดฉันกับพี่สาวก็ตัดสินใจว่าอะไรที่แล้วก็ให้แล้วกันไป", "ex2_en": "Following months of bitter contract negotiations, both corporate entities agreed to <span class=\"hl-teal\">let bygones be bygones</span> to ensure a harmonious joint venture.", "ex2_hl": "let bygones be bygones", "ex2_th": "หลังจากการเจรจาสัญญาอันตึงเครียดและดุเดือดหลายเดือน ทั้งสองบริษัทตกลงที่จะลืมความขัดแย้งในอดีตเพื่อเดินหน้าการร่วมทุนอย่างราบรื่น", "slot_num": 172, "sheet_no": 2, "first_letter": "L"}, {"id": 162, "orig_slot": "#173", "idiom": "Make a mountain out of a molehill", "meaning": "Exaggerate a small problem.", "thai_idiom": "ทำเรื่องเล็กให้เป็นเรื่องใหญ่ / ตีโพยตีพายเกินเหตุ", "thai_meaning": "ทำให้ปัญหาเล็กน้อยดูร้ายแรงหรือซับซ้อนเกินความเป็นจริง", "ex1_en": "You only spilled a few drops of water on the rug, so don't <span class=\"hl-teal\">make a mountain out of a molehill</span>.", "ex1_hl": "make a mountain out of a molehill", "ex1_th": "เธอแค่น้ำหกลงบนพรมไม่กี่หยดเอง อย่าทำเรื่องเล็กให้กลายเป็นเรื่องใหญ่ไปหน่อยเลย", "ex2_en": "The project sponsor cautioned stakeholders against <span class=\"hl-teal\">making a mountain out of a molehill</span> over a minor two-day vendor shipment delay.", "ex2_hl": "making a mountain out of a molehill", "ex2_th": "ผู้สนับสนุนโครงการเตือนผู้มีส่วนได้ส่วนเสียว่าอย่าเพิ่งตีโพยตีพายทำเรื่องเล็กให้เป็นเรื่องใหญ่ เพียงเพราะซัพพลายเออร์ส่งของล่าช้าไปสองวัน", "slot_num": 173, "sheet_no": 2, "first_letter": "M"}, {"id": 163, "orig_slot": "#174", "idiom": "Off the record", "meaning": "Not for public knowledge.", "thai_idiom": "ไม่เปิดเผยเป็นทางการ / พูดคุยเป็นการส่วนตัว (ห้ามนำไปเผยแพร่)", "thai_meaning": "ข้อมูลที่ให้ไว้โดยไม่ประสงค์ให้เผยแพร่ต่อสาธารณะ หรือไม่อนุญาตให้นำไปอ้างอิงเป็นทางการ", "ex1_en": "Strictly <span class=\"hl-teal\">off the record</span>, I think Dave is planning to propose to his girlfriend this weekend.", "ex1_hl": "off the record", "ex1_th": "คุยกันแบบไม่เปิดเผยนะ ฉันคิดว่าเดฟกำลังวางแผนจะขอแฟนแต่งงานสุดสัปดาห์นี้แหละ", "ex2_en": "During an informal press briefing, the spokesperson shared details of the merger strictly <span class=\"hl-teal\">off the record</span> with accredited journalists.", "ex2_hl": "off the record", "ex2_th": "ในระหว่างการสรุปข้อมูลกับสื่ออย่างไม่เป็นทางการ โฆษกได้เปิดเผยรายละเอียดเรื่องการควบรวมกิจการโดยระบุชัดเจนว่าเป็นการให้ข้อมูลแบบไม่เปิดเผยเป็นทางการแก่นักข่าวที่ได้รับรอง", "slot_num": 174, "sheet_no": 2, "first_letter": "O"}, {"id": 164, "orig_slot": "#175", "idiom": "On the right track", "meaning": "Doing the right things.", "thai_idiom": "มาถูกทางแล้ว / ดำเนินไปอย่างถูกต้อง", "thai_meaning": "คิดหรือทำในแนวทางที่ถูกต้อง มุ่งหน้าไปสู่เป้าหมายหรือความสำเร็จตามที่ต้องการ", "ex1_en": "Your pronunciation has noticeably improved over the past month, so you're definitely <span class=\"hl-teal\">on the right track</span>.", "ex1_hl": "on the right track", "ex1_th": "การออกเสียงของเธอพัฒนาขึ้นอย่างเห็นได้ชัดในเดือนที่ผ่านมา แสดงว่าเธอมาถูกทางแล้วล่ะ", "ex2_en": "Preliminary clinical trial indicators suggest that our biomedical engineering team is <span class=\"hl-teal\">on the right track</span> toward developing an effective targeted therapy.", "ex2_hl": "on the right track", "ex2_th": "ตัวชี้วัดเบื้องต้นจากการทดลองทางคลินิกชี้ให้เห็นว่าทีมวิศวกรรมชีวการแพทย์ของเรากำลังดำเนินงานมาถูกทางในการพัฒนายารักษาแบบมุ่งเป้าที่มีประสิทธิภาพ", "slot_num": 175, "sheet_no": 2, "first_letter": "O"}, {"id": 165, "orig_slot": "#177", "idiom": "Rise to the occasion", "meaning": "Do well when needed.", "thai_idiom": "รับมือสถานการณ์ได้ยอดเยี่ยม / สู้ไม่ถอยในยามคับขัน", "thai_meaning": "แสดงความสามารถ ความกล้าหาญ หรือทำหน้าที่ได้ดีเยี่ยมเมื่อเผชิญกับสถานการณ์ยากลำบากหรือท้าทาย", "ex1_en": "When the lead actor fell ill right before curtain call, the understudy <span class=\"hl-teal\">rose to the occasion</span> and delivered a flawless performance.", "ex1_hl": "rose to the occasion", "ex1_th": "เมื่อนักแสดงนำล้มป่วยกะทันหันก่อนการแสดงเริ่ม นักแสดงสำรองก็รับมือกับสถานการณ์คับขันได้อย่างยอดเยี่ยมและแสดงได้อย่างไร้ที่ติ", "ex2_en": "Facing unprecedented market turbulence during the supply chain breakdown, the operations director <span class=\"hl-teal\">rose to the occasion</span> by securing alternate domestic suppliers within forty-eight hours.", "ex2_hl": "rose to the occasion", "ex2_th": "เมื่อต้องเผชิญกับภาวะผันผวนของตลาดอย่างไม่เคยมีมาก่อนจากวิกฤตห่วงโซ่อุปทาน ผู้อำนวยการฝ่ายปฏิบัติการได้แสดงศักยภาพรับมือได้อย่างยอดเยี่ยมด้วยการจัดหาผู้ผลิตภายในประเทศรายใหม่ได้ภายในเวลา 48 ชั่วโมง", "slot_num": 177, "sheet_no": 2, "first_letter": "R"}, {"id": 166, "orig_slot": "#179", "idiom": "Tomorrow is another day", "meaning": "There is hope for the future.", "thai_idiom": "พรุ่งนี้ยังมีหวัง / พรุ่งนี้ค่อยว่ากันใหม่", "thai_meaning": "ยังมีโอกาสและความหวังใหม่ๆ รออยู่ในวันพรุ่งนี้ อย่าเพิ่งหมดหวังกับความผิดพลาดในวันนี้", "ex1_en": "Don't dwell on failing your driver's permit test today; get some sleep because <span class=\"hl-teal\">tomorrow is another day</span>.", "ex1_hl": "tomorrow is another day", "ex1_th": "อย่าไปจมปลักกับเรื่องที่สอบใบขับขี่ไม่ผ่านวันนี้เลย ไปนอนพักผ่อนเถอะ เพราะพรุ่งนี้ก็เริ่มใหม่ได้เสมอ", "ex2_en": "Despite falling short of the quarterly sales quota, the branch manager reassured her discouraged team that <span class=\"hl-teal\">tomorrow is another day</span> and renewed their strategic targets.", "ex2_hl": "tomorrow is another day", "ex2_th": "แม้จะทำยอดขายไม่ถึงเป้าประจำไตรมาส ผู้จัดการสาขาก็ยังคงให้กำลังใจทีมงานที่หมดไฟว่าพรุ่งนี้ยังมีโอกาสให้ลุยใหม่ พร้อมทั้งกำหนดเป้าหมายเชิงกลยุทธ์ใหม่อีกครั้ง", "slot_num": 179, "sheet_no": 2, "first_letter": "T"}, {"id": 167, "orig_slot": "#181", "idiom": "What goes around comes around", "meaning": "Actions have consequences.", "thai_idiom": "กงเกวียนกำเกวียน / ทำดีได้ดี ทำชั่วได้ชั่ว", "thai_meaning": "สิ่งใดที่ทำลงไปย่อมส่งผลลัพธ์ย้อนกลับมาหาผู้กระทำเสมอ การกระทำย่อมมีผลตามมา", "ex1_en": "He spent years treating his neighbors disrespectfully, and now nobody will help shovel his driveway; <span class=\"hl-teal\">what goes around comes around</span>.", "ex1_hl": "what goes around comes around", "ex1_th": "เขาทำตัวแล้งน้ำใจกับเพื่อนบ้านมาตั้งหลายปี ตอนนี้เลยไม่มีใครยอมช่วยเขาตักหิมะออกจากทางรถเข้าบ้านเลย กงเกวียนกำเกวียนจริงๆ", "ex2_en": "The competitor that habitually poached rival employees with deceitful contract terms eventually suffered mass resignations, proving that <span class=\"hl-teal\">what goes around comes around</span> in the corporate world.", "ex2_hl": "what goes around comes around", "ex2_th": "บริษัทคู่แข่งที่ชอบแย่งชิงพนักงานของคนอื่นด้วยข้อสัญญาหลอกลวง สุดท้ายก็ต้องเผชิญกับคลื่นการลาออกของพนักงานครั้งใหญ่ เป็นเครื่องพิสูจน์ว่าทำอะไรไว้ย่อมได้รับผลกรรมตอบสนองในโลกธุรกิจ", "slot_num": 181, "sheet_no": 2, "first_letter": "W"}, {"id": 168, "orig_slot": "#182", "idiom": "A drop in the ocean", "meaning": "A very small part.", "thai_idiom": "น้ำหยดเดียวในมหาสมุทร / เศษเสี้ยวเล็กน้อย", "thai_meaning": "ปริมาณหรือสัดส่วนที่น้อยมากจนแทบไม่มีผลเมื่อเทียบกับความต้องการหรือจำนวนทั้งหมด", "ex1_en": "Donating five dollars toward a ten-thousand-dollar medical bill felt like <span class=\"hl-teal\">a drop in the ocean</span>, but every bit helps.", "ex1_hl": "a drop in the ocean", "ex1_th": "การบริจาคเงินห้าดอลลาร์เพื่อช่วยค่ารักษาพยาบาลหนึ่งหมื่นดอลลาร์อาจดูเหมือนน้ำหยดเดียวในมหาสมุทร แต่น้อยนิดก็ยังดีกว่าไม่ช่วยเลย", "ex2_en": "Economists cautioned that allocating ten million dollars to municipal housing is merely <span class=\"hl-teal\">a drop in the ocean</span> given the metropolitan region's staggering deficit.", "ex2_hl": "a drop in the ocean", "ex2_th": "นักเศรษฐศาสตร์เตือนว่างบประมาณสิบล้านดอลลาร์ที่จัดสรรให้กับโครงการเคหะชุมชนเป็นเพียงเศษเสี้ยวเล็กน้อย เมื่อเทียบกับการขาดดุลมหาศาลของพื้นที่เขตมหานคร", "slot_num": 182, "sheet_no": 2, "first_letter": "A"}, {"id": 169, "orig_slot": "#183", "idiom": "Beating around the bush", "meaning": "Avoiding the main topic.", "thai_idiom": "พูดอ้อมค้อม / ชักแม่น้ำทั้งห้า / ไม่ยอมเข้าเรื่อง", "thai_meaning": "พูดจาเฉไฉหลีกเลี่ยงประเด็นสำคัญ ไม่ยอมพูดเข้าเรื่องหรือจุดสำคัญตรงๆ", "ex1_en": "Stop <span class=\"hl-teal\">beating around the bush</span> and tell me straight out if you broke my favorite coffee mug.", "ex1_hl": "beating around the bush", "ex1_th": "หยุดพูดอ้อมค้อมได้แล้ว บอกฉันมาตรงๆ เถอะว่าเธอทำแก้วกาแฟใบโปรดของฉันแตกใช่ไหม", "ex2_en": "The board of directors grew impatient with the legal counsel for <span class=\"hl-teal\">beating around the bush</span> instead of detailing potential compliance liabilities.", "ex2_hl": "beating around the bush", "ex2_th": "คณะกรรมการบริหารเริ่มหมดความอดทนกับที่ปรึกษากฎหมายที่มัวแต่พูดจาเฉไฉอ้อมค้อม แทนที่จะระบุความเสี่ยงและภาระผูกพันด้านกฎหมายให้ชัดเจน", "slot_num": 183, "sheet_no": 2, "first_letter": "B"}, {"id": 170, "orig_slot": "#186", "idiom": "Get the picture", "meaning": "Understand.", "thai_idiom": "เข้าใจภาพรวม / เห็นภาพ / เก็ตแล้ว", "thai_meaning": "เข้าใจสถานการณ์หรือสิ่งที่เกิดขึ้นอย่างแจ่มแจ้ง ชัดเจน", "ex1_en": "She didn't return my phone calls or answer any of my texts, so I quickly <span class=\"hl-teal\">got the picture</span>.", "ex1_hl": "got the picture", "ex1_th": "เธอไม่โทรกลับและไม่ยอมตอบข้อความฉันสักข้อความ ฉันเลยเข้าใจแจ่มแจ้งทันทีว่าเธอไม่อยากคุยด้วย", "ex2_en": "After reviewing the projected financial losses across all international divisions, stakeholders finally <span class=\"hl-teal\">got the picture</span> regarding the necessity of severe cost reductions.", "ex2_hl": "got the picture", "ex2_th": "หลังจากได้ทบทวนตัวเลขผลขาดทุนที่คาดการณ์ไว้ของทุกแผนกในต่างประเทศ ในที่สุดผู้มีส่วนได้ส่วนเสียก็เห็นภาพชัดเจนถึงความจำเป็นเร่งด่วนในการปรับลดต้นทุนอย่างจริงจัง", "slot_num": 186, "sheet_no": 2, "first_letter": "G"}, {"id": 171, "orig_slot": "#187", "idiom": "Make someone's day", "meaning": "Do something that makes someone happy.", "thai_idiom": "ทำให้มีความสุขไปทั้งวัน / เติมเต็มวันดีๆ", "thai_meaning": "ทำบางสิ่งบางอย่างที่สร้างความสุข ชื่นใจ หรือทำให้วันนั้นของใครบางคนกลายเป็นวันที่แสนวิเศษ", "ex1_en": "Hearing my grandmother laugh heartily at my childhood stories really <span class=\"hl-teal\">made my day</span>.", "ex1_hl": "made my day", "ex1_th": "การได้ยินคุณยายหัวเราะร่วนอย่างมีความสุขกับเรื่องเล่าวัยเด็กของฉัน ทำให้ฉันพลอยมีความสุขไปทั้งวันจริงๆ", "ex2_en": "Receiving a personalized commendation letter from the chief executive <span class=\"hl-teal\">made the junior developer's day</span> following the successful software deployment.", "ex2_hl": "made the junior developer's day", "ex2_th": "การได้รับจดหมายชมเชยโดยตรงจากประธานเจ้าหน้าที่บริหารทำให้โปรแกรมเมอร์ระดับจูเนียร์ยิ้มแก้มปริแ
