kes for different folks</span>.", "ex2_hl": "different strokes for different folks", "ex2_th": "ผู้บริหารบางคนชอบการทำงานแบบแอไจล์ที่รวดเร็วฉับไว ในขณะที่บางคนยึดมั่นกับการทบทวนงานตามเป้าหมายอย่างเป็นระบบ มันขึ้นอยู่กับแนวทางและความถนัดของแต่ละคนจริงๆ", "slot_num": 632, "sheet_no": 7, "first_letter": "D"}, {"id": 468, "orig_slot": "#633", "idiom": "Don't beat around the bush", "meaning": "Speak directly; get to the point.", "thai_idiom": "อย่าพูดจาอ้อมค้อม / พูดเข้าเรื่องมาตรงๆ", "thai_meaning": "อย่ามัวพูดชักแม่น้ำทั้งห้า, จงพูดเข้าประเด็นสำคัญอย่างตรงไปตรงมาโดยไม่อ้อมค้อม", "ex1_en": "Please <span class=\"hl-teal\">don't beat around the bush</span>; just tell me how much the car repair is going to cost me.", "ex1_hl": "don't beat around the bush", "ex1_th": "ได้โปรดอย่ามัวพูดจาอ้อมค้อมเลย บอกฉันมาตรงๆ เถอะว่าค่าซ่อมรถรอบนี้ฉันต้องจ่ายเท่าไหร่", "ex2_en": "The board chairman urged the chief risk officer, '<span class=\"hl-teal\">Don't beat around the bush</span>—give us an unvarnished assessment of our cyber exposure.'", "ex2_hl": "Don't beat around the bush", "ex2_th": "ประธานคณะกรรมการบริหารได้กล่าวกำชับประธานเจ้าหน้าที่ฝ่ายบริหารความเสี่ยงว่า 'อย่าพูดจาอ้อมค้อม ขอให้รายงานประเมินความเสี่ยงทางไซเบอร์ตามความจริงโดยไม่ต้องตกแต่งใดๆ'", "slot_num": 633, "sheet_no": 7, "first_letter": "D"}, {"id": 469, "orig_slot": "#636", "idiom": "Double down", "meaning": "Become more determined.", "thai_idiom": "ยืนกรานไม่ถอย / เดินหน้าชน / ทุ่มสุดตัว", "thai_meaning": "ยืนกรานทำต่ออย่างหนักแน่น, เพิ่มความมุ่งมั่นทุ่มเทเป็นเท่าตัว (แม้จะมีอุปสรรคหรือเสียงคัดค้าน)", "ex1_en": "Instead of admitting he was wrong about the directions, Liam <span class=\"hl-teal\">doubled down</span> and kept driving thirty miles further north.", "ex1_hl": "doubled down", "ex1_th": "แทนที่จะยอมรับว่าดูเส้นทางผิด เลียมกลับยืนกรานหัวชนฝาขับรถขึ้นเหนือต่อไปอีกถึงสามสิบไมล์", "ex2_en": "Despite slumping quarterly sales, the software company chose to <span class=\"hl-teal\">double down on</span> its investment in generative AI infrastructure.", "ex2_hl": "double down on", "ex2_th": "แม้ว่ายอดขายประจำไตรมาสจะชะลอตัวลง แต่บริษัทซอฟต์แวร์ก็ตัดสินใจทุ่มงบลงทุนเป็นสองเท่าในโครงสร้างพื้นฐานด้านปัญญาประดิษฐ์สร้างสรรค์", "slot_num": 636, "sheet_no": 7, "first_letter": "D"}, {"id": 470, "orig_slot": "#637", "idiom": "Easy does it", "meaning": "Do it calmly; don't hurry.", "thai_idiom": "ช้าๆ ได้พร้าเล่มงาม / ค่อยๆ ทำ อย่ารีบร้อน", "thai_meaning": "ค่อยๆ ทำอย่างระมัดระวัง, ใจเย็นๆ ไม่ต้องเร่งรีบ", "ex1_en": "“<span class=\"hl-teal\">Easy does it</span>,” Mark whispered as he gently maneuvered the antique glass chandelier through the narrow doorway.", "ex1_hl": "Easy does it", "ex1_th": "“ค่อยๆ นะ ระวังหน่อย” มาร์กกระซิบขณะค่อยๆ ประคองโคมไฟระย้าโบราณผ่านประตูแคบๆ เข้ามา", "ex2_en": "The physical therapist reminded the recovering athlete, “<span class=\"hl-teal\">Easy does it</span> during these first few weeks; pushing too hard will only re-injure your hamstring.”", "ex2_hl": "Easy does it", "ex2_th": "นักกายภาพบำบัดเตือนนักกีฬาที่กำลังพักฟื้นว่า “ค่อยเป็นค่อยไปนะครับในช่วงสองสามสัปดาห์แรก การหักโหมมากเกินไปจะทำให้กล้ามเนื้อต้นขาด้านหลังบาดเจ็บซ้ำได้”", "slot_num": 637, "sheet_no": 7, "first_letter": "E"}, {"id": 471, "orig_slot": "#639", "idiom": "Eye for an eye", "meaning": "Revenge in equal measure.", "thai_idiom": "ตาต่อตา ฟันต่อฟัน", "thai_meaning": "การแก้แค้นหรือลงโทษอย่างสาสมเท่าเทียมกับความผิดที่ได้รับ", "ex1_en": "After his roommate ate his leftover pizza, Kevin hid all the coffee pods, believing in an <span class=\"hl-teal\">eye for an eye</span>.", "ex1_hl": "eye for an eye", "ex1_th": "หลังจากที่เพื่อนร่วมห้องแอบกินพิซซ่าที่เหลือของเขา เควินก็เอาแคปซูลกาแฟทั้งหมดไปซ่อนเพราะยึดคติว่าต้องแก้แค้นให้ตาต่อตาฟันต่อฟัน", "ex2_en": "The defense attorney argued that modern jurisprudence rejects the primitive principle of an <span class=\"hl-teal\">eye for an eye</span> in favor of rehabilitative justice.", "ex2_hl": "eye for an eye", "ex2_th": "ทนายฝ่ายจำเลยโต้แย้งว่าหลักนิติศาสตร์สมัยใหม่ปฏิเสธหลักการโบราณแบบตาต่อตาฟันต่อฟัน และหันมาสนับสนุนกระบวนการยุติธรรมเชิงฟื้นฟูแทน", "slot_num": 639, "sheet_no": 7, "first_letter": "E"}, {"id": 472, "orig_slot": "#641", "idiom": "Fall into place", "meaning": "Happen naturally; work out.", "thai_idiom": "ลงล็อก / เข้าที่เข้าทาง / คลี่คลายไปด้วยดี", "thai_meaning": "ลงตัวอย่างราบรื่น, เข้าที่เข้าทางอย่างเป็นธรรมชาติ", "ex1_en": "Once we booked the wedding venue, all the other details like flowers and photography just <span class=\"hl-teal\">fell into place</span>.", "ex1_hl": "fell into place", "ex1_th": "พอเราจองสถานที่จัดงานแต่งงานได้ รายละเอียดอื่นๆ อย่างเรื่องดอกไม้และช่างภาพก็ลงล็อกเข้าที่เข้าทางไปหมด", "ex2_en": "After months of regulatory delays, the cross-border merger logistics finally <span class=\"hl-teal\">fell into place</span> ahead of the fiscal year-end.", "ex2_hl": "fell into place", "ex2_th": "หลังจากเผชิญความล่าช้าด้านกฎระเบียบมาหลายเดือน ขั้นตอนการควบรวมกิจการข้ามชาติก็ลงตัวเข้าที่เข้าทางได้ทันก่อนสิ้นสุดปีงบประมาณ", "slot_num": 641, "sheet_no": 7, "first_letter": "F"}, {"id": 473, "orig_slot": "#643", "idiom": "Feather your nest", "meaning": "Save money for yourself.", "thai_idiom": "ตักตวงผลประโยชน์เข้าตัวเอง / กอบโกยใส่ตัว", "thai_meaning": "หาผลประโยชน์หรือสะสมเงินทองเข้ากระเป๋าตัวเอง (มักใช้อำนาจหน้าที่โดยมิชอบ)", "ex1_en": "Everyone suspected that Uncle Frank volunteered to manage grandma's estate purely to <span class=\"hl-teal\">feather his own nest</span>.", "ex1_hl": "feather his own nest", "ex1_th": "ทุกคนสงสัยว่าลุงแฟรงก์อาสาเข้ามาจัดการมรดกของคุณยายเพียงเพื่อตักตวงผลประโยชน์เข้ากระเป๋าตัวเอง", "ex2_en": "The investigative audit revealed that senior executives used municipal grants to <span class=\"hl-teal\">feather their nests</span> with lavish bonuses.", "ex2_hl": "feather their nests", "ex2_th": "การตรวจสอบเชิงลึกเผยให้เห็นว่าคณะผู้บริหารระดับสูงแอบนำเงินอุดหนุนของเทศบาลมาหาผลประโยชน์เข้าตัวเองด้วยการจ่ายเงินโบนัสก้อนโตอย่างฟุ่มเฟือย", "slot_num": 643, "sheet_no": 7, "first_letter": "F"}, {"id": 474, "orig_slot": "#644", "idiom": "Forty winks", "meaning": "A short nap.", "thai_idiom": "งีบหลับ / นอนพักเอาแรงสักครู่", "thai_meaning": "การงีบหลับสั้นๆ ช่วงกลางวันเพื่อคลายความเหนื่อยล้า", "ex1_en": "I was feeling sluggish after Sunday lunch, so I sat on the porch recliner to catch <span class=\"hl-teal\">forty winks</span>.", "ex1_hl": "forty winks", "ex1_th": "ฉันรู้สึกเฉื่อยชาหลังจากมื้อเที่ยงวันอาทิตย์ เลยนั่งบนเก้าอี้ปรับเอนตรงเฉลียงเพื่อของีบหลับสักตื่น", "ex2_en": "Several innovative software firms have installed soundproof pods where on-call engineers can grab <span class=\"hl-teal\">forty winks</span> during lengthy night shifts.", "ex2_hl": "forty winks", "ex2_th": "บริษัทซอฟต์แวร์นวัตกรรมหลายแห่งได้ติดตั้งแคปซูลนอนเก็บเสียง เพื่อให้วิศวกรที่ต้องเข้าเวรสามารถงีบหลับเอาแรงในช่วงเข้ากะดึกอันยาวนาน", "slot_num": 644, "sheet_no": 7, "first_letter": "F"}, {"id": 475, "orig_slot": "#645", "idiom": "From the get-go", "meaning": "From the very beginning.", "thai_idiom": "ตั้งแต่แรกเริ่ม / ตั้งแต่หัววัน", "thai_meaning": "ตั้งแต่เริ่มต้น, ตั้งแต่วินาทีแรกที่ลงมือ", "ex1_en": "We knew <span class=\"hl-teal\">from the get-go</span> that renovating a century-old cottage would require replacing all the plumbing.", "ex1_hl": "from the get-go", "ex1_th": "พวกเรารู้อยู่แต่แรกเริ่มแล้วว่าการรีโนเวทกระท่อมอายุร่วมศตวรรษจะต้องรื้อเปลี่ยนระบบประปาใหม่ทั้งหมด", "ex2_en": "The project director emphasized clear stakeholder communication <span class=\"hl-teal\">from the get-go</span> to prevent costly scope drift.", "ex2_hl": "from the get-go", "ex2_th": "ผู้อำนวยการโครงการเน้นย้ำเรื่องการสื่อสารที่ชัดเจนกับผู้มีส่วนได้ส่วนเสียตั้งแต่เริ่มต้น เพื่อป้องกันไม่ให้ขอบเขตงานบานปลายจนสิ้นเปลืองงบประมาณ", "slot_num": 645, "sheet_no": 7, "first_letter": "F"}, {"id": 476, "orig_slot": "#646", "idiom": "Get a grip", "meaning": "Calm down; control yourself.", "thai_idiom": "ดึงสติ / ตั้งสติ / ระงับอารมณ์หน่อย", "thai_meaning": "ควบคุมสติอารมณ์, สงบจิตสงบใจ, ตั้งสติให้มั่น", "ex1_en": "When Chloe started panicking over a misplaced passport, her brother told her to <span class=\"hl-teal\">get a grip</span> and check her backpack again.", "ex1_hl": "get a grip", "ex1_th": "ตอนที่โคลอี้เริ่มตื่นตระหนกเพราะหาหนังสือเดินทางไม่เจอ พี่ชายก็บอกให้เธอตั้งสติแล้วลองตรวจดูในกระเป๋าเป้อีกครั้ง", "ex2_en": "The seasoned fund manager urged his trading desk to <span class=\"hl-teal\">get a grip</span> rather than dumping volatile stocks during the flash crash.", "ex2_hl": "get a grip", "ex2_th": "ผู้จัดการกองทุนผู้มีประสบการณ์กระตุ้นเตือนให้ทีมเทรดเดอร์ตั้งสติและควบคุมสถานการณ์ให้อยู่ แทนที่จะแห่เทขายหุ้นที่มีความผันผวนในช่วงที่ตลาดทรุดตัวฉับพลัน", "slot_num": 646, "sheet_no": 7, "first_letter": "G"}, {"id": 477, "orig_slot": "#649", "idiom": "Give and take", "meaning": "Mutual compromise.", "thai_idiom": "ถ้อยทีถ้อยอาศัย / การประนีประนอมผ่อนปรน", "thai_meaning": "การยอมความกันคนละครึ่งทาง, การรอมชอมและประนีประนอมซึ่งกันและกัน", "ex1_en": "Sharing an apartment peacefully with two roommates requires constant <span class=\"hl-teal\">give and take</span> over cleaning duties.", "ex1_hl": "give and take", "ex1_th": "การจะอยู่ร่วมห้องพักกับรูมเมตสองคนอย่างสงบสุขจำเป็นต้องมีการถ้อยทีถ้อยอาศัยและประนีประนอมกันเรื่องเวรทำความสะอาดอยู่เสมอ", "ex2_en": "Bilateral trade negotiations can only succeed when both delegations demonstrate genuine willingness for <span class=\"hl-teal\">give and take</span> regarding import tariffs.", "ex2_hl": "give and take", "ex2_th": "การเจรจาการค้าทวิภาคีจะประสบผลสำเร็จได้ก็ต่อเมื่อคณะตัวแทนทั้งสองฝ่ายแสดงความเต็มใจอย่างแท้จริงที่จะประนีประนอมผ่อนปรนซึ่งกันและกันในเรื่องภาษีนำเข้า", "slot_num": 649, "sheet_no": 7, "first_letter": "G"}, {"id": 478, "orig_slot": "#650", "idiom": "Go back to square one", "meaning": "Start over.", "thai_idiom": "กลับไปนับหนึ่งใหม่ / เริ่มต้นใหม่แต่แรก", "thai_meaning": "กลับไปเริ่มต้นกระบวนการใหม่ทั้งหมดหลังจากประสบความล้มเหลวหรือไม่คืบหน้า", "ex1_en": "Our soufflé completely deflated in the oven, so we had to <span class=\"hl-teal\">go back to square one</span> and whip up a fresh batch of batter.", "ex1_hl": "go back to square one", "ex1_th": "ขนมซูเฟล่ของเรายุบตัวแฟบลงในเตาอบ พวกเราจึงต้องกลับไปเริ่มนับหนึ่งใหม่ด้วยการตีแป้งชุดใหม่ขึ้นมา", "ex2_en": "When Phase II clinical trials failed to demonstrate efficacy, the biotech research consortium had to <span class=\"hl-teal\">go back to square one</span>.", "ex2_hl": "go back to square one", "ex2_th": "เมื่อการทดลองทางคลินิกระยะที่ 2 ไม่สามารถพิสูจน์ประสิทธิผลในการรักษาได้ กลุ่มพันธมิตรวิจัยด้านเทคโนโลยีชีวภาพจึงต้องกลับไปเริ่มกระบวนการพัฒนาใหม่ตั้งแต่ต้น", "slot_num": 650, "sheet_no": 7, "first_letter": "G"}, {"id": 479, "orig_slot": "#651", "idiom": "Go down in history", "meaning": "Be remembered forever.", "thai_idiom": "จารึกไว้ในประวัติศาสตร์ / เป็นที่จดจำตลอดกาล", "thai_meaning": "ได้รับการจารึกหรือจดจำไปตลอดกาลว่าเป็นเหตุการณ์หรือความสำเร็จครั้งสำคัญ", "ex1_en": "His breathtaking buzzer-beater shot from half-court will definitely <span class=\"hl-teal\">go down in history</span> at our high school.", "ex1_hl": "go down in history", "ex1_th": "ลูกยิงไกลจากครึ่งสนามที่ส่งเสียงสัญญาณหมดเวลาของเขาจะถูกจารึกไว้ในประวัติศาสตร์ของโรงเรียนเราอย่างแน่นอน", "ex2_en": "The peaceful resolution of the maritime border dispute will <span class=\"hl-teal\">go down in history</span> as a masterclass in international diplomacy.", "ex2_hl": "go down in history", "ex2_th": "การแก้ไขข้อพิพาททางทะเลอย่างสันติจะได้รับการจารึกไว้ในประวัติศาสตร์ว่าเป็นบทเรียนชั้นครูของการทูตระหว่างประเทศ", "slot_num": 651, "sheet_no": 7, "first_letter": "G"}, {"id": 480, "orig_slot": "#652", "idiom": "Go for broke", "meaning": "Risk everything.", "thai_idiom": "เทหมดหน้าตัก / ทุ่มสุดตัว / สู้ยิบตา", "thai_meaning": "ทุ่มเทหรือเสี่ยงทุกสิ่งทุกอย่างที่มีเพื่อหวังผลสำเร็จสูงสุด", "ex1_en": "Trailing by four runs in the final inning, the coach signaled the batter to swing aggressively and <span class=\"hl-teal\">go for broke</span>.", "ex1_hl": "go for broke", "ex1_th": "เมื่อตามหลังอยู่สี่แต้มในอินนิ่งสุดท้าย โค้ชก็ส่งสัญญาณให้คนตีหวดเต็มเหนี่ยวและทุ่มสุดตัวเพื่อพลิกเกม", "ex2_en": "Facing imminent insolvency, the renewable energy startup decided to <span class=\"hl-teal\">go for broke</span> by pouring remaining funds into patenting their solid-state battery.", "ex2_hl": "go for broke", "ex2_th": "เมื่อต้องเผชิญกับภาวะล้มละลายที่ใกล้เข้ามา สตาร์ทอัพพลังงานหมุนเวียนจึงตัดสินใจเทหมดหน้าตักด้วยการทุ่มเงินทุนที่เหลือไปกับการจดสิทธิบัตรแบตเตอรี่แบบโซลิดสเตต", "slot_num": 652, "sheet_no": 7, "first_letter": "G"}, {"id": 481, "orig_slot": "#653", "idiom": "Go in circles", "meaning": "Repeat without progress.", "thai_idiom": "พายเรือในอ่าง / วนไปวนมาอยู่ที่เดิม", "thai_meaning": "วนเวียนทำหรือพูดซ้ำๆ โดยไม่เกิดความคืบหน้าใดๆ", "ex1_en": "We spent an hour debating where to eat dinner and just kept <span class=\"hl-teal\">going in circles</span> until all the restaurants closed.", "ex1_hl": "going in circles", "ex1_th": "พวกเรามัวแต่เถียงกันว่าจะไปกินข้าวเย็นที่ไหนอยู่นานนับชั่วโมง วนไปวนมาอยู่ที่เดิมจนกระทั่งร้านอาหารปิดหมดทุกร้าน", "ex2_en": "Without a designated mediator, contract discussions between the hospital administration and union representatives continued to <span class=\"hl-teal\">go in circles</span>.", "ex2_hl": "go in circles", "ex2_th": "เนื่องจากไม่มีคนกลางที่ได้รับการแต่งตั้ง การเจรจาสัญญาจ้างระหว่างฝ่ายบริหารโรงพยาบาลและตัวแทนสหภาพแรงงานจึงยังคงวนไปวนมาเหมือนพายเรือในอ่างโดยไม่ได้ข้อยุติ", "slot_num": 653, "sheet_no": 7, "first_letter": "G"}, {"id": 482, "orig_slot": "#654", "idiom": "Go off the rails", "meaning": "Lose control; behave badly.", "thai_idiom": "เตลิดเปิดเปิง / เสียคน / ออกนอกลู่นอกทาง", "thai_meaning": "เสียการควบคุม, ประพฤติตัวออกนอกลู่นอกทางหรือผิดเพี้ยนไปจากเดิมอย่างสิ้นเชิง", "ex1_en": "After falling in with a reckless crowd, Julian completely <span class=\"hl-teal\">went off the rails</span> and skipped school for weeks.", "ex1_hl": "went off the rails", "ex1_th": "หลังจากไปคบค้าสมาคมกับเพื่อนกลุ่มที่รักความเสี่ยง จูเลียนก็เตลิดเปิดเปิงจนโดดเรียนติดต่อกันหลายสัปดาห์", "ex2_en": "The corporate turnaround plan <span class=\"hl-teal\">went off the rails</span> when unexpected supply chain bottlenecks stalled manufacturing lines.", "ex2_hl": "went off the rails", "ex2_th": "แผนการฟื้นฟูกิจการของบริษัทต้องระส่ำระสายจนหลุดการควบคุม เมื่อปัญหาคอขวดในห่วงโซ่อุปทานที่ไม่คาดคิดทำให้สายการผลิตต้องหยุดชะงักลง", "slot_num": 654, "sheet_no": 7, "first_letter": "G"}, {"id": 483, "orig_slot": "#655", "idiom": "Go overboard", "meaning": "Exaggerate.", "thai_idiom": "ทำเกินพอดี / เวอร์เกินไป / เล่นใหญ่เกินเหตุ", "thai_meaning": "ทำหรือพูดเกินเลยไปมาก, ทำมากเกินความจำเป็นจนเกินพอดี", "ex1_en": "Aunt Clara always <span class=\"hl-teal\">goes overboard</span> at Christmas, buying dozens of lavish presents that barely fit beneath the tree.", "ex1_hl": "goes overboard", "ex1_th": "ป้าคลาร่ามักจะเล่นใหญ่เกินเบอร์เสมอช่วงคริสต์มาส โดยซื้อของขวัญหรูหราหลายสิบชิ้นจนแทบจะวางใต้ต้นคริสต์มาสไม่พอ", "ex2_en": "While corporate rebranding requires thorough collateral updates, marketing leaders warned designers not to <span class=\"hl-teal\">go overboard</span> and discard recognizable brand equity.", "ex2_hl": "go overboard", "ex2_th": "แม้ว่าการรีแบรนด์องค์กรจะต้องปรับปรุงสื่อประชาสัมพันธ์ทั้งหมด แต่ผู้นำฝ่ายการตลาดก็เตือนทีมนักออกแบบว่าอย่าทำเกินพอดีจนทิ้งเอกลักษณ์เดิมของแบรนด์ที่เป็นที่จดจำ", "slot_num": 655, "sheet_no": 7, "first_letter": "G"}, {"id": 484, "orig_slot": "#657", "idiom": "Good on you", "meaning": "Well done!", "thai_idiom": "ยอดเยี่ยมมาก / ทำได้ดีมาก / ยินดีด้วยนะ", "thai_meaning": "ทำได้ดีมาก, ขอชื่นชม, ยินดีด้วย (ใช้กล่าวแสดงความยินดีหรือชื่นชมการกระทำที่ดี)", "ex1_en": "“I heard you adopted a senior rescue dog from the shelter—<span class=\"hl-teal\">good on you</span>, mate!”", "ex1_hl": "good on you", "ex1_th": "“ฉันได้ยินว่านายรับเลี้ยงสุนัขแก่ที่ศูนย์ช่วยเหลือมา ยอดเยี่ยมมากเลยเพื่อน!”", "ex2_en": "“<span class=\"hl-teal\">Good on you</span> for disclosing that accounting discrepancy before the external audit began,” the compliance officer remarked.", "ex2_hl": "Good on you", "ex2_th": "“ทำได้ดีมากที่คุณเปิดเผยข้อมูลความคลาดเคลื่อนทางบัญชีนั้นก่อนที่การตรวจสอบภายนอกจะเริ่มขึ้น” เจ้าหน้าที่ฝ่ายกำกับดูแลกล่าวชื่นชม", "slot_num": 657, "sheet_no": 7, "first_letter": "G"}, {"id": 485, "orig_slot": "#658", "idiom": "Good things come in small packages", "meaning": "Small but valuable.", "thai_idiom": "เล็กพริกขี้หนู / จิ๋วแต่แจ๋ว", "thai_meaning": "ของชิ้นเล็กแต่มีคุณค่าหรืออานุภาพมหาศาล, สิ่งดีๆ ไม่จำเป็นต้องมีขนาดใหญ่", "ex1_en": "Don't judge the tiny gift box by its size; remember that <span class=\"hl-teal\">good things come in small packages</span>.", "ex1_hl": "good things come in small packages", "ex1_th": "อย่าเพิ่งตัดสินกล่องของขวัญใบเล็กๆ นั้นแค่จากขนาดนะ จำไว้ว่าสิ่งล้ำค่ามักจิ๋วแต่แจ๋วเสมอ", "ex2_en": "With an ultra-efficient battery footprint, the compact medical sensor demonstrated that <span class=\"hl-teal\">good things come in small packages</span> in biomedical engineering.", "ex2_hl": "good things come in small packages", "ex2_th": "ด้วยการใช้พลังงานแบตเตอรี่ที่ประหยัดเป็นเลิศ เซนเซอร์ทางการแพทย์ขนาดกะทัดรัดนี้ได้พิสูจน์ให้เห็นว่าในวงการวิศวกรรมชีวการแพทย์ ของล้ำค่ามักจิ๋วแต่แจ๋วเสมอ", "slot_num": 658, "sheet_no": 7, "first_letter": "G"}, {"id": 486, "orig_slot": "#659", "idiom": "Great minds think alike", "meaning": "Smart people have similar ideas.", "thai_idiom": "ใจตรงกัน / คนฉลาดมักคิดเหมือนกัน", "thai_meaning": "คนเก่งหรือคนฉลาดมักมีความคิดเห็นหรือไอเดียตรงกัน (มักใช้พูดเล่นเมื่อคิดตรงกัน)", "ex1_en": "“You brought iced chai tea for both of us too? <span class=\"hl-teal\">Great minds think alike</span>!” Lucas laughed.", "ex1_hl": "Great minds think alike", "ex1_th": "“เธอซื้อชาไทยเย็นมาเผื่อเราสองคนเหมือนกันเหรอเนี่ย? คนฉลาดมักใจตรงกันจริงๆ!” ลูคัสหัวเราะ", "ex2_en": "When both lead architects submitted blueprints featuring identical passive solar ventilation systems, the board quipped that <span class=\"hl-teal\">great minds think alike</span>.", "ex2_hl": "great minds think alike", "ex2_th": "เมื่อสถาปนิกหลักทั้งสองคนส่งพิมพ์เขียวที่มีระบบระบายอากาศพลังงานแสงอาทิตย์แบบธรรมชาติเหมือนกันเป๊ะ คณะกรรมการจึงเอ่ยแซวว่าคนเก่งมักมีความคิดตรงกัน", "slot_num": 659, "sheet_no": 7, "first_letter": "G"}, {"id": 487, "orig_slot": "#660", "idiom": "Green with envy", "meaning": "Very jealous.", "thai_idiom": "อิจฉาตาร้อน / อิจฉาจนตาร้อนผ่าว", "thai_meaning": "อิจฉาริษยาเป็นอย่างยิ่ง, อิจฉาจนออกนอกหน้า", "ex1_en": "When Daniel parked his sleek new sports coupe in the driveway, his neighborhood buddies turned <span class=\"hl-teal\">green with envy</span>.", "ex1_hl": "green with envy", "ex1_th": "เมื่อแดเนียลขับรถสปอร์ตคูเป้คันหรูมาจอดหน้าบ้าน เพื่อนบ้านละแวกนั้นต่างก็อิจฉาตาร้อนกันเป็นแถว", "ex2_en": "Rival fintech firms were <span class=\"hl-teal\">green with envy</span> after the young startup secured exclusive partnership terms with the central banking authority.", "ex2_hl": "green with envy", "ex2_th": "บรรดาบริษัทฟินเทคคู่แข่งต่างอิจฉาตาร้อนผ่าวหลังจากสตาร์ทอัพรุ่นใหม่แห่งนี้คว้าสัญญาพันธมิตรแต่เพียงผู้เดียวกับธนาคารกลางมาได้", "slot_num": 660, "sheet_no": 7, "first_letter": "G"}, {"id": 488, "orig_slot": "#661", "idiom": "Grow on you", "meaning": "Become more pleasing with time.", "thai_idiom": "ยิ่งอยู่นานยิ่งชอบ / ค่อยๆ รู้สึกชอบขึ้นเรื่อยๆ", "thai_meaning": "เริ่มชอบหรือถูกใจมากขึ้นเรื่อยๆ ตามกาลเวลา (จากเดิมที่ไม่ได้รู้สึกชอบในตอนแรก)", "ex1_en": "I wasn't a fan of bitter dark chocolate at first, but it gradually <span class=\"hl-teal\">grew on me</span> until it became my favorite dessert.", "ex1_hl": "grew on me", "ex1_th": "ตอนแรกฉันไม่ค่อยชอบดาร์กช็อกโกแลตรสขมเท่าไหร่ แต่พอกินไปเรื่อยๆ ก็เริ่มชอบมากขึ้นจนกลายเป็นของหวานโปรดไปแล้ว", "ex2_en": "Although critics originally panned the avant-garde layout of the civic theater, the unconventional acoustic design slowly <span class=\"hl-teal\">grew on them</span>.", "ex2_hl": "grew on th _slot": "#676", "idiom": "Just the tip of the iceberg", "meaning": "A small part of a big problem.", "thai_idiom": "ยอดภูเขาน้ำแข็ง / ปัญหาที่เห็นเป็นแค่ยอดภูเขาน้ำแข็ง", "thai_meaning": "ส่วนเล็กๆ ที่มองเห็นได้ของปัญหาใหญ่ที่ซ่อนอยู่ข้างใต้", "ex1_en": "A leaky dishwasher valve turned out to be <span class=\"hl-teal\">just the tip of the iceberg</span>; rotten floorboards stretched across the whole kitchen.", "ex1_hl": "just the tip of the iceberg", "ex1_th": "วาล์วเครื่องล้างจานรั่วกลายเป็นแค่ยอดภูเขาน้ำแข็ง เพราะแผ่นไม้ปูพื้นผุพังลามไปทั่วทั้งห้องครัว", "ex2_en": "The lead forensic investigator warned that the disclosed embezzlement scheme was <span class=\"hl-teal\">just the tip of the iceberg</span> in a multi-state money-laundering network.", "ex2_hl": "just the tip of the iceberg", "ex2_th": "หัวหน้าชุดสืบสวนนิติวิทยาศาสตร์เตือนว่าแผนการยักยอกเงินที่ถูกเปิดโปงนี้เป็นเพียงแค่ยอดภูเขาน้ำแข็งของเครือข่ายฟอกเงินข้ามรัฐขนาดใหญ่", "slot_num": 676, "sheet_no": 7, "first_letter": "J"}, {"id": 496, "orig_slot": "#678", "idiom": "Keep under wraps", "meaning": "Keep secret.", "thai_idiom": "ปิดเป็นความลับ / อุบเงียบไว้", "thai_meaning": "เก็บรักษาเป็นความลับ, ปิดบังไว้ไม่ให้ใครรู้จนกว่าจะถึงเวลาที่เหมาะสม", "ex1_en": "We managed to <span class=\"hl-teal\">keep the surprise retirement party under wraps</span> until Grandfather walked into the restaurant.", "ex1_hl": "keep the surprise retirement party under wraps", "ex1_th": "พวกเราสามารถอุบเรื่องงานเลี้ยงเกษียณเซอร์ไพรส์ไว้เป็นความลับได้สำเร็จจนกระทั่งคุณปู่เดินเข้ามาในร้านอาหาร", "ex2_en": "Aerospace engineers were instructed to <span class=\"hl-teal\">keep the supersonic engine blueprints strictly under wraps</span> until patent clearances were finalized.", "ex2_hl": "keep the supersonic engine blueprints strictly under wraps", "ex2_th": "วิศวกรการบินและอวกาศได้รับคำสั่งให้เก็บรักษาพิมพ์เขียวเครื่องยนต์ความเร็วเหนือเสียงไว้เป็นความลับขั้นสุดยอดจนกว่ากระบวนการจดสิทธิบัตรจะเสร็จสมบูรณ์", "slot_num": 678, "sheet_no": 7, "first_letter": "K"}, {"id": 497, "orig_slot": "#679", "idiom": "Kick the habit", "meaning": "Stop a bad habit.", "thai_idiom": "เลิกนิสัยเสีย / สลัดพฤติกรรมเดิมๆ ทิ้ง", "thai_meaning": "เลิกทำพฤติกรรมหรือนิสัยที่ไม่ดี (โดยเฉพาะสิ่งเสพติดหรือความเคยชินแย่ๆ)", "ex1_en": "After relying on sugary energy drinks during late-night gaming, Marco finally managed to <span class=\"hl-teal\">kick the habit</span> and drink water instead.", "ex1_hl": "kick the habit", "ex1_th": "หลังจากติดดื่มเครื่องดื่มชูกำลังที่มีน้ำตาลสูงช่วงเล่นเกมดึกๆ ในที่สุดมาร์โกก็เลิกนิสัยนี้ได้สำเร็จและหันมาดื่มน้ำเปล่าแทน", "ex2_en": "Occupational health specialists designed interactive mindfulness programs to help factory workers <span class=\"hl-teal\">kick the habit</span> of tobacco use during shift breaks.", "ex2_hl": "kick the habit", "ex2_th": "ผู้เชี่ยวชาญด้านอาชีวอนามัยได้ออกแบบโปรแกรมฝึกสติเชิงโต้ตอบ เพื่อช่วยให้คนงานในโรงงานเลิกนิสัยสูบบุหรี่ในช่วงเวลาพักกะการทำงาน", "slot_num": 679, "sheet_no": 7, "first_letter": "K"}, {"id": 498, "orig_slot": "#685", "idiom": "Life is what you make it", "meaning": "You control your life.", "thai_idiom": "ชีวิตเรา เรากำหนดเอง / ลิขิตฟ้าหรือจะสู้มานะคน", "thai_meaning": "ชีวิตจะเป็นอย่างไรขึ้นอยู่กับการกระทำ ทัศนคติ และการเลือกของเราเอง", "ex1_en": "Whenever I start complaining about bad luck, my mother smiles and reminds me that <span class=\"hl-teal\">life is what you make it</span>.", "ex1_hl": "life is what you make it", "ex1_th": "เมื่อไหร่ที่ฉันเริ่มบ่นเรื่องโชคชะตาที่ไม่ดี แม่จะยิ้มแล้วคอยเตือนสติฉันเสมอว่าชีวิตเราจะเป็นเช่นไรขึ้นอยู่กับสิ่งที่เราสร้างขึ้นมาเอง", "ex2_en": "In her university valedictory address, the scholar urged graduates to remember that external hurdles exist, but ultimately <span class=\"hl-teal\">life is what you make it</span>.", "ex2_hl": "life is what you make it", "ex2_th": "ในสุนทรพจน์วันสำเร็จการศึกษาของมหาวิทยาลัย บัณฑิตเกียรตินิยมได้กระตุ้นเตือนเพื่อนร่วมรุ่นว่าอุปสรรคภายนอกย่อมมีอยู่เสมอ แต่ท้ายที่สุดแล้วชีวิตเราจะเป็นอย่างไรก็อยู่ที่ตัวเราเอง", "slot_num": 685, "sheet_no": 7, "first_letter": "L"}, {"id": 499, "orig_slot": "#689", "idiom": "Lose track of time", "meaning": "Forget time while doing something.", "thai_idiom": "เพลินจนลืมเวลา / ลืมวันลืมคืน", "thai_meaning": "เพลิดเพลินหรือจดจ่อกับสิ่งที่ทำจนลืมดูเวลา", "ex1_en": "I was engrossed in gardening on Sunday afternoon and completely <span class=\"hl-teal\">lost track of time</span> until the streetlamps flickered on.", "ex1_hl": "lost track of time", "ex1_th": "ฉันง่วนอยู่กับการทำสวนในบ่ายวันอาทิตย์จนเพลินลืมเวลาไปเลย มารู้ตัวอีกทีก็ตอนที่ไฟถนนเริ่มเปิดสว่างแล้ว", "ex2_en": "The senior research scientist got so absorbed in calibrating the electron microscope that she completely <span class=\"hl-teal\">lost track of time</span>, missing the faculty dinner.", "ex2_hl": "lost track of time", "ex2_th": "นักวิทยาศาสตร์วิจัยอาวุโสจดจ่ออยู่กับการปรับเทียบกล้องจุลทรรศน์อิเล็กตรอนจนลืมดูเวลาไปสนิท ทำให้เธอพลาดงานเลี้ยงอาหารค่ำของคณะ", "slot_num": 689, "sheet_no": 7, "first_letter": "L"}, {"id": 500, "orig_slot": "#697", "idiom": "Move heaven and earth", "meaning": "Do everything possible.", "thai_idiom": "พลิกแผ่นดินหา / ทำทุกวิถีทาง / บุกน้ำลุยไฟ", "thai_meaning": "ทุ่มเททำทุกวิถีทางอย่างสุดความสามารถเพื่อให้บรรลุเป้าหมาย", "ex1_en": "When our rescue dog slipped out of the yard during fireworks, our family <span class=\"hl-teal\">moved heaven and earth</span> to find him before midnight.", "ex1_hl": "moved heaven and earth", "ex1_th": "เมื่อสุนัขของเราตกใจเสียงพลุจนแอบหลุดออกจากรั้วบ้าน ครอบครัวเราก็ทำทุกวิถีทางเพื่อตามหาเขาให้เจอก่อนเที่ยงคืน", "ex2_en": "The crisis mitigation team <span class=\"hl-teal\">moved heaven and earth</span> to secure emergency container ships and prevent assembly line shutdowns across three countries.", "ex2_hl": "moved heaven and earth", "ex2_th": "ทีมจัดการภาวะวิกฤตทุ่มเททำทุกวิถีทางเพื่อจัดหาเรือขนส่งตู้คอนเทนเนอร์ฉุกเฉิน และป้องกันไม่ให้สายการผลิตในสามประเทศต้องหยุดชะงักลง", "slot_num": 697, "sheet_no": 7, "first_letter": "M"}, {"id": 501, "orig_slot": "#698", "idiom": "My cup of tea", "meaning": "Something I like.", "thai_idiom": "แนวที่ชอบ / สเปก / ทางของฉัน", "thai_meaning": "สิ่งที่ชอบ, สิ่งที่ถูกจริตหรือตรงกับความสนใจของตนเอง", "ex1_en": "Camping in cold wet weather is not really <span class=\"hl-teal\">my cup of tea</span>; I much prefer cozy cabin getaways.", "ex1_hl": "my cup of tea", "ex1_th": "การไปกางเต็นท์นอนท่ามกลางอากาศหนาวชื้นไม่ใช่แนวที่ฉันชอบเท่าไหร่ ฉันชอบไปพักผ่อนในกระท่อมที่อบอุ่นสบายมากกว่าเยอะ", "ex2_en": "While routine budget auditing isn't <span class=\"hl-teal\">her cup of tea</span>, forensic asset valuation is where her analytical skills truly shine.", "ex2_hl": "her cup of tea", "ex2_th": "แม้งานตรวจสอบงบประมาณประจำวันจะไม่ใช่แนวที่เธอชอบ แต่งานประเมินมูลค่าสินทรัพย์เชิงนิติวิทยาศาสตร์คือสิ่งที่ทักษะการวิเคราะห์ของเธอเปล่งประกายอย่างแท้จริง", "slot_num": 698, "sheet_no": 7, "first_letter": "M"}, {"id": 502, "orig_slot": "#699", "idiom": "No ifs, no buts", "meaning": "Absolutely; no excuses.", "thai_idiom": "ห้ามมีข้อแม้ / ห้ามอิดออด / ไม่มีข้อแก้ตัวใดๆ ทั้งสิ้น", "thai_meaning": "ต้องปฏิบัติตามโดยเด็ดขาด ห้ามมีข้ออ้างหรือข้อแก้ตัวใดๆ ทั้งสิ้น", "ex1_en": "“You need to put your phone away and get to sleep right now—<span class=\"hl-teal\">no ifs, no buts</span>,” Dad insisted.", "ex1_hl": "no ifs, no buts", "ex1_th": "“ลูกต้องเก็บโทรศัพท์แล้วเข้านอนเดี๋ยวนี้เลย ห้ามมีข้อแม้หรืออิดออดใดๆ ทั้งนั้น” พ่อสั่งเสียงหนักแน่น", "ex2_en": "The chief safety officer emphasized that wearing certified protective respirators in chemical processing areas is mandatory, <span class=\"hl-teal\">no ifs, no buts</span>.", "ex2_hl": "no ifs, no buts", "ex2_th": "หัวหน้าเจ้าหน้าที่ความปลอดภัยเน้นย้ำว่าการสวมหน้ากากกรองอากาศป้องกันสารเคมีที่ได้มาตรฐานในพื้นที่ผลิตเป็นกฎบังคับเด็ดขาด โดยไม่มีข้อยกเว้นหรือข้อแก้ตัวใดๆ ทั้งสิ้น", "slot_num": 699, "sheet_no": 7, "first_letter": "N"}, {"id": 503, "orig_slot": "#702", "idiom": "Not a big deal", "meaning": "Not very important.", "thai_idiom": "ไม่ใช่เรื่องคอขาดบาดตาย / เรื่องเล็กน้อย / จิ๊บจ๊อย", "thai_meaning": "ไม่ใช่เรื่องใหญ่โต, เป็นเรื่องเล็กน้อยที่ไม่ต้องกังวล", "ex1_en": "“Don't worry about spilling a few drops of water on the rug; it's really <span class=\"hl-teal\">not a big deal</span>,” Nora said with a warm smile.", "ex1_hl": "not a big deal", "ex1_th": "“ไม่ต้องกังวลเรื่องทำน้ำหยดใส่พรมสองสามหยดหรอกจ้ะ มันไม่ใช่เรื่องใหญ่อะไรเลยจริงๆ” โนราห์กล่าวพร้อมรอยยิ้มอบอุ่น", "ex2_en": "The software engineer assured management that the small visual alignment bug was <span class=\"hl-teal\">not a big deal</span> and would be resolved in the morning hotfix.", "ex2_hl": "not a big deal", "ex2_th": "วิศวกรซอฟต์แวร์ให้ความมั่นใจแก่ฝ่ายบริหารว่าข้อผิดพลาดด้านการจัดวางตำแหน่งหน้าจอเล็กน้อยนี้ไม่ใช่เรื่องคอขาดบาดตาย และจะได้รับการแก้ไขในการปล่อยแพตช์ด่วนช่วงเช้า", "slot_num": 702, "sheet_no": 8, "first_letter": "N"}, {"id": 504, "orig_slot": "#703", "idiom": "Not for all the tea in China", "meaning": "Impossible; not worth doing.", "thai_idiom": "ให้ทองท่วมหัวก็ไม่เอา / ต่อให้จ้างเป็นล้านก็ไม่ทำ", "thai_meaning": "ต่อให้เอาอะไรมีค่ามาแลกก็ไม่มีทางทำอย่างเด็ดขาด, ไม่มีทางยอมไม่ว่าจะเกิดอะไรขึ้น", "ex1_en": "I wouldn't ride that rickety wooden roller coaster again, <span class=\"hl-teal\">not for all the tea in China</span>.", "ex1_hl": "not for all the tea in China", "ex1_th": "ฉันไม่มีทางขึ้นไปนั่งรถไฟเหาะไม้ผุๆ โยกเยกนั่นอีกเด็ดขาด ต่อให้เอาทองท่วมหัวมาแลกก็ไม่เอา", "ex2_en": "The compliance auditor asserted that <span class=\"hl-teal\">not for all the tea in China</span> would she sign off on an offshore account structure that violated international anti-money laundering laws.", "ex2_hl": "not for all the tea in China", "ex2_th": "ผู้ตรวจสอบด้านการปฏิบัติตามกฎระเบียบยืนยันหนักแน่นว่า ต่อให้เอาอะไรมาล่อใจ เธอก็ไม่มีวันลงนามอนุมัติโครงสร้างบัญชีนอกประเทศที่ละเมิดกฎหมายป้องกันและปราบปรามการฟอกเงินสากลอย่างเด็ดขาด", "slot_num": 703, "sheet_no": 8, "first_letter": "N"}, {"id": 505, "orig_slot": "#706", "idiom": "On the back foot", "meaning": "At a disadvantage.", "thai_idiom": "ตกเป็นฝ่ายเพลี่ยงพล้ำ / ตกเป็นเบี้ยล่าง", "thai_meaning": "ตกอยู่ในสถานะที่เสียเปรียบหรือต้องคอยตั้งรับฝ่ายตรงข้าม", "ex1_en": "When Dad discovered the dent on the family car before I could even explain, I was immediately <span class=\"hl-teal\">on the back foot</span>.", "ex1_hl": "on the back foot", "ex1_th": "พอพ่อเห็นรอยบุบบนรถของครอบครัวก่อนที่ฉันจะได้อธิบาย ฉันก็ตกเป็นฝ่ายเสียเปรียบและต้องคอยแก้ตัวตั้งแต่เริ่มทันที", "ex2_en": "The sudden leak of internal product testing data put the tech firm <span class=\"hl-teal\">on the back foot</span> during the live press conference.", "ex2_hl": "on the back foot", "ex2_th": "การรั่วไหลอย่างกะทันหันของข้อมูลการทดสอบผลิตภัณฑ์ภายใน ทำให้บริษัทเทคโนโลยีตกเป็นฝ่ายเพลี่ยงพล้ำและต้องคอยตั้งรับระหว่างการแถลงข่าวสด", "slot_num": 706, "sheet_no": 8, "first_letter": "O"}, {"id": 506, "orig_slot": "#709", "idiom": "Out of the question", "meaning": "Impossible; unacceptable.", "thai_idiom": "เป็นไปไม่ได้เด็ดขาด / อย่าหวังเลย", "thai_meaning": "ไม่อาจยอมรับได้ หรือไม่มีทางที่จะเกิดขึ้นได้อย่างแน่นอน", "ex1_en": "Borrowing Dad's vintage convertible for our weekend road trip is completely <span class=\"hl-teal\">out of the question</span>.", "ex1_hl": "out of the question", "ex1_th": "การจะขอยืมรถเปิดประทุนคลาสสิกของพ่อไปขับเที่ยวช่วงสุดสัปดาห์นั้นเป็นไปไม่ได้เด็ดขาด อย่าหวังเลย", "ex2_en": "Extending the project delivery date beyond the end of the fiscal year is <span class=\"hl-teal\">out of the question</span> due to strict grant requirements.", "ex2_hl": "out of the question", "ex2_th": "การขยายกำหนดส่งมอบโครงการออกไปเกินสิ้นปีงบประมาณเป็นสิ่งที่ไม่สามารถยอมรับได้เด็ดขาด เนื่องจากเงื่อนไขเงินทุนที่เข้มงวด", "slot_num": 709, "sheet_no": 8, "first_letter": "O"}, {"id": 507, "orig_slot": "#710", "idiom": "Out of the woods", "meaning": "No longer in danger.", "thai_idiom": "พ้นขีดอันตราย / รอดพ้นวิกฤต", "thai_meaning": "ผ่านพ้นช่วงเวลาที urrently <span class=\"hl-teal\">under the gun</span> to patch the critical zero-day exploit ahead of tomorrow's product rollout.", "ex2_hl": "under the gun", "ex2_th": "ทีมวิศวกรซอฟต์แวร์กำลังตกอยู่ใต้แรงกดดันจากเส้นตายอันกระชั้นชิด เพื่ออุดช่องโหว่ความปลอดภัยระดับวิกฤตให้ทันก่อนการเปิดตัวผลิตภัณฑ์ในวันพรุ่งนี้", "slot_num": 765, "sheet_no": 8, "first_letter": "U"}, {"id": 538, "orig_slot": "#766", "idiom": "Under the rug", "meaning": "Hidden; not discussed.", "thai_idiom": "ซุกไว้ใต้พรม / ปกปิดไม่ให้ใครรู้", "thai_meaning": "ซุกซ่อนหรือหลีกเลี่ยงการพูดถึงปัญหาหรือความผิดพลาด เพื่อทำเหมือนว่ามันไม่มีอยู่จริง", "ex1_en": "Whenever an awkward argument breaks out between my brothers, our family tends to sweep it <span class=\"hl-teal\">under the rug</span> instead of resolving it.", "ex1_hl": "under the rug", "ex1_th": "เวลาที่มีเรื่องทะเลาะเบาะแว้งที่น่าอึดอัดใจเกิดขึ้นระหว่างพี่น้อง ครอบครัวของเราก็มักจะซุกปัญหานั้นไว้ใต้พรมแทนที่จะช่วยกันสะสางให้จบ", "ex2_en": "The independent audit uncovered millions in offshore liabilities that the former executive board had deliberately swept <span class=\"hl-teal\">under the rug</span>.", "ex2_hl": "under the rug", "ex2_th": "การตรวจสอบอิสระเปิดโปงหนี้สินต่างประเทศมูลค่าหลายล้านที่คณะกรรมการบริหารชุดก่อนจงใจซุกซ่อนไว้ใต้พรมเพื่อหลีกเลี่ยงการถูกเปิดเผย", "slot_num": 766, "sheet_no": 8, "first_letter": "U"}, {"id": 539, "orig_slot": "#768", "idiom": "Up to speed", "meaning": "Informed and ready.", "thai_idiom": "รู้ข้อมูลล่าสุด / ทันเหตุการณ์ / พร้อมปฏิบัติงาน", "thai_meaning": "ได้รับข้อมูลข่าวสารครบถ้วนทันสมัย จนเข้าใจสถานการณ์และพร้อมดำเนินการต่อได้ทันที", "ex1_en": "I missed the last two episodes of our book club discussion, so Maya kindly called to bring me <span class=\"hl-teal\">up to speed</span>.", "ex1_hl": "up to speed", "ex1_th": "ฉันพลาดการพูดคุยของชมรมคนรักหนังสือไปสองครั้ง มายาจึงโทรมาช่วยสรุปอัปเดตข้อมูลให้ฉันตามทันเรื่องราวอย่างใจดี", "ex2_en": "The engineering lead scheduled a technical walkthrough to bring the , "ex2_en": "Several branch managers bristled at the consultant's report on sluggish productivity, yet <span class=\"hl-teal\">when the shoe fits</span>, departments must confront their operational flaws.", "ex2_hl": "when the shoe fits", "ex2_th": "ผู้จัดการสาขาหลายคนรู้สึกไม่พอใจกับรายงานของที่ปรึกษาเรื่องผลิตภาพที่ซบเซา แต่เมื่อข้อวิจารณ์นั้นตรงกับความจริง แต่ละแผนกก็จำเป็นต้องยอมรับและแก้ไขข้อบกพร่องในการทำงาน", "slot_num": 774, "sheet_no": 8, "first_letter": "W"}, {"id": 544, "orig_slot": "#775", "idiom": "Whole new ball game", "meaning": "Completely different.", "thai_idiom": "คนละเรื่องเดียวกัน / หนังคนละม้วน / สถานการณ์หน้ามือเป็นหลังมือ", "thai_meaning": "สถานการณ์หรือบริบทใหม่ที่แตกต่างจากเดิมอย่างสิ้นเชิง", "ex1_en": "Cooking for two at home was easy, but preparing a three-course dinner for fifteen guests turned out to be a <span class=\"hl-teal\">whole new ball game</span>.", "ex1_hl": "whole new ball game", "ex1_th": "ทำกับข้าวทานกันสองคนที่บ้านมันง่าย แต่การต้องเตรียมอาหารคอร์สสามอย่างเลี้ยงแขกถึงสิบห้าคนกลายเป็นคนละเรื่องเลยทีเดียว", "ex2_en": "Expanding operations from regional retail into global e-commerce proved to be a <span class=\"hl-teal\">whole new ball game</span> with intricate cross-border tariffs.", "ex2_hl": "whole new ball game", "ex2_th": "การขยายกิจการจากร้านค้าปลีกระดับภูมิภาคไปสู่อีคอมเมิร์ซระดับโลกกลายเป็นสถานการณ์ที่แตกต่างไปอย่างสิ้นเชิง ด้วยเรื่องภาษีศุลกากรข้ามพรมแดนที่ซับซ้อน", "slot_num": 775, "sheet_no": 8, "first_letter": "W"}, {"id": 545, "orig_slot": "#776", "idiom": "Win-win situation", "meaning": "Good for everyone.", "thai_idiom": "ได้ประโยชน์ทั้งสองฝ่าย / วิน-วิน", "thai_meaning": "สถานการณ์หรือข้อตกลงที่ทุกฝ่ายที่เกี่ยวข้องได้รับผลประโยชน์ร่วมกัน", "ex1_en": "If you carpool with me, I get company on the long commute and you save gas money, so it's a total <span class=\"hl-teal\">win-win situation</span>.", "ex1_hl": "win-win situation", "ex1_th": "ถ้าเธอติดรถไปทำงานกับฉัน ฉันก็มีเพื่อนคุยระหว่างทางไกล ส่วนเธอก็ประหยัดค่าน้ำมัน ถือว่าได้ประโยชน์กันทั้งสองฝ่ายเลย", "ex2_en": "The strategic alliance between the biotech firm and the university created a <span class=\"hl-teal\">win-win situation</span>, accelerating clinical research while securing long-term grant funding.", "ex2_hl": "win-win situation", "ex2_th": "การจับมือเป็นพันธมิตรเชิงกลยุทธ์ระหว่างบริษัทเทคโนโลยีชีวภาพและมหาวิทยาลัยก่อให้เกิดสถานการณ์ที่ได้ประโยชน์ทั้งสองฝ่าย โดยช่วยเร่งงานวิจัยทางคลินิกและสร้างหลักประกันเงินทุนวิจัยระยะยาว", "slot_num": 776, "sheet_no": 8, "first_letter": "W"}, {"id": 546, "orig_slot": "#777", "idiom": "Work like a charm", "meaning": "Work very well.", "thai_idiom": "ได้ผลชะงัด / ได้ผลเกินคาด / เห็นผลทันตา", "thai_meaning": "ได้ผลลัพธ์ที่ดีเยี่ยม ราบรื่น หรือประสบผลสำเร็จอย่างงดงาม", "ex1_en": "I rubbed a mixture of baking soda and vinegar onto the carpet stain, and it <span class=\"hl-teal\">worked like a charm</span>.", "ex1_hl": "worked like a charm", "ex1_th": "ฉันเอาเบกกิ้งโซดาผสมน้ำส้มสายชูมาทาตรงรอยเปื้อนบนพรม ปรากฏว่าได้ผลชะงัดเลย", "ex2_en": "The IT department's automated load-balancing script <span class=\"hl-teal\">worked like a charm</span> during the massive surge in Black Friday traffic.", "ex2_hl": "worked like a charm", "ex2_th": "สคริปต์กระจายโหลดอัตโนมัติของฝ่ายไอทีทำงานได้อย่างมีประสิทธิภาพยอดเยี่ยมในช่วงที่ยอดผู้เข้าชมเว็บไซต์พุ่งสูงถล่มทลายในวันแบล็กฟรายเดย์", "slot_num": 777, "sheet_no": 8, "first_letter": "W"}, {"id": 547, "orig_slot": "#778", "idiom": "Work under pressure", "meaning": "Perform under stress.", "thai_idiom": "ทำงานภายใต้ความกดดัน / รับมือกับความกดดันได้ดี", "thai_meaning": "ทำงานหรือปฏิบัติหน้าที่ได้อย่างมีประสิทธิภาพแม้จะอยู่ท่ามกลางความเครียดหรือกำหนดเวลาที่กระชั้นชิด", "ex1_en": "Cooking during the dinner rush taught Leo how to keep his cool and <span class=\"hl-teal\">work under pressure</span> without dropping plates.", "ex1_hl": "work under pressure", "ex1_th": "การทำอาหารในช่วงเวลาเร่งด่วนมื้อค่ำสอนให้ลีโอรู้จักควบคุมสติและทำงานภายใต้ความกดดันได้โดยไม่ทำจานตกแตก", "ex2_en": "Emergency room physicians must be exceptionally qualified to make split-second clinical decisions and <span class=\"hl-teal\">work under pressure</span>.", "ex2_hl": "work under pressure", "ex2_th": "แพทย์ประจำห้องฉุกเฉินต้องมีความเชี่ยวชาญเป็นพิเศษในการตัดสินใจรักษาอย่างฉับพลันและสามารถทำงานภายใต้สภาวะความกดดันสูงได้", "slot_num": 778, "sheet_no": 8, "first_letter": "W"}, {"id": 548, "orig_slot": "#779", "idiom": "You bet!", "meaning": "Certainly!", "thai_idiom": "แน่นอนที่สุด! / ได้เลยสิ! / ยินดีอย่างยิ่ง!", "thai_meaning": "แน่นอน, ชัวร์ป้าบ, ใช่เลย หรือไม่ต้องสงสัยเลย", "ex1_en": "\"Are you still coming to the lakeside barbecue this Saturday afternoon?\" — \"<span class=\"hl-teal\">You bet!</span> I've already bought the marinade.\"", "ex1_hl": "You bet!", "ex1_th": "\"วันเสาร์บ่ายนี้เธอยังจะมางานบาร์บีคิวริมทะเลสาบอยู่ใช่ไหม\" — \"ไปแน่นอนสิ! ฉันซื้อซอสหมักเตรียมไว้เรียบร้อยแล้ว\"", "ex2_en": "When asked whether the new renewable energy portfolio would yield substantial tax incentives, the financial analyst nodded and said, \"<span class=\"hl-teal\">You bet!</span>\"", "ex2_hl": "You bet!", "ex2_th": "เมื่อถูกถามว่าพอร์ตการลงทุนด้านพลังงานหมุนเวียนตัวใหม่จะสร้างสิทธิประโยชน์ทางภาษีอย่างเป็นกอบเป็นกำหรือไม่ นักวิเคราะห์การเงินพยักหน้าแล้วตอบว่า \"แน่นอนที่สุดครับ!\"", "slot_num": 779, "sheet_no": 8, "first_letter": "Y"}, {"id": 549, "orig_slot": "#782", "idiom": "You don't say!", "meaning": "Really? (sarcastic)", "thai_idiom": "พูดเป็นเล่นน่า! / ไม่บอกไม่รู้นะเนี่ย! (เชิงประชด)", "thai_meaning": "จริงเหรอเนี่ย (มักใช้ในเชิงประชดประชันว่าสิ่งนั้นเป็นเรื่องที่เห็นได้ชัดเจนอยู่แล้ว)", "ex1_en": "\"It's pouring outside and we don't have an umbrella.\" — \"<span class=\"hl-teal\">You don't say!</span> Thanks for stating the obvious.\"", "ex1_hl": "You don't say!", "ex1_th": "\"ข้างนอกฝนตกหนักมากแล้วเราก็ไม่มีร่มด้วยนะ\" — \"แหม ไม่บอกไม่รู้นะเนี่ย! ขอบใจนะที่ช่วยพูดเรื่องที่ใครๆ ก็เห็น\"", "ex2_en": "When the contractor nonchalantly explained that pouring concrete in a blizzard would cause delays, the site manager dryly responded, \"<span class=\"hl-teal\">You don't say!</span>\"", "ex2_hl": "You don't say!", "ex2_th": "เมื่อผู้รับเหมาพูดหน้าตาเฉยว่าการเทคอนกรีตท่ามกลางพายุหิมะจะทำให้งานล่าช้า ผู้จัดการไซต์งานจึงตอบกลับแบบประชดว่า \"พูดเป็นเล่นน่า ใครๆ เขาก็รู้กันทั้งนั้น!\"", "slot_num": 782, "sheet_no": 8, "first_letter": "Y"}, {"id": 550, "orig_slot": "#783", "idiom": "You hit the nail on the head", "meaning": "You are exactly right.", "thai_idiom": "พูดได้ตรงจุด / แทงใจดำ / พูดได้ถูกต้องเผง", "thai_meaning": "พูดหรือระบุได้ถูกต้องตรงเผง หรือชี้ตรงจุดสำคัญของปัญหาได้อย่างแม่นยำ", "ex1_en": "When Clara suggested that our fatigue was caused by dehydration rather than lack of sleep, I told her, \"<span class=\"hl-teal\">You hit the nail on the head</span>.\"", "ex1_hl": "You hit the nail on the head", "ex1_th": "พอคลาร่าทักว่าอาการเหนื่อยล้าของเราน่าจะเกิดจากการดื่มน้ำน้อยเกินไปไม่ใช่เพราะนอนไม่พอ ฉันก็บอกเธอว่า \"เธอพูดได้ตรงเป๊ะเลย\"", "ex2_en": "The board chairman commended the consultant's diagnostic presentation, remarking, \"<span class=\"hl-teal\">You hit the nail on the head</span> regarding our supply chain vulnerabilities.\"", "ex2_hl": "You hit the nail on the head", "ex2_th": "ประธานคณะกรรมการกล่าวชื่นชมการนำเสนอผลการวินิจฉัยของที่ปรึกษาโดยระบุว่า \"คุณชี้ประเด็นช่องโหว่ในห่วงโซ่อุปทานของเราได้อย่างตรงจุดและแม่นยำที่สุด\"", "slot_num": 783, "sheet_no": 8, "first_letter": "Y"}, {"id": 551, "orig_slot": "#784", "idiom": "You live and learn", "meaning": "Learn from experience.", "thai_idiom": "คนเราต้องเรียนรู้กันไป / ผิดเป็นครู / ประสบการณ์สอนคน", "thai_meaning": "คนเราย่อมเรียนรู้สิ่งใหม่ๆ จากประสบการณ์และความผิดพลาดเสมอ", "ex1_en": "I ruined my favorite wool sweater by tossing it in the hot dryer, but well, <span class=\"hl-teal\">you live and learn</span>.", "ex1_hl": "you live and learn", "ex1_th": "ฉันทำเสื้อกันหนาวขนสัตว์ตัวโปรดหดพังเพราะเผลอโยนเข้าเครื่องอบผ้าร้อน แต่ก็นะ คนเราก็ต้องเรียนรู้จากความผิดพลาดกันไป", "ex2_en": "Our initial marketing campaign failed to resonate with Gen Z consumers, but <span class=\"hl-teal\">you live and learn</span>, and our revised strategy doubled our conversion rate.", "ex2_hl": "you live and learn", "ex2_th": "แคมเปญการตลาดช่วงแรกของเราไม่สามารถดึงดูดกลุ่มผู้บริโภค Gen Z ได้ แต่ความผิดพลาดย่อมเป็นบทเรียน และกลยุทธ์ที่ปรับปรุงใหม่ก็ช่วยเพิ่มอัตราการตัดสินใจซื้อได้ถึงสองเท่า", "slot_num": 784, "sheet_no": 8, "first_letter": "Y"}, {"id": 552, "orig_slot": "#787", "idiom": "A bad apple spoils the bunch", "meaning": "One bad person influences others.", "thai_idiom": "ปลาข้องเดียวกัน / ปลาเน่าตัวเดียวเหม็นหมดทั้งข้อง", "thai_meaning": "คนไม่ดีเพียงคนเดียวสามารถสร้างความเสียหายหรือส่งผลเสียต่อคนหมู่มากในกลุ่มได้", "ex1_en": "Our neighborhood volunteer club was harmonious until Jake joined and started spreading toxic gossip; truly, <span class=\"hl-teal\">a bad apple spoils the bunch</span>.", "ex1_hl": "a bad apple spoils the bunch", "ex1_th": "ชมรมอาสาสมัครในหมู่บ้านของเราเคยสมัครสมานสามัคคีกันดี จนกระทั่งเจคเข้ามาและเริ่มปล่อยข่าวลือที่บ่อนทำลาย ช่างเข้าตำราปลาเน่าตัวเดียวเหม็นไปทั้งข้องจริงๆ", "ex2_en": "The HR director acted quickly to dismiss the rogue trader, aware that in high-stakes banking, <span class=\"hl-teal\">a bad apple spoils the bunch</span>.", "ex2_hl": "a bad apple spoils the bunch", "ex2_th": "ผู้อำนวยการฝ่ายทรัพยากรบุคคลเร่งดำเนินการปลดเทรดเดอร์ที่ทุจริตออกทันที เพราะตระหนักดีว่าในแวดวงการธนาคารที่มีความเสี่ยงสูง ปลาเน่าเพียงตัวเดียวอาจสร้างความเสียหายร้ายแรงต่อทั้งองค์กร", "slot_num": 787, "sheet_no": 8, "first_letter": "A"}, {"id": 553, "orig_slot": "#788", "idiom": "A bird in the hand is worth two in the bush", "meaning": "It's better to keep what you have.", "thai_idiom": "สิบเบี้ยใกล้มือ / กำขี้ดีกว่ากำตด / ของตายในมือดีกว่าหวังน้ำบ่อหน้า", "thai_meaning": "สิ่งที่ได้มาอยู่ในมือแล้วย่อมดีกว่าสิ่งที่มีโอกาสได้มากกว่าแต่ยังไม่แน่นอนและเสี่ยงสูญเสีย", "ex1_en": "Instead of holding out for an uncertain higher bidder on my used car, I took Liam's cash offer because <span class=\"hl-teal\">a bird in the hand is worth two in the bush</span>.", "ex1_hl": "a bird in the hand is worth two in the bush", "ex1_th": "แทนที่จะรอคนที่อาจให้ราคาซื้อรถมือสองสูงกว่าซึ่งไม่แน่นอน ฉันตัดสินใจรับข้อเสนอเงินสดของเลียม เพราะของที่อยู่ในมือย่อมดีกว่าหวังน้ำบ่อหน้า", "ex2_en": "The board accepted the guaranteed buyout offer rather than pursuing speculative market expansion, noting that <span class=\"hl-teal\">a bird in the hand is worth two in the bush</span>.", "ex2_hl": "a bird in the hand is worth two in the bush", "ex2_th": "คณะกรรมการบริหารตัดสินใจยอมรับข้อเสนอการเข้าซื้อกิจการที่แน่นอน แทนที่จะเสี่ยงขยายตลาดที่มีความไม่แน่นอน โดยให้เหตุผลว่าผลประโยชน์ที่ชัวร์ในมือย่อมมีค่ามากกว่าความหวังที่ยังมาไม่ถึง", "slot_num": 788, "sheet_no": 8, "first_letter": "A"}, {"id": 554, "orig_slot": "#791", "idiom": "All dressed up and nowhere to go", "meaning": "Prepared but no opportunity.", "thai_idiom": "แต่งเก้อ / พร้อมเก้อ / เตรียมตัวพร้อมสรรพแต่ไม่มีโอกาสได้ใช้", "thai_meaning": "แต่งตัวหรือเตรียมการไว้อย่างพร้อมสรรพแต่กลับถูกยกเลิกแผน หรือไม่มีโอกาสได้ลงมือทำตามที่หวัง", "ex1_en": "Emma put on her party dress and makeup, only for the birthday celebration to be canceled due to bad weather, leaving her <span class=\"hl-teal\">all dressed up and nowhere to go</span>.", "ex1_hl": "all dressed up and nowhere to go", "ex1_th": "เอ็มม่าแต่งชุดราตรีและแต่งหน้าจัดเต็ม แต่แล้วงานเลี้ยงวันเกิดกลับถูกยกเลิกเพราะสภาพอากาศย่ำแย่ ทำให้เธอต้องแต่งตัวเก้ออยู่บ้าน", "ex2_en": "After building a multimillion-dollar solar manufacturing facility, the startup was left <span class=\"hl-teal\">all dressed up and nowhere to go</span> when the government abruptly scrapped renewable subsidies.", "ex2_hl": "all dressed up and nowhere to go", "ex2_th": "หลังจากทุ่มทุนสร้างโรงงานผลิตแผงโซลาร์เซลล์มูลค่าหลายล้านดอลลาร์ บริษัทสตาร์ตอัปก็ต้องตกอยู่ในสภาพเตรียมการพร้อมเก้อ เมื่อรัฐบาลประกาศยกเลิกเงินอุดหนุนพลังงานหมุนเวียนกะทันหัน", "slot_num": 791, "sheet_no": 8, "first_letter": "A"}, {"id": 555, "orig_slot": "#792", "idiom": "Beauty is in the eye of the beholder", "meaning": "Everyone has different opinions.", "thai_idiom": "ลางเนื้อชอบลางยา / ความสวยขึ้นอยู่กับสายตาคนมอง", "thai_meaning": "ความสวยงามหรือความน่าดึงดูดใจขึ้นอยู่กับมุมมองและรสนิยมส่วนบุคคลของแต่ละคน", "ex1_en": "My sister thought the vintage thrifted jacket was hideously tacky, but I loved its eccentric colors; after all, <span class=\"hl-teal\">beauty is in the eye of the beholder</span>.", "ex1_hl": "beauty is in the eye of the beholder", "ex1_th": "พี่สาวของฉันคิดว่าเสื้อแจ็กเก็ตวินเทจมือสองตัวนั้นดูเชยและแปลกประหลาด แต่ฉันกลับชอบสีสันที่ไม่เหมือนใคร เพราะความสวยงามมันขึ้นอยู่กับสายตาคนมองจริงๆ", "ex2_en": "Architectural critics heavily debated the futuristic concrete pavilion, illustrating that even in civic design, <span class=\"hl-teal\">beauty is in the eye of the beholder</span>.", "ex2_hl": "beauty is in the eye of the beholder", "ex2_th": "เหล่านักวิจารณ์สถาปัตยกรรมถกเถียงกันอย่างหนักเกี่ยวกับอาคารคอนกรีตทรงล้ำยุค สะท้อนให้เห็นว่าแม้แต่ในงานออกแบบสาธารณะ ความงดงามก็ยังขึ้นอยู่กับรสนิยมของแต่ละคน", "slot_num": 792, "sheet_no": 8, "first_letter": "B"}, {"id": 556, "orig_slot": "#793", "idiom": "Better safe than sorry", "meaning": "It's better to be careful.", "thai_idiom": "กันไว้ดีกว่าแก้ / ปลอดภัยไว้ก่อน", "thai_meaning": "รอบคอบและป้องกันไว้ล่วงหน้าดีกว่าต้องมานั่งเสียใจหรือแก้ไขภายหลัง", "ex1_en": "Even though the forecast said the rain was clearing up, I packed an umbrella just to be <span class=\"hl-teal\">better safe than sorry</span>.", "ex1_hl": "better safe than sorry", "ex1_th": "แม้พยากรณ์อากาศจะบอกว่าฝนกำลังจะหยุดตก แต่ฉันก็พกร่มติดตัวไปด้วยเพราะกันไว้ดีกว่าแก้", "ex2_en": "The network administrator insisted on backing up the central database every two hours, believing it was far <span class=\"hl-teal\">better safe than sorry</span> against ransomware attacks.", "ex2_hl": "better safe than sorry", "ex2_th": "ผู้ดูแลระบบเครือข่ายยืนกรานให้สำรองข้อมูลฐานข้อมูลกลางทุกสองชั่วโมง เพราะเชื่อมั่นว่าการป้องกันไว้ก่อนย่อมปลอดภัยกว่าต้องมานั่งเสียใจเมื่อถูกโจมตีด้วยมัลแวร์เรียกค่าไถ่", "slot_num": 793, "sheet_no": 8, "first_letter": "B"}, {"id": 557, "orig_slot": "#797", "idiom": "If the shoe fits, wear it", "meaning": "If it's true, accept it.", "thai_idiom": "ถ้าจริงก็ต้องยอมรับ / กินปูนร้อนท้องทำไมถ้าไม่ได้ทำ", "thai_meaning": "หากคำวิจารณ์หรือข้อตักเตือนนั้นตรงกับความเป็นจริงของคุณ ก็จงยอมรับฟังและนำไปปรับปรุงตัว", "ex1_en": "\"Why are you glaring at me? I didn't mention your name when I complained about dirty dishes, but <span class=\"hl-teal\">if the shoe fits, wear it</span>.\"", "ex1_hl": "if the shoe fits, wear it", "ex1_th": "\"มองหน้าฉันทำไมล่ะ ตอนบ่นเรื่องจานชามสกปรกฉันไม่ได้เอ่ยชื่อเธอสักหน่อย แต่ถ้ามันตรงกับตัวจริง ก็ยอมรับไปเถอะ\"", "ex2_en": "When the auditor condemned sloppy expense reporting without naming specific departments, the finance VP noted, \"<span class=\"hl-teal\">If the shoe fits, wear it</span>, and rectify your receipts.\"", "ex2_hl": "If the shoe fits, wear it", "ex2_th": "เมื่อผู้ตรวจสอบบัญชีตำหนิเรื่องการทำรายงานเบิกจ่ายที่หละหลวมโดยไม่ได้ระบุชื่อแผนก รองประธานฝ่ายการเงินจึงกล่าวว่า \"หากตรงกับแผนกไหนก็จงยอมรับความจริงและรีบแก้ไขใบเสร็จให้ถูกต้อง\"", "slot_num": 797, "sheet_no": 8, "first_letter": "I"}, {"id": 558, "orig_slot": "#798", "idiom": "It is what it is", "meaning": "Accept the situation.", "thai_idiom": "อะไรจะเกิดก็ต้องเกิด / มันก็เป็นแบบนี้แหละ / ปลง / ทำใจยอมรับ", "thai_meaning": "ยอมรับความจริงหรือสถานการณ์ที่เกิดขึ้นเพราะไม่สามารถเปลี่ยนแปลงอะไรได้แล้ว", "ex1_en": "Our flight was delayed by five hours due to heavy fog, but <span class=\"hl-teal\">it is what it is</span>, so we found a quiet coffee shop and read.", "ex1_hl": "it is what it is", "ex1_th": "เที่ยวบินของเราล่าช้าไปห้าชั่วโมงเพราะหมอกลงจัด แต่ในเมื่อทำอะไรไม่ได้ก็ต้องทำใจ เราเลยไปหาร้านกาแฟเงียบๆ นั่งอ่านหนังสือรอ", "ex2_en": "Although the sudden regulatory change reduced our projected quarterly profits, the managing director told stakeholders, \"<span class=\"hl-teal\">It is what it is</span>, and we must adapt swiftly.\"", "ex2_hl": "It is what it is", "ex2_th": "แม้การเปลี่ยนแปลงกฎระเบียบอย่างกะทันหันจะทำให้กำไรรายไตรมาสที่คาดการณ์ไว้ลดลง แต่กรรมการผู้จัดการก็แจ้งแก่ผู้ถือหุ้นว่า \"สถานการณ์มันเกิดขึ้นแล้วเราต้องยอมรับความจริง และต้องปรับตัวให้ทันท่วงที\"", "slot_num": 798, "sheet_no": 8, "first_letter": "I"}, {"id": 559, "orig_slot": "#801", "idiom": "Pull out all the stops", "meaning": "Do everything possible.", "thai_idiom": "ทุ่มสุดตัว / จัดเต็ม / งัดทุกไม้เด็ดออกมาใช้", "thai_meaning": "ทุ่มเทความพยายามและทรัพยากรทุกอย่างที่มีอย่างเต็มที่เพื่อทำให้สำเร็จ", "ex1_en": "For his parents' fiftieth wedding anniversary, David decided to <span class=\"hl-teal\">pull out all the stops</span> with a private chef, live jazz band, and vintage champagne.", "ex1_hl": "pull out all the stops", "ex1_th": "สำหรับงานฉลองครบรอบแต่งงานปีที่ 50 ของพ่อแม่ เดวิดตัดสินใจจัดเต็มทุ่มสุดตัว ทั้งจ้างเชฟส่วนตัว วงดนตรีแจ๊สสด และแชมเปญชั้นเลิศ", "ex2_en": "Facing fierce competition from tech giants, the automotive company <span class=\"hl-teal\">pulled out all the stops</span> to launch its flagship autonomous electric vehicle ahead of schedule.", "ex2_hl": "pulled out all the stops", "ex2_th": "เมื่อเผชิญกับการแข่งขันอันดุเดือดจากบริษัทยักษ์ใหญ่ด้านเทคโนโลยี บริษัทยานยนต์จึงทุ่มสรรพกำลังทุกวิถีทางเพื่อเปิดตัวรถยนต์ไฟฟ้าไร้คนขับรุ่นเรือธงให้ได้ก่อนกำหนดการเดิม", "slot_num": 801, "sheet_no": 9, "first_letter": "P"}, {"id": 560, "orig_slot": "#803", "idiom": "Put two and two together", "meaning": "Understand what is obvious.", "thai_idiom": "ปะติดปะต่อเรื่องราว / คิดเชื่อมโยงจนเข้าใจ / จับต้นชนปลายถูก", "thai_meaning": "ปะติดปะต่อเบาะแสหรือข้อเท็จจริงต่างๆ เข้าด้วยกันจนเข้าใจเรื่องราวที่เกิดขึ้นได้อย่างชัดเจน", "ex1_en": "When I saw the whispered phone calls and hidden shopping bags, I <span class=\"hl-teal\">put two and two together</span> and realized they were planning a surprise party for me.", "ex1_hl": "put two and two together", "ex1_th": "พอเห็นการแอบกระซิบกระซาบคุยโทรศัพท์กับถุงช้อปปิ้งที่ซ่อนไว้ ฉันก็ปะติดปะต่อเรื่องราวได้ทันทีว่าพวกเขากำลังวางแผนจัดงานปาร์ตี้เซอร์ไพรส์ฉันอยู่", "ex2_en": "By analyzing the sudden spike in unallocated transactions alongside unauthorized employee logins, forensic accountants quickly <span class=\"hl-teal\">put two and two together</span> to uncover the fraud.", "ex2_hl": "put two and two together", "ex2_th": "ด้วยการวิเคราะห์ยอดธุรกรรมผิดปกติที่พุ่งขึ้นพร้อมกับการล็อกอินเข้าระบบโดยไม่ได้รับอนุญาตของพนักงาน ผู้ตรวจสอบบัญชีนิติวิทยาศาสตร์จึงปะติดปะต่อข้อมูลได้อย่างรวดเร็วและเปิดโปงการทุจริตได้สำเร็จ", "slot_num": 803, "sheet_no": 9, "first_letter": "P"}, {"id": 561, "orig_slot": "#804", "idiom": "Put up or shut up", "meaning": "Either agree to do it or stop talking.", "thai_idiom": "ไม่แน่จริงก็อย่าพูดมาก / แน่จริงก็ทำเลย อย่าเอาแต่ปากดี / ดีแต่พูดก็เงียบไป", "thai_meaning": "ลงมือทำให้เห็นเป็นรูปธรรมเพื่อพิสูจน์คำพูด ไม่อย่างนั้นก็ควรหยุดพูดหรือหยุดบ่นได้แล้ว", "ex1_en": "\"You've been boasting all month that you could easily beat my marathon time, so it's time to <span class=\"hl-teal\">put up or shut up</span> at tomorrow's race.\"", "ex1_hl": "put up or shut up", "ex1_th": "\"เธอโม้มาทั้งเดือนแล้วว่าจะทำเวลาวิ่งมาราธอนชนะฉันได้สบายๆ พรุ่งนี้ในวันแข่งก็ถึงเวลาลงมือทำให้เห็น อย่าเอาแต่ปากดีแล้วกัน\"", "ex2_en": "Frustrated by the venture capital syndicate's endless demands for revisions, the biotech founder challenged the lead investor to <span class=\"hl-teal\">put up or shut up</span> on the term sheet.", "ex2_hl": "put up or shut up", "ex2_th": "ด้วยความหงุดหงิดที่กลุ่มกองทุนร่วมทุนเรียกร้องให้ปรับแก้แผนไม่สิ้นสุด ผู้ก่อตั้งบริษัทไบโอเทคจึงท้าทายให้นักลงทุนรายใหญ่ตัดสินใจลงเงินตามข้อตกลงหรือไม่อย่างนั้นก็หยุดพูดเสียที", "slot_num": 804, "sheet_no": 9, "first_letter": "P"}, {"id": 562, "orig_slot": "#805", "idiom": "Put water into wine", "meaning": "Make a bad situation seem better.", "thai_idiom": "เพลาๆ ความเข้มงวดลง / ประนีประนอม / ถอยคนละก้าว", "thai_meaning": "ลดท่าทีแข็งกร้าว ลดข้อเรียกร้อง หรือประนีประนอมเพื่อคลี่คลายสถานการณ์ให้ราบรื่นขึ้น", "ex1_en": "After arguing about holiday plans for an hour, Liam decided to <span class=\"hl-teal\">put water into wine</span> and agree to visit his in-laws for the weekend.", "ex1_hl": "put water into wine", "ex1_th": "หลังจากโต้เถียงกันเรื่องแผนวันหยุดมาเป็นชั่วโมง เลียมก็ตัดสินใจยอมถอยก้าวหนึ่งและตกลงที่จะไปเยี่ยมพ่อตาแม่ยายในช่วงสุดสัปดาห์", "ex2_en": "To avert a costly national strike, the union leadership agreed to <span class=\"hl-teal\">put water into wine</span> during collective bargaining talks.", "ex2_hl": "put water into wine", "ex2_th": "เพื่อหลีกเลี่ยงการนัดหยุดงานประท้วงทั่วประเทศที่จะสร้างความเสียหายมหาศาล แกนนำสหภาพแรงงานจึงยอมลดข้อเรียกร้องที่แข็งกร้าวลงระหว่างการเจรจาต่อรองร่วม", "slot_num": 805, "sheet_no": 9, "first_letter": "P"}, {"id": 563, "orig_slot": "#806", "idiom": "Quite a handful", "meaning": "Difficult to manage.", "thai_idiom": "รับมือยาก / เอาเรื่อง / แสบใช่เล่น / ซนจนเอาไม่อยู่", "thai_meaning": "ดูแลหรือรับมือได้ยาก มักใช้กับเด็กที่ซนมาก สัตว์เลี้ยงที่คุมยาก หรือคนที่ดื้อรั้น", "ex1_en": "Babysitting the four-year-old twins turned out to be <span class=\"hl-teal\">quite a handful</span> because they kept running in opposite directions.", "ex1_hl": "quite a handful", "ex1_th": "การรับจ้างเลี้ยงฝาแฝดวัยสี่ขวบกลายเป็นเรื่องที่รับมือยากเอาเรื่อง เพราะเด็กๆ เอาแต่วิ่งไปคนละทิศคนละทาง", "ex2_en": "Managing the brilliant but notoriously temperamental lead software architect was <span class=\"hl-teal\">quite a handful</span> for the new engineering director.", "ex2_hl": "quite a handful", "ex2_th": "การบริหารจัดการหัวหน้านักออกแบบสถาปัตยกรรมซอฟต์แวร์ที่เฉลียวฉลาดแต่เจ้าอารมณ์เป็นที่เลื่องลือ ถือเป็นงานที่รับมือยากไม่น้อยสำหรับผู้อำนวยการฝ่ายวิศวกรรมคนใหม่", "slot_num": 806, "sheet_no": 9, "first_letter": "Q"}, {"id": 564, "orig_slot": "#807", "idiom": "Raise the bar", "meaning": "Set a higher standard.", "thai_idiom": "ยกระดับมาตรฐาน / ตั้งมาตรฐานให้สูงขึ้น", "thai_meaning": "กำหนดเกณฑ์หรือยกระดับมาตรฐานและคุณภาพให้สูงขึ้นกว่าเดิม", "ex1_en": "By baking an exquisite three-tier chocolate mousse cake for the potluck, Chloe really <span class=\"hl-teal\">raised the bar</span> for the rest of us.", "ex1_hl": "raised the bar", "ex1_th": "การที่โคลอี้อบเค้กช็อกโกแลตมูสสามชั้นสุดประณีตมาร่วมงานเลี้ยงรุ่น ถือว่าเป็นการยกระดับมาตรฐานจนเพื่อนๆ คนอื่นเทียบไม่ติดเลย", "ex2_en": "The competitor's release of an ultralight carbon-fiber laptop has <span class=\"hl-teal\">raised the bar</span> for industrial design across the consumer electronics sector.", "ex2_hl": "raised the bar", "ex2_th": "การที่คู่แข่งเปิดตัวแล็ปท็อปคาร์บอนไฟเบอร์น้ำหนักเบาพิเศษได้ยกระดับมาตรฐานการออกแบบเชิงอุตสาหกรรมในภาคธุรกิจอุปกรณ์อิเล็กทรอนิกส์สำหรับผู้บริโภคขึ้นไปอีกขั้น", "slot_num": 807, "sheet_no": 9, "first_letter": "R"}, {"id": 565, "orig_slot": "#808", "idiom": "Reach the end of one's rope", "meaning": "Be at the end of patience.", "thai_idiom": "หมดความอดทน / จนตรอก / ความอดทนถึงขีดสุด", "thai_meaning": "หมดความอดทนหรือหมดหนทางที่จะรับมือกับปัญหาและความยากลำบากต่อไปได้อีก", "ex1_en": "After spending three sleepless nights trying to soothe her teething infant, Nora felt she had finally <span class=\"hl-teal\">reached the end of her rope</span>.", "ex1_hl": "reached the end of her rope", "ex1_th": "หลังจากอดนอนมาสามคืนติดเพื่อปลอบลูกน้อยที่ร้องงอแงเพราะฟันกำลังขึ้น นอร่าก็รู้สึกว่าความอดทนของเธอมาถึงขีดสุดแล้วจริงๆ", "ex2_en": "Small retailers <span class=\"hl-teal\">reached the end of their rope</span> after months of skyrocketing commercial rents and plummeting foot traffic.", "ex2_hl": "reached the end of their rope", "ex2_th": "ผู้ค้ารายย่อยต่างหมดหนทางและถึงขีดสุดของความอดทน หลังจากต้องทนแบกรับค่าเช่าพื้นที่เชิงพาณิชย์ที่พุ่งสูงขึ้นเป็นเวลาหลายเดือนท่ามกลางจำนวนลูกค้าที่ลดฮวบลง", "slot_num": 808, "sheet_no": 9, "first_letter": "R"}, {"id": 566, "orig_slot": "#810", "idiom": "Ride out the storm", "meaning": "Get through a difficult time.", "thai_idiom": "ฝ่าฟันมรสุม / ผ่านพ้นวิกฤต / สู้ทนจนรอดพ้นอุปสรรค", "thai_meaning": "อดทนและประคับประคองตัวให้รอดพ้นจากช่วงเวลาที่ยากลำบากหรือสถานการณ์วิกฤต", "ex1_en": "When my roommate and I both lost our freelance gigs, we cut our grocery bills to the bone to <span class=\"hl-teal\">ride out the storm</span>.", "ex1_hl": "ride out the storm", "ex1_th": "ตอนที่ทั้งฉันและรูมเมตตกงานฟรีแลนซ์พร้อมกัน พวกเราต้องรัดเข็มขัดลดค่าใช้จ่ายเรื่องอาหารลงให้มากที่สุดเพื่อฝ่ามรสุมชีวิตครั้งนี้ไปให้ได้", "ex2_en": "With substantial cash reserves, the boutique investment bank managed to <span class=\"hl-teal\">ride out the storm</span> during the global credit contraction.", "ex2_hl": "ride out the storm", "ex2_th": "ด้วยเงินสดสำรองที่มีอยู่อย่างมหาศาล ธนาคารเพื่อการลงทุนแห่งนี้จึงสามารถประคับประคองตัวจนผ่านพ้นวิกฤตการณ์สินเชื่อทั่วโลกที่หดตัวได้อย่างปลอดภัย", "slot_num": 810, "sheet_no": 9, "first_letter": "R"}, {"id": 567, "orig_slot": "#811", "idiom": "Ring true", "meaning": "Seem to be true and genuine.", "thai_idiom": "ฟังดูสมจริง / ฟังดูน่าเชื่อถือ / สัมผัสได้ถึงความจริงใจ", "thai_meaning": "ฟังดูมีเหตุผล ฟังดูเป็นความจริง หรือสะท้อนความจริงใจอย่างน่าเชื่อถือ", "ex1_en": "His apology didn't quite <span class=\"hl-teal\">ring true</span> because he smirked while mumbling that he was sorry.", "ex1_hl": "ring true", "ex1_th": "คำขอโทษของเขาฟังดูไม่ค่อยจริงใจเท่าไร เพราะเขายังแอบยิ้มเยาะอยู่ตอนพึมพำคำว่าขอโทษ", "ex2_en": "The whistleblower's testimony about falsified emissions data <span class=\"hl-teal\">rang true</span> with investigators because it matched intercepted internal memos.", "ex2_hl": "rang true", "ex2_th": "คำให้การของผู้เปิดโปงเรื่องการปลอมแปลงข้อมูลการปล่อยมลพิษฟังดูมีน้ำหนักและน่าเชื่อถือสำหรับคณะผู้สืบสวน เนื่องจากตรงกับบันทึกข้อความภายในที่ดักจับได้", "slot_num": 811, "sheet_no": 9, "first_letter": "R"}, {"id": 568, "orig_slot": "#812", "idiom": "Running out of steam", "meaning": "Becoming tired or losing energy.", "thai_idiom": "หมดแรง / แผ่วปลาย / หมดไฟ / หมดพลัง", "thai_meaning": "สูญเสียพละกำลัง ความกระตือรือร้น หรือแรงผลักดันจนเริ่มเฉื่อยชาหรือแผ่วลง", "ex1_en": "After hiking uphill for five continuous hours, the scout troop was clearly <span class=\"hl-teal\">running out of steam</span>.", "ex1_hl": "running out of steam", "ex1_th": "หลังจากเดินป่าขึ้นเขาติดต่อกันนานถึงห้าชั่วโมง กองลูกเสือก็เริ่มหมดแรงและอ่อนล้าอย่างเห็นได้ชัด", "ex2_en": "Economic analysts warned that the post-pandemic retail rally was <span class=\"hl-teal\">running out of steam</span> due to persistent household debt.", "ex2_hl": "running out of steam", "ex2_th": "นักวิเคราะห์เศรษฐกิจเตือนว่าการฟื้นตัวของธุรกิจค้าปลีกหลังยุคโรคระบาดกำลังเริ่มแผ่วปลายลง เนื่องจากปัญหาหนี้สินครัวเรือนที่ยังคงเรื้อรัง", "slot_num": 812, "sheet_no": 9, "first_letter": "R"}, {"id": 569, "orig_slot": "#814", "idiom": "Say it like it is", "meaning": "Speak the truth clearly.", "thai_idiom": "พูดตรงไปตรงมา / พูดตามเนื้อผ้า / ขวานผ่าซาก / ไม่อ้อมค้อม", "thai_meaning": "พูดความจริงอย่างตรงไปตรงมา ชัดเจน ไม่ปิดบังหรือเสแสร้ง", "ex1_en": "I appreciate talking with Maya because she always <span class=\"hl-teal\">says it like it is</span>, even when the truth is difficult to swallow.", "ex1_hl": "says it like it is", "ex1_th": "ฉันชอบคุยกับมายาเพราะเธอเป็นคนพูดตรงไปตรงมาตามเนื้อผ้าเสมอ แม้ว่าความจริงนั้นจะยากที่จะยอมรับก็ตาม", "ex2_en": "The investigative journalist earned national respect because she was unafraid to <span class=\"hl-teal\">say it like it is</span> regarding public corruption.", "ex2_hl": "say it like it is", "ex2_th": "นักข่าวสายสืบสวนได้รับความเคารพยกย่องในระดับประเทศ เพราะเธอไม่เคยหวาดกลัวที่จะนำเสนอความจริงอย่างตรงไปตรงมาเกี่ยวกับการทุจริตในภาครัฐ", "slot_num": 814, "sheet_no": 9, "first_letter": "S"}, {"id": 570, "orig_slot": "#815", "idiom": "See through someone", "meaning": "Understand someone's true nature.", "thai_idiom": "มองทะลุปรุโปร่ง / อ่านทางออก / ดูออกว่าเสแสร้ง", "thai_meaning": "มองเห็นเจตนาที่แท้จริงหรือรู้ทันความหลอกลวงของใครบางคนอย่างทะลุปรุโปร่ง", "ex1_en": "He pretended to be charming and generous, but Grandma instantly <span class=\"hl-teal\">saw through him</span> and warned me not to lend him any money.", "ex1_hl": "saw through him", "ex1_th": "เขาแสร้งทำเป็นคนมีเสน่ห์และใจกว้าง แต่คุณยายมองทะลุปรุโปร่งทันทีและเตือนฉันว่าอย่าให้เขายืมเงินเด็ดขาด", "ex2_en": "Venture capitalists quickly <span class=\"hl-teal\">saw through the founder</span> when his flashy presentation failed to support actual customer retention numbers.", "ex2_hl": "saw through the founder", "ex2_th": "เหล่านักลงทุนร่วมทุนมองทะลุตัวตนของผู้ก่อตั้งได้อย่างรวดเร็ว เมื่อการนำเสนอที่ดูหรูหราไม่สามารถสนับสนุนด้วยตัวเลขอัตราการรักษาฐานลูกค้าที่แท้จริงได้", "slot_num": 815, "sheet_no": 9, "first_letter": "S"}, {"id": 571, "orig_slot": "#817", "idiom": "Sell like hot cakes", "meaning": "Sell very quickly.", "thai_idiom": "ขายดีเป็นเทน้ำเทท่า / ขายดิบขายดีเป็นประวัติการณ์", "thai_meaning": "ขายดีมาก ขายหมดอย่างรวดเร็วและเป็นจำนวนมาก", "ex1_en": "The homemade strawberry pastries at the farmers' market <span class=\"hl-teal\">sold like hot cakes</span> and were completely sold out before noon.", "ex1_hl": "sold like hot cakes", "ex1_th": "ขนมอบสตรอว์เบอร์รีโฮมเมดที่ตลาดนัดเกษตรกรขายดีเป็นเทน้ำเทท่าจนเกลี้ยงแผงตั้งแต่ก่อนเที่ยงวัน", "ex2_en": "The newly unveiled flagship smartphone <span class=\"hl-teal\">sold like hot cakes</span> across Asia, shattering opening-weekend pre-order records.", "ex2_hl": "sold like hot cakes", "ex2_th": "สมาร์ตโฟนเรือธงรุ่นเปิดตัวใหม่ขายดีเป็นเทน้ำเทท่าทั่วภูมิภาคเอเชีย จนทำลายสถิติยอดสั่งจองล่วงหน้าในช่วงสุดสัปดาห์แรกอย่างราบคาบ", "slot_num": 817, "sheet_no": 9, "first_letter": "S"}, {"id": 572, "orig_slot": "#818", "idiom": "Set the stage", "meaning": "Prepare for something.", "thai_idiom": "ปูทาง / กรุยทาง / สร้างบรรยากาศเตรียมพร้อม", "thai_meaning": "เตรียมความพร้อมหรือสร้างเงื่อนไขและสภาวะแวดล้อมที่เอื้อให้สิ่งหนึ่งเกิดขึ้นต่อไป", "ex1_en": "Lighting scented candles and putting on acoustic music helped <span class=\"hl-teal\">set the stage</span> for a relaxing anniversary dinner at home.", "ex1_hl": "set the stage", "ex1_th": "การจุดเทียนหอมและเปิดเพลงบรรเลงอะคูสติกเบาๆ ช่วยสร้างบรรยากาศปูทางให้กับดินเนอร์วันครบรอบอันแสนอบอุ่นที่บ้าน", "ex2_en": "The bilateral trade summit successfully <span class=\"hl-teal\">set the stage</span> for a landmark cross-border tariff reduction treaty next year.", "ex2_hl": "set the stage", "ex2_th": "การประชุมสุดยอดทางการค้าระดับทวิภาคีได้ปูทางไปสู่สนธิสัญญาลดภาษีศุลกากรข้ามพรมแดนครั้งประวัติศาสตร์ในปีหน้าได้อย่างงดงาม", "slot_num": 818, "sheet_no": 9, "first_letter": "S"}, {"id": 573, "orig_slot": "#819", "idiom": "Settle down", "meaning": "Become calm or start a family.", "thai_idiom": "ลงหลักปักฐาน / สงบสติอารมณ์ / เข้าที่เข้าทาง", "thai_meaning": "สร้างครอบครัวและใช้ชีวิตอย่างมั่นคงเป็นหลักแหล่ง หรือสงบลงและเข้าสู่ภาวะปกติ", "ex1_en": "After backpacking across Europe and South America for three adventurous years, Julian decided it was time to <span class=\"hl-teal\">settle down</span> and buy a suburban home.", "ex1_hl": "settle down", "ex1_th": "หลังจากแบกเป้ท่องเที่ยวผจญภัยทั่วยุโรปและอเมริกาใต้มานานถึงสามปี จูเลียนก็ตัดสินใจว่าถึงเวลาลงหลักปักฐานและซื้อบ้านสักหลังในแถบชานเมือง", "ex2_en": "The committee chairman tapped his gavel firmly until the agitated assembly members began to <span class=\"hl-teal\">settle down</span>.", "ex2_hl": "settle down", "ex2_th": "ประธานคณะกรรมการเคาะค้อนไม้อย่างหนักแน่นจนกระทั่งสมาชิกที่กำลังโต้เถียงกันอย่างดุเดือดในที่ประชุมเริ่มสงบลง", "slot_num": 819, "sheet_no": 9, "first_letter": "S"}, {"id": 574, "orig_slot": "#820", "idiom": "Shake a leg", "meaning": "Hurry up!", "thai_idiom": "รีบกระฉับกระเฉงหน่อย / เร่งมือเข้า / ขยับแข้งขยับขา", "thai_meaning": "รีบหน่อย เร่งมือเข้า หรือลุกขึ้นมาขยับตัวทำอะไรได้แล้ว", "ex1_en": "\"Come on, kids, <span class=\"hl-teal\">shake a leg</span> or we're going to miss the school bus!\" Dad shouted from the hallway.", "ex1_hl": "shake a leg", "ex1_th": "\"เร็วเข้าเด็กๆ ขยับแข้งขยับขาหน่อย ไม่อย่างนั้นเราจะตกรถโรงเรียนกันหมดนะ!\" พ่อตะโกนบอกจากทางเดินหน้าห้อง", "ex2_en": "With the keynote speaker arriving in twenty minutes, the stage director told the technical crew to <span class=\"hl-teal\">shake a leg</span> and finish testing the audio monitors.", "ex2_hl": "shake a leg", "ex2_th": "เนื่องจากวิทยากรหลักจะเดินทางมาถึงภายในยี่สิบนาที ผู้กำกับเวทีจึงสั่งให้ทีมเทคนิคเร่งมือและรีบทดสอบมอนิเตอร์เสียงให้เสร็จสิ้นทันที", "slot_num": 820, "sheet_no": 9, "first_letter": "S"}, {"id": 575, "orig_slot": "#821", "idiom": "Shoot yourself in the foot", "meaning": "Do something that harms yourself.", "thai_idiom": "แกว่งเท้าหาเสี้ยน / ขว้างงูไม่พ้นคอ / ทำร้ายตัวเองโดยไม่รู้ตัว / ฆ่าตัวตายทางการงาน", "thai_meaning": "กระทำการที่ส่งผลร้ายหรือสร้างความเสียหายต่อตนเองโดยไม่ตั้งใจเพราะความประมาทหรือความโง่เขลา", "ex1_en": "By insulting his interviewer during the casual introductory chat, Kevin really <span class=\"hl-teal\">shot himself in the foot</span>.", "ex1_hl": "shot himself in the foot", "ex1_th": "การที่เควินเผลอพูดจาเหน็บแนมผู้สัมภาษณ์ระหว่างการพูดคุยแนะนำตัวแบบสบายๆ ถือว่าเป็นการทำร้ายตัวเองและตัดโอกาสของตัวเองแท้ๆ", "ex2_en": "The airline <span class=\"hl-teal\">shot itself in the foot</span> by introducing exorbitant hidden baggage fees right as competitors eliminated them.", "ex2_hl": "shot itself in the foot", "ex2_th": "สายการบินทำร้ายตัวเองอย่างไม่น่าให้อภัยด้วยการคิดค่าธรรมเนียมสัมภาระแอบแฝงในราคาสูงลิ่ว ในช่วงเวลาเดียวกับที่สายการบินคู่แข่งพากันยกเลิกค่าธรรมเนียมดังกล่าว", "slot_num": 821, "sheet_no": 9, "first_letter": "S"}, {"id": 576, "orig_slot": "#823", "idiom": "Side by side", "meaning": "Together; in partnership.", "thai_idiom": "เคียงบ่าเคียงไหล่ / ร่วมมือร่วมใจกัน", "thai_meaning": "อยู่เคียงข้างกัน หรือร่วมมือทำงานร่วมกันอย่างใกล้ชิดและเสมอภาค", "ex1_en": "After working <span class=\"hl-teal\">side by side</span> in the community garden all morning, the volunteers shared freshly brewed iced tea.", "ex1_hl": "side by side", "ex1_th": "หลังจากช่วยกันพรวนดินในสวนชุมชนเคียงบ่าเคียงไหล่มาตลอดทั้งช่วงเช้า เหล่าอาสาสมัครก็นั่งพักดื่มชาเย็นสดชื่นด้วยกัน", "ex2_en": "International epidemiological agencies worked <span class=\"hl-teal\">side by side</span> with local healthcare providers to halt the outbreak in rural provinces.", "ex2_hl": "side by side", "ex2_th": "หน่วยงานด้านระบาดวิทยาระดับนานาชาติได้ร่วมมือเคียงบ่าเคียงไหล่กับบุคลากรทางการแพทย์ในท้องถิ่นเพื่อยับยั้งการแพร่ระบาดของโรคในจังหวัดห่างไกล", "slot_num": 823, "sheet_no": 9, "first_letter": "S"}, {"id": 577, "orig_slot": "#824", "idiom": "Silver spoon", "meaning": "Born into a wealthy family.", "thai_idiom": "คาบช้อนเงินช้อนทองมาเกิด", "thai_meaning": "เกิดมาในครอบครัวที่ร่ำรวย มั่งคั่ง และเพียบพร้อมด้วยอภิสิทธิ์", "ex1_en": "He never had to worry about rent or college tuition because he was born with a <span class=\"hl-teal\">silver spoon</span> in his mouth.", "ex1_hl": "silver spoon", "ex1_th": "เขาไม่เคยต้องกังวลเรื่องค่าเช่าห้องหรือค่าเทอมมหาวิทยาลัยเลย เพราะเกิดมาคาบช้อนเงินช้อนทอง", "ex2_en": "Despite his <span class=\"hl-teal\">silver spoon</span> background, the young executive worked grueling hours on the factory floor to earn the respect of his crew.", "ex2_hl": "silver spoon", "ex2_th": "แม้จะมีพื้นเพมาจากตระกูลมหาเศรษฐี ผู้บริหารหนุ่มกลับยอมทำงานหนักในฝ่ายผลิตเพื่อพิสูจน์ตัวเองและเอาชนะใจทีมงาน", "slot_num": 824, "sheet_no": 9, "first_letter": "S"}, {"id": 578, "orig_slot": "#825", "idiom": "Since time immemorial", "meaning": "For a very long time.", "thai_idiom": "ตั้งแต่ดึกดำบรรพ์ / ช้านานนับแต่โบราณกาล", "thai_meaning": "มีมาเนิ่นนานจนจำความไม่ได้ หรือสืบทอดกันมายาวนานนับแต่โบราณ", "ex1_en": "Villagers have gathered around this communal hearth to share folk tales <span class=\"hl-teal\">since time immemorial</span>.", "ex1_hl": "since time immemorial", "ex1_th": "ชาวบ้านมารวมตัวกันรอบเตาผิงส่วนก
