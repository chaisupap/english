ตรฐานที่สูงลิ่วให้คู่แข่งต้องพยายามตามให้ทัน", "slot_num": 372, "sheet_no": 4, "first_letter": "S"}, {"id": 301, "orig_slot": "#373", "idiom": "Shoot from the hip", "meaning": "Speak or act without thinking.", "thai_idiom": "พูดโพล่งออกมา / ทำอะไรแบบไม่ยั้งคิด / พูดขวานผ่าซากไม่คิดหน้าคิดหลัง", "thai_meaning": "พูดหรือตัดสินใจอย่างรวดเร็วโดยไม่ไตร่ตรองให้รอบคอบ มักส่งผลให้เกิดความผิดพลาดหรือกระทบกระเทือนผู้อื่น", "ex1_en": "You shouldn't <span class=\"hl-teal\">shoot from the hip</span> during arguments with your spouse; take a deep breath before reacting.", "ex1_hl": "shoot from the hip", "ex1_th": "เวลาทะเลาะกับคู่ชีวิตเธอไม่ควรพูดโพล่งออกไปแบบไม่ยั้งคิดนะ ควรหายใจเข้าลึกๆ ก่อนที่จะตอบโต้อะไรออกไป", "ex2_en": "The spokesperson was criticized for <span class=\"hl-teal\">shooting from the hip</span> instead of adhering to the verified facts prepared by the legal team.", "ex2_hl": "shooting from the hip", "ex2_th": "โฆษกถูกวิพากษ์วิจารณ์อย่างหนักจากการพูดโพล่งออกไปโดยไม่ไตร่ตรอง แทนที่จะยึดข้อเท็จจริงที่ทีมกฎหมายได้ตรวจสอบมาแล้วอย่างถี่ถ้วน", "slot_num": 373, "sheet_no": 4, "first_letter": "S"}, {"id": 302, "orig_slot": "#374", "idiom": "Show your true colors", "meaning": "Reveal your real personality.", "thai_idiom": "เผยธาตุแท้ / เผยหางโผล่ / แสดงตัวตนที่แท้จริง", "thai_meaning": "เปิดเผยนิสัยใจคอหรือตัวตนที่แท้จริงออกมา มักจะใช้ในแง่ลบเมื่อเห็นพฤติกรรมที่ไม่ดีซึ่งซ่อนไว้", "ex1_en": "He seemed charming at first, but he <span class=\"hl-teal\">showed his true colors</span> when he started yelling at the waiter over a tiny mistake.", "ex1_hl": "showed his true colors", "ex1_th": "ตอนแรกเขาดูเป็นคนมีเสน่ห์มาก แต่พอเขาเริ่มตะคอกใส่พนักงานเสิร์ฟเพราะความผิดพลาดเล็กๆ น้อยๆ เขาก็เผยธาตุแท้ออกมาให้เห็น", "ex2_en": "Under the pressure of an impending audit, the corrupt finance officer finally <span class=\"hl-teal\">showed his true colors</span> by attempting to destroy ledger files.", "ex2_hl": "showed his true colors", "ex2_th": "ภายใต้แรงกดดันจากการตรวจสอบบัญชีที่กำลังจะมาถึง เจ้าหน้าที่การเงินผู้ทุจริตก็ได้เผยธาตุแท้ออกมาในที่สุดโดยพยายามทำลายไฟล์บัญชีแยกประเภท", "slot_num": 374, "sheet_no": 4, "first_letter": "S"}, {"id": 303, "orig_slot": "#375", "idiom": "Sick and tired of", "meaning": "Very annoyed by something.", "thai_idiom": "เบื่อหน่ายเต็มทน / เอือมระอา / ทนไม่ไหวแล้วกับ...", "thai_meaning": "รู้สึกรำคาญ เหนื่อยหน่าย หรือเอือมระอากับเรื่องใดเรื่องหนึ่งจนทนต่อไปไม่ไหว", "ex1_en": "I am <span class=\"hl-teal\">sick and tired of</span> cleaning up dirty dishes that my roommates leave in the sink overnight.", "ex1_hl": "sick and tired of", "ex1_th": "ฉันเบื่อหน่ายเต็มทนกับการต้องมาคอยล้างจานชามสกปรกที่เพื่อนร่วมห้องทิ้งแช่ไว้ในอ่างข้ามคืน", "ex2_en": "Commuters have grown <span class=\"hl-teal\">sick and tired of</span> the recurring signal failures that disrupt the suburban rail network every morning.", "ex2_hl": "sick and tired of", "ex2_th": "ผู้โดยสารที่เดินทางประจำต่างเอือมระอาเต็มทีกับปัญหาระบบสัญญาณขัดข้องซ้ำซากที่ทำให้การเดินรถไฟชานเมืองหยุดชะงักเกือบทุกเช้า", "slot_num": 375, "sheet_no": 4, "first_letter": "S"}, {"id": 304, "orig_slot": "#376", "idiom": "Sit on the fence", "meaning": "Avoid taking sides.", "thai_idiom": "เหยียบเรือสองแคม / แทงกั๊ก / วางตัวเป็นกลางไม่ยอมเลือกข้าง", "thai_meaning": "หลีกเลี่ยงการเลือกข้างหรือการตัดสินใจที่ชัดเจน ยังคงสงวนท่าทีโดยไม่สนับสนุนฝ่ายใดฝ่ายหนึ่ง", "ex1_en": "You can't just <span class=\"hl-teal\">sit on the fence</span>; tell us whether you want Italian food or Thai food for dinner tonight.", "ex1_hl": "sit on the fence", "ex1_th": "เธอจะมาทำเป็นแทงกั๊กไม่เลือกไม่ได้นะ บอกมาเลยดีกว่าว่าเย็นนี้อยากกินอาหารอิตาลีหรืออาหารไทย", "ex2_en": "With public pressure mounting, politicians can no longer afford to <span class=\"hl-teal\">sit on the fence</span> regarding strict environmental regulations.", "ex2_hl": "sit on the fence", "ex2_th": "เมื่อกระแสกดดันจากสังคมทวีความรุนแรงขึ้น เหล่านักการเมืองจึงไม่อาจวางตัวเป็นกลางหรือแทงกั๊กเรื่องกฎระเบียบด้านสิ่งแวดล้อมที่เข้มงวดได้อีกต่อไป", "slot_num": 376, "sheet_no": 4, "first_letter": "S"}, {"id": 305, "orig_slot": "#377", "idiom": "Skate on thin ice", "meaning": "Do something risky.", "thai_idiom": "เดินบนเส้นด้าย / เล่นกับไฟ / เสี่ยงอันตราย", "thai_meaning": "ทำสิ่งที่สุ่มเสี่ยง ตกอยู่ในสถานการณ์ที่อันตรายหรือล่อแหลมต่อการทำผิดพลาดและการถูกลงโทษ", "ex1_en": "You're <span class=\"hl-teal\">skating on thin ice</span> by coming home two hours past curfew on a school night.", "ex1_hl": "skating on thin ice", "ex1_th": "การที่เธอกลับบ้านดึกเกินเวลาเคอร์ฟิวไปตั้งสองชั่วโมงในคืนวันที่มีเรียน ถือว่าเธอกำลังเล่นกับไฟและเสี่ยงโดนลงโทษมากนะ", "ex2_en": "The regional manager was <span class=\"hl-teal\">skating on thin ice</span> after repeatedly authorizing expenditures without prior approval from corporate headquarters.", "ex2_hl": "skating on thin ice", "ex2_th": "ผู้จัดการภูมิภาคกำลังเดินอยู่บนเส้นด้ายที่สุ่มเสี่ยงอย่างยิ่ง หลังจากอนุมัติงบค่าใช้จ่ายหลายครั้งโดยไม่ผ่านความเห็นชอบล่วงหน้าจากสำนักงานใหญ่", "slot_num": 377, "sheet_no": 4, "first_letter": "S"}, {"id": 306, "orig_slot": "#379", "idiom": "Spare no expense", "meaning": "Spend as much as needed.", "thai_idiom": "ทุ่มไม่อั้น / ไม่เสียดายเงิน / จ่ายไม่อั้น", "thai_meaning": "ยอมจ่ายเงินจำนวนมากโดยไม่เสียดาย เพื่อให้ได้สิ่งที่ดีที่สุดหรือสมบูรณ์แบบที่สุด", "ex1_en": "For their silver wedding anniversary, Michael <span class=\"hl-teal\">spared no expense</span> and booked a private luxury villa in Santorini.", "ex1_hl": "spared no expense", "ex1_th": "สำหรับวันครบรอบแต่งงาน 25 ปี ไมเคิลทุ่มไม่อั้นด้วยการจองวิลล่าหรูส่วนตัวที่ซานโตรินี", "ex2_en": "The biotechnology firm <span class=\"hl-teal\">spared no expense</span> in equipping its new vaccine development laboratory with top-tier centrifuges.", "ex2_hl": "spared no expense", "ex2_th": "บริษัทเทคโนโลยีชีวภาพทุ่มงบไม่อั้นในการจัดซื้อเครื่องหมุนเหวี่ยงตกตะกอนระดับท็อปสำหรับห้องปฏิบัติการพัฒนาวัคซีนแห่งใหม่", "slot_num": 379, "sheet_no": 4, "first_letter": "S"}, {"id": 307, "orig_slot": "#380", "idiom": "Stand in someone's shoes", "meaning": "Understand someone's feelings.", "thai_idiom": "เอาใจเขามาใส่ใจเรา / สวมวิญญาณคนอื่น / มองในมุมของคนอื่น", "thai_meaning": "ทำความเข้าใจมุมมอง ความรู้สึก หรือสถานการณ์ที่ผู้อื่นกำลังเผชิญอยู่โดยมองจากตำแหน่งของเขา", "ex1_en": "Before you criticize your brother for feeling overwhelmed, try to <span class=\"hl-teal\">stand in his shoes</span> for a week.", "ex1_hl": "stand in his shoes", "ex1_th": "ก่อนที่เธอจะไปต่อว่าพี่ชายว่าทำไมถึงเครียดขนาดนั้น ลองเอาใจเขามาใส่ใจเราและนึกถึงสิ่งที่เขาต้องเจอสักสัปดาห์ดูสิ", "ex2_en": "Effective human resource mediators must be able to <span class=\"hl-teal\">stand in employees' shoes</span> while balancing the company's compliance policies.", "ex2_hl": "stand in employees' shoes", "ex2_th": "ผู้ไกล่เกลี่ยฝ่ายทรัพยากรบุคคลที่มีประสิทธิภาพจำเป็นต้องสามารถมองในมุมของพนักงานได้ พร้อมๆ กับการรักษากฎระเบียบนโยบายของบริษัทอย่างสมดุล", "slot_num": 380, "sheet_no": 4, "first_letter": "S"}, {"id": 308, "orig_slot": "#381", "idiom": "Step up to the plate", "meaning": "Accept a challenge.", "thai_idiom": "ก้าวออกมารับหน้าที่ / อาสารับบทบาทท้าทาย / แสดงความรับผิดชอบ", "thai_meaning": "กล้าที่จะก้าวขึ้นมารับผิดชอบ จัดการกับสถานการณ์ยากลำบาก หรือเผชิญหน้ากับความท้าทาย", "ex1_en": "When our volunteer coordinator caught the flu, Sarah <span class=\"hl-teal\">stepped up to the plate</span> and organized the community food drive herself.", "ex1_hl": "stepped up to the plate", "ex1_th": "เมื่อผู้ประสานงานอาสาสมัครป่วยเป็นไข้หวัด ซาร่าห์ก็ก้าวออกมารับหน้าที่จัดการกิจกรรมรับบริจาคอาหารของชุมชนด้วยตัวเอง", "ex2_en": "In times of market volatility, senior leadership expects departmental directors to <span class=\"hl-teal\">step up to the plate</span> and deliver decisive results.", "ex2_hl": "step up to the plate", "ex2_th": "ในช่วงเวลาที่ตลาดเกิดความผันผวน ผู้บริหารระดับสูงคาดหวังให้ผู้อำนวยการแต่ละแผนกกล้าก้าวขึ้นมารับความท้าทายและสร้างผลลัพธ์ที่เด็ดขาดชัดเจน", "slot_num": 381, "sheet_no": 4, "first_letter": "S"}, {"id": 309, "orig_slot": "#382", "idiom": "Still waters run deep", "meaning": "Calm people may have deep thoughts.", "thai_idiom": "น้ำนิ่งไหลลึก / คนเงียบมักมีความคิดลึกซึ้ง", "thai_meaning": "คนที่มีบุคลิกเงียบขรึม ไม่ค่อยพูดจา มักจะมีความคิดลึกซึ้ง มีความสามารถ หรือมีความรู้สึกที่ซ่อนอยู่ภายในมากมาย", "ex1_en": "Liam rarely speaks up during family dinners, but <span class=\"hl-teal\">still waters run deep</span>—he writes brilliantly thoughtful poetry.", "ex1_hl": "still waters run deep", "ex1_th": "เลียมแทบจะไม่ค่อยพูดอะไรเวลากินข้าวกับครอบครัว แต่น้ำนิ่งไหลลึกจริงๆ เพราะเขาแต่งบทกวีที่ลึกซึ้งและเฉียบคมได้อย่างน่าทึ่ง", "ex2_en": "Don't underestimate the quiet new analyst; as the proverb goes, <span class=\"hl-teal\">still waters run deep</span>, and she discovered the accounting flaw no one else noticed.", "ex2_hl": "still waters run deep", "ex2_th": "อย่าประเมินนักวิเคราะห์คนใหม่ที่ดูเงียบขรึมต่ำไปเชียว สำนวนที่ว่าน้ำนิ่งไหลลึกนั้นเป็นเรื่องจริง เพราะเธอคือคนที่ตรวจพบข้อผิดพลาดทางบัญชีที่ไม่มีใครสังเกตเห็นเลย", "slot_num": 382, "sheet_no": 4, "first_letter": "S"}, {"id": 310, "orig_slot": "#383", "idiom": "Take a back seat", "meaning": "Be less active; let others lead.", "thai_idiom": "ถอยไปอยู่เบื้องหลัง / ลดบทบาทลง / ปล่อยให้คนอื่นนำ", "thai_meaning": "ลดบทบาทความสำคัญของตนเองลง ปล่อยให้ผู้อื่นขึ้นมามีบทบาทนำหรือจัดการแทน", "ex1_en": "After years of organizing our annual camping trip, Uncle Dave decided to <span class=\"hl-teal\">take a back seat</span> and let the younger cousins handle the logistics.", "ex1_hl": "take a back seat", "ex1_th": "หลังจากเป็นคนจัดทริปแคมปิ้งประจำปีมาหลายปี ลุงเดฟก็ตัดสินใจถอยไปอยู่เบื้องหลัง แล้วปล่อยให้พวกลูกพี่ลูกน้องรุ่นเด็กๆ รับหน้าที่จัดการแทน", "ex2_en": "The founder stepped down as CEO to <span class=\"hl-teal\">take a back seat</span> in day-to-day operations and focus exclusively on product innovation.", "ex2_hl": "take a back seat", "ex2_th": "ผู้ก่อตั้งยอมก้าวลงจากตำแหน่งซีอีโอเพื่อลดบทบาทในการบริหารงานประจำวัน และหันไปโฟกัสที่การพัฒนานวัตกรรมผลิตภัณฑ์อย่างเต็มตัว", "slot_num": 383, "sheet_no": 4, "first_letter": "T"}, {"id": 311, "orig_slot": "#385", "idiom": "Take the cake", "meaning": "Be the best; be the most excellent.", "thai_idiom": "ยอดเยี่ยมที่สุด / ชนะเลิศ / ที่สุดแห่งที่สุด (หรือแสบสุดๆ / เกินบรรยาย)", "thai_meaning": "โดดเด่นเป็นเลิศที่สุด หรือน่าทึ่ง/เหลือเชื่อที่สุดในบรรดาสิ่งทั้งหลาย (มักใช้ในเชิงประชดประชันหรือชื่นชม)", "ex1_en": "I've heard some wild excuses for skipping practice, but claiming an alien abducted your soccer boots really <span class=\"hl-teal\">takes the cake</span>!", "ex1_hl": "takes the cake", "ex1_th": "ฉันเคยได้ยินข้ออ้างแปลกๆ ในการโดดซ้อมมาเยอะนะ แต่อ้างว่าเอเลี่ยนขโมยรองเท้าสตั๊ดไปเนี่ยนี่ถือว่าชนะเลิศและเหลือเชื่อที่สุดเลย!", "ex2_en": "Among all the innovative architectural submissions, the green rooftop pavilion design completely <span class=\"hl-teal\">took the cake</span> at the design awards.", "ex2_hl": "took the cake", "ex2_th": "ในบรรดาผลงานการออกแบบสถาปัตยกรรมสุดล้ำที่ส่งเข้าประกวด แบบพาวิลเลียนสวนลอยฟ้าประหยัดพลังงานคว้ารางวัลชนะเลิศและโดดเด่นเหนือคู่แข่งทั้งหมด", "slot_num": 385, "sheet_no": 4, "first_letter": "T"}, {"id": 312, "orig_slot": "#389", "idiom": "Time heals all wounds", "meaning": "Time helps you recover.", "thai_idiom": "กาลเวลาเยียวยาทุกสิ่ง / เวลาจะรักษาแผลใจ", "thai_meaning": "ความเจ็บปวด ความเศร้า หรือความทุกข์ใจจะค่อยๆ บรรเทาเบาบางลงเมื่อเวลาผ่านไป", "ex1_en": "I know you're heartbroken right now, but remember that <span class=\"hl-teal\">time heals all wounds</span> and you will smile again.", "ex1_hl": "time heals all wounds", "ex1_th": "ฉันรู้ว่าตอนนี้เธอหัวใจสลาย แต่จำไว้นะว่ากาลเวลาจะเยียวยาทุกสิ่ง แล้ววันหนึ่งเธอจะกลับมายิ้มได้อีกครั้ง", "ex2_en": "While the bitter patent litigation fractured partnerships, veteran executives noted that <span class=\"hl-teal\">time heals all wounds</span> in the business world.", "ex2_hl": "time heals all wounds", "ex2_th": "แม้คดีฟ้องร้องสิทธิบัตรอันดุเดือดจะทำลายความสัมพันธ์ของพันธมิตร แต่ผู้บริหารรุ่นเก๋ากล่าวว่าในแวดวงธุรกิจกาลเวลาย่อมช่วยเยียวยาความขัดแย้งได้เสมอ", "slot_num": 389, "sheet_no": 4, "first_letter": "T"}, {"id": 313, "orig_slot": "#390", "idiom": "To cut a long story short", "meaning": "To say the most important part.", "thai_idiom": "พูดสั้นๆ สรุปความ / สรุปสั้นๆ / ย่นย่อใจความ", "thai_meaning": "พูดสรุปเฉพาะใจความสำคัญโดยข้ามรายละเอียดปลีกย่อยที่ไม่จำเป็นไป", "ex1_en": "<span class=\"hl-teal\">To cut a long story short</span>, our car broke down twice, we missed the ferry, and we ended up sleeping in a motel.", "ex1_hl": "To cut a long story short", "ex1_th": "สรุปเรื่องให้สั้นๆ เลยนะ รถพวกเราเสียไปสองรอบ ตกเรือเฟอร์รี่ แล้วสุดท้ายก็เลยต้องไปนอนค้างที่โมเต็ลแทน", "ex2_en": "<span class=\"hl-teal\">To cut a long story short</span>, the cross-border audit uncovered severe accounting irregularities that forced the board to suspend operations.", "ex2_hl": "To cut a long story short", "ex2_th": "สรุปใจความสำคัญโดยย่อคือ การตรวจสอบบัญชีข้ามประเทศพบความผิดปกติทางบัญชีอย่างร้ายแรง จนบอร์ดบริหารต้องสั่งระงับการดำเนินงานทันที", "slot_num": 390, "sheet_no": 4, "first_letter": "T"}, {"id": 314, "orig_slot": "#392", "idiom": "Tough cookie", "meaning": "A strong person.", "thai_idiom": "คนใจเด็ด / คนแกร่ง / คนหนังเหนียวไม่ยอมแพ้อะไรง่ายๆ", "thai_meaning": "คนที่มีจิตใจเข้มแข็ง เด็ดเดี่ยว ทนทานต่ออุปสรรคและความยากลำบากได้เป็นอย่างดี", "ex1_en": "My grandmother broke her hip at age eighty-five, but she's such a <span class=\"hl-teal\">tough cookie</span> that she was walking again within a month.", "ex1_hl": "tough cookie", "ex1_th": "คุณยายของฉันกระดูกสะโพกหักตอนอายุแปดสิบห้า แต่ท่านเป็นคนใจเด็ดและแกร่งมากจนกลับมาเดินได้อีกครั้งภายในเวลาแค่เดือนเดียว", "ex2_en": "The chief negotiator proved to be a <span class=\"hl-teal\">tough cookie</span>, refusing to make concessions during intense labor dispute talks.", "ex2_hl": "tough cookie", "ex2_th": "หัวหน้าทีมเจรจาพิสูจน์ให้เห็นว่าเป็นคนเคี้ยวยากและเด็ดเดี่ยวอย่างยิ่ง โดยไม่ยอมอ่อนข้อเลยแม้แต่น้อยในระหว่างการเจรจาข้อพิพาทแรงงานอันตึงเครียด", "slot_num": 392, "sheet_no": 4, "first_letter": "T"}, {"id": 315, "orig_slot": "#393", "idiom": "Try to keep up", "meaning": "Try to match someone's speed.", "thai_idiom": "พยายามตามให้ทัน / ก้าวให้ทัน", "thai_meaning": "พยายามเร่งความเร็วหรือพัฒนาตนเองให้ทันคนอื่น ไม่ว่าจะเป็นด้านความเร็ว ความเข้าใจ หรือมาตรฐาน", "ex1_en": "You're walking way too fast through the mall—<span class=\"hl-teal\">try to keep up</span> with my grandmother, please!", "ex1_hl": "try to keep up", "ex1_th": "เธอเดินเร็วเกินไปแล้วกลางห้างเนี่ย ช่วยเดินช้าลงหน่อยและพยายามเดินให้ทันคุณยายด้วยสิ!", "ex2_en": "Traditional brick-and-mortar retailers must adopt automated inventory systems as they <span class=\"hl-teal\">try to keep up</span> with agile e-commerce giants.", "ex2_hl": "try to keep up", "ex2_th": "ร้านค้าปลีกแบบดั้งเดิมจำเป็นต้องนำระบบจัดการสินค้าคงคลังอัตโนมัติมาใช้ เพื่อพยายามตามให้ทันยักษ์ใหญ่อีคอมเมิร์ซที่มีความคล่องตัวสูง", "slot_num": 393, "sheet_no": 4, "first_letter": "T"}, {"id": 316, "orig_slot": "#394", "idiom": "Under the impression", "meaning": "Believing something is true.", "thai_idiom": "เข้าใจไปเองว่า / มีความเข้าใจว่า / นึกว่า", "thai_meaning": "มีความคิดหรือเชื่อว่าสิ่งใดสิ่งหนึ่งเป็นจริง (ซึ่งบ่อยครั้งอาจเข้าใจผิดหรือคลาดเคลื่อนจากความเป็นจริง)", "ex1_en": "I was <span class=\"hl-teal\">under the impression</span> that dinner was at seven, so I was surprised to find everyone already eating at six.", "ex1_hl": "under the impression", "ex1_th": "ฉันเข้าใจไปเองว่ามื้อเย็นเริ่มตอนหนึ่งทุ่ม เลยแปลกใจมากที่พอไปถึงตอนหกโมงเย็นทุกคนก็กำลังนั่งกินข้าวกันอยู่แล้ว", "ex2_en": "The foreign investors were <span class=\"hl-teal\">under the impression</span> that the government would subsidize factory construction costs as previously discussed.", "ex2_hl": "under the impression", "ex2_th": "นักลงทุนต่างชาติเข้าใจว่ารัฐบาลจะช่วยอุดหนุนค่าก่อสร้างโรงงานตามที่ได้เคยหารือกันไว้เบื้องต้น", "slot_num": 394, "sheet_no": 4, "first_letter": "U"}, {"id": 317, "orig_slot": "#395", "idiom": "Under the table", "meaning": "Secret; not official.", "thai_idiom": "ใต้โต๊ะ / ลับๆ ล่อๆ / นอกระบบผิดกฎหมาย", "thai_meaning": "ทำอย่างลับๆ ซ่อนเร้น ไม่เปิดเผยเป็นทางการ หรือมักเกี่ยวข้องกับการให้สินบนหรือหลบเลี่ยงภาษี", "ex1_en": "The landlord offered to lower the rent slightly if we paid him in cash <span class=\"hl-teal\">under the table</span>.", "ex1_hl": "under the table", "ex1_th": "เจ้าของห้องเช่าเสนอว่าจะลดค่าเช่าให้เล็กน้อย ถ้าพวกเรายอมจ่ายเงินสดให้เขาใต้โต๊ะแบบไม่ผ่านสัญญา", "ex2_en": "Federal investigators uncovered several <span class=\"hl-teal\">under the table</span> payments made by defense contractors to municipal procurement officers.", "ex2_hl": "under the table", "ex2_th": "เจ้าหน้าที่สืบสวนกลางตรวจพบการจ่ายเงินใต้โต๊ะหลายครั้งที่ผู้รับเหมาด้านกลาโหมจ่ายให้แก่เจ้าหน้าที่ฝ่ายจัดซื้อของเทศบาล", "slot_num": 395, "sheet_no": 4, "first_letter": "U"}, {"id": 318, "orig_slot": "#396", "idiom": "When in doubt, do nothing", "meaning": "It's safer to wait.", "thai_idiom": "ถ้ายังไม่แน่ใจ อยู่นิ่งๆ ไว้ก่อน / เมื่อมีข้อสงสัย อย่าเพิ่งผลีผลาม", "thai_meaning": "หากยังมีความลังเลหรือไม่แน่ใจในผลลัพธ์ การชะลอการกระทำหรืออยู่นิ่งๆ ไว้ก่อนย่อมปลอดภัยกว่าการผลีผลามลงมือ", "ex1_en": "If you don't know whether this mushroom is poisonous, remember the golden rule: <span class=\"hl-teal\">when in doubt, do nothing</span> and leave it alone.", "ex1_hl": "when in doubt, do nothing", "ex1_th": "ถ้าเธอไม่แน่ใจว่าเห็ดดอกนี้มีพิษหรือเปล่า ให้จำกฎทองไว้เลยว่า ถ้ายังสงสัยก็อยู่นิ่งๆ ไว้ก่อน และอย่าไปแตะต้องมันเด็ดขาด", "ex2_en": "Seasoned stock traders often follow the principle: <span class=\"hl-teal\">when in doubt, do nothing</span> rather than making impulsive trades during high market turbulence.", "ex2_hl": "when in doubt, do nothing", "ex2_th": "เทรดเดอร์หุ้นมากประสบการณ์มักยึดหลักการที่ว่า หากยังไม่แน่ใจก็ให้อยู่นิ่งๆ ดีกว่าการตัดสินใจซื้อขายด้วยอารมณ์ชั่ววูบท่ามกลางตลาดที่ผันผวนรุนแรง", "slot_num": 396, "sheet_no": 4, "first_letter": "W"}, {"id": 319, "orig_slot": "#398", "idiom": "With all due respect", "meaning": "Used before disagreeing politely.", "thai_idiom": "ด้วยความเคารพ / ขอประทานอภัยด้วยความเคารพอย่างสูง", "thai_meaning": "ถ้อยคำสุภาพที่ใช้เกริ่นนำก่อนจะแสดงความเห็นต่าง หรือปฏิเสธความเห็นของผู้มีอาวุโสกว่า", "ex1_en": "<span class=\"hl-teal\">With all due respect</span>, Mom, I'm twenty-four now and capable of deciding what career path suits me best.", "ex1_hl": "With all due respect", "ex1_th": "ด้วยความเคารพนะคะแม่ ตอนนี้หนูอายุยี่สิบสี่แล้ว และหนูคิดว่าหนูสามารถตัดสินใจเลือกเส้นทางอาชีพที่เหมาะกับตัวเองได้ค่ะ", "ex2_en": "<span class=\"hl-teal\">With all due respect</span> to the committee chair, the proposed fiscal policy overlooks severe rural socioeconomic disparities.", "ex2_hl": "With all due respect", "ex2_th": "ด้วยความเคารพอย่างสูงต่อประธานคณะกรรมการ นโยบายการคลังที่นำเสนอนี้มองข้ามความเหลื่อมล้ำทางเศรษฐกิจและสังคมในชนบทไปอย่างสิ้นเชิง", "slot_num": 398, "sheet_no": 4, "first_letter": "W"}, {"id": 320, "orig_slot": "#399", "idiom": "You can't judge a book by its cover", "meaning": "Appearances can be misleading.", "thai_idiom": "อย่าตัดสินคนจากภายนอก / อย่าดูคนแค่หน้าตา / รู้หน้าไม่รู้ใจ", "thai_meaning": "ไม่ควรประเมินคุณค่า ความสามารถ หรือนิสัยของคนหรือสิ่งของจากรูปลักษณ์ภายนอกเพียงอย่างเดียว", "ex1_en": "That tiny roadside diner looked run-down, but the homemade barbecue was incredible—<span class=\"hl-teal\">you can't judge a book by its cover</span>!", "ex1_hl": "you can't judge a book by its cover", "ex1_th": "ร้านอาหารริมทางร้านเล็กๆ นั่นดูโทรมมาก แต่บาร์บีคิวสูตรโฮมเมดอร่อยเหลือเชื่อจริงๆ อย่าตัดสินอะไรแค่ภายนอกเชียวนะ!", "ex2_en": "The candidate wore an unpressed suit, but her technical coding answers proved that <span class=\"hl-teal\">you can't judge a book by its cover</span>.", "ex2_hl": "you can't judge a book by its cover", "ex2_th": "ผู้สมัครงานคนนั้นใส่สูทยับๆ มารับการสัมภาษณ์ แต่คำตอบด้านการเขียนโปรแกรมเชิงเทคนิคของเธอได้พิสูจน์ให้เห็นว่า อย่าตัดสินคนจากภายนอกเพียงอย่างเดียว", "slot_num": 399, "sheet_no": 4, "first_letter": "Y"}, {"id": 321, "orig_slot": "#400", "idiom": "You reap what you sow", "meaning": "You get the result of your actions.", "thai_idiom": "ปลูกพืชเช่นใด ย่อมได้ผลเช่นนั้น / หว่านพืชหวังผล / ทำดีได้ดี ทำชั่วได้ชั่ว", "thai_meaning": "การกระทำของตนย่อมส่งผลลัพธ์กลับมาหาตนเองเสมอ ทำสิ่งใดย่อมได้รับผลตอบแทนเช่นนั้น", "ex1_en": "If you spend all weekend playing video games instead of studying for the bar exam, <span class=\"hl-teal\">you reap what you sow</span>.", "ex1_hl": "you reap what you sow", "ex1_th": "ถ้าเธอใช้เวลาทั้งสุดสัปดาห์เล่นแต่วิดีโอเกมแทนที่จะอ่านหนังสือสอบเนติบัณฑิต ปลูกพืชเช่นใดย่อมได้ผลเช่นนั้นแหละ", "ex2_en": "The manufacturing conglomerate treated its workforce poorly for decades and now <span class=\"hl-teal\">reaps what it sowed</span> as nationwide labor strikes paralyze output.", "ex2_hl": "reaps what it sowed", "ex2_th": "กลุ่มบริษัทผู้ผลิตแห่งนี้ปฏิบัติต่อแรงงานอย่างย่ำแย่มานานหลายทศวรรษ และบัดนี้ก็กำลังได้รับผลกรรมที่ตนก่อไว้ เมื่อการนัดหยุดงานทั่วประเทศส่งผลให้ผลผลิตเป็นอัมพาต", "slot_num": 400, "sheet_no": 4, "first_letter": "Y"}, {"id": 322, "orig_slot": "#401", "idiom": "A wake-up call", "meaning": "A warning that makes you realize something.", "thai_idiom": "สัญญาณเตือนสติ / สัญญาณเตือนภัย / บทเรียนเตือนใจ", "thai_meaning": "เหตุการณ์หรือสัญญาณเตือนที่เกิดขึ้นอย่างกะทันหัน ทำให้ตระหนักถึงปัญหาและต้องรีบแก้ไขหรือปรับเปลี่ยนพฤติกรรม", "ex1_en": "Fainting from exhaustion during morning jog was <span class=\"hl-teal\">a wake-up call</span> for Dan to fix his chronic sleep deprivation.", "ex1_hl": "a wake-up call", "ex1_th": "การเป็นลมหมดสติเพราะความเหนื่อยล้าระหว่างวิ่งออกกำลังกายตอนเช้า ถือเป็นสัญญาณเตือนสติให้แดนหันมาแก้ปัญหาการอดนอนเรื้อรังอย่างจริงจัง", "ex2_en": "The unprecedented cybersecurity breach served as <span class=\"hl-teal\">a wake-up call</span> for the regional bank to revamp its encryption protocols.", "ex2_hl": "a wake-up call", "ex2_th": "การถูกเจาะระบบความปลอดภัยไซเบอร์ที่ไม่เคยเกิดขึ้นมาก่อน ได้กลายเป็นสัญญาณเตือนภัยครั้งใหญ่ให้ธนาคารระดับภูมิภาคต้องยกเครื่องโพรโทคอลการเข้ารหัสข้อมูลใหม่ทั้งหมด", "slot_num": 401, "sheet_no": 5, "first_letter": "A"}, {"id": 323, "orig_slot": "#402", "idiom": "A wolf in sheep's clothing", "meaning": "A dangerous person who pretends to be kind.", "thai_idiom": "หมาป่าในคราบลูกแกะ / หน้าเนื้อใจเสือ / ปากหวานก้นเปรี้ยว", "thai_meaning": "คนที่มีเจตนาร้ายหรือเป็นอันตราย แต่แสร้งทำตัวเป็นมิตร อ่อนโยน หรือไร้พิษสงเพื่อหลอกลวงผู้อื่น", "ex1_en": "Be careful sharing personal secrets with Liam; beneath his friendly smile, he's <span class=\"hl-teal\">a wolf in sheep's clothing</span> who gossips behind your back.", "ex1_hl": "a wolf in sheep's clothing", "ex1_th": "ระวังเรื่องการเล่าความลับส่วนตัวให้เลียมฟังนะ ภายใต้รอยยิ้มที่เป็นมิตรนั้น เขาคือหมาป่าในคราบลูกแกะที่คอยเอาคนอื่นไปนินทาลับหลัง", "ex2_en": "The financial advisor appeared trustworthy, but regulatory investigators exposed him as <span class=\"hl-teal\">a wolf in sheep's clothing</span> running a multi-million-dollar Ponzi scheme.", "ex2_hl": "a wolf in sheep's clothing", "ex2_th": "ที่ปรึกษาทางการเงินคนนั้นดูน่าเชื่อถือมาก แต่ผู้ตรวจสอบของหน่วยงานกำกับดูแลเปิดโปงว่าเขาเป็นหน้าเนื้อใจเสือที่แอบดำเนินธุรกิจแชร์ลูกโซ่มูลค่าหลายล้านดอลลาร์", "slot_num": 402, "sheet_no": 5, "first_letter": "A"}, {"id": 324, "orig_slot": "#403", "idiom": "A word to the wise", "meaning": "Advice that is good to follow.", "thai_idiom": "คำเตือนด้วยความหวังดี / ขอเตือนไว้ด้วยความหวังดี / คำเตือนสำหรับผู้มีปัญญา", "thai_meaning": "คำแนะนำหรือคำเตือนสั้นๆ ที่เป็นประโยชน์และควรปฏิบัติตาม เพื่อหลีกเลี่ยงปัญหา", "ex1_en": "<span class=\"hl-teal\">A word to the wise</span>: always double-check the flight date before booking non-refundable international tickets.", "ex1_hl": "A word to the wise", "ex1_th": "ขอเตือนไว้ด้วยความหวังดีนะ ควรตรวจสอบวันเดินทางของเที่ยวบินซ้ำสองรอบเสมอ ก่อนที่จะจองตั๋วเครื่องบินระหว่างประเทศแบบคืนเงินไม่ได้", "ex2_en": "Here is <span class=\"hl-teal\">a word to the wise</span> for aspiring startup founders: secure your intellectual property before pitching to outside investors.", "ex2_hl": "a word to the wise", "ex2_th": "นี่คือคำเตือนด้วยความหวังดีสำหรับผู้ก่อตั้งสตาร์ทอัพหน้าใหม่ ควรจดทะเบียนปกป้องทรัพย์สินทางปัญญาของตนให้เรียบร้อย ก่อนที่จะนำเสนอแผนงานต่อนักลงทุนภายนอก", "slot_num": 403, "sheet_no": 5, "first_letter": "A"}, {"id": 325, "orig_slot": "#405", "idiom": "Add insult to injury", "meaning": "Make a bad situation even worse.", "thai_idiom": "ซ้ำเติม / เคราะห์ซ้ำกรรมซัด", "thai_meaning": "ทำให้สถานการณ์ที่แย่อยู่แล้วยิ่งเลวร้ายลงไปอีก หรือซ้ำเติมให้เจ็บปวดขึ้น", "ex1_en": "Our flight was delayed by six hours, and to <span class=\"hl-teal\">add insult to injury</span>, the airline misplaced both of our suitcases.", "ex1_hl": "add insult to injury", "ex1_th": "เที่ยวบินของเราดีเลย์ไปถึงหกชั่วโมง และที่ซ้ำร้ายไปกว่านั้นคือสายการบินยังทำกระเป๋าเดินทางของเราหายไปทั้งสองใบ", "ex2_en": "After laying off a third of the staff without severance, management <span class=\"hl-teal\">added insult to injury</span> by asking the remaining workers to cover weekend shifts unpaid.", "ex2_hl": "added insult to injury", "ex2_th": "หลังจากปลดพนักงานไปหนึ่งในสามโดยไม่จ่ายค่าชดเชย ผู้บริหารยังซ้ำเติมสถานการณ์ด้วยการขอให้พนักงานที่เหลืออยู่มาเข้ากะวันหยุดสุดสัปดาห์โดยไม่ได้รับค่าจ้าง", "slot_num": 405, "sheet_no": 5, "first_letter": "A"}, {"id": 326, "orig_slot": "#406", "idiom": "Against all odds", "meaning": "In spite of very difficult chances.", "thai_idiom": "ฝ่าฟันอุปสรรค / ชนะโชคชะตาอย่างไม่น่าเชื่อ", "thai_meaning": "ประสบความสำเร็จหรือรอดพ้นมาได้แม้จะมีอุปสรรคขวากหนามหรือโอกาสรอดน้อยมาก", "ex1_en": "<span class=\"hl-teal\">Against all odds</span>, my grandfather pulled through the major heart surgery and was walking around the garden within weeks.", "ex1_hl": "Against all odds", "ex1_th": "แม้โอกาสจะริบหรี่เพียงใด คุณปู่ก็รอดพ้นจากการผ่าตัดหัวใจครั้งใหญ่มาได้ และสามารถเดินเล่นรอบสวนได้ภายในไม่กี่สัปดาห์", "ex2_en": "The bootstrapped tech startup survived two brutal economic recessions and, <span class=\"hl-teal\">against all odds</span>, grew into a multi-million-dollar enterprise.", "ex2_hl": "against all odds", "ex2_th": "สตาร์ทอัปด้านเทคโนโลยีที่ก่อตั้งด้วยทุนตัวเองรอดพ้นจากภาวะเศรษฐกิจถดถอยรุนแรงถึงสองครั้ง และสามารถเติบโตเป็นองค์กรธุรกิจมูลค่าหลายล้านดอลลาร์ได้อย่างไม่น่าเชื่อท่ามกลางอุปสรรคมากมาย", "slot_num": 406, "sheet_no": 5, "first_letter": "A"}, {"id": 327, "orig_slot": "#407", "idiom": "All that glitters is not gold", "meaning": "Not everything that looks good is really good.", "thai_idiom": "ข้างนอกสุกใสข้างในเป็นโพรง / สิ่งที่เห็นอาจไม่เป็นอย่างที่คิด", "thai_meaning": "ไม่ใช่ทุกสิ่งที่ดูสวยหรูหรือมีค่าภายนอกจะมีคุณค่าที่แท้จริงเสมอไป", "ex1_en": "She thought working for a glamorous fashion influencer would be a dream, but she soon realized <span class=\"hl-teal\">all that glitters is not gold</span> when faced with constant verbal abuse.", "ex1_hl": "all that glitters is not gold", "ex1_th": "เธอเคยคิดว่าการได้ทำงานให้กับอินฟลูเอนเซอร์แฟชั่นชื่อดังจะเป็นงานในฝัน แต่ไม่นานก็ตระหนักว่าสิ่งที่เห็นอาจไม่ได้สวยหรูอย่างที่คิดเมื่อต้องทนฟังคำพูดดูแคลนอยู่ตลอดเวลา", "ex2_en": "Financial analysts warned retail investors that <span class=\"hl-teal\">all that glitters is not gold</span>, particularly when evaluating speculative crypto tokens with inflated yields.", "ex2_hl": "all that glitters is not gold", "ex2_th": "เหล่านักวิเคราะห์ทางการเงินเตือนนักลงทุนรายย่อยว่าอย่าหลงเชื่อภาพลักษณ์ที่ดูหรูหรา เพราะข้างนอกสุกใสข้างในอาจกลวงโบ๋ โดยเฉพาะการประเมินเหรียญคริปโตเก็งกำไรที่โฆษณาผลตอบแทนสูงเกินจริง", "slot_num": 407, "sheet_no": 5, "first_letter": "A"}, {"id": 328, "orig_slot": "#408", "idiom": "At a crossroads", "meaning": "At an important decision point.", "thai_idiom": "อยู่ตรงทางแยก / หัวเลี้ยวหัวต่อ", "thai_meaning": "อยู่ในจุดสำคัญของการตัดสินใจเลือกเส้นทางชีวิตหรือทิศทางในอนาคต", "ex1_en": "After finishing her master's degree, Maya found herself <span class=\"hl-teal\">at a crossroads</span> between accepting a corporate role in London or moving back home to open a bakery.", "ex1_hl": "at a crossroads", "ex1_th": "หลังจากเรียนจบปริญญาโท มายาก็พบว่าตัวเองอยู่ตรงทางแยกของชีวิต ระหว่างการตอบรับเข้าทำงานในบริษัทที่ลอนดอนหรือกลับบ้านเกิดไปเปิดร้านเบเกอรี", "ex2_en": "The historic publishing house is <span class=\"hl-teal\">at a crossroads</span> as print circulation plummets and digital subscription models demand heavy upfront investment.", "ex2_hl": "at a crossroads", "ex2_th": "สำนักพิมพ์เก่าแก่แห่งนี้กำลังมาถึงจุดเปลี่ยนครั้งสำคัญ เมื่อยอดจำหน่ายสิ่งพิมพ์ลดฮวบลง ขณะที่โมเดลสมาชิกดิจิทัลจำเป็นต้องใช้เงินลงทุนก้อนโตตั้งแต่เริ่มต้น", "slot_num": 408, "sheet_no": 5, "first_letter": "A"}, {"id": 329, "orig_slot": "#409", "idiom": "Back to the drawing board", "meaning": "Start again after a failure.", "thai_idiom": "กลับไปตั้งต้นใหม่ / นับหนึ่งใหม่", "thai_meaning": "เริ่มต้นวางแผนหรือออกแบบใหม่ตั้งแต่ต้นหลังจากที่แนวทางเดิมล้มเหลวหรือไม่บรรลุผล", "ex1_en": "The cake collapsed into a sticky mess in the oven, so I have to go <span class=\"hl-teal\">back to the drawing board</span> before the birthday party starts tonight.", "ex1_hl": "back to the drawing board", "ex1_th": "เค้กยุบตัวกลายเป็นก้อนแป้งเละๆ คาเตาอบ ทำให้ฉันต้องกลับไปตั้งต้นนับหนึ่งใหม่ก่อนที่งานเลี้ยงวันเกิดจะเริ่มขึ้นในค่ำคืนนี้", "ex2_en": "When the electric vehicle battery pack overheated during stress testing, the engineering team had to go <span class=\"hl-teal\">back to the drawing board</span> to redesign the thermal cooling architecture.", "ex2_hl": "back to the drawing board", "ex2_th": "เมื่อชุดแบตเตอรี่รถยนต์ไฟฟ้าเกิดความร้อนสูงเกินไปในระหว่างการทดสอบสมรรถนะขั้นวิกฤต ทีมวิศวกรจึงต้องกลับไปตั้งต้นใหม่เพื่อรื้อแบบระบบระบายความร้อนใหม่ทั้งหมด", "slot_num": 409, "sheet_no": 5, "first_letter": "B"}, {"id": 330, "orig_slot": "#410", "idiom": "Ball is in your court", "meaning": "It's your turn to act.", "thai_idiom": "ลูกบอลอยู่ในฝั่งคุณ / ขึ้นอยู่กับคุณแล้ว / ตาคุณตัดสินใจ", "thai_meaning": "เป็นตาหรือหน้าที่ของคุณแล้วที่จะต้องดำเนินการหรือตัดสินใจขั้นต่อไป", "ex1_en": "I've already apologized sincerely for arriving late, so the <span class=\"hl-teal\">ball is in your court</span> whether you want to reschedule dinner or not.", "ex1_hl": "ball is in your court", "ex1_th": "ฉันขอโทษอย่างจริงใจไปแล้วเรื่องที่มาสาย ดังนั้นตอนนี้ก็ขึ้นอยู่กับคุณแล้วว่าจะนัดทานมื้อค่ำกันใหม่หรือไม่", "ex2_en": "We submitted our revised contract terms with the requested price concessions; now the <span class=\"hl-teal\">ball is in their court</span> to sign or counteroffer.", "ex2_hl": "ball is in their court", "ex2_th": "เราได้ยื่นเงื่อนไขสัญญาฉบับแก้ไขพร้อมส่วนลดราคาตามที่ร้องขอไปแล้ว ตอนนี้จึงเป็นตาของพวกเขาที่จะตัดสินใจว่าจะลงนามหรือยื่นข้อเสนอใหม่กลับมา", "slot_num": 410, "sheet_no": 5, "first_letter": "B"}, {"id": 331, "orig_slot": "#412", "idiom": "Break a promise", "meaning": "Fail to keep a promise.", "thai_idiom": "ผิดสัญญา / ผิดคำพูด / ตระบัดสัตย์", "thai_meaning": "ไม่ปฏิบัติตามคำมั่นสัญญาหรือคำพูดที่เคยให้ไว้", "ex1_en": "Liam felt terribly guilty because he <span class=\"hl-teal\">broke a promise</span> to take his little sister to the science museum on Saturday.", "ex1_hl": "broke a promise", "ex1_th": "เลียมรู้สึกผิดอย่างมากที่ผิดสัญญากับน้องสาวว่าจะพาไปเที่ยวพิพิธภัณฑ์วิทยาศาสตร์ในวันเสาร์", "ex2_en": "Voters expressed outrage after the newly elected mayor <span class=\"hl-teal\">broke a promise</span> to freeze municipal property taxes during his first term.", "ex2_hl": "broke a promise", "ex2_th": "ผู้มีสิทธิเลือกตั้งแสดงความไม่พอใจอย่างรุนแรงหลังจากนายกเทศมนตรีคนใหม่ผิดสัญญาว่าจะตรึงภาษีทรัพย์สินของเทศบาลตลอดวาระการดำรงตำแหน่งแรก", "slot_num": 412, "sheet_no": 5, "first_letter": "B"}, {"id": 332, "orig_slot": "#413", "idiom": "Break the news", "meaning": "Tell someone something unpleasant.", "thai_idiom": "แจ้งข่าวร้าย / บอกข่าวสำคัญ", "thai_meaning": "บอกข่าวสำคัญหรือข่าวร้ายให้ผู้อื่นทราบเป็นครั้งแรก", "ex1_en": "I dread having to <span class=\"hl-teal\">break the news</span> to my roommate that our landlord is increasing the monthly rent by thirty percent.", "ex1_hl": "break the news", "ex1_th": "ฉันรู้สึกลำบากใจเหลือเกินที่จะต้องบอกข่าวร้ายกับรูมเมตว่าเจ้าของห้องกำลังจะปรับขึ้นค่าเช่ารายเดือนอีกสามสิบเปอร์เซ็นต์", "ex2_en": "The HR director scheduled a private meeting with the regional sales team to gently <span class=\"hl-teal\">break the news</span> regarding the upcoming branch closure.", "ex2_hl": "break the news", "ex2_th": "ผู้อำนวยการฝ่ายทรัพยากรบุคคลนัดประชุมลับกับทีมขายประจำภูมิภาคเพื่อแจ้งข่าวร้ายอย่างระมัดระวังเรื่องการปิดตัวของสาขาที่กำลังจะมาถึง", "slot_num": 413, "sheet_no": 5, "first_letter": "B"}, {"id": 333, "orig_slot": "#414", "idiom": "Burn the bridges", "meaning": "Destroy the possibility of going back or reconciling.", "thai_idiom": "ตัดช่องทางถอย / ทุบหม้อข้าวตัวเอง / ตัดขาดไม่เผาผี", "thai_meaning": "ทำลายความสัมพันธ์หรือตัดหนทางที่จะหวนกลับไปสู่จุดเดิมหรือปรองดองกันได้อีก", "ex1_en": "Even though you had an argument with your flatmate, don't <span class=\"hl-teal\">burn your bridges</span> by trashing the apartment before moving out.", "ex1_hl": "burn your bridges", "ex1_th": "ถึงแม้เธอจะมีปากเสียงกับเพื่อนร่วมห้อง ก็อย่าถึงกับตัดขาดไม่เผาผีด้วยการทำลายห้องพักจนเละเทะก่อนย้ายออกไปเลย", "ex2_en": "Career advisors caution professionals never to <span class=\"hl-teal\">burn bridges</span> when resigning, as former managers frequently provide crucial background checks.", "ex2_hl": "burn bridges", "ex2_th": "ที่ปรึกษาด้านอาชีพเตือนคนทำงานเสมอว่าอย่าตัดช่องทางหวนกลับหรือทำลายความสัมพันธ์เมื่อลาออก เพราะอดีตผู้จัดการมักเป็นผู้ให้ข้อมูลสำคัญในการตรวจสอบประวัติการทำงาน", "slot_num": 414, "sheet_no": 5, "first_letter": "B"}, {"id": 334, "orig_slot": "#415", "idiom": "Call it a night", "meaning": "Decide to stop an activity for the night.", "thai_idiom": "แยกย้ายเข้านอน / เลิกราสำหรับคืนนี้", "thai_meaning": "ตัดสินใจหยุดทำกิจกรรมหรือยุติงานสังสรรค์เพื่อกลับไปพักผ่อนในค่ำคืนนั้น", "ex1_en": "It's past midnight and everyone is yawning, so let's <span class=\"hl-teal\">call it a night</span> and clean up the board game tomorrow morning.", "ex1_hl": "call it a night", "ex1_th": "เลยเที่ยงคืนแล้วและทุกคนก็เริ่มหาวกันหมดแล้ว พวกเราแยกย้ายกันไปนอนเถอะ แล้วค่อยมาเก็บเกมกระดานพรุ่งนี้เช้า", "ex2_en": "After reviewing financial ledgers for fourteen straight hours, the exhausted audit team agreed to <span class=\"hl-teal\">call it a night</span> and reconvene at 8 AM.", "ex2_hl": "call it a night", "ex2_th": "หลังจากตรวจสอบสมุดบัญชีการเงินติดต่อกันนานถึงสิบสี่ชั่วโมง ทีมผู้สอบบัญชีที่เหนื่อยล้าจึงตกลงที่จะยุติการทำงานสำหรับค่ำคืนนี้และกลับมาประชุมกันใหม่ในเวลา 8 โมงเช้า", "slot_num": 415, "sheet_no": 5, "first_letter": "C"}, {"id": 335, "orig_slot": "#417", "idiom": "Can't judge a book by its cover", "meaning": "You can't know the quality of someone or something by its appearance.", "thai_idiom": "อย่าตัดสินคนจากภายนอก / อย่ามองแต่เปลือกนอก", "thai_meaning": "ไม่สามารถตัดสินคุณค่า ความสามารถ หรือนิสัยใจคอของใครหรือสิ่งใดจากรูปลักษณ์ภายนอกได้", "ex1_en": "The neighborhood diner looks run-down from the outside, but you <span class=\"hl-teal\">can't judge a book by its cover</span>; their handmade pasta is exceptional.", "ex1_hl": "can't judge a book by its cover", "ex1_th": "ร้านอาหารในละแวกนี้ดูทรุดโทรมเมื่อมองจากภายนอก แต่คุณตัดสินร้านจากภายนอกไม่ได้หรอกนะ เพราะพาสต้าเส้นสดของพวกเขาอร่อยยอดเยี่ยมมาก", "ex2_en": "The hiring panel learned that you <span class=\"hl-teal\">can't judge a book by its cover</span> when the unpretentious, quiet candidate outperformed every polished applicant on the coding assessment.", "ex2_hl": "can't judge a book by its cover", "ex2_th": "คณะกรรมการคัดเลือกได้เรียนรู้ว่าอย่าตัดสินคนจากภาพลักษณ์ภายนอก เมื่อผู้สมัครที่ดูเรียบง่ายและเงียบขรึมสามารถทำคะแนนทดสอบการเขียนโค้ดได้เหนือกว่าผู้สมัครที่ดูภูมิฐานทุกคน", "slot_num": 417, "sheet_no": 5, "first_letter": "C"}, {"id": 336, "orig_slot": "#418", "idiom": "Catch someone red-handed", "meaning": "Catch someone while doing something wrong.", "thai_idiom": "จับได้คาหนังคาเขา / คาตา", "thai_meaning": "จับกุมหรือจับผิดบุคคลได้ในขณะที่กำลังกระทำความผิดหรือสิ่งที่ไม่ถูกต้องพอดี", "ex1_en": "Mom walked into the pantry and <span class=\"hl-teal\">caught Toby red-handed</span> with chocolate frosting smeared all over his cheeks.", "ex1_hl": "caught Toby red-handed", "ex1_th": "คุณแม่เดินเข้าไปในห้องเก็บอาหารแล้วจับได้คาหนังคาเขาว่าโทบี้กำลังแอบกินขนม โดยมีคราบช็อกโกแลตฟรอสติงเลอะเต็มแก้มทั้งสองข้าง", "ex2_en": "Internal compliance monitors <span class=\"hl-teal\">caught the rogue trader red-handed</span> copying confidential client transaction data onto an unauthorized flash drive.", "ex2_hl": "caught the rogue trader red-handed", "ex2_th": "ผู้ตรวจสอบการปฏิบัติตามกฎระเบียบภายในจับผู้ค้าหุ้นนอกลู่นอกทางได้คาหนังคาเขา ขณะกำลังคัดลอกข้อมูลธุรกรรมลับของลูกค้าลงในแฟลชไดรฟ์ที่ไม่ได้รับอนุญาต", "slot_num": 418, "sheet_no": 5, "first_letter": "C"}, {"id": 337, "orig_slot": "#419", "idiom": "Change for the better", "meaning": "Improve and become better.", "thai_idiom": "เปลี่ยนไปในทางที่ดีขึ้น / พลิกฟื้นไปในทิศทางที่ดี", "thai_meaning": "ปรับปรุงหรือเปลี่ยนแปลงไปในทิศทางที่ดี มีความก้าวหน้าหรือมีคุณภาพชีวิตที่ดีขึ้น", "ex1_en": "Ever since Marcus started cycling to work and cooking fresh meals, his overall health and mood have undergone a dramatic <span class=\"hl-teal\">change for the better</span>.", "ex1_hl": "change for the better", "ex1_th": "นับตั้งแต่มาร์คัสเริ่มปั่นจักรยานไปทำงานและทำอาหารสดทานเอง สุขภาพโดยรวมและอารมณ์ของเขาก็เปลี่ยนไปในทางที่ดีขึ้นอย่างเห็นได้ชัด", "ex2_en": "The pedestrianization of the historic downtown district marked a significant <span class=\"hl-teal\">change for the better</span>, boosting foot traffic for local retailers and slashing emissions.", "ex2_hl": "change for the better", "ex2_th": "การปรับเปลี่ยนย่านเมืองเก่าให้เป็นถนนคนเดินถือเป็นการเปลี่ยนแปลงไปในทางที่ดีขึ้นอย่างมีนัยสำคัญ ซึ่งช่วยเพิ่มจำนวนคนเดินเท้าให้กับร้านค้าในท้องถิ่นและลดมลพิษได้อย่างมาก", "slot_num": 419, "sheet_no": 5, "first_letter": "C"}, {"id": 338, "orig_slot": "#420", "idiom": "Come hell or high water", "meaning": "No matter what; in any situation.", "thai_idiom": "ไม่ว่าจะเกิดอะไรขึ้นก็ตาม / บุกน้ำลุยไฟ / ฝ่าฟันอุปสรรคให้ถึงที่สุด", "thai_meaning": "มุ่งมั่นที่จะทำสิ่งใดสิ่งหนึ่งให้สำเร็จโดยไม่ยอมให้อุปสรรคหรือความยากลำบากใดๆ มาขัดขวางได้", "ex1_en": "I promised my daughter I would attend her ballet recital, and <span class=\"hl-teal\">come hell or high water</span>, I will be in the front row cheering.", "ex1_hl": "come hell or high water", "ex1_th": "ฉันสัญญากับลูกสาวไว้แล้วว่าจะไปดูการแสดงบัลเลต์ของเธอ และไม่ว่าจะเกิดอะไรขึ้นก็ตาม ฉันจะไปนั่งเชียร์อยู่ที่แถวหน้าแน่นอน", "ex2_en": "The logistics division committed to delivering the vital medical supplies to the flood-stricken region by dawn, <span class=\"hl-teal\">come hell or high water</span>.", "ex2_hl": "come hell or high water", "ex2_th": "ฝ่ายโลจิสติกส์มุ่งมั่นที่จะส่งมอบเวชภัณฑ์จำเป็นไปยังพื้นที่ประสบอุทกภัยให้ทันก่อนรุ่งสาง ไม่ว่าจะมีอุปสรรคขวากหนามยากลำบากเพียงใดก็ตาม", "slot_num": 420, "sheet_no": 5, "first_letter": "C"}, {"id": 339, "orig_slot": "#424", "idiom": "Don't take it personally", "meaning": "Don't be upset; it's not about you.", "thai_idiom": "อย่าเก็บไปคิดมากเลย / อย่าคิดว่าเป็นเรื่องส่วนตัว", "thai_meaning": "อย่ารู้สึกขุ่นเคืองหรือไม่พอใจ เพราะเรื่องดังกล่าวไม่ได้มุ่งเป้าโจมตีหรือเกี่ยวกับตัวคุณโดยตรง", "ex1_en": "Sarah seemed quiet and distant at brunch, but <span class=\"hl-teal\">don't take it personally</span>; she has been dealing with severe migraines all morning.", "ex1_hl": "don't take it personally", "ex1_th": "ซาร่าห์ดูเงียบขรึมและเหินห่างไปบ้างตอนทานมื้อสาย แต่อย่าเก็บไปคิดมากเลยนะ เธอแค่ปวดไมเกรนอย่างหนักมาตลอดทั้งเช้า", "ex2_en": "The creative director gave blunt feedback on your storyboard, but <span class=\"hl-teal\">don't take it personally</span>; she holds every marketing campaign to rigorous aesthetic standards.", "ex2_hl": "don't take it personally", "ex2_th": "ผู้อำนวยการฝ่ายสร้างสรรค์อาจจะวิจารณ์สตอรีบอร์ดของคุณตรงไปตรงมา แต่อย่าคิดว่าเป็นเรื่องส่วนตัวเลย เพราะเธอตั้งมาตรฐานความประณีตไว้สูงลิ่วกับทุกแคมเปญการตลาดอยู่แล้ว", "slot_num": 424, "sheet_no": 5, "first_letter": "D"}, {"id": 340, "orig_slot": "#426", "idiom": "Draw a line in the sand", "meaning": "Set a firm limit or boundary.", "thai_idiom": "ขีดเส้นตาย / กำหนดเส้นแบ่งชัดเจน / ขีดเส้นไม่ยอมให้ล้ำเส้น", "thai_meaning": "กำหนดขอบเขตหรือจุดยืนที่เด็ดขาดชัดเจนว่าจะไม่ยอมผ่อนปรนหรือถอยร่นให้อีกต่อไป", "ex1_en": "After loaning money to his brother multiple times without ever being repaid, Dave decided to <span class=\"hl-teal\">draw a line in the sand</span> and refuse further requests.", "ex1_hl": "draw a line in the sand", "ex1_th": "หลังจากให้พี่ชายยืมเงินไปหลายครั้งโดยไม่เคยได้รับคืน เดฟจึงตัดสินใจขีดเส้นแบ่งอย่างชัดเจนว่าจะไม่ให้ยืมอีกต่อไป", "ex2_en": "The antitrust regulator <span class=\"hl-teal\">drew a line in the sand</span> by declaring that any additional tech mergers exceeding ten billion dollars would face immediate legal injunctions.", "ex2_hl": "drew a line in the sand", "ex2_th": "หน่วยงานกำกับดูแลการผูกขาดได้ขีดเส้นแบ่งอย่างเด็ดขาด โดยประกาศว่าการควบรวมกิจการด้านเทคโนโลยีที่มีมูลค่าเกินหนึ่งหมื่นล้านดอลลาร์จะถูกฟ้องร้องระงับทันที", "slot_num": 426, "sheet_no": 5, "first_letter": "D"}, {"id": 341, "orig_slot": "#429", "idiom": "Face the facts", "meaning": "Accept the truth.", "thai_idiom": "ยอมรับความจริง / เผชิญหน้ากับความจริง", "thai_meaning": "ยอมรับความจริงแม้ว่าความจริงนั้นจะเจ็บปวดหรือไม่น่าอภิรมย์ก็ตาม", "ex1_en": "You need to <span class=\"hl-teal\">face the facts</span>; your laptop is ten years old and can no longer run modern video editing software without crashing.", "ex1_hl": "face the facts", "ex1_th": "เธอต้องยอมรับความจริงได้แล้วนะ โน้ตบุ๊กเครื่องนี้อายุสิบปีแล้ว และไม่สามารถรันโปรแกรมตัดต่อวิดีโอรุ่นใหม่ๆ โดยไม่ค้างได้อีกต่อไป", "ex2_en": "The board urged the chief executive to <span class=\"hl-teal\">face the facts</span> and divest from the failing overseas subsidiary before further capital was incinerated.", "ex2_hl": "face the facts", "ex2_th": "คณะกรรมการบริหารกระตุ้นให้ประธานเจ้าหน้าที่บริหารยอมรับความจริงและถอนการลงทุนจากบริษัทย่อยในต่างประเทศที่กำลังขาดทุน ก่อนที่เงินทุนจะสูญเปล่าไปมากกว่านี้", "slot_num": 429, "sheet_no": 5, "first_letter": "F"}, {"id": 342, "orig_slot": "#430", "idiom": "Far cry from", "meaning": "Very different from.", "thai_idiom": "ห่างไกลจาก / ผิดลิบลับ / แตกต่างกันราวฟ้ากับเหว", "thai_meaning": "แตกต่างจากสิ่งที่คาดหวังหรือสิ่งที่เคยเป็นอยู่อย่างสิ้นเชิง", "ex1_en": "The cramped hotel room with peeling wallpaper was a <span class=\"hl-teal\">far cry from</span> the luxurious seaside suite shown in the glossy brochures.", "ex1_hl": "far cry from", "ex1_th": "ห้องพักโรงแรมที่คับแคบและวอลเปเปอร์ลอกร่อนนั้นผิดลิบลับจากห้องสวีทริมทะเลสุดหรูหราที่โฆษณาไว้ในโบรชัวร์มันวาว", "ex2_en": "This quarter's modest two percent revenue growth is a <span class=\"hl-teal\">far cry from</span> the triple-digit expansion the semiconductor manufacturer projected last spring.", "ex2_hl": "far cry from", "ex2_th": "การเติบโตของรายได้เพียงร้อยละสองในไตรมาสนี้ห่างไกลลิบลับจากการขยายตัวระดับสามหลักที่ผู้ผลิตเซมิคอนดักเตอร์เคยคาดการณ์ไว้เมื่อฤดูใบไม้ผลิที่แล้ว", "slot_num": 430, "sheet_no": 5, "first_letter": "F"}, {"id": 343, "orig_slot": "#431", "idiom": "Get a kick out of", "meaning": "Find something very amusing.", "thai_idiom": "สนุกสนานเพลิดเพลินกับ / รู้สึกขำขันสะใจ", "thai_meaning": "รู้สึกสนุกสนาน เพลิดเพลิน หรือตลกขบขันกับสิ่งใดสิ่งหนึ่งเป็นอย่างมาก", "ex1_en": "Grandpa always <span class=\"hl-teal\">gets a kick out of</span> watching the neighborhood squirrels attempt to raid our supposedly bird-proof feeder.", "ex1_hl": "gets a kick out of", "ex1_th": "คุณตามักจะรู้สึกเพลิดเพลินและขำขันอยู่เสมอเวลาเฝ้าดูกระรอกแถวบ้านพยายามบุกเข้าไปกินอาหารในรางนกที่อ้างว่ากันกระรอกได้", "ex2_en": "Audience members really <span class=\"hl-teal\">got a kick out of</span> the comedian's sharp, satirical impressions of prominent Wall Street tycoons.", "ex2_hl": "got a kick out of", "ex2_th": "ผู้ชมในงานรู้สึกสนุกสนานและถูกใจอย่างยิ่งกับการล้อเลียนเหล่ามหาเศรษฐีแห่งวอลล์สตรีทได้อย่างเจ็บแสบและแยบคายของดาวตลก", "slot_num": 431, "sheet_no": 5, "first_letter": "G"}, {"id": 344, "orig_slot": "#433", "idiom": "Get off on the wrong foot", "meaning": "Start a relationship badly.", "thai_idiom": "เริ่มต้นไม่สวย / ประเดิมก้าวแรกผิดจังหวะ / ตั้งต้นผิดฝาผิดตัว", "thai_meaning": "เริ่มต้นความสัมพันธ์ การทำงาน หรือการปฏิสัมพันธ์ด้วยความเข้าใจผิดหรือความรู้สึกที่ไม่ดีต่อกัน", "ex1_en": "I think we <span class=\"hl-teal\">got off on the wrong foot</span> when my dog accidentally barked at your cat; could I buy you a coffee to make amends?", "ex1_hl": "got off on the wrong foot", "ex1_th": "ฉันคิดว่าเราเริ่มต้นความสัมพันธ์กันไม่ค่อยสวยตอนที่สุนัขของฉันเผลอเห่าใส่แมวของคุณ ฉันขอเลี้ยงกาแฟเพื่อเป็นการผูกมิตรใหม่ได้ไหมครับ", "ex2_en": "The consultancy <span class=\"hl-teal\">got off on the wrong foot</span> with the enterprise client after missing the inaugural milestone deliverable by two full weeks.", "ex2_hl": "got off on the wrong foot", "ex2_th": "บริษัทที่ปรึกษาเริ่มต้นการทำงานกับลูกค้าระดับองค์กรได้ไม่สวยเลย หลังจากส่งมอบผลงานหลักระยะแรกช้ากว่ากำหนดไปถึงสองสัปดาห์เต็ม", "slot_num": 433, "sheet_no": 5, "first_letter": "G"}, {"id": 345, "orig_slot": "#435", "idiom": "Hit the ground running", "meaning": "Start a task with great energy.", "thai_idiom": "พร้อมลุยงานทันที / เครื่องร้อนตั้งแต่เริ่ม / ลุยงานเต็มสูบทันที", "thai_meaning": "เริ่มลงมือทำงานหรือปฏิบัติหน้าที่ใหม่ได้อย่างรวดเร็ว กระตือรือร้น และมีประสิทธิภาพตั้งแต่ก้าวแรกโดยไม่ต้องเสียเวลาปรับตัว", "ex1_en": "After landing in Tokyo, Emma had espresso and <span class=\"hl-teal\">hit the ground running</span>, exploring temples and ramen stalls until late evening.", "ex1_hl": "hit the ground running", "ex1_th": "หลังจ ngs attached", "ex1_th": "เพื่อนบ้านของฉันเสนอให้ยืมเครื่องตัดหญ้าโดยไม่มีเงื่อนไขผูกมัดใดๆ เลย พร้อมบอกว่าให้เก็บไว้ใช้ได้นานเท่าที่ต้องการ", "ex2_en": "The philanthropic foundation awarded an unrestricted ten-million-dollar grant with <span class=\"hl-teal\">no strings attached</span> to accelerate cancer immunology research.", "ex2_hl": "no strings attached", "ex2_th": "มูลนิธิการกุศลมอบทุนวิจัยแบบไม่จำกัดวัตถุประสงค์มูลค่าสิบล้านดอลลาร์โดยไม่มีเงื่อนไขผูกมัดใดๆ เพื่อเร่งผลักดันงานวิจัยด้านภูมิคุ้มกันบำบัดมะเร็ง", "slot_num": 447, "sheet_no": 5, "first_letter": "N"}, {"id": 352, "orig_slot": "#448", "idiom": "Not lift a finger", "meaning": "Not do any work or effort.", "thai_idiom": "ไม่ยอมกระดิกนิ้ว / ไม่ยอมช่วยแม้แต่น้อย / นอนกินแรง", "thai_meaning": "ไม่ยอมให้ความช่วยเหลือ ไม่ลงแรง หรือไม่ช่วยทำงานใดๆ เลยแม้แต่น้อย", "ex1_en": "While the rest of us spent the entire afternoon scrubbing the garage, Kevin sat on the sofa playing video games and <span class=\"hl-teal\">didn't lift a finger</span>.", "ex1_hl": "didn't lift a finger", "ex1_th": "ในขณะที่พวกเราที่เหลือใช้เวลาตลอดทั้งบ่ายขัดทำความสะอาดโรงรถ เควินกลับนั่งเล่นวิดีโอเกมอยู่บนโซฟาโดยไม่ยอมกระดิกนิ้วช่วยแม้แต่นิดเดียว", "ex2_en": "Frontline staff grew deeply resentful because senior management <span class=\"hl-teal\">did not lift a finger</span> to alleviate the severe understaffing crisis during peak season.", "ex2_hl": "did not lift a finger", "ex2_th": "พนักงานระดับปฏิบัติการเกิดความไม่พอใจอย่างรุนแรง เนื่องจากผู้บริหารระดับสูงไม่ยอมกระดิกนิ้วยื่นมือเข้าช่วยบรรเทาวิกฤตขาดแคลนกำลังคนอย่างหนักในช่วงฤดูกาลท่องเที่ยวเลย", "slot_num": 448, "sheet_no": 5, "first_letter": "N"}, {"id": 353, "orig_slot": "#449", "idiom": "On the same wavelength", "meaning": "Think or feel the same.", "thai_idiom": "ใจตรงกัน / คลื่นตรงกัน / เข้าอกเข้าใจกันดี", "thai_meaning": "มีความคิดเห็น ทัศนคติ หรือความรู้สึกที่สอดคล้องตรงกัน ทำให้สื่อสารเข้าใจกันได้ง่าย", "ex1_en": "From the moment we met on the hiking trip, Clara and I were <span class=\"hl-teal\">on the same wavelength</span> about books, travel, and lifestyle choices.", "ex1_hl": "on the same wavelength", "ex1_th": "ตั้งแต่นาทีแรกที่เราพบกันในทริปเดินป่า ฉันกับคลาราก็มีคลื่นความถี่ตรงกัน ทั้งเรื่องรสนิยมหนังสือ การท่องเที่ยว และรูปแบบการใช้ชีวิต", "ex2_en": "The product manager and the lead developer worked brilliantly together because they were completely <span class=\"hl-teal\">on the same wavelength</span> regarding user experience priorities.", "ex2_hl": "on the same wavelength", "ex2_th": "ผู้จัดการผลิตภัณฑ์และหัวหน้านักพัฒนาทำงานร่วมกันได้อย่างยอดเยี่ยม เพราะพวกเขามีแนวคิดตรงกันอย่างสมบูรณ์แบบในเรื่องการจัดลำดับความสำคัญของประสบการณ์ผู้ใช้", "slot_num": 449, "sheet_no": 5, "first_letter": "O"}, {"id": 354, "orig_slot": "#451", "idiom": "Out of this world", "meaning": "Extremely good; amazing.", "thai_idiom": "ยอดเยี่ยมเหนือชั้น / อร่อยเหาะ / สุดยอดมหัศจรรย์", "thai_meaning": "ยอดเยี่ยม มหัศจรรย์ หรืออร่อยเป็นพิเศษจนยากจะหาอะไรมาเทียบได้", "ex1_en": "You have to try the pastry chef's signature mango cheesecake; the silky texture and tart flavor are simply <span class=\"hl-teal\">out of this world</span>.", "ex1_hl": "out of this world", "ex1_th": "เธอต้องลองชีสเค้กมะม่วงซิกเนเจอร์ของเชฟทำขนมหวานคนนี้ให้ได้นะ เนื้อสัมผัสเนียนนุ่มกับรสชาติเปรี้ยวอมหวานมันอร่อยเหาะจนยากจะบรรยายจริงๆ", "ex2_en": "Tech reviewers marveled at the new virtual reality headset, noting that its ultra-high display resolution and spatial audio were <span class=\"hl-teal\">out of this world</span>.", "ex2_hl": "out of this world", "ex2_th": "บรรดานักวิจารณ์สายเทคโนโลยีต่างทึ่งกับแว่นเสมือนจริงรุ่นใหม่ โดยระบุว่าความคมชัดของจอภาพระดับอัลตราและระบบเสียงรอบทิศทางนั้นยอดเยี่ยมเหนือชั้นอย่างแท้จริง", "slot_num": 451, "sheet_no": 5, "first_letter": "O"}, {"id": 355, "orig_slot": "#453", "idiom": "Read the room", "meaning": "Understand the mood or situation around you.", "thai_idiom": "ดูทิศทางลม / ดูกาลเทศะ / อ่านบรรยากาศรอบข้าง", "thai_meaning": "เข้าใจอารมณ์ ความรู้สึก หรือบรรยากาศของคนรอบตัวในสถานการณ์นั้นๆ เพื่อปฏิบัติตัวได้อย่างเหมาะสม", "ex1_en": "When everyone fell silent after the sad news about Grandpa, Jake failed to <span class=\"hl-teal\">read the room</span> and blurted out an insensitive joke.", "ex1_hl": "read the room", "ex1_th": "เมื่อทุกคนตกอยู่ในความเงียบงันหลังจากได้ยินข่าวร้ายเรื่องคุณปู่ เจคกลับไม่อ่านบรรยากาศรอบข้างแล้วโพล่งมุกตลกที่ไม่ดูกาลเทศะออกมา", "ex2_en": "During the tense merger negotiations, the lead mediator carefully <span class=\"hl-teal\">read the room</span> before proposing an alternative valuation model.", "ex2_hl": "read the room", "ex2_th": "ในระหว่างการเจรจาควบรวมกิจการที่ตึงเครียด ผู้ไกล่เกลี่ยหลักได้สังเกตบรรยากาศรอบห้องอย่างถี่ถ้วนก่อนที่จะเสนอแบบจำลองการประเมินมูลค่าทางเลือกใหม่", "slot_num": 453, "sheet_no": 5, "first_letter": "R"}, {"id": 356, "orig_slot": "#458", "idiom": "Shot in the dark", "meaning": "A guess with little chance of being right.", "thai_idiom": "เดาสุ่ม / เดาแบบไม่มีข้อมูล / คาดเดาอย่างไร้ทิศทาง", "thai_meaning": "การคาดเดาหรือพยายามทำสิ่งใดสิ่งหนึ่งโดยไม่มีข้อมูลหรือมีโอกาสถูกต้องน้อยมาก", "ex1_en": "I had no idea which key unlocked the rusty garden shed, so picking the smallest brass one was purely a <span class=\"hl-teal\">shot in the dark</span>.", "ex1_hl": "shot in the dark", "ex1_th": "ฉันไม่รู้เลยว่ากุญแจดอกไหนใช้ไขเพิงสวนที่เป็นสนิมได้ ดังนั้นการหยิบดอกทองเหลืองขนาดเล็กที่สุดจึงเป็นการเดาสุ่มล้วนๆ", "ex2_en": "Without baseline genomic sequencing, prescribing experimental immunotherapy was essentially a <span class=\"hl-teal\">shot in the dark</span> for the clinical trial team.", "ex2_hl": "shot in the dark", "ex2_th": "หากไม่มีข้อมูลการจัดลำดับจีโนมพื้นฐาน การสั่งจ่ายยาภูมิคุ้มกันบำบัดเชิงทดลองก็แทบไม่ต่างจากการเดาสุ่มอย่างไร้หลักฐานสำหรับทีมวิจัยทางคลินิก", "slot_num": 458, "sheet_no": 5, "first_letter": "S"}, {"id": 357, "orig_slot": "#460", "idiom": "Small potatoes", "meaning": "Something unimportant.", "thai_idiom": "เรื่องขี้ปะติ๋ว / เรื่องเล็กน้อย / ของกระจอก", "thai_meaning": "สิ่งหรือเรื่องราวเล็กๆ น้อยๆ ที่ไม่มีความสำคัญ ไม่มีความหมาย หรือมีมูลค่าน้อยเมื่อเทียบกับภาพรวม", "ex1_en": "Losing a ten-dollar parking voucher is <span class=\"hl-teal\">small potatoes</span> compared to losing your passport and wallet on an overseas trip.", "ex1_hl": "small potatoes", "ex1_th": "การทำคูปองจอดรถมูลค่าสิบดอลลาร์หายถือเป็นเรื่องขี้ปะติ๋วไปเลยเมื่อเทียบกับการทำหนังสือเดินทางและกระเป๋าสตางค์หายระหว่างเที่ยวต่างประเทศ", "ex2_en": "The regional branch dispute over office supplies was dismissed as <span class=\"hl-teal\">small potatoes</span> while corporate headquarters battled a multi-billion-dollar patent lawsuit.", "ex2_hl": "small potatoes", "ex2_th": "ข้อพิพาทเรื่องอุปกรณ์สำนักงานในสาขาภูมิภาคถูกมองว่าเป็นเรื่องเล็กน้อยไร้สาระ ในขณะที่สำนักงานใหญ่ขององค์กรกำลังต่อสู้กับคดีฟ้องร้องสิทธิบัตรมูลค่าหลายพันล้านดอลลาร์", "slot_num": 460, "sheet_no": 5, "first_letter": "S"}, {"id": 358, "orig_slot": "#462", "idiom": "Square one", "meaning": "Back to the starting point.", "thai_idiom": "จุดเริ่มต้น / จุดนับหนึ่งใหม่", "thai_meaning": "จุดเริ่มต้นดั้งเดิมหลังจากที่ความพยายามหรือกระบวนการทั้งหมดล้มเหลวลง", "ex1_en": "When the hard drive corrupted before I backed up my thesis draft, I was suddenly thrown right back to <span class=\"hl-teal\">square one</span>.", "ex1_hl": "square one", "ex1_th": "เมื่อฮาร์ดไดรฟ์เกิดเสียหายก่อนที่ฉันจะได้สำรองข้อมูลร่างวิทยานิพนธ์ ฉันก็พบว่าตัวเองต้องย้อนกลับไปจุดเริ่มต้นนับหนึ่งใหม่อย่างกะทันหัน", "ex2_en": "After the candidate drug failed phase three efficacy trials, researchers returned to <span class=\"hl-teal\">square one</span> to synthesize a novel molecular compound.", "ex2_hl": "square one", "ex2_th": "หลังจากยาตัวเลือกไม่ผ่านการทดสอบประสิทธิภาพทางคลินิกระยะที่สาม บรรดานักวิจัยจึงต้องกลับไปสู่จุดเริ่มต้นนับหนึ่งใหม่เพื่อสังเคราะห์สารประกอบโมเลกุลชนิดใหม่", "slot_num": 462, "sheet_no": 5, "first_letter": "S"}, {"id": 359, "orig_slot": "#463", "idiom": "Step out of line", "meaning": "Behave in an unacceptable way.", "thai_idiom": "ล้ำเส้น / นอกลู่นอกทาง / ทำตัวข้ามหน้าข้ามตา", "thai_meaning": "ประพฤติตนไม่เหมาะสม ฝ่าฝืนกฎระเบียบ หรือล้ำเส้นบรรทัดฐานที่วางไว้", "ex1_en": "The camp counselor warned the teenagers that anyone who <span class=\"hl-teal\">stepped out of line</span> after lights-out would lose their weekend swimming privileges.", "ex1_hl": "stepped out of line", "ex1_th": "ผู้ดูแลค่ายเตือนกลุ่มวัยรุ่นว่า ใครก็ตามที่ทำตัวนอกลู่นอกทางหลังจากปิดไฟเข้านอนจะถูกตัดสิทธิ์การลงเล่นน้ำในช่วงสุดสัปดาห์", "ex2_en": "In the strictly hierarchical maritime defense agency, junior naval officers who <span class=\"hl-teal\">step out of line</span> face immediate disciplinary tribunals.", "ex2_hl": "step out of line", "ex2_th": "ในหน่วยงานความมั่นคงทางทะเลที่มีระบบสายการบังคับบัญชาเคร่งครัด นายทหารเรือระดับล่างที่ล้ำเส้นหรือประพฤติผิดวินัยจะต้องเผชิญหน้ากับคณะกรรมการไต่สวนทางวินัยทันที", "slot_num": 463, "sheet_no": 5, "first_letter": "S"}, {"id": 360, "orig_slot": "#468", "idiom": "Take the plunge", "meaning": "Decide to do something difficult or risky.", "thai_idiom": "ตัดสินใจลุย / กล้าเสี่ยงลงมือทำ / ตัดสินใจกระโจนเข้าใส่", "thai_meaning": "ตัดสินใจลงมือทำสิ่งสำคัญที่ท้าทาย ยาก หรือมีความเสี่ยง หลังจากที่ลังเลมานาน", "ex1_en": "After hesitating for two years, Uncle Ben finally <span class=\"hl-teal\">took the plunge</span> and enrolled in culinary school to pursue his passion for pastry.", "ex1_hl": "took the plunge", "ex1_th": "หลังจากลังเลมานานถึงสองปี ในที่สุดคุณลุงเบนก็ตัดสินใจกล้าเสี่ยงลงมือทำด้วยการสมัครเข้าเรียนโรงเรียนสอนทำอาหารเพื่อสานฝันความชอบด้านขนมอบของเขา", "ex2_en": "Despite fluctuating market volatility, the veteran software architect resigned from his corporate job to <span class=\"hl-teal\">take the plunge</span> into founding an artificial intelligence startup.", "ex2_hl": "take the plunge", "ex2_th": "แม้ตลาดจะมีความผันผวนสูง สถาปนิกซอฟต์แวร์ผู้มากประสบการณ์ก็ตัดสินใจลาออกจากงานประจำเพื่อกล้าเสี่ยงกระโจนเข้าสู่การก่อตั้งสตาร์ทอัปด้านปัญญาประดิษฐ์", "slot_num": 468, "sheet_no": 5, "first_letter": "T"}, {"id": 361, "orig_slot": "#470", "idiom": "The bigger they are, the harder they fall", "meaning": "Powerful people often fail badly.", "thai_idiom": "ยิ่งสูงยิ่งล้มดัง / ยิ่งใหญ่โตเท่าไหร่ เวลาล้มก็ยิ่งเจ็บปวดเท่านั้น", "thai_meaning": "คนที่มีอำนาจ บารมี หรือตำแหน่งสูงส่ง เวลาล้มเหลวหรือพ่ายแพ้มักจะสูญเสียหนักหนาสาหัสกว่าคนทั่วไป", "ex1_en": "When the boastful neighborhood arm-wrestling champion got pinned in three seconds by a scrawny teenager, everyone laughed and muttered, '<span class=\"hl-teal\">The bigger they are, the harder they fall</span>.'", "ex1_hl": "The bigger they are, the harder they fall", "ex1_th": "พอแชมป์งัดข้อประจำหมู่บ้านผู้ชอบคุยโตถูกวัยรุ่นร่างผอมบางกดแขนคว่ำภายในสามวินาที ทุกคนก็หัวเราะแล้วพึมพำกันว่า 'ยิ่งทำตัวยิ่งใหญ่ เวลาล้มหน้าก็ยิ่งแหก'", "ex2_en": "Following the historic bankruptcy of the multinational banking cartel, financial commentators observed that <span class=\"hl-teal\">the bigger they are, the harder they fall</span> during a liquidity freeze.", "ex2_hl": "the bigger they are, the harder they fall", "ex2_th": "หลังจากการล้มละลายครั้งประวัติศาสตร์ของกลุ่มธนาคารพาณิชย์ข้ามชาติ เหล่านักวิเคราะห์การเงินตั้งข้อสังเกตว่ายิ่งเป็นสถาบันการเงินยักษ์ใหญ่ เวลาเผชิญภาวะสภาพคล่องตึงตัวก็ยิ่งล้มดังและพังทลายรุนแรง", "slot_num": 470, "sheet_no": 5, "first_letter": "T"}, {"id": 362, "orig_slot": "#472", "idiom": "The early bird gets the worm", "meaning": "People who act early get the advantage.", "thai_idiom": "นกที่ตื่นเช้าย่อมได้หนอนตัวอ้วน / ใครเริ่มก่อนได้เปรียบ", "thai_meaning": "คนที่ลงมือทำก่อน ตื่นตัวก่อน หรือมาก่อน ย่อมคว้าโอกาสและผลประโยชน์ได้ดีกว่าคนอื่น", "ex1_en": "Liam camped outside the electronics store at dawn on Black Friday and snatched the half-price espresso machine, proving that <span class=\"hl-teal\">the early bird gets the worm</span>.", "ex1_hl": "the early bird gets the worm", "ex1_th": "เลียมไปปักหลักรอหน้าร้านเครื่องใช้ไฟฟ้าตั้งแต่เช้าตรู่ในวันแบล็กแฟรายเดย์และคว้าเครื่องชงกาแฟลดครึ่งราคามาได้ พิสูจน์ให้เห็นว่าใครมาก่อนย่อมได้ของดีก่อนเสมอ", "ex2_en": "In the fast-paced venture capital landscape, fund managers act decisively during seed rounds because <span class=\"hl-teal\">the early bird gets the worm</span> before valuations skyrocket.", "ex2_hl": "the early bird gets the worm", "ex2_th": "ในแวดวงกองทุนร่วมลงทุนที่หมุนเวียนอย่างรวดเร็ว ผู้จัดการกองทุนจะรีบตัดสินใจตั้งแต่รอบระดมทุนตั้งต้น เพราะผู้ที่เข้าลงทุนก่อนย่อมได้เปรียบก่อนที่มูลค่าบริษัทจะพุ่งสูงขึ้น", "slot_num": 472, "sheet_no": 5, "first_letter": "T"}, {"id": 363, "orig_slot": "#473", "idiom": "There's no time like the present", "meaning": "Do it now; don't wait.", "thai_idiom": "ไม่มีเวลาไหนดีไปกว่าตอนนี้ / อย่าผัดวันประกันพรุ่ง", "thai_meaning": "ควรลงมือทำทันที ไม่ควรผลัดวันหรือรอช้า", "ex1_en": "If you’ve been procrastinating on cleaning the garage, grab a broom right now because <span class=\"hl-teal\">there's no time like the present</span>.", "ex1_hl": "there's no time like the present", "ex1_th": "ถ้าเธอผัดวันประกันพรุ่งเรื่องเก็บกวาดโรงรถมานานแล้ว ก็หยิบไม้กวาดตอนนี้เลยดีกว่า เพราะไม่มีเวลาไหนเหมาะไปกว่าตอนนี้อีกแล้ว", "ex2_en": "Rather than waiting for next fiscal year's budget cycle, the board decided that <span class=\"hl-teal\">there's no time like the present</span> to modernize our cybersecurity infrastructure.", "ex2_hl": "there's no time like the present", "ex2_th": "แทนที่จะรอรอบงบประมาณปีหน้า คณะกรรมการบริหารตัดสินใจว่าไม่มีเวลาไหนดีไปกว่าตอนนี้ในการยกระดับโครงสร้างพื้นฐานความมั่นคงปลอดภัยทางไซเบอร์ขององค์กร", "slot_num": 473, "sheet_no": 5, "first_letter": "T"}, {"id": 364, "orig_slot": "#474", "idiom": "Think on your feet", "meaning": "React quickly and cleverly.", "thai_idiom": "แก้ปัญหาเฉพาะหน้าได้อย่างฉับไว / หัวไวไหวพริบดี", "thai_meaning": "คิดและตัดสินใจแก้ไขสถานการณ์ได้อย่างรวดเร็วและชาญฉลาดโดยไม่ต้องเตรียมตัวล่วงหน้า", "ex1_en": "When the birthday cake tipped over right before the guests sang, Maria had to <span class=\"hl-teal\">think on her feet</span> and quickly arranged fresh cupcakes into a festive pyramid.", "ex1_hl": "think on her feet", "ex1_th": "พอเค้กวันเกิดหล่นคว่ำก่อนที่แขกจะทันได้ร้องเพลง มาเรียต้องใช้ไหวพริบแก้ปัญหาเฉพาะหน้าทันควัน โดยรีบนำคัพเค้กสดใหม่มาจัดเรียงเป็นทรงพีระมิดสวยงามแทน", "ex2_en": "Trial lawyers frequently need to <span class=\"hl-teal\">think on their feet</span> when a hostile witness suddenly changes testimony on the stand.", "ex2_hl": "think on their feet", "ex2_th": "ทนายความว่าความในศาลจำเป็นต้องมีไหวพริบแก้ไขสถานการณ์อย่างฉับไวอยู่เสมอ เมื่อพยานฝ่ายตรงข้ามกลับคำให้การกะทันหันบนคอกพยาน", "slot_num": 474, "sheet_no": 5, "first_letter": "T"}, {"id": 365, "orig_slot": "#475", "idiom": "Time and tide wait for no man", "meaning": "Time and opportunities do not wait for anyone.", "thai_idiom": "เวลาและวารีไม่เคยคอยใคร", "thai_meaning": "กาลเวลาและโอกาสผันผ่านไปอย่างรวดเร็วและไม่เคยหยุดรอให้ใครพร้อม", "ex1_en": "Don't spend another month agonizing over submitting your culinary school application; remember that <span class=\"hl-teal\">time and tide wait for no man</span>.", "ex1_hl": "time and tide wait for no man", "ex1_th": "อย่ามัวแต่ลังเลทรมานใจไปอีกเป็นเดือนว่าจะยื่นใบสมัครเรียนทำอาหารดีไหม จำไว้ว่าเวลาและวารีไม่เคยคอยใคร", "ex2_en": "The keynote speaker urged clean-tech innovators to commercialize renewable breakthroughs rapidly, warning that <span class=\"hl-teal\">time and tide wait for no man</span> in the race against global warming.", "ex2_hl": "time and tide wait for no man", "ex2_th": "องค์ปาฐกกระตุ้นเตือนเหล่านักพัฒนานวัตกรรมพลังงานสะอาดให้เร่งนำเทคโนโลยีสู่เชิงพาณิชย์โดยเร็ว พร้อมเตือนว่าเวลาและวารีไม่เคยคอยใครในการแข่งขันเพื่อต่อสู้กับภาวะโลกร้อน", "slot_num": 475, "sheet_no": 5, "first_letter": "T"}, {"id": 366, "orig_slot": "#477", "idiom": "To make matters worse", "meaning": "To make a bad situation worse.", "thai_idiom": "ซ้ำร้าย / หนำซ้ำ / เคราะห์ซ้ำกรรมซัด", "thai_meaning": "ยิ่งไปกว่านั้น หรือทำให้สถานการณ์ที่แย่อยู่แล้วยิ่งเลวร้ายลงไปอีก", "ex1_en": "We missed the last ferry home, and <span class=\"hl-teal\">to make matters worse</span>, my smartphone battery completely died in the freezing wind.", "ex1_hl": "to make matters worse", "ex1_th": "พวกเราตกรถข้ามฟากเที่ยวสุดท้าย และซ้ำร้ายไปกว่านั้น แบตเตอรี่สมาร์ตโฟนของฉันก็ดันหมดเกลี้ยงท่ามกลางลมหนาวเหน็บ", "ex2_en": "The pharmaceutical firm faced a product recall, and <span class=\"hl-teal\">to make matters worse</span>, their chief medical officer abruptly resigned amid regulatory scrutiny.", "ex2_hl": "to make matters worse", "ex2_th": "บริษัทยาแห่งนั้นต้องเผชิญกับการเรียกคืนผลิตภัณฑ์ และซ้ำร้ายไปกว่านั้น ประธานเจ้าหน้าที่ฝ่ายการแพทย์ก็ลาออกกะทันหันขณะถูกหน่วยงานกำกับดูแลตรวจสอบอย่างเข้มงวด", "slot_num": 477, "sheet_no": 5, "first_letter": "T"}, {"id": 367, "orig_slot": "#478", "idiom": "Touch and go", "meaning": "A risky situation with an uncertain outcome.", "thai_idiom": "แขวนอยู่บนเส้นด้าย / ลูกผีลูกคน / ไม่แน่นอนและสุ่มเสี่ยง", "thai_meaning": "สถานการณ์ที่สุ่มเสี่ยง ไม่แน่นอน และคาดเดาผลลัพธ์ได้ยากว่าจะรอดหรือไม่", "ex1_en": "After my grandfather's severe bout of pneumonia, his recovery was <span class=\"hl-teal\">touch and go</span> for nearly a week before his oxygen levels stabilized.", "ex1_hl": "touch and go", "ex1_th": "หลังจากที่คุณปู่ป่วยหนักด้วยโรคปอดบวม อาการของท่านก็อยู่ในขั้นลูกผีลูกคนเกือบหนึ่งสัปดาห์ ก่อนที่ระดับออกซิเจนจะเริ่มคงที่", "ex2_en": "The peace treaty negotiations were <span class=\"hl-teal\">touch and go</span> until the final hour when a compromise on border tariffs was brokered.", "ex2_hl": "touch and go", "ex2_th": "การเจรจาสนธิสัญญาสันติภาพแขวนอยู่บนเส้นด้ายจนถึงชั่วโมงสุดท้าย เมื่อทั้งสองฝ่ายสามารถประนีประนอมเรื่องภาษีศุลกากรชายแดนได้สำเร็จ", "slot_num": 478, "sheet_no": 5, "first_letter": "T"}, {"id": 368, "orig_slot": "#479", "idiom": "Turn the tables", "meaning": "Change a situation to your advantage.", "thai_idiom": "พลิกสถานการณ์กลับมาเป็นต่อ / พลิกเกม / ตลบหลัง", "thai_meaning": "พลิกสถานการณ์จากที่เป็นฝ่ายเสียเปรียบหรือตกเป็นรอง ให้กลับกลายมาเป็นฝ่ายได้เปรียบหรือคุมเกมได้", "ex1_en": "Down two sets in the regional badminton final, Kevin changed his tactics to aggressive smashes and <span class=\"hl-teal\">turned the tables</span> on his opponent.", "ex1_hl": "turned the tables", "ex1_th": "หลังจากตามหลังอยู่ถึงสองเซตในนัดชิงชนะเลิศแบดมินตันระดับภูมิภาค เควินก็เปลี่ยนแผนมาเน้นตบทำแต้มอย่างดุดันจนพลิกสถานการณ์กลับมาเป็นฝ่ายคุมเกมและคว้าชัยไปได้", "ex2_en": "By acquiring the key patent portfolio, the small software startup managed to <span class=\"hl-teal\">turn the tables</span> on the multinational competitor that had threatened to sue them.", "ex2_hl": "turn the tables", "ex2_th": "ด้วยการเข้าซื้อพอร์ตโฟลิโอสิทธิบัตรสำคัญ บริษัทสตาร์ทอัปซอฟต์แวร์ขนาดเล็กจึงสามารถพลิกเกมกลับมาเป็นต่อบริษัทยักษ์ใหญ่ข้ามชาติที่เคยขู่ว่าจะฟ้องร้องพวกเขาได้สำเร็จ", "slot_num": 479, "sheet_no": 5, "first_letter": "T"}, {"id": 369, "orig_slot": "#480", "idiom": "Under pressure", "meaning": "In a stressful situation.", "thai_idiom": "ตกอยู่ภายใต้ความกดดัน / แบกรับความกดดัน", "thai_meaning": "อยู่ในสภาวะที่มีความเครียด ความกดดัน หรือถูกคาดหวังสูง", "ex1_en": "Sam tends to drop things and forget words when he's <span class=\"hl-teal\">under pressure</span>, so we let him take his time during cooking.", "ex1_hl": "under pressure", "ex1_th": "แซมมักจะทำของหล่นมือและนึกคำพูดไม่ออกเวลาที่เขาตกอยู่ภายใต้ความกดดัน พวกเราก็เลยให้เขาทำอาหารไปเรื่อยๆ ตามจังหวะของตัวเอง", "ex2_en": "Air traffic controllers must maintain unwavering focus and make split-second routing decisions while constantly working <span class=\"hl-teal\">under pressure</span>.", "ex2_hl": "under pressure", "ex2_th": "เจ้าหน้าที่ควบคุมการจราจรทางอากาศต้องมีสมาธิแน่วแน่และตัดสินใจกำหนดเส้นทางบินในเสี้ยววินาที ท่ามกลางการปฏิบัติหน้าที่ภายใต้ความกดดันอันมหาศาลตลอดเวลา", "slot_num": 480, "sheet_no": 5, "first_letter": "U"}, {"id": 370, "orig_slot": "#482", "idiom": "Up to the mark", "meaning": "At the right standard.", "thai_idiom": "ได้มาตรฐาน / ถึงเกณฑ์ / ได้ระดับที่คาดหวัง", "thai_meaning": "มีคุณภาพ หรือได้ระดับมาตรฐานตามที่กำหนดไว้หรือเป็นที่น่าพอใจ", "ex1_en": "The renovated kitchen looked lovely, but the plumbing work was definitely not <span class=\"hl-teal\">up to the mark</span> since the tap still leaked.", "ex1_hl": "up to the mark", "ex1_th": "ห้องครัวที่รีโนเวทใหม่ดูสวยงามดี แต่งานเดินท่อประปายังไม่ได้มาตรฐานตามเกณฑ์เลยสักนิด เพราะก๊อกน้ำยังคงมีน้ำหยดรั่วซึมอยู่", "ex2_en": "The audit revealed that several regional supply branches failed to keep their cold-chain storage facilities <span class=\"hl-teal\">up to the mark</span> for pharmaceutical distribution.", "ex2_hl": "up to the mark", "ex2_th": "การตรวจสอบพบว่าสาขาจัดส่งในภูมิภาคหลายแห่งไม่สามารถดูแลรักษาคลังสินค้าควบคุมความเย็นให้ได้มาตรฐานตามเกณฑ์สำหรับการกระจายเวชภัณฑ์", "slot_num": 482, "sheet_no": 5, "first_letter": "U"}, {"id": 371, "orig_slot": "#485", "idiom": "With flying colors", "meaning": "With great success.", "thai_idiom": "อย่างงดงาม / สำเร็จลุล่วงด้วยคะแนนยอดเยี่ยม / ฉลุย", "thai_meaning": "ผ่านหรือทำสำเร็จได้อย่างยอดเยี่ยม โดดเด่น และได้รับชัยชนะหรือคะแนนสูงลิ่ว", "ex1_en": "After cramming complex grammar rules for weeks, Maya passed her Japanese language proficiency test <span class=\"hl-teal\">with flying colors</span>.", "ex1_hl": "with flying colors", "ex1_th": "หลังจากขะมักเขม้นทบทวนไวยากรณ์ยากๆ มาหลายสัปดาห์ มายาก็สอบวัดระดับภาษาญี่ปุ่นผ่านฉลุยด้วยคะแนนระดับยอดเยี่ยม", "ex2_en": "The structural design of the suspension bridge passed rigorous earthquake simulation drills <span class=\"hl-teal\">with flying colors</span>, earning instant municipal approval.", "ex2_hl": "with flying colors", "ex2_th": "การออกแบบโครงสร้างของสะพานแขวนผ่านการทดสอบจำลองแผ่นดินไหวอันเข้มงวดได้อย่างงดงามไร้ที่ติ และได้รับการอนุมัติจากเทศบาลเมืองในทันที", "slot_num": 485, "sheet_no": 5, "first_letter": "W"}, {"id": 372, "orig_slot": "#486", "idiom": "Work like a dog", "meaning": "Work very hard.", "thai_idiom": "ทำง letter": "Y"}, {"id": 374, "orig_slot": "#489", "idiom": "You can't make an omelet without breaking a few eggs", "meaning": "You must accept small losses to achieve something.", "thai_idiom": "การใหญ่จะสำเร็จได้ย่อมต้องยอมแลก / จะทำไข่เจียวก็ต้องยอมตอกไข่", "thai_meaning": "การจะบรรลุเป้าหมายที่สำคัญหรือสร้างความเปลี่ยนแปลง จำเป็นต้องยอมแลก หรือยอมรับความสูญเสีย ความยุ่งยาก หรือผลกระทบข้างเคียงบางอย่าง", "ex1_en": "Our family room is coated in dust and chaotic during the fireplace installation, but <span class=\"hl-teal\">you can't make an omelet without breaking a few eggs</span>.", "ex1_hl": "you can't make an omelet without breaking a few eggs", "ex1_th": "ห้องนั่งเล่นของบ้านเราเต็มไปด้วยฝุ่นและวุ่นวายไปหมดระหว่างช่างติดตั้งเตาผิง แต่งานปรับปรุงมันก็ต้องยอมแลกกับความไม่สะดวกบ้างเป็นธรรมดา", "ex2_en": "Defending the disruptive departmental merger, the chief transformation officer declared that <span class=\"hl-teal\">you can't make an omelet without breaking a few eggs</span> when modernizing corporate culture.", "ex2_hl": "you can't make an omelet without breaking a few eggs", "ex2_th": "ในการชี้แจงการควบรวมแผนกที่สร้างความเปลี่ยนแปลงขนานใหญ่ ประธานเจ้าหน้าที่ฝ่ายปฏิรูปองค์กรกล่าวว่าการจะปรับโฉมวัฒนธรรมองค์กรสู่ยุคใหม่ย่อมต้องยอมแลกกับแรงกระเพื่อมและความยากลำบากบ้าง", "slot_num": 489, "sheet_no": 5, "first_letter": "Y"}, {"id": 375, "orig_slot": "#491", "idiom": "Your guess is as good as mine", "meaning": "I don't know either.", "thai_idiom": "ฉันก็มืดแปดด้านเหมือนกัน / ฉันก็รู้เท่าๆ กับเธอนั่นแหละ", "thai_meaning": "ฉันก็ไม่รู้คำตอบหรือไม่มีข้อมูลเลยเช่นเดียวกัน", "ex1_en": "When Jenny asked me why our cat refused to step inside her brand-new velvet basket, I sighed and said, '<span class=\"hl-teal\">Your guess is as good as mine</span>.'", "ex1_hl": "Your guess is as good as mine", "ex1_th": "พอเจนนี่ถามฉันว่าทำไมเจ้าแมวถึงไม่ยอมก้าวเข้าไปนอนในตะกร้ากำมะหยี่ใบใหม่เอี่ยม ฉันก็ได้แต่ถอนหายใจแล้วบอกว่า 'ฉันก็ไม่รู้พอๆ กับเธอนั่นแหละ'", "ex2_en": "Addressing report _hl": "from pillar to post", "ex1_th": "ฉันต้องวิ่งวุ่นระเห็จระเหินจากที่หนึ่งไปอีกที่หนึ่งตลอดช่วงบ่าย เพียงเพื่อจะขอตราประทับออกใบขับขี่สากลใบใหม่แทนใบเดิม", "ex2_en": "Displaced flood victims voiced deep anger over being shuttled <span class=\"hl-teal\">from pillar to post</span> between uncoordinated disaster relief agencies.", "ex2_hl": "from pillar to post", "ex2_th": "ผู้ประสบภัยน้ำท่วมไร้ที่อยู่อาศัยต่างแสดงความไม่พอใจอย่างรุนแรงที่ถูกโยนส่งต่อไปมาระหว่างหน่วยงานบรรเทาสาธารณภัยที่ขาดการประสานงานร่วมกัน", "slot_num": 496, "sheet_no": 5, "first_letter": "F"}, {"id": 380, "orig_slot": "#497", "idiom": "Hang fire", "meaning": "Delay making a decision.", "thai_idiom": "ชะลอการตัดสินใจ / พักเรื่องไว้ก่อน / ยังไม่รีบดำเนินการ", "thai_meaning": "เลื่อนหรือชะลอการตัดสินใจหรือการลงมือทำออกไปเพื่อรอดูความชัดเจน", "ex1_en": "We decided to <span class=\"hl-teal\">hang fire</span> on repainting the living room until we saw the fabric samples for the new curtains in natural daylight.", "ex1_hl": "hang fire", "ex1_th": "พวกเราตัดสินใจชะลอการทาสีห้องนั่งเล่นไว้ก่อน จนกว่าจะได้ดูตัวอย่างเนื้อผ้าของผ้าม่านชุดใหม่ท่ามกลางแสงธรรมชาติ", "ex2_en": "The investment committee voted to <span class=\"hl-teal\">hang fire</span> regarding the real estate venture until the municipal zoning amendments were formally gazetted.", "ex2_hl": "hang fire", "ex2_th": "คณะกรรมการการลงทุนมีมติให้ชะลอการตัดสินใจเกี่ยวกับโครงการร่วมทุนอสังหาริมทรัพย์เอาไว้ก่อน จนกว่าการแก้ไขข้อกำหนดผังเมืองของเทศบาลจะได้รับการประกาศในราชกิจจานุเบกษาอย่างเป็นทางการ", "slot_num": 497, "sheet_no": 5, "first_letter": "H"}, {"id": 381, "orig_slot": "#498", "idiom": "Keep an eye out", "meaning": "Watch carefully.", "thai_idiom": "คอยสังเกตดู / คอยจับตาดู / สอดส่องมองหา", "thai_meaning": "คอยเฝ้ามองหรือมองหาอย่างระมัดระวังและตั้งใจ", "ex1_en": "While we stroll through the crowded night market, please <span class=\"hl-teal\">keep an eye out</span> for that wooden artisan souvenir shop uncle recommended.", "ex1_hl": "keep an e h out of water</span> when he first tried navigating the crowded subway system in Manhattan.", "ex1_hl": "a fish out of water", "ex1_th": "การเติบโตมาในหมู่บ้านเกษตรกรรมอันเงียบสงบ ทำให้โทบี้รู้สึกเหมือนปลาผิดน้ำเมื่อต้องลองเดินทางด้วยรถไฟใต้ดินที่แสนแออัดในแมนฮัตตันเป็นครั้งแรก", "ex2_en": "During the international diplomacy summit, the newly appointed trade attache looked like <span class=\"hl-teal\">a fish out of water</span> amid the seasoned protocol veterans.", "ex2_hl": "a fish out of water", "ex2_th": "ในการประชุมสุดยอดทางการทูตระหว่างประเทศ ผู้ช่วยทูตพาณิชย์ที่เพิ่งได้รับการแต่งตั้งดูเคอะเขินเหมือนปลาผิดน้ำท่ามกลางผู้เชี่ยวชาญด้านพิธีการทูตมากประสบการณ์", "slot_num": 502, "sheet_no": 6, "first_letter": "A"}, {"id": 384, "orig_slot": "#503", "idiom": "A gift from the gods", "meaning": "Something wonderful.", "thai_idiom": "ลาภลอยฟ้าประทาน / ของขวัญจากสวรรค์ / โชคช่วยอย่างไม่คาดฝัน", "thai_meaning": "สิ่งดีงามอันยอดเยี่ยม หรือโชคลาภที่เกิดขึ้นในจังหวะเวลาที่เหมาะสมอย่างยิ่งราวกับสวรรค์ประทานให้", "ex1_en": "Finding a shaded bench right next to the park lemonade stand on a ninety-degree afternoon was truly <span class=\"hl-teal\">a gift from the gods</span>.", "ex1_hl": "a gift from the gods", "ex1_th": "การได้เจอม้านั่งในร่มไม้ติดกับซุ้มขายน้ำมะนาวในสวนสาธารณะในบ่ายวันที่มีแดดร้อนจัด ถือเป็นลาภลอยฟ้าประทานที่วิเศษจริงๆ", "ex2_en": "For the bankrupt municipal railway, the multimillion-dollar federal transport grant arrived as <span class=\"hl-teal\">a gift from the gods</span>, preventing immediate service shutdown.", "ex2_hl": "a gift from the gods", "ex2_th": "สำหรับกิจการรถไฟของเทศบาลที่กำลังจะล้มละลาย เงินอุดหนุนด้านการขนส่งมูลค่าหลายล้านดอลลาร์จากรัฐบาลกลางเปรียบเสมือนของขวัญจากสวรรค์ที่ช่วยยับยั้งการหยุดให้บริการกะทันหันได้ทันท่วงที", "slot_num": 503, "sheet_no": 6, "first_letter": "A"}, {"id": 385, "orig_slot": "#504", "idiom": "A long shot", "meaning": "Something unlikely to succeed.", "thai_idiom": "โอกาสสำเร็จริบหรี่ / ความหวังอันเลือนราง / เปอร์เซ็น
