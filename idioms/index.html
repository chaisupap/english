เสียงข้างน้อยที่สามารถยับยั้งมติสำคัญได้", "slot_num": 55, "sheet_no": 1, "first_letter": "G"}, {"id": 670, "orig_slot": "Doc #56", "idiom": "Give someone the cold shoulder", "meaning": "ignore someone", "thai_idiom": "เมินใส่ / เย็นชาใส่ / ทำเป็นไม่เห็นหัว", "thai_meaning": "แกล้งทำเป็นเพิกเฉย ไม่พูดจา หรือแสดงท่าทีเย็นชาห่างเหินใส่อย่างจงใจ", "ex1_en": "Ever since our disagreement at lunch yesterday, Nina has been <span class=\"hl-teal\">giving me the cold shoulder</span> and avoiding eye contact.", "ex1_hl": "giving me the cold shoulder", "ex1_th": "ตั้งแต่ที่เรามีความเห็นไม่ลงรอยกันตอนมื้อเที่ยงเมื่อวาน นีน่าก็ทำท่าเย็นชาเมินใส่ฉันแถมยังหลบสายตาตลอดเวลา", "ex2_en": "Diplomatic tensions flared when the host delegation subtly <span class=\"hl-teal\">gave the trade envoy the cold shoulder</span> by seating him at the far corner of the banquet hall.", "ex2_hl": "gave the trade envoy the cold shoulder", "ex2_th": "ความตึงเครียดทางการทูตปะทุขึ้น เมื่อคณะผู้แทนเจ้าภาพแสดงท่าทีเมินเฉยใส่ทูตการค้าอย่างแนบเนียนด้วยการจัดที่นั่งให้ตรงมุมไกลสุดของห้องจัดเลี้ยง", "slot_num": 56, "sheet_no": 1, "first_letter": "G"}, {"id": 671, "orig_slot": "Doc #58", "idiom": "Grasp at straws", "meaning": "try something impossible", "thai_idiom": "คว้าฟางเส้นสุดท้าย / ตะเกียกตะกายจนตรอก / ดิ้นรนอย่างไร้ความหวัง", "thai_meaning": "พยายามหาทางออกหรือหยิบยกข้ออ้างที่แทบไม่มีน้ำหนักมาช่วยตนเองในยามที่หมดหนทาง", "ex1_en": "He claimed his dog ate his homework right before the presentation, but everyone could tell he was just <span class=\"hl-teal\">grasping at straws</span>.", "ex1_hl": "grasping at straws", "ex1_th": "เขาอ้างว่าหมากินการบ้านของเขาก่อนการนำเสนอเริ่มขึ้น แต่ทุกคนดูออกทันทีว่าเขาแค่ตะเกียกตะกายหาข้ออ้างข้างๆ คูๆ เอาตัวรอด", "ex2_en": "Faced with insurmountable witness testimonies, the defense team was clearly <span class=\"hl-teal\">grasping at straws</span> by attacking the credibility of minor procedural timestamps.", "ex2_hl": "grasping at straws", "ex2_th": "เมื่อเผชิญกับคำให้การของพยานที่แน่นหนาเกินจะหักล้าง ทีมทนายจำเลยจึงเห็นได้ชัดว่ากำลังดิ้นรนอย่างไร้ความหวังด้วยการพุ่งเป้าโจมตีความถูกต้องของเวลาประทับตราในขั้นตอนย่อยๆ", "slot_num": 58, "sheet_no": 1, "first_letter": "G"}, {"id": 672, "orig_slot": "Doc #59", "idiom": "Have a ball", "meaning": "enjoy yourself", "thai_idiom": "สนุกสุดเหวี่ยง / เฮฮาปาร์ตี้เต็มที่ / สนุกจนลืมเวลา", "thai_meaning": "สนุกสนานเพลิดเพลินกับกิจกรรมหรือช่วงเวลานั้นๆ อย่างเต็มที่", "ex1_en": "The children really <span class=\"hl-teal\">had a ball</span> racing go-karts and jumping on the giant trampolines at the amusement park.", "ex1_hl": "had a ball", "ex1_th": "พวกเด็กๆ สนุกสุดเหวี่ยงกันมากกับการแข่งรถโกคาร์ตและกระโดดแทรมโพลีนยักษ์ที่สวนสนุก", "ex2_en": "Attendees at the annual charity gala undeniably <span class=\"hl-teal\">had a ball</span> dancing to the live brass band and competing in the silent auction.", "ex2_hl": "had a ball", "ex2_th": "ผู้เข้าร่วมงานกาล่าการกุศลประจำปีต่างสนุกสนานเพลิดเพลินกันอย่างเต็มที่กับการเต้นรำไปกับวงเครื่องเป่าสดและการร่วมประมูลเงียบ", "slot_num": 59, "sheet_no": 1, "first_letter": "H"}, {"id": 673, "orig_slot": "Doc #61", "idiom": "A bed of roses", "meaning": "a very easy life", "thai_idiom": "โรยด้วยกลีบกุหลาบ / ทางที่ราบรื่นสุขสบาย", "thai_meaning": "ชีวิตหรือสถานการณ์ที่ราบรื่น สะดวกสบาย ไร้อุปสรรคขวากหนาม (มักใช้ในรูปปฏิเสธ)", "ex1_en": "Living abroad by yourself is certainly not <span class=\"hl-teal\">a bed of roses</span> when you get sick and have nobody to look after you.", "ex1_hl": "a bed of roses", "ex1_th": "การไปใช้ชีวิตอยู่ต่างประเทศคนเดียวไม่ได้โรยด้วยกลีบกุหลาบอย่างแน่นอน ยามที่คุณล้มป่วยแล้วไม่มีใครคอยดูแล", "ex2_en": "Transitioning from academia to a cutthroat corporate role is seldom <span class=\"hl-teal\">a bed of roses</span>, demanding rapid acclimation to aggressive targets.", "ex2_hl": "a bed of roses", "ex2_th": "การเปลี่ยนสายงานจากแวดวงวิชาการไปสู่โลกธุรกิจที่มีการแข่งขันสูงแทบไม่เคยโรยด้วยกลีบกุหลาบ เพราะต้องปรับตัวเข้ากับเป้าหมายอันกดดันให้ได้โดยเร็ว", "slot_num": 61, "sheet_no": 1, "first_letter": "A"}, {"id": 674, "orig_slot": "Doc #65", "idiom": "Bring to light", "meaning": "make something known", "thai_idiom": "ตีแผ่ความจริง / เปิดโปง / นำมาเปิดเผยสู่สาธารณะ", "thai_meaning": "เปิดเผยเรื่องราว ข้อมูล หรือความจริงที่เคยถูกซุกซ่อนหรือปิดบังไว้ให้กระจ่างแจ้ง", "ex1_en": "Sifting through old family heirlooms in the attic <span class=\"hl-teal\">brought to light</span> a secret love letter written during World War II.", "ex1_hl": "brought to light", "ex1_th": "การรื้อค้นมรดกเก่าแก่ของครอบครัวในห้องใต้หลังคาได้เปิดเผยให้พบกับจดหมายรักลับๆ ที่ถูกเขียนขึ้นในสมัยสงครามโลกครั้งที่สอง", "ex2_en": "A rigorous forensic audit by independent regulators finally <span class=\"hl-teal\">brought to light</span> decades of covert financial mismanagement.", "ex2_hl": "brought to light", "ex2_th": "การตรวจสอบทางนิติวิทยาศาสตร์อย่างเข้มข้นโดยหน่วยงานกำกับดูแลอิสระ ในที่สุดก็ได้ตีแผ่ความจริงเกี่ยวกับการบริหารจัดการทางการเงินที่ผิดพลาดและถูกซุกซ่อนมานานหลายทศวรรษ", "slot_num": 65, "sheet_no": 1, "first_letter": "B"}, {"id": 675, "orig_slot": "Doc #68", "idiom": "Make a silk purse out of a sow's ear", "meaning": "can’t make good use of something bad", "thai_idiom": "ปั้นดินให้เป็นดาวไม่ไหว / ย้อมแมวขายไม่สำเร็จ / เข็นครกขึ้นภูเขา", "thai_meaning": "พยายามทำสิ่งที่ดีเลิศ สวยงาม หรือมีค่าขึ้นมาจากสิ่งที่มีคุณภาพต่ำหรือแย่ตั้งแต่ต้น (มักสื่อว่าเป็นไปไม่ได้)", "ex1_en": "You can touch up this blurry, pixelated phone photo all you want, but you can't <span class=\"hl-teal\">make a silk purse out of a sow's ear</span>.", "ex1_hl": "make a silk purse out of a sow's ear", "ex1_th": "เธอจะแต่งภาพถ่ายมือถือที่ทั้งเบลอทั้งแตกนี้ยังไงก็ได้ตามใจชอบ แต่เธอไม่อาจเสกภาพแย่ๆ ให้กลายเป็นภาพสวยระดับมืออาชีพได้หรอก", "ex2_en": "The chief architect cautioned that extensive renovations could not <span class=\"hl-teal\">make a silk purse out of a sow's ear</span> given the building's compromised structural foundation.", "ex2_hl": "make a silk purse out of a sow's ear", "ex2_th": "หัวหน้าสถาปนิกเตือนว่าการรีโนเวทครั้งใหญ่ก็ไม่อาจปั้นดินให้เป็นดาวได้ เมื่อพิจารณาจากฐานรากของโครงสร้างอาคารที่ชำรุดเสียหายไปแล้ว", "slot_num": 68, "sheet_no": 1, "first_letter": "M"}, {"id": 676, "orig_slot": "Doc #69", "idiom": "Cast a shadow", "meaning": "leave an impression", "thai_idiom": "ทอดเงาทะมึน / บดบังความสุข / ทิ้งรอยด่างพร้อย", "thai_meaning": "สร้างความรู้สึกหม่นหมอง คลางแคลงใจ หรือความเศร้าโศกจนบดบังบรรยากาศหรือสิ่งดีๆ", "ex1_en": "The tragic news of their friend’s accident <span class=\"hl-teal\">cast a shadow</span> over what was meant to be a joyous graduation trip.", "ex1_hl": "cast a shadow", "ex1_th": "ข่าวร้ายเรื่องอุบัติเหตุของเพื่อนสนิทได้ทอดเงาแห่งความเศร้าบดบังบรรยากาศของทริปฉลองเรียนจบที่ควรจะเต็มไปด้วยความสุข", "ex2_en": "Unresolved patent disputes continue to <span class=\"hl-teal\">cast a shadow</span> over the upcoming international merger.", "ex2_hl": "cast a shadow", "ex2_th": "ข้อพิพาทด้านสิทธิบัตรที่ยังหาข้อยุติไม่ได้ยังคงทอดเงาทะมึนและสร้างความคลางแคลงใจต่อการควบรวมกิจการระหว่างประเทศที่กำลังจะเกิดขึ้น", "slot_num": 69, "sheet_no": 1, "first_letter": "C"}, {"id": 677, "orig_slot": "Doc #71", "idiom": "Chase your dreams", "meaning": "work hard for your goals", "thai_idiom": "วิ่งตามความฝัน / ไล่ตามความฝัน", "thai_meaning": "มุ่งมั่น ทุ่มเท และลงมือทำเพื่อบรรลุเป้าหมายหรือความปรารถนาสูงสุดในชีวิต", "ex1_en": "She saved money for three years so she could finally move to Tokyo and <span class=\"hl-teal\">chase her dreams</span> of becoming a concept artist.", "ex1_hl": "chase her dreams", "ex1_th": "เธอเก็บหอมรอมริบมานานถึงสามปี เพื่อที่จะได้ย้ายไปโตเกียวและวิ่งตามความฝันในการเป็นศิลปินคอนเซปต์อาร์ตในที่สุด", "ex2_en": "Mentorship programs in STEM encourage underprivileged students to boldly <span class=\"hl-teal\">chase their dreams</span> in aerospace engineering.", "ex2_hl": "chase their dreams", "ex2_th": "โครงการพี่เลี้ยงในสายวิทย์-คณิตช่วยกระตุ้นให้นักเรียนที่ขาดโอกาสกล้าที่จะมุ่งมั่นไล่ตามความฝันในสาขาวิศวกรรมการบินและอวกาศ", "slot_num": 71, "sheet_no": 1, "first_letter": "C"}, {"id": 678, "orig_slot": "Doc #72", "idiom": "Chip in", "meaning": "contribute something", "thai_idiom": "ลงขัน / ช่วยกันคนละไม้คนละมือ / ช่วยออกเงินสมทบ", "thai_meaning": "ร่วมออกเงิน ช่วยเหลือแรงกาย หรือออกความคิดเห็นเพื่อเป้าหมายร่วมกัน", "ex1_en": "If we all <span class=\"hl-teal\">chip in</span> ten dollars, we can order enough gourmet pizza and wings for the entire party.", "ex1_hl": "chip in", "ex1_th": "ถ้าพวกเราทุกคนช่วยกันลงขันคนละสิบดอลลาร์ เราก็สามารถสั่งพิซซ่าเลิศรสกับปีกไก่ทอดมาเลี้ยงทุกคนในปาร์ตี้ได้อย่างเหลือเฟือ", "ex2_en": "Several prominent philanthropic foundations <span class=\"hl-teal\">chipped in</span> to construct the regional pediatric research center.", "ex2_hl": "chipped in", "ex2_th": "มูลนิธิเพื่อการกุศลชั้นนำหลายแห่งได้ร่วมลงขันสนับสนุนงบประมาณเพื่อก่อสร้างศูนย์วิจัยกุมารเวชศาสตร์ประจำภูมิภาค", "slot_num": 72, "sheet_no": 1, "first_letter": "C"}, {"id": 679, "orig_slot": "Doc #73", "idiom": "Clear the air", "meaning": "solve a problem", "thai_idiom": "ปรับความเข้าใจ / เคลียร์ใจ / สลายความอึดอัดข้องใจ", "thai_meaning": "พูดคุยเปิดอกเพื่อขจัดความตึงเครียด ความเข้าใจผิด หรือข้อบาดหมางที่ค้างคาใจให้หมดไป", "ex1_en": "After two days of silent treatment, Leo texted me asking if we could meet for coffee to <span class=\"hl-teal\">clear the air</span>.", "ex1_hl": "clear the air", "ex1_th": "หลังจากทำสงครามประสาทไม่คุยกันมาสองวัน ลีโอก็ส่งข้อความมาถามฉันว่าพอจะออกมาเจอกันเพื่อดื่มกาแฟปรับความเข้าใจเคลียร์ใจกันได้ไหม", "ex2_en": "The managing partner held an extraordinary board meeting to address employee grievances and <span class=\"hl-teal\">clear the air</span> before quarterly evaluations.", "ex2_hl": "clear the air", "ex2_th": "หุ้นส่วนผู้จัดการจัดประชุมบอร์ดนัดพิเศษเพื่อรับฟังข้อข้องใจของพนักงานและปรับความเข้าใจให้โปร่งใส ก่อนเริ่มการประเมินผลงานประจำไตรมาส", "slot_num": 73, "sheet_no": 1, "first_letter": "C"}, {"id": 680, "orig_slot": "Doc #74", "idiom": "Come out of nowhere", "meaning": "appear suddenly", "thai_idiom": "โผล่มาแบบไม่มีปี่มีขลุ่ย / เกิดขึ้นอย่างไม่ทันตั้งตัว / โผล่พรวดขึ้นมา", "thai_meaning": "ปรากฏตัวขึ้น หรือเกิดขึ้นอย่างกะทันหันโดยไม่มีวี่แววหรือสัญญาณเตือนล่วงหน้า", "ex1_en": "A stray deer <span class=\"hl-teal\">came out of nowhere</span> onto the foggy highway, forcing me to swerve sharply into the shoulder.", "ex1_hl": "came out of nowhere", "ex1_th": "กวางหลงฝูงตัวหนึ่งโผล่พรวดออกมาแบบไม่มีปี่มีขลุ่ยบนทางหลวงที่มีหมอกลงจัด จนทำให้ฉันต้องหักเลี้ยวหลบลงไหล่ทางอย่างกะทันหัน", "ex2_en": "The startup's revolutionary payment technology seemed to <span class=\"hl-teal\">come out of nowhere</span>, disrupting legacy banking networks within months.", "ex2_hl": "come out of nowhere", "ex2_th": "เทคโนโลยีการชำระเงินอันล้ำสมัยของสตาร์ทอัปรายนี้ดูเหมือนจะผุดขึ้นมาแบบไม่มีปี่มีขลุ่ย และเข้ามาปฏิวัติระบบเครือข่ายธนาคารแบบดั้งเดิมได้ภายในเวลาไม่กี่เดือน", "slot_num": 74, "sheet_no": 1, "first_letter": "C"}, {"id": 681, "orig_slot": "Doc #76", "idiom": "Cross the line", "meaning": "do something wrong", "thai_idiom": "ล้ำเส้น / ข้ามเส้น / เกินขอบเขตที่รับได้", "thai_meaning": "ทำพฤติกรรมหรือพูดจาล่วงเกิน ล้ำเส้น หรือทำในสิ่งที่ไม่เหมาะสมเกินกว่าจะยอมรับได้", "ex1_en": "Playful banter is fine among close friends, but making cruel jokes about his financial struggles definitely <span class=\"hl-teal\">crossed the line</span>.", "ex1_hl": "crossed the line", "ex1_th": "การหยอกล้อขำๆ ในหมู่เพื่อนสนิทน่ะพอไหว แต่การเอาปัญหาการเงินของเขามาล้อเล่นอย่างเจ็บแสบมันล้ำเส้นเกินไปแล้วจริงๆ", "ex2_en": "The ethics committee concluded that the researcher's unauthorized data scraping had clearly <span class=\"hl-teal\">crossed the line</span> of scientific protocol.", "ex2_hl": "crossed the line", "ex2_th": "คณะกรรมการจริยธรรมลงความเห็นว่าการดึงข้อมูลโดยไม่ได้รับอนุญาตของนักวิจัยรายนั้น เป็นการล้ำเส้นระเบียบปฏิบัติด้านการวิจัยทางวิทยาศาสตร์อย่างชัดเจน", "slot_num": 76, "sheet_no": 1, "first_letter": "C"}, {"id": 682, "orig_slot": "Doc #78", "idiom": "Deal with it", "meaning": "handle something", "thai_idiom": "รับมือกับมัน / ทำใจยอมรับ / เผชิญหน้าและจัดการกับมัน", "thai_meaning": "เผชิญหน้า จัดการ หรือยอมรับสภาพกับสถานการณ์ที่ยากลำบากหรือไม่น่าพึงพอใจ", "ex1_en": "Rain is forecast for our entire beach trip, so we just have to pack some board games and <span class=\"hl-teal\">deal with it</span>.", "ex1_hl": "deal with it", "ex1_th": "พยากรณ์อากาศบอกว่าฝนจะตกตลอดทริปเที่ยวทะเลของเรา ดังนั้นพวกเราก็คงต้องพกบอร์ดเกมไปเล่นแล้วทำใจรับมือกับมันให้ได้", "ex2_en": "Currency volatility is an inherent risk in overseas operations, and multinational corporations must deploy currency hedges to <span class=\"hl-teal\">deal with it</span>.", "ex2_hl": "deal with it", "ex2_th": "ความผันผวนของค่าเงินเป็นความเสี่ยงที่ไม่อาจหลีกเลี่ยงได้ในการดำเนินธุรกิจข้ามชาติ และบรรษัทข้ามชาติต้องใช้เครื่องมือป้องกันความเสี่ยงจากอัตราแลกเปลี่ยนเพื่อรับมือกับมัน", "slot_num": 78, "sheet_no": 1, "first_letter": "D"}, {"id": 683, "orig_slot": "Doc #80", "idiom": "Depend on", "meaning": "rely on someone", "thai_idiom": "พึ่งพา / ขึ้นอยู่กับ / ไว้วางใจ", "thai_meaning": "พึ่งพาอาศัย ไว้วางใจ หรือขึ้นอยู่กับเงื่อนไข บุคคล หรือปัจจัยใดปัจจัยหนึ่ง", "ex1_en": "Whenever I feel overwhelmed with stressful situations, I know I can always <span class=\"hl-teal\">depend on</span> my older sister for sensible advice.", "ex1_hl": "depend on", "ex1_th": "เมื่อไหร่ก็ตามที่ฉันรู้สึกเครียดจนรับมือไม่ไหว ฉันรู้ดีเสมอว่าจะสามารถพึ่งพาคำแนะนำที่มีเหตุผลจากพี่สาวคนโตได้แน่นอน", "ex2_en": "The timely completion of the infrastructure corridor will heavily <span class=\"hl-teal\">depend on</span> steady federal disbursements and inter-agency collaboration.", "ex2_hl": "depend on", "ex2_th": "ความสำเร็จตามกำหนดเวลาของระเบียงโครงสร้างพื้นฐานนั้น จะขึ้นอยู่กับการจัดสรรงบประมาณจากส่วนกลางอย่างต่อเนื่องและความร่วมมือระหว่างหน่วยงานเป็นสำคัญ", "slot_num": 80, "sheet_no": 1, "first_letter": "D"}, {"id": 684, "orig_slot": "Doc #81", "idiom": "Die of laughter", "meaning": "laugh very hard", "thai_idiom": "ขำจนกรามค้าง / หัวเราะจนท้องคัดท้องแข็ง / ขำจนแทบขาดใจ", "thai_meaning": "หัวเราะอย่างหนักจนหยุดแทบไม่ได้ หรือรู้สึกตลกขบขันจนสุดจะกลั้น", "ex1_en": "We practically <span class=\"hl-teal\">died of laughter</span> watching my golden retriever attempt to jump onto the slippery inflatable raft.", "ex1_hl": "died of laughter", "ex1_th": "พวกเราแทบจะหัวเราะจนท้องคัดท้องแข็งตอนที่นั่งดูเจ้าโกลเด้น รีทรีฟเวอร์พยายามกระโดดขึ้นไปบนแพยางลื่นๆ", "ex2_en": "Even the customarily stoic delegates nearly <span class=\"hl-teal\">died of laughter</span> when the keynote speaker opened with an unexpected self-deprecating satire.", "ex2_hl": "died of laughter", "ex2_th": "แม้กระทั่งคณะผู้แทนที่มักจะเก็บความรู้สึกก็ยังแทบจะขำจนกรามค้าง เมื่อวิทยากรหลักเปิดการบรรยายด้วยการเสียดสีแซวตัวเองแบบไม่มีใครคาดคิด", "slot_num": 81, "sheet_no": 1, "first_letter": "D"}, {"id": 685, "orig_slot": "Doc #82", "idiom": "Dot your i’s and cross your t’s", "meaning": "be very careful", "thai_idiom": "รอบคอบถี่ถ้วน / ตรวจตราทุกรายละเอียด", "thai_meaning": "ใส่ใจในทุกรายละเอียดอย่างถี่ถ้วนและพิถีพิถันเพื่อไม่ให้เกิดข้อผิดพลาด", "ex1_en": "Before you submit your scholarship application, make sure to <span class=\"hl-teal\">dot your i’s and cross your t’s</span> so it doesn't get rejected over a missing document.", "ex1_hl": "dot your i’s and cross your t’s", "ex1_th": "ก่อนที่คุณจะยื่นใบสมัครขอทุนการศึกษา ตรวจดูรายละเอียดให้รอบคอบถี่ถ้วนนะ จะได้ไม่ถูกคัดออกเพียงเพราะเอกสารไม่ครบ", "ex2_en": "Our corporate legal team spent the entire weekend <span class=\"hl-teal\">dotting the i’s and crossing the t’s</span> on the acquisition contract before Monday's board vote.", "ex2_hl": "dotting the i’s and crossing the t’s", "ex2_th": "ทีมที่ปรึกษากฎหมายของบริษัทใช้เวลาช่วงสุดสัปดาห์ทั้งสัปดาห์ในการตรวจสอบทุกรายละเอียดของสัญญาการเข้าซื้อกิจการอย่างรอบคอบถี่ถ้วน ก่อนการลงมติของคณะกรรมการในวันจันทร์", "slot_num": 82, "sheet_no": 1, "first_letter": "D"}, {"id": 686, "orig_slot": "Doc #84", "idiom": "Draw a line", "meaning": "set a limit", "thai_idiom": "ขีดเส้นคั่น / กำหนดขอบเขต", "thai_meaning": "กำหนดขอบเขตหรือเกณฑ์มาตรฐานอย่างชัดเจนว่าจะไม่ยอมให้ล้ำเส้นไปมากกว่านี้", "ex1_en": "I don't mind lending my roommate clothes occasionally, but I had to <span class=\"hl-teal\">draw a line</span> when she borrowed my tailored blazer without asking.", "ex1_hl": "draw a line", "ex1_th": "ฉันไม่ว่าอะไรเรื่องที่รูมเมทจะยืมเสื้อผ้าบ้างเป็นครั้งคราว แต่ฉันจำเป็นต้องขีดเส้นจำกัดขอบเขตทันทีเมื่อเธอแอบเอาเสื้อเบลเซอร์สั่งตัดของฉันไปใส่โดยไม่บอก", "ex2_en": "Corporate leadership must <span class=\"hl-teal\">draw a clear line</span> between acceptable creative marketing and intentionally misleading product disclosures.", "ex2_hl": "draw a clear line", "ex2_th": "คณะผู้บริหารระดับสูงต้องกำหนดขอบเขตที่ชัดเจนระหว่างการตลาดเชิงสร้างสรรค์ที่ยอมรับได้กับการเปิดเผยข้อมูลผลิตภัณฑ์ที่เจตนาทำให้ผู้บริโภคเข้าใจผิด", "slot_num": 84, "sheet_no": 1, "first_letter": "D"}, {"id": 687, "orig_slot": "Doc #85", "idiom": "Eat humble pie", "meaning": "be very humble", "thai_idiom": "ยอมกลืนน้ำลายตัวเอง / ก้มหน้ารับผิดอย่างจำนน", "thai_meaning": "ยอมรับความผิดพลาดหรือความล้มเหลวของตนเองอย่างจำนนหลังจากที่เคยแสดงความมั่นใจหรือโอ้อวดไว้มาก", "ex1_en": "After bragging all week that he could easily assemble the flat-pack wardrobe alone, Tom had to <span class=\"hl-teal\">eat humble pie</span> and ask his brother for assistance.", "ex1_hl": "eat humble pie", "ex1_th": "หลังจากคุยโวมาทั้งสัปดาห์ว่าเขาสามารถประกอบตู้เสื้อผ้าสำเร็จรูปคนเดียวได้อย่างสบายๆ ทอมก็ต้องยอมกลืนน้ำลายตัวเองแล้วขอให้พี่ชายมาช่วย", "ex2_en": "The tech startup founder was forced to <span class=\"hl-teal\">eat humble pie</span> when independent benchmark audits revealed that their flagship platform suffered from critical latency flaws.", "ex2_hl": "eat humble pie", "ex2_th": "ผู้ก่อตั้งสตาร์ทอัพเทคโนโลยีจำต้องก้มหน้ารับความจริงอย่างจำนน เมื่อผลการตรวจสอบมาตรฐานอิสระเปิดเผยว่า แพลตฟอร์มเรือธงของพวกเขามีข้อบกพร่องร้ายแรงด้านความล่าช้าของระบบ", "slot_num": 85, "sheet_no": 1, "first_letter": "E"}, {"id": 688, "orig_slot": "Doc #86", "idiom": "End of the road", "meaning": "the final point", "thai_idiom": "จุดสิ้นสุด / ทางตัน / วาระสุดท้าย", "thai_meaning": "จุดสิ้นสุดของสถานการณ์ ความสัมพันธ์ โครงการ หรือกระบวนการที่ไม่สามารถดำเนินต่อไปได้อีกแล้ว", "ex1_en": "When the mechanic confirmed that repairing the cracked engine block would exceed the car's market value, we knew our trusty station wagon had reached the <span class=\"hl-teal\">end of the road</span>.", "ex1_hl": "end of the road", "ex1_th": "เมื่อช่างยืนยันว่าค่าซ่อมเสื้อสูบเครื่องยนต์ที่แตกจะแพงเกินกว่ามูลค่าตลาดของตัวรถ เราก็รู้ว่ารถยนต์คันเก่งของเราคงมาถึงจุดสิ้นสุดการใช้งานแล้ว", "ex2_en": "Failing to secure secondary venture funding marked the <span class=\"hl-teal\">end of the road</span> for the ambitious clinical robotics spinoff.", "ex2_hl": "end of the road", "ex2_th": "การไม่สามารถระดมทุนจากกลุ่มทุนร่วมรอบที่สองได้ถือเป็นจุดสิ้นสุดของบริษัทแยกย่อยด้านหุ่นยนต์ทางการแพทย์ที่มีความทะเยอทะยานสูงแห่งนี้", "slot_num": 86, "sheet_no": 1, "first_letter": "E"}, {"id": 689, "orig_slot": "Doc #89", "idiom": "Find your way", "meaning": "discover a solution", "thai_idiom": "หาทางออก / ปรับตัวจนพบทิศทาง / คลำทางจนเจอ", "thai_meaning": "ค้นพบวิธีแก้ปัญหา ปรับตัวได้สำเร็จ หรือค้นพบทิศทางและเป้าหมายที่เหมาะสมในสถานการณ์ใหม่", "ex1_en": "It was overwhelming moving to Montreal without speaking French, but within four months I gradually <span class=\"hl-teal\">found my way</span> and settled into the local rhythm.", "ex1_hl": "found my way", "ex1_th": "การย้ายมามอนทรีออลโดยพูดภาษาฝรั่งเศสไม่ได้เลยเป็นเรื่องที่ท่วมท้นใจมาก แต่ภายในสี่เดือนฉันก็ค่อยๆ ปรับตัวหาทิศทางของตนเองและเข้ากับวิถีชีวิตท้องถิ่นได้", "ex2_en": "With guidance from seasoned mentors, early-career researchers eventually <span class=\"hl-teal\">find their way</span> through competitive grant application cycles.", "ex2_hl": "find their way", "ex2_th": "ด้วยคำแนะนำจากอาจารย์ที่ปรึกษาผู้มีประสบการณ์ นักวิจัยรุ่นใหม่จึงสามารถค้นพบแนวทางและผ่านขั้นตอนการยื่นขอทุนวิจัยที่มีการแข่งขันสูงไปได้อย่างราบรื่น", "slot_num": 89, "sheet_no": 1, "first_letter": "F"}, {"id": 690, "orig_slot": "Doc #90", "idiom": "Fire away", "meaning": "start speaking or asking freely", "thai_idiom": "ถามมาได้เลย / ว่ามาได้เต็มที่ / ยิงคำถามมาเลย", "thai_meaning": "เริ่มพูด ตั้งคำถาม หรือนำเสนอข้อสงสัยได้ทันทีอย่างเปิดกว้างและเป็นกันเอง", "ex1_en": "\"I have a few questions about your travel itinerary for Kyoto,\" Sarah said, and Leo smiled, \"Go ahead, <span class=\"hl-teal\">fire away</span>!\"", "ex1_hl": "fire away", "ex1_th": "\"ฉันมีคำถามสองสามข้อเกี่ยวกับแผนการเดินทางไปเกียวโตของคุณน่ะ\" ซาร่าห์กล่าว และลีโอยิ้มตอบว่า \"ได้เลย ยิงคำถามมาได้เต็มที่!\"", "ex2_en": "At the end of the quarterly investor briefing, the chief financial officer opened the floor and invited analysts to <span class=\"hl-teal\">fire away</span> with questions.", "ex2_hl": "fire away", "ex2_th": "ในช่วงท้ายของการแถลงผลการดำเนินงานประจำไตรมาสแก่นักลงทุน ประธานเจ้าหน้าที่ฝ่ายการเงินได้เปิดเวทีและเชื้อเชิญให้นักวิเคราะห์ซักถามข้อสงสัยได้โดยตรงอย่างเต็มที่", "slot_num": 90, "sheet_no": 1, "first_letter": "F"}, {"id": 691, "orig_slot": "Doc #91", "idiom": "Fit the bill", "meaning": "be suitable", "thai_idiom": "ตอบโจทย์ / ตรงสเปก / เหมาะสมทุกประการ", "thai_meaning": "มีคุณสมบัติครบถ้วนตรงตามเกณฑ์หรือเหมาะสมกับความต้องการอย่างสมบูรณ์แบบ", "ex1_en": "We needed a lightweight, waterproof tent for our backcountry camping trip, and this compact dome shelter completely <span class=\"hl-teal\">fits the bill</span>.", "ex1_hl": "fits the bill", "ex1_th": "พวกเราต้องการเต็นท์น้ำหนักเบาและกันน้ำได้สำหรับทริปแคมปิ้งในป่าลึก และเต็นท์โดมขนาดกะทัดรัดหลังนี้ก็ตอบโจทย์ความต้องการได้ครบถ้วนพอดี", "ex2_en": "With her extensive background in enterprise cloud architecture and cross-border team management, Dr. Chen perfectly <span class=\"hl-teal\">fitted the bill</span> for the Chief Technology Officer role.", "ex2_hl": "fitted the bill", "ex2_th": "ด้วยประสบการณ์อันยาวนานด้านสถาปัตยกรรมคลาวด์ระดับองค์กรและการบริหารทีมข้ามพรมแดน ดร. เฉิน จึงมีคุณสมบัติตรงตามข้อกำหนดทุกประการสำหรับตำแหน่งประธานเจ้าหน้าที่ฝ่ายเทคโนโลยี", "slot_num": 91, "sheet_no": 1, "first_letter": "F"}, {"id": 692, "orig_slot": "Doc #92", "idiom": "Fool’s gold", "meaning": "something that is not real", "thai_idiom": "ภาพลวงตา / ของปลอมที่ดูเหมือนมีค่า / สิ่งหลอกตา", "thai_meaning": "สิ่งของหรือผลกำไรที่ดูเหมือนมีค่าหรือน่าดึงดูดใจในตอนแรก แต่แท้จริงแล้วไม่มีราคา ไร้ประโยชน์ หรือหลอกลวง", "ex1_en": "Investing his college savings into that unverified crypto token turned out to be pure <span class=\"hl-teal\">fool’s gold</span>, as the platform vanished overnight.", "ex1_hl": "fool’s gold", "ex1_th": "การนำเงินเก็บสมัยเรียนมหาวิทยาลัยไปลงทุนในโทเคนคริปโตที่ไม่น่าเชื่อถือกลับกลายเป็นเพียงภาพลวงตาที่ไร้ค่า เมื่อแพลตฟอร์มดังกล่าวปิดตัวหนีไปชั่วข้ามคืน", "ex2_en": "Industry analysts warned that the sudden spike in unmonetized mobile app downloads was <span class=\"hl-teal\">fool’s gold</span>, given the app's negligible user retention rate.", "ex2_hl": "fool’s gold", "ex2_th": "นักวิเคราะห์ในอุตสาหกรรมเตือนว่า ยอดดาวน์โหลดแอปพลิเคชันมือถือที่พุ่งสูงขึ้นอย่างกะทันหันแต่สร้างรายได้ไม่ได้นั้นเป็นเพียงภาพลวงตา เนื่องจากแอปมีอัตราการคงอยู่ของผู้ใช้งานจริงต่ำมาก", "slot_num": 92, "sheet_no": 1, "first_letter": "F"}, {"id": 693, "orig_slot": "Doc #95", "idiom": "Have a heart of gold", "meaning": "be very kind", "thai_idiom": "ใจบุญสุนทาน / จิตใจงดงามประเสริฐ / ใจพระ", "thai_meaning": "เป็นคนมีจิตใจโอบอ้อมอารี มีเมตตากรุณาอย่างยิ่ง และพร้อมจะช่วยเหลือผู้อื่นด้วยความบริสุทธิ์ใจเสมอ", "ex1_en": "Our retired neighbor <span class=\"hl-teal\">has a heart of gold</span>; whenever someone on our street is unwell, she delivers fresh soup and homemade bread.", "ex1_hl": "has a heart of gold", "ex1_th": "คุณป้าข้างบ้านวัยเกษียณของเรามีจิตใจงดงามประเสริฐมาก เมื่อใดก็ตามที่มีใครในซอยล้มป่วย เธอจะนำซุปร้อนๆ และขนมปังโฮมเมดมาส่งให้ถึงหน้าบ้านเสมอ", "ex2_en": "Despite presiding over high-stakes corporate disputes, the presiding arbitrator <span class=\"hl-teal\">had a heart of gold</span>, dedicating pro bono hours each month to juvenile legal clinics.", "ex2_hl": "had a heart of gold", "ex2_th": "แม้ต้องตัดสินข้อพิพาททางธุรกิจที่มีมูลค่ามหาศาล แต่อนุญาโตตุลาการท่านนี้ก็มีจิตใจโอบอ้อมอารีอย่างยิ่ง โดยอุทิศเวลาให้คำปรึกษาทางกฎหมายโดยไม่คิดค่าใช้จ่ายแก่คลินิกกฎหมายเยาวชนเป็นประจำทุกเดือน", "slot_num": 95, "sheet_no": 1, "first_letter": "H"}, {"id": 694, "orig_slot": "Doc #98", "idiom": "Home and dry", "meaning": "safe and sound", "thai_idiom": "ปลอดภัยไร้กังวล / รอดพ้นอุปสรรคเรียบร้อย / สำเร็จลุล่วงไร้ปัญหา", "thai_meaning": "รอดพ้นจากอันตราย ความยากลำบาก หรือบรรลุเป้าหมายได้อย่างปลอดภัยและราบรื่นเรียบร้อย", "ex1_en": "Once our car descended the snowy mountain pass and reached the main paved motorway, we knew we were finally <span class=\"hl-teal\">home and dry</span>.", "ex1_hl": "home and dry", "ex1_th": "เมื่อรถของเราแล่นลงจากช่องเขาที่ปกคลุมด้วยหิมะมาถึงมอเตอร์เวย์ลาดยางสายหลักได้สำเร็จ เราก็รู้ว่าในที่สุดพวกเราก็ปลอดภัยไร้กังวลแล้ว", "ex2_en": "Securing unconditioned regulatory clearance from the health authority meant the clinical trial pipeline was effectively <span class=\"hl-teal\">home and dry</span>.", "ex2_hl": "home and dry", "ex2_th": "การได้รับการอนุมัติด้านกฎระเบียบแบบไม่มีเงื่อนไขจากสำนักงานสาธารณสุข หมายความว่ากระบวนการทดลองทางคลินิกผ่านพ้นอุปสรรคสำคัญและประสบความสำเร็จลุล่วงอย่างปลอดภัย", "slot_num": 98, "sheet_no": 1, "first_letter": "H"}, {"id": 695, "orig_slot": "Doc #101", "idiom": "Jump to conclusions", "meaning": "decide too quickly", "thai_idiom": "ด่วนสรุป / สรุปเอาเองก่อนรู้ความจริง / ตีตนไปก่อนไข้", "thai_meaning": "ตัดสินใจหรือลงความเห็นเกี่ยวกับเรื่องใดเรื่องหนึ่งอย่างรวดเร็วเกินไป ทั้งที่ยังขาดข้อมูลหรือข้อเท็จจริงที่แท้จริง", "ex1_en": "Don't <span class=\"hl-teal\">jump to conclusions</span> about why Marcus missed dinner; his commuter train might have been stalled by the storm.", "ex1_hl": "jump to conclusions", "ex1_th": "อย่าเพิ่งด่วนสรุปไปเองว่าทำไมมาร์คัสถึงไม่มาทานมื้อเย็น รถไฟชานเมืองของเขาอาจจะติดขัดเพราะพายุฝนก็ได้", "ex2_en": "The internal audit committee cautioned executives against <span class=\"hl-teal\">jumping to conclusions</span> before forensic accountants finalized their review of the inventory records.", "ex2_hl": "jumping to conclusions", "ex2_th": "คณะกรรมการตรวจสอบภายในเตือนผู้บริหารว่าอย่าเพิ่งด่วนสรุป ก่อนที่ผู้ตรวจสอบบัญชีนิติวิทยาศาสตร์จะสรุปผลการตรวจสอบบันทึกสินค้าคงคลังอย่างเป็นทางการ", "slot_num": 101, "sheet_no": 2, "first_letter": "J"}, {"id": 696, "orig_slot": "Doc #104", "idiom": "Knock on wood", "meaning": "say it to avoid bad luck", "thai_idiom": "เคาะไม้แก้เคล็ด / ภาวนาอย่าให้มีเรื่องร้าย / ปัดเป่าโชคร้าย", "thai_meaning": "พูดหรือทำท่าเคาะไม้เพื่อป้องกันโชคร้ายหรือสะเดาะเคราะห์ ไม่ให้สิ่งดีๆ ที่เพิ่งพูดถึงกลับกลายเป็นเรื่องร้าย", "ex1_en": "We haven't had a single plumbing leak since replacing the kitchen pipes five years ago, <span class=\"hl-teal\">knock on wood</span>!", "ex1_hl": "knock on wood", "ex1_th": "ท่อน้ำในบ้านเราไม่เคยรั่วซึมเลยสักครั้งตั้งแต่เปลี่ยนท่อในครัวใหม่เมื่อห้าปีก่อน ขอเคาะไม้แก้เคล็ดไว้ก่อนนะ!", "ex2_en": "The regional assembly plant has sustained a zero-incident safety record for eighteen consecutive months—<span class=\"hl-teal\">knock on wood</span>—through stringent procedural enforcement.", "ex2_hl": "knock on wood", "ex2_th": "โรงงานประกอบชิ้นส่วนระดับภูมิภาคสามารถรักษาประวัติด้านความปลอดภัยโดยไม่มีอุบัติเหตุเลยติดต่อกันนาน 18 เดือน—ขอเคาะไม้แก้เคล็ดอย่าให้เกิดเหตุร้าย—ผ่านการบังคับใช้ระเบียบปฏิบัติอย่างเข้มงวด", "slot_num": 104, "sheet_no": 2, "first_letter": "K"}, {"id": 697, "orig_slot": "Doc #108", "idiom": "Like chalk and cheese", "meaning": "completely different", "thai_idiom": "ต่างกันราวฟ้ากับเหว / คนละขั้ว / แตกต่างกันสิ้นเชิง", "thai_meaning": "แตกต่างกันอย่างสิ้นเชิงในทุกด้าน ไม่ว่าจะเป็นบุคลิกภาพ อุปนิสัย หรือรสนิยม จนแทบไม่มีจุดร่วมใดๆ", "ex1_en": "Although they grew up in the same household, the two brothers are <span class=\"hl-teal\">like chalk and cheese</span>: one is an extroverted musician, while the other is a reserved software coder.", "ex1_hl": "like chalk and cheese", "ex1_th": "แม้จะเติบโตมาในบ้านหลังเดียวกัน แต่สองพี่น้องคู่นี้กลับต่างกันคนละขั้ว คนพี่เป็นนักดนตรีที่เปิดเผยเข้ากับคนง่าย ส่วนคนน้องเป็นโปรแกรมเมอร์ที่รักความสงบและเก็บตัว", "ex2_en": "The organizational cultures of the two merging pharmaceutical firms were <span class=\"hl-teal\">like chalk and cheese</span>, triggering significant friction during structural integration.", "ex2_hl": "like chalk and cheese", "ex2_th": "วัฒนธรรมองค์กรของบริษัทยาสองแห่งที่ควบรวมกิจการกันนั้นแตกต่างกันราวฟ้ากับเหว จนก่อให้เกิดความขัดแย้งอย่างมากในระหว่างการรวมโครงสร้างองค์กร", "slot_num": 108, "sheet_no": 2, "first_letter": "L"}, {"id": 698, "orig_slot": "Doc #110", "idiom": "Mind your own business", "meaning": "don’t interfere", "thai_idiom": "อย่ายุ่งเรื่องคนอื่น / ดูแลเรื่องของตัวเอง / อย่าสอดรู้สอดเห็น", "thai_meaning": "อย่าเข้ามายุ่งเกี่ยว สอดรู้สอดเห็น หรือก้าวก่ายในเรื่องส่วนตัวหรือหน้าที่ของผู้อื่น", "ex1_en": "When my inquisitive cousin started interrogating me about my personal savings, I politely told him to <span class=\"hl-teal\">mind his own business</span>.", "ex1_hl": "mind his own business", "ex1_th": "เมื่อลูกพี่ลูกน้องจอมซักไซ้เริ่มซักถามเรื่องเงินเก็บส่วนตัวของฉัน ฉันจึงบอกเขาอย่างสุภาพว่าอย่ายุ่งเรื่องของคนอื่นเลย", "ex2_en": "The managing partner firmly reminded unit leaders to focus on their assigned operational metrics and <span class=\"hl-teal\">mind their own business</span> concerning confidential partner compensation reviews.", "ex2_hl": "mind their own business", "ex2_th": "หุ้นส่วนผู้จัดการได้ย้ำเตือนหัวหน้าแผนกอย่างหนักแน่นให้มุ่งเน้นที่ตัวชี้วัดการดำเนินงานของตนเอง และไม่เข้าไปก้าวก่ายเรื่องการพิจารณาค่าตอบแทนของหุ้นส่วนที่เป็นความลับ", "slot_num": 110, "sheet_no": 2, "first_letter": "M"}, {"id": 699, "orig_slot": "Doc #114", "idiom": "Quantity over quality", "meaning": "focus on quantity, not quality", "thai_idiom": "เน้นปริมาณมากกว่าคุณภาพ / เอาจำนวนเข้าว่า", "thai_meaning": "การให้ความสำคัญกับจำนวนหรือปริมาณของสิ่งของมากกว่ามาตรฐาน คุณค่า หรือความประณีตของผลงาน", "ex1_en": "I prefer curating a capsule wardrobe of durable cotton shirts rather than stuffing my closet by prioritizing <span class=\"hl-teal\">quantity over quality</span>.", "ex1_hl": "quantity over quality", "ex1_th": "ฉันชอบคัดสรรเสื้อเชิ้ตผ้าฝ้ายทนทานไม่กี่ตัวมาจัดเป็นตู้เสื้อผ้าแบบเรียบง่าย มากกว่าจะยัดเสื้อผ้าจนล้นตู้เพราะเน้นปริมาณมากกว่าคุณภาพ", "ex2_en": "Publishing houses that pressure academic researchers into churning out numerous mediocre articles promote an unhealthy cycle of <span class=\"hl-teal\">quantity over quality</span>.", "ex2_hl": "quantity over quality", "ex2_th": "สำนักพิมพ์ที่กดดันให้นักวิจัยผลิตบทความทั่วไปออกมาเป็นจำนวนมาก กำลังส่งเสริมวงจรอันไม่พึงประสงค์ที่เน้นปริมาณมากกว่าคุณภาพในวงการวิชาการ", "slot_num": 114, "sheet_no": 2, "first_letter": "Q"}, {"id": 700, "orig_slot": "Doc #124", "idiom": "Tear someone down", "meaning": "criticize harshly", "thai_idiom": "วิจารณ์เหยียบย่ำ / บั่นทอนกำลังใจ / ตัดแข้งตัดขา", "thai_meaning": "วิพากษ์วิจารณ์อย่างรุนแรง ดูหมิ่น หรือทำลายชื่อเสียงและความมั่นใจของผู้อื่นให้เสื่อมเสีย", "ex1_en": "Instead of offering constructive feedback on her acoustic guitar recording, he unfairly <span class=\"hl-teal\">tore her down</span> with harsh internet comments.", "ex1_hl": "tore her down", "ex1_th": "แทนที่จะให้ข้อเสนอแนะที่สร้างสรรค์ต่อการอัดเสียงกีตาร์โปร่งของเธอ เขากลับวิจารณ์เหยียบย่ำบั่นทอนกำลังใจเธออย่างไม่เป็นธรรมด้วยคอมเมนต์ที่รุนแรงในอินเทอร์เน็ต", "ex2_en": "Destructive managers who consistently <span class=\"hl-teal\">tear employees down</span> during public reviews severely damage team morale and escalate staff turnover.", "ex2_hl": "tear employees down", "ex2_th": "ผู้จัดการที่ชอบทำลายบรรยากาศซึ่งคอยแต่วิจารณ์เหยียบย่ำพนักงานต่อหน้าสาธารณะ จะบั่นทอนขวัญกำลังใจในทีมอย่างรุนแรงและทำให้พนักงานลาออกเพิ่มขึ้น", "slot_num": 124, "sheet_no": 2, "first_letter": "T"}, {"id": 701, "orig_slot": "Doc #125", "idiom": "Tell it like it is", "meaning": "speak honestly", "thai_idiom": "พูดตรงไปตรงมา / พูดเปิดอกตามเนื้อผ้า / พูดความจริงไม่อ้อมค้อม", "thai_meaning": "พูดความจริงอย่างตรงไปตรงมา ชัดเจน ไม่อ้อมค้อม และไม่แต่งเติมหรือบิดเบือนข้อมูลเพื่อเอาใจใคร", "ex1_en": "I rely on Sarah for honest fashion advice because she will always <span class=\"hl-teal\">tell it like it is</span> if an outfit does not suit me.", "ex1_hl": "tell it like it is", "ex1_th": "ฉันพึ่งพาคำแนะนำเรื่องการแต่งตัวจากซาร่าห์เสมอ เพราะเธอเป็นคนพูดตรงไปตรงมาเสมอหากชุดไหนใส่แล้วไม่เข้ากับฉัน", "ex2_en": "During the annual shareholder assembly, the incoming chairperson earned widespread respect by <span class=\"hl-teal\">telling it like it is</span> regarding the division's fiscal hurdles.", "ex2_hl": "telling it like it is", "ex2_th": "ในระหว่างการประชุมสามัญผู้ถือหุ้นประจำปี ประธานกรรมการคนใหม่ได้รับความเคารพนับถืออย่างกว้างขวางจากการพูดตามเนื้อผ้าอย่างตรงไปตรงมาเกี่ยวกับอุปสรรคทางการเงินของแผนก", "slot_num": 125, "sheet_no": 2, "first_letter": "T"}, {"id": 702, "orig_slot": "Doc #130", "idiom": "The more the merrier", "meaning": "more people, more fun", "thai_idiom": "ยิ่งคนเยอะยิ่งสนุก / ยิ่งมากยิ่งดี", "thai_meaning": "การมีคนมาร่วมงานหรือมีจำนวนผู้เข้าร่วมกิจกรรมเพิ่มมากขึ้น จะยิ่งช่วยเพิ่มความสนุกสนานและมีชีวิตชีวา", "ex1_en": "\"Can I invite a couple of my running club buddies to join our Saturday hike?\" asked Ben, and Chloe replied, \"Definitely, <span class=\"hl-teal\">the more the merrier</span>!\"", "ex1_hl": "the more the merrier", "ex1_th": "\"ฉันชวนเพื่อนจากชมรมวิ่งสองสามคนมาร่วมทริปเดินป่าวันเสาร์นี้ด้วยได้ไหม\" เบนถาม และโคลอี้ตอบว่า \"ได้แน่นอนสิ ยิ่งคนเยอะก็ยิ่งสนุก!\"", "ex2_en": "When organizing the community hackathon, sponsors embraced a <span class=\"hl-teal\">the more the merrier</span> philosophy, knowing diverse developer participation yields richer prototype solutions.", "ex2_hl": "the more the merrier", "ex2_th": "ในการจัดงานแฮกกาธอนเพื่อชุมชน ผู้สนับสนุนได้นำแนวคิดที่ว่ายิ่งมีคนเข้าร่วมมากยิ่งดีมาปรับใช้ เพราะตระหนักดีว่าการมีส่วนร่วมของนักพัฒนาที่หลากหลายจะช่วยสร้างสรรค์ต้นแบบผลงานที่สมบูรณ์ยิ่งขึ้น", "slot_num": 130, "sheet_no": 2, "first_letter": "T"}, {"id": 703, "orig_slot": "Doc #131", "idiom": "There's no place like home", "meaning": "home is the best", "thai_idiom": "ไม่มีที่ไหนสุขใจเท่าบ้านเรา / อบอุ่นใจที่สุดในบ้าน", "thai_meaning": "ไม่มีสถานที่หรือดินแดนใดที่จะให้ความอบอุ่น ความปลอดภัย และความสุขสงบในใจได้เท่ากับบ้านของตนเอง", "ex1_en": "After three exhausting weeks of airport layovers and hotel rooms, stepping into my living room reminded me that <span class=\"hl-teal\">there's no place like home</span>.", "ex1_hl": "there's no place like home", "ex1_th": "หลังจากการเดินทางที่เหน็ดเหนื่อยตลอดสามสัปดาห์กับการรอต่อเครื่องบินและนอนโรงแรม การได้ก้าวเท้าเข้าห้องนั่งเล่นของตัวเองก็เตือนให้ฉันรู้ว่า ไม่มีที่ไหนสุขใจเท่าบ้านเราจริงๆ", "ex2_en": "Corporate expatriates returning from multi-year overseas postings frequently confess that while international exposure is invaluable, <span class=\"hl-teal\">there's no place like home</span> for lasting family stability.", "ex2_hl": "there's no place like home", "ex2_th": "พนักงานประจำต่างประเทศที่เดินทางกลับจากการไปประจำการหลายปีมักยอมรับว่า แม้ประสบการณ์ในต่างแดนจะมีค่ายิ่ง แต่ก็ไม่มีที่ไหนจะสร้างความสุขและมั่นคงให้แก่ครอบครัวได้เท่ากับบ้านเกิด", "slot_num": 131, "sheet_no": 2, "first_letter": "T"}, {"id": 704, "orig_slot": "Doc #139", "idiom": "Get a taste of", "meaning": "experience something briefly", "thai_idiom": "ลิ้มลองรสชาติ / สัมผัสประสบการณ์เบื้องต้น / ทดลองสัมผัสด้วยตนเอง", "thai_meaning": "ได้ทดลอง ได้สัมผัส หรือมีประสบการณ์สั้นๆ เกี่ยวกับสิ่งใดสิ่งหนึ่งเพื่อให้เข้าใจความรู้สึกหรือสภาพที่แท้จริง", "ex1_en": "During our brief weekend trip to Milan, we wandered through ancient piazzas to <span class=\"hl-teal\">get a taste of</span> authentic Italian espresso and street life.", "ex1_hl": "get a taste of", "ex1_th": "ในช่วงทริปวันหยุดสุดสัปดาห์สั้นๆ ที่มิลาน พวกเราเดินเล่นไปตามจัตุรัสโบราณเพื่อลิ้มลองรสชาติเอสเปรสโซแท้ๆ สไตล์อิตาลีและสัมผัสวิถีชีวิตริมทาง", "ex2_en": "The summer fellowship allows graduate economics students to <span class=\"hl-teal\">get a taste of</span> central bank monetary policymaking under senior economists.", "ex2_hl": "get a taste of", "ex2_th": "ทุนวิจัยภาคฤดูร้อนเปิดโอกาสให้นักศึกษาปริญญาโทด้านเศรษฐศาสตร์ได้สัมผัสประสบการณ์เบื้องต้นเกี่ยวกับการกำหนดนโยบายการเงินของธนาคารกลางร่วมกับนักเศรษฐศาสตร์อาวุโส", "slot_num": 139, "sheet_no": 2, "first_letter": "G"}, {"id": 705, "orig_slot": "Doc #142", "idiom": "Have a whale of a time", "meaning": "have a great time", "thai_idiom": "สนุกสุดเหวี่ยง / มีช่วงเวลาที่ยอดเยี่ยมเปี่ยมสุข / สนุกสนานเพลิดเพลินเต็มที่", "thai_meaning": "มีช่วงเวลาที่สนุกสนาน เพลิดเพลิน และมีความสุขอย่างล้นพ้นในการทำกิจกรรมใดกิจกรรมหนึ่ง", "ex1_en": "The children <span class=\"hl-teal\">had a whale of a time</span> building elaborate sandcastles and riding gentle ocean waves along the coast.", "ex1_hl": "had a whale of a time", "ex1_th": "เด็กๆ สนุกสนานสุดเหวี่ยงกับการก่อปราสาททรายอันประณีตและเล่นคลื่นทะเลริมชายหาดอย่างเพลิดเพลิน", "ex2_en": "Delegates at the annual renewable energy conference reportedly <span class=\"hl-teal\">had a whale of a time</span> networking during the rooftop gala while discussing cross-border sustainability ventures.", "ex2_hl": "had a whale of a time", "ex2_th": "ผู้แทนในการประชุมพลังงานหมุนเวียนประจำปีต่างได้รับความเพลิดเพลินอย่างยอดเยี่ยมจากการพบปะสร้างเครือข่ายในงานกาล่าบนดาดฟ้า พร้อมทั้งร่วมหารือโครงการความยั่งยืนข้ามพรมแดน", "slot_num": 142, "sheet_no": 2, "first_letter": "H"}, {"id": 706, "orig_slot": "Doc #143", "idiom": "Keep someone in the dark", "meaning": "not tell the truth", "thai_idiom": "ปิดเป็นความลับ / ปิดหูปิดตา / ปิดบังไม่ให้รับรู้", "thai_meaning": "จงใจปกปิดข้อมูล ข้อเท็จจริง หรือสถานการณ์สำคัญไม่ให้อีกฝ่ายรับรู้ ปล่อยให้ไม่รู้อะไรเลย", "ex1_en": "We intentionally <span class=\"hl-teal\">kept Dad in the dark</span> about the surprise anniversary getaway so he wouldn't guess where we were traveling.", "ex1_hl": "kept Dad in the dark", "ex1_th": "พวกเราจงใจปิดเรื่องนี้เป็นความลับไม่ให้พ่อรู้เกี่ยวกับทริปฉลองครบรอบสุดเซอร์ไพรส์ เพื่อไม่ให้ท่านเดาออกว่าเราจะเดินทางไปที่ไหน", "ex2_en": "The investigative audit revealed that senior executives intentionally <span class=\"hl-teal\">kept the board in the dark</span> regarding mounting overseas supply liabilities.", "ex2_hl": "kept the board in the dark", "ex2_th": "ผลการตรวจสอบเชิงลึกพบว่าผู้บริหารระดับสูงจงใจปิดบังข้อมูลไม่ให้คณะกรรมการรับรู้เกี่ยวกับหนี้สินในห่วงโซ่อุปทานต่างประเทศที่พอกพูนขึ้นเรื่อยๆ", "slot_num": 143, "sheet_no": 2, "first_letter": "K"}, {"id": 707, "orig_slot": "Doc #144", "idiom": "Lose your head", "meaning": "become confused", "thai_idiom": "สติแตก / เสียการควบคุมอารมณ์ / ขาดสติจนวู่วาม", "thai_meaning": "สูญเสียการควบคุมสติอารมณ์ ตกใจ ตื่นตระหนก หรือโมโหจนไม่สามารถคิดและกระทำการอย่างมีเหตุผลได้", "ex1_en": "When hot grease splattered onto the kitchen counter, Clara avoided <span class=\"hl-teal\">losing her head</span> and calmly smothered the flame with baking soda.", "ex1_hl": "losing her head", "ex1_th": "เมื่อน้ำมันร้อนกระเด็นติดไฟบนเคาน์เตอร์ครัว คลาร่าไม่ได้สติแตกตื่นตระหนก แต่ใช้เบกกิ้งโซดาดับเปลวไฟอย่างใจเย็น", "ex2_en": "In volatile commodities trading, successful portfolio managers must never <span class=\"hl-teal\">lose their heads</span> during sudden, sharp intraday price corrections.", "ex2_hl": "lose their heads", "ex2_th": "ในการซื้อขายสินค้าโภคภัณฑ์ที่มีความผันผวนสูง ผู้จัดการพอร์ตการลงทุนที่ประสบความสำเร็จจะต้องไม่ขาดสติวู่วามในช่วงที่ราคามีการปรับฐานลดลงอย่างรวดเร็วและรุนแรงระหว่างวัน", "slot_num": 144, "sheet_no": 2, "first_letter": "L"}, {"id": 708, "orig_slot": "Doc #147", "idiom": "Take a breather", "meaning": "rest for a while", "thai_idiom": "พักหายใจหายคอ / หยุดพักชั่วครู่ / พักเอาแรงสักประเดี๋ยว", "thai_meaning": "หยุดพักกิจกรรม งาน หรือการออกแรงชั่วคราวเพื่อคลายความเหนื่อยล้าและฟื้นฟูเรี่ยวแรง", "ex1_en": "After carrying three heavy moving boxes up four flights of apartment stairs, we stepped onto the balcony to <span class=\"hl-teal\">take a breather</span>.", "ex1_hl": "take a breather", "ex1_th": "หลังจากแบกลังย้ายบ้านหนักๆ ขึ้นบันไดอพาร์ตเมนต์มาถึงสี่ชั้น พวกเราก็เดินออกไปที่ระเบียงเพื่อพักหายใจหายคอสักประเดี๋ยว", "ex2_en": "After completing a high-stress regulatory audit that spanned seven months, leadership encouraged the finance department to <span class=\"hl-teal\">take a breather</span> before rolling out the next fiscal forecast.", "ex2_hl": "take a breather", "ex2_th": "หลังจากเสร็จสิ้นการตรวจสอบตามกฎระเบียบอันตึงเครียดยาวนานถึงเจ็ดเดือน ผู้บริหารได้สนับสนุนให้ฝ่ายการเงินหยุดพักผ่อนเอาแรงสักระยะก่อนเริ่มจัดทำประมาณการทางการเงินรอบถัดไป", "slot_num": 147, "sheet_no": 2, "first_letter": "T"}, {"id": 709, "orig_slot": "Doc #150", "idiom": "Weather the storm", "meaning": "survive a difficult time", "thai_idiom": "ฝ่าฟันมรสุม / ยืนหยัดผ่านพ้นวิกฤต / อดทนผ่านความยากลำบาก", "thai_meaning": "อดทน ยืนหยัด และสามารถเอาตัวรอดผ่านพ้นช่วงเวลาที่ยากลำบาก วิกฤตการณ์ หรืออุปสรรคอันตรายมาได้", "ex1_en": "When both partners experienced temporary layoffs during the recession, their family managed to <span class=\"hl-teal\">weather the storm</span> by living frugally.", "ex1_hl": "weather the storm", "ex1_th": "เมื่อทั้งสองคนต้องเผชิญกับการถูกพักงานชั่วคราวในช่วงภาวะเศรษฐกิจถดถอย ครอบครัวของพวกเขาก็สามารถฝ่าฟันมรสุมชีวิตครั้งนั้นมาได้ด้วยการใช้ชีวิตอย่างประหยัด", "ex2_en": "Equipped with strong liquidity reserves and disciplined risk hedging, the regional bank successfully <span class=\"hl-teal\">weathered the storm</span> of fluctuating benchmark interest rates.", "ex2_hl": "weathered the storm", "ex2_th": "ด้วยการมีเงินทุนสภาพคล่องสำรองที่แข็งแกร่งและการประกันความเสี่ยงที่มีวินัย ธนาคารระดับภูมิภาคจึงสามารถยืนหยัดฝ่าฟันมรสุมความผันผวนของอัตราดอกเบี้ยนโยบายมาได้อย่างปลอดภัย", "slot_num": 150, "sheet_no": 2, "first_letter": "W"}, {"id": 710, "orig_slot": "Doc #151", "idiom": "A penny for your thoughts", "meaning": "what are you thinking?", "thai_idiom": "คิดอะไรอยู่หรือ / กำลังเหม่อคิดถึงอะไรอยู่", "thai_meaning": "สำนวนถามอย่างอ่อนโยน เป็นกันเอง หรือแหย่เล่น เมื่อเห็นอีกฝ่ายกำลังนั่งเหม่อลอย นิ่งเงียบ หรือกำลังใช้ความคิดอยู่คนเดียว", "ex1_en": "Noticing that his wife was staring pensively into her coffee cup on the porch, Arthur smiled and whispered, \"<span class=\"hl-teal\">A penny for your thoughts</span>?\"", "ex1_hl": "A penny for your thoughts", "ex1_th": "เมื่อสังเกตเห็นภรรยานั่งมองแก้วกาแฟบนชานเรือนอย่างเหม่อลอยครุ่นคิด อาร์เธอร์จึงยิ้มแล้วกระซิบถามว่า \"กำลังคิดอะไรอยู่หรือจ๊ะ\"", "ex2_en": "During an informal recess between strategic merger talks, the consulting lead sat beside the quiet founder and asked, \"<span class=\"hl-teal\">A penny for your thoughts</span> on the revised valuation model?\"", "ex2_hl": "A penny for your thoughts", "ex2_th": "ในช่วงพักระหว่างการเจรจาควบรวมเชิงกลยุทธ์ หัวหน้าที่ปรึกษาได้นั่งลงข้างผู้ก่อตั้งที่กำลังนิ่งเงียบแล้วเอ่ยถามว่า \"อยากทราบความเห็นของคุณต่อโมเดลประเมินมูลค่ากิจการฉบับปรับปรุงนี้สักหน่อยครับ\"", "slot_num": 151, "sheet_no": 2, "first_letter": "A"}, {"id": 711, "orig_slot": "Doc #154", "idiom": "Bring to the table", "meaning": "offer something valuable", "thai_idiom": "นำข้อได้เปรียบมาเสนอ / มีสิ่งที่มีคุณค่ามาสนับสนุน / สร้างประโยชน์ร่วมกัน", "thai_meaning": "นำเอาทักษะ ประสบการณ์ ทรัพยากร หรือข้อได้เปรียบที่เป็นประโยชน์มาเสนอหรือมอบให้เพื่อร่วมมือกันทำสิ่งใดสิ่งหนึ่ง", "ex1_en": "Each person in our neighborhood committee has unique skills to <span class=\"hl-teal\">bring to the table</span>; Henry handles landscaping, while Maria manages community budgeting.", "ex1_hl": "bring to the table", "ex1_th": "ทุกคนในคณะกรรมการชุมชนของเราต่างมีทักษะเฉพาะตัวที่พร้อมจะนำมาช่วยเหลือส่วนรวม เฮนรีดูแลเรื่องการปรับภูมิทัศน์ ส่วนมาเรียคอยจัดการงบประมาณชุมชน", "ex2_en": "In forming the global research consortium, each biotechnology firm evaluated what proprietary sequencing capabilities partners could <span class=\"hl-teal\">bring to the table</span>.", "ex2_hl": "bring to the table", "ex2_th": "ในการจัดตั้งกลุ่มความร่วมมือด้านการวิจัยระดับโลก บริษัทเทคโนโลยีชีวภาพแต่ละแห่งได้ประเมินว่า พันธมิตรแต่ละรายสามารถนำขีดความสามารถเฉพาะตัวด้านการถอดรหัสพันธุกรรมมาสนับสนุนโครงการร่วมกันได้มากน้อยเพียงใด", "slot_num": 154, "sheet_no": 2, "first_letter": "B"}, {"id": 712, "orig_slot": "Doc #160", "idiom": "Drop in on someone", "meaning": "visit unexpectedly", "thai_idiom": "แวะไปหาโดยไม่ได้นัดล่วงหน้า / แวะเยี่ยมกะทันหัน", "thai_meaning": "แวะไปหาหรือเยี่ยมเยียนใครบางคนช่วงสั้นๆ โดยไม่ได้นัดหมายหรือแจ้งให้ทราบล่วงหน้า", "ex1_en": "While finishing some grocery shopping downtown, I decided to <span class=\"hl-teal\">drop in on my grandparents</span> to see how they were feeling.", "ex1_hl": "drop in on my grandparents", "ex1_th": "ระหว่างที่ไปซื้อของเข้าบ้านในเมือง ฉันตัดสินใจแวะไปเยี่ยมคุณปู่คุณย่าโดยไม่ได้นัดล่วงหน้าเพื่อดูว่าพวกท่านสบายดีไหม", "ex2_en": "Senior territory managers periodically <span class=\"hl-teal\">drop in on retail franchise partners</span> without prior notice to conduct routine merchandising spot checks.", "ex2_hl": "drop in on retail franchise partners", "ex2_th": "ผู้จัดการฝ่ายดูแลพื้นที่ระดับอาวุโสมักจะแวะไปตรวจเยี่ยมพันธมิตรแฟรนไชส์ค้าปลีกโดยไม่ได้แจ้งล่วงหน้าเป็นระยะ เพื่อสุ่มตรวจมาตรฐานการจัดแสดงสินค้าตามปกติ", "slot_num": 160, "sheet_no": 2, "first_letter": "D"}, {"id": 713, "orig_slot": "Doc #161", "idiom": "Eat like a bird", "meaning": "eat very little", "thai_idiom": "กินเหมือนแมวดม / กินน้อยมาก / กินจุบจิบเหมือนนก", "thai_meaning": "รับประทานอาหารในปริมาณที่น้อยมากในแต่ละมื้อ หรือกินเพียงแค่นิดเดียวก็อิ่ม", "ex1_en": "Whenever our family goes out to an all-you-can-eat barbecue, my younger sister <span class=\"hl-teal\">eats like a bird</span>, leaving nearly full plates untouched.", "ex1_hl": "eats like a bird", "ex1_th": "เมื่อใดก็ตามที่ครอบครัวเราไปทานบุฟเฟต์ปิ้งย่าง น้องสาวของฉันมักจะกินน้อยเหมือนแมวดม และแทบจะแตะอาหารในจานไปเพียงนิดเดียวเท่านั้น", "ex2_en": "Occupational health researchers noted that employees undergoing intense stress cycles tend to <span class=\"hl-teal\">eat like a bird</span>, substantially impairing cognitive concentration.", "ex2_hl": "eat like a bird", "ex2_th": "นักวิจัยด้านอาชีวอนามัยระบุว่า พนักงานที่เผชิญกับวงจรความเครียดอย่างหนักมักจะรับประทานอาหารได้น้อยมาก ซึ่งส่งผลเสียอย่างมีนัยสำคัญต่อสมาธิและประสิทธิภาพการทำงานของสมอง", "slot_num": 161, "sheet_no": 2, "first_letter": "E"}, {"id": 714, "orig_slot": "Doc #165", "idiom": "Have a lot on your plate", "meaning": "be very busy", "thai_idiom": "งานล้นมือ / ภาระรัดตัว / มีเรื่องต้องจัดการเต็มไปหมด", "thai_meaning": "มีภาระหน้าที่ งาน หรือปัญหามากมายที่ต้องรับผิดชอบและจัดการในคราวเดียวกันจนแทบไม่มีเวลาว่าง", "ex1_en": "I would love to help you coordinate the alumni party, but I already <span class=\"hl-teal\">have a lot on my plate</span> with relocating flats and prepping for final exams.", "ex1_hl": "have a lot on my plate", "ex1_th": "ฉันอยากจะช่วยเธอประสานงานปาร์ตี้ศิษย์เก่าอยู่นะ แต่ตอนนี้ฉันมีภาระรัดตัวเต็มไปหมด ทั้งเรื่องย้ายหอพักและเตรียมตัวสอบปลายภาค", "ex2_en": "With two concurrent cross-border arbitration hearings scheduled this quarter, the lead corporate attorney already <span class=\"hl-teal\">has a lot on her plate</span> without overseeing new patent filings.", "ex2_hl": "has a lot on her plate", "ex2_th": "ด้วยกำหนดการไต่สวนอนุญาโตตุลาการระหว่างประเทศสองคดีพร้อมกันในไตรมาสนี้ ทนายความองค์กรหัวหน้าทีมจึงมีภาระงานล้นมืออยู่แล้ว โดยไม่สามารถดูแลการยื่นจดสิทธิบัตรใหม่เพิ่มเติมได้อีก", "slot_num": 165, "sheet_no": 2, "first_letter": "H"}, {"id": 715, "orig_slot": "Doc #167", "idiom": "In the same league", "meaning": "equal in ability or status", "thai_idiom": "ระดับเดียวกัน / มวยถูกคู่ / ทัดเทียมกัน", "thai_meaning": "มีความสามารถ คุณภาพ หรือสถานะเทียบเท่ากัน อยู่ในระดับเดียวกัน (มักพบบ่อยในรูปปฏิเสธ not in the same league)", "ex1_en": "Although Mark plays recreational tennis every weekend, he is simply not <span class=\"hl-teal\">in the same league</span> as his brother, who competed at the national collegiate level.", "ex1_hl": "in the same league", "ex1_th": "แม้ว่ามาร์กจะเล่นเทนนิสเพื่อออกกำลังกายทุกสุดสัปดาห์ แต่ฝีมือเขายังเทียบไม่ได้เลยกับพี่ชายที่เคยลงแข่งระดับมหาวิทยาลัยชิงแชมป์ประเทศ", "ex2_en": "Industry analysts argue that the regional boutique agency is not yet <span class=\"hl-teal\">in the same league</span> as global consulting giants when bidding for enterprise contracts.", "ex2_hl": "in the same league", "ex2_th": "นักวิเคราะห์ในอุตสาหกรรมชี้ว่า เอเจนซีบูทีกระดับภูมิภาคแห่งนี้ยังไม่ได้อยู่ในระดับเดียวกับบริษัทยักษ์ใหญ่ด้านที่ปรึกษาระดับโลกเวลาเข้าประมูลสัญญาระดับองค์กร", "slot_num": 167, "sheet_no": 2, "first_letter": "I"}, {"id": 716, "orig_slot": "Doc #172", "idiom": "Move the goalposts", "meaning": "change the rules", "thai_idiom": "เปลี่ยนกติกากลางคัน / เลื่อนเกณฑ์", "thai_meaning": "เปลี่ยนเงื่อนไข กฎเกณฑ์ หรือเป้าหมายอย่างไม่เป็นธรรมระหว่างที่กำลังดำเนินการ เพื่อทำให้บรรลุผลได้ยากขึ้น", "ex1_en": "Every time I save enough money for the used car we agreed on, Dad seems to <span class=\"hl-teal\">move the goalposts</span> by demanding higher grades first.", "ex1_hl": "move the goalposts", "ex1_th": "ทุกครั้งที่ฉันเก็บเงินได้พอซื้อรถมือสองตามที่ตกลงกันไว้ พ่อก็เหมือนจะเปลี่ยนกติกากลางคันโดยเรียกร้องให้ฉันทำเกรดให้สูงขึ้นก่อน", "ex2_en": "Negotiators grew frustrated when the regulatory authority decided to <span class=\"hl-teal\">move the goalposts</span> by introducing stricter carbon emission benchmarks right before final approval.", "ex2_hl": "move the goalposts", "ex2_th": "คณะเจรจาเริ่มหมดความอดทนเมื่อหน่วยงานกำกับดูแลตัดสินใจเลื่อนเกณฑ์กลางคัน โดยเพิ่มเกณฑ์ควบคุมการปล่อยคาร์บอนที่เข้มงวดยิ่งขึ้นก่อนการอนุมัติขั้นสุดท้ายเพียงไม่นาน", "slot_num": 172, "sheet_no": 2, "first_letter": "M"}, {"id": 717, "orig_slot": "Doc #175", "idiom": "Shoot for the stars", "meaning": "aim high", "thai_idiom": "ตั้งเป้าให้สูง / ใฝ่ฝันให้ไกล", "thai_meaning": "ตั้งเป้าหมายชีวิตหรือการทำงานไว้สูงมาก มุ่งมั่นที่จะประสบความสำเร็จอย่างยิ่งใหญ่", "ex1_en": "My drama teacher always encouraged us to <span class=\"hl-teal\">shoot for the stars</span> and audition for prestigious Broadway productions rather than settling for local background roles.", "ex1_hl": "shoot for the stars", "ex1_th": "ครูสอนการแสดงของฉันสนับสนุนให้พวกเราตั้งเป้าให้สูงเสมอ และไปออดิชันสำหรับละครบรอดเวย์ชื่อดัง แทนที่จะยอมรับแค่บทตัวประกอบในท้องถิ่น", "ex2_en": "The founder urged the engineering division to <span class=\"hl-teal\">shoot for the stars</span> by developing an autonomous navigation chip with zero latency.", "ex2_hl": "shoot for the stars", "ex2_th": "ผู้ก่อตั้งกระตุ้นให้ฝ่ายวิศวกรรมตั้งเป้าหมายให้ยิ่งใหญ่ ด้วยการพัฒนาชิประบบนำทางอัตโนมัติที่มีค่าความหน่วงเป็นศูนย์", "slot_num": 175, "sheet_no": 2, "first_letter": "S"}, {"id": 718, "orig_slot": "Doc #183", "idiom": "Get in touch", "meaning": "contact someone", "thai_idiom": "ติดต่อ / ติดต่อสื่อสาร", "thai_meaning": "ติดต่อหรือสื่อสารกับใครบางคน ไม่ว่าจะทางโทรศัพท์ อีเมล หรือพบปะพูดคุย", "ex1_en": "Give me your current phone number before you board the flight so I can <span class=\"hl-teal\">get in touch</span> once your plane lands in Tokyo.", "ex1_hl": "get in touch", "ex1_th": "ขอเบอร์โทรศัพท์ปัจจุบันของเธอไว้หน่อยก่อนขึ้นเครื่อง ฉันจะได้ติดต่อหาเธอได้ทันทีที่เครื่องลงจอดที่โตเกียว", "ex2_en": "Prospective vendors are invited to <span class=\"hl-teal\">get in touch</span> with our procurement department before the submission deadline on Friday.", "ex2_hl": "get in touch", "ex2_th": "ขอเชิญผู้จัดจำหน่ายที่สนใจติดต่อประสานงานกับฝ่ายจัดซื้อของเราก่อนหมดเขตยื่นเอกสารในวันศุกร์นี้", "slot_num": 183, "sheet_no": 2, "first_letter": "G"}, {"id": 719, "orig_slot": "Doc #185", "idiom": "Get rid of", "meaning": "remove something", "thai_idiom": "กำจัด / ทิ้งไป / โละทิ้ง", "thai_meaning": "ทิ้ง ทำลาย หรือกำจัดสิ่งของ คน หรือปัญหาที่ไม่ต้องการให้ออกไปพ้นตัว", "ex1_en": "We spent the entire Sunday afternoon sorting through old attic boxes to <span class=\"hl-teal\">get rid of</span> clothes and broken appliances we hadn't used in a decade.", "ex1_hl": "get rid of", "ex1_th": "พวกเราใช้เวลาตลอดช่วงบ่ายวันอาทิตย์คัดแยกของในกล่องใต้หลังคา เพื่อโละทิ้งเสื้อผ้าเก่าและเครื่องใช้ไฟฟ้าที่พังแล้วซึ่งไม่ได้แตะมานานนับสิบปี", "ex2_en": "The newly appointed CEO implemented lean management practices to <span class=\"hl-teal\">get rid of</span> redundant reporting layers across the supply chain.", "ex2_hl": "get rid of", "ex2_th": "ซีอีโอคนใหม่นำหลักการบริหารแบบลีนมาปรับใช้ เพื่อขจัดขั้นตอนการรายงานที่ซ้ำซ้อนตลอดทั้งห่วงโซ่อุปทาน", "slot_num": 185, "sheet_no": 2, "first_letter": "G"}, {"id": 720, "orig_slot": "Doc #186", "idiom": "Give back", "meaning": "return something", "thai_idiom": "คืน / ตอบแทนคืนสังคม", "thai_meaning": "คืนสิ่งของให้เจ้าของเดิม หรือตอบแทนคุณประโยชน์กลับคืนสู่ชุมชนหรือสังคม", "ex1_en": "Please remember to <span class=\"hl-teal\">give back</span> the lawnmower you borrowed from Uncle Dave before the weekend starts.", "ex1_hl": "give back", "ex1_th": "อย่าลืมนำเครื่องตัดหญ้าที่ยืมลุงเดฟมาไปคืนเขาก่อนจะถึงวันหยุดสุดสัปดาห์นี้นะ", "ex2_en": "Having built a successful biotech enterprise, the philanthropist established a multi-million-dollar scholarship endowment to <span class=\"hl-teal\">give back</span> to underprivileged students in her hometown.", "ex2_hl": "give back", "ex2_th": "หลังจากสร้างธุรกิจเทคโนโลยีชีวภาพจนประสบความสำเร็จ ผู้ใจบุญท่านนี้ได้จัดตั้งกองทุนการศึกษามูลค่าหลายล้านดอลลาร์เพื่อตอบแทนคืนให้แก่นักเรียนที่ขาดแคลนโอกาสในบ้านเกิดของเธอ", "slot_num": 186, "sheet_no": 2, "first_letter": "G"}, {"id": 721, "orig_slot": "Doc #187", "idiom": "Go ahead", "meaning": "proceed", "thai_idiom": "ลงมือทำได้เลย / เชิญเลย / ดำเนินการต่อ", "thai_meaning": "เริ่มต้นทำหรือดำเนินการต่อไป ได้รับอนุญาตให้ทำได้", "ex1_en": "If you're finished with your dinner, feel free to <span class=\"hl-teal\">go ahead</span> and grab some chocolate cake from the kitchen.", "ex1_hl": "go ahead", "ex1_th": "ถ้าเธอกินข้าวเย็นเสร็จแล้ว ก็เชิญหยิบเค้กช็อกโกแลตในครัวมากินได้เลยนะ", "ex2_en": "After reviewing the feasibility audit, the board gave management the formal permission to <span class=\"hl-teal\">go ahead</span> with the semiconductor plant expansion.", "ex2_hl": "go ahead", "ex2_th": "หลังจากพิจารณาผลการตรวจสอบความเป็นไปได้แล้ว คณะกรรมการได้อนุมัติอย่างเป็นทางการให้ฝ่ายบริหารเดินหน้าขยายโรงงานผลิตสารกึ่งตัวนำต่อไป", "slot_num": 187, "sheet_no": 2, "first_letter": "G"}, {"id": 722, "orig_slot": "Doc #190", "idiom": "Hand in", "meaning": "submit something", "thai_idiom": "ส่ง (การบ้าน/เอกสาร/ใบลาออก)", "thai_meaning": "ส่งมอบเอกสาร งานที่ได้รับมอบหมาย หรือสิ่งของให้กับผู้มีอำนาจหรือผู้รับผิดชอบ", "ex1_en": "The professor warned us that anyone who fails to <span class=\"hl-teal\">hand in</span> their term paper by midnight will forfeit ten percent of their grade.", "ex1_hl": "hand in", "ex1_th": "อาจารย์เตือนพวกเราว่าใครก็ตามที่ไม่ส่งรายงานประจำภาคการศึกษาภายในเที่ยงคืนจะถูกหักคะแนนสิบเปอร์เซ็นต์", "ex2_en": "Following the board's vote of no confidence, the chief financial officer felt compelled to <span class=\"hl-teal\">hand in</span> his letter of resignation immediately.", "ex2_hl": "hand in", "ex2_th": "หลังจากการลงมติไม่ไว้วางใจของคณะกรรมการ ประธานเจ้าหน้าที่ฝ่ายการเงินจึงจำต้องยื่นหนังสือลาออกในทันที", "slot_num": 190, "sheet_no": 2, "first_letter": "H"}, {"id": 723, "orig_slot": "Doc #192", "idiom": "Have a heart", "meaning": "be kind", "thai_idiom": "เห็นใจกันบ้าง / มีเมตตา / ใจคอจะไม่ปรานีเลยหรือ", "thai_meaning": "ขอร้องให้มีความเมตตา เห็นอกเห็นใจ หรือผ่อนปรน ไม่ใจจืดใจดำ", "ex1_en": "The stray puppy has been shivering on our porch in the freezing rain all night; please <span class=\"hl-teal\">have a heart</span> and let it warm up inside.", "ex1_hl": "have a heart", "ex1_th": "ลูกหมาจรจัดตัวนั้นนอนสั่นอยู่ตรงเฉลียงท่ามกลางฝนตกหนาวเหน็บมาทั้งคืนแล้ว ได้โปรดเห็นใจมันบ้างและปล่อยให้มันเข้ามาผิงไฟข้างในเถอะ", "ex2_en": "Tenants urged the property management firm to <span class=\"hl-teal\">have a heart</span> and waive late fees during the unprecedented municipal water outage.", "ex2_hl": "have a heart", "ex2_th": "กลุ่มผู้เช่าเรียกร้องให้บริษัทจัดการอสังหาริมทรัพย์มีความเห็นอกเห็นใจ และยกเว้นค่าปรับชำระล่าช้าในช่วงที่ระบบประปาของเทศบาลขัดข้องอย่างไม่เคยปรากฏมาก่อน", "slot_num": 192, "sheet_no": 2, "first_letter": "H"}, {"id": 724, "orig_slot": "Doc #193", "idiom": "Have a word", "meaning": "speak to someone", "thai_idiom": "ขอคุยด้วยหน่อย / ขอพูดคุยเป็นการส่วนตัว", "thai_meaning": "พูดคุยกับใครบางคนเป็นการส่วนตัว มักเป็นการตักเตือน ปรึกษา หรือหารือเรื่องสำคัญ", "ex1_en": "Before we leave for the family reunion, I need to <span class=\"hl-teal\">have a word</span> with Tyler about putting away his video games.", "ex1_hl": "have a word", "ex1_th": "ก่อนที่เราจะออกไปงานรวมญาติ ฉันต้องขอคุยกับไทเลอร์เรื่องเก็บเกมของเขาให้เรียบร้อยเสียก่อน", "ex2_en": "The human resources director asked to <span class=\"hl-teal\">have a word</span> with the project lead concerning repeated boundary violations reported by the junior staff.", "ex2_hl": "have a word", "ex2_th": "ผู้อำนวยการฝ่ายทรัพยากรบุคคลขอพูดคุยเป็นการส่วนตัวกับหัวหน้าโครงการ เกี่ยวกับพฤติกรรมล้ำเส้นซ้ำๆ ที่พนักงานระดับปฏิบัติการรายงานเข้ามา", "slot_num": 193, "sheet_no": 2, "first_letter": "H"}, {"id": 725, "orig_slot": "Doc #194", "idiom": "Have your say", "meaning": "express your opinion", "thai_idiom": "แสดงความคิดเห็น / มีสิทธิ์มีเสียง / ได้พูดในสิ่งที่คิด", "thai_meaning": "มีโอกาสได้แสดงความคิดเห็น ข้อคิดเห็น หรือจุดยืนของตนเองในที่ประชุมหรือการตัดสินใจ", "ex1_en": "Everyone sat in silence during the family meeting so that each child could <span class=\"hl-teal\">have their say</span> on where we should spend summer vacation.", "ex1_hl": "have their say", "ex1_th": "ทุกคนนั่งฟังอย่างเงียบๆ ในที่ประชุมครอบครัว เพื่อให้ลูกแต่ละคนได้แสดงความคิดเห็นว่าอยากไปเที่ยวพักผ่อนช่วงฤดูร้อนที่ไหน", "ex2_en": "The public inquiry invited local community representatives to <span class=\"hl-teal\">have their say</span> on the proposed highway expansion through the wetland reserve.", "ex2_hl": "have their say", "ex2_th": "คณะกรรมการไต่สวนสาธารณะเชิญตัวแทนชุมชนท้องถิ่นมาร่วมแสดงความคิดเห็น เกี่ยวกับโครงการขยายทางหลวงที่เสนอให้ตัดผ่านพื้นที่ชุ่มน้ำอนุรักษ์", "slot_num": 194, "sheet_no": 2, "first_letter": "H"}, {"id": 726, "orig_slot": "Doc #195", "idiom": "Head over heels", "meaning": "very much in love", "thai_idiom": "ตกหลุมรักหัวปักหัวปำ / หลงใหลได้ปลื้ม", "thai_meaning": "ตกหลุมรักใครบางคนอย่างลึกซึ้งและถอนตัวไม่ขึ้น", "ex1_en": "Ever since their first hiking date in the mountains, Julian has been completely <span class=\"hl-teal\">head over heels</span> for Sophia.", "ex1_hl": "head over heels", "ex1_th": "นับตั้งแต่เดตแรกที่ไปเดินป่าปีนเขาด้วยกัน จูเลียนก็ตกหลุมรักโซเฟียแบบหัวปักหัวปำจนถอนตัวไม่ขึ้น", "ex2_en": "In his commemorative anniversary memoir, the diplomat fondly recounted how he fell <span class=\"hl-teal\">head over heels</span> for his future wife while stationed at the embassy in Paris.", "ex2_hl": "head over heels", "ex2_th": "ในบันทึกความทรงจำเนื่องในวันครบรอบ นักการทูตท่านนี้ได้เล่าถึงช่วงเวลาที่เขาตกหลุมรักภรรยาอย่างสุดซึ้งระหว่างประจำการอยู่ที่สถานทูตในกรุงปารีส", "slot_num": 195, "sheet_no": 2, "first_letter": "H"}, {"id": 727, "orig_slot": "Doc #196", "idiom": "Help out", "meaning": "give assistance", "thai_idiom": "ช่วยเหลือ / ยื่นมือเข้าช่วย", "thai_meaning": "ให้ความช่วยเหลือ ช่วยแบ่งเบาภาระในสถานการณ์ใดสถานการณ์หนึ่ง", "ex1_en": "Whenever Aunt Clara hosts Thanksgiving dinner, the cousins always volunteer to chop vegetables and <span class=\"hl-teal\">help out</span> in the kitchen.", "ex1_hl": "help out", "ex1_th": "เมื่อใดก็ตามที่คุณป้าคลาร่าเป็นเจ้าภาพจัดมื้อค่ำวันขอบคุณพระเจ้า เหล่าลูกพี่ลูกน้องก็จะอาสาหั่นผักและช่วยงานในครัวอยู่เสมอ", "ex2_en": "Several experienced software engineers were reassigned to <span class=\"hl-teal\">help out</span> the cyber forensics squad during the ransomware investigation.", "ex2_hl": "help out", "ex2_th": "วิศวกรซอฟต์แวร์ผู้มีประสบการณ์หลายคนได้รับมอบหมายให้ไปช่วยเหลืองานของทีมตรวจสอบนิติวิทยาศาสตร์ไซเบอร์ ในระหว่างการสอบสวนคดีมัลแวร์เรียกค่าไถ่", "slot_num": 196, "sheet_no": 2, "first_letter": "H"}, {"id": 728, "orig_slot": "Doc #201", "idiom": "Horse around", "meaning": "play around", "thai_idiom": "เล่นซุกซน / วิ่งเล่นคะนอง / เล่นแกล้งกันไร้สาระ", "thai_meaning": "เล่นสนุกหรือหยอกล้อกันอย่างคึกคะนอง เอะอะโวยวาย หรือไม่ระมัดระวัง", "ex1_en": "The babysitter sternly ordered the twins to stop <span class=\"hl-teal\">horsing around</span> near the glass coffee table before someone got hurt.", "ex1_hl": "horsing around", "ex1_th": "พี่เลี้ยงเด็กสั่งฝาแฝดด้วยน้ำเสียงจริงจังให้หยุดวิ่งเล่นคะนองใกล้โต๊ะกาแฟกระจก ก่อนที่จะมีใครได้รับบาดเจ็บ", "ex2_en": "The workshop safety instructor cautioned the vocational apprentices that <span class=\"hl-teal\">horsing around</span> with industrial machinery would result in immediate expulsion.", "ex2_hl": "horsing around", "ex2_th": "ครูฝึกความปลอดภัยในโรงฝึกงานเตือนเด็กฝึกงานสายอาชีพว่า การเล่นหยอกล้ออย่างประมาทกับเครื่องจักรโรงงานจะถูกไล่ออกทันที", "slot_num": 201, "sheet_no": 3, "first_letter": "H"}, {"id": 729, "orig_slot": "Doc #206", "idiom": "In the heat of the moment", "meaning": "when emotional", "thai_idiom": "ด้วยอารมณ์ชั่ววูบ / กำลังเลือดขึ้นหน้า / หน้ามืดตามัว", "thai_meaning": "ทำหรือพูดสิ่งใดลงไปเพราะอารมณ์พาไปหรือความโกรธชั่วขณะ โดยไม่ทันคิดไตร่ตรอง", "ex1_en": "I said some hurtful words to my sister <span class=\"hl-teal\">in the heat of the moment</span>, and I regret not keeping my temper under control.", "ex1_hl": "in the heat of the moment", "ex1_th": "ฉันพูดจาทำร้ายจิตใจพี่สาวออกไปด้วยอารมณ์ชั่ววูบ และฉันก็เสียใจมากที่คุมอารมณ์ตัวเองไม่อยู่", "ex2_en": "During heated contract negotiations, the lead union representative threatened a nationwide strike <span class=\"hl-teal\">in the heat of the moment</span>, though formal dialogue resumed the next morning.", "ex2_hl": "in the heat of the moment", "ex2_th": "ระหว่างการเจรจาสัญญาอันดุเดือด ตัวแทนสหภาพแรงงานหลักได้ขู่จะนัดหยุดงานประท้วงทั่วประเทศด้วยอารมณ์ชั่ววูบ แม้ว่าการเจรจาอย่างเป็นทางการจะกลับมาดำเนินต่อในเช้าวันรุ่งขึ้น", "slot_num": 206, "sheet_no": 3, "first_letter": "I"}, {"id": 730, "orig_slot": "Doc #208", "idiom": "Jack of all trades", "meaning": "good at many things", "thai_idiom": "คนรู้รอบด้าน / มนุษย์เป็ด / ทำเป็นสารพัดอย่าง", "thai_meaning": "คนที่มีทักษะหลากหลายด้าน ทำได้หลายอย่าง แม้อาจไม่ได้เชี่ยวชาญเฉพาะทางระดับลึก", "ex1_en": "Our neighbor Uncle Dave is a true <span class=\"hl-teal\">jack of all trades</span>; he can fix your plumbing, tune your motorcycle engine, and bake sourdough bread from scratch.", "ex1_hl": "jack of all trades", "ex1_th": "ลุงเดฟเพื่อนบ้านของเราเป็นคนทำเป็นสารพัดอย่างจริงๆ เขาซ่อมท่อประปา จูนเครื่องมอเตอร์ไซค์ แถมยังอบขนมปังซาวโดว์เองตั้งแต่ต้นได้อีกด้วย", "ex2_en": "Early-stage tech startups frequently seek a <span class=\"hl-teal\">jack of all trades</span> who can handle front-end development, graphic design, and basic server operations simultaneously.", "ex2_hl": "jack of all trades", "ex2_th": "บริษัทสตาร์ตอัปเทคโนโลยีในระยะเริ่มต้นมักมองหาบุคลากรที่มีทักษะรอบด้าน ซึ่งสามารถดูแลการพัฒนาหน้าบ้าน ออกแบบกราฟิก และจัดการระบบเซิร์ฟเวอร์เบื้องต้นไปพร้อมๆ กันได้", "slot_num": 208, "sheet_no": 3, "first_letter": "J"}, {"id": 731, "orig_slot": "Doc #211", "idiom": "Keep your nose clean", "meaning": "avoid trouble", "thai_idiom": "ทำตัวให้เรียบร้อย / ไม่แกว่งเท้าหาเสี้ยน / อย่าไปก่อเรื่อง", "thai_meaning": "ประพฤติตัวดี อยู่ในกรอบระเบียบ หลีกเลี่ยงปัญหาหรือการกระทำที่ผิดกฎหมาย", "ex1_en": "After getting a stern warning from the traffic officer, Leo promised his parents he would <span class=\"hl-teal\">keep his nose clean</span> and drive within the speed limit.", "ex1_hl": "keep his nose clean", "ex1_th": "หลังจากถูกตำรวจจราจรตักเตือนอย่างจริงจัง ลีโอก็สัญญาพ่อแม่ว่าจะทำตัวเรียบร้อยและขับรถไม่เกินอัตราความเร็วที่กำหนด", "ex2_en": "The parole board stated that the inmate would be granted early release provided he demonstrated steady employment and <span class=\"hl-teal\">kept his nose clean</span> for eighteen consecutive months.", "ex2_hl": "kept his nose clean", "ex2_th": "คณะกรรมการพักการลงโทษระบุว่า ผู้ต้องขังจะได้รับการปล่อยตัวก่อนกำหนด หากแสดงให้เห็นว่ามีงานทำที่มั่นคงและไม่ก่อเรื่องใดๆ ติดต่อกันเป็นเวลาสิบแปดเดือน", "slot_num": 211, "sheet_no": 3, "first_letter": "K"}, {"id": 732, "orig_slot": "Doc #214", "idiom": "Knock at the door", "meaning": "try to get something", "thai_idiom": "เคาะประตูหาโอกาส / แสวงหาโอกาส / เข้าหาเพื่อขอโอกาส", "thai_meaning": "พยายามติดต่อหรือเข้าหาบุคคล องค์กร เพื่อแสวงหาโอกาส งาน หรือความช่วยเหลือ", "ex1_en": "After months of unemployment, Marcus decided to <span class=\"hl-teal\">knock at the door</span> of every local independent bakery until someone offered him an apprentice position.", "ex1_hl": "knock at the door", "ex1_th": "หลังจากว่างงานมาหลายเดือน มาร์คัสจึงตัดสินใจตระเวนเคาะประตูหาโอกาสตามร้านเบเกอรีอิสระในท้องถิ่นทุกแห่ง จนกระทั่งมีร้านยอมรับเขาเป็นเด็กฝึกงาน", "ex2_en": "Venture-backed entrepreneurs cannot simply wait for capital; they must actively <span class=\"hl-teal\">knock at the door</span> of institutional investors with rigorous pitch decks.", "ex2_hl": "knock at the door", "ex2_th": "ผู้ประกอบการสตาร์ตอัปไม่สามารถแค่นั่งรอเงินทุนได้ พวกเขาต้องเป็นฝ่ายเดินหน้าเคาะประตูแสวงหาโอกาสจากกลุ่มนักลงทุนสถาบันด้วยเอกสารนำเสนอแผนธุรกิจที่รัดกุม", "slot_num": 214, "sheet_no": 3, "first_letter": "K"}, {"id": 733, "orig_slot": "Doc #243", "idiom": "Talk shop", "meaning": "discuss work or business", "thai_idiom": "คุยเรื่องงาน / พูดแต่เรื่องงาน", "thai_meaning": "พูดคุยเกี่ยวกับเรื่องงาน วิชาชีพ หรือธุรกิจ โดยเฉพาะอย่างยิ่งในเวลานอกเวลางานหรืองานสังสรรค์", "ex1_en": "We invited our coworkers over for a relaxing barbecue, but before long, they started to <span class=\"hl-teal\">talk shop</span> about quarterly quotas and client complaints.", "ex1_hl": "talk shop", "ex1_th": "พวกเราชวนเพื่อนร่วมงานมาปิ้งบาร์บีคิวพักผ่อนกัน แต่ไม่ทันไร พวกเขาก็เริ่มคุยแต่เรื่องงานเกี่ยวกับเป้ายอดขายรายไตรมาสและข้อร้องเรียนของลูกค้า", "ex2_en": "During the cocktail reception following the scientific symposium, researchers gathered around the terrace to <span class=\"hl-teal\">talk shop</span> and explore potential joint clinical trials.", "ex2_hl": "talk shop", "ex2_th": "ในระหว่างงานเลี้ยงค็อกเทลหลังการประชุมวิชาการ นักวิจัยได้มารวมตัวกันที่ระเบียงเพื่อแลกเปลี่ยนเรื่องงานและสำรวจโอกาสในการร่วมมือทำการทดลองทางคลินิก", "slot_num": 243, "sheet_no": 3, "first_letter": "T"}, {"id": 734, "orig_slot": "Doc #244", "idiom": "Tease someone", "meaning": "make fun of someone playfully", "thai_idiom": "แซว / ล้อเล่น / แหย่เล่น", "thai_meaning": "หยอกล้อ ล้อเลียน หรือแกล้งพูดแซวใครบางคนอย่างเป็นกันเองและสนุกสนาน", "ex1_en": "The kids couldn't help but <span class=\"hl-teal\">tease Toby</span> about his mismatched neon socks, though everyone was laughing good-naturedly.", "ex1_hl": "tease Toby", "ex1_th": "เด็กๆ อดไม่ได้ที่จะแซวโทบี้เรื่องถุงเท้าสีนีออนคนละข้าง แต่ทุกคนก็แค่หัวเราะหยอกล้อกันอย่างเป็นมิตร", "ex2_en": "The senior partners would occasionally <span class=\"hl-teal\">tease junior associates</span> about their nervous courtroom mannerisms to help them relax before oral arguments.", "ex2_hl": "tease junior associates", "ex2_th": "หุ้นส่วนอาวุโสมักจะแกล้งแซวทนายความรุ่นน้องเกี่ยวกับท่าทางประหม่าในห้องพิจารณาคดีเป็นบางครั้ง เพื่อช่วยคลายความตึงเครียดก่อนเริ่มการแถลงปิดคดีด้วยวาจา", "slot_num": 244, "sheet_no": 3, "first_letter": "T"}, {"id": 735, "orig_slot": "Doc #246", "idiom": "The bottom line", "meaning": "the most important point", "thai_idiom": "ประเด็นสำคัญที่สุด / สรุปสาระสำคัญ / ผลลัพธ์สุดท้าย", "thai_meaning": "ข้อเท็จจริงพื้นฐานที่สำคัญที่สุด ข้อสรุปชี้ขาด หรือผลกำไรขาดทุนสุทธิ", "ex1_en": "You can debate the design aesthetics all night, but <span class=\"hl-teal\">the bottom line</span> is that the new refrigerator won't fit through our kitchen doorway.", "ex1_hl": "the bottom line", "ex1_th": "เธอจะถกเถียงเรื่องความสวยงามของการออกแบบไปทั้งคืนก็ได้ แต่ประเด็นสำคัญที่สุดก็คือตู้เย็นใหม่เครื่องนี้ยกผ่านประตูห้องครัวเราเข้าไปไม่ได้", "ex2_en": "While corporate social responsibility initiatives build brand loyalty, executives emphasized that <span class=\"hl-teal\">the bottom line</span> remains financial solvency in a volatile market.", "ex2_hl": "the bottom line", "ex2_th": "แม้ว่าโครงการความรับผิดชอบต่อสังคมจะช่วยสร้างความภักดีต่อแบรนด์ แต่ผู้บริหารเน้นย้ำว่าสาระสำคัญที่สุดยังคงเป็นสถานะทางการเงินที่มั่นคงท่ามกลางตลาดที่ผันผวน", "slot_num": 246, "sheet_no": 3, "first_letter": "T"}, {"id": 736, "orig_slot": "Doc #250", "idiom": "The end is near", "meaning": "something is about to happen", "thai_idiom": "จุดจบใกล้เข้ามาแล้ว / ใกล้จะถึงจุดสิ้นสุด / ใกล้จะอวสาน", "thai_meaning": "บางสิ่งบางอย่างกำลังจะสิ้นสุดลงหรือมาถึงบทสรุปในไม่ช้า", "ex1_en": "After submitting our twelfth and final thesis chapter, my study partner sighed with relief and declared that <span class=\"hl-teal\">the end is near</span>.", "ex1_hl": "the end is near", "ex1_th": "หลังจากส่งวิทยานิพนธ์บทที่สิบสองซึ่งเป็นบทสุดท้าย เพื่อนร่วมกลุ่มทำวิจัยของฉันก็ถอนหายใจด้วยความโล่งอก และประกาศว่าความทรมานนี้ใกล้จะสิ้นสุดลงแล้ว", "ex2_en": "Dwindling cash reserves and consecutive quarters of subscriber loss signaled to Wall Street that <span class=\"hl-teal\">the end was near</span> for the legacy streaming platform.", "ex2_hl": "the end was near", "ex2_th": "เงินสดสำรองที่ลดน้อยถอยลงและการสูญเสียสมาชิกลงทุนติดต่อกันหลายไตรมาส เป็นสัญญาณบ่งชี้ให้ตลาดวอลล์สตรีทเห็นว่าจุดอวสานของแพลตฟอร์มสตรีมมิงรุ่นบุกเบิกนี้ใกล้เข้ามาทุกที", "slot_num": 250, "sheet_no": 3, "first_letter": "T"}, {"id": 737, "orig_slot": "Doc #252", "idiom": "The heart wants what it wants", "meaning": "you want what you desir", "thai_idiom": "หัวใจมันเรียกร้อง / ความรักไม่มีเหตุผล", "thai_meaning": "ความรู้สึกหรือความปรารถนาของหัวใจเป็นสิ่งที่ควบคุมไม่ได้และมักไม่ขึ้นกับเหตุผล", "ex1_en": "Her friends questioned why she chose to adopt an unruly stray terrier instead of a calm pedigree dog, but Elena simply smiled and said, '<span class=\"hl-teal\">The heart wants what it wants</span>.'", "ex1_hl": "The heart wants what it wants", "ex1_th": "เพื่อนๆ ต่างสงสัยว่าทำไมเธอถึงเลือกรับเลี้ยงสุนัขเทอร์เรียร์จรจัดสุดซนแทนที่จะเป็นสุนัขพันธุ์แท้ที่ว่านอนสอนง่าย แต่เอเลนาก็แค่ยิ้มแล้วตอบว่า 'หัวใจมันเรียกร้องนี่นา'", "ex2_en": "Biographers observing the prime minister's scandalous romantic choices concluded that even the most calculated statesmen succumb to the truth that <span class=\"hl-teal\">the heart wants what it wants</span>.", "ex2_hl": "the heart wants what it wants", "ex2_th": "เหล่านักเขียนชีวประวัติที่เฝ้าสังเกตเรื่องราวความรักอื้อฉาวของนายกรัฐมนตรีสรุปว่า แม้แต่นักรัฐศาสตร์ที่คิดคำนวณทุกย่างก้าวอย่างรอบคอบที่สุด ก็ยังต้องยอมจำนนต่อความจริงที่ว่าความรู้สึกของหัวใจเป็นสิ่งที่ไร้เหตุผล", "slot_num": 252, "sheet_no": 3, "first_letter": "T"}, {"id": 738, "orig_slot": "Doc #258", "idiom": "The sky’s the limit", "meaning": "there are no limits", "thai_idiom": "ไม่มีขีดจำกัด / โอกาสเปิดกว้างไร้ขีดจำกัด / ก้าวไปได้ไกลอย่างไร้พรมแดน", "thai_meaning": "ไม่มีขอบเขตหรือข้อจำกัดใดๆ ในสิ่งที่จะทำหรือความสำเร็จที่จะได้รับ มีโอกาสก้าวหน้าได้อย่างไร้ขีดจำกัด", "ex1_en": "With your natural culinary flair and work ethic, <span class=\"hl-teal\">the sky's the limit</span> once you open your own neighborhood bistro.", "ex1_hl": "the sky's the limit", "ex1_th": "ด้วยพรสวรรค์ด้านการทำอาหารและความทุ่มเททำงานหนักของเธอ อนาคตเปิดกว้างอย่างไร้ขีดจำกัดแน่นอนเมื่อเธอเปิดร้านอาหารของตัวเอง", "ex2_en": "Given the exponential growth in green technology investments, analysts believe <span class=\"hl-teal\">the sky's the limit</span> for the startup's next funding round.", "ex2_hl": "the sky's the limit", "ex2_th": "เมื่อพิจารณาจากการเติบโตแบบก้าวกระโดดของการลงทุนในเทคโนโลยีสีเขียว นักวิเคราะห์เชื่อว่าการระดมทุนรอบถัดไปของบริษัทสตาร์ตอัปนี้จะพุ่งทะยานอย่างไร้ขีดจำกัด", "slot_num": 258, "sheet_no": 3, "first_letter": "T"}, {"id": 739, "orig_slot": "Doc #264", "idiom": "This too shall pass", "meaning": "difficult time won't last", "thai_idiom": "แล้วมันก็จะผ่านไป / ทุกสิ่งย่อมมีวันสิ้นสุด / ปัญหานี้ไม่ได้คงอยู่ตลอดไป", "thai_meaning": "ความทุกข์ยากหรือช่วงเวลาที่เลวร้ายนั้นเป็นเพียงสิ่งชั่วคราว และท้ายที่สุดก็จะผ่านพ้นไป", "ex1_en": "Whenever exam stress overwhelmed me in college, my grandmother would gently remind me that <span class=\"hl-teal\">this too shall pass</span>.", "ex1_hl": "this too shall pass", "ex1_th": "เมื่อใดก็ตามที่ความเครียดจากการสอบรุมเร้าฉันสมัยมหาวิทยาลัย คุณยายมักจะปลอบประโลมอย่างอ่อนโยนว่า แล้วเรื่องพวกนี้มันก็จะผ่านพ้นไป", "ex2_en": "During the catastrophic market downturn of 2008, the veteran portfolio manager comforted anxious clients by emphasizing that <span class=\"hl-teal\">this too shall pass</span>.", "ex2_hl": "this too shall pass", "ex2_th": "ในช่วงวิกฤตเศรษฐกิจตกต่ำครั้งใหญ่ในปี 2008 ผู้จัดการพอร์ตการลงทุนมากประสบการณ์ได้ให้กำลังใจลูกค้าที่ตื่นตระหนก โดยเน้นย้ำว่าช่วงเวลาอันยากลำบากนี้ท้ายที่สุดก็จะผ่านพ้นไป", "slot_num": 264, "sheet_no": 3, "first_letter": "T"}, {"id": 740, "orig_slot": "Doc #266", "idiom": "Tighten your belt", "meaning": "spend less money", "thai_idiom": "รัดเข็มขัด / ประหยัดมัธยัสถ์", "thai_meaning": "ลดค่าใช้จ่าย ใช้จ่ายเงินอย่างประหยัดมากขึ้นในช่วงเวลาที่การเงินฝืดเคือง", "ex1_en": "Since my heating bills surged this winter, our family will have to <span class=\"hl-teal\">tighten our belts</span> and skip dining at fancy restaurants.", "ex1_hl": "tighten our belts", "ex1_th": "เนื่องจากค่าฮีตเตอร์พุ่งสูงขึ้นมากในฤดูหนาวนี้ ครอบครัวของเราจึงต้องรัดเข็มขัดและงดออกไปกินข้าวนอกบ้านตามร้านหรูๆ", "ex2_en": "Facing consecutive quarters of declining ad revenue, the media conglomerate instructed regional divisions to <span class=\"hl-teal\">tighten their belts</span> and halt non-essential hiring.", "ex2_hl": "tighten their belts", "ex2_th": "เมื่อต้องเผชิญกับรายได้ค่าโฆษณาที่ลดลงติดต่อกันหลายไตรมาส กลุ่มบริษัทสื่อยักษ์ใหญ่จึงสั่งการให้สาขาในแต่ละภูมิภาครัดเข็มขัด และระงับการจ้างงานในตำแหน่งที่ไม่จำเป็นเร่งด่วน", "slot_num": 266, "sheet_no": 3, "first_letter": "T"}, {"id": 741, "orig_slot": "Doc #269", "idiom": "To be or not to be", "meaning": "a question of choice", "thai_idiom": "จะอยู่หรือจะไป / ทางแยกแห่งการตัดสินใจ / สู้หรือถอย", "thai_meaning": "คำถามหรือทางเลือกสำคัญชี้เป็นชี้ตายที่ต้องตัดสินใจว่าจะทำหรือไม่ทำ จะคงอยู่หรือยอมแพ้", "ex1_en": "Standing in front of the packed auditorium with stage fright, Daniel whispered to himself that this was his '<span class=\"hl-teal\">to be or not to be</span>' moment.", "ex1_hl": "to be or not to be", "ex1_th": "ขณะยืนอยู่หน้าหอประชุมที่แน่นขนัดไปด้วยผู้คนด้วยความตื่นเวที แดเนียลกระซิบกับตัวเองว่านี่คือช่วงเวลาชี้ชะตาว่าจะสู้หรือจะถอยของเขาแล้ว", "ex2_en": "With insolvency looming on the horizon, the board confronted a stark '<span class=\"hl-teal\">to be or not to be</span>' dilemma regarding whether to file for Chapter 11 bankruptcy or accept an aggressive takeover bid.", "ex2_hl": "to be or not to be", "ex2_th": "เมื่อภาวะล้มละลายใกล้เข้ามาทุกขณะ คณะกรรมการบริหารจึงต้องเผชิญกับทางเลือกระหว่างความเป็นความตาย ว่าจะยื่นขอฟื้นฟูกิจการตามกฎหมายล้มละลาย หรือยอมรับข้อเสนอการเข้าครอบงำกิจการแบบไม่เป็นมิตร", "slot_num": 269, "sheet_no": 3, "first_letter": "T"}, {"id": 742, "orig_slot": "Doc #271", "idiom": "Follow suit", "meaning": "do the same as others", "thai_idiom": "ทำตามอย่าง / ทำตาม / เอาอย่าง", "thai_meaning": "ทำตามสิ่งที่มีคนอื่นริเริ่มทำไว้ก่อนหน้า ทำแบบเดียวกันตามธรรมเนียมหรือกระแสนิยม", "ex1_en": "When Jenny ordered a refreshing iced matcha latte, everyone else at our cafe table decided to <span class=\"hl-teal\">follow suit</span>.", "ex1_hl": "follow suit", "ex1_th": "พอเจนนี่สั่งมัทฉะลาเต้เย็นแสนสดชื่น ทุกคนที่โต๊ะคาเฟ่ของเราก็เลยตัดสินใจสั่งตามแบบเดียวกันหมด", "ex2_en": "After the industry pioneer abolished remote work flexibility, rival tech corporations quickly decided to <span class=\"hl-teal\">follow suit</span> by mandating four days in office.", "ex2_hl": "follow suit", "ex2_th": "หลังจากบริษัทผู้บุกเบิกในอุตสาหกรรมยกเลิกนโยบายการทำงานระยะไกล บริษัทเทคโนโลยีคู่แข่งก็รีบทำตามอย่างรวดเร็ว โดยกำหนดให้พนักงานเข้าสำนักงานสี่วันต่อสัปดาห์", "slot_num": 271, "sheet_no": 3, "first_letter": "F"}, {"id": 743, "orig_slot": "Doc #274", "idiom": "Have a finger in the pie", "meaning": "be involved in something", "thai_idiom": "มีเอี่ยวด้วย / สอดแทรกเข้าไปเกี่ยวข้อง / มีส่วนร่วมในผลประโยชน์", "thai_meaning": "มีส่วนเกี่ยวข้อง มีอิทธิพล หรือมีผลประโยชน์ร่วมในกิจการหรือแผนการหนึ่งๆ", "ex1_en": "Don't bother planning the neighborhood street fair without consulting Mrs. Higgins, because she insists on <span class=\"hl-teal\">having a finger in the pie</span>.", "ex1_hl": "having a finger in the pie", "ex1_th": "อย่าคิดจะจัดงานเทศกาลถนนคนเดินในชุมชนโดยไม่ปรึกษาคุณนายฮิกกินส์เชียวนะ เพราะเธอต้องขอมีเอี่ยวและเข้ามายุ่มย่ามด้วยทุกเรื่อง", "ex2_en": "Regulatory watchdogs scrutinized the influential senator after reports revealed he <span class=\"hl-teal\">had a finger in the pie</span> regarding several state infrastructure contracts.", "ex2_hl": "had a finger in the pie", "ex2_th": "หน่วยงานกำกับดูแลของรัฐเข้าตรวจสอบวุฒิสมาชิกผู้ทรงอิทธิพลรายนี้ หลังจากมีรายงานเปิดเผยว่าเขามีส่วนได้ส่วนเสียและมีเอี่ยวกับสัญญาโครงสร้างพื้นฐานของรัฐหลายโครงการ", "slot_num": 274, "sheet_no": 3, "first_letter": "H"}, {"id": 744, "orig_slot": "Doc #279", "idiom": "Lay down the law", "meaning": "give strict rules", "thai_idiom": "ออกกฎเหล็ก / วางอำนาจสั่งการ / ตั้งกฎอย่างเฉียบขาด", "thai_meaning": "ออกคำสั่งหรือกำหนดกฎระเบียบอย่างเข้มงวด เด็ดขาด และบังคับให้ทุกคนต้องปฏิบัติตามโดยไม่มีข้อโต้แย้ง", "ex1_en": "After finding the kitchen sink piled high with unwashed plates, Mom decided to <span class=\"hl-teal\">lay down the law</span> about household chores.", "ex1_hl": "lay down the law", "ex1_th": "หลังจากเห็นอ่างล้างจานเต็มไปด้วยจานชามสกปรกกองพะเนิน แม่ก็ตัดสินใจออกกฎเหล็กอย่างเด็ดขาดเกี่ยวกับการแบ่งเวรทำงานบ้าน", "ex2_en": "The newly hired compliance officer had to <span class=\"hl-teal\">lay down the law</span> regarding insider trading protocols after several unauthorized stock transactions were flagged.", "ex2_hl": "lay down the law", "ex2_th": "เจ้าหน้าที่กำกับการปฏิบัติตามกฎเกณฑ์คนใหม่ต้องตั้งกฎเหล็กอย่างเฉียบขาดเกี่ยวกับระเบียบการซื้อขายหลักทรัพย์โดยใช้ข้อมูลภายใน หลังตรวจพบธุรกรรมซื้อขายหุ้นที่ไม่ได้รับอนุญาตหลายรายการ", "slot_num": 279, "sheet_no": 3, "first_letter": "L"}, {"id": 745, "orig_slot": "Doc #284", "idiom": "Wrap things up", "meaning": "finish something", "thai_idiom": "ปิดจ็อบ / สรุปจบ / สะสางให้เสร็จ", "thai_meaning": "ทำบางสิ่งให้เสร็จสิ้นหรือสรุปขั้นตอนสุดท้ายเพื่อปิดงาน", "ex1_en": "It's getting late, so let's pack our study notes and <span class=\"hl-teal\">wrap things up</span> for tonight.", "ex1_hl": "wrap things up", "ex1_th": "ดึกมากแล้วล่ะ พวกเราเก็บสมุดจดแล้วปิดจ็อบการอ่านหนังสือสำหรับคืนนี้กันเถอะ", "ex2_en": "The project manager asked each department lead to submit their final budget forecasts so the committee could <span class=\"hl-teal\">wrap things up</span> before the fiscal year-end.", "ex2_hl": "wrap things up", "ex2_th": "ผู้จัดการโครงการขอให้หัวหน้าแต่ละแผนกส่งประมาณการงบประมาณรอบสุดท้าย เพื่อให้คณะกรรมการสามารถสรุปปิดงานได้ทันก่อนสิ้นปีงบประมาณ", "slot_num": 284, "sheet_no": 3, "first_letter": "W"}, {"id": 746, "orig_slot": "Doc #285", "idiom": "Top of the world", "meaning": "very happy", "thai_idiom": "มีความสุขล้นพ้น / สุขจนตัวลอย", "thai_meaning": "รู้สึกมีความสุข ภาคภูมิใจ หรือยินดีเป็นอย่างยิ่ง", "ex1_en": "After receiving the acceptance letter from her dream art school, Maya felt like she was on <span class=\"hl-teal\">top of the world</span>.", "ex1_hl": "top of the world", "ex1_th": "หลังจากได้รับจดหมายตอบรับจากโรงเรียนสอนศิลปะในฝัน มายาก็รู้สึกมีความสุ
